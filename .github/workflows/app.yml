# Costruisce l'app da installare sul telefono.
#
# Serve a una cosa sola: **provarla davvero**. L'SDK di Android pesa qualche
# giga e va installato, configurato e tenuto aggiornato; qui ce l'ha gia' la
# macchina di GitHub. Chi vuole provare l'app scarica il pacchetto da questa
# pagina e lo mette sul telefono, senza installarsi niente.
#
# Si accende a mano — Actions → «L'app da provare» → Run workflow — e a ogni
# versione marcata con un'etichetta.
name: L'app da provare

on:
  workflow_dispatch:
    inputs:
      centralino:
        description: >-
          Il centralino, per esempio wss://centralino.pippo.workers.dev.
          Lasciandolo vuoto l'app chiede l'indirizzo di casa la prima volta, e
          il centralino se lo fa dire dalla casa: funziona uguale, e' solo un
          passaggio in piu' per chi installa.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app

      # In *debug*, non in *release*, e non e' una svista: un pacchetto di
      # release va firmato con una chiave che deve restare in mano a una
      # persona sola, e finche' l'app non va sui negozi quella chiave non
      # esiste. Il pacchetto di debug si firma da solo e si installa uguale.
      - name: Il pacchetto
        run: flutter build apk --debug --dart-define=CENTRALINO="$CENTRALINO"
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}

      - uses: actions/upload-artifact@v4
        with:
          name: gdahome-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Il sito
        run: flutter build web --release --dart-define=CENTRALINO="$CENTRALINO"
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}
      - uses: actions/upload-artifact@v4
        with:
          name: gdahome-web
          path: app/build/web
          if-no-files-found: error
          retention-days: 30
