# Costruisce l'app da installare sul telefono.
#
# Serve a una cosa sola: **provarla davvero**. L'SDK di Android pesa qualche
# giga e va installato, configurato e tenuto aggiornato; qui ce l'ha gia' la
# macchina di GitHub. Chi vuole provare l'app scarica il pacchetto da questa
# pagina e lo mette sul telefono, senza installarsi niente.
#
# Si accende a mano — Actions → «L'app da provare» → Run workflow — e a ogni
# versione marcata con un'etichetta.
name: L'app da provare

on:
  workflow_dispatch:
    inputs:
      centralino:
        description: >-
          Solo per provarne un altro. Lasciandolo vuoto si usa quello scritto
          nel codice, che e' quello giusto quasi sempre.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    # Per attaccare il pacchetto a una release, e solo per quello: gli altri
    # lavori restano in sola lettura.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app

      # In *release*, ed e' quello che conta per chi lo prova: il pacchetto di
      # debug gira interpretato, con tutti i controlli accesi, ed era lui a
      # rendere l'app lenta e a scaldare il telefono. La chiave per firmarlo
      # e' quella di sviluppo che Flutter mette da se' nel progetto — sui
      # negozi non si va con quella, ma si installa uguale e va veloce.
      # Quale centralino finisce dentro il pacchetto, scritto dove si vede.
      #
      # Serve perche' un pacchetto senza centralino **sembra uguale** a uno che
      # ce l'ha: la differenza si scopre installandolo, quando l'app chiede un
      # indirizzo di casa che chi e' fuori non puo' usare. Un'ora persa cosi'
      # e' un'ora persa per niente.
      - name: Con quale centralino
        id: quale
        env:
          SCRITTO: ${{ inputs.centralino }}
        run: |
          if [ -n "$SCRITTO" ]; then
            quale="$SCRITTO"
            da="dalla casella qui sopra"
          else
            quale=$(node ../strumenti/centralino.mjs --dimmi | sed -n 's/^l.app:  *//p')
            da="dal codice"
          fi
          echo "quale=$quale" >> "$GITHUB_OUTPUT"
          if [ "$quale" = "(nessuno)" ] || [ -z "$quale" ]; then
            echo "::warning::Questo pacchetto non ha nessun centralino: da fuori casa non entrera'."
            echo "### ⚠️ Nessun centralino" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "L'app chiedera' l'indirizzo di casa, e da fuori quello non serve." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Centralino: \`$quale\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Preso $da. Con questo si abbina battendo solo il codice." >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: app

      # Con quale chiave si firma, e **quale** lo dice il riepilogo.
      #
      # Due chiavi, e la differenza conta. Quella di prova sta nel progetto e
      # non e' un segreto: firma i pacchetti che si passano a mano, e serve a
      # una cosa sola — che il pacchetto nuovo si installi **sopra** il vecchio
      # senza disinstallare, perche' disinstallare costa l'abbinamento. Quella
      # vera sta fuori da qui, in due segreti di GitHub, e non l'ha mai vista
      # nessuno tranne chi l'ha fatta.
      #
      # Se i segreti non ci sono si firma di prova e si va avanti: un lavoro
      # che si ferma perche' manca un segreto ferma anche chi voleva solo
      # provare l'app.
      - name: La chiave
        id: chiave
        working-directory: app
        env:
          CHIAVE: ${{ secrets.CHIAVE_ANDROID }}
          PAROLA: ${{ secrets.CHIAVE_ANDROID_PASSWORD }}
          # Un portachiavi ha **due** parole: una apre il portachiavi, l'altra
          # apre la chiave che c'e' dentro. `keytool` propone di farle uguali e
          # quasi sempre si fa cosi', ma chi ne batte una diversa al prompt
          # «(INVIO se corrisponde...)» si ritrova con due parole, ed e' un
          # caso normale. Se questo segreto non c'e', vale quella del
          # portachiavi.
          PAROLA_DELLA_CHIAVE: ${{ secrets.CHIAVE_ANDROID_KEY_PASSWORD }}
          COME_SI_CHIAMA: ${{ secrets.CHIAVE_ANDROID_ALIAS }}
        run: |
          if [ -z "$CHIAVE" ] || [ -z "$PAROLA" ]; then
            echo "vera=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Firmato con la chiave di prova"
              echo ""
              echo "Si installa e va veloce, e sopra un pacchetto firmato con la stessa"
              echo "chiave si aggiorna senza perdere l'abbinamento. Per i negozi, e per"
              echo "una release pubblica, serve la chiave vera: due segreti,"
              echo '`CHIAVE_ANDROID` (il portachiavi in base64) e'
              echo '`CHIAVE_ANDROID_PASSWORD`. Come si fa, in cinque minuti:'
              echo '`docs/LA_CHIAVE_ANDROID.md`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dove="$RUNNER_TEMP/chiave.jks"
          printf '%s' "$CHIAVE" | tr -d '[:space:]' | base64 -d > "$dove"
          come_si_chiama="${COME_SI_CHIAMA:-gdahome}"
          parola_della_chiave="${PAROLA_DELLA_CHIAVE:-$PAROLA}"

          # Qui si guarda **tutto quello che Gradle chiedera'**, e si guarda
          # adesso: il portachiavi, la chiave dentro, e le due parole che le
          # aprono. Se no il guasto salta fuori sei minuti dopo, dentro Gradle,
          # con un messaggio che parla d'altro.
          #
          # Tre controlli e non uno, perche' falliscono per tre ragioni
          # diverse e chi legge deve sapere quale:
          if ! keytool -list -keystore "$dove" -storepass "$PAROLA" > /dev/null 2>&1; then
            echo "::error::CHIAVE_ANDROID non e' un portachiavi, o CHIAVE_ANDROID_PASSWORD non lo apre."
            exit 1
          fi
          if ! keytool -list -keystore "$dove" -storepass "$PAROLA" -alias "$come_si_chiama" > /dev/null 2>&1; then
            echo "::error::nel portachiavi non c'e' nessuna chiave che si chiama «$come_si_chiama»."
            echo "::error::I nomi che ci sono si vedono cosi': keytool -list -keystore <il tuo .jks>"
            echo "::error::Se il tuo si chiama in un altro modo, mettilo nel segreto CHIAVE_ANDROID_ALIAS."
            exit 1
          fi
          # `-list` apre il portachiavi ma **non tocca la chiave**, e per
          # questo non si accorgeva del caso piu' comune: le due parole
          # diverse. `-certreq` la chiave la deve tirare fuori davvero, quindi
          # fallisce qui, in due secondi, invece che dentro Gradle.
          if ! keytool -certreq -keystore "$dove" -storepass "$PAROLA" \
            -alias "$come_si_chiama" -keypass "$parola_della_chiave" > /dev/null 2>&1; then
            echo "::error::la parola apre il portachiavi ma non apre la chiave «$come_si_chiama» (Cannot recover key)."
            echo "::error::Un portachiavi ha due parole. Se sono diverse, quella della chiave va"
            echo "::error::nel segreto CHIAVE_ANDROID_KEY_PASSWORD; per farle uguali:"
            echo "::error::  keytool -keypasswd -keystore <il tuo .jks> -alias $come_si_chiama"
            exit 1
          fi
          # Le quattro righe che legge Gradle. Il file sta fuori dalla
          # repository — `android/.gitignore` lo tiene fuori — e la macchina di
          # GitHub la si butta appena finito.
          {
            echo "storeFile=$dove"
            echo "storePassword=$PAROLA"
            echo "keyAlias=$come_si_chiama"
            echo "keyPassword=$parola_della_chiave"
          } > android/chiave.properties
          echo "vera=si" >> "$GITHUB_OUTPUT"
          {
            echo "### Firmato con la chiave vera"
            echo ""
            echo "Questo pacchetto si puo' pubblicare."
          } >> "$GITHUB_STEP_SUMMARY"

      # Il `--dart-define` si passa **solo se c'e' qualcosa da dire**.
      #
      # Passarlo vuoto non e' come non passarlo: definisce la chiave con la
      # stringa vuota, e il difetto scritto nel codice non entra piu' in gioco.
      # Il pacchetto esce senza centralino pur avendone uno, e il riquadro qui
      # sopra intanto dice quello giusto: due cose che si contraddicono, ed e'
      # il modo piu' rapido di far perdere un'ora a chi lo installa.
      - name: Il pacchetto
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}
          # Quale pacchetto e' questo, scritto **dentro** l'app.
          #
          # Due pacchetti diversi si somigliano troppo, e l'unico modo di
          # sapere quale si ha installato era disinstallare e rifare — che
          # costa l'abbinamento. Adesso c'e' scritto in fondo alla schermata.
          CORSA: ${{ github.run_number }}
        run: |
          # Su un'etichetta il numero e' quello del rilascio, e non «37-a0566bd»:
          # chi ha installato una release deve poter dire quale ha, con le stesse
          # parole con cui gliel'hanno data.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSIONE="${GITHUB_REF_NAME#v}"
          else
            VERSIONE="$CORSA-${GITHUB_SHA:0:7}"
          fi
          echo "Questo pacchetto e' il $VERSIONE"
          if [ -n "$CENTRALINO" ]; then
            flutter build apk --release --dart-define=VERSIONE="$VERSIONE" --dart-define=CENTRALINO="$CENTRALINO"
          else
            flutter build apk --release --dart-define=VERSIONE="$VERSIONE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gdahome-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Il pacchetto per il Play Store, che gli APK non li prende.
      #
      # Si costruisce **solo con la chiave vera**: un bundle firmato di prova
      # non si puo' caricare da nessuna parte, e costruirlo per niente sarebbe
      # tre minuti di corsa buttati a ogni giro. Non va nella release — quello
      # che si manda a una persona e' l'APK — ma resta fra gli artefatti, che
      # e' da dove lo si prende per caricarlo nel Play Console.
      - name: Il pacchetto per il negozio
        if: steps.chiave.outputs.vera == 'si'
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}
          CORSA: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSIONE="${GITHUB_REF_NAME#v}"
          else
            VERSIONE="$CORSA-${GITHUB_SHA:0:7}"
          fi
          if [ -n "$CENTRALINO" ]; then
            flutter build appbundle --release --dart-define=VERSIONE="$VERSIONE" --dart-define=CENTRALINO="$CENTRALINO"
          else
            flutter build appbundle --release --dart-define=VERSIONE="$VERSIONE"
          fi
          {
            echo "### Il pacchetto per il Play Store"
            echo ""
            echo "L'\`.aab\` e' fra gli artefatti di questa corsa. Come si carica:"
            echo "\`docs/GOOGLE_PLAY.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.chiave.outputs.vera == 'si'
        with:
          name: gdahome-android-negozio
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Il pacchetto dove chi lo deve installare lo trova.
      #
      # Da «Actions» lo scarica solo chi e' entrato in GitHub, e dopo trenta
      # giorni non c'e' piu'. Una **release** invece e' un indirizzo che si apre
      # dal telefono: si tocca il file e Android lo installa. E' quello che si
      # manda a qualcuno.
      #
      # **Solo firmato con la chiave vera.** Un pacchetto pubblico firmato con
      # la chiave di prova sarebbe un invito: quella chiave e la sua parola
      # stanno scritte nella repository, chiunque ne firmerebbe un altro, e il
      # telefono se lo prenderebbe come un aggiornamento di questo. Finche' la
      # chiave vera non c'e', il pacchetto resta fra gli artefatti — dove lo
      # prende chi sa cos'e'.
      - name: La release
        if: github.ref_type == 'tag' && steps.chiave.outputs.vera == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          quale="${GITHUB_REF_NAME#v}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "gdahome-$quale.apk"
          {
            echo "L'app di gdahome per Android, versione $quale."
            echo ""
            echo "Si scarica il file .apk dal telefono e si tocca. Android chiede il"
            echo "permesso di installare da qui: e' la stessa domanda che fa per"
            echo "qualunque app che non venga dal suo negozio."
            echo ""
            echo "Serve l'add-on **gdahome** dentro Home Assistant, e un codice di"
            echo "abbinamento fatto dalla sua scheda. Come si mette in piedi tutto:"
            echo "COME_PROVARLA.md."
            echo ""
            echo "---"
            echo ""
            echo "**Una cosa da sapere prima di installarlo.** Questo pacchetto e'"
            echo "firmato con la chiave di gdahome; quello del Play Store lo firma"
            echo "Google. Android non installa un pacchetto sopra uno con firma"
            echo "diversa: chi parte da qui, il giorno che gdahome sara' sul negozio,"
            echo "per passare di la' dovra' disinstallare e riabbinare il telefono."
            echo "Fra pacchetti di **questa** serie invece si aggiorna sopra, senza"
            echo "perdere niente."
          } > note.md
          gh release create "$GITHUB_REF_NAME" \
            --title "gdahome $quale" --notes-file note.md "gdahome-$quale.apk" ||
            gh release upload "$GITHUB_REF_NAME" "gdahome-$quale.apk" --clobber
          {
            echo "### Pubblicato"
            echo ""
            gh release view "$GITHUB_REF_NAME" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Niente release senza la chiave vera
        if: github.ref_type == 'tag' && steps.chiave.outputs.vera != 'si'
        run: |
          {
            echo "### Nessuna release"
            echo ""
            echo "Questo pacchetto e' firmato con la chiave di prova, e una release"
            echo "pubblica firmata cosi' non si fa: quella chiave sta nella repository."
            echo "Il pacchetto e' qui sopra, fra gli artefatti."
          } >> "$GITHUB_STEP_SUMMARY"

  iphone:
    name: iPhone (IPA)
    # Un'app per iPhone la puo' costruire **solo** un Mac, ed e' l'unica
    # ragione per cui questo lavoro gira su una macchina diversa dagli altri.
    # Su GitHub un Mac c'e', e non bisogna comprarlo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app

      # Primo passo, e vale da solo: **compila**.
      #
      # Senza firma non si installa da nessuna parte, ma se questo passo e'
      # verde vuol dire che l'app per iPhone c'e' davvero — i plugin nativi
      # stanno in piedi, i permessi sono scritti giusti, niente e' rimasto
      # indietro. E' la differenza fra «iOS lo faremo» e «iOS c'e', manca la
      # firma di Apple».
      # Il nome del pacchetto sta in ASCII, e non e' una scelta di stile.
      #
      # Era `29·abc1234`, col punto in mezzo. Su Linux passa; su un Mac quel
      # `--dart-define` non arriva nemmeno all'inizio della costruzione:
      # «Dart_NewStringFromUTF8 expects argument 'str' to be valid UTF-8», e
      # il lavoro finisce in mezzo secondo. Il punto era l'unico byte non
      # ASCII sulla riga di comando. Un trattino fa la stessa cosa in tutti e
      # tre i posti.
      - name: Compila (senza firma)
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}
          CORSA: ${{ github.run_number }}
        run: |
          VERSIONE="$CORSA-${GITHUB_SHA:0:7}"
          if [ -n "$CENTRALINO" ]; then
            flutter build ios --release --no-codesign --dart-define=VERSIONE="$VERSIONE" --dart-define=CENTRALINO="$CENTRALINO"
          else
            flutter build ios --release --no-codesign --dart-define=VERSIONE="$VERSIONE"
          fi

      # Da qui in giu' si va avanti solo se su GitHub ci sono le chiavi di
      # Apple. Non ci sono? Il lavoro finisce verde lo stesso, e sopra c'e'
      # scritto cosa manca: un lavoro rosso per una cosa che non e' rotta
      # insegna a non guardare i lavori rossi.
      - name: Ci sono le chiavi di Apple?
        id: chiavi
        env:
          CHIAVE: ${{ secrets.APPLE_CHIAVE_P8 }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          if [ -n "$CHIAVE" ] && [ -n "$SQUADRA" ]; then
            echo "ci-sono=si" >> "$GITHUB_OUTPUT"
          else
            echo "ci-sono=no" >> "$GITHUB_OUTPUT"
            {
              echo "### L'app per iPhone e' compilata, e non e' firmata"
              echo ""
              echo "Compila: i plugin nativi stanno in piedi e i permessi sono a posto."
              echo "Per installarla su un iPhone serve l'account sviluppatore Apple"
              echo "(99 €/anno) e quattro segreti su GitHub — come si prendono sta"
              echo "scritto in \`docs/IPHONE.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: L'archivio firmato
        if: steps.chiavi.outputs.ci-sono == 'si'
        working-directory: app
        env:
          CHIAVE: ${{ secrets.APPLE_CHIAVE_P8 }}
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          # La chiave dell'App Store Connect, su disco dove Xcode la cerca.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$CHIAVE" > ~/.appstoreconnect/private_keys/AuthKey_$CHIAVE_ID.p8
          # `-allowProvisioningUpdates` e' quello che evita di doversi
          # portare dietro certificato e profilo: con la chiave qui sopra,
          # Xcode se li fa dare da Apple e se li tiene lui. E' il solo modo
          # per chi non ha un Mac di firmare senza toccare un Mac.
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath build/gdahome.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$CHIAVE_ID.p8 \
            -authenticationKeyID "$CHIAVE_ID" \
            -authenticationKeyIssuerID "$EMITTENTE" \
            DEVELOPMENT_TEAM="$SQUADRA" CODE_SIGN_STYLE=Automatic

      - name: Il pacchetto, e su TestFlight
        if: steps.chiavi.outputs.ci-sono == 'si'
        working-directory: app
        env:
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          cat > build/esporta.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$SQUADRA</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/gdahome.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/esporta.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$CHIAVE_ID.p8 \
            -authenticationKeyID "$CHIAVE_ID" \
            -authenticationKeyIssuerID "$EMITTENTE"
          {
            echo "### Su TestFlight"
            echo ""
            echo "Fra qualche minuto arriva la notifica di Apple. Da TestFlight"
            echo "sul telefono si installa senza computer."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.chiavi.outputs.ci-sono == 'si'
        with:
          name: gdahome-iphone
          path: app/build/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Il sito
        working-directory: app
        env:
          CENTRALINO: ${{ inputs.centralino }}
          # Quale pacchetto e' questo, scritto **dentro** l'app.
          #
          # Due pacchetti diversi si somigliano troppo, e l'unico modo di
          # sapere quale si ha installato era disinstallare e rifare — che
          # costa l'abbinamento. Adesso c'e' scritto in fondo alla schermata.
          CORSA: ${{ github.run_number }}
        run: |
          # Senza il service worker di Flutter: il nostro vuole lo stesso
          # ambito — deve vedere passare `/dashboardmodern_static/`, che la
          # plancia chiama per indirizzo assoluto — e chi arriva secondo
          # scalza il primo. Quello di Flutter serve a far partire l'app senza
          # rete, e senza casa l'app non serve a niente.
          VERSIONE="$CORSA-${GITHUB_SHA:0:7}"
          if [ -n "$CENTRALINO" ]; then
            flutter build web --release --pwa-strategy=none --dart-define=VERSIONE="$VERSIONE" --dart-define=CENTRALINO="$CENTRALINO"
          else
            flutter build web --release --pwa-strategy=none --dart-define=VERSIONE="$VERSIONE"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gdahome-web
          path: app/build/web
          if-no-files-found: error
          retention-days: 30
