# Mette l'etichetta di una versione su un commit.
#
# Serve perche' senza non si fa nessuna release, e si e' visto: l'ultima
# pubblicata su GitHub era la **1.4.32.7**, mentre l'add-on e l'app erano
# arrivati alla 1.5.9. Quattordici versioni senza un indirizzo da dare a
# nessuno, non perche' qualcuno avesse deciso di non farle, ma perche'
# l'etichetta la si spingeva a mano dal proprio computer — e chi rilascia da
# una pagina di GitHub un computer con la chiave giusta non ce l'ha sempre.
#
# Da qui si preme un bottone. L'etichetta nasce sul commit che si vuole, e da
# li' in poi il giro e' quello di sempre: si lancia «L'app da provare» con
# quell'etichetta come riferimento, e quel workflow costruisce i pacchetti e
# scrive la release con le sue note.
#
# ─── Perche' non fa partire anche quello ─────────────────────────────────
#
# Perche' non partirebbe. Quello che un workflow spinge col gettone di serie
# **non accende altri workflow**: e' la regola che GitHub tiene per non far
# nascere catene che si mordono la coda, e vale anche per un'etichetta spinta
# da qui. Lanciare «L'app da provare» su quell'etichetta e' un secondo
# bottone, ed e' un bottone, non un giro a vuoto.
#
# ─── Un'etichetta non si riscrive ────────────────────────────────────────
#
# Se c'e' gia', qui ci si ferma. Il segno `tramite` si sposta — quello dice
# «la produzione sta qui adesso» — ma `v1.5.9.1` dice «la 1.5.9.1 e' questa»,
# e spostarlo vorrebbe dire che chi ha scaricato ieri e chi scarica oggi hanno
# in mano due cose diverse con lo stesso nome.
#
# ─── Quindi prima si prova il negozio ────────────────────────────────────
#
# Proprio perche' non si sposta: se il Play Console rifiuta il pacchetto —
# succede, e non per come e' costruito ma per cosa c'e' scritto nel manifesto
# — l'etichetta e' gia' spesa, e correggere vuol dire una versione nuova e
# tutto il giro da rifare. Dieci minuti prima costano molto meno: «L'app da
# provare» su `main`, con la pista nella casella `negozio` e
# `prova_del_negozio` spuntato, fa tutto il viaggio e poi butta la modifica.
# Quando quello e' verde, si viene qui. `app/negozio/LEGGIMI.md` lo racconta
# per intero, con la frase con cui Google ha rimandato indietro la 1.6.4.1.
name: L'etichetta

on:
  workflow_dispatch:
    inputs:
      nome:
        description: >-
          Come si chiama (per esempio v1.5.9.1). Vuoto: la prende da
          ponte/config.yaml, col v davanti.
        required: false
        default: ""
      commit:
        description: "Su quale commit (vuoto: l'ultimo di main)"
        required: false
        default: ""
      solo_le_note:
        description: >-
          Non mette nessuna etichetta: riscrive soltanto le note della release
          di un'etichetta che c'e' gia', prendendole dal CHANGELOG. Serve per
          le versioni rimaste senza release, e per rimediare a una release
          nata col testo sbagliato. Va scritto anche il nome qui sopra.
        type: boolean
        required: false
        default: false

# Di serie si legge e basta: scrive solo il lavoro che spinge l'etichetta.
permissions:
  contents: read

concurrency:
  group: l-etichetta
  cancel-in-progress: false

jobs:
  metti:
    name: Metti l'etichetta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Quale, e dove
        id: quale
        env:
          NOME: ${{ inputs.nome }}
          COMMIT: ${{ inputs.commit }}
          SOLO_LE_NOTE: ${{ inputs.solo_le_note }}
        run: |
          set -euo pipefail

          # Il commit: quello detto, o quello su cui gira questa corsa. Non si
          # chiede a `origin/main`, che dipende da cosa il checkout si e'
          # portato dietro; `HEAD` no.
          scelto="${COMMIT:-$(git rev-parse HEAD)}"
          # Niente trattini davanti: git li leggerebbe come opzioni.
          case "$scelto" in
            -*)
              echo "::error::quello scritto nella casella non e' un commit di questa repository."
              exit 1
              ;;
          esac
          git rev-parse --verify --end-of-options "$scelto^{commit}" >/dev/null || {
            echo "::error::quello scritto nella casella non e' un commit di questa repository."
            exit 1
          }
          sha="$(git rev-parse --verify --end-of-options "$scelto^{commit}")"

          # Il nome: quello detto, o quello che dice il manifesto **di quel
          # commit**. Leggerlo dal commit e non dal disco e' l'unica cosa che
          # tiene insieme l'etichetta e quello che c'e' dentro: etichettare un
          # commit vecchio col numero di oggi darebbe una 1.5.9.1 che dentro
          # e' un'altra cosa.
          nome="$NOME"
          if [ -z "$nome" ]; then
            versione="$(git show "$sha:ponte/config.yaml" | sed -n 's/^version: "\(.*\)"$/\1/p')"
            [ -n "$versione" ] || {
              echo "::error::in ponte/config.yaml di $sha non c'e' nessuna versione."
              exit 1
            }
            nome="v$versione"
          fi
          # Una v, e poi solo cifre, lettere, punti e trattini: e' un nome di
          # versione, e con questa forma resta un nome anche quando lo si
          # scrive in un comando o in un riepilogo.
          if ! printf '%s' "$nome" | grep -qE '^v[0-9][0-9A-Za-z.+-]{0,63}$'; then
            echo "::error::quello scritto non e' un'etichetta di versione: ci vuole la v davanti, e poi cifre, lettere, punti e trattini."
            exit 1
          fi

          # Le due strade si guardano la stessa cosa da due parti opposte:
          # mettere un'etichetta vuole che non ci sia, riscriverne le note
          # vuole che ci sia.
          if git rev-parse --verify "refs/tags/$nome" >/dev/null 2>&1; then
            if [ "$SOLO_LE_NOTE" != "true" ]; then
              echo "::error::«$nome» c'e' gia', e un'etichetta di versione non si sposta."
              echo "::error::Per rifarne solo le note, spunta «solo_le_note»."
              exit 1
            fi
            # Le note si riscrivono su quello che l'etichetta indica davvero,
            # non sull'ultimo commit di main: sono due cose diverse, e la
            # seconda direbbe una bugia.
            sha="$(git rev-parse --verify "refs/tags/$nome^{commit}")"
          elif [ "$SOLO_LE_NOTE" = "true" ]; then
            echo "::error::«$nome» non c'e': le note di un'etichetta che non esiste non si scrivono."
            exit 1
          fi

          echo "nome=$nome" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "corto=${sha:0:8}" >>"$GITHUB_OUTPUT"

      # I valori del passo prima arrivano come variabili, e mai scritti dentro
      # lo script: il titolo di un commit e' testo di chi l'ha scritto.
      - name: Mettila
        if: ${{ !inputs.solo_le_note }}
        env:
          NOME: ${{ steps.quale.outputs.nome }}
          SHA: ${{ steps.quale.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NOME" -m "gdahome $NOME" "$SHA"
          git push origin "refs/tags/$NOME"

      # La release nasce con l'etichetta, e non dopo.
      #
      # Prima la scriveva «L'app da provare» lanciata sull'etichetta, e cosi'
      # una release esisteva solo se qualcuno faceva anche quel giro: la
      # `v1.6.9` e la `v1.6.10` hanno l'etichetta e non hanno la release,
      # perche' quelle due corse erano state annullate. Ma «questa versione
      # esiste, ed ecco cosa cambia» e' esattamente quello che fa un'etichetta,
      # e non ha niente a che vedere col negozio.
      #
      # Le note le prende dal CHANGELOG **di quel commit**, non dal disco: una
      # release rifatta a distanza di giorni deve raccontare quello che c'era
      # dentro allora.
      - name: E le sue note
        env:
          GH_TOKEN: ${{ github.token }}
          NOME: ${{ steps.quale.outputs.nome }}
          SHA: ${{ steps.quale.outputs.sha }}
        run: |
          set -euo pipefail
          quale="${NOME#v}"
          # Solo il CHANGELOG torna indietro: il programma che lo legge resta
          # quello di adesso, e a un'etichetta vecchia — la `v1.6.9` — non
          # esisteva nemmeno.
          git checkout --quiet "$SHA" -- ponte/CHANGELOG.md
          node strumenti/le-note-della-versione.mjs "$quale" > note.md
          gh release create "$NOME" --title "gdahome $quale" --notes-file note.md ||
            gh release edit "$NOME" --title "gdahome $quale" --notes-file note.md
          {
            printf '## Le note di `%s`\n' "$NOME"
            echo ""
            gh release view "$NOME" --json url --jq .url
            echo ""
            echo '```'
            cat note.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cosa e' successo
        if: ${{ !inputs.solo_le_note }}
        env:
          NOME: ${{ steps.quale.outputs.nome }}
          SHA: ${{ steps.quale.outputs.sha }}
          CORTO: ${{ steps.quale.outputs.corto }}
        run: |
          titolo="$(git log -1 --format=%s "$SHA")"
          {
            printf '## `%s` e%s sulla `%s`\n' "$NOME" "'" "$CORTO"
            echo ""
            printf '> %s\n' "$titolo"
            echo ""
            echo "Adesso il secondo bottone: **Actions → «L'app da provare» → Run"
            echo "workflow**, e come riferimento si sceglie"
            printf '`%s` invece di `main`. Da li%s partono i\n' "$NOME" "'"
            echo "pacchetti e la release con le sue note."
            echo ""
            echo "Non parte da sola: quello che un workflow spinge col gettone di"
            echo "serie non accende altri workflow, ed e' una regola di GitHub, non"
            echo "una dimenticanza."
          } >>"$GITHUB_STEP_SUMMARY"
