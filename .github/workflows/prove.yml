name: Prove

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ponte:
    name: Il ponte e il centralino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Ne il ponte ne il centralino hanno dipendenze: le loro prove girano su
      # Node e basta.
      - name: Le prove del ponte
        run: npm run test:ponte
      - name: Le prove del centralino
        run: npm run test:centralino

  forma:
    name: La forma del codice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check

  app:
    name: L'app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Le dipendenze
        run: flutter pub get
        working-directory: app
      # `analyze` e' il controllo dei tipi, ed e' l'unica cosa che dica
      # qualcosa sulle schermate senza avere un telefono attaccato.
      - name: L'analisi
        run: flutter analyze
        working-directory: app
      - name: La forma del codice
        run: dart format --output=none --set-exit-if-changed .
        working-directory: app
      # `flutter test` prende dentro anche `test/integrazione/`, che accende il
      # ponte vero — `node ponte/src/index.js` — contro una Home Assistant
      # finta e ci fa passare il cliente vero dell'app. E' l'unico posto in
      # cui le due meta' vere si parlano: tutte le altre prove hanno un finto
      # in mezzo.
      - name: Le prove
        run: flutter test
        working-directory: app
