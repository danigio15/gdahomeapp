name: Prove

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ponte:
    name: Il ponte, il centralino e il quadro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Nessuno dei tre ha dipendenze: le loro prove girano su Node e basta.
      - name: Le prove del ponte
        run: npm run test:ponte
      - name: Le prove del centralino
        run: npm run test:centralino
      - name: Le prove del centralino sulla nuvola
        run: npm run test:nuvola
      # Il quadro qui dentro non ci girava, e `npm test` lo chiamava gia' — era
      # solo questo elenco a saltarlo. Centocinquanta prove che non guardava
      # nessuno, su un pezzo che si rilascia da solo: la macchina del quadro le
      # fa girare prima di installare, quindi una rotta non sarebbe mai andata
      # in produzione, ma si sarebbe scoperta **cosi'** — con la macchina che
      # resta indietro senza che nessuno sappia perche'.
      - name: Le prove del quadro
        run: npm run test:quadro

  # Le prove della plancia, che qui dentro non girava nessuno.
  #
  # Da quando DashboardModern vive in `officina/` le sue prove ci sono — piu' di
  # quattromila — ma le Prove non le chiamavano, e nove erano rosse da
  # settimane senza che nessuno lo sapesse. Otto per la cartella in cui sta
  # (`legacy/` e' un collegamento e Node carica dal posto vero) e una che
  # diceva una cosa vera e grossa: il pacchetto per HACS usciva **senza la
  # plancia**, perche' chi lo costruisce non entrava nei collegamenti.
  #
  # Una prova rossa che nessuno guarda e' peggio di una prova che non c'e':
  # da' l'idea che qualcosa sia coperto. Percio' adesso si chiamano qui.
  plancia:
    name: La plancia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Il pacchetto per HACS lo costruisce uno script Python, e due prove lo
      # costruiscono per davvero prima di guardarci dentro.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Le prove della plancia non hanno dipendenze: girano su Node e basta.
      - name: Le prove della plancia
        run: npm run test:frontend
        working-directory: officina
      - name: La sintassi dentro le pagine
        run: npm run check:inline-syntax
        working-directory: officina
      - name: Le parole, nelle due lingue
        run: npm run check:i18n
        working-directory: officina
      - name: Il guscio inglese
        run: npm run check:guscio
        working-directory: officina
      - name: I moduli, tutti raggiungibili
        run: npm run check:moduli
        working-directory: officina

  forma:
    name: La forma del codice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      # E la forma della plancia, che ha il suo elenco di file: prettier e'
      # quello di qui, installato una volta sola.
      - name: La forma della plancia
        run: npm run format:check
        working-directory: officina

  app:
    name: L'app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Le dipendenze
        run: flutter pub get
        working-directory: app
      # `analyze` e' il controllo dei tipi, ed e' l'unica cosa che dica
      # qualcosa sulle schermate senza avere un telefono attaccato.
      - name: L'analisi
        run: flutter analyze
        working-directory: app
      - name: La forma del codice
        run: dart format --output=none --set-exit-if-changed .
        working-directory: app
      # `flutter test` prende dentro anche `test/integrazione/`, che accende il
      # ponte vero — `node ponte/src/index.js` — contro una Home Assistant
      # finta e ci fa passare il cliente vero dell'app. E' l'unico posto in
      # cui le due meta' vere si parlano: tutte le altre prove hanno un finto
      # in mezzo.
      - name: Le prove
        run: flutter test
        working-directory: app
      # E le stesse prove della cifratura **dentro un browser**.
      #
      # Non e' zelo: Dart compilato in JavaScript non ha gli interi a
      # sessantaquattro bit, e il codice che li usava si e' rotto solo li'. Le
      # prove sulla macchina virtuale erano tutte verdi mentre la versione web
      # dell'app restava appesa a ogni messaggio, senza dire niente a nessuno.
      # E' una differenza che nessuna prova avrebbe visto senza girare
      # dall'altra parte.
      - name: La cifratura, dentro un browser
        run: flutter test --platform chrome test/ponte/cifra_test.dart
        working-directory: app
      # E il gzip, che nel browser lo apre il browser.
      #
      # Sulla macchina virtuale `DecompressionStream` non esiste, e la prova si
      # salta da se': girarla dall'altra parte e' l'unico modo di sapere che i
      # byte che manda il ponte qui si aprono davvero.
      - name: Il gzip, dentro un browser
        run: flutter test --platform chrome test/plancia/gzip_nel_browser_test.dart
        working-directory: app
