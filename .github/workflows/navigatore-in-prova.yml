# gdahome col navigatore in auto, da provare nel test interno di gdahome.
#
# E' gdahome — la plancia, il menu, la casa — con gdanav dentro come sezione,
# e in Android Auto parte dalla mappa del navigatore con la casa dietro un
# tasto (servizio di navigazione, non IOT), come ogni gdahome che si
# pubblica. Firmato con la chiave di prova (`com.gdahome.gdahome.prova`):
# la chiave vera resta ai rilasci, dietro l'environment `negozio`. Vedi
# `GDAHOME_NAVIGATORE` in `app/android/app/build.gradle.kts`.
#
# Gira solo sui rami `claude/**` e non pubblica niente, nemmeno su GitHub:
# costruisce per sapere che sta in piedi. L'app va solo nei negozi, da «L'app
# da provare».
name: Navigatore in prova

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigatore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacchetto:
    name: GdAHome col navigatore in auto, per il test interno
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # Sempre l'ultimo gdanav del ramo scritto in app/pubspec.yaml: lo
      # schermo e l'Android Auto di gdanav cambiano spesso, e il pacchetto da
      # provare deve avere quelli di adesso, non quelli del lucchetto.
      - run: flutter pub upgrade gdanav_app

      # La chiave di prova, sempre. Questo pacchetto non va da nessuna parte:
      # si costruisce per sapere che sta in piedi, e su GitHub non resta
      # niente. La chiave vera di gdahome serve solo a chi carica nei negozi
      # (app.yml, con l'environment `negozio`): qui, su ogni ramo di lavoro,
      # sarebbe soltanto un segreto in piu' esposto al codice di quel ramo.
      - name: La chiave
        id: chiave
        run: |
          echo "vera=no" >> "$GITHUB_OUTPUT"
          echo "GDAHOME_FIRMA_DI_PROVA=si" >> "$GITHUB_ENV"

      # Il numero che chiede il Play Store deve crescere sempre. Si parte da
      # quello della versione in pubspec (1.6.7 → 1060700) e si aggiunge il
      # numero di questa corsa: sta sopra la versione caricata, e sotto la
      # prossima (1.6.8 → 1060800) finche' le corse sono meno di cento.
      - name: Il numero
        id: numero
        run: |
          base=$(sed -n 's/^version: .*+\([0-9]*\).*/\1/p' pubspec.yaml)
          numero=$((base + GITHUB_RUN_NUMBER))
          if [ "$GITHUB_RUN_NUMBER" -ge 100 ]; then
            echo "::warning::Cento corse: il numero $numero raggiunge quello della prossima versione. Alza la versione in pubspec.yaml."
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "Versione in pubspec: $base. Questo pacchetto: $numero."

      - name: I pacchetti
        env:
          GDAHOME_NAVIGATORE: si
          NUMERO: ${{ steps.numero.outputs.numero }}
          CORSA: ${{ github.run_number }}
          # Le chiavi facoltative di gdanav (traffico TomTom, Open Charge
          # Map), se questa repository le ha fra i segreti con lo stesso nome.
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
          HERE: ${{ secrets.GDANAV_HERE_CHIAVE }}
          VERA: ${{ steps.chiave.outputs.vera }}
        run: |
          VERSIONE="navigatore-$CORSA-${GITHUB_SHA:0:7}"
          comuni=(--release --build-number="$NUMERO" --dart-define=VERSIONE="$VERSIONE"
            --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM" --dart-define=GDANAV_OCM_CHIAVE="$OCM" --dart-define=GDANAV_HERE_CHIAVE="$HERE")
          if [ -z "$HERE" ]; then echo "::warning::Manca il segreto GDANAV_HERE_CHIAVE: la ricerca esce senza HERE."; fi
          flutter build appbundle "${comuni[@]}"
          flutter build apk "${comuni[@]}"
          {
            echo "### GdAHome col navigatore in auto"
            echo ""
            echo "Costruito (numero $NUMERO, chiave vera: $VERA). Su GitHub non resta niente: l'app va solo nei negozi."
          } >> "$GITHUB_STEP_SUMMARY"
