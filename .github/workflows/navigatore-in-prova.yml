# gdahome col navigatore in auto, da provare nel test interno di gdahome.
#
# E' gdahome — la plancia, il menu, la casa — con gdanav dentro come sezione,
# e in Android Auto parte dalla mappa del navigatore con la casa dietro un
# tasto (servizio di navigazione, non IOT), come ogni gdahome che si
# pubblica. Stesso nome (`com.gdahome.gdahome`) e stessa chiave vera: e' il
# pacchetto di un ramo di lavoro, da caricare nel test interno. Vedi
# `GDAHOME_NAVIGATORE` in `app/android/app/build.gradle.kts`.
#
# Gira solo sui rami `claude/**`, e da solo non pubblica niente: l'AAB e l'APK
# restano fra gli artefatti della corsa.
name: Navigatore in prova

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigatore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacchetto:
    name: gdahome col navigatore in auto, per il test interno
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # Sempre l'ultimo gdanav del ramo scritto in app/pubspec.yaml: lo
      # schermo e l'Android Auto di gdanav cambiano spesso, e il pacchetto da
      # provare deve avere quelli di adesso, non quelli del lucchetto.
      - run: flutter pub upgrade gdanav_app

      # La chiave vera di gdahome, dagli stessi segreti dei rilasci (app.yml).
      # Senza, il pacchetto si firma di prova e si chiama
      # `com.gdahome.gdahome.prova`: si installa, ma nel Play Console non si
      # carica.
      - name: La chiave
        id: chiave
        env:
          CHIAVE: ${{ secrets.CHIAVE_ANDROID }}
          PAROLA: ${{ secrets.CHIAVE_ANDROID_PASSWORD }}
          PAROLA_DELLA_CHIAVE: ${{ secrets.CHIAVE_ANDROID_KEY_PASSWORD }}
          COME_SI_CHIAMA: ${{ secrets.CHIAVE_ANDROID_ALIAS }}
        run: |
          if [ -z "$CHIAVE" ] || [ -z "$PAROLA" ]; then
            echo "vera=no" >> "$GITHUB_OUTPUT"
            echo "GDAHOME_FIRMA_DI_PROVA=si" >> "$GITHUB_ENV"
            echo "::warning::Mancano i segreti della chiave vera: pacchetto firmato di prova (com.gdahome.gdahome.prova), non caricabile nel Play Console."
            exit 0
          fi
          dove="$RUNNER_TEMP/chiave.jks"
          printf '%s' "$CHIAVE" | tr -d '[:space:]' | base64 -d > "$dove"
          {
            echo "storeFile=$dove"
            echo "storePassword=$PAROLA"
            echo "keyAlias=${COME_SI_CHIAMA:-gdahome}"
            echo "keyPassword=${PAROLA_DELLA_CHIAVE:-$PAROLA}"
          } > android/chiave.properties
          echo "vera=si" >> "$GITHUB_OUTPUT"

      # Il numero che chiede il Play Store deve crescere sempre. Si parte da
      # quello della versione in pubspec (1.6.7 → 1060700) e si aggiunge il
      # numero di questa corsa: sta sopra la versione caricata, e sotto la
      # prossima (1.6.8 → 1060800) finche' le corse sono meno di cento.
      - name: Il numero
        id: numero
        run: |
          base=$(sed -n 's/^version: .*+\([0-9]*\).*/\1/p' pubspec.yaml)
          numero=$((base + GITHUB_RUN_NUMBER))
          if [ "$GITHUB_RUN_NUMBER" -ge 100 ]; then
            echo "::warning::Cento corse: il numero $numero raggiunge quello della prossima versione. Alza la versione in pubspec.yaml."
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "Versione in pubspec: $base. Questo pacchetto: $numero."

      - name: I pacchetti
        env:
          GDAHOME_NAVIGATORE: si
          NUMERO: ${{ steps.numero.outputs.numero }}
          CORSA: ${{ github.run_number }}
          # Le chiavi facoltative di gdanav (traffico TomTom, Open Charge
          # Map), se questa repository le ha fra i segreti con lo stesso nome.
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
          VERA: ${{ steps.chiave.outputs.vera }}
        run: |
          VERSIONE="navigatore-$CORSA-${GITHUB_SHA:0:7}"
          comuni=(--release --build-number="$NUMERO" --dart-define=VERSIONE="$VERSIONE"
            --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM" --dart-define=GDANAV_OCM_CHIAVE="$OCM")
          flutter build appbundle "${comuni[@]}"
          cp build/app/outputs/bundle/release/app-release.aab ../gdahome-navigatore.aab
          flutter build apk "${comuni[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk ../gdahome-navigatore.apk
          {
            echo "### gdahome col navigatore in auto"
            echo ""
            if [ "$VERA" = "si" ]; then
              echo "- \`gdahome-navigatore.aab\`: da caricare nel Play Console di **gdahome**, test interno (numero $NUMERO)."
              echo "- \`gdahome-navigatore.apk\`: da installare a mano, sopra la gdahome di sempre."
            else
              echo "Firmato **di prova** (mancano i segreti della chiave vera): com.gdahome.gdahome.prova, da installare a mano; nel Play Console non si carica."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gdahome-navigatore
          path: |
            gdahome-navigatore.aab
            gdahome-navigatore.apk
          if-no-files-found: error
          retention-days: 30
