# Le risposte vere delle fonti dello sport (calcio, F1, MotoGP), per scrivere
# la sezione Sport su dati come sono davvero.
#
# Da qui la sessione di lavoro non raggiunge quei server; GitHub si'. Gira
# solo sui branch di lavoro e solo quando cambia lo scaricatore, e rimette le
# risposte nel branch. Non costruisce app e non pubblica niente.
name: I campioni dello sport
on:
  push:
    branches:
      - "claude/**"
    paths:
      - "strumenti/sport-campioni/scarica.mjs"
permissions:
  contents: write
jobs:
  campioni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Le risposte
        run: node strumenti/sport-campioni/scarica.mjs
      - name: Nel branch
        run: |
          git config user.name "gdahome-foto"
          git config user.email "gdahome-foto@users.noreply.github.com"
          git add strumenti/sport-campioni/campioni strumenti/sport-campioni/loghi strumenti/sport-campioni/scuderie
          git commit -m "Campioni dello sport" || exit 0
          git push
