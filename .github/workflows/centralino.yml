# Accende il centralino su Cloudflare.
#
# Serve a non dover installare niente sul proprio computer: il centralino si
# mette in piedi da questa pagina, con un bottone. Ci vuole una cosa sola, una
# volta sola — un gettone di Cloudflare messo fra i segreti di questa
# repository, come `CLOUDFLARE_API_TOKEN`.
#
# Come si fa il gettone: su dash.cloudflare.com, in fondo al menu a sinistra,
# «Manage Account → Account API Tokens → Create Token», e si sceglie il modello
# gia' pronto **Edit Cloudflare Workers**.
name: Il centralino

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accendi:
    name: Accendi il centralino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Il gettone si guarda **prima** di provare a usarlo.
      #
      # Se e' storto, Cloudflare risponde «Invalid format for Authorization
      # header [code: 6111]», che e' vero e non serve a niente: chi lo legge
      # non ha modo di sapere che il problema e' uno spazio incollato per
      # sbaglio. Qui invece si dice cosa c'e' che non va, senza mai stampare
      # il gettone.
      - name: C'e' il gettone, ed e' fatto bene?
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Si mette in Settings → Secrets and variables → Actions → New repository secret."
            echo "Il gettone si fa su dash.cloudflare.com → Manage Account → Account API Tokens,"
            echo "col modello gia' pronto «Edit Cloudflare Workers»."
            exit 1
          fi

          quanto=${#CLOUDFLARE_API_TOKEN}

          # Un gettone di Cloudflare e' una riga sola di lettere, numeri,
          # trattini e trattini bassi. Nient'altro.
          if ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::Il gettone contiene qualcosa che non ci va (uno spazio, un a capo, delle virgolette, o del testo intorno)."
            echo "Nel segreto va **solo** la stringa del token, niente altro:"
            echo "  * non «Bearer …»"
            echo "  * non il comando curl che Cloudflare mostra sotto"
            echo "  * non la chiave segreta o l'endpoint (quelli sono di R2, e non servono)"
            echo "Lungo $quanto caratteri; ne bastano una quarantina, tutti attaccati."
            exit 1
          fi

          if [ "$quanto" -lt 30 ]; then
            echo "::error::Il gettone e' troppo corto ($quanto caratteri): ne servono una quarantina."
            echo "Forse e' stato copiato a meta'."
            exit 1
          fi

          echo "Il gettone c'e' ed e' fatto bene ($quanto caratteri)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npm ci --no-audit --no-fund
        working-directory: nuvola

      - name: Accendi
        run: npx wrangler deploy
        working-directory: nuvola
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Serve solo se sul gettone c'e' piu' di un account. Se ce n'e' uno
          # solo, wrangler lo trova da se' e questo puo' restare vuoto.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: E adesso
        run: |
          echo "### Il centralino è acceso" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "L'indirizzo è scritto qui sopra, nel passo «Accendi»: è la riga che" >> "$GITHUB_STEP_SUMMARY"
          echo 'finisce per `.workers.dev`.' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Va messo in due posti, **con \`wss://\` davanti invece di \`https://\`**:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. in Home Assistant, nella configurazione dell'add-on **Il ponte**, alla voce \`centralino\`;" >> "$GITHUB_STEP_SUMMARY"
          echo "2. qui su Actions, in **L'app da provare**, nella casella **centralino**, prima di costruire il pacchetto." >> "$GITHUB_STEP_SUMMARY"
