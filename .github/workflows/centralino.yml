# Accende il centralino su Cloudflare.
#
# Serve a non dover installare niente sul proprio computer: il centralino si
# mette in piedi da questa pagina, con un bottone. Ci vuole una cosa sola, una
# volta sola — un gettone di Cloudflare messo fra i segreti di questa
# repository, come `CLOUDFLARE_API_TOKEN`.
#
# Come si fa il gettone: su dash.cloudflare.com, in fondo al menu a sinistra,
# «Manage Account → Account API Tokens → Create Token», e si sceglie il modello
# gia' pronto **Edit Cloudflare Workers**.
#
# Un secondo gettone, facoltativo, accende le **segnalazioni**: quello con cui
# il centralino apre le issue su GitHub. Si mette fra i segreti di questa
# repository come `GETTONE_SEGNALAZIONI` (GitHub non lascia chiamare un
# segreto con `GITHUB_` davanti), e questo bottone lo porta al worker come
# `GITHUB_SEGNALAZIONI`. Senza, il centralino si accende lo stesso.
name: Il centralino

on:
  workflow_dispatch:
  # E da se', quando cambia quello che serve.
  #
  # Questa corsa era **solo a mano**, e per sei giorni nessuno l'ha lanciata:
  # «gdahome dentro l'add-on» ha portato la build fresca in `ponte/app/` oggi
  # alle 06:40, e il centralino serviva ancora quella dell'11 settembre. Chi
  # apriva gdahome da browser si trovava un'app di sei giorni prima — senza la
  # voce «Aggiornamenti», per dirne una — e non c'era modo di accorgersene:
  # l'app dentro l'add-on era fresca, quella su internet no.
  #
  # Una cosa che va rifatta ogni volta che ne cambia un'altra non si lascia a
  # mano. `ponte/app/**` la riscrive il bottone che porta l'app dentro
  # l'add-on, e da li' arriva anche qui; `nuvola/**` e' il centralino stesso.
  push:
    branches: [main]
    paths:
      - "nuvola/**"
      - "ponte/app/**"
      - ".github/workflows/centralino.yml"

permissions:
  contents: read

jobs:
  accendi:
    name: Accendi il centralino
    runs-on: ubuntu-latest
    # Pubblica in produzione: passa dall'ambiente `produzione`, che il
    # proprietario protegge nelle impostazioni della repository.
    environment: produzione
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # Il gettone si guarda **prima** di provare a usarlo.
      #
      # Se e' storto, Cloudflare risponde «Invalid format for Authorization
      # header [code: 6111]», che e' vero e non serve a niente: chi lo legge
      # non ha modo di sapere che il problema e' uno spazio incollato per
      # sbaglio. Qui invece si dice cosa c'e' che non va, senza mai stampare
      # il gettone.
      - name: C'e' il gettone, ed e' fatto bene?
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Si mette in Settings → Secrets and variables → Actions → New repository secret."
            echo "Il gettone si fa su dash.cloudflare.com → Manage Account → Account API Tokens,"
            echo "col modello gia' pronto «Edit Cloudflare Workers»."
            exit 1
          fi

          quanto=${#CLOUDFLARE_API_TOKEN}

          # Un gettone di Cloudflare e' una riga sola di lettere, numeri,
          # trattini e trattini bassi. Nient'altro.
          if ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::Il gettone contiene qualcosa che non ci va (uno spazio, un a capo, delle virgolette, o del testo intorno)."
            echo "Nel segreto va **solo** la stringa del token, niente altro:"
            echo "  * non «Bearer …»"
            echo "  * non il comando curl che Cloudflare mostra sotto"
            echo "  * non la chiave segreta o l'endpoint (quelli sono di R2, e non servono)"
            echo "Lungo $quanto caratteri; ne bastano una quarantina, tutti attaccati."
            exit 1
          fi

          if [ "$quanto" -lt 30 ]; then
            echo "::error::Il gettone e' troppo corto ($quanto caratteri): ne servono una quarantina."
            echo "Forse e' stato copiato a meta'."
            exit 1
          fi

          echo "Il gettone c'e' ed e' fatto bene ($quanto caratteri)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npm ci --no-audit --no-fund
        working-directory: nuvola

      # gdahome da aprire in un browser, servita dal centralino.
      #
      # Non si ricostruisce niente: si copia quella che sta gia' dentro
      # l'add-on (`ponte/app`), messa li' dal bottone «gdahome dentro
      # l'add-on». Una sola app costruita, in due posti — se se ne
      # costruisse un'altra qui, prima o poi le due sarebbero diverse e
      # nessuno saprebbe quale.
      - name: Porta gdahome accanto al centralino
        run: |
          set -eu
          rm -rf nuvola/pubblico && mkdir -p nuvola/pubblico
          if [ -d ponte/app ] && [ -f ponte/app/index.html ]; then
            cp -r ponte/app nuvola/pubblico/app
            quanti=$(find nuvola/pubblico/app -type f | wc -l)
            echo "gdahome: $quanti file, serviti da /app/"
            echo "GDAHOME=si" >> "$GITHUB_ENV"
            # Le intestazioni dell'app, le stesse che mette Caddy sul tramite:
            # nessuna pagina di un altro sito la incornicia o le tiene la
            # maniglia della finestra, e l'indirizzo non esce nei referer.
            printf '%s\n' \
              '/app/*' \
              '  X-Content-Type-Options: nosniff' \
              "  Content-Security-Policy: frame-ancestors 'none'" \
              '  X-Frame-Options: DENY' \
              '  Cross-Origin-Opener-Policy: same-origin' \
              '  Referrer-Policy: no-referrer' \
              > nuvola/pubblico/_headers
          else
            # Senza app il centralino si accende lo stesso: fa il suo mestiere,
            # che e' instradare. Il link nel browser semplicemente non c'e'.
            echo "::warning::in ponte/app non c'e' nessuna app costruita: il centralino si accende senza il link per il browser. Lancia «gdahome dentro l'add-on» e poi questo."
            echo "GDAHOME=no" >> "$GITHUB_ENV"
          fi

      - name: Accendi
        run: npx wrangler deploy
        working-directory: nuvola
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Serve solo se sul gettone c'e' piu' di un account. Se ce n'e' uno
          # solo, wrangler lo trova da se' e questo puo' restare vuoto.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Il gettone delle segnalazioni, se c'e'. Va dopo «Accendi»: un segreto si
      # puo' dare solo a un worker che esiste gia'. Wrangler lo legge da qui
      # e non lo scrive da nessuna parte; nei registri di questa pagina GitHub
      # lo copre da se'.
      #
      # **Questo passo non fa rossa la corsa**, e prima la faceva. Le
      # segnalazioni sono un'aggiunta — senza gettone il centralino si accende
      # lo stesso e risponde «non configurate» — e qui il centralino e' **gia'
      # acceso**: il passo prima ha finito. Una corsa rossa a questo punto
      # dice «il centralino non e' andato», che non e' vero; e a un rosso che
      # non vuol dire quello che sembra, dopo un po', non ci si guarda piu'.
      # Quello che c'e' da sapere si dice come avviso, e si va avanti.
      #
      # E c'e' un caso in cui questo gettone non serve a niente: chi ha il
      # tramite sulla **propria macchina** — un dominio suo, il servizio
      # `tramite` — le segnalazioni le fa passare da li', e il gettone sta in
      # `/etc/tramite/ambiente`, non fra i segreti di questa pagina. Questo e'
      # il centralino di riserva: quello che non costa niente e non chiede una
      # macchina.
      - name: Il gettone delle segnalazioni al centralino
        run: |
          if [ -z "${GETTONE}" ]; then
            echo "Nessun gettone delle segnalazioni: il centralino si accende lo stesso,"
            echo "e alle segnalazioni risponde «non configurate»."
            echo "Per accenderle: Settings → Secrets and variables → Actions → New repository secret,"
            echo "nome GETTONE_SEGNALAZIONI, dentro il token a grana fine di GitHub; poi si rilancia questo bottone."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Le **segnalazioni** non sono accese: manca il segreto \`GETTONE_SEGNALAZIONI\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Gli spazi e gli a capo intorno — o in mezzo: un token incollato da
          # un telefono puo' arrivare spezzato su due righe — non fanno parte
          # del token, che e' una riga sola. Si tolgono e basta. Le virgolette
          # pure.
          gettone=$(printf '%s' "$GETTONE" | tr -d '[:space:]"'"'"'')
          repository=$(sed -n 's/^GITHUB_REPO *= *"\(.*\)"/\1/p' wrangler.toml)
          # E dove vanno le foto: puo' essere un'altra repository, e il
          # permesso sui file va provato **su quella**. Vuota vuol dire «la
          # stessa delle issue».
          allegati=$(sed -n 's/^GITHUB_REPO_ALLEGATI *= *"\(.*\)"/\1/p' wrangler.toml)
          [ -n "$allegati" ] || allegati="$repository"

          # Il gettone si prova **davvero**, presso GitHub, sulla repository
          # delle segnalazioni: e' l'unico controllo che conta, e dice anche se
          # al token manca il permesso sulle issue o l'accesso alla repository.
          prova() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repository}/issues?per_page=1&state=all" || true
          }
          esito=$(prova "$gettone")

          # Un token a grana fine e' «github_pat_» piu' 82 caratteri, e nel
          # copiarlo da un telefono capita di prendere solo la seconda parte.
          # Se e' cosi', si rimette la prima e si riprova.
          if [ "$esito" != "200" ] && printf '%s' "$gettone" | grep -qE '^[A-Za-z0-9]{22}_[A-Za-z0-9]{59}$'; then
            if [ "$(prova "github_pat_${gettone}")" = "200" ]; then
              echo "Il gettone era senza «github_pat_» davanti: rimesso."
              gettone="github_pat_${gettone}"
              esito=200
            fi
          fi

          case "$esito" in
            200)
              echo "GitHub riconosce il gettone, e gli lascia leggere le issue di ${repository}."
              # E i file? Gli allegati — foto e video — vogliono «Contents:
              # Read and write», e adesso su **un'altra** repository: le issue
              # stanno nel progetto, i file no, perche' li' si committano e
              # resterebbero per sempre dentro quello che Home Assistant clona
              # per installare l'add-on. Non e' un motivo per fermarsi: le
              # segnalazioni vanno lo stesso, e l'app dice che l'allegato no.
              permessi=$(curl -sS \
                -H "Authorization: Bearer $gettone" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${allegati}" || true)
              if printf '%s' "$permessi" | grep -qE '"push": *true'; then
                echo "E puo' scrivere i file di ${allegati}: gli allegati funzioneranno."
              else
                echo "::warning::Il gettone non puo' scrivere i file di ${allegati}: le segnalazioni funzionano, ma le foto e i video allegati no. Nel token, «Repository access» deve includere anche ${allegati} con «Contents: Read and write»; poi rimetti il segreto e rilancia questo bottone."
              fi ;;
            401)
              echo "::warning::GitHub non riconosce il gettone (401): non e' un token valido, o e' scaduto, o e' stato revocato."
              echo "Nel segreto c'e' una stringa di ${#gettone} caratteri che $(case "$gettone" in github_pat_*) echo "comincia con github_pat_";; ghp_*) echo "comincia con ghp_";; *) echo "NON comincia con github_pat_";; esac)."
              echo "Un token a grana fine e' lungo 93 caratteri e comincia con github_pat_. Se ne fa uno nuovo su GitHub"
              echo "(Settings → Developer settings → Personal access tokens → Fine-grained tokens), si copia col bottone accanto,"
              echo "e si incolla nel segreto GETTONE_SEGNALAZIONI. Solo quello."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Le **segnalazioni** non sono accese: il gettone non va. Il motivo e' scritto negli avvisi di questa corsa." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            403)
              echo "::warning::GitHub non lascia il gettone toccare le issue di ${repository} (403)."
              echo "Di solito vuol dire che nel token, sotto «Repository permissions», la voce Issues non e' «Read and write»."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Le **segnalazioni** non sono accese: il gettone non va. Il motivo e' scritto negli avvisi di questa corsa." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            404)
              echo "::warning::Il gettone non vede la repository ${repository} (404)."
              echo "Nel token, «Repository access» deve includere proprio quella repository; e il nome in nuvola/wrangler.toml deve essere quello giusto."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Le **segnalazioni** non sono accese: il gettone non va. Il motivo e' scritto negli avvisi di questa corsa." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            *)
              echo "::warning::GitHub ha risposto «${esito}» provando il gettone su ${repository}. Si riprova fra un po'; se continua, il token va rifatto."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Le **segnalazioni** non sono accese: il gettone non va. Il motivo e' scritto negli avvisi di questa corsa." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac

          printf '%s\n' "$gettone" | npx wrangler secret put GITHUB_SEGNALAZIONI
          echo "Il gettone delle segnalazioni è al centralino: le issue si aprono in ${repository}, gli allegati in ${allegati}."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Le **segnalazioni** sono accese: le issue si aprono in \`${repository}\`, le foto e i video in \`${allegati}\`." >> "$GITHUB_STEP_SUMMARY"
        working-directory: nuvola
        env:
          GETTONE: ${{ secrets.GETTONE_SEGNALAZIONI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: E adesso
        run: |
          echo "### Il centralino è acceso" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "L'indirizzo è scritto qui sopra, nel passo «Accendi»: è la riga che" >> "$GITHUB_STEP_SUMMARY"
          echo 'finisce per `.workers.dev`.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${GDAHOME:-no}" = "si" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**gdahome si apre lì**: quello stesso indirizzo, con \`https://\` davanti," >> "$GITHUB_STEP_SUMMARY"
            echo "è il link da aprire in un browser — da qualsiasi rete, anche fuori casa." >> "$GITHUB_STEP_SUMMARY"
            echo "Chi lo apre trova «Colleghiamo la casa»: per entrare serve un codice di" >> "$GITHUB_STEP_SUMMARY"
            echo "abbinamento, fabbricato dalla console dell'add-on. Il link è uguale per" >> "$GITHUB_STEP_SUMMARY"
            echo "tutti — è l'indirizzo dell'app, non della casa." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Va messo in due posti, **con \`wss://\` davanti invece di \`https://\`**:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. in Home Assistant, nella configurazione dell'add-on **Il ponte**, alla voce \`centralino\`;" >> "$GITHUB_STEP_SUMMARY"
          echo "2. qui su Actions, in **L'app da provare**, nella casella **centralino**, prima di costruire il pacchetto." >> "$GITHUB_STEP_SUMMARY"
