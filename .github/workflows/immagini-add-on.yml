name: Le immagini dell'add-on

# «Quando si installa la percentuale non avanza, resta sempre a zero e poi
# diventa aggiornato.» Senza `image:` nel manifesto, Home Assistant costruisce
# l'add-on in casa dal Dockerfile, e una costruzione non ha una percentuale:
# resta a 0% finche' non ha finito. Con l'immagine gia' pronta la scarica, e
# lo scaricamento la percentuale ce l'ha.
#
# Qui si costruiscono le immagini, una per architettura, dalla stessa base di
# `ponte/build.yaml`, e si mettono su GitHub Packages (ghcr.io) col numero
# della versione del manifesto. Il manifesto le chiama (`image:`) solo quando
# ci sono: se le chiamasse prima, ogni aggiornamento fallirebbe.
#
# «26 file non tornano» su un add-on appena aggiornato: il numero della versione
# e' il nome dell'immagine, e lo pubblicava anche chi lavorava su un ramo —
# ogni passo di un rilascio a meta' (la versione nuova prima del sigillo) e
# ogni spinta dopo. Adesso l'immagine col numero la pubblica solo `main`, e
# solo dopo averla aperta e aver guardato che la plancia dentro torni col suo
# sigillo; sui rami si costruisce e si guarda, e basta.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ponte/**"
      - ".github/workflows/immagini-add-on.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: immagini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # I pezzi di GdAHome OS che l'add-on mette sui pannelli a muro: l'APK del
  # sistema, il ponte Zigbee, le animazioni d'avvio (`ponte/muro/LEGGIMI.md`).
  # Si costruiscono una volta sola, dal sorgente di GdAHome OS al commit fissato
  # in `ponte/muro/ORIGINE.json`, e vanno in tutte le immagini: sono per il
  # pannello (arm64), non per la macchina dell'add-on.
  pezzi:
    name: I pezzi di GdAHome OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Da dove
        id: da
        run: |
          echo "repository=$(jq -r .repository ponte/muro/ORIGINE.json)" >> "$GITHUB_OUTPUT"
          echo "cartella=$(jq -r .cartella ponte/muro/ORIGINE.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit ponte/muro/ORIGINE.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ steps.da.outputs.repository }}
          ref: ${{ steps.da.outputs.commit }}
          path: sorgente-os
          sparse-checkout: ${{ steps.da.outputs.cartella }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: GdAHome OS (APK)
        working-directory: sorgente-os/${{ steps.da.outputs.cartella }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/pezzi"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pezzi/GdAHome-OS.apk"
      - name: Il ponte Zigbee (gdaserial, arm64)
        run: |
          cc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$cc" -O2 -Wall -static \
            -o pezzi/gdaserial-arm64-v8a \
            "sorgente-os/${{ steps.da.outputs.cartella }}/native/gdaserial.c"
          file pezzi/gdaserial-arm64-v8a
      - name: Le animazioni d'avvio
        run: cp sorgente-os/${{ steps.da.outputs.cartella }}/os/bootanimation-*.zip pezzi/
      - name: Ci sono tutti
        run: |
          for pezzo in GdAHome-OS.apk gdaserial-arm64-v8a bootanimation-86.zip bootanimation-120.zip; do
            test -s "pezzi/$pezzo" || { echo "manca $pezzo"; exit 1; }
          done
          ls -la pezzi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pezzi-di-gdahome-os
          path: pezzi/
          retention-days: 7

  costruisci:
    needs: pezzi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            piattaforma: linux/arm64
          - arch: amd64
            piattaforma: linux/amd64
          - arch: armhf
            piattaforma: linux/arm/v6
          - arch: armv7
            piattaforma: linux/arm/v7
          - arch: i386
            piattaforma: linux/386
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pezzi-di-gdahome-os
          path: ponte/muro/
      - name: Versione e base
        id: dati
        run: |
          versione=$(sed -n 's/^version: "\(.*\)"$/\1/p' ponte/config.yaml)
          base=$(sed -n 's/^  ${{ matrix.arch }}: //p' ponte/build.yaml)
          test -n "$versione" && test -n "$base"
          echo "versione=$versione" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Solo per sapere, prima di costruire: quella che c'e' gia' su ghcr.io col
      # numero, se c'e', torna? Non ferma niente.
      - name: Quella gia' pubblicata col numero
        continue-on-error: true
        run: |
          docker run --rm --pull always --platform ${{ matrix.piattaforma }} --entrypoint node \
            ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }} \
            --input-type=module -e "$GUARDA"
        env:
          GUARDA: |
            import { guardaLaPlancia, inDueParole } from "/app/src/provenienza.js";
            const v = guardaLaPlancia("/app/plancia");
            console.log(inDueParole(v));
            if (v.quali?.length) console.log(v.quali.join("\n"));
      - name: Costruisce gdahome-${{ matrix.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ponte
          platforms: ${{ matrix.piattaforma }}
          build-args: |
            BUILD_FROM=${{ steps.dati.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.dati.outputs.versione }}
          labels: |
            io.hass.name=GdAHome
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.dati.outputs.versione }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          push: false
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }}
      # La stessa domanda che si fa la console dell'add-on, fatta dentro
      # l'immagine appena costruita: se qui non torna, a casa non tornerebbe.
      - name: La plancia dentro l'immagine torna col suo sigillo
        run: |
          docker run --rm --platform ${{ matrix.piattaforma }} --entrypoint node \
            ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }} \
            --input-type=module -e "$GUARDA"
        env:
          GUARDA: |
            import { guardaLaPlancia, inDueParole } from "/app/src/provenienza.js";
            const v = guardaLaPlancia("/app/plancia");
            console.log(inDueParole(v));
            if (v.quali?.length) console.log(v.quali.join("\n"));
            if (v.stato === "modificata" || v.stato === "senza-origine") process.exit(1);
      # «Manca GdAHome OS in questo add-on»: i pezzi non entravano nell'immagine
      # e l'installazione si fermava. Qui si guarda dentro quella appena fatta.
      - name: I pezzi di GdAHome OS sono nell'immagine
        run: |
          docker run --rm --platform ${{ matrix.piattaforma }} --entrypoint sh \
            ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }} \
            -c 'for p in GdAHome-OS.apk gdaserial-arm64-v8a bootanimation-86.zip bootanimation-120.zip; do test -s /app/muro/$p || { echo "manca /app/muro/$p"; exit 1; }; done; ls -la /app/muro'
      - name: Pubblica gdahome-${{ matrix.arch }}
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }}
