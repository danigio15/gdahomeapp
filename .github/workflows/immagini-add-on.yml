name: Le immagini dell'add-on

# «Quando si installa la percentuale non avanza, resta sempre a zero e poi
# diventa aggiornato.» Senza `image:` nel manifesto, Home Assistant costruisce
# l'add-on in casa dal Dockerfile, e una costruzione non ha una percentuale:
# resta a 0% finche' non ha finito. Con l'immagine gia' pronta la scarica, e
# lo scaricamento la percentuale ce l'ha.
#
# Qui si costruiscono le immagini, una per architettura, dalla stessa base di
# `ponte/build.yaml`, e si mettono su GitHub Packages (ghcr.io) col numero
# della versione del manifesto. Il manifesto le chiama (`image:`) solo quando
# ci sono: se le chiamasse prima, ogni aggiornamento fallirebbe.
#
# «26 file non tornano» su un add-on appena aggiornato: il numero della versione
# e' il nome dell'immagine, e lo pubblicava anche chi lavorava su un ramo —
# ogni passo di un rilascio a meta' (la versione nuova prima del sigillo) e
# ogni spinta dopo. Adesso l'immagine col numero la pubblica solo `main`, e
# solo dopo averla aperta e aver guardato che la plancia dentro torni col suo
# sigillo; sui rami si costruisce e si guarda, e basta.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ponte/**"
      - ".github/workflows/immagini-add-on.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: immagini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            piattaforma: linux/arm64
          - arch: amd64
            piattaforma: linux/amd64
          - arch: armhf
            piattaforma: linux/arm/v6
          - arch: armv7
            piattaforma: linux/arm/v7
          - arch: i386
            piattaforma: linux/386
    steps:
      - uses: actions/checkout@v4
      - name: Versione e base
        id: dati
        run: |
          versione=$(sed -n 's/^version: "\(.*\)"$/\1/p' ponte/config.yaml)
          base=$(sed -n 's/^  ${{ matrix.arch }}: //p' ponte/build.yaml)
          test -n "$versione" && test -n "$base"
          echo "versione=$versione" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Solo per sapere, prima di costruire: quella che c'e' gia' su ghcr.io col
      # numero, se c'e', torna? Non ferma niente.
      - name: Quella gia' pubblicata col numero
        continue-on-error: true
        run: |
          docker run --rm --pull always --platform ${{ matrix.piattaforma }} --entrypoint node \
            ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }} \
            --input-type=module -e "$GUARDA"
        env:
          GUARDA: |
            import { guardaLaPlancia, inDueParole } from "/app/src/provenienza.js";
            const v = guardaLaPlancia("/app/plancia");
            console.log(inDueParole(v));
            if (v.quali?.length) console.log(v.quali.join("\n"));
      - name: Costruisce gdahome-${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ponte
          platforms: ${{ matrix.piattaforma }}
          build-args: |
            BUILD_FROM=${{ steps.dati.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.dati.outputs.versione }}
          labels: |
            io.hass.name=GdAHome
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.dati.outputs.versione }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          push: false
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }}
      # La stessa domanda che si fa la console dell'add-on, fatta dentro
      # l'immagine appena costruita: se qui non torna, a casa non tornerebbe.
      - name: La plancia dentro l'immagine torna col suo sigillo
        run: |
          docker run --rm --platform ${{ matrix.piattaforma }} --entrypoint node \
            ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }} \
            --input-type=module -e "$GUARDA"
        env:
          GUARDA: |
            import { guardaLaPlancia, inDueParole } from "/app/src/provenienza.js";
            const v = guardaLaPlancia("/app/plancia");
            console.log(inDueParole(v));
            if (v.quali?.length) console.log(v.quali.join("\n"));
            if (v.stato === "modificata" || v.stato === "senza-origine") process.exit(1);
      - name: Pubblica gdahome-${{ matrix.arch }}
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/gdahome-${{ matrix.arch }}:${{ steps.dati.outputs.versione }}
