# Manda in produzione il tramite.
#
# La macchina non segue `main`: segue un **segno**, che si chiama `tramite`.
# Su main si spinge dieci volte al giorno, e una macchina che seguisse main si
# riavvierebbe dieci volte al giorno — a volte su un commit scritto a meta',
# mentre qualcuno e' fuori casa e sta aprendo il cancello.
#
# Questo bottone sposta il segno. Da li' in poi la macchina se ne accorge entro
# dieci minuti, si scarica quella versione, la **prova**, e solo se le prove
# passano si riavvia. Nessuna chiave SSH da nessuna parte, nessuna porta nuova
# aperta: e' la macchina che va a vedere, non noi che entriamo.
#
# Le prove girano anche qui, prima di spostare il segno. Due volte non e'
# pignoleria: qui si scopre subito, la' si scopre comunque — e se la macchina
# dovesse trovarle rotte, resterebbe sulla versione di prima invece di
# accendere una cosa che non parte.
name: Il tramite

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Quale commit mandare in produzione (vuoto: l'ultimo di main)"
        required: false
        default: ""

# Di serie si legge e basta: scrive solo il lavoro che sposta il segno.
permissions:
  contents: read

concurrency:
  group: il-tramite
  cancel-in-progress: false

jobs:
  manda:
    name: Sposta il segno
    runs-on: ubuntu-latest
    # Il segno e' la produzione: chi lo sposta passa dall'ambiente
    # `produzione`, che il proprietario protegge nelle impostazioni della
    # repository (chi puo' approvare, da quali rami).
    environment: produzione
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Quello che arriva da fuori — la casella, il titolo del commit — passa
      # sempre da una variabile, mai scritto dentro lo script: cosi' resta
      # testo, qualunque cosa ci sia dentro.
      - name: Quale commit
        id: quale
        env:
          SCELTO: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          scelto="$SCELTO"
          if [ -z "$scelto" ]; then
            # Quello su cui gira questa corsa: il bottone si preme dal ramo
            # principale, quindi e' l'ultimo commit di main. Chiederlo a
            # `origin/main` dipenderebbe da cosa il checkout si e' portato
            # dietro; `HEAD` no.
            scelto="$(git rev-parse HEAD)"
          fi
          # Un commit si scrive in esadecimale, o come nome di un ramo o di
          # un'etichetta: niente trattini davanti, che git leggerebbe come
          # opzioni.
          case "$scelto" in
            -*)
              echo "«$scelto» non e' un commit di questa repository." >&2
              exit 1
              ;;
          esac
          git rev-parse --verify --end-of-options "$scelto^{commit}" >/dev/null || {
            echo "«$scelto» non e' un commit di questa repository." >&2
            exit 1
          }
          intero="$(git rev-parse --verify --end-of-options "$scelto^{commit}")"
          echo "sha=$intero" >>"$GITHUB_OUTPUT"
          echo "corto=${intero:0:8}" >>"$GITHUB_OUTPUT"

      - name: Le prove del tramite, su quel commit
        env:
          SHA: ${{ steps.quale.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --quiet "$SHA"
          cd centralino && node --test test/*.test.js

      - name: Sposta il segno
        env:
          SHA: ${{ steps.quale.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tramite "$SHA"
          git push -f origin tramite

      - name: Cosa e' successo
        env:
          SHA: ${{ steps.quale.outputs.sha }}
          CORTO: ${{ steps.quale.outputs.corto }}
        run: |
          # Il titolo si rilegge qui da git, e si scrive com'e' con `printf`:
          # e' testo di chi ha scritto il commit, non un pezzo di script.
          titolo="$(git log -1 --format=%s "$SHA")"
          {
            printf '## Il segno e%s sulla `%s`\n' "'" "$CORTO"
            echo
            printf '> %s\n' "$titolo"
            echo
            echo "La macchina se ne accorge entro dieci minuti, scarica quella"
            echo "versione, la prova, e solo se le prove passano si riavvia."
            echo
            echo "Come si controlla che sia arrivata, dal telefono:"
            echo
            echo '```'
            echo "https://tramite.gdahome.org/salute"
            echo '```'
            echo
            echo "Il campo \`acceso_da\` torna a un numero piccolo quando si e'"
            echo "riavviata. Se resta grande, non e' ancora passata: il giro e'"
            echo "ogni dieci minuti."
          } >>"$GITHUB_STEP_SUMMARY"
