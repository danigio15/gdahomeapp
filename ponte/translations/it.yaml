# Come si leggono le opzioni di gdahome, in italiano.
#
# Home Assistant, senza questo file, scrive il nome della chiave cosi' com'e':
# «da_fuori_casa». Funziona, ma si vede che e' il nome di una variabile. Qui
# ogni opzione ha il suo nome e una riga che dice a cosa serve, e Home
# Assistant le mette nella scheda dell'add-on.
#
# Accanto c'e' `en.yaml`, le stesse opzioni in inglese: Home Assistant sceglie
# in base alla lingua di chi guarda, e ricade sull'inglese per tutte le altre.
# Chi aggiunge un'opzione la scrive in tutti e due i file — uno solo vuol dire
# una scheda mezza tradotta.
#
# ─── Come sono messe in fila ────────────────────────────────────────────────
#
# In **cinque sezioni**, e non piu' in tredici caselle di fila.
#
# Home Assistant non ha titoli di sezione: li disegna solo per le caselle
# annidate, ed e' per questo che sono annidate. Prima l'unico posto dove dire
# «questa non e' roba tua» era il nome — «Casa · Da fuori casa» — e con tredici
# caselle una sotto l'altra non bastava: chi apriva la scheda si trovava fra i
# piedi la chiave della console e quella del gestore senza nessun modo di
# capire che non lo riguardavano.
#
# Adesso il titolo lo dice la sezione, e il prefisso nel nome non ci va piu':
# «La casa › Casa · Da fuori casa» sarebbe la stessa parola detta due volte.
#
#  1. `casa` — **chi abita la casa**, che e' quasi sempre l'unico che guarda;
#  2. `chi_installa` — chi gdahome lo monta in casa d'altri;
#  3. `gestione` e `assistenza` — **una casa sola al mondo** ciascuna;
#  4. `avanzate` — due numeri che non cambia quasi nessuno.
#
# Ogni sezione ha il suo `name` (il titolo), la sua `description` (che dice a
# chi tocca), e sotto `fields:` le sue caselle, ognuna con nome e descrizione
# come prima.
#
# ─── E i nomi ───────────────────────────────────────────────────────────────
#
# In questa scheda ci sono **tre codici diversi**: il QR che abbina un
# telefono, il codice che da' l'installatore, e quello che apre il cruscotto di
# chi installa. Finche' uno si chiamava «Quanto vive un codice» erano tre cose
# con un nome solo. Ogni nome adesso dice **quale**.
configuration:
  casa:
    name: La casa
    description: >-
      Queste sono le tue, e per quasi tutti sono le uniche che contano. Le altre sezioni qui
      sotto servono a chi gdahome lo monta in casa d'altri: se la casa e' la tua, la' dentro non
      c'e' niente da toccare.
    fields:
      da_fuori_casa:
        name: Da fuori casa
        description: >-
          L'app entra anche quando non sei in casa, passando dal centralino di
          gdahome: nessuna porta da aprire sul router, nessun indirizzo pubblico,
          niente da installare. Spento, la casa si raggiunge solo dalla sua rete.
      quadro:
        name: Il codice di chi ti ha fatto l'impianto
        description: >-
          Lasciala vuota. Se la casa te l'ha montata un installatore, lui ti da' un
          codice da incollare qui, e da quel momento questa casa gli manda poche
          righe di numeri: le versioni, quanto e' pieno il disco, quali add-on
          girano, quante entita' non rispondono, come si chiamano le tue plance —
          cosi' dal suo cruscotto sceglie come chiamarle. Piu' il nome dei
          dispositivi che
          in quel momento non rispondono, e solo quelli: serve a chi deve venire a
          ripararli, e vuol dire che se la presa si chiama «Luce cucina» lui legge
          «Luce cucina». Tutto il resto no — nessuno stato di nessun sensore,
          nessuna persona, nessun nome dei dispositivi che funzionano, ne' il nome
          del tuo Wi-Fi ne' il tuo indirizzo. Quello che parte lo leggi parola per
          parola nella console di gdahome, dove c'e' anche il tasto per smettere.
      quadro_ogni:
        name: Ogni quanto parte un rapporto
        description: >-
          Ogni quanti minuti partono quelle righe di numeri. Conta solo se la
          casella qui sopra e' piena; vuota, non parte niente e non si apre nessuna
          connessione.
      quadro_manutenzione:
        name: Lascia che chi ti ha fatto l'impianto aggiorni da lontano
        description: >-
          Lascialo spento se non ti serve. E' un secondo interruttore: mandargli i
          numeri l'hai gia' deciso col codice qui sopra, lasciargli mettere le mani
          dentro e' un'altra cosa. Acceso, dal suo cruscotto puo' fare due cose e
          basta: far partire un aggiornamento che questa casa ha gia' in attesa —
          quelli che vedi anche tu in Impostazioni — e riavviare Home Assistant,
          lo stesso «Riavvia» di Impostazioni. Niente altro: non apre la tua
          plancia, non legge i tuoi sensori, non tocca la tua configurazione. Non si apre nessuna porta
          verso casa tua: e' questa casa che bussa, e nella risposta trova cosa
          fare. Cosa gli e' stato chiesto e com'e' andata li leggi nel rapporto,
          nella scheda «Il cruscotto».
      quadro_configurazione:
        name: Lascia che chi ti ha fatto l'impianto configuri la plancia da lontano
        description: >-
          Lascialo spento se non ti serve. E' un terzo interruttore, a parte dalla
          manutenzione. Acceso, dal suo cruscotto vede com'e' fatta la tua plancia
          — le sezioni, le stanze, le entita' che ci hai messo, la disposizione — e
          la puo' cambiare, per esempio per metterti nella stanza giusta una presa
          appena aggiunta senza venire. Quello che cambia arriva a questa casa
          dalla stessa strada di un aggiornamento: e' la casa che passa a
          ritirarlo. Quello che non vede, perche' da questa strada non passa: le
          immagini e i flussi delle telecamere, gli stati dei sensori, quello che
          succede in casa. Sappi che i nomi delle tue stanze, dei tuoi dispositivi
          e delle tue entita' escono verso il suo cruscotto, con quello che ogni
          entita' sa fare — non cosa sta facendo: lo decidi tu, accendendola.
      quadro_marchio:
        name: Lascia che la plancia porti il marchio di chi ti ha fatto l'impianto
        description: >-
          Acceso — ed e' cosi' di serie — la voce nella barra laterale prende il
          suo nome al posto di «gdahome», e in cima alla plancia c'e' il suo
          logo. Serve a te: il giorno che qualcosa non va, hai davanti il nome
          di chi chiamare invece del nostro. Spento, resta gdahome, e non cambia
          nient'altro. Se la plancia l'hai gia' rinominata tu, quel nome non lo
          tocca nessuno.
      minuti_del_codice:
        name: Quanto vive un QR di abbinamento
        description: >-
          Per quanti minuti vale il QR code che abbina un telefono nuovo. Scaduto,
          se ne fa un altro: non si perde niente.
      giorni_di_silenzio:
        name: Dopo quanto un telefono va riabbinato
        description: >-
          Dopo quanti giorni senza farsi vedere un telefono deve rifare
          l'abbinamento. Serve a chi perde un telefono e non se ne ricorda piu'.
          Zero vuol dire mai.
      dispositivi_massimi:
        name: Quanti telefoni insieme
        description: >-
          Quanti telefoni possono restare abbinati nello stesso momento. Il
          telefono di casa, quello di chi ci abita con te, quello dei nonni.
  chi_installa:
    name: Chi installa
    description: >-
      Solo se gdahome lo monti in casa d'altri. Questo Home Assistant e' il tuo, quello da cui
      tieni d'occhio gli impianti che hai montato; in casa di un cliente queste due restano
      com'e'.
    fields:
      acceso:
        name: Questo Home Assistant e' di chi installa
        description: >-
          Lascialo spento: serve a chi gdahome lo monta in casa d'altri. Acceso, e
          col codice scritto qui sotto, nella console di gdahome compare il tuo
          cruscotto — da cui guardi gli impianti che hai montato — e nell'app e
          nella barra laterale compare la voce per aprirlo. Da solo non accende
          niente. Va acceso sul tuo Home Assistant, non su quello di un cliente.
      chiave:
        name: Il codice che apre il tuo cruscotto
        description: >-
          Quello che ti sei fatto dare quando il cruscotto ti e' stato aperto.
          Senza, l'interruttore qui sopra non fa niente: nessuna sezione, nessuna
          voce, da nessuna parte. Scritto, non te lo richiede piu' nessuno.
          Scrivilo sul tuo Home Assistant e non su quello di un cliente: le opzioni
          di un add-on stanno su disco in chiaro e finiscono nei backup.
  gestione:
    name: Chi gestisce il cruscotto
    description: >-
      Una casa sola al mondo, e non e' la tua: e' quella di chi gestisce il cruscotto degli installatori. Lasciala vuota.
    fields:
      chiave:
        name: La chiave per gestire gli installatori
        description: >-
          Lasciala vuota: serve a una persona sola al mondo, quella che decide chi
          puo' installare. Scritta, nella barra laterale compare «Gestione
          installatori», da cui si aggiungono gli installatori e si mettono i
          limiti; vuota, quella voce non esiste. Qui l'interruttore non c'e': la
          chiave e' l'interruttore.
  assistenza:
    name: L'assistenza
    description: >-
      Una casa sola al mondo, quella di chi risponde alle segnalazioni di tutti. Lasciala vuota.
    fields:
      chiave:
        name: La chiave per rispondere alle chat
        description: >-
          Lasciala vuota: serve a una casa sola al mondo, quella di chi risponde
          alle chat di assistenza, per leggere le conversazioni di tutti. In tutte
          le altre non cambia niente e non si vede niente.
    network:
      8098/tcp: >-
        L'app di gdahome bussa qui. In casa basta cosi'; da fuori serve farla
        arrivare fin qui.
  avanzate:
    name: Avanzate
    description: >-
      Due numeri che non cambia quasi nessuno. Se non sai cosa sono, vanno bene cosi'.
    fields:
      porta_app:
        name: La porta su cui bussa l'app
        description: >-
          La porta che l'app usa quando sei in casa. Si cambia solo se un altro
          programma usa gia' questa.
      registro:
        name: Quanto scrive il registro
        description: >-
          Quanto l'add-on racconta di se' nella scheda «Registro». «info» va bene
          sempre; «debug» serve quando c'e' qualcosa da capire, e riempie.
