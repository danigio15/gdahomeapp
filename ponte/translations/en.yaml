# The gdahome options, in English. See `it.yaml`: same options, same order.
configuration:
  da_fuori_casa:
    name: From away
    description: >-
      The app gets in when you are not at home too, through the gdahome relay:
      no port to open on the router, no public address, nothing to install.
      Off, your home is reachable only on its own network.
  porta_app:
    name: The app's port
    description: >-
      The port the app knocks on while you are at home. Change it only if
      another program already uses this one.
  dispositivi_massimi:
    name: How many phones
    description: How many phones can stay paired at the same time.
  minuti_del_codice:
    name: How long a code lives
    description: For how many minutes a pairing QR code is good.
  giorni_di_silenzio:
    name: Days of silence
    description: >-
      After how many days without showing up a phone has to pair again. Zero
      means never.
  chiave_console:
    name: The console key
    description: >-
      Leave it empty. It is only for whoever answers the support chats: in
      every other home it changes nothing.
  quadro:
    name: The panel of whoever installed your home
    description: >-
      Leave it empty. If an installer set your home up, they give you a code to
      paste here: from then on this home sends them a few lines of numbers
      every quarter of an hour — the versions, how full the disk is, which
      add-ons are running, how many entities stopped answering — and they find
      out something is wrong before you have to call them. None of it is yours:
      no entity names, no rooms, no people, no sensor states, not your Wi-Fi
      name and not your public address either. You can read what goes out, word
      for word, in gdahome's «The panel» tab, where the button to stop it also
      is.
  quadro_ogni:
    name: How often a postcard goes out
    description: >-
      Every how many minutes this home writes to the panel. It only counts if
      the box above is filled in.
  installatore:
    name: This Home Assistant belongs to an installer
    description: >-
      Leave it off. On, the gdahome console gains one more section — your
      panel — where you watch the systems you installed, and the app gains the
      matching entry. Turn it on in your own Home Assistant, not in a client's.
      The fleet key is not written here: the page asks for it and it stays in
      the browser of whoever types it.
  registro:
    name: The log
    description: How much it writes in the add-on's log.
network:
  8098/tcp: >-
    The gdahome app knocks here. At home that is all it takes; from away it
    has to be able to reach this port.
