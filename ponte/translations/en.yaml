# The gdahome options, in English. See `it.yaml`: same options, same order,
# and the reason for that order is written there.
configuration:
  casa:
    name: Your home
    description: >-
      These are yours, and for almost everyone they are the only ones that matter. The sections
      below are for people who install gdahome in other people's homes: if this home is yours,
      there is nothing to touch in there.
    fields:
      da_fuori_casa:
        name: From away
        description: >-
          The app gets in when you are not at home too, through the gdahome relay:
          no port to open on the router, no public address, nothing to install.
          Off, your home is reachable only on its own network.
      quadro:
        name: The code of whoever installed your home
        description: >-
          Leave it empty. If an installer set your home up, they give you a code to
          paste here, and from then on this home sends them a few lines of numbers:
          the versions, how full the disk is, which add-ons are running, how many
          entities stopped answering. That way they find out something is wrong
          before you have to call them. Plus the name of the devices that are not
          answering at that moment, and only those: it is what tells the person who
          has to come and fix them what to expect, so if the socket is called
          "Kitchen light" they read "Kitchen light". Nothing else — no sensor
          states, no people, no names of the devices that work, not your Wi-Fi name
          and not your address. What does go out you can read word for word in the
          gdahome console, where the button to stop it also is.
      quadro_ogni:
        name: How often a status report goes out
        description: >-
          Every how many minutes those lines of numbers go out. It only counts if
          the box above is filled in; empty, nothing goes out and no connection is
          opened.
      quadro_manutenzione:
        name: Let whoever installed your home update it from a distance
        description: >-
          Leave it off if you do not need it. It is a second switch: sending them
          the numbers you already decided with the code above, letting them put
          their hands inside is another thing. On, from their dashboard they can do
          two things and no more: start an update this home is already waiting for
          — the ones you see in Settings too — and restart Home Assistant, the same
          "Restart" as in Settings. Nothing else: they do not open your dashboard,
          they do not read your sensors, they do not touch your configuration. No door is
          opened towards your home: it is this home that knocks, and in the answer
          it finds what to do. What they asked for and how it went you read in the
          status report, in the "Il cruscotto" tab.
      quadro_marchio:
        name: Let the dashboard carry the mark of whoever installed your home
        description: >-
          On — and it is on by default — the sidebar entry takes their name
          instead of "gdahome", and their logo sits at the top of the dashboard.
          It is for you: the day something goes wrong, you have in front of you
          the name of who to call instead of ours. Off, it stays gdahome, and
          nothing else changes. If you have already renamed the dashboard
          yourself, nobody touches that name.
      minuti_del_codice:
        name: How long a pairing QR lives
        description: >-
          For how many minutes the QR code that pairs a new phone is good. Once it
          expires you make another one: nothing is lost.
      giorni_di_silenzio:
        name: After how long a phone has to pair again
        description: >-
          After how many days without showing up a phone has to pair again. It is
          there for whoever loses a phone and does not think of it any more. Zero
          means never.
      dispositivi_massimi:
        name: How many phones at once
        description: >-
          How many phones can stay paired at the same time. Yours, the one of
          whoever lives with you, your parents'.
  chi_installa:
    name: The installer
    description: >-
      Only if you install gdahome in other people's homes. This Home Assistant is yours, the one
      you watch your installations from; in a customer's home these two stay as they are.
    fields:
      acceso:
        name: This Home Assistant belongs to an installer
        description: >-
          Leave it off: it is for whoever installs gdahome in other people's homes.
          On, and with the code below filled in, the gdahome console gains your
          panel — where you watch the systems you installed — and the app and the
          sidebar gain the entry that opens it. On its own it turns nothing on.
          Turn it on in your own Home Assistant, not in a client's.
      chiave:
        name: The code that opens your panel
        description: >-
          The one you were given when your panel was opened for you. Without it the
          switch above does nothing: no section, no entry, nowhere. Filled in,
          nobody asks you for it again. Write it in your own Home Assistant and not
          in a client's: an add-on's options sit on disk in the clear and end up in
          backups.
  gestione:
    name: Whoever runs the board
    description: >-
      One home in the world, and it is not yours: it belongs to whoever runs the installers'
      board. Leave it empty.
    fields:
      chiave:
        name: The key for managing installers
        description: >-
          Leave it empty: it serves one person in the world, the one who decides
          who may install. Filled in, the sidebar gains «Gestione installatori»,
          where installers are added and their limits set; empty, that entry does
          not exist. There is no switch here: the key is the switch.
  assistenza:
    name: Support
    description: >-
      One home in the world, the one that answers everybody's reports. Leave it empty.
    fields:
      chiave:
        name: The key for answering the chats
        description: >-
          Leave it empty: it serves one home in the world, the one of whoever
          answers the support chats, to read everybody's conversations. In every
          other home it changes nothing and shows nothing.
    network:
      8098/tcp: >-
        The gdahome app knocks here. At home that is all it takes; from away it
        has to be able to reach this port.
  avanzate:
    name: Advanced
    description: >-
      Two numbers almost nobody changes. If you do not know what they are, they are fine as they
      are.
    fields:
      porta_app:
        name: The port the app knocks on
        description: >-
          The port the app uses while you are at home. Change it only if another
          program already uses this one.
      registro:
        name: How much the log writes
        description: >-
          How much the add-on says about itself in the «Registro» tab. «info» is
          always fine; «debug» is for when there is something to work out, and it
          fills up.
