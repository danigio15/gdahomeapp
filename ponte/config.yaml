# Il ponte: l'add-on che fa entrare l'app in casa.
#
# Due porte, e la differenza fra le due e' tutta la sicurezza di questo
# add-on.
#
# `ingress_port` non e' raggiungibile da nessuno: ci arriva solo Home
# Assistant, che ci mette davanti la propria autenticazione. Li' sopra sta la
# console — quella che fabbrica i codici di abbinamento e stacca i telefoni.
# Chi non e' entrato in Home Assistant non la vede nemmeno.
#
# `ports` invece e' la porta su cui bussa l'app, ed e' l'unica che puo'
# finire esposta. Su quella non c'e' nessuna console: si puo' solo presentare
# un codice di abbinamento valido, o un segno di riconoscimento gia' avuto.
# Come si chiama nella barra laterale di Home Assistant: **gdahome**.
#
# Lo `slug` e' `gdahome`, come il resto. Lo slug e' l'identita' dell'add-on per
# il Supervisor, e cambiarlo vuol dire che per Home Assistant questo e' un
# add-on **nuovo**: installato da zero, senza le opzioni, senza i telefoni
# abbinati e senza la configurazione delle plance, con quello di prima rimasto
# li' accanto da disinstallare a mano.
#
# Quel prezzo si paga una volta sola, e si e' scelto di pagarlo **adesso**:
# l'add-on ce l'ha una persona, su una macchina di prova. Il giorno che ce
# l'avesse qualcuno, a pagarlo sarebbe lui — e allora lo slug non si toccherebbe
# piu', per nessun motivo.
#
# Dentro il codice e nei documenti il pezzo continua a chiamarsi «il ponte»,
# perche' e' quello che fa e perche' e' uno dei tre pezzi (il ponte, il
# centralino, l'app). «gdahome» e' il nome del prodotto, e va dove il prodotto
# si vede.
name: gdahome
version: "1.4.24"
slug: gdahome
# Le virgolette non sono un vezzo: dentro c'e' un «due punti» seguito da uno
# spazio, e in YAML quella e' la cosa che separa una chiave dal suo valore.
# Senza virgolette il manifesto non si legge — e un manifesto che non si legge
# vuol dire un add-on che nel negozio non compare, senza nessun errore da
# nessuna parte. E' andata cosi' per un giorno intero.
description: "La plancia e l'app di gdahome, per questa casa: da dentro e da fuori, senza che nessun segreto di Home Assistant finisca sul telefono."
url: https://github.com/danigio15/gdahomeapp/tree/main/ponte
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto

# La console, dietro l'autenticazione di Home Assistant.
ingress: true
ingress_port: 8099
panel_icon: mdi:bridge
panel_title: gdahome

# La porta dell'app.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: L'app di gdahome bussa qui. In casa basta cosi'; da fuori serve farla arrivare fin qui.

# Il ponte parla con Home Assistant per conto dell'app, e per farlo gli serve
# il segno del Supervisor. Quel segno non esce mai da questo add-on: e'
# esattamente il motivo per cui il ponte esiste.
homeassistant_api: true

# La cartella di Home Assistant. Si legge tutta, e si scrive **una cartella
# sola**: `www/gdahome/`.
#
# Si legge per far scegliere, dalla Config dell'app, le immagini che ci sono
# gia' — le foto delle auto, i loghi, gli sfondi che chi ha una casa da qualche
# anno tiene li' e che la plancia ha sempre usato con `/local/…`. Senza questa
# riga la maschera delle foto dice «nessuna foto» a chi ne ha duecento.
#
# Si scrive per un file solo: la cartina che apre la plancia fra le «Plance»
# di Home Assistant (`src/plance-in-casa.js`). Deve stare li' e non dentro
# l'add-on perche' quel file lo carica il browser **dentro** la pagina di Home
# Assistant, e da un add-on non lo saprebbe prendere: all'ingress serve una
# sessione, e per chiederla serve del programma che gira in quella pagina.
#
# Era in sola lettura, e il cambio va detto chiaro invece che nascosto: li'
# dentro ci sono le automazioni, i temi e i segreti di chi ci abita, e Home
# Assistant non sa mappare una sottocartella — o tutta in lettura, o tutta in
# scrittura. Quello che il ponte ci scrive sta in un metodo solo,
# `doveVaLaCarta`, e una prova tiene fermo che l'unico percorso scritto
# cominci per `www/gdahome/`. Il resto lo guarda e non lo tocca; quello che si
# carica dall'app finisce nella cartella dell'add-on, non nella loro.
map:
  - homeassistant_config:rw
  # La cartella degli add-on locali, in **scrittura**.
  #
  # Serve a una cosa sola, e non se ne puo' fare a meno: aggiornare questo
  # add-on. Un add-on locale non ha nessun negozio dietro — Home Assistant
  # guarda il manifesto che trova in `/addons/gdahome`, e quella e' l'unica
  # versione che conosce — quindi finche' qualcuno non porta i file nuovi in
  # quella cartella, «Aggiorna» non compare mai. Portarli a mano vuol dire un
  # terminale e un gettone di GitHub a ogni giro: esattamente la cosa che chi
  # non ha un computer non puo' fare, cioe' la persona per cui questa app c'e'.
  #
  # Con questa riga il ponte se li porta da se', da un bottone nella sua
  # console. Cosa ci mette dentro, e cosa controlla prima di metterlo, sta
  # tutto in `src/aggiornamento.js`.
  - addons:rw

# Serve a una cosa sola: chiedere al Supervisor su quali indirizzi si trova
# questa casa sulla rete locale, per poterlo dire ai telefoni quando si
# abbinano. Cosi' in casa l'app va dritta invece di fare il giro dal
# centralino. Se si toglie, tutto funziona lo stesso — solo piu' lento sul
# divano.
hassio_api: true

# Per chiedere al Supervisor di ricostruirsi, dopo essersi aggiornato.
#
# E' il permesso piu' grosso di questo manifesto, e va detto chiaro invece che
# nascosto: con `manager` il ponte parla al Supervisor come un amministratore.
# Il ponte lo usa per due chiamate sole — rileggi il negozio, ricostruisci me
# stesso — e stanno tutte in `src/aggiornamento.js`, in chiaro.
#
# Senza, l'aggiornamento funziona a meta': i file nuovi arrivano in
# `/addons/gdahome`, ma poi tocca aprire Home Assistant e premere
# «Ricostruisci» a mano — di nuovo una cosa da spiegare a chi non deve
# imparare niente.
hassio_role: manager

options:
  # Da fuori casa l'app entra passando da un centralino: il ponte non aspetta
  # che qualcuno lo trovi, va lui e ci resta in attesa. Cosi' non c'e' nessuna
  # porta da aprire sul router, nessun indirizzo pubblico da avere, e nessuna
  # VPN da installare.
  #
  # Acceso, si usa il centralino di gdahome, e non c'e' niente da scrivere da
  # nessuna parte. Spento, la casa si raggiunge solo dalla propria rete.
  #
  # **Qui non c'e' nessuna casella per l'indirizzo, e non e' una dimenticanza.**
  # Prima c'era, e stava sempre vuota: l'indirizzo giusto e' quello scritto nel
  # programma (`src/opzioni.js`, e identico dentro l'app), e una casella che non
  # va toccata e' una casella che prima o poi qualcuno tocca — scrivendoci
  # qualcosa di storto, o congelando per quella casa un indirizzo che il giorno
  # che cambia non cambia piu'. Dove chiama questa casa lo dice la console,
  # nella scheda «Da fuori casa».
  #
  # Chi vuole un centralino suo se ne accende uno (`nuvola/README.md`) e si
  # tiene una copia locale di questo add-on, dove quella riga si cambia una
  # volta: e' una cosa da chi sa cos'e' un centralino, e chi lo sa sa anche
  # cambiare una riga.
  da_fuori_casa: true
  porta_app: 8098
  # Quanti telefoni possono restare abbinati insieme.
  dispositivi_massimi: 10
  # Quanto vive un codice di abbinamento, in minuti.
  minuti_del_codice: 5
  # Quanto vive il segno di un telefono senza farsi vedere, in giorni.
  # Zero vuol dire per sempre.
  giorni_di_silenzio: 90
  # Il gettone di GitHub con cui il ponte si scarica le versioni nuove.
  #
  # **Lascialo vuoto.** Da quando la repository dell'app e' pubblica non serve
  # a nessuno: chi installa l'add-on dal negozio riceve gli aggiornamenti dal
  # negozio, come per ogni altro add-on, e chi lo tiene come add-on locale li
  # prende col bottone nella console — che legge un manifesto pubblico, senza
  # presentarsi.
  #
  # Resta perche' su una repository privata quel bottone senza gettone non
  # funziona, e qualcuno potrebbe tenere una sua copia privata. In quel caso:
  # un gettone a grana fine sulla sola repository dell'app, con **Contents:
  # Read-only** e nient'altro.
  gettone: ""
  # La chiave con cui si **risponde** alle chat di assistenza.
  #
  # Lasciala vuota. Serve a UNA installazione al mondo — quella di chi l'app la
  # mantiene — per leggere le conversazioni di tutti e rispondere. In tutte le
  # altre case non cambia niente e non si vede niente: la chat resta quella di
  # chi chiede aiuto, che e' quello che serve.
  #
  # E' la stessa chiave messa fra i segreti del centralino, e non si inventa
  # qui: si copia da li'.
  chiave_console: ""
  registro: info

schema:
  da_fuori_casa: bool
  porta_app: int(1024,65535)
  dispositivi_massimi: int(1,100)
  minuti_del_codice: int(1,60)
  giorni_di_silenzio: int(0,3650)
  # `password` perche' Home Assistant lo nasconda mentre si scrive e non lo
  # rimostri dopo; il `?` perche' chi non ne ha bisogno non deve trovarsi un
  # campo obbligatorio da riempire.
  gettone: password?
  # `password` per la stessa ragione del gettone: Home Assistant la nasconde
  # mentre si scrive. A differenza del gettone, questa si puo' sempre rileggere
  # da dove sta di casa — sulla macchina, con `tramite-chiave`.
  chiave_console: password?
  registro: list(debug|info|attenzione|errore)
