# Il ponte: l'add-on che fa entrare l'app in casa.
#
# Due porte, e la differenza fra le due e' tutta la sicurezza di questo
# add-on.
#
# `ingress_port` non e' raggiungibile da nessuno: ci arriva solo Home
# Assistant, che ci mette davanti la propria autenticazione. Li' sopra sta la
# console — quella che fabbrica i codici di abbinamento e stacca i telefoni.
# Chi non e' entrato in Home Assistant non la vede nemmeno.
#
# `ports` invece e' la porta su cui bussa l'app, ed e' l'unica che puo'
# finire esposta. Su quella non c'e' nessuna console: si puo' solo presentare
# un codice di abbinamento valido, o un segno di riconoscimento gia' avuto.
# Come si chiama nella barra laterale di Home Assistant: **gdahome**.
#
# Lo `slug` e' `gdahome`, come il resto. Lo slug e' l'identita' dell'add-on per
# il Supervisor, e cambiarlo vuol dire che per Home Assistant questo e' un
# add-on **nuovo**: installato da zero, senza le opzioni, senza i telefoni
# abbinati e senza la configurazione delle plance, con quello di prima rimasto
# li' accanto da disinstallare a mano.
#
# Quel prezzo si paga una volta sola, e si e' scelto di pagarlo **adesso**:
# l'add-on ce l'ha una persona, su una macchina di prova. Il giorno che ce
# l'avesse qualcuno, a pagarlo sarebbe lui — e allora lo slug non si toccherebbe
# piu', per nessun motivo.
#
# Dentro il codice e nei documenti il pezzo continua a chiamarsi «il ponte»,
# perche' e' quello che fa e perche' e' uno dei tre pezzi (il ponte, il
# centralino, l'app). «gdahome» e' il nome del prodotto, e va dove il prodotto
# si vede.
name: gdahome
# Il numero: **suo**, e non piu' quello della plancia con un quarto pezzo
# attaccato.
#
# Per tutta la 1.4 questo numero era quello di DashboardModern piu' una
# correzione nostra — `1.4.24.1` si leggeva «la plancia 1.4.24, la prima
# correzione nostra» — e serviva a far sapere quale plancia c'era dentro senza
# andarla a cercare. Ma legarli voleva anche dire che l'add-on non poteva
# cambiare di suo senza raccontare una plancia che non era cambiata, e
# viceversa. Dalla 1.5.0 i due numeri camminano da soli: qui c'e' gdahome, in
# `officina/custom_components/dashboardmodern/manifest.json` c'e' la plancia, e
# oggi dicono 1.5.0 e 1.4.32.
#
# Quello che non cambia: nel negozio «Aggiorna» compare **solo** se questo
# numero si alza.
version: "1.10.11"
slug: gdahome
# Le virgolette non sono un vezzo: dentro c'e' un «due punti» seguito da uno
# spazio, e in YAML quella e' la cosa che separa una chiave dal suo valore.
# Senza virgolette il manifesto non si legge — e un manifesto che non si legge
# vuol dire un add-on che nel negozio non compare, senza nessun errore da
# nessuna parte. E' andata cosi' per un giorno intero.
description: "La plancia e l'app di gdahome, per questa casa: da dentro e da fuori, senza che nessun segreto di Home Assistant finisca sul telefono."
url: https://github.com/danigio15/gdahomeapp/tree/main/ponte
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto

# La console, dietro l'autenticazione di Home Assistant.
ingress: true
ingress_port: 8099
# Nella barra di Home Assistant questa voce apre la **console del ponte**: si
# abbinano i telefoni, si scelgono le dashboard, si apre l'indirizzo da fuori.
# Si chiamava «gdahome» con un ponte per segno, e detta cosi' prometteva un'app
# che li' dentro non c'e': chi ci entrava cercando la casa trovava le
# impostazioni. Il nome dice cosa si apre, e l'ingranaggio e' il segno che in
# Home Assistant vuol dire «qui si configura».
panel_icon: mdi:cog
panel_title: Configura gdahome

# La porta dell'app.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: L'app di gdahome bussa qui. In casa basta cosi'; da fuori serve farla arrivare fin qui.

# Il ponte parla con Home Assistant per conto dell'app, e per farlo gli serve
# il segno del Supervisor. Quel segno non esce mai da questo add-on: e'
# esattamente il motivo per cui il ponte esiste.
homeassistant_api: true

# La cartella di Home Assistant. Si legge tutta, e si scrive **una cartella
# sola**: `www/gdahome/`.
#
# Si legge per far scegliere, dalla Config dell'app, le immagini che ci sono
# gia' — le foto delle auto, i loghi, gli sfondi che chi ha una casa da qualche
# anno tiene li' e che la plancia ha sempre usato con `/local/…`. Senza questa
# riga la maschera delle foto dice «nessuna foto» a chi ne ha duecento.
#
# Si scrive per un file solo: la cartina che apre la plancia fra le «Plance»
# di Home Assistant (`src/plance-in-casa.js`). Deve stare li' e non dentro
# l'add-on perche' quel file lo carica il browser **dentro** la pagina di Home
# Assistant, e da un add-on non lo saprebbe prendere: all'ingress serve una
# sessione, e per chiederla serve del programma che gira in quella pagina.
#
# Era in sola lettura, e il cambio va detto chiaro invece che nascosto: li'
# dentro ci sono le automazioni, i temi e i segreti di chi ci abita, e Home
# Assistant non sa mappare una sottocartella — o tutta in lettura, o tutta in
# scrittura. Quello che il ponte ci scrive sta in un metodo solo,
# `doveVaLaCarta`, e una prova tiene fermo che l'unico percorso scritto
# cominci per `www/gdahome/`. Il resto lo guarda e non lo tocca; quello che si
# carica dall'app finisce nella cartella dell'add-on, non nella loro.
map:
  - homeassistant_config:rw

# La cartella degli add-on locali, `addons`, qui non c'e' piu', e manca
# apposta.
#
# C'era, in **scrittura**, per il bottone «Aggiorna gdahome» della console: il
# ponte si scaricava la versione nuova da GitHub e la metteva lui in
# `/addons/gdahome` (`src/aggiornamento.js`). Serviva a chi l'add-on l'aveva
# copiato a mano, che dietro non ha nessun negozio.
#
# Ma l'add-on si installa dal negozio — l'archivio di `repository.yaml` — e li'
# quel bottone non c'entrava niente: il Supervisor l'add-on se lo costruisce
# dalla repository, e `/addons/gdahome` non la guarda nemmeno. Anche dove la
# guardava il giro non si chiudeva da solo: col negozio riletto il Supervisor
# non ricostruisce un add-on che ha cambiato versione, e un add-on non puo'
# aggiornare se stesso, quindi alla fine toccava comunque premere «Aggiorna».
# Restava aperta in scrittura la cartella di **tutti** gli add-on locali della
# casa, per un bottone che quasi nessuno vedeva.
#
# Gli aggiornamenti arrivano dal negozio come per ogni altro add-on:
# Impostazioni → Componenti aggiuntivi → gdahome → Aggiorna. Chi tiene una
# copia a mano la aggiorna ricopiando la cartella (`COME_PROVARLA.md`).

# Le domande al Supervisor, e sono tutte letture.
#
# Su quali indirizzi si trova questa casa sulla rete locale (`/network/info`),
# per dirlo ai telefoni quando si abbinano, cosi' in casa l'app va dritta
# invece di fare il giro dal centralino; dove Home Assistant serve i suoi file
# (`/core/info`); e, solo dove c'e' il codice di un installatore, la macchina,
# il disco, le versioni e gli add-on del rapporto (`src/ferro.js`). Se si
# toglie, tutto funziona lo stesso: piu' lento sul divano, e un rapporto senza
# la macchina.
hassio_api: true

# Il ruolo con cui il Supervisor ascolta il ponte, e va detto chiaro invece che
# nascosto: con `manager` il ponte parla al Supervisor come un amministratore.
#
# Serve all'installatore. Il rapporto che parte verso il suo quadro porta
# l'elenco degli add-on col loro stato — quale gira, quale parte all'avvio ed
# e' fermo — e quella lettura (`/addons`) il Supervisor la da' solo a un
# add-on `manager`: col ruolo di serie si leggono le vie in `/info` e basta.
# La casa che ha incollato il codice del suo installatore gli ha permesso di
# vedere tutto questo, e l'installatore deve vederlo tutto. Dove quel codice
# non c'e' il rapporto non parte, e `/addons` non lo chiede nessuno.
#
# Le chiamate al Supervisor stanno tutte in chiaro in `src/ferro.js`. Le
# opzioni e la scheda di se stesso (`/addons/self/…`) e le icone degli add-on
# non chiedono questo ruolo: il Supervisor le da' comunque.
hassio_role: manager

options:
  # ─────────────────────────────────────────────────────────────────────────
  # CASA — questa e' la tua parte, e per quasi tutti e' l'unica.
  # ─────────────────────────────────────────────────────────────────────────
  casa:
    # Da fuori casa l'app entra passando da un centralino: il ponte non aspetta
    # che qualcuno lo trovi, va lui e ci resta in attesa. Cosi' non c'e' nessuna
    # porta da aprire sul router, nessun indirizzo pubblico da avere, e nessuna
    # VPN da installare.
    #
    # Acceso, si usa il centralino di gdahome, e non c'e' niente da scrivere da
    # nessuna parte. Spento, la casa si raggiunge solo dalla propria rete.
    #
    # **Qui non c'e' nessuna casella per l'indirizzo, e non e' una dimenticanza.**
    # Prima c'era, e stava sempre vuota: l'indirizzo giusto e' quello scritto nel
    # programma (`src/opzioni.js`, e identico dentro l'app), e una casella che non
    # va toccata e' una casella che prima o poi qualcuno tocca — scrivendoci
    # qualcosa di storto, o congelando per quella casa un indirizzo che il giorno
    # che cambia non cambia piu'. Dove chiama questa casa lo dice la console,
    # nella scheda «Da fuori casa».
    #
    # Chi vuole un centralino suo se ne accende uno (`centralino/README.md`) e si
    # tiene una copia locale di questo add-on, dove quella riga si cambia una
    # volta: e' una cosa da chi sa cos'e' un centralino, e chi lo sa sa anche
    # cambiare una riga.
    da_fuori_casa: true
    # Il quadro di chi ti ha fatto l'impianto.
    #
    # Lasciala vuota. Serve a chi la casa se l'e' fatta montare da un
    # installatore: lui ti da' un codice da incollare qui — venti caratteri, tipo
    # `K7M2-9XQF-3BHT-R4VN` — e da quel momento
    # questa casa gli manda ogni minuto **poche righe di numeri** — le
    # versioni, quanto e' pieno il disco, quali add-on girano, quante entita'
    # non rispondono. Cosi' si accorge che qualcosa non va prima che tocchi a te
    # telefonargli.
    #
    # Piu' **due cose che numeri non sono**, e te le diciamo prima: il **nome
    # dei dispositivi che in quel momento non rispondono** — serve a chi deve
    # venire a ripararli: un elenco di codici dice che qualcosa e' rotto e non
    # dice cosa, e se la presa si chiama «Luce cucina» lui legge «Luce cucina»
    # — e il **nome delle cose che hanno un aggiornamento da fare**, che e' come
    # Home Assistant le chiama nella sua pagina degli aggiornamenti.
    #
    # Tutto il resto no: se le luci sono accese o le porte aperte, le persone,
    # le stanze, il nome del tuo Wi-Fi, il tuo indirizzo pubblico. (L'indirizzo
    # della macchina **sulla rete di casa** si', e il segnale del Wi-Fi: a chi
    # ripara servono.) **Quello che parte lo puoi leggere**, parola per parola,
    # nella console di gdahome alla voce «Installatore», dove c'e' anche il
    # tasto per smettere.
    #
    # Vuota vuol dire che non parte niente e non si apre nessuna connessione.
    quadro: ""
    # Ogni quanti minuti parte un rapporto. Da 1 a 1440.
    quadro_ogni: 1
    # Lascia che chi ti ha fatto l'impianto aggiorni da lontano.
    #
    # E' un **secondo** interruttore, ed e' spento di serie. Mandargli i numeri e
    # lasciargli mettere le mani dentro sono due cose diverse: la prima l'hai gia'
    # data incollando il codice qui sopra, questa no.
    #
    # Acceso, dal suo cruscotto puo' fare due cose: far partire un aggiornamento
    # che questa casa ha gia' in attesa — quelli che vedi anche tu in
    # Impostazioni — e riavviare Home Assistant. Niente altro: non puo' aprire
    # la tua plancia, non puo' leggere i tuoi sensori, non puo' cambiare la tua
    # configurazione. Due verbi, scritti nel programma; il terzo — configurare
    # la plancia — ha la sua casella, qui sotto.
    #
    # Non si apre nessuna porta verso casa tua: e' questa casa che ogni minuto
    # manda il rapporto, e nella risposta trova, qualche volta, cosa fare.
    #
    # Quello che succede lo leggi dove leggi tutto il resto, nella scheda «Il
    # quadro»: cosa gli e' stato chiesto di installare e com'e' andata stanno
    # scritti nel rapporto, parola per parola.
    quadro_manutenzione: false
    # Lascia che chi ti ha fatto l'impianto configuri la plancia da lontano.
    #
    # E' un **terzo** interruttore, spento di serie, e non sta dentro la
    # manutenzione: lasciar installare un aggiornamento e lasciar rimettere mano
    # alla tua plancia sono due cose diverse.
    #
    # Acceso, dal suo cruscotto vede **com'e' fatta** la tua plancia — le
    # sezioni, le stanze, le entita' che ci hai messo, la disposizione — e la
    # puo' cambiare: e' quello che serve il giorno che ti aggiunge una presa e
    # te la vuole mettere nella stanza giusta senza venire. Quello che cambia
    # arriva a questa casa dalla stessa strada di un aggiornamento — e' la casa
    # che passa a ritirarlo — e si vede sui telefoni di casa alla prossima
    # apertura.
    #
    # Quello che **non** vede, e non per gentilezza ma perche' da questa strada
    # non passa: le immagini e i flussi delle telecamere, gli stati dei
    # sensori, quello che succede in casa. Configura la plancia; non la guarda.
    # Se una configurazione contenesse un indirizzo di flusso, questa casa la
    # rifiuta e lo scrive nel rapporto.
    #
    # Accendendola, sappi che i nomi delle tue stanze, dei tuoi dispositivi e
    # delle tue entita' escono da casa tua verso il suo cruscotto, con quello
    # che ogni entita' sa fare (una luce che sa i colori, un clima coi suoi
    # modi): e' l'inventario che serve al suo editor per scegliere una presa
    # e metterla in una stanza, ed e' il prezzo di farsi sistemare la plancia
    # da lontano. Sta scritto qui perche' lo decida tu.
    quadro_configurazione: false
    # Lascia che la plancia porti il nome e il logo di chi ti ha fatto
    # l'impianto.
    #
    # Acceso — ed e' cosi' di serie — la voce nella barra laterale prende il suo
    # nome al posto di «gdahome», e in cima alla plancia c'e' il suo logo.
    # Serve a te: il giorno che qualcosa non va, hai davanti il nome di chi
    # chiamare invece del nostro.
    #
    # Spento, resta gdahome. Non cambia nient'altro: il rapporto parte lo
    # stesso, e la manutenzione resta come l'hai messa.
    #
    # Se la plancia l'hai gia' rinominata tu, quel nome non lo tocca nessuno —
    # ne' questo interruttore, ne' un installatore che va o che viene.
    quadro_marchio: true
    # Quanto vive un codice di abbinamento, in minuti.
    minuti_del_codice: 5
    # Quanto vive il segno di un telefono senza farsi vedere, in giorni.
    # Zero vuol dire per sempre.
    giorni_di_silenzio: 90
    # Quanti telefoni possono restare abbinati insieme.
    dispositivi_massimi: 10

  # ─────────────────────────────────────────────────────────────────────────
  # INSTALLATORE — solo se gdahome lo monti in casa d'altri. Se la casa e' la
  # tua, qui non c'e' niente da toccare.
  # ─────────────────────────────────────────────────────────────────────────
  chi_installa:
    # Questo Home Assistant e' di chi installa.
    #
    # Acceso, nella console di gdahome compare una sezione in piu' — **il tuo
    # cruscotto** — da cui si aprono gli impianti che hai montato. Nell'app
    # compare la voce corrispondente.
    #
    # **Va acceso sul TUO Home Assistant, non su quello di un cliente.** In casa
    # di un cliente quella sezione la vedrebbe lui, e chiederebbe la chiave: non
    # gli si aprirebbe niente senza, ma e' una porta che in casa d'altri non
    # ha motivo di esserci.
    #
    # **Da solo non accende niente**: serve anche il codice qui sotto.
    acceso: false
    # Il codice del tuo cruscotto, quello che ti sei fatto dare quando l'hai
    # aperto.
    #
    # Senza questo, l'interruttore qui sopra non fa niente: nessuna sezione nella
    # console, nessuna voce nella barra laterale, nessuna voce nell'app. Non
    # chiuse — assenti.
    #
    # Prima bastava l'interruttore e il codice lo chiedeva la pagina. Chi lo
    # accendeva per sbaglio si trovava comunque una porta che non si apriva, e
    # una porta che si vede e' una domanda a cui qualcuno deve rispondere.
    #
    # **Scrivilo sul TUO Home Assistant, non su quello di un cliente.** Le
    # opzioni di un add-on stanno su disco in chiaro e finiscono nei backup: e'
    # la tua chiave, e va tenuta dove tieni le tue cose.
    chiave: ""

  # ─────────────────────────────────────────────────────────────────────────
  # GESTORE DEL QUADRO — una casa sola al mondo. Non e' la tua.
  # ─────────────────────────────────────────────────────────────────────────
  gestione:
    # La chiave di chi **tiene** il quadro.
    #
    # Lasciala vuota: e' una casa sola al mondo, e non e' la tua a meno che tu
    # non sappia gia' di cosa si tratta. Scritta, nella barra laterale compare
    # «Gestione installatori», da cui si aggiungono gli installatori e si mettono
    # i limiti. Vuota, quella voce non esiste.
    #
    # **Qui l'interruttore non c'e', e non e' una dimenticanza.** C'era, e su
    # tutte le case del mondo era un interruttore da premere per curiosita'. La
    # chiave e' l'interruttore: senza, non c'e' niente da accendere.
    chiave: ""

  # ─────────────────────────────────────────────────────────────────────────
  # ASSISTENZA — chi risponde alle segnalazioni di tutti. Una casa sola.
  # ─────────────────────────────────────────────────────────────────────────
  assistenza:
    # La chiave con cui si **risponde** alle chat di assistenza.
    #
    # Lasciala vuota. Serve a UNA installazione al mondo — quella di chi l'app la
    # mantiene — per leggere le conversazioni di tutti e rispondere. In tutte le
    # altre case non cambia niente e non si vede niente: la chat resta quella di
    # chi chiede aiuto, che e' quello che serve.
    #
    # E' la stessa chiave messa fra i segreti del centralino, e non si inventa
    # qui: si copia da li'.
    chiave: ""

  # ─────────────────────────────────────────────────────────────────────────
  # AVANZATE — due numeri che nessuno cambia mai.
  # ─────────────────────────────────────────────────────────────────────────
  avanzate:
    porta_app: 8098
    registro: info

schema:
  # ─────────────────────────────────────────────────────────────────────────
  # CASA — questa e' la tua parte, e per quasi tutti e' l'unica.
  # ─────────────────────────────────────────────────────────────────────────
  casa:
    da_fuori_casa: bool
    # `str?` e non `password?`: questa riga non e' un segreto da nascondere a chi
    # ci abita — e' il contrario, e' la cosa che deve poter rileggere per sapere
    # a chi la sua casa sta parlando.
    quadro: str?
    quadro_ogni: int(1,1440)
    # Il secondo interruttore, e sta qui in mezzo apposta: e' la casella subito
    # dopo quelle del quadro, perche' senza quelle non vuol dire niente.
    quadro_manutenzione: bool
    # Il terzo, e sta subito dopo il secondo per la stessa ragione.
    quadro_configurazione: bool
    quadro_marchio: bool
    minuti_del_codice: int(1,60)
    giorni_di_silenzio: int(0,3650)
    dispositivi_massimi: int(1,100)

  # ─────────────────────────────────────────────────────────────────────────
  # INSTALLATORE — solo se gdahome lo monti in casa d'altri. Se la casa e' la
  # tua, qui non c'e' niente da toccare.
  # ─────────────────────────────────────────────────────────────────────────
  chi_installa:
    acceso: bool
    # Le tre chiavi, tutte `password?`, e per gli stessi due motivi: Home
    # Assistant le nasconde mentre si scrivono e non le rimostra dopo, e il `?`
    # fa si' che chi non ne ha bisogno — cioe' quasi tutti — non si trovi un
    # campo obbligatorio da riempire. Si rileggono da dove stanno di casa: sulla
    # macchina del quadro, o da chi le ha consegnate.
    #
    # `gestore: bool` non c'e' piu': l'interruttore e' diventato
    # `chiave_gestione`. Chi aggiorna da una versione che ce l'aveva se lo
    # ritrova tolto dalla scheda, e il valore che ci aveva messo non conta piu'
    # niente — che e' il punto: era un interruttore su case che non c'entravano.
    chiave: password?

  # ─────────────────────────────────────────────────────────────────────────
  # GESTORE DEL QUADRO — una casa sola al mondo. Non e' la tua.
  # ─────────────────────────────────────────────────────────────────────────
  gestione:
    chiave: password?

  # ─────────────────────────────────────────────────────────────────────────
  # ASSISTENZA — chi risponde alle segnalazioni di tutti. Una casa sola.
  # ─────────────────────────────────────────────────────────────────────────
  assistenza:
    chiave: password?

  # ─────────────────────────────────────────────────────────────────────────
  # AVANZATE — due numeri che nessuno cambia mai.
  # ─────────────────────────────────────────────────────────────────────────
  avanzate:
    porta_app: int(1024,65535)
    registro: list(debug|info|attenzione|errore)
