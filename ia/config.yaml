# gdahome AI: l'intelligenza dell'assistente, dentro casa.
#
# «Ingloba Ollama all'interno, che possa essere intelligente.» Questo add-on
# fa girare Ollama con un modello linguistico piccolo, sulla macchina di Home
# Assistant: l'assistente di gdahome (il ponte) gli chiede cosa sono le cose
# della casa che non riconosce dal nome — una «Mensola blu» e' l'acquario? —
# e nessuna domanda esce di casa.
#
# E' un add-on a parte, e non dentro il ponte, per tre motivi:
#
#   - pesa: Ollama e un modello sono un paio di gigabyte, e chi non lo vuole
#     non li deve scaricare a ogni aggiornamento del ponte;
#   - vuole memoria: con meno di 4 GB di RAM libera la casa rallenta, e chi
#     lo installa lo sceglie sapendolo;
#   - si spegne da solo: fermato o disinstallato, il ponte torna alle sue
#     regole, che bastano.
#
# Nessuna porta verso fuori: Ollama ascolta solo sulla rete interna degli
# add-on, dove lo trova il ponte. Da internet, e dal ponte da fuori, non si
# vede niente.
name: gdahome AI
version: "1.13.0"
slug: gdahome_ia
description: "L'intelligenza dell'assistente di gdahome, in casa: Ollama con un modello piccolo, senza mandare niente fuori."
url: https://github.com/danigio15/gdahomeapp/tree/main/ia
# Ollama esiste solo per i 64 bit.
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# Il modello e le sue risposte stanno qui, e restano fra un aggiornamento e
# l'altro.
options:
  modello: "qwen2.5:1.5b"
schema:
  modello: "match(^[a-z0-9][a-z0-9._-]*(:[a-z0-9._-]+)?$)"
