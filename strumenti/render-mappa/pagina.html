<!doctype html>
<meta charset="utf-8" />
<title>Mappa di GdANav</title>
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
<style>
  html,
  body {
    margin: 0;
    background: #0b1220;
    font-family: Roboto, Inter, Arial, sans-serif;
  }
  #schermo {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  [hidden] {
    display: none !important;
  }
  .auto {
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 52px solid #2563eb;
    filter: drop-shadow(0 0 0 #fff) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
  }
  #mappa {
    position: absolute;
    inset: 0;
  }
  /* Il cartello della manovra e la barra in basso: su Android Auto li
   * disegna l'auto (NavigationTemplate), qui sono rifatti uguali sopra la
   * mappa vera per vedere l'insieme. */
  .cartello {
    position: absolute;
    left: 24px;
    top: 24px;
    width: 430px;
    background: #0f5132;
    color: #fff;
    border-radius: 22px;
    padding: 18px 22px;
    box-shadow: 0 10px 30px -10px #000;
  }
  .cartello .riga {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .cartello .freccia {
    font-size: 60px;
    line-height: 1;
  }
  .cartello b {
    font-size: 42px;
  }
  .cartello .via {
    font-size: 25px;
    opacity: 0.92;
  }
  .corsie {
    margin-top: 12px;
    background: #0a3d26;
    border-radius: 14px;
    padding: 8px 14px;
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 38px;
  }
  .corsie span {
    opacity: 0.35;
  }
  .corsie span.si {
    opacity: 1;
  }
  .barra {
    position: absolute;
    left: 24px;
    bottom: 24px;
    background: #111827;
    color: #e5e7eb;
    border-radius: 18px;
    padding: 14px 22px;
    font-size: 25px;
    display: flex;
    gap: 26px;
  }
  .barra b {
    color: #fff;
  }
</style>
<div id="schermo">
  <div id="mappa"></div>
  <div class="cartello" id="cartello" hidden>
    <div class="riga">
      <div class="freccia" id="freccia">↱</div>
      <div>
        <b id="distanza"></b>
        <div class="via" id="via"></div>
      </div>
    </div>
    <div class="corsie" id="corsie" hidden></div>
  </div>
  <div class="barra" id="barra" hidden></div>
</div>
<script src="/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script>
  /* Una scena: una strada vera, un percorso vero (OSRM), lo stile vero di
   * GdANav (`stile-chiaro.json` / `stile-scuro.json`, estratti da
   * `lib/mappa/stile.dart`). La telecamera sta poco prima della manovra,
   * guarda nel verso del percorso, inclinata come in auto. */
  const q = new URLSearchParams(location.search);
  const SCENE = {
    citta: {
      da: [9.216, 45.4868],
      a: [9.2085, 45.4812],
      zoom: 17.2,
      inclinazione: 62,
      zoomImmersiva: 18.9,
    },
    incrocio: {
      da: [9.188, 45.47],
      a: [9.1955, 45.4655],
      zoom: 17.4,
      inclinazione: 62,
      zoomImmersiva: 18.9,
    },
    tangenziale: { da: [9.1004, 45.52], a: [9.071, 45.5262], zoom: 15.6, inclinazione: 60 },
    /* Dove le corsie ci sono: viale Forlanini verso Linate, la Tangenziale
     * Est verso l'A4, la Tangenziale Ovest verso l'A7. */
    forlanini: { da: [9.2245, 45.461], a: [9.277, 45.45], zoom: 16.6, inclinazione: 62 },
    est: { da: [9.258, 45.483], a: [9.287, 45.526], zoom: 16.2, inclinazione: 62 },
    ovest: { da: [9.129, 45.442], a: [9.164, 45.401], zoom: 16.2, inclinazione: 62 },
  };
  /* «oggi»: la mappa di GdANav com'e'. «immersiva»: la proposta — le corsie
   * disegnate sulla strada, la giusta colorata, e la vista piu' bassa e piu'
   * vicina prima della manovra. */
  const immersiva = q.get("modo") === "immersiva";
  const scena = SCENE[q.get("scena")] || SCENE.citta;
  const scuro = q.get("stile") === "scuro";

  const metri = (a, b) => {
    const r = 6371000;
    const f1 = (a[1] * Math.PI) / 180;
    const f2 = (b[1] * Math.PI) / 180;
    const df = f2 - f1;
    const dl = ((b[0] - a[0]) * Math.PI) / 180;
    const h = Math.sin(df / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
    return 2 * r * Math.asin(Math.sqrt(h));
  };
  const direzione = (a, b) => {
    const f1 = (a[1] * Math.PI) / 180;
    const f2 = (b[1] * Math.PI) / 180;
    const dl = ((b[0] - a[0]) * Math.PI) / 180;
    const y = Math.sin(dl) * Math.cos(f2);
    const x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
    return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
  };
  const FRECCE = {
    "sharp right": "↱",
    right: "↱",
    "slight right": "↗",
    straight: "↑",
    "slight left": "↖",
    left: "↰",
    "sharp left": "↰",
    uturn: "↶",
  };

  async function percorso() {
    const url = `https://router.project-osrm.org/route/v1/driving/${scena.da.join(",")};${scena.a.join(",")}?overview=full&geometries=geojson&steps=true`;
    const r = await fetch(url);
    const j = await r.json();
    return j.routes[0];
  }

  (async () => {
    const stile = await (await fetch(`stile-${scuro ? "scuro" : "chiaro"}.json`)).json();
    let rotta = null;
    try {
      rotta = await percorso();
    } catch (_e) {}
    const punti = rotta ? rotta.geometry.coordinates : [scena.da, scena.a];
    /* La manovra: la prima che ha le corsie (cosi' si vedono), se no la
     * prima vera dopo la partenza. */
    const passi = rotta ? rotta.legs[0].steps : [];
    const conCorsie = (p) => (p.intersections?.[0]?.lanes || []).length >= 2;
    const manovra =
      passi.find((p, i) => i > 0 && p.maneuver.type !== "arrive" && conCorsie(p)) ||
      passi.find((p, i) => i > 0 && p.maneuver.type !== "arrive") ||
      passi[0];
    const dove = manovra ? manovra.maneuver.location : punti[Math.floor(punti.length / 2)];
    /* La telecamera: il punto del percorso 110 m prima della manovra. */
    let indice = 0;
    let migliore = Infinity;
    punti.forEach((p, i) => {
      const d = metri(p, dove);
      if (d < migliore) {
        migliore = d;
        indice = i;
      }
    });
    let qui = punti[0];
    let fatti = 0;
    for (let i = indice; i > 0; i -= 1) {
      fatti += metri(punti[i], punti[i - 1]);
      qui = punti[i - 1];
      if (fatti >= (immersiva ? 75 : 110)) break;
    }
    /* Il verso: dove va la strada nei 40 m dopo la telecamera, come
     * l'auto che la percorre. */
    let avanti = dove;
    let fatto = 0;
    for (let i = punti.indexOf(qui); i >= 0 && i < punti.length - 1; i += 1) {
      fatto += metri(punti[i], punti[i + 1]);
      avanti = punti[i + 1];
      if (fatto >= 40) break;
    }
    const verso = direzione(qui, avanti);
    const mappa = new maplibregl.Map({
      container: "mappa",
      style: stile,
      center: qui,
      /* Immersiva: vicina abbastanza da leggere le corsie (una corsia e'
       * larga una trentina di pixel), inclinata ma con l'orizzonte in alto. */
      zoom: immersiva ? (scena.zoomImmersiva ?? 18.8) : scena.zoom,
      pitch: immersiva ? 62 : scena.inclinazione,
      bearing: verso,
      maxPitch: 85,
      attributionControl: false,
      interactive: false,
      preserveDrawingBuffer: true,
      fadeDuration: 0,
    });
    mappa.on("styleimagemissing", (e) => {
      const vuota = { width: 1, height: 1, data: new Uint8Array(4) };
      if (!mappa.hasImage(e.id)) mappa.addImage(e.id, vuota);
    });
    mappa.on("load", () => {
      /* L'auto in basso, la strada davanti: come nel navigatore. Nelle opzioni
       * della mappa il margine non conta: si da' dopo, con la telecamera. */
      mappa.jumpTo({
        center: qui,
        padding: { top: immersiva ? 440 : 380, bottom: 0, left: 0, right: 0 },
      });
      /* Immersiva: le strade larghe quanto sono davvero, in metri e non in
       * pixel, cosi' le corsie (3,5 m l'una) ci stanno dentro. Una carreggiata
       * di autostrada o tangenziale ha tre o quattro corsie: 14 m. */
      if (immersiva) {
        const LARGHE = {
          autostrade: 14,
          "autostrade-bordo": 15.5,
          principali: 10,
          "principali-bordo": 11.5,
          strade: 7,
          "strade-bordo": 8.2,
          servizio: 4,
          "servizio-bordo": 5,
        };
        const coseno = Math.cos((qui[1] * Math.PI) / 180);
        const pixel = (m, z) => (m * 512 * 2 ** z) / (40075016.686 * coseno);
        for (const [id, m] of Object.entries(LARGHE)) {
          if (!mappa.getLayer(id)) continue;
          mappa.setPaintProperty(id, "line-width", [
            "interpolate",
            ["exponential", 2],
            ["zoom"],
            14,
            pixel(m, 14),
            22,
            pixel(m, 22),
          ]);
        }
      }
      /* Immersiva: gli edifici davanti al percorso, un po' trasparenti, cosi'
       * il percorso passa fra le case e non sopra i tetti. */
      if (immersiva && mappa.getLayer("edifici-3d")) {
        mappa.moveLayer("edifici-3d", "percorso-frecce");
        mappa.setPaintProperty("edifici-3d", "fill-extrusion-opacity", 0.82);
      }
      /* Inclinata, come in auto: gli edifici in 3D li accende l'app quando
       * la vista e' inclinata (`RendererMappa.kt`, `MappaCarPlay.swift`). */
      if (immersiva)
        mappa.setSky?.({
          "sky-color": scuro ? "#0b1220" : "#bfdbfe",
          "horizon-color": scuro ? "#1e293b" : "#e0f2fe",
          "sky-horizon-blend": 0.6,
          "horizon-fog-blend": 0.6,
          "fog-color": scuro ? "#111827" : "#f1f5f9",
          "fog-ground-blend": 0.2,
        });
      if (mappa.getLayer("edifici-3d"))
        mappa.setLayoutProperty("edifici-3d", "visibility", "visible");
      const auto = document.createElement("div");
      auto.className = "auto";
      new maplibregl.Marker({
        element: auto,
        rotation: 0,
        rotationAlignment: "map",
        pitchAlignment: "map",
      })
        .setLngLat(qui)
        .setRotation(verso)
        .addTo(mappa);
      const corsieDellaManovra = (manovra?.intersections?.[0]?.lanes || []).filter(Boolean);
      const conLeCorsie = immersiva && corsieDellaManovra.length >= 2;
      if (conLeCorsie) disegnaLeCorsie(corsieDellaManovra);
      /* Il percorso parte dall'auto: quello gia' fatto non si disegna. Con le
       * corsie, fino alla manovra lo disegnano loro, nella corsia giusta. */
      const daQui = punti.slice(conLeCorsie ? indice : punti.indexOf(qui));
      const sorgente = mappa.getSource("gdanav-percorso");
      sorgente?.setData({
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: daQui } },
        ],
      });
      /* La freccia della manovra, come la disegna l'app: 30 m prima e 30 m
       * dopo il punto in cui si gira. */
      if (manovra && !conLeCorsie) {
        const intorno = [];
        let prima = 0;
        for (let i = indice; i > 0 && prima < 30; i -= 1) {
          intorno.unshift(punti[i]);
          prima += metri(punti[i], punti[i - 1]);
        }
        let dopo = 0;
        for (let i = indice; i < punti.length - 1 && dopo < 30; i += 1) {
          if (i > indice) intorno.push(punti[i]);
          dopo += metri(punti[i], punti[i + 1]);
        }
        mappa.getSource("gdanav-manovra")?.setData({
          type: "FeatureCollection",
          features: [
            {
              type: "Feature",
              properties: {},
              geometry: { type: "LineString", coordinates: intorno },
            },
          ],
        });
      }
      /* L'auto: un punto dove sta la telecamera, come nell'app. */
      mappa.getSource("gdanav-io")?.setData({
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { verso }, geometry: { type: "Point", coordinates: qui } },
        ],
      });
      if (manovra) {
        const m = manovra.maneuver;
        document.getElementById("cartello").hidden = false;
        document.getElementById("freccia").textContent = FRECCE[m.modifier] || "↑";
        document.getElementById("distanza").textContent = `${Math.round(fatti / 10) * 10} m`;
        document.getElementById("via").textContent = manovra.name || manovra.ref || "";
        const corsie = (manovra.intersections?.[0]?.lanes || []).filter(Boolean);
        if (corsie.length) {
          const box = document.getElementById("corsie");
          box.hidden = false;
          box.innerHTML = corsie
            .map(
              (c) =>
                `<span class="${c.valid ? "si" : ""}">${FRECCE[(c.indications || ["straight"])[0]] || "↑"}</span>`,
            )
            .join("");
        }
      }
      if (rotta) {
        const barra = document.getElementById("barra");
        barra.hidden = false;
        const min = Math.max(1, Math.round(rotta.duration / 60));
        barra.innerHTML = `<span><b>${min} min</b></span><span><b>${(rotta.distance / 1000).toFixed(1).replace(".", ",")} km</b></span>`;
      }
    });
    /* Le corsie sulla strada, dall'auto alla manovra: tante strisce quante
     * sono le corsie (dal percorso vero, OSRM), larghe 3,5 m, con le righe
     * bianche fra l'una e l'altra. Il percorso qui e' la corsia giusta: piena,
     * del blu del percorso; le altre restano strada. */
    function disegnaLeCorsie(corsie) {
      const da = punti.indexOf(qui);
      const tratto = punti.slice(da, indice + 1);
      if (tratto.length < 2) return;
      const zoom = mappa.getZoom();
      const lat = (qui[1] * Math.PI) / 180;
      const metriPerPixel = (40075016.686 * Math.cos(lat)) / (512 * 2 ** zoom);
      const n = corsie.length;
      /* Le corsie riempiono la carreggiata, larga quanto la strada disegnata
       * (14 m in autostrada): ne' piu' larghe, ne' spostate di lato. */
      const larga = 14 / n / metriPerPixel;
      mappa.addSource("corsie", {
        type: "geojson",
        data: {
          type: "Feature",
          properties: {},
          geometry: { type: "LineString", coordinates: tratto },
        },
      });
      const prima = mappa.getLayer("percorso-alone") ? "percorso-alone" : undefined;
      corsie.forEach((c, i) => {
        const spostata = (i - (n - 1) / 2) * larga;
        mappa.addLayer(
          {
            id: `corsia-${i}`,
            type: "line",
            source: "corsie",
            paint: {
              "line-color": c.valid
                ? scuro
                  ? "#3AB0FF"
                  : "#27A2F8"
                : scuro
                  ? "#475569"
                  : "#cbd5e1",
              "line-opacity": c.valid ? 0.95 : 0.35,
              "line-width": larga * 0.94,
              "line-offset": spostata,
            },
          },
          prima,
        );
      });
      /* Le righe: continue ai bordi della carreggiata, tratteggiate fra una
       * corsia e l'altra. */
      for (let i = 0; i <= n; i += 1) {
        const bordo = i === 0 || i === n;
        mappa.addLayer(
          {
            id: `riga-${i}`,
            type: "line",
            source: "corsie",
            paint: {
              "line-color": "#ffffff",
              "line-opacity": 0.85,
              "line-width": Math.max(1.5, larga * 0.06),
              ...(bordo ? {} : { "line-dasharray": [3, 3] }),
              "line-offset": (i - n / 2) * larga,
            },
          },
          prima,
        );
      }
    }
    mappa.once("idle", () => {
      setTimeout(() => {
        document.body.dataset.pronta = "si";
      }, 1500);
    });
  })();
</script>
