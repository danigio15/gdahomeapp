<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>gdahome — le copertine</title>
    <!--
      Le due copertine di Facebook, disegnate come i video e con gli stessi
      pezzi: stesso marchio, stessi caratteri, stessa plancia.

      Sono due perche' Facebook le taglia in due modi diversi:

      - **il gruppo** vuole 1640×856. Sul telefono la striscia si accorcia e il
        nome del gruppo finisce sopra il bordo di sotto: li' non ci va niente.
      - **la pagina** e' un nastro molto piu' basso, 1640×624. Sul telefono ne
        resta **la parte in mezzo**, due terzi scarsi: quello che sta ai lati
        sparisce. E in basso a sinistra, sul computer, ci finisce sopra la foto
        del profilo.

      Da qui le due regole di questo documento: `.dentro` e' la zona sicura, e
      cambia da una copertina all'altra; quello che sta **fuori** e' apposta
      roba che si puo' perdere.
    -->
    <link rel="stylesheet" href="comune.css" />
    <style>
      #palco {
        width: 1640px;
        height: var(--alto, 856px);
      }

      .scena.in-scena {
        display: block;
      }

      /* La zona sicura: quello che non si deve perdere sta qui dentro. */
      .dentro {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
      }

      .firma {
        display: flex;
        align-items: center;
        gap: 26px;
      }

      .nome {
        margin: 0;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .motto {
        margin: 22px 0 0;
        font-size: 40px;
        line-height: 1.25;
        font-weight: 600;
        color: #dbe7f7;
      }

      .motto b {
        color: #fff;
      }

      .pastiglie {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }

      .pastiglie span {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 15px 26px;
        border-radius: 999px;
        font-size: 25px;
        font-weight: 600;
        color: #cfe0f5;
      }

      .pastiglie span.ambra {
        color: #fcd34d;
        border-color: rgba(245, 158, 11, 0.45);
      }

      .pastiglie span.verde {
        color: #86efac;
        border-color: rgba(22, 163, 74, 0.45);
      }

      /* Le tessere di contorno: stanno **fuori** dalla zona sicura, e sono
         li' apposta perche' si possano perdere senza che manchi niente. */
      .contorno {
        position: absolute;
        display: grid;
        gap: 18px;
        opacity: 0.5;
      }

      .contorno > div {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        font-size: 23px;
        font-weight: 600;
        color: #9db0cc;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="palco"></div>
    <script type="module" src="copertine.js"></script>
  </body>
</html>
