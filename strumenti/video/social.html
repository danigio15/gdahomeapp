<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>gdahome — per i social</title>
    <!--
      Il film corto, quello che va su Facebook e su TikTok.

      E' **lo stesso film** per tutti e due: cambia quanto e' alto il palco e
      quanto spazio si lascia sopra e sotto, e a dirglielo e' l'indirizzo —
      `social.html?alto=1920&su=200&giu=380`. Lo spazio sotto non e' un
      capriccio: su TikTok li' ci stanno il testo, i tasti e il nome di chi
      pubblica, e quello che ci finisce sotto non lo legge nessuno.

      Per questo le scene qui **non sono disegnate a coordinate**, come nel
      film lungo: sono colonne. Una fila di blocchi in mezzo allo schermo, che
      si dispongono da soli con lo spazio che trovano — e quello che trovano su
      un palco quadrato e su uno in piedi e' diverso.
    -->
    <link rel="stylesheet" href="comune.css" />
    <style>
      /* Il palco: largo sempre 1080, alto quanto dice l'indirizzo. */
      #palco {
        width: 1080px;
        height: var(--alto, 1080px);
      }

      .scena {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: var(--su, 72px) 64px var(--giu, 72px);
      }

      .scena.in-scena {
        display: flex;
      }

      /* La colonna. `--zoom` la ingrandisce dove c'e' piu' posto: su un palco
         in piedi lo stesso contenuto ha trecento pixel di aria in piu', e
         lasciarli vuoti vorrebbe dire un video che si legge peggio.
         La larghezza si divide per lo stesso numero per cui si moltiplica:
         se no ingrandire vuol dire anche **sbordare**, e le schede uscivano
         dallo schermo di lato mezze tagliate. Cosi' invece la colonna resta
         larga quanto lo schermo e a crescere e' solo quello che c'e' scritto
         dentro. */
      .colonna {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--aria, 30px);
        width: calc(100% / var(--zoom, 1));
        transform: scale(var(--zoom, 1));
      }

      .titolo {
        margin: 0;
        font-size: 60px;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
      }

      .titolo.piccolo {
        font-size: 46px;
      }

      .enorme {
        margin: 0;
        font-size: 96px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.04em;
        text-align: center;
        background: linear-gradient(120deg, #7dd3fc 10%, #fcd34d 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sotto {
        margin: 0;
        font-size: 33px;
        line-height: 1.4;
        color: var(--tenue);
        text-align: center;
        font-weight: 500;
      }

      .sotto b {
        color: #eef4ff;
        font-weight: 700;
      }

      /* Il marchio in cima, piccolo: chi guarda deve sapere di chi e' il video
         anche se gli scorre via in due secondi. */
      .firma {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      /* Una riga di elenco: il disegnino, e quello che dice. */
      .voce-grande {
        display: flex;
        align-items: center;
        gap: 22px;
        width: 100%;
        padding: 22px 26px;
        font-size: 34px;
        line-height: 1.3;
        font-weight: 600;
      }

      .voce-grande .bollo {
        flex: 0 0 auto;
        width: 62px;
        height: 62px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 800;
      }

      .voce-grande .quando {
        margin-top: 4px;
        display: block;
        font-size: 27px;
        font-weight: 500;
        color: var(--tenue);
      }

      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 18px 30px;
        font-size: 31px;
        font-weight: 700;
        border-radius: 999px;
      }

      /* La griglia delle sezioni: due colonne di tessere, come nella plancia. */
      .sezioni {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        width: 100%;
      }

      .sezioni > div {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 20px 22px;
        font-size: 31px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="palco"></div>
    <script type="module" src="social.js"></script>
  </body>
</html>
