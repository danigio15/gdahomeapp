# Il centralino sulla nuvola di Cloudflare.
#
# Si mette in piedi cosi', e non costa niente:
#
#     npm install
#     npx wrangler login
#     npx wrangler deploy
#
# L'indirizzo esce da solo: `centralino.<il-tuo-nome>.workers.dev`. Nessun
# dominio da comprare, nessun server da pagare, nessuna macchina da tenere
# aggiornata.
# Il nome e' unico per account, e `wrangler deploy` non chiede il permesso:
# se ne trova uno che si chiama uguale, ci scrive sopra. «centralino» da solo
# e' troppo comune per essere sicuro — in un account ci finiscono le cose di
# tutti i progetti — quindi porta davanti il nome di questo.
name = "gdahome-centralino"
main = "src/index.js"
compatibility_date = "2025-04-01"

# L'indirizzo `centralino.<nome>.workers.dev` arriva insieme, e non c'e'
# nessun dominio da comprare.
workers_dev = true

# Ogni versione pubblicata, se non si dice il contrario, resta raggiungibile
# per sempre al proprio indirizzo. Per un centralino non serve a niente e non
# e' ordinato: le case chiamano l'indirizzo di adesso, e le versioni di ieri
# non devono restare accese a fare da centralino a nessuno.
preview_urls = false

# Una casa per Durable Object. Ogni casa e' un oggetto suo, che dorme quando
# non passa niente e si sveglia quando arriva un telefono.
[[durable_objects.bindings]]
name = "CASE"
class_name = "Casa"

# Un oggettino per ogni codice di abbinamento vivo: dice a quale casa
# appartiene quell'impronta, e sparisce da solo.
[[durable_objects.bindings]]
name = "CODICI"
class_name = "Codice"

# Il freno: uno solo per tutto il centralino. Conta quello che da dentro una
# casa non si vede — quante case sono nate nell'ultima ora, quante
# segnalazioni sono partite in tutto — e dice «basta» quando e' troppo.
[[durable_objects.bindings]]
name = "FRENO"
class_name = "Freno"

# SQLite invece di key-value: e' quello che il piano gratuito permette.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Casa", "Codice"]

# Il freno e' arrivato dopo, e un oggetto nuovo vuole una migrazione sua: le
# migrazioni gia' fatte non si riscrivono.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Freno"]

[observability]
enabled = true

# Le segnalazioni e la chat di assistenza diventano issue di GitHub in questa
# repository. Il gettone che le scrive e' un segreto e NON sta qui: e' il
# segreto `GITHUB_SEGNALAZIONI` del worker, e ce lo porta il bottone «Il
# centralino» su Actions dal segreto `GETTONE_SEGNALAZIONI` della
# repository, o `npx wrangler secret put GITHUB_SEGNALAZIONI` da un
# terminale. Senza gettone il centralino risponde «segnalazioni non
# configurate», e l'app lo dice.
#
# Il gettone deve essere **a grana fine** (Fine-grained token), con accesso
# alle sole repository qui sotto e ai soli permessi che servono: «Issues:
# Read and write» su GITHUB_REPO, «Contents: Read and write» su
# GITHUB_REPO_ALLEGATI. Un token classico apre tutte le repository di chi
# lo ha fatto, ed e' proprio quello che non deve succedere.
#
# Quante case nuove e quante scritture verso GitHub all'ora: i numeri di
# serie stanno in `src/casa.js`, e si cambiano da qui aggiungendo sotto
# [vars] CASE_NUOVE_PER_INDIRIZZO, CASE_NUOVE_IN_TUTTO,
# SCRITTURE_PER_INDIRIZZO, SCRITTURE_IN_TUTTO.
[vars]
# Dove finiscono le segnalazioni: le **issue** nella repository del progetto,
# perche' e' li' che la gente le cerca — e chi apre gdahomeapp le trova, senza
# sapere che esiste un'altra repository.
GITHUB_REPO = "danigio15/gdahomeapp"

# E le **foto e i video** nella stessa: chi guarda una segnalazione vuole
# vedere l'allegato senza andarlo a cercare da un'altra parte.
#
# Una cosa da sapere, perche' non si vede da qui: gli allegati non sono
# allegati di GitHub — l'API non ha un modo di attaccare un file a una issue —
# quindi si **committano** dentro la repository, sotto `allegati/<numero>/`, e
# restano nella storia di git. E questa e' la repository che Home Assistant
# clona per installare l'add-on.
#
# Per questo vanno su un **ramo a parte**, `allegati` (qui sotto): stanno
# nella stessa repository, si aprono dalla segnalazione, ma non finiscono nel
# ramo principale che Home Assistant scarica. Il ramo lo crea il centralino
# al primo allegato, partendo dalla punta del ramo principale.
#
# **Da fare a mano, ed e' la cosa migliore:** una repository a parte solo per
# gli allegati (per esempio `danigio15/gdahome-allegati`), scritta qui sotto
# al posto di questa, col gettone che puo' scrivere su quella e solo «Issues»
# su gdahomeapp. Cosi' il gettone non puo' scrivere nemmeno un file nella
# repository del progetto — dove sta il codice che finisce nelle case.
#
# Il gettone vuole «Issues: Read and write» su GITHUB_REPO **e** «Contents:
# Read and write» su questa. Il bottone «Il centralino» su Actions le prova
# tutte e due prima di accendere niente.
GITHUB_REPO_ALLEGATI = "danigio15/gdahomeapp"
GITHUB_RAMO_ALLEGATI = "allegati"

# gdahome da aprire in un browser, servita da qui.
#
# **Questo blocco sta in fondo apposta.** In TOML tutto quello che viene dopo
# un `[tabella]` ci finisce dentro: mettendolo in mezzo si e' portato via
# `preview_urls`, che e' una riga di primo livello, e Cloudflare ha risposto
# «Unexpected fields found in assets field: preview_urls» riaccendendo le
# Preview URL. Le righe sciolte vanno tutte prima della prima tabella.
#
# Il perche' di tutto il resto: dentro Home Assistant l'app web sta dietro
# l'ingress, e quell'indirizzo non e' un link — vive finche' vive la pagina di
# Home Assistant che lo tiene aperto, e in una scheda a parte dopo qualche
# minuto risponde «401». Serviva un indirizzo vero, da aprire ovunque e anche
# fuori casa, e questo e' il posto giusto: il centralino e' gia' pubblico, e'
# gia' in `https` — che serve, perche' la plancia nel browser la disegna un
# service worker e i browser i service worker li accendono solo su `https` — e
# non costa niente di piu'.
#
# Cosa diventa pubblico: **solo l'app**. Non la plancia, che la serve l'add-on
# di casa e passa dal filo cifrato; non la configurazione; non nessuna casa.
# Chi apre quel link vede «Colleghiamo la casa» e senza un codice di
# abbinamento non va da nessuna parte — e' la stessa porta del telefono.
#
# I file stanno in `pubblico/app/`, che non e' nella repository: ce li mette il
# bottone «Il centralino» su Actions copiandoli da `ponte/app` — la stessa app
# costruita che sta dentro l'add-on, cosi' non ce n'e' una seconda da tenere
# aggiornata.
#
# `not_found_handling = "none"`: quello che qui dentro non c'e' passa al
# centralino, che e' quello che deve succedere per `/casa/…`, `/telefono/…` e
# `/abbinamento/…`.
[assets]
directory = "./pubblico"
not_found_handling = "none"
