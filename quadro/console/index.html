       * manda — una senza System Monitor non manda la macchina. Per un pezzo
       * la pagina lo disegnava come le righe rotte, cioe' faceva vedere un
       * guaio dove c'era solo silenzio. Adesso il silenzio ha un colore suo,
       * spento, e si legge per quello che e'. */
      const comeVa = (uno) => (uno.va === true ? "bene" : uno.va === false ? "male" : "ignoto");

      const IL_BOLLINO = { bene: "✓", male: "✗", ignoto: "◇" };

      /* Quello che sente chi legge lo schermo con le orecchie: il bollino e'
       * un disegno, e da solo non dice niente. */
      const A_PAROLE = { bene: "in ordine", male: "anomalia", ignoto: "non rilevato" };

      /* Di chi sono le icone degli aggiornamenti che si disegnano: le sue,
       * di chi guarda. */
      const diChiSonoLeIcone = () => IO.chi;

      /* Il segno di un aggiornamento: il logo di chi lo porta, o l'iniziale.
       *
       * Tre casi, in ordine. La roba nostra porta il bollo del quadro, che e'
       * disegnato qui e non si scarica da nessuna parte. Chi ha un marchio lo
       * fa vedere — e sotto c'e' comunque l'iniziale, cosi' una casa senza
       * internet o un marchio che non esiste finiscono sulla lettera invece
       * che su un quadratino rotto. Chi non ce l'ha resta sull'iniziale, che
       * e' quello che fa gia' l'app.
       *
       * Se l'immagine non arriva si toglie, e scopre la lettera che sta sotto. */
      function ilSegnoDi(uno) {
        if (uno.nostra)
          return '<span class="bollo" aria-hidden="true"><i></i><i class="mezzo"></i><i></i></span>';
        const primo = testo(
          String(uno.nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase() || "?",
        );
        /* **L'icona vera, e arriva dalla casa.**
         *
         * Prima si mandava questo browser su `brands.home-assistant.io` con una
         * parola presa dal rapporto, e c'erano due guai in uno: questo browser
         * andava a farsi vedere da una macchina che non e' la sua, e quello che
         * trovava era sbagliato — il logo di HACS al posto di quello
         * dell'applicazione (per un'integrazione installata da HACS quella
         * parola **e'** `hacs`), e niente del tutto per un firmware, che una
         * parola non ce l'ha.
         *
         * L'icona giusta ce l'ha la casa: gliela da' il suo Supervisor per gli
         * add-on e i marchi per le integrazioni, che e' esattamente quello che
         * il ponte fa gia' per l'app sul telefono. La manda una volta sola, e
         * il quadro la serve dal suo indirizzo.
         *
         * Il segno e' sedici cifre esadecimali, ricontrollate qui: finisce
         * dentro un indirizzo, e chi lo compone e' questa riga. Un controllo
         * solo, dall'altra parte di una rete, non e' un controllo. */
        if (!/^[0-9a-f]{16}$/.test(String(uno.segno || "")))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* La lettera resta sotto: finche' l'icona non e' arrivata — il primo
         * giro dopo che un aggiornamento compare — la riga si legge lo stesso,
         * e se non arrivera' mai si legge per sempre. */
        /* `../segno/`, con il punto punto.
         *
         * Questa pagina sta in `/console/`, e un indirizzo scritto `segno/…`
         * si legge da li': `/console/segno/…`, dove non c'e' niente. L'icona
         * si serve da `/segno/…`, che sta una cartella piu' su — senza chiave,
         * perche' un'icona di Mosquitto non e' roba di nessuno.
         *
         * Scritto `/segno/…` con la barra davanti funzionerebbe qui e si
         * romperebbe dietro un proxy che monta il quadro sotto un prefisso.
         * Con il punto punto si conta dalla pagina, e vale in tutt'e due i
         * casi. */
        /* Con davanti l'installatore: le icone stanno nella sua cartella
         * (`src/segni.js`), e l'indirizzo lo dice. */
        const diChi = String(diChiSonoLeIcone() || "");
        if (!/^inst_[0-9a-f]{16}$/.test(diChi))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* Un'icona che non arriva si toglie, e sotto resta la lettera: lo fa
         * l'ascolto in cima allo script, e non un `onerror` scritto
         * dentro il tag — la politica della pagina lascia girare solo gli
         * script che sono nel file. */
        return `<span class="segno">${/* già HTML */ primo}<img
          src="../segno/${testo(diChi)}/${testo(uno.segno)}"
          alt=""
          loading="lazy"
          data-se-non-arriva="via"
        /></span>`;
      }

      /* Cosa cambia, con le parole di chi l'ha scritto.
       *
       * E' il `release_summary` dell'entita', che Home Assistant taglia gia'
       * corto. Va disegnato **come testo**: arriva da fuori, e qui dentro non
       * ci si fida di niente che arrivi da fuori. Le note lunghe stanno a un
       * indirizzo, e per leggerle serve il filo con la casa — che il quadro
       * non ha — quindi li' si manda il browser.
       *
       * Niente di tutto questo e' obbligatorio: chi non dice niente non
       * occupa una riga vuota. */
      function cosaCambia(uno) {
        const detto = testo(String(uno.cosaCambia || "").trim());
        /* Le note intere si aprono **qui**, non fuori.
         *
         * Prima era un collegamento che portava sul sito di chi ha scritto
         * l'aggiornamento: leggere cosa cambia prima di premere «Installa»
         * voleva dire uscire dal cruscotto, e chi esce non sempre torna. Adesso
         * le note le manda la casa insieme all'icona, e si aprono sotto la
         * riga.
         *
         * Il tasto c'e' solo se ci sono davvero: il quadro le ha ricevute e le
         * tiene. Se non ci sono, resta il riassunto — e se non c'e' nemmeno
         * quello, la riga non si allunga per niente. */
        const suo = String(uno.segno || "");
        const note = /^[0-9a-f]{16}$/.test(suo) && CON_LE_NOTE.has(suo);
        const dentro = note
          ? ` <button type="button" class="comeUnLink" data-note="${testo(suo)}">cosa cambia, per intero</button>`
          : "";
        if (!detto && !dentro) return "";
        return `<p class="cambia">${/* già HTML */ detto}${/* già HTML */ dentro}</p><div class="leNote" data-note-di="${testo(suo)}" data-note-a="${testo(String(uno.a || ""))}" hidden></div>`;
      }

      /* Una riga di aggiornamento: il segno, cosa e', cosa si fa, cosa cambia.
       *
       * Una sola, e la usano tutt'e due le schermate — la scheda di una casa e
       * la flotta. Prima erano due disegni diversi per la stessa cosa: righe
       * di qua, pastigline di la', e nella flotta non si vedeva ne' il logo ne'
       * cosa cambiava. Due disegni per una cosa sola vuol dire che uno dei due
       * resta indietro, ed era sempre lo stesso.
       *
       * `fare` e' quello che si puo' fare su questa riga: lo passa chi disegna,
       * perche' dipende dalla casa — la manutenzione aperta, un lavoro in
       * ballo — e non dall'aggiornamento. */
      function unaRiga(uno, { fare = "" } = {}) {
        return `
          <li>
            ${ilSegnoDi(uno)}
            <span class="che">
              <b>${testo(uno.nome)}</b>
              <span class="salto">${testo(uno.da)} → ${testo(uno.a)}</span>
            </span>
            <span class="fare">${/* già HTML */ fare}</span>
            ${cosaCambia(uno)}
          </li>`;
      }

      const spia = (stato) =>
        `<span class="pastiglia ${testo(stato.chiave)}"><span aria-hidden="true">${testo(stato.segno)}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` offline, spazio «non c'era
       * ancora». */
      function laStriscia(giorni, grande = false) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="offline tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="offline per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non ancora abbinato"></i>';
            return '<i title="tutti i rapporti ricevuti"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} dall'abbinamento`
            : vuoti === 0
              ? "14 giorni, sempre online"
              : `14 giorni · offline ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="giorni${grande ? " grande" : ""}" role="img" aria-label="${testo(dice)}">${/* già HTML */ celle}</div><div class="giorniDice">${testo(dice)}</div>`;
      }

      /* La prima fila e' «tutti»: e' quella accesa quando si apre la pagina,
       * e premere una delle altre tre filtra. Senza, a pagina aperta nessuna
       * fila era accesa, e non si capiva che si premono. */
      const LE_FILE = [
        ["tutte", "◎", "tutti"],
        ["offline", "■", "offline"],
        ["guardare", "▲", "da verificare"],
        ["posto", "●", "in ordine"],
      ];

      /* L'indirizzo a cui scrivere se l'utenza e' congelata, o `null` se non lo
       * e'. Lo dice il server insieme al no: la pagina non se lo inventa. */
      /* Di quali aggiornamenti il quadro ha le note intere. Lo dice lui
       * insieme alle case: la pagina non lo indovina. */
      let CON_LE_NOTE = new Set();

      let CONGELATA = null;

      let schermata = "case";
      let filtro = "tutte";
      /* La casa aperta nel foglio, o `null`. Si tiene per matricola e non per
       * posto nell'elenco: fra un giro e l'altro l'ordine puo' cambiare, e la
       * scheda deve restare sulla stessa casa. `soloGuai` e' la vista che si
       * apre da «Da guardare adesso»; `appena` dice che il foglio deve ancora
       * salire, cioe' che l'apertura va disegnata con la sua animazione;
       * `chiudendo` che sta scendendo. */
      let foglioAperto = null;
      /* Quale schermata e' stata disegnata l'ultima volta: l'anello si apre
       * con la sua animazione la prima volta che si vede, non a ogni giro da
       * dieci secondi. */
      let disegnata = "";
      /* L'ora dell'ultimo rapporto di ogni casa, com'era all'ultimo disegno:
       * quando cambia, la mattonella batte una volta. */
      const VISTI = new Map();

      const dove = document.getElementById("dove");
      const doveNav = document.getElementById("nav");

      /* L'avviso in basso: una riga che compare e se ne va. Al posto di
       * `window.alert`, che sul telefono si apre come un guasto di sistema
       * («la pagina all'indirizzo … dice»). */
      const avviso = document.getElementById("avviso");
      let tempoDellAvviso = null;
      function avvisa(cosa) {
        avviso.textContent = cosa;
        avviso.classList.add("su");
        clearTimeout(tempoDellAvviso);
        tempoDellAvviso = setTimeout(() => avviso.classList.remove("su"), 2600);
      }

      /* Il cartello di chi ha l'utenza congelata.
       *
       * Prende tutta la pagina, e non e' una striscia in cima: una striscia
       * sopra un elenco di impianti vorrebbe dire che gli impianti si vedono
       * lo stesso, e il punto e' che non si vedono. Sotto non c'e' niente,
       * perche' dal server non e' arrivato niente. */
      function ilGelo() {
        doveNav.innerHTML = "";
        document.getElementById("chi").textContent = "Cruscotto installatore";
        dove.innerHTML = `
          <section class="riquadro" style="max-width: 640px; margin: 40px auto">
            <div class="capoRiquadro"><h3>Utenza sospesa</h3></div>
            <p style="margin: 0 0 14px; font-size: 1rem; line-height: 1.55">
              <b>La tua utenza è stata sospesa dal gestore.</b> Contatta il seguente indirizzo:
            </p>
            <p style="margin: 0 0 18px; font-size: 1.05rem">
              <a href="mailto:${testo(CONGELATA)}">${testo(CONGELATA)}</a>
            </p>
            <p class="nota" style="margin: 0">
              Gli impianti che segui continuano a funzionare e a inviare i loro rapporti: qui non si vedono, ma non si perde niente. Quando la sospensione viene tolta, questa pagina torna com'era da sola.
            </p>
          </section>`;
      }

      function disegna() {
        if (CONGELATA !== null) {
          ilGelo();
          return;
        }
        disegnaLoStatoDellEditor();
        const dietro = CASE.filter((una) => (una.carta?.aggiornamenti?.elenco || []).length).length;
        doveNav.innerHTML = [
          ["case", "Impianti", 0],
          ["aggiornamenti", "Aggiornamenti", dietro],
          /* La pastiglia conta **solo i codici in attesa**, e non piu' anche le
             case senza nome.
             Sommandole, una casa appena abbinata lasciava «Abbina 1» acceso, e
             quel numero si legge in un modo solo: c'e' un abbinamento che non
             e' andato. Invece e' andato — manca un nome, che e' un'altra cosa
             e si vede da se', perche' quella casa nell'elenco si chiama
             `casa_99592daf…`. */
          ["abbina", "Abbinamento", INVITI.length],
        ]
          .map(
            ([quale, parola, quanti]) => `
            <button type="button" data-schermata="${testo(quale)}" aria-pressed="${schermata === quale}">
              ${LE_ICONE[quale]}<span>${testo(parola)}</span>${quanti ? `<span class="quanti">${Number(quanti)}</span>` : ""}
            </button>`,
          )
          .join("");

        /* Il tondo in testata: il marchio dell'installatore se c'e', le sue
         * iniziali se no. E il titolo diventa il suo nome. Senza nome la
         * pagina resta quella di prima — non si fa un buco in cima per una
         * cosa facoltativa. */
        const suo = document.getElementById("suo-marchio");
        suo.hidden = !IO.marchio;
        if (IO.marchio && suo.getAttribute("src") !== ilSuoMarchio()) {
          suo.src = ilSuoMarchio();
        }
        document.getElementById("sigla").textContent = laSigla(IO.nome);
        document.getElementById("come-si-chiama").textContent = IO.nome || "Cruscotto installatore";

        const restano = quanteRestano();
        document.getElementById("chi").textContent =
          (IO.nome ? "Cruscotto installatore · " : "") +
          plurale(CASE.length, "impianto", "impianti") +
          (restano === null ? "" : ` · ${restano} disponibili`);

        /* Il foglio si ridisegna insieme al resto, e il punto a cui era
         * scorso si tiene: un giro da dieci secondi non deve riportare in
         * cima chi sta leggendo il fondo di una scheda. */
        const corpoDiPrima = dove.querySelector("#foglio-corpo");
        const scorsoA = corpoDiPrima ? corpoDiPrima.scrollTop : 0;
        const primaVolta = disegnata !== schermata;
        disegnata = schermata;

        dove.innerHTML =
          (schermata === "case"
            ? leCase(primaVolta)
            : schermata === "aggiornamenti"
              ? laFlotta()
              : lAbbinamento()) + ilFoglio();

        for (const una of CASE) if (una.carta?.quando) VISTI.set(una.casa, una.carta.quando);

        if (primaVolta) apriGliArchi(dove);
        const corpo = dove.querySelector("#foglio-corpo");
        if (corpo && !foglioAperto?.appena) corpo.scrollTop = scorsoA;
        document.body.classList.toggle("col-foglio", Boolean(foglioAperto));
        if (foglioAperto?.appena) {
          /* Sale al frame dopo: creato gia' «su» non si vedrebbe salire. */
          foglioAperto.appena = false;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              dove.querySelectorAll(".velo, .foglio").forEach((uno) => uno.classList.add("su"));
              apriGliArchi(dove.querySelector(".foglio"));
            }),
          );
        }

        /* Il marchio: si sceglie un file e parte, senza un tasto «Salva».
         * Scegliere un file **e'** gia' la conferma: un secondo tasto sarebbe
         * un passaggio in piu' per una cosa che si annulla ricaricando. */
        /* Ce n'e' uno nella pagina Abbinamento e uno nel capitolo «Le plance»
         * di ogni casa: e' lo stesso logo, e la stessa strada. */
        dove.querySelectorAll("[data-scegli-marchio]").forEach((scegli) => {
          scegli.onchange = async () => {
            const file = scegli.files?.[0];
            if (!file) return;
            const riga = scegli
              .closest(".provaMarchio")
              ?.parentElement?.querySelector("[data-esito-marchio]");
            const dillo = (che) => {
              if (!riga) return;
              riga.textContent = che;
              riga.hidden = false;
            };
            scegli.disabled = true;
            try {
              const detto = await chiedi("/io/marchio", {
                method: "PUT",
                /* I byte com'e', non un JSON con dentro un base64: il server
                 * guarda **come comincia il file** per sapere che roba e', e
                 * un base64 comincia sempre uguale. */
                body: await file.arrayBuffer(),
                headers: { "content-type": file.type || "application/octet-stream" },
              });
              IO.marchio = detto.marchio || "";
              dillo("Salvato.");
              disegna();
            } catch (errore) {
              if (errore instanceof ChiaveNoNo) {
                chiedimiLaChiave();
                return;
              }
              dillo(errore.message || "non ha funzionato");
            } finally {
              scegli.disabled = false;
            }
          };
        });
        dove.querySelectorAll("[data-togli-marchio]").forEach((togliIlMarchio) => {
          togliIlMarchio.onclick = () =>
            faiEpoi(togliIlMarchio, async () => {
              await chiedi("/io/marchio", { method: "DELETE" });
              IO.marchio = "";
            });
        });

        dove.querySelectorAll("[data-filtro]").forEach((tasto) => {
          tasto.onclick = () => {
            filtro = filtro === tasto.dataset.filtro ? "tutte" : tasto.dataset.filtro;
            disegna();
          };
        });
        dove.querySelectorAll("[data-casa]").forEach((tasto) => {
          tasto.onclick = () => {
            const casa = CASE[Number(tasto.dataset.casa)];
            if (!casa) return;
            foglioAperto = {
              casa: casa.casa,
              soloGuai: tasto.dataset.soloGuai === "sì",
              appena: true,
            };
            disegna();
          };
        });
        dove.querySelectorAll("[data-chiudi]").forEach((tasto) => {
          tasto.onclick = chiudiIlFoglio;
        });
        const tutto = dove.querySelector("[data-tutto]");
        if (tutto)
          tutto.onclick = () => {
            if (!foglioAperto) return;
            foglioAperto.soloGuai = false;
            disegna();
            const corpo = dove.querySelector("#foglio-corpo");
            if (corpo) corpo.scrollTop = 0;
          };

        /* I tasti che cambiano qualcosa. Ognuno fa la sua chiamata, ricarica e
         * ridisegna: non si tocca niente a schermo prima che il server abbia
         * detto di sì, se no si vedrebbe una cosa che non è successa. */
        dove.querySelectorAll("[data-fai]").forEach((tasto) => {
          tasto.onclick = () =>
            faiEpoi(tasto, async () => {
              const fatto = await chiedi("/inviti", {
                method: "POST",
                body: JSON.stringify({ per: dove.querySelector("#per-chi")?.value || "" }),
              });
              /* Il codice intero si vede adesso e basta: il quadro ne tiene
               * l'impronta. Lo si ricorda in questa pagina, finche' resta
               * aperta, per poterlo copiare. */
              if (fatto?.id && fatto?.codice)
                APPENA_FATTI.set(String(fatto.id), String(fatto.codice));
            });
        });
        dove.querySelectorAll("[data-annulla]").forEach((tasto) => {
          tasto.onclick = () =>
            faiEpoi(tasto, () =>
              chiedi(`/inviti/${encodeURIComponent(tasto.dataset.annulla)}`, { method: "DELETE" }),
            );
        });
        dove.querySelectorAll("[data-tieni]").forEach((tasto) => {
          tasto.onclick = () => {
            const casella = dove.querySelector(`[data-nome="${tasto.dataset.tieni}"]`);
            const nome = (casella?.value || "").trim();
            if (!nome) {
              casella?.focus();
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.tieni}`, {
                method: "PUT",
                body: JSON.stringify({ nome }),
              }),
            );
          };
        });
        dove.querySelectorAll("[data-apri-rinomina]").forEach((tasto) => {
          tasto.onclick = () => {
            const quale = tasto.dataset.apriRinomina;
            const riga = dove.querySelector(`[data-rinomina-per="${quale}"]`);
            if (!riga) return;
            riga.hidden = !riga.hidden;
            if (!riga.hidden) {
              const casella = riga.querySelector("[data-rinomina-nome]");
              casella?.focus();
              casella?.select();
            }
          };
        });
        dove.querySelectorAll("[data-rinomina]").forEach((tasto) => {
          const quale = tasto.dataset.rinomina;
          const casella = dove.querySelector(`[data-rinomina-nome="${quale}"]`);
          const salva = () => {
            const nome = (casella?.value || "").trim();
            /* Vuoto non si manda: svuotare il nome vorrebbe dire rimettere la
             * casa fra quelle senza nome, e non e' quello che si chiede
             * premendo «Rinomina». Chi vuole toglierlo ha «Non seguirla piu'». */
            if (!nome) {
              casella?.focus();
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${quale}`, { method: "PUT", body: JSON.stringify({ nome }) }),
            );
          };
          tasto.onclick = salva;
          if (casella)
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") salva();
            };
        });
        /* Le vesti di una plancia: i due nomi si salvano insieme, col tasto o
         * con Invio da una delle due caselle. Vuoti tutti e due tolgono la
         * scelta. Il no del server — «aggiorna l'add-on», «non e' tua» — lo
         * mostra `faiEpoi`, come per tutto il resto. */
        dove.querySelectorAll("[data-salva-veste]").forEach((tasto) => {
          const riga = tasto.closest("[data-veste]");
          const salva = () =>
            faiEpoi(tasto, async () => {
              await chiedi(
                `/casa/${tasto.dataset.perCasa}/plancia/${encodeURIComponent(tasto.dataset.salvaVeste)}`,
                {
                  method: "PUT",
                  body: JSON.stringify({
                    titolo: riga?.querySelector("[data-veste-titolo]")?.value || "",
                    velo: riga?.querySelector("[data-veste-velo]")?.value || "",
                  }),
                },
              );
              avvisa("Salvato: arriva in casa col rapporto dopo");
            });
          tasto.onclick = salva;
          riga?.querySelectorAll("input").forEach((casella) => {
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") salva();
            };
          });
        });
        /* Una in attesa si annulla svuotando le sue vesti: la casa non la
         * crea. Vale finche' la casa non l'ha creata, cioe' un minuto. */
        dove.querySelectorAll("[data-annulla-veste]").forEach((tasto) => {
          tasto.onclick = () =>
            faiEpoi(tasto, async () => {
              await chiedi(
                `/casa/${tasto.dataset.perCasa}/plancia/${encodeURIComponent(tasto.dataset.annullaVeste)}`,
                { method: "PUT", body: JSON.stringify({ titolo: "", velo: "" }) },
              );
              avvisa("Annullata: la casa non la crea");
            });
        });
        /* Una plancia in piu': qui nasce la scelta, la casa la crea al
         * rapporto dopo e da li' in poi e' una riga come le altre. */
        dove.querySelectorAll("[data-nuova-plancia]").forEach((tasto) => {
          const riga = tasto.closest(".veste");
          const aggiungi = () => {
            const casella = riga?.querySelector("[data-nuova-titolo]");
            const titolo = (casella?.value || "").trim();
            if (!titolo) {
              casella?.focus();
              avvisa("Serve il nome della plancia");
              return;
            }
            faiEpoi(tasto, async () => {
              await chiedi(`/casa/${tasto.dataset.nuovaPlancia}/plance`, {
                method: "POST",
                body: JSON.stringify({
                  titolo,
                  velo: riga?.querySelector("[data-nuova-velo]")?.value || "",
                }),
              });
              avvisa("Aggiunta: la casa la crea al rapporto dopo");
            });
          };
          tasto.onclick = aggiungi;
          riga?.querySelectorAll("input").forEach((casella) => {
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") aggiungi();
            };
          });
        });
        /* «Cosa cambia, per intero»: si apre sotto la riga, e si richiude.
         *
         * Il testo si chiede quando serve e non prima: un CHANGELOG per ogni
         * aggiornamento di ogni casa, a ogni giro da dieci secondi, sarebbe
         * roba che viaggia per niente — quasi nessuno li apre. */
        dove.querySelectorAll("[data-note]").forEach((tasto) => {
          tasto.onclick = async () => {
            const suo = tasto.dataset.note;
            const riquadro = dove.querySelector(`[data-note-di="${suo}"]`);
            if (!riquadro) return;
            if (!riquadro.hidden) {
              riquadro.hidden = true;
              tasto.textContent = "cosa cambia, per intero";
              return;
            }
            riquadro.hidden = false;
            tasto.textContent = "chiudi";
            if (riquadro.dataset.gia === "sì") return;
            riquadro.textContent = "…";
            try {
              const detto = await chiedi(`/note/${suo}`);
              /* Disegnate, e dalla versione nuova in giu': le stesse note,
               * lette nello stesso modo dell'app. `ilMarkdown` e' l'unico
               * posto del quadro che mette dentro la pagina roba venuta da
               * fuori, e prima di metterla la scappa tutta. */
              const disegnate = ilMarkdown(
                daQuellaVersione(String(detto.note || "").trim(), riquadro.dataset.noteA || ""),
              );
              if (disegnate) riquadro.innerHTML = disegnate;
              else riquadro.textContent = "le note sono arrivate vuote";
              riquadro.dataset.gia = "sì";
            } catch (errore) {
              if (errore instanceof Congelata) {
                disegna();
                return;
              }
              riquadro.textContent = errore.message || "non ha funzionato";
            }
          };
        });

        dove.querySelectorAll("[data-installa]").forEach((tasto) => {
          tasto.onclick = () => {
            /* In due tempi, sullo stesso tasto, come «non seguirla più».
             *
             * Qui non si sta premendo un tasto sul proprio computer: si sta
             * facendo partire un aggiornamento a casa di qualcun altro, che
             * magari in quel momento sta guardando la televisione con le
             * tapparelle collegate a quell'impianto. Un tocco andato storto
             * scorrendo l'elenco non deve bastare. */
            if (tasto.dataset.sicuro !== "sì") {
              tasto.dataset.sicuro = "sì";
              tasto.textContent = "Premi ancora per confermare";
              setTimeout(() => {
                tasto.dataset.sicuro = "";
                tasto.textContent = "Installa";
              }, 6000);
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.installa}/installa`, {
                method: "POST",
                body: JSON.stringify({
                  nome: tasto.dataset.qualeNome,
                  da: tasto.dataset.qualeDa,
                  a: tasto.dataset.qualeA,
                }),
              }),
            );
          };
        });
        dove.querySelectorAll("[data-riavvia]").forEach((tasto) => {
          tasto.onclick = () => {
            /* In due tempi, come «Installa», e per la stessa ragione: si sta
             * spegnendo e riaccendendo la casa di qualcun altro. */
            if (tasto.dataset.sicuro !== "sì") {
              tasto.dataset.sicuro = "sì";
              tasto.textContent = "Premi ancora per confermare";
              setTimeout(() => {
                tasto.dataset.sicuro = "";
                tasto.textContent = "Riavvia Home Assistant";
              }, 6000);
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.riavvia}/riavvia`, { method: "POST" }),
            );
          };
        });
        dove.querySelectorAll("[data-configura-plancia]").forEach((tasto) => {
          tasto.onclick = () =>
            void apriLEditor(tasto.dataset.configuraPlancia, tasto.dataset.profilo);
        });
        dove.querySelectorAll("[data-lascia-stare]").forEach((tasto) => {
          /* Annullare non chiede conferma: si annulla una cosa che non è
           * ancora successa, e il danno di un tocco storto è ripremere
           * «Installa». */
          tasto.onclick = () =>
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.lasciaStare}/installa`, { method: "DELETE" }),
            );
        });
        dove.querySelectorAll("[data-molla]").forEach((tasto) => {
          tasto.onclick = () => {
            /* In due tempi, sullo stesso tasto: il primo chiede conferma e il
             * secondo fa. Non si butta la storia di un impianto per un tocco
             * andato storto. */
            if (tasto.dataset.sicuro !== "sì") {
              tasto.dataset.sicuro = "sì";
              tasto.textContent = "Premi ancora per confermare";
              setTimeout(() => {
                tasto.dataset.sicuro = "";
                tasto.textContent = "Rimuovi";
              }, 6000);
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.molla}`, { method: "DELETE" }).then(() => {
                foglioAperto = null;
              }),
            );
          };
        });
        dove.querySelectorAll("[data-copia]").forEach((tasto) => {
          tasto.onclick = () => {
            navigator.clipboard?.writeText(tasto.dataset.copia);
            const prima = tasto.textContent;
            tasto.textContent = "Copiato";
            setTimeout(() => {
              tasto.textContent = prima;
            }, 2000);
          };
        });

        avviaGliOrologi();
      }

      /* Fa una cosa, poi ricarica e ridisegna. Il tasto resta spento mentre
       * succede: due tocchi su «fai un codice» sono due codici. */
      async function faiEpoi(tasto, cosa) {
        tasto.disabled = true;
        try {
          await cosa();
          await carica();
          disegna();
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) {
            chiedimiLaChiave();
            return;
          }
          avvisa(errore.message || "non ha funzionato");
        } finally {
          tasto.disabled = false;
        }
      }

      doveNav.onclick = (evento) => {
        const tasto = evento.target.closest("[data-schermata]");
        if (!tasto) return;
        schermata = tasto.dataset.schermata;
        disegna();
        window.scrollTo({ top: 0 });
      };

      /* Il pallino in testata: la pagina si ricarica da sola ogni dieci
       * secondi, e premerlo la ricarica adesso. */
      const tastoVivo = document.getElementById("vivo");
      tastoVivo.onclick = async () => {
        if (!chiave || tastoVivo.getAttribute("aria-busy") === "true") return;
        tastoVivo.setAttribute("aria-busy", "true");
        document.getElementById("vivo-dice").textContent = "Aggiornamento…";
        try {
          await carica();
          disegna();
          avvisa("Aggiornato");
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) chiedimiLaChiave();
          else if (errore instanceof Congelata) disegna();
          else avvisa(errore.message || "non ha funzionato");
        } finally {
          tastoVivo.removeAttribute("aria-busy");
          document.getElementById("vivo-dice").textContent = "Aggiorna";
        }
      };

      /* Esc chiude il foglio, come su qualunque finestra. */
      document.addEventListener("keydown", (evento) => {
        if (evento.key === "Escape") chiudiIlFoglio();
      });

      /* ─── I disegni: l'anello, gli anellini, la linea viva ───────────── */

      /* Il colore di uno stato o di un livello, col nome che ha nel foglio
       * di stile. Tre stati, tre livelli, tre colori: gli stessi. */
      const TINTA_DI = {
        offline: "rosso",
        guardare: "ambra",
        posto: "verde",
        male: "rosso",
        attenta: "ambra",
        bene: "verde",
      };

      const IL_TITOLO_DELLA_FILA = {
        offline: "Offline",
        guardare: "Da verificare",
        posto: "In ordine",
      };

      /* Le tre icone della barra, disegnate qui: niente da scaricare. */
      const LE_ICONE = {
        case: '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1V9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
        aggiornamenti:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v10m0 0 3.5-3.5M10 13 6.5 9.5M4 16h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        abbina:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      };

      /* Le iniziali per il tondo in testata: le prime lettere delle prime due
       * parole del nome. Senza nome resta «gd», che e' il quadro. */
      function laSigla(nome) {
        const parole = String(nome || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        if (!parole.length) return "gd";
        return parole
          .slice(0, 2)
          .map((una) => una[0].toUpperCase())
          .join("");
      }

      /* L'anello: tre archi in proporzione, con tre punti di respiro fra
       * l'uno e l'altro. La prima volta parte da zero e si apre; ai giri
       * dopo si disegna gia' aperto — un anello che si riapre ogni dieci
       * secondi distrae e basta. */
      function anello(quanti, animato = false) {
        const r = 56;
        const C = 2 * Math.PI * r;
        const tutte = Math.max(1, quanti.offline + quanti.guardare + quanti.posto);
        let inizio = 0;
        const archi = ["offline", "guardare", "posto"].map((chiave) => {
          const lungo = (quanti[chiave] / tutte) * C;
          const visibile = Math.max(0, lungo - (quanti[chiave] ? 3 : 0));
          const fine = `${visibile.toFixed(2)} ${(C - visibile).toFixed(2)}`;
          const arco = `<circle cx="70" cy="70" r="${Number(r)}" class="arco" stroke="var(--${TINTA_DI[chiave]})"
            stroke-dasharray="${animato ? `0 ${C.toFixed(2)}` : /* già HTML */ fine}"${animato ? ` data-fine="${/* già HTML */ fine}"` : ""}
            stroke-dashoffset="${(-inizio).toFixed(2)}" />`;
          inizio += lungo;
          return arco;
        });
        return `<svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="${Number(r)}" class="traccia" />${archi.join("")}</svg>`;
      }

      /* Un anellino: un valore in centesimi, colorato come va. */
      function anellino(valore, come, animato = false) {
        const r = 27;
        const C = 2 * Math.PI * r;
        const quanto = (Math.max(0, Math.min(100, Number(valore) || 0)) / 100) * C;
        const fine = `${quanto.toFixed(2)} ${(C - quanto).toFixed(2)}`;
        return `<svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="${Number(r)}" class="traccia" />
          <circle cx="32" cy="32" r="${Number(r)}" class="arco" stroke="var(--${TINTA_DI[come] || "verde"})"
            stroke-dasharray="${animato ? `0 ${C.toFixed(2)}` : /* già HTML */ fine}"${animato ? ` data-fine="${/* già HTML */ fine}"` : ""} /></svg>`;
      }

      /* Gli archi disegnati a zero si aprono al frame dopo: cosi' la
       * transizione li vede cambiare, e li accompagna. */
      function apriGliArchi(radice) {
        if (!radice) return;
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            radice.querySelectorAll("circle.arco[data-fine]").forEach((cerchio) => {
              cerchio.setAttribute("stroke-dasharray", cerchio.dataset.fine);
            });
          }),
        );
      }

      /* La linea viva: quattordici giorni di rapporti, una linea sola e
       * l'ultimo punto in evidenza. Niente assi: e' un respiro, non un
       * grafico. Un giorno pieno sta in alto, uno a meta' in mezzo, uno
       * offline in fondo; i giorni in cui la casa non c'era ancora non si
       * disegnano. E' la stessa striscia che nella scheda si legge cella per
       * cella, vista da lontano. */
      function lineaViva(giorni, stato) {
        const L = 200;
        const A = 34;
        const punti = [...String(giorni || "")].map((uno) =>
          uno === "P" ? 100 : uno === "M" ? 50 : uno === "V" ? 0 : null,
        );
        const validi = punti.map((p, i) => [i, p]).filter(([, p]) => p !== null);
        const ultimo = Math.max(1, punti.length - 1);
        const x = (i) => 4 + (i / ultimo) * (L - 8);
        const y = (p) => 4 + (1 - p / 100) * (A - 8);
        const tinta = `var(--${TINTA_DI[stato] || "verde"})`;
        if (!validi.length) return `<span class="linea" aria-hidden="true"></span>`;
        /* L'ultimo punto e' un cerchio HTML messo in percentuale, non un
         * cerchio nel disegno: il disegno si stira per riempire la
         * mattonella, e un cerchio stirato e' un'ellisse. */
        const [ui, up] = validi[validi.length - 1];
        const punto = `<i class="punto" style="left: ${((x(ui) / L) * 100).toFixed(1)}%; top: ${((y(up) / A) * 100).toFixed(1)}%"></i>`;
        if (validi.length === 1) {
          /* Una casa di oggi: un punto solo, dove sta oggi. Domani sara' una
           * linea. */
          return `<span class="linea" aria-hidden="true">${/* già HTML */ punto}</span>`;
        }
        const via = validi
          .map(([i, p], n) => `${n ? "L" : "M"}${x(i).toFixed(1)} ${y(p).toFixed(1)}`)
          .join(" ");
        const area = `${via} L${x(ui).toFixed(1)} ${A} L${x(validi[0][0]).toFixed(1)} ${A} Z`;
        return `<span class="linea" aria-hidden="true"><svg class="linea-viva" viewBox="0 0 ${L} ${A}" preserveAspectRatio="none">
          <path d="${/* già HTML */ area}" fill="${/* già HTML */ tinta}" opacity="0.12" />
          <path d="${/* già HTML */ via}" fill="none" stroke="${/* già HTML */ tinta}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        </svg>${/* già HTML */ punto}</span>`;
      }

      /* ─── Schermata: le case ─────────────────────────────────────────── */

      /* Come sta la flotta, in una riga: e' il titolo accanto all'anello. */
      function laFraseDellaFlotta(quanti) {
        const tutte = quanti.offline + quanti.guardare + quanti.posto;
        if (!tutte) return "Ancora nessun impianto.";
        if (!quanti.offline && !quanti.guardare)
          return tutte === 1
            ? "L'unico impianto è in ordine."
            : `Tutto in ordine, <em>tutti e ${Number(tutte)}</em>.`;
        const altri =
          quanti.posto === 0
            ? ""
            : quanti.posto === 1
              ? ", l'altro in ordine"
              : ", gli altri in ordine";
        if (quanti.offline)
          return `<em>${plurale(quanti.offline, "impianto offline", "impianti offline")}</em>${
            quanti.guardare ? `, ${Number(quanti.guardare)} da verificare` : /* già HTML */ altri
          }.`;
        return `<em>${plurale(quanti.guardare, "impianto da verificare", "impianti da verificare")}</em>${/* già HTML */ altri}.`;
      }

      /* Tre pezzi, dall'alto: l'anello con le tre file che filtrano, le carte
       * di chi chiede qualcosa, le mattonelle di tutti. `animato` e' vero la
       * prima volta che questa schermata si vede: l'anello si apre. */
      function leCase(animato = false) {
        const conStato = CASE.map((una, indice) => ({ una, indice, stato: una.stato }));
        const quanti = { offline: 0, guardare: 0, posto: 0 };
        for (const r of conStato) if (r.stato.chiave in quanti) quanti[r.stato.chiave] += 1;
        const viste = conStato.filter((r) => filtro === "tutte" || r.stato.chiave === filtro);
        /* Chi chiede qualcosa, le offline per prime: sono quelle da aprire
         * adesso. */
        const chiedono = conStato
          .filter((r) => r.stato.chiave !== "posto")
          .sort(
            (a, b) =>
              (a.stato.chiave === "offline" ? 0 : 1) - (b.stato.chiave === "offline" ? 0 : 1),
          );
        const arrivi = CASE.map((una) => new Date(una.carta?.quando || NaN).getTime()).filter(
          Number.isFinite,
        );
        const piuRecente = arrivi.length ? Math.max(...arrivi) : null;

        return `
          <section class="vetro anello-scheda">
            <div class="anello">
              ${anello(quanti, animato)}
              <div class="dentro">
                <b>${CASE.length}</b><span>${CASE.length === 1 ? "impianto" : "impianti"}</span>
              </div>
            </div>
            <div>
              <h2 class="titolo-flotta">${laFraseDellaFlotta(quanti)}</h2>
              <p class="sotto-flotta">
                ${piuRecente ? `Ultimo rapporto ${testo(daQuanto(piuRecente))}.` : "Ancora nessun rapporto."}
              </p>
            </div>
            <div class="file">
              ${LE_FILE.map(
                ([chiave, , parola]) => `
                <button
                  type="button"
                  class="fila"
                  data-filtro="${testo(chiave)}"
                  data-stato="${testo(chiave)}"
                  aria-pressed="${filtro === chiave}"
                >
                  <b>${Number(chiave === "tutte" ? CASE.length : quanti[chiave])}</b><span><i></i>${testo(parola)}</span>
                </button>`,
              ).join("")}
            </div>
          </section>

          ${
            chiedono.length && filtro === "tutte"
              ? `<div class="voce">
                   <h2>Da verificare ora</h2>
                   <span>${plurale(chiedono.length, "impianto", "impianti")}</span>
                 </div>
                 <div class="scorri">
                   ${chiedono.map((r) => unaCarta(r.una, r.indice, r.stato)).join("")}
                 </div>`
              : ""
          }

          <div class="voce">
            <h2>${filtro === "tutte" ? "Tutti gli impianti" : IL_TITOLO_DELLA_FILA[filtro]}</h2>
            <span>${viste.length} su ${CASE.length}</span>
          </div>
          ${
            !CASE.length
              ? `<div class="vetro vuoto">
                   <b>Ancora nessun impianto</b> Da «Abbinamento» si genera un codice, e il primo impianto compare qui da solo.
                 </div>`
              : viste.length
                ? `<div class="mattonelle">
                     ${viste.map((r) => unaCasa(r.una, r.indice, r.stato)).join("")}
                   </div>`
                : `<div class="vetro vuoto">
                     <b>Nessun impianto in questo gruppo</b> Premi di nuovo il filtro per vederli tutti.
                   </div>`
          }
        `;
      }

      /* Il nome di una casa, gia' scappato. Senza nome si dice «Senza nome»,
       * con sotto le otto cifre della matricola che la distinguono: un
       * elenco di `casa_…` troncati si legge peggio. */
      const ilNomeDi = (casa) =>
        casa.senzaNome
          ? `Senza nome<small class="mono">${testo(casa.casa.slice(5, 13))}</small>`
          : testo(casa.nome);

      /* Una carta di «Da guardare adesso»: lo stato, il nome, il perché in
       * una riga. Si apre sul foglio con **solo quello che non va**. */
      function unaCarta(casa, indice, stato) {
        const c = casa.carta || {};
        return `
          <button
            type="button"
            class="vetro carta"
            data-stato="${testo(stato.chiave)}"
            data-casa="${Number(indice)}"
            data-solo-guai="sì"
          >
            <span class="stato"><i></i>${testo(stato.parola)}</span>
            <h3>${ilNomeDi(casa)}</h3>
            <p class="perche">${testo(stato.perché || "")}</p>
            <span class="piede">
              <span>${c.quando ? testo(daQuanto(c.quando)) : "nessun rapporto"}</span>
              <b>Apri →</b>
            </span>
          </button>`;
      }

      /* Una mattonella: il nome, lo stato con la parola, quando ha parlato
       * l'ultima volta e la linea dei quattordici giorni. Quando arriva un
       * rapporto nuovo, il pallino batte una volta. */
      function unaCasa(casa, indice, stato) {
        const c = casa.carta || {};
        const arrivato = Boolean(
          c.quando && VISTI.has(casa.casa) && VISTI.get(casa.casa) !== c.quando,
        );
        return `
          <button
            type="button"
            class="mattonella${arrivato ? " arrivato" : ""}"
            data-stato="${testo(stato.chiave)}"
            data-casa="${Number(indice)}"
            aria-current="${foglioAperto?.casa === casa.casa}"
          >
            <span class="nome">${ilNomeDi(casa)}</span>
            <span class="riga"><i></i>${testo(stato.parola)}</span>
            <span class="quando">
              ${c.quando ? testo(daQuanto(c.quando)) : "nessun rapporto"}${cE(c.ogni) ? ` · ogni ${testo(c.ogni)} min` : ""}
            </span>
            ${lineaViva(casa.giorni, stato.chiave)}
          </button>`;
      }

      /* ─── Il foglio: la scheda di una casa, che sale dal basso ───────── */

      /* Si ridisegna insieme al resto della pagina, a ogni giro: e' un
       * pezzo di `dove` come gli altri, e i suoi tasti si agganciano con gli
       * stessi `querySelectorAll`. Quello che resta fra un giro e l'altro e'
       * `foglioAperto`, e il punto a cui era scorso lo rimette `disegna`. */
      function ilFoglio() {
        if (!foglioAperto) return "";
        const casa = CASE.find((una) => una.casa === foglioAperto.casa);
        if (!casa) {
          /* Tolta dal quadro mentre era aperta: non c'e' piu' niente da dire. */
          foglioAperto = null;
          return "";
        }
        const c = casa.carta || {};
        const soloGuai = foglioAperto.soloGuai && casa.stato.chiave !== "posto";
        const su = foglioAperto.appena || foglioAperto.chiudendo ? "" : " su";
        return `
          <div class="velo${/* già HTML */ su}" data-chiudi></div>
          <div
            class="foglio${/* già HTML */ su}"
            role="dialog"
            aria-modal="true"
            aria-labelledby="foglio-titolo"
            data-stato="${testo(casa.stato.chiave)}"
          >
            <div class="presa"><i></i></div>
            <div class="foglio-testa">
              <div class="nomi">
                <h2 id="foglio-titolo">${testo(casa.nome)}</h2>
                <p>
                  ${soloGuai ? "Solo le anomalie" : spia(casa.stato)}${c.quando ? ` · ultimo rapporto ${testo(daQuanto(c.quando))}` : ""}
                </p>
              </div>
              <button type="button" class="tasto" data-chiudi>Chiudi</button>
            </div>
            <div class="foglio-corpo" id="foglio-corpo">
              ${soloGuai ? soloIGuai(casa) : ilDettaglio(casa)}
            </div>
            <div class="foglio-tasti">
              ${
                soloGuai
                  ? `<button type="button" class="tasto forte" data-tutto>Mostra tutto</button>
                     <button type="button" class="tasto" data-copia="${testo(JSON.stringify(c, null, 2))}">
                       Copia rapporto
                     </button>`
                  : ""
              }
            </div>
          </div>`;
      }

      /* Scende, e poi sparisce: la transizione dura quattro decimi, e
       * `foglioAperto` si svuota dopo. Nel mezzo un giro di `disegna` lo
       * ridisegna gia' giu', grazie a `chiudendo`. */
      /* ─── L'editor della plancia ─────────────────────────────────────
       *
       * Il tasto «Configurazione» apre la pagina vera della plancia — la
       * Configurazione di DashboardModern, con «Configura Entità» — servita
       * dal quadro (`src/plancia-servita.js`) in un riquadro sopra tutta la
       * pagina. Il riquadro sta fuori da `#dove`, che si ridisegna a ogni
       * rapporto: un editor ricaricato ogni dieci secondi non è un editor.
       *
       * Prima di aprirla si chiede all'impianto com'è fatta **adesso** — e
       * cosa c'è in casa, senza cosa succede — e si aspetta che arrivi: pochi
       * secondi se la casa è in linea. Se non arriva si apre com'era, e lo si
       * dice. Al riquadro va un **gettone**, con un messaggio, alla propria
       * origine: la pagina lo usa per entrare sul suo filo, e non sta
       * nell'indirizzo. Non la chiave: la pagina dell'editor e' codice della
       * plancia, e la chiave che apre tutto questo cruscotto non le serve.
       * Il gettone vale mezz'ora, per questa casa e questa plancia soltanto
       * (`src/biglietti.js`). */
      const editorPlancia = document.getElementById("editor-plancia");
      const editorRiquadro = document.getElementById("editor-riquadro");
      let editorAperto = null;
      const pausa = (quanto) => new Promise((ok) => setTimeout(ok, quanto));
      function diciNellEditor(che, guaio = false) {
        const riga = document.getElementById("editor-stato");
        riga.textContent = che;
        riga.hidden = !che;
        riga.classList.toggle("guaio", guaio);
      }

      async function apriLEditor(casa, profilo) {
        const questa = CASE.find((una) => una.casa === casa);
        const c = questa?.carta || {};
        const titolo =
          (c.plance?.elenco || []).find((una) => una.profilo === profilo)?.titolo || profilo;
        const apertura = { casa, profilo, da: ADESSO() };
        editorAperto = apertura;
        document.getElementById("editor-titolo").textContent = `Configurazione · ${titolo}`;
        document.getElementById("editor-sotto").textContent = questa?.nome || casa;
        editorRiquadro.src = "about:blank";
        editorPlancia.hidden = false;
        document.body.classList.add("con-editor");
        disegnaLoStatoDellEditor();
        diciNellEditor("Chiedo all'impianto com'è fatta la plancia adesso…");
        try {
          const chiesto = await chiedi(`/casa/${casa}/plancia/${profilo}/rinfresca`, {
            method: "POST",
          });
          let stato = chiesto;
          const fresco = () =>
            Boolean(stato.scatto) && stato.scatto.presoIl >= apertura.da - 2000 && stato.inventario;
          /* Una ventina di secondi: un rapporto, uno scatto, l'inventario. */
          for (let giro = 0; giro < 14 && !fresco(); giro += 1) {
            await pausa(1500);
            if (editorAperto !== apertura) return;
            stato = await chiedi(`/casa/${casa}/plancia/${profilo}/stato`);
          }
          if (editorAperto !== apertura) return;
          if (!stato.scatto) {
            diciNellEditor(
              chiesto.inLinea
                ? "L'impianto non ha mandato com'è fatta la plancia. Riprova fra un minuto."
                : "L'impianto non è in linea, e com'è fatta la plancia non è mai arrivata: riprova quando torna a rispondere.",
              true,
            );
            return;
          }
          if (!stato.editor) {
            diciNellEditor(
              /* Non e' la plancia della casa, che c'e': e' la copia dei file
               * della plancia che il quadro serve nell'editor, e sulla sua
               * macchina la porta `accendi.sh` (`quadro/plancia/`). Chi legge
               * questo e' un installatore, che il quadro non lo tiene: gli si
               * dice cosa chiedere, e a chi. */
              "Il quadro non ha ancora la copia della plancia che serve all'editor: chi tiene il quadro deve rilanciare accendi.sh una volta. La plancia della casa c'è e non c'entra.",
              true,
            );
            return;
          }
          diciNellEditor(
            fresco()
              ? ""
              : `L'impianto non ha risposto: si apre com'era ${daQuanto(stato.scatto.presoIl)}${stato.inventario ? "" : ", e senza l'elenco di cosa c'è in casa"}.`,
          );
          const { gettone } = await chiedi(`/casa/${casa}/plancia/${profilo}/gettone`, {
            method: "POST",
          });
          if (editorAperto !== apertura) return;
          apertura.gettone = String(gettone || "");
          editorRiquadro.src = `../plancia-da-lontano/${casa}/${profilo}/`;
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) {
            chiudiLEditor();
            chiedimiLaChiave();
            return;
          }
          if (editorAperto === apertura)
            diciNellEditor(errore.message || "non ha funzionato", true);
        }
      }

      function chiudiLEditor() {
        editorAperto = null;
        editorRiquadro.src = "about:blank";
        editorPlancia.hidden = true;
        document.body.classList.remove("con-editor");
      }
      document.getElementById("chiudi-editor").onclick = chiudiLEditor;

      /* Il gettone al riquadro, appena la pagina c'è: tre colpi, come fa la
       * tessera dentro Home Assistant, e alla propria origine soltanto. */
      editorRiquadro.addEventListener("load", () => {
        if (!editorAperto?.gettone) return;
        const finestra = editorRiquadro.contentWindow;
        if (!finestra) return;
        for (const fra of [0, 300, 1500]) {
          setTimeout(() => {
            if (!editorAperto?.gettone) return;
            try {
              finestra.postMessage(
                { gdahome: "gettone", gettone: editorAperto.gettone },
                location.origin,
              );
            } catch (_niente) {
              /* La pagina se n'è andata: non c'è niente da dire a nessuno. */
            }
          }, fra);
        }
      });

      /* Com'è andata l'ultima modifica, dal rapporto: si rilegge a ogni
       * disegno, sopra il riquadro, senza toccarlo. */
      function disegnaLoStatoDellEditor() {
        if (!editorAperto) return;
        const questa = CASE.find((una) => una.casa === editorAperto.casa);
        const c = questa?.carta || {};
        const chiesto = questa?.chiesto;
        const l = c.lavoro;
        const riga = document.getElementById("editor-lavoro");
        let che = "";
        if (chiesto && chiesto.cosa === "configura" && chiesto.nome === editorAperto.profilo)
          che = "Una modifica è in attesa: l'impianto la ritira appena passa.";
        else if (l && l.configurazione && l.nome === editorAperto.profilo) {
          const come =
            l.stato === "fatto"
              ? "L'impianto ha applicato l'ultima modifica"
              : l.stato === "in corso"
                ? "L'impianto sta applicando la modifica"
                : "L'ultima modifica non è passata";
          che = `${come}${l.perche ? `: ${l.perche}` : ""} (${daQuanto(l.quando)}).`;
        }
        riga.textContent = che;
        riga.hidden = !che;
      }

      function chiudiIlFoglio() {
        if (!foglioAperto || foglioAperto.chiudendo) return;
        foglioAperto.chiudendo = true;
        const questo = foglioAperto;
        dove.querySelectorAll(".velo, .foglio").forEach((uno) => uno.classList.remove("su"));
        setTimeout(() => {
          if (foglioAperto === questo) foglioAperto = null;
          disegna();
        }, 420);
      }

      /* La scheda intera, a capitoli: cosa mi tocca, come sta, cos'e' di
       * preciso. E' quella di sempre; il foglio la contiene. */
      function ilDettaglio(casa) {
        const stato = casa.stato;
        const c = casa.carta || {};
        const controlli = casa.controlli || {
          controlli: [],
          bene: 0,
          male: 0,
          ignoti: 0,
          quanti: 0,
        };

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti?.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti?.ha],
          ["Supervisor", c.supervisor, false],
          ["Sistema operativo", c.sistema, false],
        ];

        const misure = [
          quantiGiu(c) > 0
            ? [
                "Dispositivi non collegati",
                c.entita?.dispositivi ?? quantiGiu(c),
                `${quantiGiu(c)} entità su ${c.entita?.totali ?? "—"}`,
                "male",
              ]
            : ["Entità", c.entita?.totali ?? "—", "rispondono tutte", ""],
          [
            "Batteria più bassa dei dispositivi",
            c.batterie?.piuBassa === null || c.batterie?.piuBassa === undefined
              ? "—"
              : `${c.batterie.piuBassa}%`,
            !c.batterie
              ? "non comunicato"
              : c.batterie.scariche > 0
                ? `${c.batterie.scariche} sotto il ${BATTERIA_SCARICA}%`
                : "nessuna da sostituire",
            (c.batterie?.scariche ?? 0) > 0 ? "attenta" : "",
          ],
          [
            "Ultimo backup",
            !c.backup || c.backup.giorniFa === null || c.backup.giorniFa === undefined
              ? "mai"
              : c.backup.giorniFa,
            !c.backup
              ? "non comunicato"
              : c.backup.giorniFa === null || c.backup.giorniFa === undefined
                ? "mai eseguito"
                : "giorni fa",
            c.backup && (c.backup.giorniFa === null || c.backup.giorniFa > 14) ? "attenta" : "",
          ],
          [
            "Errori nel registro",
            c.registro?.errori24h ?? "—",
            "nelle ultime 24 ore",
            (c.registro?.errori24h ?? 0) > 0 ? "male" : "",
          ],
        ];

        return `
          <section class="riquadro">
            ${stato.perché ? `<p class="perché">${testo(stato.perché)}</p>` : ""}
            <dl class="targa">
              <div>
                <dt>Matricola</dt>
                <dd class="mono">${testo(String(c.casa || casa.casa).slice(0, 13))}…</dd>
              </div>
              <div><dt>Abbinato il</dt><dd>${testo(ilGiorno(casa.da))}</dd></div>
              <div>
                <dt>Ultimo rapporto</dt>
                <dd>${c.quando ? `${testo(daQuanto(c.quando))}, ogni ${testo(c.ogni)} min` : "mai ricevuto"}</dd>
              </div>
              <div>
                <dt>Telefoni</dt>
                <dd>${c.telefoni ? `${testo(c.telefoni.abbinati)} abbinati · ${testo(c.telefoni.visti7gg)} attivi negli ultimi 7 giorni` : "—"}</dd>
              </div>
            </dl>
            <div class="azioni">
              <button
                type="button"
                class="tasto forte"
                data-copia="${testo(JSON.stringify(c, null, 2))}"
              >
                Copia rapporto
              </button>
              <button type="button" class="tasto" data-apri-rinomina="${testo(casa.casa)}">
                Rinomina
              </button>
              <button type="button" class="tasto male" data-molla="${testo(casa.casa)}"> Rimuovi </button>
            </div>
            <!-- La casella del nome, chiusa finché non si preme «Rinomina».
                 Prima era un window.prompt: funzionava, e sul telefono si apre
                 come un avviso di sistema che dice «la pagina all'indirizzo …
                 indica», cioè con l'aria di una cosa andata storta. Qui invece
                 è una casella come le altre, e il nome si corregge guardando
                 quello di adesso invece che a memoria. -->
            <div class="rinomina" data-rinomina-per="${testo(casa.casa)}" hidden>
              <input
                type="text"
                data-rinomina-nome="${testo(casa.casa)}"
                value="${casa.senzaNome ? "" : testo(casa.nome)}"
                placeholder="Nome dell'impianto"
                aria-label="Nome dell'impianto"
              />
              <button type="button" class="tasto forte" data-rinomina="${testo(casa.casa)}">
                Salva
              </button>
            </div>
            <p class="limite">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                ${
                  c.manutenzione
                    ? `Questo cruscotto <b>non entra nell'impianto</b>: non apre la plancia e non vede stanze né persone. Può fare <b>due sole cose</b>, e solo perché questo impianto gliele ha autorizzate: avviare un aggiornamento <b>già in attesa</b> e riavviare Home Assistant. Nient'altro, e nessuna riga di comando.${
                        c.configurazione
                          ? ` Con un <b>terzo permesso</b>, dato a parte, può anche <b>configurare la plancia</b> — le sezioni, le stanze, le entità — senza vederla: le immagini delle telecamere di qui non passano.`
                          : ""
                      }`
                    : `Questo cruscotto <b>è in sola lettura</b>: non apre la plancia, non modifica niente e non vede entità, stanze né persone. Questo impianto non ha attivato la manutenzione.${
                        c.configurazione
                          ? ` Ha però dato un permesso a parte: <b>configurare la plancia</b> — le sezioni, le stanze, le entità — senza vederla: le immagini delle telecamere di qui non passano.`
                          : ""
                      }`
                }
              </span>
            </p>
            ${
              /* Il riavvio: il tasto c'è solo con la manutenzione aperta, e
               * solo se in quella casa non sta già succedendo qualcosa — un
               * riavvio in mezzo a un'installazione è il modo migliore per non
               * sapere più cosa è andato e cosa no. E' il tasto per il giorno
               * che un'integrazione si impunta e chi ci abita non c'è: prima
               * si telefonava a casa per far premere «Riavvia». */
              c.manutenzione && !staLavorando(c) && !casa.chiesto
                ? `<div class="azioni" style="margin-top: 10px">
                     <button type="button" class="tasto" data-riavvia="${testo(casa.casa)}">
                       Riavvia Home Assistant
                     </button>
                     <span class="nota" style="align-self: center">
                       La connessione si interrompe per circa un minuto e si ristabilisce da sola.
                     </span>
                   </div>`
                : ""
            }
          </section>

          <div class="capitolo">
            <h2>Da fare</h2>
            <span>quello che questo impianto richiede</span>
          </div>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>I controlli</h3></div>
            <ul class="controlli">
              ${controlli.controlli
                .map(
                  (uno) => `
                <li class="${comeVa(uno)}">
                  <span class="bollino" aria-hidden="true">${IL_BOLLINO[comeVa(uno)]}</span>
                  <span class="cosa"
                    >${testo(uno.cosa)}<span class="via"> — ${A_PAROLE[comeVa(uno)]}</span></span
                  >
                  <span class="dettaglio">${testo(uno.dettaglio)}</span>
                </li>`,
                )
                .join("")}
            </ul>
          </section>

          ${gliAggiornamenti(c, casa)}

          <div class="capitolo">
            <h2>Stato dell'impianto</h2>
            <span>macchina, rete e dispositivi</span>
          </div>

          ${laMacchina(c)} ${leAltreMacchine(c)} ${laRete(c)} ${gliAddon(c)}

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Ultimi quattordici giorni</h3></div>
            ${laStriscia(casa.giorni, true)}
            <dl class="misure">
              ${misure
                .map(
                  ([che, quanto, sotto, come]) => `
                <div>
                  <dt>${testo(che)}</dt>
                  <dd class="${testo(come)}">${testo(quanto)}<small>${testo(sotto)}</small></dd>
                </div>`,
                )
                .join("")}
            </dl>
          </section>

          ${
            quantiGiu(c) > 0
              ? `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>I dispositivi non collegati</h3></div>
            <div class="nomiGiu">
              ${iNomiGiu(c)}
            </div>
            <p class="nota">
              Questi dispositivi non rispondono <em>in questo momento</em>: Home Assistant li conosce ma non li raggiunge più. Può essere una presa staccata, un nodo Zigbee perso, un'integrazione caduta, o anche solo la rete instabile: prima di un intervento conviene verificare se domani compaiono ancora gli stessi nomi. <br /><br /> Questo impianto invia <b>solo i nomi dei dispositivi che non rispondono</b>, nient'altro: quelli che funzionano il cruscotto non li vede nemmeno. Chi abita la casa lo sa prima di inserire il codice — è scritto nella configurazione dell'add-on — e lo rilegge nella scheda «Il cruscotto», dove c'è anche il tasto per interrompere l'invio.
            </p>
          </section>`
              : ""
          }

          <div class="capitolo">
            <h2>Le plance</h2>
            <span>i nomi che porta ogni plancia</span>
          </div>

          ${leVestiDellePlance(casa, c)}

          <div class="capitolo">
            <h2>Dettagli tecnici</h2>
            <span>versioni e rapporto completo</span>
          </div>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Le versioni</h3></div>
            <table class="versioni">
              ${versioni
                .map(
                  ([che, quale, nuova]) => `
                <tr>
                  <td>${testo(che)}</td>
                  <td class="numero">
                    ${cE(quale) ? testo(quale) : '<span class="nonLoDice">non comunicato</span>'}${nuova ? '<span class="pastiglia attenta" style="margin-left:8px">aggiornamento disponibile</span>' : ""}
                  </td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <details class="rapporto">
              <summary><h3>Rapporto completo</h3></summary>
              <pre>${testo(JSON.stringify(c, null, 2))}</pre>
              <p class="nota" style="margin-top: 14px">
                Questo è <strong>tutto</strong> ciò che l'impianto invia. Gli unici nomi presenti sono quelli dei dispositivi che in questo momento non rispondono — degli altri non c'è nemmeno l'elenco — e i titoli delle plance, che servono a scegliere da qui come chiamarle. Nessuna persona, nessuno stato di sensori, nessun indirizzo pubblico. Lo stesso testo lo legge chi abita la casa, nella scheda «Il cruscotto» della console dell'add-on, insieme al tasto per interrompere l'invio.
              </p>
            </details>
          </section>
        `;
      }

      /* Solo quello che non va.
       *
       * E' la vista che si apre da «Da guardare adesso»: chi preme una carta
       * ha gia' letto che quella casa chiede qualcosa, e vuole sapere cosa —
       * non rileggere dieci controlli, otto dei quali verdi. Si vedono i
       * controlli che non passano, i metri fuori soglia, gli aggiornamenti se
       * ce ne sono, i dispositivi che non rispondono. Il resto sta dietro
       * «Mostra tutto», ed e' la stessa scheda di sempre.
       *
       * Sta **dopo** `ilDettaglio` nel file, e non e' un caso: la prova che
       * tiene i capitoli in ordine cerca la prima volta che certe righe
       * compaiono, e la prima deve essere quella della scheda intera. */
      const GRAVI = new Set(["I collegamenti", "Gli add-on"]);

      /* ─── Le plance: i due nomi di ognuna ─────────────────────────────
       *
       * Per ogni plancia dell'impianto l'installatore sceglie il nome che va
       * nel menu laterale di Home Assistant e in cima alla home, e quello che
       * compare col suo logo mentre la pagina si apre. Il quadro li tiene e
       * la casa se li porta via col rapporto dopo: qui non si entra in casa,
       * si lascia un biglietto. L'elenco delle plance lo manda l'add-on dalla
       * 1.5.9.13: prima si vede solo quante sono, e allora lo si dice. */
      /* Quante plance si tengono per casa: la stessa misura del ponte e del
       * quadro. Qui serve a spegnere «Aggiungi» quando si e' arrivati. */
      const PLANCE_AL_MASSIMO = 8;

      function leVestiDellePlance(casa, c) {
        const elenco = Array.isArray(c.plance?.elenco) ? c.plance.elenco : null;
        if (!elenco) {
          return `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>Come si chiamano</h3></div>
            <div class="avvertenza" style="margin-top: 0">
              <span class="gettone" aria-hidden="true">!</span>
              <span>
                Questo impianto dice quante plance ha, ma non quali: l'add-on gdahome di casa è precedente alla 1.5.9.13. Aggiornalo dalla schermata Aggiornamenti, e i nomi si scelgono da qui.
              </span>
            </div>
          </section>`;
        }
        const vesti = casa.vesti || {};
        const inCasa = new Set(elenco.map((una) => String(una.profilo || "")));
        /* Prima quelle che la casa ha, poi quelle aggiunte da qui che la casa
         * deve ancora creare: al rapporto dopo passano di sopra da sole. */
        const righe = [
          ...elenco.map((una) => ({
            profilo: String(una.profilo || ""),
            titolo: una.titolo || una.profilo,
            nuova: false,
          })),
          ...Object.entries(vesti)
            .filter(([profilo, sue]) => sue?.nuova === true && !inCasa.has(profilo))
            .map(([profilo, sue]) => ({ profilo, titolo: sue.titolo || profilo, nuova: true })),
        ];
        const alLimite = righe.length >= PLANCE_AL_MASSIMO;
        /* Da qui si apre anche com'e' fatta: solo se quella casa lo permette —
         * e' il terzo interruttore, `quadro_configurazione`, e la casa lo dice
         * nel rapporto — e solo per una plancia che in casa c'e' gia'. */
        const siConfigura = c.configurazione === true;
        const unaRiga = (una) => {
          const sue = vesti[una.profilo] || {};
          return `
            <div class="veste${una.nuova ? " nuova" : ""}" data-veste="${testo(una.profilo)}">
              <div class="veste-capo">
                <b>${testo(una.titolo)}</b>
                ${
                  una.nuova
                    ? `<span class="pastiglia attenta">in arrivo</span><small>la casa la crea da sola al primo passaggio — pochi secondi se è in linea — e in casa nessuno deve confermare niente</small>`
                    : `<small>${una.profilo === "primary" ? "la prima plancia, com'è chiamata in casa" : "com'è chiamata in casa"}</small>`
                }
              </div>
              <label>
                <span>Nome della plancia</span>
                <input
                  type="text"
                  maxlength="40"
                  data-veste-titolo
                  value="${testo(sue.titolo || "")}"
                  placeholder="${una.nuova ? "" : testo(una.titolo)}"
                  autocomplete="off"
                />
              </label>
              <label>
                <span>Nome all'avvio</span>
                <input
                  type="text"
                  maxlength="40"
                  data-veste-velo
                  value="${testo(sue.velo || "")}"
                  placeholder="${testo(IO.nome || "gdahome")}"
                  autocomplete="off"
                />
              </label>
              <div class="veste-tasti">
                <button type="button" class="tasto forte" data-salva-veste="${testo(una.profilo)}" data-per-casa="${testo(casa.casa)}">Salva</button>
                ${
                  una.nuova
                    ? `<button type="button" class="tasto" data-annulla-veste="${testo(una.profilo)}" data-per-casa="${testo(casa.casa)}">Annulla</button>`
                    : ""
                }
                ${
                  siConfigura && !una.nuova
                    ? `<button
                  type="button"
                  class="tasto"
                  data-configura-plancia="${testo(casa.casa)}"
                  data-profilo="${testo(una.profilo)}"
                >
                  Configurazione
                </button>`
                    : ""
                }
              </div>
            </div>`;
        };
        /* Il logo, anche da qui: chi l'ha messo all'abbinamento lo ritrova,
         * chi non l'ha messo lo mette adesso, senza tornare alla pagina
         * Abbinamento. E' **lo stesso** per tutti i suoi impianti — e' il
         * suo, non di questa casa — e lo si dice, perche' cambiarlo qui lo
         * cambia dappertutto. */
        const ilLogo = `
            <div class="veste marchio">
              <div class="veste-capo">
                <b>Il tuo logo</b>
                <small>compare all'avvio di ogni plancia, col nome all'avvio, e in cima a questo cruscotto: è lo stesso per tutti i tuoi impianti</small>
              </div>
              <div class="provaMarchio">
                ${
                  IO.marchio
                    ? `<img class="suoMarchio" src="${ilSuoMarchio()}" alt="Il tuo logo" />`
                    : `<span class="vuoto" aria-hidden="true">logo</span>`
                }
                <div class="azioni">
                  <input
                    type="file"
                    data-scegli-marchio
                    accept="image/png,image/jpeg,image/webp,image/svg+xml"
                    aria-label="Scegli il file del tuo logo"
                  />
                  ${IO.marchio ? `<button type="button" class="tasto" data-togli-marchio>Rimuovi</button>` : ""}
                </div>
              </div>
              <p class="minuta" data-esito-marchio hidden></p>
            </div>`;
        /* La casa che ha spento «il marchio di chi installa» non si veste e
         * non fa nascere niente: lo dice il rapporto (dalla 1.5.9.14), e si
         * dice qui, invece di lasciare una scelta che non arriva mai. */
        const senzaMarchio =
          c.marchio === false
            ? `
            <div class="avvertenza" style="margin-top: 12px">
              <span class="gettone" aria-hidden="true">!</span>
              <span>
                Questo impianto ha <b>spento</b> «Lascia che la plancia porti il marchio di chi ti ha fatto l'impianto» nelle opzioni dell'add-on: finché resta spento, i nomi scelti qui e il tuo logo non si applicano, e una plancia in più non nasce. Lo riaccende chi abita la casa.
              </span>
            </div>`
            : "";
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Come si chiamano</h3>
              <span class="conta">${righe.length} di ${PLANCE_AL_MASSIMO}</span>
            </div>
            ${/* già HTML */ ilLogo}
            ${/* già HTML */ senzaMarchio}
            <p class="minuta">
              Per ogni plancia due nomi. Il <b>nome della plancia</b> va nel menu laterale di Home Assistant e in cima alla home; il <b>nome all'avvio</b> compare col tuo logo mentre la pagina si apre. Lasciali vuoti e la plancia tiene il nome che ha in casa, e all'avvio mostra il tuo.${
                siConfigura
                  ? " Col tasto <b>Configurazione</b> si apre l'editor della plancia, quello vero — la sua Configurazione, con «Configura Entità» — con l'elenco di cosa c'è in casa e senza niente di quello che succede: ogni modifica salvata l'impianto la ritira appena passa, in pochi secondi se è in linea."
                  : " L'editor della plancia da qui non si apre: questo impianto non ha attivato la <b>configurazione da lontano</b>. È il terzo interruttore nelle opzioni dell'add-on di casa, e lo accende chi ci abita."
              }
            </p>
            ${righe.map(unaRiga).join("")}
            <div class="veste aggiunta">
              <div class="veste-capo">
                <b>Una plancia in più</b>
                <small>${alLimite ? `di plance se ne tengono ${PLANCE_AL_MASSIMO}: questo impianto è al limite` : "nasce vuota, come dall'app, e compare nel menu laterale in pochi secondi: in casa nessuno deve confermare niente"}</small>
              </div>
              <label>
                <span>Nome della plancia</span>
                <input
                  type="text"
                  maxlength="40"
                  data-nuova-titolo
                  placeholder="Es. Taverna"
                  autocomplete="off"
                  ${alLimite ? "disabled" : ""}
                />
              </label>
              <label>
                <span>Nome all'avvio</span>
                <input
                  type="text"
                  maxlength="40"
                  data-nuova-velo
                  placeholder="${testo(IO.nome || "gdahome")}"
                  autocomplete="off"
                  ${alLimite ? "disabled" : ""}
                />
              </label>
              <div class="veste-tasti">
                <button type="button" class="tasto forte" data-nuova-plancia="${testo(casa.casa)}" ${alLimite ? "disabled" : ""}>Aggiungi</button>
              </div>
            </div>
            <p class="nota" style="margin-top: 14px">
              Arrivano in casa appena l'impianto passa di qui: pochi secondi se è in linea, entro un minuto altrimenti. Se chi abita la casa rinomina una plancia dall'app, il suo nome resta finché qui non ne scegli un altro. Una plancia si toglie solo da casa, dall'app o dalla scheda dell'add-on: da qui no.
            </p>
          </section>`;
      }

      function soloIGuai(casa) {
        const stato = casa.stato;
        const c = casa.carta || {};
        const rotti = (casa.controlli?.controlli || []).filter((uno) => uno.va === false);
        const m = c.macchina || null;
        const anelli = [];
        if ((c.batterie?.scariche ?? 0) > 0)
          anelli.push(
            unMetro({
              che: "Batteria più bassa dei dispositivi",
              valore: c.batterie.piuBassa,
              quanto: c.batterie.piuBassa,
              sotto: `${c.batterie.scariche} sotto il ${BATTERIA_SCARICA}%`,
              come: "attenta",
            }),
          );
        if (m && (m.disco ?? 0) >= SOGLIE.discoPieno)
