      IL QUADRO — BOZZA, CON DENTRO CASE FINTE.

      Questa pagina non parla con niente: le case che si vedono stanno scritte
      qui sotto, in `CASE`. Serve a guardare il cruscotto prima di costruirlo, e
      a discutere su una cosa invece che su una descrizione. Quando il quadro
      sarà vero, `CASE` arriva da `GET /case` e il resto della pagina resta
      com'è — per questo i dati stanno in cima e separati da tutto.

      È parente della console del centralino (`centralino/console/index.html`):
      stessa tavolozza, stesse forme, nessuna richiesta a nessuno — niente
      font, niente librerie. Una pagina sola, che si apre anche dal telefono.
      Gli accenti però sono quelli veri, come nella console del ponte: quella
      del centralino la legge chi mantiene l'app, questa la legge un
      installatore tutti i giorni, ed è una pagina di prodotto.

      Quello che si vede qui è tutto quello che il quadro sa di una casa, ed è
      quello che sta scritto nella cartolina: numeri e versioni. Niente nomi di
      entità, niente stanze, niente persone, nessuno stato di nessun sensore.
      Il nome della casa — «Rossi — via Verdi 12» — dalla casa non arriva: lo
      scrive l'installatore qui, e resta qui.

      UNA COSA MISURATA, CHE HA DECISO IL DISEGNO.

      I tre colori di stato del progetto — `--spia`, `--ottone`, `--allarme` —
      fra ambra e rosso sono a 1.7 di distanza per chi non distingue il rosso
      dal verde (9.1 per chi li distingue tutti: sotto la soglia comunque). Su
      una pagina il cui mestiere è far vedere a colpo d'occhio quali case stanno
      bene, un pallino colorato **da solo** non può portare il significato.
      Perciò ogni stato ha tre cose insieme: una **forma** (● ▲ ■ ◇), una
      **parola** e un colore. Chi non vede i colori legge la pagina lo stesso, e
      chi li vede la legge più in fretta.

      La variabile del fondo delle schede qui si chiama `--scheda` e non
      `--quadro` come nella console del centralino: lì «quadro» voleva dire «il
      riquadro bianco», qui vuol dire il pezzo intero, e due significati sulla
      stessa parola nello stesso file si pagano dopo.
    -->
    <style>
      :root {

        --tenue: #7e8d92;

        --ottone: #8a5710;

        }
      }

      * {

      body {

      header {

      main {

      .mono {

       *
       * Uno solo, e grande. La domanda di chi apre questa pagina la mattina non
       * è «quante case ho» — quello lo sa — ma «quante me ne chiedono qualcosa
       * adesso». Le altre quattro cifre stanno sotto, piccole, perché servono a
       * spiegare questa. */

        background: var(--scheda);
        border: 1px solid var(--linea);
        border-radius: 4px;
        padding: 20px 18px;

      }

      .vecchie {

        }

          padding-left: calc(1em + 9px);

      }

        {
          nome: "Palestra Olimpia",
          da: "14 dicembre 2025",
          collaudataIl: "14 dicembre 2025",
          giorni: "PPPPPPPPPPPPPP",
          carta: {
            casa: "casa_c208e5719ba634df80e27c14a6b39052",
            quando: "2026-09-18T09:42:00Z",
            ogni: 15,
            ponte: "1.4.32.14",
            plancia: "1.4.32",
            ha: "2026.9.1",
            supervisor: "2026.08.3",
            sistema: "Home Assistant OS 14.2",
            aggiornamenti: { quanti: 1, ha: false, addon: 1, gdahome: false, firmware: 0 },
            plance: { quante: 1, configurate: 1 },
            telefoni: { abbinati: 1, visti7gg: 1 },
            fuori: { acceso: true, filo: true, daGiorni: 210 },
            dispositivi: { totali: 41, spariti: 0, impronte: [] },
            batterie: { sotto20: 0, piuBassa: 88 },
            backup: { giorniFa: 6 },
            registro: { errori24h: 0 },
          },
        },
      ];

      /* Adesso, per questa bozza: qualche minuto dopo l'ultima cartolina, così
       * i «3 minuti fa» tornano sempre invece di invecchiare col file. */
      const ADESSO = new Date("2026-09-18T09:44:00Z").getTime();

      /* ───────────────────────────────────────────────────────────────────
       * IL COLLAUDO E LA SALUTE.
       *
       * Sono le sole regole di questa pagina, ed è la stessa cosa che nel
       * quadro vero starà in `src/collaudo.js`: da una cartolina si ricavano
       * delle spunte, e dalle spunte uno stato. Qui stanno scritte una volta e
       * si leggono tutte insieme, che è il punto di una bozza.
       * ─────────────────────────────────────────────────────────────────── */

      /* Dopo quante cartoline saltate una casa è muta. Tre: una sola può essere
       * un riavvio, tre no. */
      const MUTA_DOPO = 3;

      /* Quanti giorni può stare fermo un backup prima che sia una cosa da
       * guardare. Due settimane: chi fa il backup ogni notte se ne accorge
       * subito, chi lo fa a mano una volta al mese non viene tormentato. */
      const BACKUP_FERMO = 14;

      /* Sotto quale carica una batteria si conta fra quelle da cambiare. */
      const BATTERIA_SCARICA = 20;

      const minutiDaAllora = (quando) => Math.round((ADESSO - new Date(quando).getTime()) / 60000);

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      function daQuanto(quando) {
        const minuti = minutiDaAllora(quando);
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const eMuta = (c) => minutiDaAllora(c.quando) > c.ogni * MUTA_DOPO;

      const backupFermo = (c) => c.backup.giorniFa === null || c.backup.giorniFa > BACKUP_FERMO;

      /* Quando un aggiornamento in attesa è una cosa da guardare.
       *
       * Non sempre: un add-on che ha una versione nuova da ieri non è un
       * impianto da andare a vedere, e una casa che diventa ambra per quello
       * insegna a non guardare più le case ambra. Diventa una cosa da guardare
       * quando tocca Home Assistant o gdahome — lì dentro ci sono le correzioni
       * di sicurezza — o quando se ne sono accumulati tre.
       *
       * Nel collaudo invece contano tutti: alla consegna un impianto si lascia
       * aggiornato, e quella spunta è severa apposta. Sono due domande diverse
       * sulla stessa riga, ed è giusto che diano due risposte diverse. */
      const aggiornamentiPesano = (a) => a.quanti >= 3 || a.ha || a.gdahome;

      /* Le spunte del collaudo: l'impianto è finito bene?
       *
       * Sono le cose che un installatore controlla prima di andarsene, e sono
       * tutte già dentro la cartolina. `manca` non vuol dire rotto: vuol dire
       * che quella riga non si può ancora spuntare. */
      function ilCollaudo(c) {
        const spunte = [
          {
            cosa: "La plancia è configurata",
            fatta: c.plance.configurate > 0,
            dettaglio:
              c.plance.configurate > 0
                ? `${c.plance.configurate} su ${c.plance.quante}`
                : "nessuna, è vuota",
          },
          {
            cosa: "C'è almeno un telefono abbinato",
            fatta: c.telefoni.abbinati > 0,
            dettaglio:
              c.telefoni.abbinati > 0
                ? plurale(c.telefoni.abbinati, "telefono", "telefoni")
                : "nessuno",
          },
          {
            cosa: "Da fuori casa funziona",
            fatta: c.fuori.acceso && c.fuori.filo,
            dettaglio: c.fuori.acceso
              ? c.fuori.filo
                ? `filo su da ${c.fuori.daGiorni} gg`
                : "acceso, filo giù"
              : "spento",
          },
          {
            cosa: "Nessun dispositivo sparito",
            fatta: c.dispositivi.spariti === 0,
            dettaglio:
              c.dispositivi.spariti === 0
                ? `${c.dispositivi.totali} tutti là`
                : `${c.dispositivi.spariti} su ${c.dispositivi.totali}`,
          },
          {
            cosa: "Niente da aggiornare",
            fatta: c.aggiornamenti.quanti === 0,
            dettaglio:
              c.aggiornamenti.quanti === 0
                ? "tutto aggiornato"
                : `${plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti")} in attesa`,
          },
          {
            cosa: "Il backup gira",
            fatta: !backupFermo(c),
            dettaglio:
              c.backup.giorniFa === null ? "mai fatto" : `l'ultimo ${c.backup.giorniFa} gg fa`,
          },
          {
            cosa: "Nessuna batteria da cambiare",
            fatta: c.batterie.sotto20 === 0,
            dettaglio:
              c.batterie.sotto20 === 0
                ? `la più bassa al ${c.batterie.piuBassa}%`
                : `${c.batterie.sotto20} sotto il ${BATTERIA_SCARICA}%`,
          },
        ];
        return { spunte, fatte: spunte.filter((una) => una.fatta).length, quante: spunte.length };
      }

      /* Lo stato di una casa, in una parola.
       *
       * L'ordine conta. Muta batte tutto: di una casa che non parla non si sa
       * niente, nemmeno che sta bene — quello che si vede di lei è vecchio.
       * Poi il collaudo mai chiuso, che non è un guasto ma un lavoro lasciato a
       * metà, e sta in un'altra fila perché si sbriga in un altro modo. Poi
       * quello che si è rotto dopo. */
      function loStato(casa) {
        const c = casa.carta;
        if (eMuta(c)) {
          return {
            chiave: "muta",
            segno: "■",
            parola: "muta",
            perché: `non manda una cartolina da ${daQuanto(c.quando)}`,
          };
        }
        if (casa.collaudataIl === null) {
          const collaudo = ilCollaudo(c);
          return {
            chiave: "aperto",
            segno: "◇",
            parola: "collaudo aperto",
            perché: `${collaudo.fatte} spunte su ${collaudo.quante}`,
          };
        }
        const guai = [];
        if (c.dispositivi.spariti > 0)
          guai.push(plurale(c.dispositivi.spariti, "dispositivo sparito", "dispositivi spariti"));
        if (c.batterie.sotto20 > 0)
          guai.push(plurale(c.batterie.sotto20, "batteria scarica", "batterie scariche"));
        if (aggiornamentiPesano(c.aggiornamenti))
          guai.push(plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti"));
        if (backupFermo(c)) guai.push("backup fermo");
        if (c.registro.errori24h > 0) guai.push(plurale(c.registro.errori24h, "errore", "errori"));
        if (guai.length) {
          return {
            chiave: "guardare",
            segno: "▲",
            parola: "da guardare",
            perché: guai.join(" · "),
          };
        }
        return { chiave: "posto", segno: "●", parola: "a posto", perché: "" };
      }

      /* Le spie di una riga: le stesse cose, dette per esteso. Ci sono anche
       * quelle che non fanno diventare la casa ambra — l'aggiornamento singolo
       * si vede lo stesso, semplicemente non suona. */
      function leSpie(c) {
        const spie = [];
        if (c.dispositivi.spariti > 0)
          spie.push([
            plurale(c.dispositivi.spariti, "dispositivo sparito", "dispositivi spariti"),
            "male",
          ]);
        if (c.registro.errori24h > 0)
          spie.push([`${plurale(c.registro.errori24h, "errore", "errori")} in 24h`, "male"]);
        if (c.batterie.sotto20 > 0)
          spie.push([
            `${plurale(c.batterie.sotto20, "batteria", "batterie")} sotto il ${BATTERIA_SCARICA}%`,
            "attenta",
          ]);
        if (c.aggiornamenti.quanti > 0)
          spie.push([
            plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti"),
            aggiornamentiPesano(c.aggiornamenti) ? "attenta" : "",
          ]);
        if (c.backup.giorniFa === null) spie.push(["backup mai fatto", "attenta"]);
        else if (backupFermo(c)) spie.push([`backup fermo da ${c.backup.giorniFa} gg`, "attenta"]);
        if (c.plance.configurate === 0) spie.push(["plancia da configurare", "attenta"]);
        if (c.telefoni.abbinati === 0) spie.push(["nessun telefono abbinato", "attenta"]);
        if (!spie.length) spie.push([`${c.dispositivi.totali} dispositivi, tutti là`, ""]);
        return spie;
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      const spia = (stato) =>
        `<span class="stato ${stato.chiave}"><span class="segno" aria-hidden="true">${stato.segno}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` muta, spazio «non c'era
       * ancora». */
      function laStriscia(giorni) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="muta tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="muta per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non era ancora accesa"></i>';
            return '<i title="tutte le cartoline arrivate"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} da quando è accesa`
            : vuoti === 0
              ? "14 giorni, sempre viva"
              : `14 giorni · muta ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="striscia" role="img" aria-label="${testo(dice)}">${celle}</div><div class="strisciaDice">${testo(dice)}</div>`;
      }

      let filtro = "tutte";
      let aperta = null;
      const dove = document.getElementById("dove");

      document.getElementById("chi").textContent =
        `Impianti Rossi · ${plurale(CASE.length, "casa", "case")}`;

      function disegna() {
        dove.innerHTML = aperta === null ? lElenco() : ilDettaglio(CASE[aperta]);
        dove.querySelectorAll("[data-casa]").forEach((tasto) => {
          tasto.onclick = () => {
            aperta = Number(tasto.dataset.casa);
            window.scrollTo(0, 0);
            disegna();
          };
        });
        dove.querySelectorAll("[data-filtro]").forEach((tasto) => {
          tasto.onclick = () => {
            filtro = tasto.dataset.filtro;
            disegna();
          };
        });
        const torna = dove.querySelector("[data-indietro]");
        if (torna)
          torna.onclick = () => {
            aperta = null;
            disegna();
          };
      }

      function lElenco() {
        const conStato = CASE.map((una, indice) => ({ una, indice, stato: loStato(una) }));
        const quante = (chiave) => conStato.filter((r) => r.stato.chiave === chiave).length;
        const aspettano = conStato.length - quante("posto");

        const file = [
          ["tutte", `Tutte (${conStato.length})`],
          ["muta", `Mute (${quante("muta")})`],
          ["guardare", `Da guardare (${quante("guardare")})`],
          ["aperto", `Collaudo aperto (${quante("aperto")})`],
          ["posto", `A posto (${quante("posto")})`],
        ];

        const viste = conStato.filter((r) => filtro === "tutte" || r.stato.chiave === filtro);
        const ultima = conStato
          .map((r) => r.una.carta.quando)
          .sort()
          .reverse()[0];

        return `
          <section class="capo">
            <div class="cifra">${aspettano}</div>
            <div class="dice">${aspettano === 1 ? "casa ti aspetta" : "case ti aspettano"}</div>
            <div class="sotto">su ${conStato.length} seguite da questo quadro · l'ultima cartolina è arrivata ${testo(daQuanto(ultima))}</div>
            <div class="conti">
              <div><b>${quante("muta")}</b><span>mute</span></div>
              <div><b>${quante("guardare")}</b><span>da guardare</span></div>
              <div><b>${quante("aperto")}</b><span>collaudo aperto</span></div>
              <div><b>${quante("posto")}</b><span>a posto</span></div>
            </div>
          </section>

          <div class="filtri">
            ${file
              .map(
                ([chiave, parola]) =>
                  `<button data-filtro="${chiave}" aria-pressed="${filtro === chiave}">${testo(parola)}</button>`,
              )
              .join("")}
          </div>

          <ul class="case">
            ${viste.map(({ una, indice, stato }) => unaRiga(una, indice, stato)).join("")}
          </ul>
        `;
      }

      function unaRiga(casa, indice, stato) {
        const c = casa.carta;
        const muta = stato.chiave === "muta";

        return `
          <li>
            <button data-casa="${indice}">
              <div class="riga1">
                ${spia(stato)}
                <strong>${testo(casa.nome)}</strong>
                <span class="quando">${testo(daQuanto(c.quando))}</span>
              </div>
              <div class="targa mono">${testo(c.casa.slice(0, 13))}… · gdahome ${testo(c.ponte)} · HA ${testo(c.ha)}</div>
              <div class="spie">
                ${leSpie(c)
                  .map(
                    ([parola, come]) =>
                      `<span class="voce ${come}">${come ? '<span aria-hidden="true">▲</span>' : ""}${testo(parola)}</span>`,
                  )
                  .join("")}
              </div>
              ${muta ? `<div class="vecchie">Quello che c'è scritto qui sopra è vecchio: lo diceva l'ultima cartolina, ${testo(daQuanto(c.quando))}.</div>` : ""}
              ${laStriscia(casa.giorni)}
            </button>
          </li>
        `;
      }

      function ilDettaglio(casa) {
        const c = casa.carta;
        const stato = loStato(casa);
        const collaudo = ilCollaudo(c);

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti.ha],
          ["Supervisor", c.supervisor, false],
          ["il sistema", c.sistema, false],
        ];

        const verdetto =
          collaudo.fatte === collaudo.quante
            ? "Tutte spuntate: questo impianto è a posto."
            : casa.collaudataIl === null
              ? "Non è ancora stata consegnata: finché le spunte non sono tutte, resta in fila."
              : `Il collaudo si era chiuso il ${casa.collaudataIl}. Queste righe si sono riaperte dopo, ed è il motivo per cui questa casa è qui.`;

        return `
          <div class="indietro"><button data-indietro>← tutte le case</button></div>

          <section class="riquadro">
            <div class="riga1" style="margin-bottom:8px">
              ${spia(stato)}
              <h2>${testo(casa.nome)}</h2>
            </div>
            ${stato.perché ? `<div class="nota" style="margin-bottom:14px">${testo(stato.perché)}</div>` : ""}
            <dl class="fila">
              <dt>Matricola</dt><dd class="mono">${testo(c.casa)}</dd>
              <dt>Installata il</dt><dd>${testo(casa.da)}</dd>
              <dt>Collaudata il</dt><dd>${casa.collaudataIl === null ? "mai" : testo(casa.collaudataIl)}</dd>
              <dt>Ultima cartolina</dt><dd>${testo(daQuanto(c.quando))} — ne manda una ogni ${c.ogni} minuti</dd>
              <dt>Telefoni</dt><dd>${plurale(c.telefoni.abbinati, "abbinato", "abbinati")}, ${c.telefoni.visti7gg} visti in 7 giorni</dd>
            </dl>
            <div class="azioni">
              <button>Apri questa casa nell'app</button>
              <button>Rinomina</button>
              <button class="male">Non seguirla più</button>
            </div>
          </section>

          <section class="riquadro">
            <h3>Il collaudo — l'impianto è finito bene?</h3>
            <ul class="spunte">
              ${collaudo.spunte
                .map(
                  (una) => `
                <li class="${una.fatta ? "fatta" : "manca"}">
                  <span class="segno" aria-hidden="true">${una.fatta ? "✓" : "▲"}</span>
                  <span class="cosa">${testo(una.cosa)}<span class="via">${una.fatta ? " — fatta" : " — manca"}</span></span>
                  <span class="dettaglio">${testo(una.dettaglio)}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <div class="verdetto">${collaudo.fatte} spunte su ${collaudo.quante}. ${testo(verdetto)}</div>
          </section>

          <section class="riquadro">
            <h3>La salute — regge nel tempo?</h3>
            ${laStriscia(casa.giorni)}
            <dl class="fila" style="margin-top:14px">
              <dt>Dispositivi</dt><dd>${c.dispositivi.totali} in tutto, ${c.dispositivi.spariti} non rispondono</dd>
              <dt>Batterie</dt><dd>${c.batterie.sotto20} sotto il ${BATTERIA_SCARICA}%, la più bassa al ${c.batterie.piuBassa}%</dd>
              <dt>Backup</dt><dd>${c.backup.giorniFa === null ? "mai fatto" : `l'ultimo ${plurale(c.backup.giorniFa, "giorno fa", "giorni fa")}`}</dd>
              <dt>Errori nel registro</dt><dd>${c.registro.errori24h} nelle ultime 24 ore</dd>
              <dt>Da fuori casa</dt><dd>${c.fuori.acceso ? (c.fuori.filo ? `filo su da ${plurale(c.fuori.daGiorni, "giorno", "giorni")}` : "acceso, ma il filo è giù") : "spento"}</dd>
            </dl>
          </section>

          ${
            c.dispositivi.spariti > 0
              ? `
          <section class="riquadro">
            <h3>I dispositivi che non rispondono</h3>
            <div class="impronte">${c.dispositivi.impronte.map((una) => `<span>#${testo(una)}</span>`).join("")}</div>
            <div class="nota">
              Il quadro non sa quali sono, e non lo può sapere: la casa manda
              quattro cifre ricavate dal nome del dispositivo con un sale che
              non esce da lì. Servono a dire <em>lo stesso di ieri</em> oppure
              <em>un altro</em>, e a niente di più. Per sapere il nome si apre
              la casa dall'app, sul filo cifrato, con il segno che chi ci abita
              può togliere quando vuole.
            </div>
          </section>`
              : ""
          }

          <section class="riquadro">
            <h3>Le versioni</h3>
            <table class="versioni">
              ${versioni
                .map(
                  ([cosa, quale, nuova]) => `
                <tr>
                  <td>${testo(cosa)}</td>
                  <td class="numero">${testo(quale)}${nuova ? '<span class="nuova">c\'è la nuova</span>' : ""}</td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <h3>La cartolina, come è arrivata</h3>
            <pre class="cartolina">${testo(JSON.stringify(c, null, 2))}</pre>
            <div class="nota" style="margin-top:10px">
              Questo è <strong>tutto</strong> quello che questa casa manda.
              Nessun nome di entità, nessuna stanza, nessuna persona, nessuno
              stato di nessun sensore, nessun indirizzo. Lo stesso testo, parola
              per parola, lo legge chi ci abita: sta nella scheda «Il quadro»
              della console dell'add-on, insieme al tasto per smettere di
              mandarlo.
            </div>
          </section>
        `;
      }

      disegna();
    </script>
  </body>
</html>
