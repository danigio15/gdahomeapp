<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Il quadro degli impianti</title>
    <!--
      IL QUADRO — BOZZA, CON DENTRO CASE FINTE.

      Questa pagina non parla con niente: le case che si vedono stanno scritte
      qui sotto, in `CASE`. Serve a guardare il cruscotto prima di costruirlo, e
      a discutere su una cosa invece che su una descrizione. Quando il quadro
      sarà vero, `CASE` arriva da `GET /case` e il resto della pagina resta
      com'è — per questo i dati stanno in cima e separati da tutto.

      Niente font, niente librerie, nessuna richiesta a nessuno: la regola delle
      altre console del progetto vale anche qui.

      DA DOVE VENGONO I COLORI E LE FORME.

      Da `sito/stile.css` e dalla plancia, non dalla console del centralino. Le
      prime due stesure erano parenti di quella — grigio-verde, fili sottili,
      angoli da tre millimetri — e quella è un attrezzo da manutentore. gdahome
      invece è bianco su azzurro chiarissimo, angoli da venti, ombre morbide a
      due strati, pastiglie tonde e una barretta colorata a sinistra delle
      righe: è così la plancia, è così il sito, e questa pagina è dello stesso
      prodotto.

      Le tessere dello stato in cima sono la stessa striscia che la plancia ha
      sopra la Home («Inserito · 1 porta aperta · 1 varco aperto»).

      DUE SCHERMATE.

      «Le case» è il cruscotto: l'elenco a sinistra, la casa aperta a destra.
      «Abbina» è come una casa entra qui dentro, ed è l'altra metà del lavoro:
      senza quella il quadro è un cruscotto senza cruscotto.

      UNA COSA MISURATA, CHE HA DECISO IL DISEGNO.

      I tre colori di stato del sito — `--bene`, `--ambra`, `--male` — passano
      la prova del daltonismo, ma l'ambra sul bianco sta sotto il contrasto di
      3:1 e la coppia ambra/verde si avvicina a 7.0 per chi non distingue il
      rosso. Perciò ogni stato porta tre cose insieme: una **forma** (● ▲ ■ ◇),
      una **parola** e un colore. Chi non vede i colori legge la pagina lo
      stesso, e chi li vede la legge più in fretta.

      L'azzurro è l'unica cosa che si preme, e sta fuori dai tre colori di stato
      apposta: un colore che vuol dire «guasto» e «premi qui» insieme non vuol
      dire più niente.
    -->
    <style>
      /* ─── I colori ──────────────────────────────────────────────────────
       *
       * Sono quelli di `sito/stile.css`, non reinventati: la notte, l'azzurro,
       * l'ambra, il bene e il male, più gli aloni tenui che la plancia usa
       * dietro le pastiglie. Il chiaro sta qui tutto intero; sotto si
       * ridefiniscono solo le tessere che cambiano, due volte — per chi ha il
       * sistema scuro e per chi lo sceglie. */
      :root {
        --notte: #0f172a;
        --lieve: #64748b;
        --fioco: #94a3b8;

        --fondo: #f0f4f8;
        --carta: #ffffff;
        --carta-alta: #f8fafc;
        --bordo: #e2e8f0;
        --bordo-tenue: #eef2f7;

        --azzurro: #0ea5e9;
        --azzurro-scuro: #0284c7;
        --azzurro-cupo: #075985;
        --bene: #15803d;
        --ambra: #b45309;
        --male: #be123c;

        --alone-azzurro: #e0f2fe;
        --alone-bene: #dcfce7;
        --alone-ambra: #fef3c7;
        --alone-male: #ffe4e6;
        --giorno-pieno: #86efac;

        --ombra: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        --ombra-alta: 0 2px 6px rgba(15, 23, 42, 0.06), 0 24px 60px rgba(15, 23, 42, 0.12);
        --ombra-tasto: 0 1px 2px rgba(15, 23, 42, 0.08), 0 6px 16px rgba(2, 132, 199, 0.28);

        --raggio: 20px;
        --raggio-piccolo: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --notte: #e8eef7;
          --lieve: #93a3bb;
          --fioco: #6b7c96;

          --fondo: #0a1120;
          --carta: #121c2e;
          --carta-alta: #18243a;
          --bordo: #223049;
          --bordo-tenue: #1b2739;

          --azzurro: #38bdf8;
          --azzurro-scuro: #0ea5e9;
          --azzurro-cupo: #7dd3fc;
          --bene: #4ade80;
          --ambra: #fbbf24;
          --male: #fb7185;

          --alone-azzurro: #0c2a3e;
          --alone-bene: #10321f;
          --alone-ambra: #33270c;
          --alone-male: #3b1520;
          --giorno-pieno: #1f7a4d;

          --ombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.32);
          --ombra-alta: 0 2px 6px rgba(0, 0, 0, 0.36), 0 24px 60px rgba(0, 0, 0, 0.46);
          --ombra-tasto: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(14, 165, 233, 0.3);
        }
      }

      :root[data-theme="dark"] {
        --notte: #e8eef7;
        --lieve: #93a3bb;
        --fioco: #6b7c96;

        --fondo: #0a1120;
        --carta: #121c2e;
        --carta-alta: #18243a;
        --bordo: #223049;
        --bordo-tenue: #1b2739;

        --azzurro: #38bdf8;
        --azzurro-scuro: #0ea5e9;
        --azzurro-cupo: #7dd3fc;
        --bene: #4ade80;
        --ambra: #fbbf24;
        --male: #fb7185;

        --alone-azzurro: #0c2a3e;
        --alone-bene: #10321f;
        --alone-ambra: #33270c;
        --alone-male: #3b1520;
        --giorno-pieno: #1f7a4d;

        --ombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.32);
        --ombra-alta: 0 2px 6px rgba(0, 0, 0, 0.36), 0 24px 60px rgba(0, 0, 0, 0.46);
        --ombra-tasto: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(14, 165, 233, 0.3);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--fondo);
        color: var(--notte);
        font:
          15px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--azzurro);
        outline-offset: 3px;
        border-radius: 8px;
      }

      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      .via {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ─── La testata ──────────────────────────────────────────────────── */
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: color-mix(in srgb, var(--fondo) 88%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--bordo-tenue);
      }

      .testata {
        max-width: 80rem;
        margin-inline: auto;
        padding: 13px 22px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .marchio {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      /* Il bollo del marchio: un quadratino con la barra, come un quadro
       * elettrico visto da lontano. */
      .bollo {
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 9px;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-cupo));
        display: grid;
        place-items: center;
        gap: 3px;
        grid-auto-flow: column;
        box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
      }

      .bollo i {
        width: 3.5px;
        height: 14px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.92);
      }

      .bollo i.mezzo {
        height: 8px;
        background: rgba(255, 255, 255, 0.6);
      }

      .marchio .nomi {
        min-width: 0;
      }

      .marchio b {
        display: block;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.25;
      }

      .marchio span {
        display: block;
        color: var(--lieve);
        font-size: 0.76rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--carta);
        border: 1px solid var(--bordo);
        border-radius: 999px;
        box-shadow: var(--ombra);
      }

      nav button {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 550;
        color: var(--lieve);
        background: transparent;
        border: 0;
        border-radius: 999px;
        padding: 7px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      nav button:hover {
        color: var(--notte);
      }

      nav button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-scuro));
        box-shadow: 0 1px 3px rgba(2, 132, 199, 0.35);
      }

      nav .quanti {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      nav button[aria-pressed="true"] .quanti {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
      }

      /* ─── L'impianto della pagina ────────────────────────────────────── */
      main {
        max-width: 80rem;
        margin-inline: auto;
        padding: 22px;
      }

      .titolone {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.028em;
        margin: 0 0 4px;
        text-wrap: balance;
      }

      .sottotitolo {
        color: var(--lieve);
        font-size: 0.92rem;
        margin: 0 0 18px;
        max-width: 46rem;
      }

      /* ─── La striscia dello stato, come sopra la Home della plancia ─── */
      .striscia {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .tessera {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 15px;
        background: var(--carta);
        border-radius: var(--raggio-piccolo);
        box-shadow: var(--ombra);
        text-align: left;
        font: inherit;
        color: inherit;
        border: 1.5px solid transparent;
        cursor: pointer;
      }

      .tessera[aria-pressed="true"] {
        border-color: var(--azzurro);
      }

      .tessera .gettone {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }

      .tessera .numeri b {
        display: block;
        font-size: 1.3rem;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .tessera .numeri span {
        display: block;
        font-size: 0.74rem;
        color: var(--lieve);
        line-height: 1.3;
      }

      .gettone.posto {
        background: var(--alone-bene);
        color: var(--bene);
      }

      .gettone.guardare {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      .gettone.muta {
        background: var(--alone-male);
        color: var(--male);
      }

      .gettone.aperto {
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
      }

      /* ─── Il banco: l'elenco e la casa aperta ───────────────────────── */
      .banco {
        display: grid;
        grid-template-columns: minmax(0, 26rem) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .fila {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* ─── Una casa nell'elenco ──────────────────────────────────────── */
      .casa {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--carta);
        border: 1.5px solid transparent;
        border-radius: var(--raggio-piccolo);
        padding: 14px 15px 14px 20px;
        cursor: pointer;
        box-shadow: var(--ombra);
        overflow: hidden;
      }

      /* La barretta: la stessa che la plancia mette a sinistra delle righe
       * dei widget. Qui dice come sta la casa, e si legge in colonna senza
       * leggere le parole. */
      .casa::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 14px;
        bottom: 14px;
        width: 4px;
        border-radius: 3px;
        background: var(--fioco);
      }

      .casa.posto::before {
        background: var(--bene);
      }

      .casa.guardare::before {
        background: var(--ambra);
      }

      .casa.muta::before {
        background: var(--male);
      }

      .casa.aperto::before {
        background: var(--azzurro);
      }

      .casa[aria-current="true"] {
        border-color: var(--azzurro);
        box-shadow: var(--ombra-alta);
      }

      .capo {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .capo .nome {
        font-size: 0.97rem;
        font-weight: 650;
        letter-spacing: -0.012em;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .capo .quando {
        margin-left: auto;
        flex: none;
        color: var(--fioco);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }

      /* ─── Le pastiglie tonde ────────────────────────────────────────── */
      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.74rem;
        font-weight: 600;
        line-height: 1.35;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--carta-alta);
        color: var(--lieve);
        white-space: nowrap;
      }

      .pastiglia.posto,
      .pastiglia.bene {
        background: var(--alone-bene);
        color: var(--bene);
      }

      .pastiglia.guardare,
      .pastiglia.attenta {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      .pastiglia.muta,
      .pastiglia.male {
        background: var(--alone-male);
        color: var(--male);
      }

      .pastiglia.aperto {
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
      }

      .pastiglie {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 9px;
      }

      .fianco {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 6px;
        color: var(--fioco);
        font-size: 0.75rem;
      }

      /* ─── La striscia dei quattordici giorni ────────────────────────── */
      .giorni {
        display: flex;
        gap: 3px;
        margin-top: 11px;
      }

      .giorni i {
        flex: 1;
        height: 14px;
        border-radius: 3px;
        background: var(--giorno-pieno);
      }

      .giorni.grande i {
        height: 24px;
        border-radius: 5px;
      }

      .giorni i.mezza {
        background: var(--ambra);
        opacity: 0.75;
      }

      .giorni i.vuota {
        background: var(--male);
      }

      .giorni i.prima {
        background: var(--bordo-tenue);
      }

      .giorniDice {
        color: var(--fioco);
        font-size: 0.73rem;
        margin-top: 6px;
      }

      /* ─── Le schede della casa aperta ───────────────────────────────── */
      .scheda {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }

      .riquadro {
        background: var(--carta);
        border-radius: var(--raggio);
        padding: 20px 22px;
        box-shadow: var(--ombra);
      }

      .riquadro.tinto {
        background: linear-gradient(
          160deg,
          var(--alone-azzurro),
          color-mix(in srgb, var(--alone-azzurro) 45%, var(--carta))
        );
        border: 1.5px solid color-mix(in srgb, var(--azzurro) 35%, transparent);
      }

      .indietro {
        display: none;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 550;
        color: var(--azzurro-scuro);
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        align-self: flex-start;
      }

      h2 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.028em;
        text-wrap: balance;
      }

      .titolo {
        display: flex;
        align-items: center;
        gap: 11px;
        flex-wrap: wrap;
      }

      .perché {
        color: var(--lieve);
        font-size: 0.9rem;
        margin: 7px 0 0;
      }

      h3 {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fioco);
      }

      .capoRiquadro {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
      }

      .capoRiquadro .conta {
        margin-left: auto;
        font-size: 0.85rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--lieve);
      }

      .targa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 14px 22px;
        margin-top: 18px;
        padding-top: 17px;
        border-top: 1px solid var(--bordo-tenue);
      }

      .targa dt {
        color: var(--fioco);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .targa dd {
        margin: 3px 0 0;
        font-size: 0.87rem;
        font-variant-numeric: tabular-nums;
      }

      /* ─── I tasti ───────────────────────────────────────────────────── */
      .azioni {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .tasto {
        font: inherit;
        font-size: 0.86rem;
        font-weight: 550;
        color: var(--notte);
        background: var(--carta);
        border: 1px solid var(--bordo);
        border-radius: 11px;
        padding: 9px 16px;
        cursor: pointer;
      }

      .tasto:hover {
        border-color: var(--fioco);
      }

      .tasto.forte {
        color: #fff;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-scuro));
        border-color: transparent;
        box-shadow: var(--ombra-tasto);
      }

      .tasto.male {
        color: var(--male);
        border-color: color-mix(in srgb, var(--male) 40%, transparent);
        background: transparent;
      }

      .tasto:disabled {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
      }

      .tasto.grande {
        font-size: 0.95rem;
        padding: 12px 22px;
        border-radius: 13px;
      }

      /* La riga del limite: cosa questo quadro non può fare. Sta sotto i
       * tasti e non in fondo alla pagina, perché è la cornice dentro cui si
       * legge tutto il resto — e perché un tasto che non c'è si nota meno di
       * una riga che dice perché non c'è. */
      .limite {
        display: flex;
        gap: 11px;
        margin: 16px 0 0;
        padding: 13px 15px;
        background: var(--carta-alta);
        border-radius: var(--raggio-piccolo);
        font-size: 0.83rem;
        line-height: 1.55;
        color: var(--lieve);
      }

      .limite .gettone {
        width: 24px;
        height: 24px;
        flex: none;
        border-radius: 8px;
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }

      .limite b {
        color: var(--notte);
      }

      /* ─── Il misuratore del collaudo ────────────────────────────────── */
      .misura {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
      }

      .misura i {
        flex: 1;
        height: 7px;
        border-radius: 4px;
        background: var(--alone-ambra);
      }

      .misura i.fatta {
        background: var(--bene);
      }

      ul.spunte {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.spunte li {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 0;
        font-size: 0.89rem;
      }

      ul.spunte li + li {
        border-top: 1px solid var(--bordo-tenue);
      }

      ul.spunte .bollino {
        flex: none;
        width: 21px;
        height: 21px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 0.68rem;
        font-weight: 700;
      }

      ul.spunte .fatta .bollino {
        background: var(--alone-bene);
        color: var(--bene);
      }

      ul.spunte .manca .bollino {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      ul.spunte .cosa {
        flex: 1;
        min-width: 0;
      }

      ul.spunte .manca .cosa {
        font-weight: 600;
      }

      ul.spunte .dettaglio {

       * Quattro barre, non quattro numeri: la percentuale di un disco la si

       * piena, così lo stato si legge su tutta la larghezza e non solo dove
       * il riempimento arriva. */

        font-size: 0.95rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;

        font-size: 0.73rem;
        font-weight: 450;
      }

        position: relative;
        height: 9px;
        border-radius: 5px;
        overflow: hidden;
      }

      .binario i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 5px;
      }

      .binario.bene {
        background: var(--alone-bene);
      }

      .binario.bene i {
        background: var(--bene);
      }

      .binario.attenta {
        background: var(--alone-ambra);
      }

      .binario.attenta i {
        background: var(--ambra);
      }

      .binario.male {
        background: var(--alone-male);
      }

      .binario.male i {
        background: var(--male);
      }

      /* La tacca dei settantacinque gradi, quella che la plancia disegna già
       * sull'arco del MiniPC. */

        position: absolute;
        inset: 0 auto;
        width: 3px;
        margin-left: -1.5px;
        background: var(--carta);
      }

      .capoMetro b.male {
        color: var(--male);

      .capoMetro b.attenta {
        color: var(--ambra);

      }

        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const eMuta = (c) => minutiDaAllora(c.quando) > c.ogni * MUTA_DOPO;

      const backupFermo = (c) => c.backup.giorniFa === null || c.backup.giorniFa > BACKUP_FERMO;

      /* Quando un aggiornamento in attesa è una cosa da guardare.
       *
       * Non sempre: un add-on che ha una versione nuova da ieri non è un
       * impianto da andare a vedere, e una casa che diventa ambra per quello
       * insegna a non guardare più le case ambra. Conta quando tocca Home
       * Assistant o gdahome — lì dentro ci sono le correzioni di sicurezza — o
       * quando se ne sono accumulati tre.
       *
       * Nel collaudo invece contano tutti: alla consegna un impianto si lascia
       * aggiornato, e quella spunta è severa apposta. Due domande diverse sulla
       * stessa riga, ed è giusto che diano due risposte diverse. */
      const aggiornamentiPesano = (a) => a.quanti >= 3 || a.ha || a.gdahome;

      /* Le spunte del collaudo: l'impianto è finito bene?
       *
       * Sono le cose che un installatore controlla prima di andarsene, e sono
       * tutte già dentro la cartolina. `manca` non vuol dire rotto: vuol dire
       * che quella riga non si può ancora spuntare. */
      function ilCollaudo(c) {
        const spunte = [
          {
            cosa: "La plancia è configurata",
            fatta: c.plance.configurate > 0,
            dettaglio:
              c.plance.configurate > 0
                ? `${c.plance.configurate} su ${c.plance.quante}`
                : "nessuna, è vuota",
          },
          {
            cosa: "C'è almeno un telefono abbinato",
            fatta: c.telefoni.abbinati > 0,
            dettaglio:
              c.telefoni.abbinati > 0
                ? plurale(c.telefoni.abbinati, "telefono", "telefoni")
                : "nessuno",
          },
          {
            cosa: "Da fuori casa funziona",
            fatta: c.fuori.acceso && c.fuori.filo,
            dettaglio: c.fuori.acceso
              ? c.fuori.filo
                ? `filo su da ${c.fuori.daGiorni} gg`
                : "acceso, filo giù"
              : "spento",
          },
          {
            cosa: "Nessun dispositivo sparito",
            fatta: c.dispositivi.spariti === 0,
            dettaglio:
              c.dispositivi.spariti === 0
                ? `${c.dispositivi.totali} tutti là`
                : `${c.dispositivi.spariti} su ${c.dispositivi.totali}`,
          },
          {
            cosa: "Niente da aggiornare",
            fatta: c.aggiornamenti.quanti === 0,
            dettaglio:
              c.aggiornamenti.quanti === 0
                ? "tutto aggiornato"
                : `${plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti")} in attesa`,
          },
          {
            cosa: "Il backup gira",
            fatta: !backupFermo(c),
            dettaglio:
              c.backup.giorniFa === null ? "mai fatto" : `l'ultimo ${c.backup.giorniFa} gg fa`,
          },
          {
            cosa: "Gli add-on che devono girare, girano",
            fatta: addonGiu(c) === 0,
            dettaglio:
              addonGiu(c) === 0
                ? `${c.addon.accesi} accesi su ${c.addon.quanti}`
                : `${plurale(addonGiu(c), "fermo", "fermi")} con l'avvio automatico`,
          },
          {
            cosa: "La rete regge",
            fatta: reteGiu(c) === "",
            dettaglio: reteGiu(c) === "" ? "internet c'è, apparati su" : reteGiu(c),
          },
          {
            cosa: "La macchina non soffre",
            fatta:
              c.macchina.temperatura < TROPPO_CALDO &&
              c.macchina.disco < DISCO_PIENO &&
              (c.macchina.discoVita === null || c.macchina.discoVita < DISCO_FINITO),
            dettaglio: `${c.macchina.temperatura}° · disco al ${c.macchina.disco}%`,
          },
          {
            cosa: "Nessuna batteria da cambiare",
            fatta: c.batterie.sotto20 === 0,
            dettaglio:
              c.batterie.sotto20 === 0
                ? `la più bassa al ${c.batterie.piuBassa}%`
                : `${c.batterie.sotto20} sotto il ${BATTERIA_SCARICA}%`,
          },
        ];
        return { spunte, fatte: spunte.filter((una) => una.fatta).length, quante: spunte.length };
      }

      /* Lo stato di una casa, in una parola.
       *
       * L'ordine conta. Muta batte tutto: di una casa che non parla non si sa
       * niente, nemmeno che sta bene — quello che si vede di lei è vecchio. Poi
       * il collaudo mai chiuso, che non è un guasto ma un lavoro lasciato a
       * metà, e sta in un'altra fila perché si sbriga in un altro modo. Poi
       * quello che si è rotto dopo. */
      function loStato(casa) {
        const c = casa.carta;
        if (eMuta(c)) {
          if (staLavorando(c) && c.lavoro.stacca) {
            const fermi = minutiDaAllora(c.quando);
            return {
              chiave: "muta",
              segno: "■",
              parola: fermi > STA_TORNANDO ? "non è tornata" : "sta aggiornando",
              perché:
                fermi > STA_TORNANDO
                  ? `${c.lavoro.cosa} è partito ${c.lavoro.quando} e questa casa non è più tornata. Un aggiornamento che stacca il filo se lo riprende in pochi minuti: ${daQuanto(c.quando)} non è un'attesa, è un guasto. Qui si va di persona.`
                  : `Sta installando ${c.lavoro.cosa}, e quell'aggiornamento fa cadere il filo: è normale che per qualche minuto non si faccia sentire.`,
            };
          }
          return {
            chiave: "muta",
            segno: "■",
            parola: "muta",
            perché: `Non manda una cartolina da ${daQuanto(c.quando)}. Quello che si vede qui sotto è vecchio di altrettanto.`,
          };
        }
        if (casa.collaudataIl === null) {
          const collaudo = ilCollaudo(c);
          return {
            chiave: "aperto",
            segno: "◇",
            parola: "collaudo aperto",
            perché: `Installata da poco e non ancora consegnata: ${collaudo.fatte} spunte su ${collaudo.quante}.`,
          };
        }
        const guai = [];
        if (!c.rete.internet) guai.push("senza internet");
        if (addonGiu(c) > 0) guai.push(`${plurale(addonGiu(c), "add-on fermo", "add-on fermi")}`);
        if (c.macchina.temperatura >= TROPPO_CALDO)
          guai.push(`${c.macchina.temperatura}° sulla scheda`);
        if (c.macchina.disco >= DISCO_PIENO) guai.push(`disco al ${c.macchina.disco}%`);
        if (c.macchina.discoVita !== null && c.macchina.discoVita >= DISCO_FINITO)
          guai.push(`disco consumato al ${c.macchina.discoVita}%`);
        if (c.rete.sorvegliate.giu > 0)
          guai.push(
            `${plurale(c.rete.sorvegliate.giu, "apparato di rete giù", "apparati di rete giù")}`,
          );
        if (c.dispositivi.spariti > 0)
          guai.push(plurale(c.dispositivi.spariti, "dispositivo sparito", "dispositivi spariti"));
        if (c.registro.errori24h > 0)
          guai.push(`${plurale(c.registro.errori24h, "errore", "errori")} nel registro`);
        if (c.batterie.sotto20 > 0)
          guai.push(plurale(c.batterie.sotto20, "batteria scarica", "batterie scariche"));
        if (aggiornamentiPesano(c.aggiornamenti))
          guai.push(
            `${plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti")} in attesa`,
          );
        if (backupFermo(c)) guai.push("backup fermo");
        if (guai.length) {
          const prime = guai.slice(0, 3);
          const restano = guai.length - prime.length;
          return {
            chiave: "guardare",
            segno: "▲",
            parola: "da guardare",
            perché: restano
              ? `${prime.join(", ")}, e altre ${restano} cose qui sotto.`
              : `${prime.join(", ")}.`,
          };
        }
        return { chiave: "posto", segno: "●", parola: "a posto", perché: "" };
      }

      /* Le pastiglie di una riga. Ci sono anche le cose che non fanno diventare
       * ambra la casa — l'aggiornamento singolo si vede lo stesso, semplicemente
       * non suona. */
      function lePastiglie(c) {
        const p = [];
        if (staLavorando(c)) p.push([`sta installando ${c.lavoro.cosa}`, "lavoro"]);
        if (!c.rete.internet) p.push(["senza internet", "male"]);
        if (addonGiu(c) > 0)
          p.push([`${plurale(addonGiu(c), "add-on fermo", "add-on fermi")}`, "male"]);
        if (c.rete.sorvegliate.giu > 0)
          p.push([`${plurale(c.rete.sorvegliate.giu, "apparato giù", "apparati giù")}`, "male"]);
        if (c.macchina.temperatura >= TROPPO_CALDO)
          p.push([`${c.macchina.temperatura}° sulla scheda`, "attenta"]);
        if (c.macchina.disco >= DISCO_PIENO) p.push([`disco al ${c.macchina.disco}%`, "attenta"]);
        if (c.macchina.discoVita !== null && c.macchina.discoVita >= DISCO_FINITO)
          p.push([`disco consumato al ${c.macchina.discoVita}%`, "attenta"]);
        if (c.dispositivi.spariti > 0)
          p.push([
            plurale(c.dispositivi.spariti, "dispositivo sparito", "dispositivi spariti"),
            "male",
          ]);
        if (c.registro.errori24h > 0)
          p.push([`${plurale(c.registro.errori24h, "errore", "errori")} in 24h`, "male"]);
        if (c.batterie.sotto20 > 0)
          p.push([
            `${plurale(c.batterie.sotto20, "batteria", "batterie")} sotto il ${BATTERIA_SCARICA}%`,
            "attenta",
          ]);
        if (c.aggiornamenti.quanti > 0)
          p.push([
            plurale(c.aggiornamenti.quanti, "aggiornamento", "aggiornamenti"),
            aggiornamentiPesano(c.aggiornamenti) ? "attenta" : "",
          ]);
        if (c.backup.giorniFa === null) p.push(["backup mai fatto", "attenta"]);
        else if (backupFermo(c)) p.push([`backup fermo da ${c.backup.giorniFa} gg`, "attenta"]);
        if (c.plance.configurate === 0) p.push(["plancia da configurare", "attenta"]);
        if (c.telefoni.abbinati === 0) p.push(["nessun telefono abbinato", "attenta"]);
        if (!p.length) p.push([`${c.dispositivi.totali} dispositivi, tutti là`, "bene"]);
        return p;
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      const spia = (stato) =>
        `<span class="pastiglia ${stato.chiave}"><span aria-hidden="true">${stato.segno}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` muta, spazio «non c'era
       * ancora». */
      function laStriscia(giorni, grande = false) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="muta tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="muta per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non era ancora accesa"></i>';
            return '<i title="tutte le cartoline arrivate"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} da quando è accesa`
            : vuoti === 0
              ? "14 giorni, sempre viva"
              : `14 giorni · muta ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="giorni${grande ? " grande" : ""}" role="img" aria-label="${testo(dice)}">${celle}</div><div class="giorniDice">${testo(dice)}</div>`;
      }

      const LE_FILE = [
        ["muta", "■", "mute"],
        ["guardare", "▲", "da guardare"],
        ["aperto", "◇", "collaudo aperto"],
        ["posto", "●", "a posto"],
      ];

      let schermata = "case";
      let filtro = "tutte";
      let aperta = 0;
      let suTelefonoApro = false;

      const dove = document.getElementById("dove");
      const doveNav = document.getElementById("nav");

      document.getElementById("chi").textContent =
        `Impianti Rossi · ${plurale(CASE.length, "impianto", "impianti")}`;

      function disegna() {
        const dietro = CASE.filter((una) => una.carta.aggiornamenti.elenco.length).length;
        doveNav.innerHTML = [
          ["case", "Le case", 0],
          ["aggiornamenti", "Aggiornamenti", dietro],
          ["abbina", "Abbina", INVITI.length + APPENA.length],
        ]
          .map(
            ([quale, parola, quanti]) => `
            <button type="button" data-schermata="${quale}" aria-pressed="${schermata === quale}">
              ${testo(parola)}${quanti ? `<span class="quanti">${quanti}</span>` : ""}
            </button>`,
          )
          .join("");

        dove.innerHTML =
          schermata === "case"
            ? leCase()
            : schermata === "aggiornamenti"
              ? laFlotta()
              : lAbbinamento();

        dove.querySelectorAll("[data-filtro]").forEach((tasto) => {
          tasto.onclick = () => {
            filtro = filtro === tasto.dataset.filtro ? "tutte" : tasto.dataset.filtro;
            disegna();
          };
        });
        dove.querySelectorAll("[data-casa]").forEach((tasto) => {
          tasto.onclick = () => {
            aperta = Number(tasto.dataset.casa);
            suTelefonoApro = true;
            disegna();
            window.scrollTo({ top: 0 });
          };
        });
        const torna = dove.querySelector("[data-indietro]");
        if (torna)
          torna.onclick = () => {
            suTelefonoApro = false;
            disegna();
          };
        avviaGliOrologi();
      }

      doveNav.onclick = (evento) => {
        const tasto = evento.target.closest("[data-schermata]");
        if (!tasto) return;
        schermata = tasto.dataset.schermata;
        suTelefonoApro = false;
        disegna();
        window.scrollTo({ top: 0 });
      };

      /* ─── Schermata: le case ─────────────────────────────────────────── */
      function leCase() {
        const conStato = CASE.map((una, indice) => ({ una, indice, stato: loStato(una) }));
        const quante = (chiave) => conStato.filter((r) => r.stato.chiave === chiave).length;
        const viste = conStato.filter((r) => filtro === "tutte" || r.stato.chiave === filtro);

        return `
          <div class="banco${suTelefonoApro ? " aperta" : ""}">
            <div class="striscia">
              ${LE_FILE.map(
                ([chiave, segno, parola]) => `
                <button
                  type="button"
                  class="tessera"
                  data-filtro="${chiave}"
                  aria-pressed="${filtro === chiave}"
                >
                  <span class="gettone ${chiave}" aria-hidden="true">${segno}</span>
                  <span class="numeri">
                    <b>${quante(chiave)}</b>
                    <span>${testo(parola)}</span>
                  </span>
                </button>`,
              ).join("")}
            </div>

            <div class="fila">
              ${
                viste.length
                  ? viste.map(({ una, indice, stato }) => unaCasa(una, indice, stato)).join("")
                  : '<p class="nota">Nessuna casa in questa fila. Premi di nuovo la tessera per vederle tutte.</p>'
              }
            </div>

            <div class="scheda">
              ${ilDettaglio(CASE[aperta], loStato(CASE[aperta]))}
            </div>
          </div>
        `;
      }

      function unaCasa(casa, indice, stato) {
        const c = casa.carta;
        return `
          <button
            type="button"
            class="casa ${stato.chiave}"
            data-casa="${indice}"
            aria-current="${indice === aperta}"
          >
            <div class="capo">
              <span class="nome">${testo(casa.nome)}</span>
              <span class="quando">${testo(daQuanto(c.quando))}</span>
            </div>
            <div class="fianco">
              ${spia(stato)}
              <span class="mono">${testo(c.casa.slice(5, 13))}</span>
            </div>
            <div class="pastiglie">
              ${(() => {
                const tutte = lePastiglie(c);
                const viste = tutte.slice(0, 3);
                const restano = tutte.length - viste.length;
                return (
                  viste
                    .map(
                      ([parola, come]) => `<span class="pastiglia ${come}">${testo(parola)}</span>`,
                    )
                    .join("") + (restano ? `<span class="pastiglia">+${restano}</span>` : "")
                );
              })()}
            </div>
            ${laStriscia(casa.giorni)}
          </button>
        `;
      }

      function ilDettaglio(casa, stato) {
        const c = casa.carta;
        const collaudo = ilCollaudo(c);

        const verdetto =
          collaudo.fatte === collaudo.quante
            ? "Tutte spuntate: questo impianto è a posto."
            : casa.collaudataIl === null
              ? "Non è ancora stata consegnata: finché le spunte non sono tutte, resta in fila."
              : `Il collaudo si era chiuso il ${casa.collaudataIl}. Queste righe si sono riaperte dopo, ed è il motivo per cui questa casa è qui.`;

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti.ha],
          ["Supervisor", c.supervisor, false],
          ["il sistema", c.sistema, false],
        ];

        const misure = [
          c.dispositivi.spariti > 0
            ? ["Dispositivi spariti", c.dispositivi.spariti, `su ${c.dispositivi.totali}`, "male"]
            : ["Dispositivi", c.dispositivi.totali, "rispondono tutti", ""],
          [
            "Batteria più bassa",
            `${c.batterie.piuBassa}%`,
            c.batterie.sotto20 > 0
              ? `${c.batterie.sotto20} sotto il ${BATTERIA_SCARICA}%`
              : "nessuna da cambiare",
            c.batterie.sotto20 > 0 ? "attenta" : "",
          ],
          [
            "Ultimo backup",
            c.backup.giorniFa === null ? "mai" : c.backup.giorniFa,
            c.backup.giorniFa === null ? "non ne ha mai fatto uno" : "giorni fa",
            backupFermo(c) ? "attenta" : "",
          ],
          [
            "Errori nel registro",
            c.registro.errori24h,
            "nelle ultime 24 ore",
            c.registro.errori24h > 0 ? "male" : "",
          ],
        ];

        return `
          <button type="button" class="indietro" data-indietro>← tutte le case</button>

          <section class="riquadro">
            <div class="titolo">
              <h2>${testo(casa.nome)}</h2>
              ${spia(stato)}
            </div>
            ${stato.perché ? `<p class="perché">${testo(stato.perché)}</p>` : ""}
            <dl class="targa">
              <div>
                <dt>Matricola</dt>
                <dd class="mono">${testo(c.casa.slice(0, 18))}…</dd>
              </div>
              <div><dt>Installata</dt><dd>${testo(casa.da)}</dd></div>
              <div>
                <dt>Collaudata</dt>
                <dd>${casa.collaudataIl === null ? "mai" : testo(casa.collaudataIl)}</dd>
              </div>
              <div>
                <dt>Cartolina</dt>
                <dd>${testo(daQuanto(c.quando))}, ogni ${c.ogni} min</dd>
              </div>
              <div>
                <dt>Telefoni</dt>
                <dd>${c.telefoni.abbinati} — ${c.telefoni.visti7gg} visti in 7 gg</dd>
              </div>
            </dl>
            <div class="azioni">
              <button type="button" class="tasto forte">Copia il rapporto</button>
              <button type="button" class="tasto">Stampa il verbale</button>
              <button type="button" class="tasto">Rinomina</button>
              <button type="button" class="tasto male">Non seguirla più</button>
            </div>
            <p class="limite">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                ${
                  c.manutenzione
                    ? `Questo quadro <b>non guarda dentro</b>: non apre la plancia
                       e non vede entità, stanze né persone. Tocca due cose sole,
                       e solo perché questa casa le ha aperte — <b>installare un
                       aggiornamento</b> e <b>riavviare un add-on fermo</b>. Non
                       c'è altro, e non c'è una riga di comando.`
                    : `Questo quadro <b>guarda e basta</b>: non apre la plancia,
                       non tocca niente, e non vede entità, stanze né persone.
                       Questa casa non ha aperto la manutenzione.`
                }
              </span>
            </p>
          </section>

          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Il collaudo</h3>
              <span class="conta">${collaudo.fatte}/${collaudo.quante}</span>
            </div>
            <div
              class="misura"
              role="img"
              aria-label="${collaudo.fatte} spunte su ${collaudo.quante}"
            >
              ${collaudo.spunte.map((una) => `<i class="${una.fatta ? "fatta" : ""}"></i>`).join("")}
            </div>
            <ul class="spunte">
              ${collaudo.spunte
                .map(
                  (una) => `
                <li class="${una.fatta ? "fatta" : "manca"}">
                  <span class="bollino" aria-hidden="true">${una.fatta ? "✓" : "▲"}</span>
                  <span class="cosa"
                    >${testo(una.cosa)}<span class="via">${una.fatta ? " — fatta" : " — manca"}</span></span
                  >
                  <span class="dettaglio">${testo(una.dettaglio)}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">${testo(verdetto)}</p>
          </section>

          ${gliAggiornamenti(c)} ${laMacchina(c)} ${laRete(c)} ${gliAddon(c)}

          <section class="riquadro">
            <div class="capoRiquadro"><h3>La salute, quattordici giorni</h3></div>
            ${laStriscia(casa.giorni, true)}
            <dl class="misure">
              ${misure
                .map(
                  ([che, quanto, sotto, come]) => `
                <div>
                  <dt>${testo(che)}</dt>
                  <dd class="${come}">${testo(quanto)}<small>${testo(sotto)}</small></dd>
                </div>`,
                )
                .join("")}
            </dl>
          </section>

          ${
            c.dispositivi.spariti > 0
              ? `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>I dispositivi che non rispondono</h3></div>
            <div class="impronte">
              ${c.dispositivi.impronte.map((una) => `<span>#${testo(una)}</span>`).join("")}
            </div>
            <p class="nota">
              Il quadro non sa quali sono, e non lo deve sapere: la casa manda
              quattro cifre ricavate dal nome del dispositivo con un sale che non
              esce da lì. Servono a dire <em>lo stesso di ieri</em> oppure
              <em>un altro</em> — cioè a distinguere un dispositivo morto da una
              rete che balla — e a niente di più.
              <br /><br />
              <b>Il nome non lo scopre nessuno da qui</b>, e non è una cosa da
              aggiungere dopo: quei nomi dicono cosa c'è in una casa e in quali
              stanze. Se serve saperlo, lo legge chi ci abita dalla propria
              plancia, dove quel dispositivo risulta non disponibile, e lo dice
              se vuole.
            </p>
          </section>`
              : ""
          }

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Le versioni</h3></div>
            <table class="versioni">
              ${versioni
                .map(
                  ([che, quale, nuova]) => `
                <tr>
                  <td>${testo(che)}</td>
                  <td class="numero">
                    ${testo(quale)}${nuova ? '<span class="pastiglia attenta" style="margin-left:8px">c&#39;è la nuova</span>' : ""}
                  </td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <details class="cartolina">
              <summary><h3>La cartolina, come è arrivata</h3></summary>
              <pre>${testo(JSON.stringify(c, null, 2))}</pre>
              <p class="nota" style="margin-top: 14px">
                Questo è <strong>tutto</strong> quello che questa casa manda.
                Nessun nome di entità, nessuna stanza, nessuna persona, nessuno
                stato di nessun sensore, nessun indirizzo. Lo stesso testo,
                parola per parola, lo legge chi ci abita: sta nella scheda «Il
                quadro» della console dell'add-on, insieme al tasto per smettere
                di mandarlo.
              </p>
            </details>
          </section>
        `;
      }

      /* Un metro: l'etichetta, il valore, il binario. `tacca` è dove il
       * binario porta un segno — i 75° della temperatura — e va in centesimi
       * della scala, non nell'unità del valore. */
      function unMetro({ che, valore, unita = "%", sotto = "", come, quanto, tacca = null }) {
        return `
          <div>
            <div class="capoMetro">
              <span>${testo(che)}</span>
              ${sotto ? `<small>${testo(sotto)}</small>` : ""}
              <b class="${come === "bene" ? "" : come}">${testo(valore)}${testo(unita)}</b>
            </div>
            <div class="binario ${come}">
              <i style="width: ${Math.max(2, Math.min(100, quanto))}%"></i>
              ${tacca === null ? "" : `<span class="tacca" style="left: ${tacca}%"></span>`}
            </div>
          </div>`;
      }

      /* La macchina: quello che il Supervisor sa del ferro sotto Home
       * Assistant, più la temperatura che la plancia disegna già.
       *
       * `discoVita` è la riga che su queste schede conta davvero e che nessuno
       * guarda: una eMMC o una microSD hanno un numero di scritture e poi
       * finiscono. Quando c'è, ha la sua barra; su una macchina che non la
       * dichiara — un NUC con un SSD — non si inventa. */
      function laMacchina(c) {
        const m = c.macchina;
        const metri = [
          unMetro({
            che: "CPU",
            valore: m.cpu,
            quanto: m.cpu,
            come: livello(m.cpu, 70, 90),
          }),
          unMetro({
            che: "Memoria",
            valore: m.ram,
            quanto: m.ram,
            come: livello(m.ram, 75, 90),
          }),
          unMetro({
            che: "Disco",
            valore: m.disco,
            quanto: m.disco,
            sotto: `${m.discoLiberi} GB liberi`,
            come: livello(m.disco, 75, DISCO_PIENO),
          }),
          unMetro({
            che: "Temperatura",
            valore: m.temperatura,
            unita: "°",
            quanto: m.temperatura,
            sotto: `tacca a ${TROPPO_CALDO}°`,
            tacca: TROPPO_CALDO,
            come: livello(m.temperatura, CALDINO, TROPPO_CALDO),
          }),
        ];
        if (m.discoVita !== null)
          metri.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, DISCO_FINITO),
            }),
          );

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La macchina</h3>
              <span class="conta">${testo(m.scheda)}</span>
            </div>
            <div class="metri">${metri.join("")}</div>
            <p class="verdetto">
              ${testo(c.sistema)} · accesa da ${plurale(m.accesaDa, "giorno", "giorni")}.
              ${
                m.discoVita !== null && m.discoVita >= DISCO_STANCO
                  ? `Il supporto è consumato al ${m.discoVita}%: su queste schede è la cosa che si rompe per prima, e si cambia prima che decida lui.`
                  : m.temperatura >= TROPPO_CALDO
                    ? `Sopra i ${TROPPO_CALDO}° la scheda si rallenta da sola: la casa non si rompe, diventa lenta — e nessuno capisce perché.`
                    : "Niente che chieda di andare a vedere."
              }
            </p>
          </section>`;
      }

      /* Gli aggiornamenti: cosa c'è da fare, e il tasto per farlo.
       *
       * Le voci hanno la forma che `aggiornamentiDaFare` produce già nel
       * ponte, e due dei suoi campi decidono cosa si vede:
       *
       *  - `installabile` — un firmware che si porta col cacciavite non ha
       *    nessun tasto. Mostrarglielo sarebbe una promessa che non si
       *    mantiene, ed è la regola che il ponte si è già data;
       *  - `stacca` — gdahome e Home Assistant, installandosi, fanno cadere il
       *    filo. Detto prima è un'attesa; non detto è un guasto — e da un
       *    quadro che aggiorna da lontano, non detto è una casa che sembra
       *    morta mentre sta solo riavviandosi.
       *
       * E il tasto c'è solo se quella casa **ha aperto la manutenzione**.
       * Vedere cosa c'è da fare e poterlo fare sono due permessi diversi, e
       * il secondo non si dà da sé insieme al primo. */
      function gliAggiornamenti(c) {
        const elenco = c.aggiornamenti.elenco;
        const possibili = daFare(c);
        const cartello = ilCartello(c);

        if (!elenco.length)
          return `
            <section class="riquadro">
              <div class="capoRiquadro"><h3>Gli aggiornamenti</h3></div>
              ${cartello}
              <p class="nota">Niente da fare: questa casa è aggiornata.</p>
            </section>`;

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli aggiornamenti</h3>
              <span class="conta">${plurale(elenco.length, "in attesa", "in attesa")}</span>
            </div>
            ${cartello}
            <ul class="versi">
              ${elenco
                .map(
                  (uno) => `
                <li>
                  <span class="che">
                    <b>${testo(uno.nome)}</b>
                    <span class="salto">${testo(uno.da)} → ${testo(uno.a)}</span>
                  </span>
                  ${uno.stacca ? '<span class="pastiglia attenta">fa cadere il filo</span>' : ""}
                  ${
                    !uno.installabile
                      ? '<span class="pastiglia">si porta col cacciavite</span>'
                      : c.manutenzione
                        ? '<button type="button" class="tasto">Installa</button>'
                        : '<span class="pastiglia">manutenzione chiusa</span>'
                  }
                </li>`,
                )
                .join("")}
            </ul>
            ${
              c.manutenzione
                ? `<div class="azioni">
                    <button type="button" class="tasto forte" ${possibili.length ? "" : "disabled"}>
                      Installa ${possibili.length === elenco.length ? "tutti" : `i ${possibili.length} che si possono`}
                    </button>
                  </div>
                  <p class="verdetto">
                    Il backup si fa <b>prima, sempre</b>: è la condizione, non
                    una casella da spuntare. E quelli che staccano il filo si
                    installano uno per volta — due insieme su una casa sola
                    vogliono dire non sapere quale dei due non è tornato.
                  </p>`
                : `<div class="limite" style="margin-top: 16px">
                    <span class="gettone" aria-hidden="true">◴</span>
                    <span>
                      <b>Questa casa non ha aperto la manutenzione.</b> Si vede
                      cosa c'è da fare e non si può farlo, ed è giusto così:
                      guardare e toccare sono due permessi diversi.
                      L'interruttore sta nella sua console, nella scheda «Il
                      quadro», e lo tiene in mano chi ci abita.
                    </span>
                  </div>`
            }
          </section>`;
      }

      /* Il cartello del lavoro: cosa sta facendo questa casa adesso, o cosa ha
       * appena finito. */
      function ilCartello(c) {
        const l = c.lavoro;
        if (l === null) return "";
        if (l.stato === "fatto")
          return `
            <div class="cartello bene">
              <span class="gettone" aria-hidden="true">✓</span>
              <span><b>${testo(l.cosa)}</b> installato ${testo(l.quando)}, dal quadro.</span>
            </div>`;
        if (l.stato === "fallito")
          return `
            <div class="cartello male">
              <span class="gettone" aria-hidden="true">✕</span>
              <span
                ><b>${testo(l.cosa)}</b> non è andato ${testo(l.quando)}:
                ${testo(l.perché || "Home Assistant ha detto di no")}.</span
              >
            </div>`;
        const fermi = minutiDaAllora(c.quando);
        const tardi = l.stacca && fermi > STA_TORNANDO;
        return `
          <div class="cartello ${tardi ? "male" : ""}">
            <span class="gettone" aria-hidden="true">${tardi ? "!" : "◴"}</span>
            <span>
              <b>${testo(l.cosa)}</b> è partito ${testo(l.quando)}${
                tardi
                  ? ` e questa casa non è più tornata. Un aggiornamento che stacca il filo se lo riprende in pochi minuti: qui si va di persona.`
                  : l.stacca
                    ? `. Fa cadere il filo, quindi per qualche minuto questa casa non si fa sentire — è normale.`
                    : `. Come è andata lo dirà la prossima cartolina.`
              }
            </span>
          </div>`;
      }

      /* La rete: le schede che il Supervisor dichiara, più gli apparati di
       * casa che la plancia già sorveglia.
       *
       * I due pezzi non sono la stessa cosa e non vanno confusi. Le schede
       * sono quelle **della macchina** e le sa il Supervisor senza che
       * nessuno configuri niente. Gli apparati — il router, i ripetitori —
       * sono i `binary_sensor` con `device_class: connectivity` che la
       * sezione «Macchine e rete» della plancia adotta per integrazione: ci
       * sono se chi ci abita li ha spuntati, e dove non sono spuntati qui
       * si dice zero invece di fingere. */
      function laRete(c) {
        const r = c.rete;
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La rete</h3>
              <span class="pastiglia ${r.internet ? "bene" : "male"}">
                ${r.internet ? "internet c&#39;è" : "senza internet"}
              </span>
            </div>
            <ul class="schede">
              ${r.schede
                .map(
                  (una) => `
                <li class="${una.su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(una.nome)}</span>
                  <span class="tipo pastiglia">${testo(una.tipo === "wifi" ? "Wi-Fi" : "cavo")}</span>
                  ${una.principale ? '<span class="pastiglia bene">principale</span>' : ""}
                  ${
                    una.tipo === "wifi" && una.su && una.segnale !== null
                      ? `<span class="pastiglia ${una.segnale < SEGNALE_DEBOLE ? "attenta" : ""}">segnale ${una.segnale}%</span>`
                      : ""
                  }
                  <span class="dove">${una.su ? testo(una.ip) : "non attiva"}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                r.sorvegliate.quante === 0
                  ? "Nessun apparato di rete sorvegliato in questa casa: nella plancia, sezione «Macchine e rete», si spunta l'integrazione del router e i suoi ripetitori compaiono da soli."
                  : r.sorvegliate.giu === 0
                    ? `${plurale(r.sorvegliate.quante, "apparato sorvegliato", "apparati sorvegliati")}, tutti su.`
                    : `${r.sorvegliate.giu} ${r.sorvegliate.giu === 1 ? "apparato" : "apparati"} su ${r.sorvegliate.quante} non rispondono.`
              }
            </p>
          </section>`;
      }

      /* Gli add-on, e la sola domanda che conta: ce n'è qualcuno che dovrebbe
       * girare e non gira? */
      function gliAddon(c) {
        const a = c.addon;
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli add-on</h3>
              <span class="conta">${a.accesi}/${a.quanti} accesi</span>
            </div>
            <div class="addon">
              ${a.elenco
                .map((uno) => {
                  const come = uno.su ? "" : uno.allAvvio ? "fermo" : "apposta";
                  return `<span class="uno ${come}"
                    ><span class="puntino" aria-hidden="true"></span>${testo(uno.nome)}${
                      uno.su ? "" : uno.allAvvio ? " — fermo" : " — spento a mano"
                    }</span>`;
                })
                .join("")}
            </div>
            <p class="verdetto">
              ${
                addonGiu(c) === 0
                  ? "Nessun add-on con l'avvio automatico è fermo. Quelli spenti a mano restano spenti, ed è giusto: li ha spenti qualcuno."
                  : `${plurale(addonGiu(c), "add-on parte", "add-on partono")} all'avvio e in questo momento ${addonGiu(c) === 1 ? "è fermo" : "sono fermi"}. Nessuno spegne un add-on lasciandogli l'avvio automatico: questo si è fermato da solo.`
              }
            </p>
          </section>`;
      }

      /* ─── Schermata: gli aggiornamenti di tutta la flotta ─────────────
       *
       * Con quaranta impianti la domanda cambia. Casa per casa è «a questa
       * cosa manca?», e quella risposta sta nella scheda della casa. Da qui
       * invece è **«quali sono indietro su Home Assistant Core?»**, che è una
       * domanda sola con dentro quaranta case, e si sbriga in un gesto invece
       * che in quaranta.
       *
       * Si raggruppa per quello che c'è da installare, non per casa: le voci
       * uguali stanno insieme, e sotto ognuna ci sono le case che ce l'hanno
       * indietro, ciascuna con la versione che ha adesso.
       * ─────────────────────────────────────────────────────────────────── */
      function laFlotta() {
        /* Un mucchio per voce da installare. La chiave è il nome più la
         * versione a cui si va: «Home Assistant Core → 2026.9.1» è un
         * mucchio, «→ 2026.8.4» ne sarebbe un altro, e mescolarli vorrebbe
         * dire un tasto che installa due cose diverse. */
        const mucchi = new Map();
        for (const casa of CASE) {
          for (const uno of casa.carta.aggiornamenti.elenco) {
            const chiave = `${uno.nome} → ${uno.a}`;
            if (!mucchi.has(chiave))
              mucchi.set(chiave, { nome: uno.nome, a: uno.a, nostra: uno.nostra, case: [] });
            mucchi.get(chiave).case.push({ casa, voce: uno });
          }
        }

        const ordinati = [...mucchi.values()].sort((una, altra) => {
          if (una.nostra !== altra.nostra) return una.nostra ? -1 : 1;
          if (una.case.length !== altra.case.length) return altra.case.length - una.case.length;
          return una.nome.localeCompare(altra.nome);
        });

        const voci = ordinati.reduce((somma, uno) => somma + uno.case.length, 0);
        const dietro = CASE.filter((una) => una.carta.aggiornamenti.elenco.length).length;

        if (!ordinati.length)
          return `
            <h1 class="titolone">Gli aggiornamenti</h1>
            <p class="sottotitolo">Tutte le case sono aggiornate. Non capita spesso.</p>`;

        return `
          <h1 class="titolone">Gli aggiornamenti</h1>
          <p class="sottotitolo">
            ${plurale(voci, "cosa da installare", "cose da installare")} su
            ${plurale(dietro, "casa", "case")}, raggruppate per quello che sono e
            non per dove stanno: con quaranta impianti la domanda non è «cosa
            manca a questa casa», è «quali sono indietro su Home Assistant
            Core».
          </p>

          ${ordinati
            .map((uno) => {
              const giaInBallo = ({ casa }) =>
                staLavorando(casa.carta) && casa.carta.lavoro.cosa.startsWith(uno.nome);
              const possibili = uno.case.filter(
                (riga) =>
                  riga.voce.installabile && riga.casa.carta.manutenzione && !giaInBallo(riga),
              );
              const inBallo = uno.case.filter(giaInBallo).length;
              const chiuse = uno.case.filter(
                ({ casa, voce }) => voce.installabile && !casa.carta.manutenzione,
              ).length;
              const cacciavite = uno.case.filter(({ voce }) => !voce.installabile).length;

              return `
              <section class="riquadro mucchio">
                <div class="capoRiquadro">
                  <h3>${testo(uno.nome)}</h3>
                  <span class="conta">→ ${testo(uno.a)} · ${plurale(uno.case.length, "casa", "case")}</span>
                </div>
                <div class="indietro-chi">
                  ${uno.case
                    .map(({ casa, voce }) => {
                      const sta =
                        staLavorando(casa.carta) && casa.carta.lavoro.cosa.startsWith(uno.nome);
                      return `<span class="pastiglia ${sta ? "lavoro" : voce.installabile && casa.carta.manutenzione ? "" : "attenta"}"
                        >${testo(casa.nome)} · ${testo(voce.da)}${sta ? " · in corso" : ""}</span
                      >`;
                    })
                    .join("")}
                </div>
                ${
                  possibili.length
                    ? `<div class="azioni">
                        <button type="button" class="tasto forte">
                          Installa su ${plurale(possibili.length, "casa", "case")}
                        </button>
                      </div>`
                    : ""
                }
                ${
                  chiuse || cacciavite || inBallo
                    ? `<p class="verdetto">
                        ${inBallo ? `${plurale(inBallo, "casa lo sta", "case lo stanno")} già installando. ` : ""}${
                          chiuse
                            ? `${plurale(chiuse, "casa non ha", "case non hanno")} aperto la manutenzione al quadro. `
                            : ""
                        }${
                          cacciavite
                            ? `${plurale(cacciavite, "si porta", "si portano")} col cacciavite: da qui non ${cacciavite === 1 ? "si installa" : "si installano"}.`
                            : ""
                        }
                      </p>`
                    : ""
                }
              </section>`;
            })
            .join("")}

          <section class="riquadro" style="margin-top: 14px">
            <div class="capoRiquadro"><h3>Prima di premere</h3></div>
            <ul class="spunte">
              <li class="fatta">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Il backup viene prima, sempre.</b> Non è una casella da
                  spuntare: è la condizione perché il tasto esista. Un
                  aggiornamento che va storto senza backup dietro è una casa da
                  rifare.
                </span>
              </li>
              <li class="fatta">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Quelli che staccano il filo, uno per volta.</b> gdahome e
                  Home Assistant si riavviano installandosi: due insieme sulla
                  stessa casa vogliono dire non sapere quale dei due non è
                  tornato.
                </span>
              </li>
              <li class="fatta">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Quaranta case insieme sono quaranta rischi insieme.</b> Il
                  tasto qui sopra fa una cosa sola su più case, e va usato
                  sapendolo: se quella cosa va male, va male dappertutto. Una
                  casa per prova, e le altre il giorno dopo, è una noia che si
                  paga una volta sola.
                </span>
              </li>
            </ul>
          </section>
        `;
      }

      /* ─── Schermata: l'abbinamento ───────────────────────────────────
       *
       * Come una casa entra in questo quadro. È l'altra metà del lavoro, e
       * ricalca quello che gdahome fa già per abbinare un telefono: un codice
       * che vive pochi minuti, si usa una volta sola, e lascia dietro di sé una
       * chiave che vale per quella casa e per nessun'altra.
       *
       * Il verso è quello che è per un motivo. Non è il quadro che va a cercare
       * le case: è la casa che si presenta. Un quadro che andasse a bussare
       * dovrebbe sapere dove sono, e le case di gdahome un indirizzo pubblico
       * non ce l'hanno — è tutto il punto del ponte.
       * ─────────────────────────────────────────────────────────────────── */
      function lAbbinamento() {
        const primo = INVITI[0];

        return `
          <h1 class="titolone">Abbina un impianto</h1>
          <p class="sottotitolo">
            Un codice che vale <b>quindici minuti</b> e <b>una casa sola</b>. Si
            fa qui, si incolla nell'add-on in casa del cliente, e da quel momento
            quella casa manda al quadro la sua cartolina — e nient'altro.
          </p>

          <div class="abbina">
            <div class="colonna">
              <section class="riquadro tinto">
                <div class="capoRiquadro"><h3>Il codice di adesso</h3></div>
                <div class="codice">
                  <span class="cifre">${testo(primo.codice)}</span>
                  <button type="button" class="tasto copia">Copia</button>
                </div>
                <div class="scadenza">
                  <span class="battito" aria-hidden="true"></span>
                  Scade fra <b data-orologio="${primo.scadeFra}">—</b> · fatto ${testo(primo.fattoIl)}
                </div>

                <ol class="passi" style="margin-top: 20px">
                  <li>
                    <span>
                      In casa del cliente, apri Home Assistant e vai in
                      <span class="strada">Impostazioni → Add-on → gdahome → Configurazione</span>.
                    </span>
                  </li>
                  <li>
                    <span>
                      Incolla il codice nella casella <b>quadro</b> e premi
                      <b>Salva</b>. L'add-on si riavvia da solo.
                    </span>
                  </li>
                  <li>
                    <span>
                      Entro un minuto la casa compare qui sotto, in
                      <b>appena arrivate</b>. Le dai un nome e hai finito.
                    </span>
                  </li>
                </ol>

                <div class="azioni">
                  <button type="button" class="tasto forte grande">Fai un altro codice</button>
                  <button type="button" class="tasto grande">Scrivi per chi è</button>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Appena arrivate</h3>
                  <span class="conta">${APPENA.length}</span>
                </div>
                ${
                  APPENA.length
                    ? `<ul class="righe">
                        ${APPENA.map(
                          (una) => `
                          <li>
                            <span class="che">
                              <b class="mono">${testo(una.casa.slice(0, 22))}…</b>
                              <span>arrivata ${testo(una.arrivataIl)} · Home Assistant ${testo(una.ha)}</span>
                            </span>
                            <input
                              type="text"
                              id="nome-${testo(una.casa.slice(5, 13))}"
                              placeholder="Come la chiami?"
                              aria-label="Il nome di questa casa"
                            />
                            <button type="button" class="tasto forte">Tienila</button>
                          </li>`,
                        ).join("")}
                      </ul>
                      <p class="nota" style="margin-top: 14px">
                        Il nome lo scrivi tu e resta qui: la casa non lo manda e
                        non lo saprà mai. È l'unica cosa in questo quadro che
                        parla di una persona, e sta sulla tua macchina perché con
                        quella persona il contratto ce l'hai tu.
                      </p>`
                    : `<div class="vuoto">
                        <span class="battito" aria-hidden="true"></span>
                        Nessuna casa in arrivo. Quando una userà il codice, la
                        vedi comparire qui.
                      </div>`
                }
              </section>
            </div>

            <div class="colonna">
              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Codici in attesa</h3>
                  <span class="conta">${INVITI.length}</span>
                </div>
                <ul class="righe">
                  ${INVITI.map(
                    (uno) => `
                    <li>
                      <span class="che">
                        <b class="mono">${testo(uno.codice)}</b>
                        <span>${uno.per ? `${testo(uno.per)} · ` : ""}fatto ${testo(uno.fattoIl)}</span>
                      </span>
                      <span class="pastiglia attenta">
                        scade fra <b data-orologio="${uno.scadeFra}">—</b>
                      </span>
                      <button type="button" class="tasto male">Annulla</button>
                    </li>`,
                  ).join("")}
                </ul>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    Un codice che scade non fa danni: semplicemente non apre più
                    niente. Se ne fai uno e poi cambi idea, annullalo — finché è
                    vivo, chiunque ce l'abbia può far entrare <em>una</em> casa
                    in questo quadro.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Come funziona, in breve</h3></div>
                <ul class="spunte">
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il codice si brucia.</b> Appena una casa lo usa, non vale
                      più per nessun'altra: quella casa riceve una chiave sua, e
                      da lì in poi è con quella che si presenta.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Si stacca da due parti.</b> Tu con «non seguirla più», e
                      chi ci abita dalla console dell'add-on, dove legge in chiaro
                      l'ultima cartolina spedita e ha lì il tasto per smettere.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il quadro non guarda dentro.</b> Non apre la plancia e
                      non vede entità, stanze né persone: riceve una cartolina
                      di numeri. Per entrare in una casa serve un abbinamento, e
                      quello lo dà chi ci abita, col suo segno, che toglie con un
                      bottone quando vuole.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>La manutenzione è un secondo interruttore.</b> Mandare
                      la cartolina e lasciarsi aggiornare sono due permessi, e il
                      secondo è spento di serie: chi lo accende lo accende
                      apposta. Acceso, il quadro può installare un aggiornamento
                      e riavviare un add-on fermo — due verbi, scritti nel
                      programma, e nient'altro. Ogni cosa che fa resta scritta
                      nella console dell'add-on, dove la legge chi ci abita.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Non passa dal centralino.</b> La cartolina va dalla casa
                      al tuo quadro e basta: su
                      <span class="strada">tramite.gdahome.org</span> non ci
                      finisce niente.
                    </span>
                  </li>
                </ul>
              </section>
            </div>
          </div>
        `;
      }

      /* Gli orologi delle scadenze. Un codice che scade è la cosa che fa
       * sbagliare una installazione — si fa il codice, si sale in macchina, si
       * arriva e non vale più — quindi quanto gli resta si vede, e si muove. */
      let ticchettio = null;

      function avviaGliOrologi() {
        if (ticchettio) clearInterval(ticchettio);
        const quadranti = [...dove.querySelectorAll("[data-orologio]")];
        if (!quadranti.length) return;
        const partiti = quadranti.map((q) => ({
          q,
          fino: Date.now() + Number(q.dataset.orologio) * 1000,
        }));
        const gira = () => {
          for (const { q, fino } of partiti) {
            const restano = Math.max(0, Math.round((fino - Date.now()) / 1000));
            const minuti = String(Math.floor(restano / 60)).padStart(2, "0");
            const secondi = String(restano % 60).padStart(2, "0");
            q.textContent = restano ? `${minuti}:${secondi}` : "scaduto";
          }
        };
        gira();
        ticchettio = setInterval(gira, 1000);
      }

      disegna();
    </script>
  </body>
</html>
