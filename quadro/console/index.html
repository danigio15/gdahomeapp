<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cruscotto installatore</title>
    <!--
      IL QUADRO — LA CONSOLE DI CHI INSTALLA.

      Questa pagina è una sola, e sta tutta qui: il server la legge dal disco e
      la serve su `/console/`. Da lì chiede le sue vie in **relativo** — `case`,
      non `/console/case` — così funziona anche dietro un proxy che la monta
      sotto un prefisso. Chi bussa a `/console` senza barra ci viene mandato dal
      server, perché da `/console` un indirizzo relativo porterebbe a `/case`.

      Niente font, niente librerie, nessuna richiesta a nessuno che non sia il
      proprio quadro: la regola delle altre console del progetto vale anche qui.

      QUI NON SI DECIDE NIENTE.

      Lo stato di una casa, le spunte del collaudo e le pastiglie arrivano già
      decisi da `quadro/src/collaudo.js`, dentro `GET case`. Questa pagina li
      disegna e basta. Era nata col contrario — le regole scritte qui, coi dati
      finti accanto — e il giorno che una soglia cambia, cambiarla in due posti
      vuol dire cambiarla in uno solo: due schermi che dicono due cose diverse
      della stessa casa. Anche le tre soglie che colorano i metri (caldo, disco
      pieno, disco finito) viaggiano dal server insieme alle case.

      DA DOVE VENGONO I COLORI E LE FORME.

      Da `sito/stile.css` e dalla plancia, non dalla console del centralino. Le
      prime due stesure erano parenti di quella — grigio-verde, fili sottili,
      angoli da tre millimetri — e quella è un attrezzo da manutentore. gdahome
      invece è bianco su azzurro chiarissimo, angoli da venti, ombre morbide a
      due strati, pastiglie tonde e una barretta colorata a sinistra delle
      righe: è così la plancia, è così il sito, e questa pagina è dello stesso
      prodotto.

      Le tessere dello stato in cima sono la stessa striscia che la plancia ha
      sopra la Home («Inserito · 1 porta aperta · 1 varco aperto»).

      DUE SCHERMATE.

      «Le case» è il cruscotto: l'elenco a sinistra, la casa aperta a destra.
      «Abbina» è come una casa entra qui dentro, ed è l'altra metà del lavoro:
      senza quella il quadro è un cruscotto senza cruscotto.

      UNA COSA MISURATA, CHE HA DECISO IL DISEGNO.

      I tre colori di stato del sito — `--bene`, `--ambra`, `--male` — passano
      la prova del daltonismo, ma l'ambra sul bianco sta sotto il contrasto di
      3:1 e la coppia ambra/verde si avvicina a 7.0 per chi non distingue il
      rosso. Perciò ogni stato porta tre cose insieme: una **forma** (● ▲ ■ ◇),
      una **parola** e un colore. Chi non vede i colori legge la pagina lo
      stesso, e chi li vede la legge più in fretta.

      L'azzurro è l'unica cosa che si preme, e sta fuori dai tre colori di stato
      apposta: un colore che vuol dire «guasto» e «premi qui» insieme non vuol
      dire più niente.
    -->
    <style>
      /* ─── I colori ──────────────────────────────────────────────────────
       *
       * Sono quelli di `sito/stile.css`, non reinventati: la notte, l'azzurro,
       * l'ambra, il bene e il male, più gli aloni tenui che la plancia usa
       * dietro le pastiglie. Il chiaro sta qui tutto intero; sotto si
       * ridefiniscono solo le tessere che cambiano, due volte — per chi ha il
       * sistema scuro e per chi lo sceglie. */
      :root {
        --notte: #0f172a;
        --lieve: #64748b;
        --fioco: #94a3b8;

        --fondo: #f0f4f8;
        --carta: #ffffff;
        --carta-alta: #f8fafc;
        --bordo: #e2e8f0;
        --bordo-tenue: #eef2f7;

        --azzurro: #0ea5e9;
        --azzurro-scuro: #0284c7;
        --azzurro-cupo: #075985;
        --bene: #15803d;
        --ambra: #b45309;
        --male: #be123c;

        --alone-azzurro: #e0f2fe;
        --alone-bene: #dcfce7;
        --alone-ambra: #fef3c7;
        --alone-male: #ffe4e6;
        --giorno-pieno: #86efac;

        --ombra: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        --ombra-alta: 0 2px 6px rgba(15, 23, 42, 0.06), 0 24px 60px rgba(15, 23, 42, 0.12);
        --ombra-tasto: 0 1px 2px rgba(15, 23, 42, 0.08), 0 6px 16px rgba(2, 132, 199, 0.28);

        --raggio: 20px;
        --raggio-piccolo: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --notte: #e8eef7;
          --lieve: #93a3bb;
          --fioco: #6b7c96;

          --fondo: #0a1120;
          --carta: #121c2e;
          --carta-alta: #18243a;
          --bordo: #223049;
          --bordo-tenue: #1b2739;

          --azzurro: #38bdf8;
          --azzurro-scuro: #0ea5e9;
          --azzurro-cupo: #7dd3fc;
          --bene: #4ade80;
          --ambra: #fbbf24;
          --male: #fb7185;

          --alone-azzurro: #0c2a3e;
          --alone-bene: #10321f;
          --alone-ambra: #33270c;
          --alone-male: #3b1520;
          --giorno-pieno: #1f7a4d;

          --ombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.32);
          --ombra-alta: 0 2px 6px rgba(0, 0, 0, 0.36), 0 24px 60px rgba(0, 0, 0, 0.46);
          --ombra-tasto: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(14, 165, 233, 0.3);
        }
      }

      :root[data-theme="dark"] {
        --notte: #e8eef7;
        --lieve: #93a3bb;
        --fioco: #6b7c96;

        --fondo: #0a1120;
        --carta: #121c2e;
        --carta-alta: #18243a;
        --bordo: #223049;
        --bordo-tenue: #1b2739;

        --azzurro: #38bdf8;
        --azzurro-scuro: #0ea5e9;
        --azzurro-cupo: #7dd3fc;
        --bene: #4ade80;
        --ambra: #fbbf24;
        --male: #fb7185;

        --alone-azzurro: #0c2a3e;
        --alone-bene: #10321f;
        --alone-ambra: #33270c;
        --alone-male: #3b1520;
        --giorno-pieno: #1f7a4d;

        --ombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.32);
        --ombra-alta: 0 2px 6px rgba(0, 0, 0, 0.36), 0 24px 60px rgba(0, 0, 0, 0.46);
        --ombra-tasto: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(14, 165, 233, 0.3);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--fondo);
        color: var(--notte);
        font:
          15px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--azzurro);
        outline-offset: 3px;
        border-radius: 8px;
      }

      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      .via {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ─── La testata ──────────────────────────────────────────────────── */
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: color-mix(in srgb, var(--fondo) 88%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--bordo-tenue);
      }

      .testata {
        max-width: 80rem;
        margin-inline: auto;
        padding: 13px 22px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      /* Lo spazio per il tasto del menu di Home Assistant.
         Questa pagina si apre anche **dentro** Home Assistant, in un riquadro
         che ci mette sopra un tasto per riaprire il menu. Quel tasto galleggia:
         sta in un altro documento, non sa cosa ha sotto di se' e non gli fa
         spazio. Finora si e' provato a scansarlo — prima il marchio che ci
         finiva sotto, poi il tasto spostato a destra dove si sedeva sulla nav —
         e scansare non funziona, perche' da una parte o dall'altra sotto c'e'
         sempre qualcosa.
         Quindi non lo si scansa: gli si fa **spazio**. Quaranta punti piu' otto
         di stacco, e solo quando questa pagina sta davvero dentro un riquadro
         — aperta nel browser quel tasto non c'e', e un buco in cima sarebbe
         solo un buco. */
      :root[data-dentro] .testata {
        padding-inline-start: 56px;
      }

      .marchio {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      /* Il bollo: un quadratino con la barra, come un quadro elettrico visto da
       * lontano. Non sta piu' in testata — se lo mangiava il tasto del menu di
       * Home Assistant — e serve al segno degli aggiornamenti nostri, dove
       * distingue gdahome da tutto il resto senza andare a scaricare niente. */
      .bollo {
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 9px;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-cupo));
        display: grid;
        place-items: center;
        gap: 3px;
        grid-auto-flow: column;
        box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
      }

      .bollo i {
        width: 3.5px;
        height: 14px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.92);
      }

      .bollo i.mezzo {
        height: 8px;
        background: rgba(255, 255, 255, 0.6);
      }

      .marchio .nomi {
        min-width: 0;
      }

      .marchio b {
        display: block;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.25;
      }

      .marchio span {
        display: block;
        color: var(--lieve);
        font-size: 0.76rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--carta);
        border: 1px solid var(--bordo);
        border-radius: 999px;
        box-shadow: var(--ombra);
      }

      nav button {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 550;
        color: var(--lieve);
        background: transparent;
        border: 0;
        border-radius: 999px;
        padding: 7px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      nav button:hover {
        color: var(--notte);
      }

      nav button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-scuro));
        box-shadow: 0 1px 3px rgba(2, 132, 199, 0.35);
      }

      nav .quanti {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      nav button[aria-pressed="true"] .quanti {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
      }

      /* ─── L'impianto della pagina ────────────────────────────────────── */
      main {
        max-width: 80rem;
        margin-inline: auto;
        padding: 22px;
      }

      .titolone {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.028em;
        margin: 0 0 4px;
        text-wrap: balance;
      }

      .sottotitolo {
        color: var(--lieve);
        font-size: 0.92rem;
        margin: 0 0 18px;
        max-width: 46rem;
      }

      /* Il marchio dell'installatore, dove c'e'. In testata e nel riquadro da
         cui si carica: stessa forma, due misure. */
      .suoMarchio {
        flex: none;
        border-radius: 9px;
        object-fit: contain;
        background: var(--carta);
      }

      .testata .suoMarchio {
        width: 30px;
        height: 30px;
      }

      .provaMarchio {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .provaMarchio .suoMarchio {
        width: 54px;
        height: 54px;
        border: 1px solid var(--bordo-tenue);
      }

      /* Il quadrato vuoto di chi un marchio non ce l'ha ancora: dice dove
         andra' a finire, invece di lasciare la riga senza niente. */
      .provaMarchio .vuoto {
        width: 54px;
        height: 54px;
        flex: none;
        border-radius: 9px;
        border: 1px dashed var(--bordo);
        display: grid;
        place-items: center;
        color: var(--fioco);
        font-size: 0.72rem;
        text-align: center;
        line-height: 1.2;
      }

      /* ─── I titoli che spezzano la scheda di una casa ────────────────
         La scheda e' una colonna di dieci riquadri, e ognuno ha gia' la sua
         etichettina grigia. Dieci etichettine sono dieci cose sullo stesso
         piano: chi cerca «cosa devo fare qui» le legge tutte e dieci.
         Questi titoli fanno il piano di sopra, e sono tre perche' le domande
         che si fanno aprendo la scheda di un impianto sono tre: cosa mi tocca,
         come sta, e cosa c'e' dentro di preciso. */
      .capitolo {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 26px 0 12px;
      }

      .capitolo:first-of-type {
        margin-top: 18px;
      }

      .capitolo h2 {
        margin: 0;
        font-size: 1.12rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        flex: none;
      }

      .capitolo span {
        color: var(--fioco);
        font-size: 0.83rem;
        min-width: 0;
      }

      /* Un filo che porta l'occhio fino in fondo alla riga: senza, un titolo
         corto in cima a un riquadro largo galleggia. */
      .capitolo::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--bordo-tenue);
      }

      @media (max-width: 640px) {
        /* Sul telefono la riga di spiegazione va a capo sotto il titolo, e il
           filo non ci sta piu': si toglie invece di spezzarsi in due. */
        .capitolo {
          flex-wrap: wrap;
          gap: 2px 12px;
        }

        .capitolo::after {
          display: none;
        }
      }

      /* ─── La striscia dello stato, come sopra la Home della plancia ─── */
      .striscia {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .tessera {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 15px;
        background: var(--carta);
        border-radius: var(--raggio-piccolo);
        box-shadow: var(--ombra);
        text-align: left;
        font: inherit;
        color: inherit;
        border: 1.5px solid transparent;
        cursor: pointer;
      }

      .tessera[aria-pressed="true"] {
        border-color: var(--azzurro);
      }

      .tessera .gettone {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }

      .tessera .numeri b {
        display: block;
        font-size: 1.3rem;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .tessera .numeri span {
        display: block;
        font-size: 0.74rem;
        color: var(--lieve);
        line-height: 1.3;
      }

      .gettone.posto {
        background: var(--alone-bene);
        color: var(--bene);
      }

      .gettone.guardare {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      .gettone.muta {
        background: var(--alone-male);
        color: var(--male);
      }

      .gettone.aperto {
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
      }

      /* ─── Il banco: l'elenco e la casa aperta ───────────────────────── */
      .banco {
        display: grid;
        grid-template-columns: minmax(0, 26rem) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .fila {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* ─── Una casa nell'elenco ──────────────────────────────────────── */
      .casa {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--carta);
        border: 1.5px solid transparent;
        border-radius: var(--raggio-piccolo);
        padding: 14px 15px 14px 20px;
        cursor: pointer;
        box-shadow: var(--ombra);
        overflow: hidden;
      }

      /* La barretta: la stessa che la plancia mette a sinistra delle righe
       * dei widget. Qui dice come sta la casa, e si legge in colonna senza
       * leggere le parole. */
      .casa::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 14px;
        bottom: 14px;
        width: 4px;
        border-radius: 3px;
        background: var(--fioco);
      }

      .casa.posto::before {
        background: var(--bene);
      }

      .casa.guardare::before {
        background: var(--ambra);
      }

      .casa.muta::before {
        background: var(--male);
      }

      .casa.aperto::before {
        background: var(--azzurro);
      }

      .casa[aria-current="true"] {
        border-color: var(--azzurro);
        box-shadow: var(--ombra-alta);
      }

      .capo {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .capo .nome {
        font-size: 0.97rem;
        font-weight: 650;
        letter-spacing: -0.012em;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .capo .quando {
        margin-left: auto;
        flex: none;
        color: var(--fioco);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }

      /* ─── Le pastiglie tonde ────────────────────────────────────────── */
      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.74rem;
        font-weight: 600;
        line-height: 1.35;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--carta-alta);
        color: var(--lieve);
        white-space: nowrap;
      }

      .pastiglia.posto,
      .pastiglia.bene {
        background: var(--alone-bene);
        color: var(--bene);
      }

      .pastiglia.guardare,
      .pastiglia.attenta {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      .pastiglia.muta,
      .pastiglia.male {
        background: var(--alone-male);
        color: var(--male);
      }

      .pastiglia.aperto {
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
      }

      .pastiglie {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 9px;
      }

      .fianco {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 6px;
        color: var(--fioco);
        font-size: 0.75rem;
      }

      /* ─── La striscia dei quattordici giorni ────────────────────────── */
      .giorni {
        display: flex;
        gap: 3px;
        margin-top: 11px;
      }

      .giorni i {
        flex: 1;
        height: 14px;
        border-radius: 3px;
        background: var(--giorno-pieno);
      }

      .giorni.grande i {
        height: 24px;
        border-radius: 5px;
      }

      .giorni i.mezza {
        background: var(--ambra);
        opacity: 0.75;
      }

      .giorni i.vuota {
        background: var(--male);
      }

      .giorni i.prima {
        background: var(--bordo-tenue);
      }

      .giorniDice {
        color: var(--fioco);
        font-size: 0.73rem;
        margin-top: 6px;
      }

      /* ─── Le schede della casa aperta ───────────────────────────────── */
      .scheda {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }

      .riquadro {
        background: var(--carta);
        border-radius: var(--raggio);
        padding: 20px 22px;
        box-shadow: var(--ombra);
      }

      .riquadro.tinto {
        background: linear-gradient(
          160deg,
          var(--alone-azzurro),
          color-mix(in srgb, var(--alone-azzurro) 45%, var(--carta))
        );
        border: 1.5px solid color-mix(in srgb, var(--azzurro) 35%, transparent);
      }

      .indietro {
        display: none;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 550;
        color: var(--azzurro-scuro);
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        align-self: flex-start;
      }

      h2 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.028em;
        text-wrap: balance;
      }

      .titolo {
        display: flex;
        align-items: center;
        gap: 11px;
        flex-wrap: wrap;
      }

      .perché {
        color: var(--lieve);
        font-size: 0.9rem;
        margin: 7px 0 0;
      }

      h3 {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fioco);
      }

      .capoRiquadro {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
      }

      .capoRiquadro .conta {
        margin-left: auto;
        font-size: 0.85rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--lieve);
      }

      .targa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 14px 22px;
        margin-top: 18px;
        padding-top: 17px;
        border-top: 1px solid var(--bordo-tenue);
      }

      .targa dt {
        color: var(--fioco);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .targa dd {
        margin: 3px 0 0;
        font-size: 0.87rem;
        font-variant-numeric: tabular-nums;
      }

      /* ─── I tasti ───────────────────────────────────────────────────── */
      .azioni {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .tasto {
        font: inherit;
        font-size: 0.86rem;
        font-weight: 550;
        color: var(--notte);
        background: var(--carta);
        border: 1px solid var(--bordo);
        border-radius: 11px;
        padding: 9px 16px;
        cursor: pointer;
      }

      .tasto:hover {
        border-color: var(--fioco);
      }

      .tasto.forte {
        color: #fff;
        background: linear-gradient(145deg, var(--azzurro), var(--azzurro-scuro));
        border-color: transparent;
        box-shadow: var(--ombra-tasto);
      }

      .tasto.male {
        color: var(--male);
        border-color: color-mix(in srgb, var(--male) 40%, transparent);
        background: transparent;
      }

      .tasto:disabled {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
      }

      .tasto.grande {
        font-size: 0.95rem;
        padding: 12px 22px;
        border-radius: 13px;
      }

      /* La riga del limite: cosa questo quadro non può fare. Sta sotto i
       * tasti e non in fondo alla pagina, perché è la cornice dentro cui si
       * legge tutto il resto — e perché un tasto che non c'è si nota meno di
       * una riga che dice perché non c'è. */
      .limite {
        display: flex;
        gap: 11px;
        margin: 16px 0 0;
        padding: 13px 15px;
        background: var(--carta-alta);
        border-radius: var(--raggio-piccolo);
        font-size: 0.83rem;
        line-height: 1.55;
        color: var(--lieve);
      }

      .limite .gettone {
        width: 24px;
        height: 24px;
        flex: none;
        border-radius: 8px;
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }

      .limite b {
        color: var(--notte);
      }

      /* ─── Il misuratore del collaudo ────────────────────────────────── */
      .misura {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
      }

      .misura i {
        flex: 1;
        height: 7px;
        border-radius: 4px;
        background: var(--alone-ambra);
      }

      .misura i.fatta {
        background: var(--bene);
      }

      ul.spunte {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.spunte li {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 0;
        font-size: 0.89rem;
      }

      ul.spunte li + li {
        border-top: 1px solid var(--bordo-tenue);
      }

      ul.spunte .bollino {
        flex: none;
        width: 21px;
        height: 21px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 0.68rem;
        font-weight: 700;
      }

      ul.spunte .fatta .bollino {
        background: var(--alone-bene);
        color: var(--bene);
      }

      ul.spunte .manca .bollino {
        background: var(--alone-ambra);
        color: var(--ambra);
      }

      ul.spunte .cosa {
        flex: 1;
        min-width: 0;
      }

      ul.spunte .manca .cosa {
        font-weight: 600;
      }

      ul.spunte .dettaglio {
        color: var(--fioco);
        font-size: 0.79rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .verdetto {
        margin: 16px 0 0;
        padding-top: 15px;
        border-top: 1px solid var(--bordo-tenue);
        font-size: 0.85rem;
        color: var(--lieve);
      }

      /* ─── Le misure della salute ────────────────────────────────────── */
      .misure {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: 10px;
        margin-top: 17px;
      }

      .misure > div {
        background: var(--carta-alta);
        border-radius: var(--raggio-piccolo);
        padding: 12px 14px;
      }

      .misure dt {
        color: var(--fioco);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .misure dd {
        margin: 5px 0 0;
        font-size: 1.28rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .misure dd small {
        display: block;
        font-size: 0.73rem;
        font-weight: 450;
        letter-spacing: 0;
        color: var(--fioco);
        margin-top: 3px;
      }

      .misure dd.male {
        color: var(--male);
      }

      .misure dd.attenta {
        color: var(--ambra);
      }

      /* ─── Le versioni ───────────────────────────────────────────────── */
      table.versioni {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }

      table.versioni td {
        padding: 9px 0;
      }

      table.versioni tr + tr td {
        border-top: 1px solid var(--bordo-tenue);
      }

      table.versioni td.numero {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .nomiGiu {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 13px;
      }

      /* Niente monospaziato e niente `nowrap`: qui dentro non ci sono piu'
         quattro cifre, ci sono nomi come «Termostato del soggiorno», e su un
         telefono uno solo di quelli e' piu' largo dello schermo. */
      .nomiGiu span {
        font-size: 0.85rem;
        font-weight: 600;
        padding: 5px 11px;
        border-radius: 9px;
        background: var(--alone-male);
        color: var(--male);
      }

      .nomiGiu span.eAltri {
        background: transparent;
        color: var(--lieve);
        font-weight: 500;
      }

      .nota {
        color: var(--lieve);
        font-size: 0.85rem;
        line-height: 1.6;
        max-width: 44rem;
        margin: 0;
      }

      details.rapporto summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      details.rapporto summary::-webkit-details-marker {
        display: none;
      }

      details.rapporto summary::after {
        content: "mostra";
        margin-left: auto;
        font-size: 0.82rem;
        font-weight: 550;
        color: var(--azzurro-scuro);
      }

      details.rapporto[open] summary::after {
        content: "nascondi";
      }

      details.rapporto pre {
        margin: 15px 0 0;
        padding: 15px;
        background: var(--carta-alta);
        border-radius: var(--raggio-piccolo);
        overflow-x: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.76rem;
        line-height: 1.65;
        color: var(--lieve);
      }

      /* ─── I metri della macchina ────────────────────────────────────
       *
       * Quattro barre, non quattro numeri: la percentuale di un disco la si
       * capisce guardandola, e il colore dice da solo se è il caso di
       * muoversi. Il binario vuoto è l'alone del colore che avrebbe la barra
       * piena, così lo stato si legge su tutta la larghezza e non solo dove
       * il riempimento arriva. */
      .metri {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 15px 22px;
      }

      .capoMetro {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-bottom: 6px;
      }

      .capoMetro span {
        color: var(--fioco);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .capoMetro b {
        margin-left: auto;
        font-size: 0.95rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .capoMetro small {
        color: var(--fioco);
        font-size: 0.73rem;
        font-weight: 450;
      }

      .binario {
        position: relative;
        height: 9px;
        border-radius: 5px;
        overflow: hidden;
      }

      .binario i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 5px;
      }

      .binario.bene {
        background: var(--alone-bene);
      }

      .binario.bene i {
        background: var(--bene);
      }

      .binario.attenta {
        background: var(--alone-ambra);
      }

      .binario.attenta i {
        background: var(--ambra);
      }

      .binario.male {
        background: var(--alone-male);
      }

      .binario.male i {
        background: var(--male);
      }

      /* La tacca dei settantacinque gradi, quella che la plancia disegna già
       * sull'arco del MiniPC. */
      .binario .nonLoDice {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--fioco);
        background: var(--carta-alta);
        border-radius: 5px;
      }

      .binario .tacca {
        position: absolute;
        inset: 0 auto;
        width: 3px;
        margin-left: -1.5px;
        background: var(--carta);
      }

      .capoMetro b.male {
        color: var(--male);
      }

      .capoMetro b.attenta {
        color: var(--ambra);
      }

      /* ─── Le schede di rete ─────────────────────────────────────────── */
      ul.schede {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.schede li {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 0;
        font-size: 0.88rem;
        flex-wrap: wrap;
      }

      ul.schede li + li {
        border-top: 1px solid var(--bordo-tenue);
      }

      ul.schede .lucina {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 999px;
      }

      ul.schede .su .lucina {
        background: var(--bene);
        box-shadow: 0 0 0 4px var(--alone-bene);
      }

      ul.schede .giu .lucina {
        background: var(--fioco);
        box-shadow: 0 0 0 4px var(--bordo-tenue);
      }

      ul.schede .come {
        font-weight: 650;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.83rem;
      }

      ul.schede .dove {
        margin-left: auto;
        color: var(--fioco);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }

      ul.schede .giu .come,
      ul.schede .giu .tipo {
        color: var(--fioco);
      }

      /* ─── Gli aggiornamenti ────────────────────────────────────────── */
      ul.versi {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      /* Una riga e' una griglia di tre colonne — il segno, cosa e', cosa si
         fa — e cosa cambia va sotto, larga quanto le ultime due: su un
         telefono le note sotto il logo sarebbero una colonna di parole
         spezzate. */
      ul.versi li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px 12px;
        padding: 11px 0;
      }

      ul.versi li + li {
        border-top: 1px solid var(--bordo-tenue);
      }

      ul.versi .che {
        min-width: 0;
      }

      /* Le pastiglie e i tasti stanno in fondo, tutti nella terza colonna. */
      ul.versi .fare {
        grid-column: 3;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      /* ─── Il segno di un aggiornamento ───────────────────────────────
         L'iniziale sta sotto e si vede sempre; il marchio, quando arriva, ci
         si mette sopra. Quello che non arriva — una casa senza internet, un
         marchio che non esiste — si toglie da solo e sotto c'e' gia' la
         lettera, invece di un quadratino rotto. */
      .segno {
        width: 32px;
        height: 32px;
        flex: none;
        position: relative;
        border-radius: 9px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--carta-alta);
        color: var(--fioco);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .segno img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--carta);
      }

      /* Cosa cambia, con le parole di chi l'ha scritto. */
      ul.versi .cambia {
        grid-column: 2 / -1;
        margin: 0;
        color: var(--lieve);
        font-size: 0.82rem;
        line-height: 1.55;
        white-space: pre-line;
      }

      ul.versi .cambia a {
        color: var(--azzurro-cupo);
        white-space: nowrap;
      }

      ul.versi .che b {
        display: block;
        font-size: 0.89rem;
        font-weight: 650;
      }

      ul.versi .salto {
        display: block;
        color: var(--fioco);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      ul.versi .tasto {
        padding: 6px 14px;
        font-size: 0.82rem;
      }

      .pastiglia.lavoro {
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
      }

      /* Il cartello del lavoro in ballo. Azzurro e non ambra: non è un guaio,
       * è una cosa che sta succedendo. */
      .cartello {
        display: flex;
        gap: 12px;
        margin-bottom: 15px;
        padding: 14px 16px;
        border-radius: var(--raggio-piccolo);
        font-size: 0.86rem;
        line-height: 1.55;
        background: var(--alone-azzurro);
      }

      .cartello.male {
        background: var(--alone-male);
      }

      .cartello.bene {
        background: var(--alone-bene);
      }

      .cartello .gettone {
        width: 25px;
        height: 25px;
        flex: none;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 0.75rem;
        font-weight: 700;
        background: color-mix(in srgb, var(--azzurro) 22%, transparent);
        color: var(--azzurro-cupo);
      }

      .cartello.male .gettone {
        background: color-mix(in srgb, var(--male) 22%, transparent);
        color: var(--male);
      }

      .cartello.bene .gettone {
        background: color-mix(in srgb, var(--bene) 22%, transparent);
        color: var(--bene);
      }

      /* ─── La flotta degli aggiornamenti ────────────────────────────── */
      .mucchio + .mucchio {
        margin-top: 14px;
      }

      .mucchio ul.versi {
        margin-top: 4px;
      }

      /* ─── Gli add-on ────────────────────────────────────────────────── */
      .addon {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .addon .uno {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.79rem;
        font-weight: 550;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--alone-bene);
        color: var(--bene);
      }

      .addon .uno.fermo {
        background: var(--alone-male);
        color: var(--male);
      }

      .addon .uno.apposta {
        background: var(--carta-alta);
        color: var(--fioco);
      }

      .addon .uno .puntino {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
      }

      .addon .uno.apposta .puntino {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px currentColor;
      }

      /* ─── L'abbinamento ─────────────────────────────────────────────── */
      .abbina {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .colonna {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      /* Il codice: la cosa più grande della schermata, perché è la cosa che
       * si deve copiare stando in piedi in casa di qualcun altro. */
      .codice {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 16px 0 12px;
        padding: 16px 18px;
        background: var(--carta);
        border-radius: var(--raggio-piccolo);
        box-shadow: var(--ombra);
      }

      .codice .cifre {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: clamp(1.1rem, 4.6vw, 1.55rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .codice .copia {
        margin-left: auto;
      }

      .scadenza {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 0.83rem;
        color: var(--lieve);
      }

      .scadenza b {
        font-variant-numeric: tabular-nums;
        color: var(--notte);
      }

      /* I passi: numerati perché sono davvero una sequenza — il codice si fa
       * qui, si incolla là, e il rapporto arriva dopo. */
      ol.passi {
        list-style: none;
        counter-reset: passo;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      ol.passi li {
        counter-increment: passo;
        display: flex;
        gap: 13px;
        font-size: 0.89rem;
      }

      ol.passi li > span {
        min-width: 0;
      }

      ol.passi li::before {
        content: counter(passo);
        flex: none;
        width: 25px;
        height: 25px;
        border-radius: 9px;
        background: var(--alone-azzurro);
        color: var(--azzurro-cupo);
        display: grid;
        place-items: center;
        font-size: 0.78rem;
        font-weight: 700;
      }

      ol.passi b {
        font-weight: 650;
      }

      .strada {
        display: inline-block;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.8rem;
        padding: 1px 7px;
        border-radius: 7px;
        background: var(--carta-alta);
        color: var(--notte);
      }

      /* Le righe in attesa e appena arrivate. */
      ul.righe {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.righe li {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 0;
        flex-wrap: wrap;
      }

      ul.righe li + li {
        border-top: 1px solid var(--bordo-tenue);
      }

      ul.righe .che {
        min-width: 0;
        flex: 1;
      }

      ul.righe .che b {
        display: block;
        font-size: 0.88rem;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      ul.righe .che span {
        display: block;
        color: var(--fioco);
        font-size: 0.76rem;
      }

      .vuoto {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 16px 0 4px;
        color: var(--fioco);
        font-size: 0.86rem;
      }

      .battito {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 999px;
        background: var(--bene);
        box-shadow: 0 0 0 4px var(--alone-bene);
        animation: respira 2.4s ease-in-out infinite;
      }

      @keyframes respira {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      input[type="text"] {
        font: inherit;
        font-size: 0.87rem;
        color: var(--notte);
        background: var(--carta-alta);
        border: 1px solid var(--bordo);
        border-radius: 11px;
        padding: 9px 13px;
        min-width: 0;
        flex: 1;
      }

      /* Un tasto che si legge come il titolo che e': apre la scheda di quella
         casa, e sopra un riquadro degli aggiornamenti e' il gesto che serve.
         Un `<button>` e non un `<a>` perche' non si va da nessuna parte — si
         cambia schermata qui dentro — e chi naviga con la tastiera o con lo
         schermo che legge deve sentirsi dire «bottone». */
      .comeUnLink {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: start;
      }
      .comeUnLink:hover {
        text-decoration: underline;
      }

      /* La casella per rinominare, che compare sotto i tasti della casa.
         Stessa fila dei tasti sopra, cosi' non sembra arrivata da un'altra
         pagina: casella che si allarga, tasto che sta della sua misura. */
      .rinomina {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }

      /* La riga piccola sotto a qualcos'altro: una spiegazione, un esito.
         Sta qui perche' le quattro che la usano nascevano senza regola — la
         classe veniva dalla console del ponte, che ha un foglio di stile suo e
         qui non arriva. Si vedevano grandi come il resto del testo. */
      .minuta {
        font-size: 0.85rem;
        color: var(--lieve);
        margin: 0;
      }

      .avvertenza {
        display: flex;
        gap: 11px;
        margin-top: 16px;
        padding: 14px 16px;
        background: var(--alone-ambra);
        border-radius: var(--raggio-piccolo);
        font-size: 0.85rem;
        line-height: 1.55;
        color: var(--notte);
      }

      .avvertenza .gettone {
        width: 25px;
        height: 25px;
        flex: none;
        border-radius: 9px;
        background: color-mix(in srgb, var(--ambra) 22%, transparent);
        color: var(--ambra);
        display: grid;
        place-items: center;
        font-size: 0.72rem;
        font-weight: 700;
      }

      footer {
        max-width: 80rem;
        margin-inline: auto;
        padding: 6px 22px 40px;
        color: var(--fioco);
        font-size: 0.79rem;
      }

      /* ─── Stretto ───────────────────────────────────────────────────── */
      @media (max-width: 64rem) {
        .banco,
        .abbina {
          grid-template-columns: minmax(0, 1fr);
        }

        .indietro {
          display: block;
        }

        .banco.aperta > .fila,
        .banco.aperta > .striscia {
          display: none;
        }

        .banco:not(.aperta) > .scheda {
          display: none;
        }
      }

      @media (max-width: 34rem) {
        .testata,
        main,
        footer {
          padding-inline: 16px;
        }

        nav {
          margin-left: 0;
          width: 100%;
          justify-content: center;
        }

        .riquadro {
          padding: 17px 16px;
        }

        .titolone {
          font-size: 1.4rem;
        }

        h2 {
          font-size: 1.25rem;
        }

        ul.spunte li {
          flex-wrap: wrap;
        }

        ul.spunte .dettaglio {
          width: 100%;
          padding-left: 32px;
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="testata">
        <!-- Qui c'era il bollo del marchio, e non c'e' piu'.
             Questa pagina si apre **dentro Home Assistant**, in un riquadro che
             ci mette sopra il suo tasto del menu: e quel tasto galleggia, non
             sa cosa ha sotto e non gli fa spazio. Il bollo gli finiva sotto, e
             un marchio coperto a meta' e' peggio di nessun marchio. Il titolo
             dice gia' dove sei, e il bollo resta dove serve — accanto agli
             aggiornamenti di gdahome, dove distingue la roba nostra. -->
        <div class="marchio">
          <!-- Il marchio dell'installatore, se ne ha messo uno. Sta qui vuoto
               e lo riempie `disegna()`: l'indirizzo dipende da chi ha aperto la
               pagina, e questo file e' lo stesso per tutti. -->
          <img class="suoMarchio" id="suo-marchio" alt="" hidden />
          <span class="nomi">
            <b id="come-si-chiama">Cruscotto installatore</b>
            <span id="chi"></span>
          </span>
        </div>
        <nav id="nav"></nav>
      </div>
    </header>

    <main id="dove"></main>

    <footer>
      Da qui non si entra in nessuna casa e non si vede niente di chi ci abita: si guardano i numeri
      che ogni impianto manda da sé.
    </footer>

    <script>
      /* ───────────────────────────────────────────────────────────────────
       * DA DOVE ARRIVA QUELLO CHE SI VEDE.
       *
       * Da `/console/case` e `/console/inviti`, e **gia' deciso**: lo stato di
       * una casa, le sue spunte e le sue pastiglie li calcola il server
       * (`src/collaudo.js`). Qui dentro non c'e' nessuna regola, ed e' voluto:
       * se le regole stessero in tutt'e due i posti, il giorno che una cambia
       * ne cambierebbe una sola, e due schermi direbbero due cose diverse
       * della stessa casa.
       *
       * Questa pagina disegna. Non decide.
       *
       * ─── La chiave ─────────────────────────────────────────────────────
       *
       * Resta nel browser e non nella pagina: chi guarda questo quadro lo apre
       * tutti i giorni, e ribattere una chiave lunga tutti i giorni finisce con
       * una chiave corta. Un tasto la butta via.
       * ─────────────────────────────────────────────────────────────────── */
      /* Se questa pagina sta dentro un riquadro di Home Assistant.
       *
       * Si guarda e basta: `window.top` di un'altra origine non si puo'
       * leggere, e il confronto solleva — in quel caso la risposta e' comunque
       * «si'», perche' un'origine diversa vuol dire proprio che qualcun altro
       * ci ha messo dentro. Serve a una cosa sola: lasciare in cima lo spazio
       * per il tasto del menu, che sta in quell'altro documento. */
      try {
        if (window.self !== window.top) document.documentElement.dataset.dentro = "sì";
      } catch (_altroDominio) {
        document.documentElement.dataset.dentro = "sì";
      }

      const DOVE_STA_LA_CHIAVE = "gdahome.quadro.chiave";

      let chiave = "";
      try {
        chiave = localStorage.getItem(DOVE_STA_LA_CHIAVE) || "";
      } catch (_niente) {
        /* Finestra anonima, deposito bloccato: si chiede a ogni apertura. */
      }

      let CASE = [];
      let INVITI = [];
      /* Chi sono, quante ne ho e qual è il mio tetto. Il tetto si mostra
       * **prima** di sbatterci: un codice rifiutato al quarantunesimo impianto,
       * con il cliente che aspetta, è il momento peggiore per scoprire che
       * esiste un limite. */
      let IO = { chi: "", nome: "", marchio: "", soglia: 0, case: 0 };
      /* Le soglie con cui si colorano i metri arrivano dal server insieme alle
       * case: sono le stesse con cui lui decide, e scritte una volta sola. */
      let SOGLIE = { troppoCaldo: 75, discoPieno: 85, discoFinito: 80 };
      const BATTERIA_SCARICA = 20;
      const SEGNALE_DEBOLE = 45;
      const DISCO_STANCO = 50;

      const ADESSO = () => Date.now();

      async function chiedi(via, opzioni = {}) {
        /* In relativo, senza la barra davanti: da `/console/` porta dove deve,
         * e funziona anche se un domani la console sta sotto un prefisso. */
        const risposta = await fetch(via.replace(/^\//, ""), {
          ...opzioni,
          headers: {
            authorization: `Bearer ${chiave}`,
            "content-type": "application/json",
            ...(opzioni.headers || {}),
          },
        });
        if (risposta.status === 401) throw new ChiaveNoNo();
        const corpo = await risposta.json().catch(() => ({}));
        if (!risposta.ok) throw new Error(corpo.errore || "non ha funzionato");
        return corpo;
      }

      class ChiaveNoNo extends Error {}

      async function carica() {
        const [case_, inviti, io] = await Promise.all([
          chiedi("/case"),
          chiedi("/inviti"),
          chiedi("/io"),
        ]);
        CASE = case_.case || [];
        INVITI = inviti.inviti || [];
        IO = io || IO;
        if (case_.soglie) SOGLIE = case_.soglie;
      }

      /* Quante ne restano prima del tetto, o `null` se tetto non ce n'è.
       *
       * **Gli inviti aperti contano**, come li conta il server: se qui si
       * contassero solo le case, la testata direbbe «due ancora» con un codice
       * già in attesa, e il secondo verrebbe rifiutato. Un numero che promette
       * più di quello che il server concede è peggio di nessun numero. */
      const quanteRestano = () =>
        IO.soglia > 0 ? Math.max(0, IO.soglia - ((IO.case || CASE.length) + INVITI.length)) : null;

      /* Le case appena arrivate sono quelle che non hanno ancora un nome: non
       * sono un elenco a parte, sono una domanda sullo stesso elenco. */
      const appenaArrivate = () => CASE.filter((una) => una.senzaNome);

      /* Il codice a gruppi di quattro: il server lo scrive gia' cosi', e questa
       * riga c'e' perche' una vecchia versione non lo faceva. */
      const laRiga = (codice) => String(codice);

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      /* L'indirizzo del proprio marchio.
       *
       * Assoluto e **senza chiave**: `/marchio/<chi>` non ne vuole, e una
       * chiave dentro un `src` finirebbe nella cronologia del browser e nel
       * registro di qualunque cosa stia in mezzo.
       *
       * In fondo c'e' la razza del file, che non serve a caricarlo: serve a
       * cambiare l'indirizzo quando il marchio cambia, se no il browser
       * continua a far vedere quello di prima per un'ora — che e' la cache che
       * gli abbiamo chiesto noi. */
      const ilSuoMarchio = () =>
        IO.marchio
          ? `/marchio/${encodeURIComponent(IO.chi)}?${encodeURIComponent(IO.marchio)}`
          : "";

      function daQuanto(quando) {
        const minuti = Math.round((ADESSO() - new Date(quando).getTime()) / 60000);
        if (!Number.isFinite(minuti)) return "chissà quando";
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const ilGiorno = (quando) =>
        /* In italiano, non nella lingua del browser: questa pagina e' in
         * italiano tutta, e una data in inglese in mezzo si nota. */
        new Date(quando).toLocaleDateString("it-IT", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

      const livello = (valore, attenta, male) =>
        valore >= male ? "male" : valore >= attenta ? "attenta" : "bene";

      /* Il lavoro in ballo e la manutenzione, adesso che il ponte li manda
       * davvero. Restano scritte a prova di assenza: una casa ferma a un ponte
       * di ieri queste due righe non le ha, e deve rispondere di no invece di
       * rompersi. */
      const staLavorando = (c) => Boolean(c && c.lavoro && c.lavoro.stato === "in corso");

      /* Se questa riga e' quella che sta succedendo — o quella che si e'
       * appena chiesta. Si confronta per **nome e salto di versione**, che e'
       * l'unico modo che c'e': l'entita' nel rapporto non viaggia, e non
       * viaggia apposta. */
      const eLaStessa = (uno, l) =>
        Boolean(l) && l.nome === uno.nome && l.da === uno.da && l.a === uno.a;

      /* Quante entita' non rispondono.
       *
       * Due nomi per lo stesso numero: `giu` e' quello di adesso, `sparite`
       * quello dei ponti fino alla 1.5.6. Le due righe stanno qui per il tempo
       * che ci mette l'ultima casa ad aggiornarsi: una casa ferma a ieri non
       * deve far sparire il riquadro, deve solo mostrare quello che sa. */
      const quantiGiu = (c) => c?.entita?.giu ?? c?.entita?.sparite ?? 0;

      /* Le pastiglie dei dispositivi che non rispondono.
       *
       * Col ponte di adesso sono nomi. Da una casa vecchia arrivano le quattro
       * cifre di allora, e si disegnano com'erano — col cancelletto davanti,
       * che e' il segno che quello non e' un nome.
       *
       * `dispositivi` e' quanti sono **davvero**, `nomi` quanti se ne mandano:
       * quando il secondo e' piu' corto del primo la differenza si scrive, se
       * no dodici nomi sembrerebbero tutti quelli che ci sono. */
      function iNomiGiu(c) {
        const nomi = c?.entita?.nomi;
        if (Array.isArray(nomi) && nomi.length) {
          const quanti = c?.entita?.dispositivi ?? nomi.length;
          const altri = Math.max(0, quanti - nomi.length);
          return (
            nomi.map((uno) => `<span>${testo(uno)}</span>`).join("") +
            (altri ? `<span class="eAltri">e altri ${altri}</span>` : "")
          );
        }
        return (c?.entita?.impronte || []).map((una) => `<span>#${testo(una)}</span>`).join("");
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      /* Dove stanno i marchi delle integrazioni. Lo stesso posto da cui li
       * prende Home Assistant, ed e' il quadro a saperlo: da casa arriva una
       * **parola** — `shelly`, `zha` — non un indirizzo. Se arrivasse un
       * indirizzo, chi puo' scrivere l'attributo di un'entita' deciderebbe
       * dove va a bussare questa pagina. */
      const I_MARCHI = "https://brands.home-assistant.io/";

      /* Il segno di un aggiornamento: il logo di chi lo porta, o l'iniziale.
       *
       * Tre casi, in ordine. La roba nostra porta il bollo del quadro, che e'
       * disegnato qui e non si scarica da nessuna parte. Chi ha un marchio lo
       * fa vedere — e sotto c'e' comunque l'iniziale, cosi' una casa senza
       * internet o un marchio che non esiste finiscono sulla lettera invece
       * che su un quadratino rotto. Chi non ce l'ha resta sull'iniziale, che
       * e' quello che fa gia' l'app.
       *
       * `onerror` toglie l'immagine e scopre la lettera che sta sotto. */
      function ilSegnoDi(uno) {
        if (uno.nostra)
          return '<span class="bollo" aria-hidden="true"><i></i><i class="mezzo"></i><i></i></span>';
        const primo = testo(
          String(uno.nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase() || "?",
        );
        /* La stessa forma che il ponte si e' gia' controllato, ricontrollata
         * qui: questa parola finisce dentro un indirizzo, e chi lo compone e'
         * questa riga. Un controllo solo, dall'altra parte di una rete, non e'
         * un controllo. */
        if (!/^[a-z0-9_]+$/.test(String(uno.marchio || "")))
          return `<span class="segno">${primo}</span>`;
        return `<span class="segno">${primo}<img
          src="${I_MARCHI}${uno.marchio}/icon.png"
          alt=""
          loading="lazy"
          onerror="this.remove()"
        /></span>`;
      }

      /* Cosa cambia, con le parole di chi l'ha scritto.
       *
       * E' il `release_summary` dell'entita', che Home Assistant taglia gia'
       * corto. Va disegnato **come testo**: arriva da fuori, e qui dentro non
       * ci si fida di niente che arrivi da fuori. Le note lunghe stanno a un
       * indirizzo, e per leggerle serve il filo con la casa — che il quadro
       * non ha — quindi li' si manda il browser.
       *
       * Niente di tutto questo e' obbligatorio: chi non dice niente non
       * occupa una riga vuota. */
      function cosaCambia(uno) {
        const detto = testo(String(uno.cosaCambia || "").trim());
        const dove = String(uno.note || "");
        const fuori = /^https:\/\/[^\s"'<>]+$/i.test(dove)
          ? ` <a href="${testo(dove)}" target="_blank" rel="noopener noreferrer">le note per intero ↗</a>`
          : "";
        if (!detto && !fuori) return "";
        return `<p class="cambia">${detto}${fuori}</p>`;
      }

      /* Una riga di aggiornamento: il segno, cosa e', cosa si fa, cosa cambia.
       *
       * Una sola, e la usano tutt'e due le schermate — la scheda di una casa e
       * la flotta. Prima erano due disegni diversi per la stessa cosa: righe
       * di qua, pastigline di la', e nella flotta non si vedeva ne' il logo ne'
       * cosa cambiava. Due disegni per una cosa sola vuol dire che uno dei due
       * resta indietro, ed era sempre lo stesso.
       *
       * `fare` e' quello che si puo' fare su questa riga: lo passa chi disegna,
       * perche' dipende dalla casa — la manutenzione aperta, un lavoro in
       * ballo — e non dall'aggiornamento. */
      function unaRiga(uno, { fare = "" } = {}) {
        return `
          <li>
            ${ilSegnoDi(uno)}
            <span class="che">
              <b>${testo(uno.nome)}</b>
              <span class="salto">${testo(uno.da)} → ${testo(uno.a)}</span>
            </span>
            <span class="fare">${fare}</span>
            ${cosaCambia(uno)}
          </li>`;
      }

      const spia = (stato) =>
        `<span class="pastiglia ${stato.chiave}"><span aria-hidden="true">${stato.segno}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` muta, spazio «non c'era
       * ancora». */
      function laStriscia(giorni, grande = false) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="muta tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="muta per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non era ancora accesa"></i>';
            return '<i title="tutte i rapporti arrivati"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} da quando è accesa`
            : vuoti === 0
              ? "14 giorni, sempre viva"
              : `14 giorni · muta ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="giorni${grande ? " grande" : ""}" role="img" aria-label="${testo(dice)}">${celle}</div><div class="giorniDice">${testo(dice)}</div>`;
      }

      const LE_FILE = [
        ["muta", "■", "mute"],
        ["guardare", "▲", "da guardare"],
        ["aperto", "◇", "collaudo aperto"],
        ["posto", "●", "a posto"],
      ];

      let schermata = "case";
      let filtro = "tutte";
      let aperta = 0;
      let suTelefonoApro = false;

      const dove = document.getElementById("dove");
      const doveNav = document.getElementById("nav");

      function disegna() {
        const dietro = CASE.filter((una) => (una.carta?.aggiornamenti?.elenco || []).length).length;
        doveNav.innerHTML = [
          ["case", "Le case", 0],
          ["aggiornamenti", "Aggiornamenti", dietro],
          /* La pastiglia conta **solo i codici in attesa**, e non piu' anche le
             case senza nome.
             Sommandole, una casa appena abbinata lasciava «Abbina 1» acceso, e
             quel numero si legge in un modo solo: c'e' un abbinamento che non
             e' andato. Invece e' andato — manca un nome, che e' un'altra cosa
             e si vede da se', perche' quella casa nell'elenco si chiama
             `casa_99592daf…`. */
          ["abbina", "Abbina", INVITI.length],
        ]
          .map(
            ([quale, parola, quanti]) => `
            <button type="button" data-schermata="${quale}" aria-pressed="${schermata === quale}">
              ${testo(parola)}${quanti ? `<span class="quanti">${quanti}</span>` : ""}
            </button>`,
          )
          .join("");

        /* Il marchio in testata: se c'e' prende il posto del nostro, e il
         * titolo diventa il nome dell'installatore. Se non c'e', la pagina
         * resta quella di prima — non si fa un buco in cima per una cosa
         * facoltativa. */
        const suo = document.getElementById("suo-marchio");
        suo.hidden = !IO.marchio;
        if (IO.marchio && suo.getAttribute("src") !== ilSuoMarchio()) {
          suo.src = ilSuoMarchio();
        }
        document.getElementById("come-si-chiama").textContent = IO.nome || "Cruscotto installatore";

        const restano = quanteRestano();
        document.getElementById("chi").textContent =
          (IO.nome ? "Cruscotto installatore · " : "") +
          plurale(CASE.length, "impianto", "impianti") +
          (restano === null ? "" : ` · ${restano} ancora`);
        dove.innerHTML =
          schermata === "case"
            ? leCase()
            : schermata === "aggiornamenti"
              ? laFlotta()
              : lAbbinamento();

        const esito = (parole, bene = true) => {
          const riga = document.getElementById("esito-avvisi");
          if (!riga) return;
          riga.hidden = false;
          riga.textContent = parole;
          riga.style.color = bene ? "var(--bene)" : "var(--male)";
        };

        const tastoAvvisi = dove.querySelector("[data-avvisi]");
        if (tastoAvvisi) {
          tastoAvvisi.onclick = () =>
            faiEpoi(tastoAvvisi, async () => {
              const detto = document.getElementById("dove-avvisi")?.value || "";
              try {
                await chiedi("/io/avvisi", {
                  method: "PUT",
                  body: JSON.stringify({ dove: detto }),
                });
                IO.avvisi = detto.trim();
                esito(IO.avvisi ? "Salvato." : "Avvisi spenti.");
              } catch (male) {
                esito(male.message, false);
              }
            });
        }

        /* Il marchio: si sceglie un file e parte, senza un tasto «Salva».
         * Scegliere un file **e'** gia' la conferma: un secondo tasto sarebbe
         * un passaggio in piu' per una cosa che si annulla ricaricando. */
        const scegli = dove.querySelector("#scegli-marchio");
        if (scegli)
          scegli.onchange = async () => {
            const file = scegli.files?.[0];
            if (!file) return;
            const riga = dove.querySelector("#esito-marchio");
            const dillo = (che) => {
              if (!riga) return;
              riga.textContent = che;
              riga.hidden = false;
            };
            scegli.disabled = true;
            try {
              const detto = await chiedi("/io/marchio", {
                method: "PUT",
                /* I byte com'e', non un JSON con dentro un base64: il server
                 * guarda **come comincia il file** per sapere che roba e', e
                 * un base64 comincia sempre uguale. */
                body: await file.arrayBuffer(),
                headers: { "content-type": file.type || "application/octet-stream" },
              });
              IO.marchio = detto.marchio || "";
              dillo("Messo.");
              disegna();
            } catch (errore) {
              if (errore instanceof ChiaveNoNo) {
                chiedimiLaChiave();
                return;
              }
              dillo(errore.message || "non ha funzionato");
            } finally {
              scegli.disabled = false;
            }
          };
        const togliIlMarchio = dove.querySelector("[data-togli-marchio]");
        if (togliIlMarchio)
          togliIlMarchio.onclick = () =>
            faiEpoi(togliIlMarchio, async () => {
              await chiedi("/io/marchio", { method: "DELETE" });
              IO.marchio = "";
            });

        const tastoProva = dove.querySelector("[data-prova-avvisi]");
        if (tastoProva) {
          tastoProva.onclick = () =>
            faiEpoi(tastoProva, async () => {
              try {
                const detto = await chiedi("/io/avvisi/prova", { method: "POST" });
                /* «Arrivato» vuol dire che chi riceve l'ha accettato, non che
                 * l'hai letto: se il tasto dice di sì e il messaggio non c'è, il
                 * problema sta dall'altra parte. */
                esito(
                  detto.arrivato
                    ? "Mandato. Se non lo vedi, il problema è dopo l'indirizzo."
                    : "Quell'indirizzo non l'ha accettato.",
                  detto.arrivato,
                );
              } catch (male) {
                esito(male.message, false);
              }
            });
        }

        dove.querySelectorAll("[data-filtro]").forEach((tasto) => {
          tasto.onclick = () => {
            filtro = filtro === tasto.dataset.filtro ? "tutte" : tasto.dataset.filtro;
            disegna();
          };
        });
        dove.querySelectorAll("[data-casa]").forEach((tasto) => {
          tasto.onclick = () => {
            aperta = Number(tasto.dataset.casa);
            suTelefonoApro = true;
            disegna();
            window.scrollTo({ top: 0 });
          };
        });
        const torna = dove.querySelector("[data-indietro]");
        if (torna)
          torna.onclick = () => {
            suTelefonoApro = false;
            disegna();
          };

        /* I tasti che cambiano qualcosa. Ognuno fa la sua chiamata, ricarica e
         * ridisegna: non si tocca niente a schermo prima che il server abbia
         * detto di sì, se no si vedrebbe una cosa che non è successa. */
        dove.querySelectorAll("[data-fai]").forEach((tasto) => {
          tasto.onclick = () =>
            faiEpoi(tasto, () =>
              chiedi("/inviti", {
                method: "POST",
                body: JSON.stringify({ per: dove.querySelector("#per-chi")?.value || "" }),
              }),
            );
        });
        dove.querySelectorAll("[data-annulla]").forEach((tasto) => {
          tasto.onclick = () =>
            faiEpoi(tasto, () =>
              chiedi(`/inviti/${encodeURIComponent(tasto.dataset.annulla)}`, { method: "DELETE" }),
            );
        });
        dove.querySelectorAll("[data-tieni]").forEach((tasto) => {
          tasto.onclick = () => {
            const casella = dove.querySelector(`[data-nome="${tasto.dataset.tieni}"]`);
            const nome = (casella?.value || "").trim();
            if (!nome) {
              casella?.focus();
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.tieni}`, {
                method: "PUT",
                body: JSON.stringify({ nome }),
              }),
            );
          };
        });
        dove.querySelectorAll("[data-apri-rinomina]").forEach((tasto) => {
          tasto.onclick = () => {
            const quale = tasto.dataset.apriRinomina;
            const riga = dove.querySelector(`[data-rinomina-per="${quale}"]`);
            if (!riga) return;
            riga.hidden = !riga.hidden;
            if (!riga.hidden) {
              const casella = riga.querySelector("[data-rinomina-nome]");
              casella?.focus();
              casella?.select();
            }
          };
        });
        dove.querySelectorAll("[data-rinomina]").forEach((tasto) => {
          const quale = tasto.dataset.rinomina;
          const casella = dove.querySelector(`[data-rinomina-nome="${quale}"]`);
          const salva = () => {
            const nome = (casella?.value || "").trim();
            /* Vuoto non si manda: svuotare il nome vorrebbe dire rimettere la
             * casa fra quelle senza nome, e non e' quello che si chiede
             * premendo «Rinomina». Chi vuole toglierlo ha «Non seguirla piu'». */
            if (!nome) {
              casella?.focus();
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${quale}`, { method: "PUT", body: JSON.stringify({ nome }) }),
            );
          };
          tasto.onclick = salva;
          if (casella)
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") salva();
            };
        });
        dove.querySelectorAll("[data-installa]").forEach((tasto) => {
          tasto.onclick = () => {
            /* In due tempi, sullo stesso tasto, come «non seguirla più».
             *
             * Qui non si sta premendo un tasto sul proprio computer: si sta
             * facendo partire un aggiornamento a casa di qualcun altro, che
             * magari in quel momento sta guardando la televisione con le
             * tapparelle collegate a quell'impianto. Un tocco andato storto
             * scorrendo l'elenco non deve bastare. */
            if (tasto.dataset.sicuro !== "sì") {
              tasto.dataset.sicuro = "sì";
              tasto.textContent = "Sicuro? Premi di nuovo";
              setTimeout(() => {
                tasto.dataset.sicuro = "";
                tasto.textContent = "Installa";
              }, 6000);
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.installa}/installa`, {
                method: "POST",
                body: JSON.stringify({
                  nome: tasto.dataset.qualeNome,
                  da: tasto.dataset.qualeDa,
                  a: tasto.dataset.qualeA,
                }),
              }),
            );
          };
        });
        dove.querySelectorAll("[data-lascia-stare]").forEach((tasto) => {
          /* Annullare non chiede conferma: si annulla una cosa che non è
           * ancora successa, e il danno di un tocco storto è ripremere
           * «Installa». */
          tasto.onclick = () =>
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.lasciaStare}/installa`, { method: "DELETE" }),
            );
        });
        dove.querySelectorAll("[data-molla]").forEach((tasto) => {
          tasto.onclick = () => {
            /* In due tempi, sullo stesso tasto: il primo chiede conferma e il
             * secondo fa. Non si butta la storia di un impianto per un tocco
             * andato storto. */
            if (tasto.dataset.sicuro !== "sì") {
              tasto.dataset.sicuro = "sì";
              tasto.textContent = "Sicuro? Premi di nuovo";
              setTimeout(() => {
                tasto.dataset.sicuro = "";
                tasto.textContent = "Non seguirla più";
              }, 6000);
              return;
            }
            faiEpoi(tasto, () =>
              chiedi(`/casa/${tasto.dataset.molla}`, { method: "DELETE" }).then(() => {
                aperta = 0;
                suTelefonoApro = false;
              }),
            );
          };
        });
        dove.querySelectorAll("[data-copia]").forEach((tasto) => {
          tasto.onclick = () => {
            navigator.clipboard?.writeText(tasto.dataset.copia);
            const prima = tasto.textContent;
            tasto.textContent = "Copiato";
            setTimeout(() => {
              tasto.textContent = prima;
            }, 2000);
          };
        });

        avviaGliOrologi();
      }

      /* Fa una cosa, poi ricarica e ridisegna. Il tasto resta spento mentre
       * succede: due tocchi su «fai un codice» sono due codici. */
      async function faiEpoi(tasto, cosa) {
        tasto.disabled = true;
        try {
          await cosa();
          await carica();
          disegna();
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) {
            chiedimiLaChiave();
            return;
          }
          window.alert(errore.message || "non ha funzionato");
        } finally {
          tasto.disabled = false;
        }
      }

      doveNav.onclick = (evento) => {
        const tasto = evento.target.closest("[data-schermata]");
        if (!tasto) return;
        schermata = tasto.dataset.schermata;
        suTelefonoApro = false;
        disegna();
        window.scrollTo({ top: 0 });
      };

      /* ─── Schermata: le case ─────────────────────────────────────────── */
      function leCase() {
        const conStato = CASE.map((una, indice) => ({ una, indice, stato: una.stato }));
        const quante = (chiave) => conStato.filter((r) => r.stato.chiave === chiave).length;
        const viste = conStato.filter((r) => filtro === "tutte" || r.stato.chiave === filtro);

        return `
          <div class="banco${suTelefonoApro ? " aperta" : ""}">
            <div class="striscia">
              ${LE_FILE.map(
                ([chiave, segno, parola]) => `
                <button
                  type="button"
                  class="tessera"
                  data-filtro="${chiave}"
                  aria-pressed="${filtro === chiave}"
                >
                  <span class="gettone ${chiave}" aria-hidden="true">${segno}</span>
                  <span class="numeri">
                    <b>${quante(chiave)}</b>
                    <span>${testo(parola)}</span>
                  </span>
                </button>`,
              ).join("")}
            </div>

            <div class="fila">
              ${
                viste.length
                  ? viste.map(({ una, indice, stato }) => unaCasa(una, indice, stato)).join("")
                  : '<p class="nota">Nessuna casa in questa fila. Premi di nuovo la tessera per vederle tutte.</p>'
              }
            </div>

            <div class="scheda">
              ${CASE.length ? ilDettaglio(CASE[Math.min(aperta, CASE.length - 1)]) : ""}
            </div>
          </div>
        `;
      }

      function unaCasa(casa, indice, stato) {
        const c = casa.carta;
        return `
          <button
            type="button"
            class="casa ${stato.chiave}"
            data-casa="${indice}"
            aria-current="${indice === aperta}"
          >
            <div class="capo">
              <span class="nome">${testo(casa.nome)}</span>
              <span class="quando">${testo(daQuanto(c.quando))}</span>
            </div>
            <div class="fianco">
              ${spia(stato)}
              <span class="mono">${testo(c.casa.slice(5, 13))}</span>
            </div>
            <div class="pastiglie">
              ${(() => {
                const tutte = casa.pastiglie || [];
                const viste = tutte.slice(0, 3);
                const restano = tutte.length - viste.length;
                return (
                  viste
                    .map(
                      ({ parola, come }) =>
                        `<span class="pastiglia ${come}">${testo(parola)}</span>`,
                    )
                    .join("") + (restano ? `<span class="pastiglia">+${restano}</span>` : "")
                );
              })()}
            </div>
            ${laStriscia(casa.giorni)}
          </button>
        `;
      }

      function ilDettaglio(casa) {
        const stato = casa.stato;
        const c = casa.carta;
        const collaudo = casa.collaudo || { spunte: [], fatte: 0, aperte: 0, ignote: 0, quante: 0 };

        const verdetto =
          collaudo.fatte === collaudo.quante
            ? "Tutte spuntate: questo impianto è a posto."
            : !casa.collaudataIl
              ? "Non è ancora stata consegnata: finché resta una spunta aperta, resta in fila."
              : `Il collaudo si era chiuso il ${ilGiorno(casa.collaudataIl)}. Queste righe si sono riaperte dopo, ed è il motivo per cui questa casa è qui.`;

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti?.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti?.ha],
          ["Supervisor", c.supervisor, false],
          ["il sistema", c.sistema, false],
        ];

        const misure = [
          quantiGiu(c) > 0
            ? [
                "Dispositivi non collegati",
                c.entita?.dispositivi ?? quantiGiu(c),
                `${quantiGiu(c)} entità su ${c.entita?.totali ?? "—"}`,
                "male",
              ]
            : ["Entità", c.entita?.totali ?? "—", "rispondono tutte", ""],
          [
            "Batteria più bassa",
            c.batterie?.piuBassa === null || c.batterie?.piuBassa === undefined
              ? "—"
              : `${c.batterie.piuBassa}%`,
            !c.batterie
              ? "questa casa non lo dice"
              : c.batterie.scariche > 0
                ? `${c.batterie.scariche} sotto il ${BATTERIA_SCARICA}%`
                : "nessuna da cambiare",
            (c.batterie?.scariche ?? 0) > 0 ? "attenta" : "",
          ],
          [
            "Ultimo backup",
            !c.backup || c.backup.giorniFa === null || c.backup.giorniFa === undefined
              ? "mai"
              : c.backup.giorniFa,
            !c.backup
              ? "questa casa non lo dice"
