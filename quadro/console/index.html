<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Il quadro degli impianti</title>
    <!--
      IL QUADRO — BOZZA, CON DENTRO CASE FINTE.

      Questa pagina non parla con niente: le case che si vedono stanno scritte
      qui sotto, in `CASE`. Serve a guardare il cruscotto prima di costruirlo, e
      a discutere su una cosa invece che su una descrizione. Quando il quadro
      sarà vero, `CASE` arriva da `GET /case` e il resto della pagina resta
      com'è — per questo i dati stanno in cima e separati da tutto.

      Niente font, niente librerie, nessuna richiesta a nessuno: la regola delle
      altre console del progetto vale anche qui. Gli accenti però sono quelli
      veri, come nella console del ponte — quella del centralino la legge chi
      mantiene l'app, questa la legge un installatore tutti i giorni, ed è una
      pagina di prodotto.

      COM'È FATTA, E PERCHÉ COSÌ.

      Un quadro elettrico è una barra con sopra gli interruttori, ognuno con la
      sua targhetta. Le case stanno in colonna nello stesso modo: una barra
      sola, righe divise da un filo, e sul bordo sinistro la striscia che dice
      come sta quella casa. Prima erano otto riquadri bianchi staccati, e otto
      riquadri uguali non sono una gerarchia: sono un elenco piatto in cui
      niente chiama.

      A destra — quando lo schermo ce l'ha — la casa aperta sta di fianco
      all'elenco e non al suo posto: chi guarda quaranta impianti passa da uno
      all'altro, e non deve tornare indietro ogni volta.

      Quello che si vede è tutto quello che il quadro sa di una casa, ed è
      quello che c'è scritto nella cartolina: numeri e versioni. Niente nomi di
      entità, niente stanze, niente persone, nessuno stato di nessun sensore.
      Il nome della casa — «Rossi — via Verdi 12» — dalla casa non arriva: lo
      scrive l'installatore qui, e resta qui.

      UNA COSA MISURATA, CHE HA DECISO IL DISEGNO.

      I tre colori di stato del progetto — `--spia`, `--ottone`, `--allarme` —
      fra ambra e rosso sono a 1.7 di distanza per chi non distingue il rosso
      dal verde (9.1 per chi li distingue tutti: sotto la soglia comunque). Su
      una pagina il cui mestiere è far vedere a colpo d'occhio quali case stanno
      bene, un pallino colorato **da solo** non può portare il significato.
      Perciò ogni stato ha tre cose insieme: una **forma** (● ▲ ■ ◇), una
      **parola** e un colore. Chi non vede i colori legge la pagina lo stesso, e
      chi li vede la legge più in fretta.

      L'azzurro è l'unica cosa che si preme, ed è tenuto fuori dai tre colori di
      stato apposta: un colore che vuol dire «guasto» e «premi qui» insieme non
      vuol dire più niente.
    -->
    <style>
      /* ─── I colori ──────────────────────────────────────────────────────
       *
       * Il grigio non è grigio: tira al verde, come quello delle altre console
       * del progetto e come la lamiera verniciata di un quadro. Il chiaro sta
       * qui tutto intero; sotto si ridefiniscono solo le tessere che cambiano,
       * due volte — per chi ha il sistema scuro e per chi lo sceglie. */
      :root {
        --fondo: #e9edec;
        --barra: #f4f6f5;
        --scheda: #ffffff;
        --velo: #f1f4f3;
        --inchiostro: #101c22;
        --smorzato: #53656c;
        --tenue: #7d8e93;
        --linea: #d2dad8;
        --filo: #e2e8e6;

        --spia: #1f6b4a;
        --ottone: #8a5710;
        --allarme: #a5392c;
        --spia-velo: #e3efe9;
        --ottone-velo: #f7eedf;
        --allarme-velo: #f9e7e4;

        --pieno: #a9c5b7;
        --azzurro: #0a6d92;
        --azzurro-velo: #e2eff4;

        --ombra: 0 1px 2px rgba(16, 28, 34, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --fondo: #0a1317;
          --barra: #101b21;
          --scheda: #142027;
          --velo: #1a272e;
          --inchiostro: #dfe8e6;
          --smorzato: #9cadb2;
          --tenue: #7b8e93;
          --linea: #22343c;
          --filo: #1c2c33;

          --spia: #5fc493;
          --ottone: #dca45c;
          --allarme: #e98b7d;
          --spia-velo: #16332a;
          --ottone-velo: #33281a;
          --allarme-velo: #39221f;

          --pieno: #315549;
          --azzurro: #4cb8dd;
          --azzurro-velo: #14303b;

          --ombra: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }

      :root[data-theme="dark"] {
        --fondo: #0a1317;
        --barra: #101b21;
        --scheda: #142027;
        --velo: #1a272e;
        --inchiostro: #dfe8e6;
        --smorzato: #9cadb2;
        --tenue: #7b8e93;
        --linea: #22343c;
        --filo: #1c2c33;

        --spia: #5fc493;
        --ottone: #dca45c;
        --allarme: #e98b7d;
        --spia-velo: #16332a;
        --ottone-velo: #33281a;
        --allarme-velo: #39221f;

        --pieno: #315549;
        --azzurro: #4cb8dd;
        --azzurro-velo: #14303b;

        --ombra: 0 1px 2px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--fondo);
        color: var(--inchiostro);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--azzurro);
        outline-offset: 2px;
        border-radius: 3px;
      }

      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      /* Letto dai lettori di schermo, non dagli occhi. */
      .via {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ─── La testata ──────────────────────────────────────────────────── */
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--barra);
        border-bottom: 1px solid var(--linea);
        box-shadow: var(--ombra);
      }

      .testata {
        max-width: 78rem;
        margin-inline: auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .marchio {
        display: flex;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
      }

      .marchio b {
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .marchio span {
        color: var(--tenue);
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Le quattro cifre del riepilogo. Sono il punto della pagina, e stanno in
       * testata perché ci restino anche mentre si scorre l'elenco. */
      .riepilogo {
        display: flex;
        gap: 6px;
        margin-left: auto;
        flex-wrap: wrap;
      }

      .riepilogo .conto {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px 6px 9px;
        border: 1px solid var(--linea);
        border-radius: 5px;
        background: var(--scheda);
        line-height: 1.15;
      }

      .riepilogo .conto b {
        font-size: 1.15rem;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      .riepilogo .conto span {
        color: var(--smorzato);
        font-size: 0.72rem;
      }

      .riepilogo .conto .segno {
        font-size: 0.7rem;
        line-height: 1;
      }

      .riepilogo .conto.vuoto {
        opacity: 0.55;
      }

      /* ─── Il banco: l'elenco, e la casa aperta di fianco ─────────────── */
      .banco {
        max-width: 78rem;
        margin-inline: auto;
        padding: 18px 20px 40px;
        display: grid;
        grid-template-columns: minmax(0, 23rem) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      /* ─── La barra delle case ───────────────────────────────────────── */
      .filtri {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 10px;
      }

      .filtri button {
        font: inherit;
        font-size: 0.78rem;
        color: var(--smorzato);
        background: transparent;
        border: 1px solid var(--linea);
        border-radius: 999px;
        padding: 4px 11px;
        cursor: pointer;
      }

      .filtri button:hover {
        color: var(--inchiostro);
        border-color: var(--tenue);
      }

      .filtri button[aria-pressed="true"] {
        color: var(--azzurro);
        background: var(--azzurro-velo);
        border-color: var(--azzurro);
      }

      ul.barra {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--scheda);
        border: 1px solid var(--linea);
        border-radius: 7px;
        overflow: hidden;
        box-shadow: var(--ombra);
      }

      ul.barra li + li {
        border-top: 1px solid var(--filo);
      }

      /* Una riga è un interruttore sulla barra: la striscia sul bordo dice
       * come sta, e si legge in colonna senza leggere le parole. */
      ul.barra button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        border-left: 3px solid transparent;
        padding: 11px 13px 12px 12px;
        cursor: pointer;
      }

      ul.barra button:hover {
        background: var(--velo);
      }

      ul.barra button[aria-current="true"] {
        background: var(--azzurro-velo);
      }

      ul.barra .posto {
        border-left-color: var(--spia);
      }

      ul.barra .guardare {
        border-left-color: var(--ottone);
      }

      ul.barra .muta {
        border-left-color: var(--allarme);
      }

      ul.barra .aperto {
        border-left-color: var(--tenue);
      }

      .testa {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .testa .nome {
        font-size: 0.93rem;
        font-weight: 600;
        letter-spacing: -0.005em;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .testa .quando {
        margin-left: auto;
        flex: none;
        color: var(--tenue);
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
      }

      .sottotesta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 3px;
        color: var(--tenue);
        font-size: 0.72rem;
      }

      /* ─── Gli stati: forma + parola + colore, mai il colore da solo ─── */
      .stato {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.69rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }

      .stato .segno {
        font-size: 0.85em;
        line-height: 1;
      }

      .stato.posto {
        color: var(--spia);
      }

      .stato.guardare {
        color: var(--ottone);
      }

      .stato.muta {
        color: var(--allarme);
      }

      .stato.aperto {
        color: var(--tenue);
      }

      /* ─── Le pastiglie: quello che non va, una cosa per pastiglia ───── */
      .pastiglie {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }

      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        line-height: 1.3;
        padding: 2px 7px;
        border-radius: 3px;
        background: var(--velo);
        color: var(--smorzato);
        white-space: nowrap;
      }

      .pastiglia.male {
        background: var(--allarme-velo);
        color: var(--allarme);
      }

      .pastiglia.attenta {
        background: var(--ottone-velo);
        color: var(--ottone);
      }

      .pastiglia.bene {
        background: var(--spia-velo);
        color: var(--spia);
      }

      .pastiglia .segno {
        font-size: 0.85em;
      }

      /* ─── La striscia dei giorni ─────────────────────────────────────
       *
       * Quattordici barre, una per giorno, incolonnate fra una casa e l'altra.
       * I giorni pieni sono verdi smorti e i buchi rossi: quello che si deve
       * vedere da lontano non è che ha parlato — è la regola — ma quando non
       * l'ha fatto. Sotto c'è scritto quante volte, perché una striscia di
       * colori da sola non la legge chi i colori non li vede. */
      .giorni {
        display: flex;
        gap: 2px;
        margin-top: 9px;
      }

      .giorni i {
        flex: 1;
        height: 13px;
        border-radius: 1px;
        background: var(--pieno);
      }

      .giorni.grande i {
        height: 18px;
        border-radius: 2px;
      }

      .giorni i.mezza {
        background: var(--ottone);
      }

      .giorni i.vuota {
        background: var(--allarme);
      }

      .giorni i.prima {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--filo);
      }

      .giorniDice {
        color: var(--tenue);
        font-size: 0.7rem;
        margin-top: 5px;
      }

      /* ─── La casa aperta ─────────────────────────────────────────────── */
      .scheda {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .riquadro {
        background: var(--scheda);
        border: 1px solid var(--linea);
        border-radius: 7px;
        padding: 16px 18px;
        box-shadow: var(--ombra);
      }

      .indietro {
        display: none;
        font: inherit;
        font-size: 0.82rem;
        color: var(--azzurro);
        background: transparent;
        border: 0;
        padding: 0 0 2px;
        cursor: pointer;
        align-self: flex-start;
      }

      .titolo {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .titolo h2 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .perché {
        color: var(--smorzato);
        font-size: 0.85rem;
        margin-top: 5px;
      }

      .targa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 12px 20px;
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid var(--filo);
      }

      .targa div {
        min-width: 0;
      }

      .targa dt {
        color: var(--tenue);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 600;
      }

      .targa dd {
        margin: 2px 0 0;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }

      .azioni {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 15px;
      }

      .azioni button {
        font: inherit;
        font-size: 0.82rem;
        color: var(--inchiostro);
        background: var(--scheda);
        border: 1px solid var(--linea);
        border-radius: 5px;
        padding: 7px 13px;
        cursor: pointer;
      }

      .azioni button:hover {
        border-color: var(--tenue);
      }

      .azioni button.forte {
        color: #fff;
        background: var(--azzurro);
        border-color: var(--azzurro);
      }

      :root[data-theme="dark"] .azioni button.forte,
      .azioni button.forte {
        color: var(--barra);
      }

      .azioni button.male {
        color: var(--allarme);
        border-color: var(--allarme);
        background: transparent;
      }

      h3 {
        margin: 0;
        font-size: 0.69rem;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--tenue);
      }

      .capoRiquadro {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 13px;
      }

      .capoRiquadro .conta {
        margin-left: auto;
        font-size: 0.8rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--smorzato);
      }

      /* Il misuratore del collaudo: sette caselle, una per spunta. */
      .misura {
        display: flex;
        gap: 3px;
        margin-bottom: 14px;
      }

      .misura i {
        flex: 1;
        height: 5px;
        border-radius: 1px;
        background: var(--linea);
      }

      .misura i.fatta {
        background: var(--spia);
      }

      .misura i.manca {
        background: var(--ottone);
        opacity: 0.5;
      }

      ul.spunte {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.spunte li {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 7px 0;
        font-size: 0.87rem;
      }

      ul.spunte li + li {
        border-top: 1px solid var(--filo);
      }

      ul.spunte .segno {
        flex: none;
        width: 1em;
        text-align: center;
        font-size: 0.85em;
      }

      ul.spunte .fatta .segno {
        color: var(--spia);
      }

      ul.spunte .manca .segno {
        color: var(--ottone);
      }

      ul.spunte .manca .cosa {
        font-weight: 550;
      }

      ul.spunte .cosa {
        flex: 1;
        min-width: 0;
      }

      ul.spunte .dettaglio {
        color: var(--tenue);
        font-size: 0.78rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .verdetto {
        margin-top: 13px;
        padding-top: 12px;
        border-top: 1px solid var(--filo);
        font-size: 0.82rem;
        color: var(--smorzato);
      }

      /* Le misure della salute: quattro caselle, non quattro righe di testo. */
      .misure {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
        gap: 1px;
        margin-top: 15px;
        background: var(--filo);
        border: 1px solid var(--filo);
        border-radius: 5px;
        overflow: hidden;
      }

      .misure div {
        background: var(--scheda);
        padding: 10px 12px;
      }

      .misure dt {
        color: var(--tenue);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 600;
      }

      .misure dd {
        margin: 3px 0 0;
        font-size: 1.05rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .misure dd small {
        display: block;
        font-size: 0.72rem;
        font-weight: 400;
        color: var(--tenue);
        margin-top: 1px;
      }

      .misure dd.male {
        color: var(--allarme);
      }

      .misure dd.attenta {
        color: var(--ottone);
      }

      table.versioni {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.87rem;
      }

      table.versioni td {
        padding: 7px 0;
      }

      table.versioni tr + tr td {
        border-top: 1px solid var(--filo);
      }

      table.versioni td.numero {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      table.versioni .nuova {
        display: inline-block;
        margin-left: 7px;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 3px;
        background: var(--ottone-velo);
        color: var(--ottone);
      }

      .impronte {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 11px;
      }

      .impronte span {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.78rem;
        padding: 3px 8px;
        border-radius: 3px;
        background: var(--allarme-velo);
        color: var(--allarme);
      }

      .nota {
        color: var(--smorzato);
        font-size: 0.8rem;
        line-height: 1.55;
        max-width: 42rem;
      }

      details.cartolina summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      details.cartolina summary::-webkit-details-marker {
        display: none;
      }

      details.cartolina summary::after {
        content: "mostra";
        margin-left: auto;
        font-size: 0.78rem;
        color: var(--azzurro);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }

      details.cartolina[open] summary::after {
        content: "nascondi";
      }

      details.cartolina pre {
        margin: 13px 0 0;
        padding: 13px;
        background: var(--velo);
        border-radius: 5px;
        overflow-x: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.75rem;
        line-height: 1.6;
        color: var(--smorzato);
      }

      footer {
        max-width: 78rem;
        margin-inline: auto;
        padding: 0 20px 34px;
        color: var(--tenue);
        font-size: 0.76rem;
      }

      /* ─── Stretto: una cosa per volta ───────────────────────────────── */
      @media (max-width: 62rem) {
        .banco {
          grid-template-columns: minmax(0, 1fr);

       * IL COLLAUDO E LA SALUTE.
       *
       * Sono le sole regole di questa pagina, ed è la stessa cosa che nel
       * quadro vero starà in `src/collaudo.js`: da una cartolina si ricavano
       * delle spunte, e dalle spunte uno stato.

      /* Dopo quante cartoline saltate una casa è muta. Tre: una sola può essere

      const MUTA_DOPO = 3;

       * guardare. Due settimane: chi lo fa ogni notte se ne accorge subito, chi
       * lo fa a mano una volta al mese non viene tormentato. */
      const BACKUP_FERMO = 14;

      /* Sotto quale carica una batteria si conta fra quelle da cambiare. */
      const BATTERIA_SCARICA = 20;

      const minutiDaAllora = (quando) => Math.round((ADESSO - new Date(quando).getTime()) / 60000);

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      function daQuanto(quando) {
        const minuti = minutiDaAllora(quando);
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

       *

       * impianto da andare a vedere, e una casa che diventa ambra per quello
       * insegna a non guardare più le case ambra. Conta quando tocca Home
       * Assistant o gdahome — lì dentro ci sono le correzioni di sicurezza — o
       * quando se ne sono accumulati tre.
       *
       * Nel collaudo invece contano tutti: alla consegna un impianto si lascia
       * aggiornato, e quella spunta è severa apposta. Due domande diverse sulla
       * stessa riga, ed è giusto che diano due risposte diverse. */
      const aggiornamentiPesano = (a) => a.quanti >= 3 || a.ha || a.gdahome;

       *

            cosa: "La plancia è configurata",
            fatta: c.plance.configurate > 0,
            dettaglio:

        const celle = [...giorni]

            if (uno === "V") return '<i class="vuota" title="muta tutto il giorno"></i>';

            return '<i title="tutte le cartoline arrivate"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} da quando è accesa`

            </div>`,
        ).join("");

        doveFiltri.innerHTML = [["tutte", `Tutte ${conStato.length}`]]
          .concat(LE_FILE.map(([chiave, , parola]) => [chiave, `${parola} ${quante(chiave)}`]))
          .map(
            ([chiave, parola]) =>
              `<button type="button" data-filtro="${chiave}" aria-pressed="${filtro === chiave}">${testo(parola)}</button>`,
          )
          .join("");

        const viste = conStato.filter((r) => filtro === "tutte" || r.stato.chiave === filtro);
        doveElenco.innerHTML = viste
          .map(({ una, indice, stato }) => unaRiga(una, indice, stato))
          .join("");

        banco.classList.toggle("aperta", suTelefonoApro);
        doveScheda.innerHTML = ilDettaglio(CASE[aperta], loStato(CASE[aperta]));

        doveFiltri.querySelectorAll("[data-filtro]").forEach((tasto) => {
          tasto.onclick = () => {
            filtro = tasto.dataset.filtro;
            disegna();
          };
        });
        doveElenco.querySelectorAll("[data-casa]").forEach((tasto) => {
          tasto.onclick = () => {
            aperta = Number(tasto.dataset.casa);
            suTelefonoApro = true;
            disegna();
            window.scrollTo({ top: 0 });
          };
        });
        const torna = doveScheda.querySelector("[data-indietro]");
        if (torna)
          torna.onclick = () => {
            suTelefonoApro = false;
            disegna();
          };
      }

      function unaRiga(casa, indice, stato) {
        const c = casa.carta;
        return `
          <li>
            <button
              type="button"
              class="${stato.chiave}"
              data-casa="${indice}"
              aria-current="${indice === aperta}"
            >
              <div class="testa">
                <span class="nome">${testo(casa.nome)}</span>
                <span class="quando">${testo(daQuanto(c.quando))}</span>
              </div>
              <div class="sottotesta">
                ${spia(stato)}
                <span class="mono">${testo(c.casa.slice(5, 13))}</span>
              </div>
              <div class="pastiglie">
                ${lePastiglie(c)
                  .map(
                    ([parola, come]) =>
                      `<span class="pastiglia ${come}">${come === "male" || come === "attenta" ? '<span class="segno" aria-hidden="true">▲</span>' : ""}${testo(parola)}</span>`,
                  )
                  .join("")}
              </div>
              ${laStriscia(casa.giorni)}
            </button>
          </li>
        `;
      }

      function ilDettaglio(casa, stato) {
        const c = casa.carta;
        const collaudo = ilCollaudo(c);

        const verdetto =
          collaudo.fatte === collaudo.quante
            ? "Tutte spuntate: questo impianto è a posto."
            : casa.collaudataIl === null
              ? "Non è ancora stata consegnata: finché le spunte non sono tutte, resta in fila."
              : `Il collaudo si era chiuso il ${casa.collaudataIl}. Queste righe si sono riaperte dopo, ed è il motivo per cui questa casa è qui.`;

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti.ha],
          ["Supervisor", c.supervisor, false],
          ["il sistema", c.sistema, false],
        ];

        const misure = [
          c.dispositivi.spariti > 0
            ? ["Dispositivi spariti", c.dispositivi.spariti, `su ${c.dispositivi.totali}`, "male"]
            : ["Dispositivi", c.dispositivi.totali, "rispondono tutti", ""],
          [
            "Batteria più bassa",
            `${c.batterie.piuBassa}%`,
            c.batterie.sotto20 > 0
              ? `${c.batterie.sotto20} sotto il ${BATTERIA_SCARICA}%`
              : "nessuna da cambiare",
            c.batterie.sotto20 > 0 ? "attenta" : "",
          ],
          [
            "Ultimo backup",
            c.backup.giorniFa === null ? "mai" : c.backup.giorniFa,
            c.backup.giorniFa === null ? "non ne ha mai fatto uno" : "giorni fa",
            backupFermo(c) ? "attenta" : "",
          ],
          [
            "Errori nel registro",
            c.registro.errori24h,
            "nelle ultime 24 ore",
            c.registro.errori24h > 0 ? "male" : "",
          ],
        ];

        return `
          <button type="button" class="indietro" data-indietro>← tutte le case</button>

          <section class="riquadro">
            <div class="titolo">
              <h2>${testo(casa.nome)}</h2>
              ${spia(stato)}
            </div>
            ${stato.perché ? `<p class="perché">${testo(stato.perché)}</p>` : ""}
            <dl class="targa">
              <div>
                <dt>Matricola</dt>
                <dd class="mono">${testo(c.casa.slice(0, 18))}…</dd>
              </div>
              <div><dt>Installata</dt><dd>${testo(casa.da)}</dd></div>
              <div>
                <dt>Collaudata</dt>
                <dd>${casa.collaudataIl === null ? "mai" : testo(casa.collaudataIl)}</dd>
              </div>
              <div>
                <dt>Cartolina</dt>
                <dd>${testo(daQuanto(c.quando))}, ogni ${c.ogni} min</dd>
              </div>
              <div>
                <dt>Telefoni</dt>
                <dd>${c.telefoni.abbinati} — ${c.telefoni.visti7gg} visti in 7 gg</dd>
              </div>
            </dl>
            <div class="azioni">
              <button type="button" class="forte">Apri questa casa nell'app</button>
              <button type="button">Stampa il verbale</button>
              <button type="button">Rinomina</button>
              <button type="button" class="male">Non seguirla più</button>
            </div>
          </section>

          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Il collaudo</h3>
              <span class="conta num">${collaudo.fatte}/${collaudo.quante}</span>
            </div>
            <div
              class="misura"
              role="img"
              aria-label="${collaudo.fatte} spunte su ${collaudo.quante}"
            >
              ${collaudo.spunte.map((una) => `<i class="${una.fatta ? "fatta" : "manca"}"></i>`).join("")}
            </div>
            <ul class="spunte">
              ${collaudo.spunte
                .map(
                  (una) => `
                <li class="${una.fatta ? "fatta" : "manca"}">
                  <span class="segno" aria-hidden="true">${una.fatta ? "✓" : "▲"}</span>
                  <span class="cosa"
                    >${testo(una.cosa)}<span class="via">${una.fatta ? " — fatta" : " — manca"}</span></span
                  >
                  <span class="dettaglio">${testo(una.dettaglio)}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">${testo(verdetto)}</p>
          </section>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>La salute, quattordici giorni</h3></div>
            ${laStriscia(casa.giorni, true)}
            <dl class="misure">
              ${misure
                .map(
                  ([che, quanto, sotto, come]) => `
                <div>
                  <dt>${testo(che)}</dt>
                  <dd class="${come}">${testo(quanto)}<small>${testo(sotto)}</small></dd>
                </div>`,
                )
                .join("")}
            </dl>
          </section>

          ${
            c.dispositivi.spariti > 0
              ? `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>I dispositivi che non rispondono</h3></div>
            <div class="impronte">
              ${c.dispositivi.impronte.map((una) => `<span>#${testo(una)}</span>`).join("")}
            </div>
            <p class="nota">
              Il quadro non sa quali sono, e non lo può sapere: la casa manda
              quattro cifre ricavate dal nome del dispositivo con un sale che non
              esce da lì. Servono a dire <em>lo stesso di ieri</em> oppure
              <em>un altro</em>, e a niente di più. Per sapere il nome si apre la
              casa dall'app, sul filo cifrato, con il segno che chi ci abita può
              togliere quando vuole.
            </p>
          </section>`
              : ""
          }

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Le versioni</h3></div>
            <table class="versioni">
              ${versioni
                .map(
                  ([che, quale, nuova]) => `
                <tr>
                  <td>${testo(che)}</td>
                  <td class="numero">
                    ${testo(quale)}${nuova ? '<span class="nuova">c&#39;è la nuova</span>' : ""}
                  </td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <details class="cartolina">
              <summary><h3>La cartolina, come è arrivata</h3></summary>
              <pre>${testo(JSON.stringify(c, null, 2))}</pre>
              <p class="nota" style="margin-top: 12px">
                Questo è <strong>tutto</strong> quello che questa casa manda.
                Nessun nome di entità, nessuna stanza, nessuna persona, nessuno
                stato di nessun sensore, nessun indirizzo. Lo stesso testo,
                parola per parola, lo legge chi ci abita: sta nella scheda «Il
                quadro» della console dell'add-on, insieme al tasto per smettere
                di mandarlo.
              </p>
            </details>
          </section>
        `;
      }

      disegna();
    </script>
  </body>
</html>
