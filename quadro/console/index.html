          anelli.push(unMetro({ che: "Disco", valore: m.disco, quanto: m.disco, come: "male" }));
        if (m && (m.temperatura ?? 0) >= SOGLIE.troppoCaldo)
          anelli.push(
            unMetro({
              che: "Temperatura",
              valore: m.temperatura,
              unita: "°",
              quanto: m.temperatura,
              come: "male",
            }),
          );
        if (m && cE(m.discoVita) && m.discoVita >= DISCO_STANCO)
          anelli.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, SOGLIE.discoFinito),
            }),
          );
        /* Una macchina di casa che non sta in piedi e' un'anomalia, e va detta
         * qui: chi installa guarda questo elenco per primo, e un nodo giu' che
         * si vede solo aprendo la scheda intera e' un nodo che resta giu'.
         *
         * Le due parole restano diverse anche qui, perche' portano a due
         * lavori diversi: «non risponde» si va a cercare sulla rete, «spento»
         * si va ad accendere. */
        const macchineGiu = (Array.isArray(c.nodi) ? c.nodi : []).filter(
          (uno) => uno.muto || uno.acceso === false,
        );
        const daInstallare =
          (c.aggiornamenti?.elenco || []).length > 0 || Boolean(casa.chiesto) || Boolean(c.lavoro);

        return `
          <ul class="guai">
            ${stato.chiave === "offline" ? `<li data-grave="true"><i></i><span>${testo(stato.perché)}</span></li>` : ""}
            ${rotti
              .map(
                (uno) => `
              <li data-grave="${GRAVI.has(uno.cosa) ? "true" : "false"}">
                <i></i><span><b>${testo(uno.cosa)}</b> — ${testo(uno.dettaglio)}</span>
              </li>`,
              )
              .join("")}
            ${macchineGiu
              .map(
                (uno) => `
              <li data-grave="true">
                <i></i><span><b>${testo(uno.nome)}</b> — ${
                  uno.muto ? "non risponde" : "spento"
                }</span>
              </li>`,
              )
              .join("")}
            ${
              !rotti.length && !macchineGiu.length && stato.chiave !== "offline"
                ? `<li><i></i><span>${testo(stato.perché || "Nessuna anomalia.")}</span></li>`
                : ""
            }
          </ul>
          ${
            anelli.length
              ? `<div class="tre-anelli" style="grid-template-columns: repeat(${Number(Math.min(3, anelli.length))}, 1fr)">
                   ${anelli.join("")}
                 </div>`
              : ""
          }
          ${daInstallare ? gliAggiornamenti(c, casa) : ""}
          ${
            quantiGiu(c) > 0
              ? `<section class="riquadro">
                   <div class="capoRiquadro">
                     <h3>Dispositivi che non rispondono</h3>
                     <span class="conta">${plurale(c.entita?.dispositivi ?? quantiGiu(c), "dispositivo", "dispositivi")}</span>
                   </div>
                   <div class="nomiGiu">${iNomiGiu(c)}</div>
                 </section>`
              : ""
          }
          <p class="nota" style="margin: 4px 4px 0">
            Qui ci sono solo le anomalie. «Mostra tutto» apre la scheda completa: macchina, rete, add-on, versioni.
          </p>
        `;
      }

      /* Un metro e' un anellino: il valore dentro, il nome sotto. `quanto` e'
       * la parte di cerchio da riempire, in centesimi della scala, e `come` lo
       * colora. Si apre con la sua animazione solo quando il foglio sale:
       * ai giri dopo si disegna gia' pieno. */
      function unMetro({ che, valore, unita = "%", sotto = "", come, quanto }) {
        const animato = Boolean(foglioAperto?.appena);
        /* Quello che questa casa non dice non si disegna a zero: una CPU che
         * non c'e' non e' una CPU allo zero per cento. */
        if (valore === null || valore === undefined)
          return `
            <div class="anellino">
              <div class="cerchio">${anellino(0, "bene", false)}<b class="attenta">—</b></div>
              <span>${testo(che)}</span>
              <small class="nonLoDice">non comunicato</small>
            </div>`;
        return `
          <div class="anellino">
            <div class="cerchio">
              ${anellino(quanto, come, animato)}<b class="${come === "bene" ? "" : testo(come)}">${testo(valore)}${testo(unita)}</b>
            </div>
            <span>${testo(che)}</span>
            ${sotto ? `<small>${testo(sotto)}</small>` : ""}
          </div>`;
      }

      /* Un riquadro che dice che non si sa, invece di uno che disegna zeri. */
      function riquadroMuto(titolo, perché) {
        return `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>${testo(titolo)}</h3></div>
            <p class="nota">${testo(perché)}</p>
          </section>`;
      }

      /* La macchina: quello che il Supervisor sa del ferro sotto Home
       * Assistant, più la temperatura che la plancia disegna già.
       *
       * `discoVita` è la riga che su queste schede conta davvero e che nessuno
       * guarda: una eMMC o una microSD hanno un numero di scritture e poi
       * finiscono. Quando c'è, ha la sua barra; su una macchina che non la
       * dichiara — un NUC con un SSD — non si inventa. */
      function laMacchina(c) {
        const m = c.macchina;
        /* Un rapporto senza macchina non e' una casa senza macchina: e' una
         * casa il cui Supervisor non ha risposto. Si dice, e non si disegnano
         * cinque metri a zero. */
        if (!m)
          return riquadroMuto("La macchina", "Il Supervisor di questo impianto non ha risposto.");
        const metri = [
          unMetro({
            che: "CPU",
            valore: m.cpu,
            quanto: m.cpu,
            come: livello(m.cpu, 70, 90),
          }),
          unMetro({
            che: "Memoria",
            valore: m.ram,
            quanto: m.ram,
            come: livello(m.ram, 75, 90),
          }),
          unMetro({
            che: "Disco",
            valore: m.disco,
            quanto: m.disco,
            sotto: cE(m.discoLiberi) ? `${m.discoLiberi} GB liberi` : "",
            come: livello(m.disco, 75, SOGLIE.discoPieno),
          }),
          unMetro({
            che: "Temperatura",
            valore: m.temperatura,
            unita: "°",
            quanto: m.temperatura,
            sotto: `soglia a ${SOGLIE.troppoCaldo}°`,
            come: livello(m.temperatura, SOGLIE.troppoCaldo - 10, SOGLIE.troppoCaldo),
          }),
        ];
        if (m.discoVita !== null)
          metri.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, SOGLIE.discoFinito),
            }),
          );

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La macchina</h3>
              <span class="conta">${testo(m.scheda)}</span>
            </div>
            <div class="tre-anelli">${metri.join("")}</div>
            <p class="verdetto">
              ${[
                cE(c.sistema) ? testo(c.sistema) : "",
                cE(m.accesaDa) ? `accesa da ${plurale(m.accesaDa, "giorno", "giorni")}` : "",
              ]
                .filter(Boolean)
                .join(" · ")}${cE(c.sistema) || cE(m.accesaDa) ? "." : ""}
              ${
                m.discoVita !== null && m.discoVita >= DISCO_STANCO
                  ? `Il disco è consumato al ${testo(m.discoVita)}%: su queste schede è il primo componente a guastarsi, meglio sostituirlo per tempo.`
                  : m.temperatura >= SOGLIE.troppoCaldo
                    ? `Sopra i ${Number(SOGLIE.troppoCaldo)}° la scheda riduce la velocità da sola: l'impianto non si guasta, ma rallenta.`
                    : "Nessun valore fuori soglia."
              }
            </p>
          </section>`;
      }

      /* Gli aggiornamenti: cosa c'è da fare, e il tasto per farlo.
       *
       * Le voci hanno la forma che `aggiornamentiDaFare` produce già nel
       * ponte, e due dei suoi campi decidono cosa si vede:
       *
       *  - `installabile` — un firmware che si aggiorna dal suo apparecchio non ha
       *    nessun tasto. Mostrarglielo sarebbe una promessa che non si
       *    mantiene, ed è la regola che il ponte si è già data;
       *  - `stacca` — gdahome e Home Assistant, installandosi, fanno cadere il
       *    filo. Detto prima è un'attesa; non detto è un guasto — e da un
       *    quadro che aggiorna da lontano, non detto è una casa che sembra
       *    morta mentre sta solo riavviandosi.
       *
       * E il tasto c'è solo se quella casa **ha aperto la manutenzione**.
       * Vedere cosa c'è da fare e poterlo fare sono due permessi diversi, e
       * il secondo non si dà da sé insieme al primo. */
      function gliAggiornamenti(c, casa) {
        if (!c.aggiornamenti)
          return riquadroMuto(
            "Gli aggiornamenti",
            "Questo impianto non ha comunicato gli aggiornamenti.",
          );
        const elenco = c.aggiornamenti.elenco || [];
        const cartello = ilCartello(c, casa?.chiesto);

        /* Il numero senza i nomi.
         *
         * Qui c'era scritto «Niente da fare: questa casa e' aggiornata» in
         * tutti e due i casi, e su una casa con quattro aggiornamenti in
         * attesa faceva questo: i controlli dicevano «4 in attesa» e due dita
         * piu' sotto lo stesso schermo diceva che era aggiornata.
         *
         * Non e' un caso raro: i ponti fino alla 1.5.8 mandavano il **conto**
         * e non l'elenco, quindi lo fa ogni casa non ancora aggiornata. Dire
         * quale delle due cose e' — «non ho niente da mostrarti» oppure «non
         * me li ha mandati» — e' la differenza fra un cruscotto e un
         * indovinello. */
        const quanti = Number(c.aggiornamenti.quanti) || 0;
        if (!elenco.length)
          return `
            <section class="riquadro">
              <div class="capoRiquadro"><h3>Gli aggiornamenti</h3></div>
              ${/* già HTML */ cartello}
              ${
                quanti > 0
                  ? `<div class="limite" style="margin-top: 16px">
                      <span class="gettone" aria-hidden="true">◴</span>
                      <span>
                        <b>${plurale(quanti, "aggiornamento in attesa", "aggiornamenti in attesa")}, ma questo impianto non manda l'elenco.</b> Il numero arriva, i nomi no: è una versione di gdahome precedente alla 1.5.9, che non inviava ancora l'elenco. Aggiorna l'add-on su quell'impianto e qui compaiono nomi, icone, note e il tasto per installare.
                      </span>
                    </div>`
                  : `<p class="nota">Nessun aggiornamento in attesa: l'impianto è aggiornato.</p>`
              }
            </section>`;

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli aggiornamenti</h3>
              <span class="conta">${plurale(elenco.length, "in attesa", "in attesa")}</span>
            </div>
            ${/* già HTML */ cartello}
            <ul class="versi">
              ${elenco
                .map((uno) =>
                  unaRiga(uno, {
                    fare: `${uno.stacca ? '<span class="pastiglia attenta">riavvio necessario</span>' : ""}${ilTasto(uno, c, casa)}`,
                  }),
                )
                .join("")}
            </ul>
            ${
              c.manutenzione
                ? `<p class="verdetto">
                    Il backup viene <b>sempre prima</b>: è la condizione, non un'opzione. E si installa <b>uno per volta</b>: due insieme sullo stesso impianto vogliono dire non sapere quale dei due ha causato un problema. Per questo non c'è un «installa tutti».
                  </p>`
                : `<div class="limite" style="margin-top: 16px">
                    <span class="gettone" aria-hidden="true">◴</span>
                    <span>
                      <b>Questo impianto non ha attivato la manutenzione.</b> Gli aggiornamenti si vedono ma non si possono installare: vedere e intervenire sono due permessi diversi. <br /><br /> La attiva <b>chi abita la casa</b>, dal suo Home Assistant: <b>Impostazioni › Add-on › gdahome › Configurazione</b>, la casella <i>«Lascia che chi ti ha fatto l'impianto aggiorni da lontano»</i>, poi <b>Salva</b>; l'add-on si riavvia da solo. Da qui non si può attivare, ed è voluto: sarebbe un permesso che si concede da solo.
                    </span>
                  </div>`
            }
          </section>`;
      }

      /* Cosa si può fare su questa riga: il tasto, o il motivo per cui non c'è.
       *
       * Sei casi, e si leggono in quest'ordine perché così si escludono a
       * vicenda. Il tasto è l'ultimo: tutto quello che viene prima è una
       * ragione per non mostrarlo, e mostrarlo lo stesso sarebbe una promessa
       * che non si mantiene.
       *
       * Il nome e il salto di versione finiscono in tre `data-`, e non
       * l'entità: nel rapporto l'entità non c'è, e non c'è apposta. È lo stesso
       * modo con cui la casa ritrova di cosa si sta parlando. */
      function ilTasto(uno, c, casa) {
        /* Le stesse parole dell'app, e non una seconda invenzione.
         *
         * Qui c'era scritto «si porta col cacciavite», che nell'app non si
         * legge da nessuna parte — li' la stessa cosa si chiama «Questo si
         * aggiorna dal suo apparecchio». Due schermi che raccontano la stessa
         * cosa con due vocabolari sono due schermi che sembrano di due
         * programmi diversi, e «col cacciavite» per giunta bisogna indovinarlo.
         *
         * Il cacciavite resta nei commenti, dove parliamo fra noi. */
        if (!uno.installabile)
          return '<span class="pastiglia">si aggiorna dal suo apparecchio</span>';
        if (eLaStessa(uno, casa?.chiesto))
          return `<button type="button" class="tasto" data-lascia-stare="${testo(casa.casa)}">
            Annulla
          </button>`;
        if (eLaStessa(uno, c.lavoro) && c.lavoro.stato === "in corso")
          return '<span class="pastiglia lavoro">in corso</span>';
        if (casa?.chiesto || staLavorando(c)) return '<span class="pastiglia">uno per volta</span>';
        if (!c.manutenzione) return '<span class="pastiglia">manutenzione non attiva</span>';
        return `<button
          type="button"
          class="tasto"
          data-installa="${testo(casa?.casa || "")}"
          data-quale-nome="${testo(uno.nome)}"
          data-quale-da="${testo(uno.da)}"
          data-quale-a="${testo(uno.a)}"
        >Installa</button>`;
      }

      /* Il cartello in cima agli aggiornamenti: cosa sta succedendo in questa
       * casa, o com'è finita l'ultima volta.
       *
       * I nomi degli stati sono quelli che manda il ponte — `in corso`,
       * `fatto`, `non riuscito` — e non una traduzione fatta qui: due
       * vocabolari per la stessa cosa vogliono dire un cartello che smette di
       * comparire il giorno che uno dei due cambia, in silenzio. */
      function ilCartello(c, chiesto = null) {
        /* Prima di tutto quello che si è appena chiesto e che la casa non è
         * ancora passata a prendersi: sono i secondi in cui chi ha premuto il
         * tasto si chiede se ha funzionato. */
        if (chiesto)
          return `
            <div class="cartello">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                <b>${
                  chiesto.cosa === "riavvia"
                    ? "Il riavvio di Home Assistant"
                    : chiesto.cosa === "configura"
                      ? `La configurazione della plancia «${testo(chiesto.nome)}»`
                      : `${testo(chiesto.nome)} ${testo(chiesto.da)} → ${testo(chiesto.a)}`
                }</b>
                è stato richiesto ${testo(daQuanto(chiesto.chiesto))}. Parte al prossimo rapporto di questo impianto: è l'impianto a ritirare il comando, il cruscotto non lo contatta.
              </span>
            </div>`;
        const l = c.lavoro;
        /* Non `=== null`: una casa ferma a un ponte di ieri questa riga non la
         * manda affatto, e `undefined` non è `null`. */
        if (!l) return "";
        if (l.stato === "fatto")
          return `
            <div class="cartello bene">
              <span class="gettone" aria-hidden="true">✓</span>
              <span><b>${testo(l.cosa)}</b> ${l.riavvio ? "fatto" : l.configurazione ? "applicata" : "installato"} ${testo(daQuanto(l.quando))}, dal cruscotto.${
                l.configurazione && l.perche ? ` ${testo(l.perche)}.` : ""
              }</span>
            </div>`;
        if (l.stato === "non riuscito")
          return `
            <div class="cartello male">
              <span class="gettone" aria-hidden="true">✕</span>
              <span
                ><b>${testo(l.cosa)}</b> non è riuscito ${testo(daQuanto(l.quando))}:
                ${testo(l.perche || "l'impianto ha rifiutato")}.</span
              >
            </div>`;
        const fermi = Math.round((ADESSO() - new Date(c.quando).getTime()) / 60000);
        const tardi = l.stacca && fermi > 45;
        return `
          <div class="cartello ${tardi ? "male" : ""}">
            <span class="gettone" aria-hidden="true">${tardi ? "!" : "◴"}</span>
            <span>
              <b>${testo(l.cosa)}</b> è partito ${testo(daQuanto(l.quando))}${
                tardi
                  ? ` e questo impianto non ha più risposto. Un riavvio dura pochi minuti: serve un intervento sul posto.`
                  : l.stacca
                    ? `. L'impianto si riavvia: per qualche minuto non risponde, ed è normale.`
                    : `. L'esito arriva col prossimo rapporto.`
              }
            </span>
          </div>`;
      }

      /* La rete: le schede che il Supervisor dichiara, più gli apparati di
       * casa che la plancia già sorveglia.
       *
       * I due pezzi non sono la stessa cosa e non vanno confusi. Le schede
       * sono quelle **della macchina** e le sa il Supervisor senza che
       * nessuno configuri niente. Gli apparati — il router, i ripetitori —
       * sono i `binary_sensor` con `device_class: connectivity` che la
       * sezione «Macchine e rete» della plancia adotta per integrazione: ci
       * sono se chi ci abita li ha spuntati, e dove non sono spuntati qui
       * si dice zero invece di fingere. */
      /* Le altre macchine di casa: il cluster, il NAS, il secondo mini PC.
       *
       * «Nel lato installatore devono comparire anche eventuali macchine
       * inserite e nodi presenti.» Chi abita le dichiara nella sezione MiniPC
       * della plancia, e chi installa vedeva solo la macchina di Home
       * Assistant — cioè non vedeva proprio quelle che si guastano senza che
       * nessuno se ne accorga, perché su un nodo che non è quello della
       * plancia nessuno guarda mai.
       *
       * Ha la stessa forma della scheda della rete, e non per pigrizia: sono
       * la stessa cosa da guardare — un elenco di apparati, ognuno con la sua
       * lucina e quello che dice di sé.
       *
       * Una casa senza cluster non ha un riquadro vuoto: non ha un riquadro.
       * È la stessa regola della plancia, dove la fascia non esiste finché
       * nessuno ha configurato un nodo. */
      function leAltreMacchine(c) {
        const nodi = Array.isArray(c.nodi) ? c.nodi : [];
        if (!nodi.length) return "";
        /* «Non risponde» e «spento» sono due guai diversi e si contano
         * insieme solo qui, nel conto di quanti stanno in piedi: nella riga
         * restano distinti, perché chi ripara va a cercare due cose diverse. */
        const giu = nodi.filter((uno) => uno.muto || uno.acceso === false).length;
        const misura = (valore, che, unita, attenta, male) =>
          valore === null || valore === undefined
            ? ""
            : `<span class="pastiglia ${livello(valore, attenta, male) === "bene" ? "" : "attenta"}"
                >${testo(che)} ${testo(valore)}${testo(unita)}</span>`;
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Le altre macchine</h3>
              <span class="conta">${Number(nodi.length - giu)}/${nodi.length} in piedi</span>
            </div>
            <ul class="schede">
              ${nodi
                .map((uno) => {
                  const su = !uno.muto && uno.acceso !== false;
                  return `
                <li class="${su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(uno.nome)}</span>
                  ${misura(uno.cpu, "CPU", "%", 70, 90)}
                  ${misura(uno.ram, "RAM", "%", 75, 90)}
                  ${misura(uno.disco, "disco", "%", 75, SOGLIE.discoPieno)}
                  ${misura(uno.temperatura, "", "°", SOGLIE.troppoCaldo - 10, SOGLIE.troppoCaldo)}
                  <span class="dove">${
                    uno.muto
                      ? "non risponde"
                      : uno.acceso === false
                        ? "spento"
                        : uno.acceso === true
                          ? "acceso"
                          : "stato non mappato"
                  }</span>
                </li>`;
                })
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                giu === 0
                  ? `${plurale(nodi.length, "altra macchina dichiarata", "altre macchine dichiarate")} in questo impianto, ${nodi.length === 1 ? "in piedi" : "tutte in piedi"}.`
                  : `${Number(giu)} ${giu === 1 ? "macchina non è in piedi" : "macchine non sono in piedi"} su ${nodi.length}. «Non risponde» è la rete o Home Assistant che non riesce a chiedere; «spento» è una macchina che qualcuno ha fermato.`
              }
            </p>
          </section>`;
      }

      function laRete(c) {
        const r = c.rete;
        if (!r)
          return riquadroMuto("La rete", "Questo impianto non ha comunicato lo stato della rete.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La rete</h3>
              <span class="pastiglia ${r.internet ? "bene" : "male"}">
                ${r.internet ? "internet raggiungibile" : "senza internet"}
              </span>
            </div>
            <ul class="schede">
              ${r.schede
                .map(
                  (una) => `
                <li class="${una.su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(una.nome)}</span>
                  <span class="tipo pastiglia">${testo(una.tipo === "wifi" ? "Wi-Fi" : "cavo")}</span>
                  ${una.principale ? '<span class="pastiglia bene">principale</span>' : ""}
                  ${
                    una.tipo === "wifi" && una.su && una.segnale !== null
                      ? `<span class="pastiglia ${una.segnale < SEGNALE_DEBOLE ? "attenta" : ""}">segnale ${testo(una.segnale)}%</span>`
                      : ""
                  }
                  <span class="dove">${una.su ? testo(una.ip) : "non attiva"}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                r.sorvegliate.quante === 0
                  ? "Nessun apparato di rete monitorato in questo impianto: nella plancia, sezione «Macchine e rete», si seleziona l'integrazione del router e i ripetitori compaiono da soli."
                  : r.sorvegliate.giu === 0
                    ? `${plurale(r.sorvegliate.quante, "apparato monitorato", "apparati monitorati")}, tutti raggiungibili.`
                    : `${testo(r.sorvegliate.giu)} ${r.sorvegliate.giu === 1 ? "apparato" : "apparati"} su ${testo(r.sorvegliate.quante)} non rispondono.`
              }
            </p>
          </section>`;
      }

      /* Gli add-on, e la sola domanda che conta: ce n'è qualcuno che dovrebbe
       * girare e non gira? */
      function gliAddon(c) {
        const a = c.addon;
        if (!a)
          return riquadroMuto("Gli add-on", "Questo impianto non ha comunicato i suoi add-on.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli add-on</h3>
              <span class="conta">${testo(a.accesi)}/${testo(a.quanti)} accesi</span>
            </div>
            <div class="addon">
              ${a.elenco
                .map((uno) => {
                  const come = uno.su ? "" : uno.allAvvio ? "fermo" : "apposta";
                  return `<span class="uno ${testo(come)}"
                    ><span class="puntino" aria-hidden="true"></span>${testo(uno.nome)}${
                      uno.su ? "" : uno.allAvvio ? " · fermo" : " · spento manualmente"
                    }</span>`;
                })
                .join("")}
            </div>
            <p class="verdetto">
              ${
                a.spentiCheDovrebbero === 0
                  ? "Nessun add-on con avvio automatico è fermo. Quelli spenti manualmente restano spenti: li ha spenti qualcuno."
                  : `${plurale(a.spentiCheDovrebbero, "add-on parte", "add-on partono")} all'avvio e in questo momento ${a.spentiCheDovrebbero === 1 ? "è fermo" : "sono fermi"}. Un add-on con avvio automatico non si spegne da solo: si è arrestato.`
              }
            </p>
          </section>`;
      }
      /* ─── Schermata: gli aggiornamenti ───────────────────────────────
       *
       * **Una casa, un riquadro, e dentro cosa le manca.**
       *
       * Prima si raggruppava al contrario: un riquadro per ogni cosa da
       * installare, e sotto le case che ce l'hanno indietro. Il ragionamento
       * scritto qui era che con quaranta impianti la domanda non e' «cosa
       * manca a questa casa» ma «quali sono indietro su Home Assistant Core»,
       * e che cosi' si sbriga in un gesto invece che in quaranta.
       *
       * Reggeva su una cosa che non c'era: quel gesto. Il tasto «Installa su N
       * case» e' stato li' per un anno senza essere agganciato a niente —
       * nessun `data-`, nessun `onclick` — quindi non installava un bel
       * niente, e il raggruppamento serviva un'azione che non esisteva.
       *
       * Adesso il gesto c'e', ed e' **una casa per volta**: si installa da qui,
       * riga per riga. Un tasto solo che parte su quaranta impianti insieme
       * resta quello che non si fa — se due non tornano non si sa quale dei
       * quaranta guardare, e il backup lo si e' fatto su tutte o su nessuna.
       *
       * Quello che restava era il costo: con **una** casa sola diventano
       * sedici riquadri che dicono tutti «1 casa», e per sapere cosa fare in
       * quella casa bisogna leggerli tutti e sedici. E il lavoro vero si fa
       * comunque nella scheda della casa, una alla volta, perche' e' li' che
       * stanno il backup, la manutenzione e il tasto che installa.
       *
       * Quindi si raggruppa per dove si va a mettere le mani.
       * ─────────────────────────────────────────────────────────────────── */
      function laFlotta() {
        /* Una riga per casa, con quello che le manca. Dentro, le cose nostre
         * per prime — gdahome e Home Assistant sono quelle che staccano il
         * filo — e poi in ordine di nome, perche' un elenco che cambia ordine
         * a ogni ricarica non si impara mai. */
        const indietro = CASE.filter((una) => (una.carta?.aggiornamenti?.elenco || []).length).map(
          (casa) => ({
            casa,
            cose: [...casa.carta.aggiornamenti.elenco].sort((una, altra) => {
              if (una.nostra !== altra.nostra) return una.nostra ? -1 : 1;
              return String(una.nome).localeCompare(String(altra.nome));
            }),
          }),
        );

        /* Le case con piu' arretrati in cima: e' quella la casa da aprire per
         * prima, e cercarla scorrendo sarebbe il lavoro che questa schermata
         * dovrebbe togliere. */
        indietro.sort((una, altra) => {
          if (una.cose.length !== altra.cose.length) return altra.cose.length - una.cose.length;
          return String(una.casa.nome).localeCompare(String(altra.casa.nome));
        });

        if (!indietro.length)
          return `
            <h1 class="titolone">Gli aggiornamenti</h1>
            <p class="sottotitolo">Tutti gli impianti sono aggiornati.</p>`;

        const voci = indietro.reduce((somma, una) => somma + una.cose.length, 0);

        return `
          <h1 class="titolone">Gli aggiornamenti</h1>
          <p class="sottotitolo">
            ${plurale(voci, "aggiornamento in attesa", "aggiornamenti in attesa")} su ${plurale(indietro.length, "impianto", "impianti")}. Un riquadro per impianto, con quello che gli manca: si installa da qui, uno per volta, e premendo il nome si apre la scheda completa.
          </p>

          ${indietro
            .map(({ casa, cose }) => {
              const aperta = Boolean(casa.carta.manutenzione);
              const dalSuoApparecchio = cose.filter((uno) => !uno.installabile).length;
              const daQui = cose.filter((uno) => uno.installabile).length;

              return `
              <section class="riquadro mucchio">
                <div class="capoRiquadro">
                  <h3>
                    <button type="button" class="comeUnLink" data-casa="${Number(CASE.indexOf(casa))}">
                      ${testo(casa.nome)}
                    </button>
                  </h3>
                  <span class="conta">${plurale(cose.length, "aggiornamento", "aggiornamenti")}</span>
                </div>
                <ul class="versi">
                  ${cose
                    .map((uno) => unaRiga(uno, { fare: ilTasto(uno, casa.carta, casa) }))
                    .join("")}
                </ul>
                <p class="verdetto">
                  ${
                    !aperta && daQui
                      ? "Questo impianto non ha attivato la manutenzione: da qui non si installa niente, ed è una scelta di chi abita la casa. La attiva lui, dal suo Home Assistant: Impostazioni › Add-on › gdahome › Configurazione, la casella «Lascia che chi ti ha fatto l'impianto aggiorni da lontano». "
                      : ""
                  }${
                    dalSuoApparecchio
                      ? `${dalSuoApparecchio === 1 ? "Uno si aggiorna" : `${Number(dalSuoApparecchio)} si aggiornano`} dal suo apparecchio: da qui non ${dalSuoApparecchio === 1 ? "si installa" : "si installano"}. `
                      : ""
                  }${
                    aperta && daQui
                      ? "Il backup viene sempre prima, e si installa uno per volta: per questo non c'è un «installa tutti»."
                      : ""
                  }
                </p>
              </section>`;
            })
            .join("")}

          <section class="riquadro" style="margin-top: 14px">
            <div class="capoRiquadro"><h3>Prima di installare</h3></div>
            <ul class="controlli">
              <li class="bene">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Il backup viene sempre prima.</b> Non è un'opzione: è la condizione perché il tasto esista. Un aggiornamento fallito senza backup è un impianto da rifare.
                </span>
              </li>
              <li class="bene">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Quelli che richiedono un riavvio, uno per volta.</b> gdahome e Home Assistant si riavviano durante l'installazione: due insieme sullo stesso impianto vogliono dire non sapere quale dei due ha causato un problema.
                </span>
              </li>
            </ul>
          </section>
        `;
      }

      /* ─── Schermata: l'abbinamento ───────────────────────────────────
       *
       * Come una casa entra in questo quadro. È l'altra metà del lavoro, e
       * ricalca quello che gdahome fa già per abbinare un telefono: un codice
       * che vive pochi minuti, si usa una volta sola, e lascia dietro di sé una
       * chiave che vale per quella casa e per nessun'altra.
       *
       * Il verso è quello che è per un motivo. Non è il quadro che va a cercare
       * le case: è la casa che si presenta. Un quadro che andasse a bussare
       * dovrebbe sapere dove sono, e le case di gdahome un indirizzo pubblico
       * non ce l'hanno — è tutto il punto del ponte.
       * ─────────────────────────────────────────────────────────────────── */
      function lAbbinamento() {
        const primo = INVITI[0] || null;

        return `
          <h1 class="titolone">Abbinamento</h1>
          <p class="sottotitolo">
            Un codice che vale <b>un giorno</b> e <b>un solo impianto</b>. Si genera qui, si invia a chi abita la casa, e da quel momento quell'impianto invia il suo rapporto, e nient'altro. È lungo sedici caratteri, a gruppi di quattro: la chiave con cui apri questa pagina è un'altra cosa, ed è lunga il doppio.
          </p>

          <div class="abbina">
            <div class="colonna">
              <section class="riquadro tinto">
                <div class="capoRiquadro"><h3>Codice attivo</h3></div>
                ${
                  primo && ilCodiceDi(primo)
                    ? `<div class="codice">
                        <span class="cifre">${testo(ilCodiceDi(primo))}</span>
                        <button type="button" class="tasto copia" data-copia="${testo(ilCodiceDi(primo))}">Copia</button>
                      </div>`
                    : ""
                }
                ${
                  primo && !ilCodiceDi(primo)
                    ? `<div class="codice">
                        <span class="cifre">${testo(ilCodiceNascosto(primo))}</span>
                      </div>
                      <p class="nota">Il codice intero si vede solo quando lo generi: se non l'hai copiato, generane un altro e revoca questo.</p>`
                    : ""
                }
                ${
                  primo
                    ? `
                      <div class="scadenza">
                        <span class="battito" aria-hidden="true"></span>
                        Scade fra <b data-orologio="${Number(primo.scadeFra)}">—</b> · generato ${testo(daQuanto(primo.fattoIl))}
                      </div>`
                    : `<p class="nota" style="margin: 16px 0 12px">
                        Nessun codice attivo. Generane uno e invialo a chi abita la casa: vale un giorno, e va inserito nella configurazione dell'add-on gdahome. L'abbinamento avviene da solo al primo rapporto.
                      </p>`
                }

                <ol class="passi" style="margin-top: 20px">
                  <li>
                    <span>
                      In casa del cliente, apri Home Assistant e vai in
                      <span class="strada">Impostazioni → Add-on → gdahome → Configurazione</span>.
                    </span>
                  </li>
                  <li>
                    <span>
                      Inserisci il codice nella casella <b>Il codice di chi ti ha fatto l'impianto</b> e premi <b>Salva</b>. L'add-on si riavvia da solo.
                    </span>
                  </li>
                  <li>
                    <span>
                      Entro un minuto l'impianto compare qui sotto, in <b>Nuovi impianti</b>. Gli assegni un nome e hai finito.
                    </span>
                  </li>
                </ol>

                ${
                  quanteRestano() === 0
                    ? `<p class="minuta" style="margin-top: 16px">
                         <b>Hai raggiunto il limite di ${Number(IO.soglia)} impianti.</b> Per aggiungerne altri serve alzarlo: contatta chi gestisce il cruscotto. I codici già generati restano validi, e gli impianti che segui continuano a funzionare.
                       </p>`
                    : quanteRestano() !== null && quanteRestano() <= 3
                      ? `<p class="minuta" style="margin-top: 16px">
                           Restano <b>${Number(quanteRestano())}</b> posti prima del limite di ${Number(IO.soglia)}. I codici attivi contano.
                         </p>`
                      : ""
                }

                <div class="azioni">
                  <input
                    type="text"
                    id="per-chi"
                    maxlength="60"
                    placeholder="Riferimento (facoltativo)"
                    aria-label="Riferimento del codice"
                  />
                  <button
                    type="button"
                    class="tasto forte grande"
                    data-fai
                    ${quanteRestano() === 0 ? "disabled" : ""}
                  >
                    ${primo ? "Genera un altro codice" : "Genera codice"}
                  </button>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Nuovi impianti</h3>
                  <span class="conta">${appenaArrivate().length}</span>
                </div>
                ${
                  appenaArrivate().length
                    ? `<ul class="righe">
                        ${appenaArrivate()
                          .map(
                            (una) => `
                          <li>
                            <span class="che">
                              <b class="mono">${testo(una.casa.slice(0, 22))}…</b>
                              <span
                                >abbinato ${testo(daQuanto(una.da))}${una.carta?.ha ? ` · Home Assistant ${testo(una.carta.ha)}` : ""}</span
                              >
                            </span>
                            <input
                              type="text"
                              id="nome-${testo(una.casa.slice(5, 13))}"
                              data-nome="${testo(una.casa)}"
                              placeholder="Nome dell'impianto"
                              aria-label="Nome dell'impianto"
                            />
                            <button type="button" class="tasto forte" data-tieni="${testo(una.casa)}"> Salva </button>
                          </li>`,
                          )
                          .join("")}
                      </ul>
                      <p class="nota" style="margin-top: 14px">
                        Il nome lo scrivi tu e resta qui: l'impianto non lo invia e non lo conoscerà mai. È l'unico dato in questo cruscotto che riguarda una persona, e resta sul tuo server perché il contratto con quella persona ce l'hai tu.
                      </p>`
                    : `<div class="vuoto">
                        <span class="battito" aria-hidden="true"></span>
                        Nessun impianto in arrivo. Quando uno userà il codice, comparirà qui.
                      </div>`
                }
              </section>
            </div>

            <div class="colonna">
              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Codici attivi</h3>
                  <span class="conta">${INVITI.length}</span>
                </div>
                <ul class="righe">
                  ${INVITI.map(
                    (uno) => `
                    <li>
                      <span class="che">
                        <b class="mono">${testo(ilCodiceDi(uno) || ilCodiceNascosto(uno))}</b>
                        <span>${uno.per ? `${testo(uno.per)} · ` : ""}generato ${testo(daQuanto(uno.fattoIl))}</span>
                      </span>
                      <span class="pastiglia attenta">
                        scade fra <b data-orologio="${Number(uno.scadeFra)}">—</b>
                      </span>
                      <button type="button" class="tasto male" data-annulla="${testo(uno.id || uno.codice)}"> Revoca </button>
                    </li>`,
                  ).join("")}
                </ul>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    Un codice scaduto non fa danni: semplicemente non è più valido. Se ne generi uno e poi cambi idea, revocalo: finché è attivo, chiunque lo possieda può abbinare <em>un</em> impianto a questo cruscotto.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Il tuo logo</h3></div>
                <p class="minuta">
                  Compare qui in alto al posto del nostro e <b>nell'app dei tuoi clienti</b>: chi ha un problema chiama te, ed è il tuo nome che deve vedere.
                </p>
                <div class="provaMarchio">
                  ${
                    IO.marchio
                      ? `<img class="suoMarchio" src="${ilSuoMarchio()}" alt="Il tuo marchio" />`
                      : `<span class="vuoto" aria-hidden="true">logo</span>`
                  }
                  <div class="azioni">
                    <input
                      type="file"
                      data-scegli-marchio
                      accept="image/png,image/jpeg,image/webp,image/svg+xml"
                      aria-label="Scegli il file del tuo marchio"
                    />
                    ${IO.marchio ? `<button type="button" class="tasto" data-togli-marchio>Rimuovi</button>` : ""}
                  </div>
                </div>
                <p class="minuta" data-esito-marchio hidden></p>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    PNG, JPEG, WEBP o SVG, <b>fino a 128 kB</b>. Meglio quadrato: viene mostrato in un riquadro da trenta punti. Questo file lo scarica il browser di chi abita gli impianti che segui, senza alcuna chiave: caricaci solo il logo.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Come funziona, in breve</h3></div>
                <ul class="controlli">
                  <li class="bene">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il codice è monouso.</b> Appena un impianto lo usa, non vale più per nessun altro: quell'impianto riceve una chiave propria, con cui si presenta da quel momento.
                    </span>
                  </li>
                  <li class="bene">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Si può scollegare da entrambe le parti.</b> Tu con «Rimuovi», e chi abita la casa dalla console dell'add-on, dove legge in chiaro l'ultimo rapporto inviato e ha il tasto per interrompere.
                    </span>
                  </li>
                  <li class="bene">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il cruscotto non entra nell'impianto.</b> Non apre la plancia e non vede entità, stanze né persone: riceve un rapporto di numeri, più i titoli delle plance e i nomi dei soli dispositivi che non rispondono. L'abbinamento lo concede chi abita la casa, e lo revoca con un tasto quando vuole.
                    </span>
                  </li>
                  <li class="bene">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>La manutenzione è un permesso separato.</b> Inviare il rapporto e accettare aggiornamenti sono due permessi, e il secondo è disattivato di serie: chi lo attiva lo fa di proposito. Con la manutenzione attiva, da qui si può avviare un aggiornamento che quell'impianto <em>ha già in attesa</em> e riavviare Home Assistant, e nient'altro: nessuna riga di comando, nessuna configurazione, nessuna lettura di stati. Ogni richiesta finisce nel rapporto di quell'impianto, dove chi abita la casa la rilegge.
                    </span>
                  </li>
                  <li class="bene">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Non passa dal centralino.</b> Il rapporto va dall'impianto a questo cruscotto e basta: su <span class="strada">tramite.gdahome.org</span>, il servizio che fa entrare i telefoni da fuori casa, non transita niente.
                    </span>
                  </li>
                </ul>
              </section>
            </div>
          </div>
        `;
      }

      /* Quanto resta a un codice, scritto come si legge.
       *
       * Erano minuti e secondi soltanto, e andavano bene quando un codice
       * viveva un quarto d'ora. Adesso ne vive ventiquattro di ore, e quel
       * formato scriveva «1439:59»: un numero che per sapere se si fa in tempo
       * ad arrivare dal cliente bisogna dividere per sessanta. Sopra l'ora si
       * scrivono le ore; sotto resta mm:ss, che negli ultimi minuti e'
       * esattamente quello che serve.
       *
       * E' rimasto indietro cosi': il codice e' passato da un quarto d'ora a un
       * giorno (`src/chiavi.js`), e questo orologio non lo sapeva. */
      function quantoResta(secondi) {
        if (secondi <= 0) return "scaduto";
        const due = (quanti) => String(quanti).padStart(2, "0");
        const ore = Math.floor(secondi / 3600);
        const minuti = Math.floor((secondi % 3600) / 60);
        const coda = `${due(minuti)}:${due(secondi % 60)}`;
        return ore ? `${ore}:${coda}` : coda;
      }

      /* Gli orologi delle scadenze. Un codice che scade è la cosa che fa
       * sbagliare una installazione — si fa il codice, si sale in macchina, si
       * arriva e non vale più — quindi quanto gli resta si vede, e si muove. */
      let ticchettio = null;

      function avviaGliOrologi() {
        if (ticchettio) clearInterval(ticchettio);
        const quadranti = [...dove.querySelectorAll("[data-orologio]")];
        if (!quadranti.length) return;
        const partiti = quadranti.map((q) => ({
          q,
          fino: Date.now() + Number(q.dataset.orologio) * 1000,
        }));
        const gira = () => {
          for (const { q, fino } of partiti) {
            q.textContent = quantoResta(Math.max(0, Math.round((fino - Date.now()) / 1000)));
          }
        };
        gira();
        ticchettio = setInterval(gira, 1000);
      }

      /* La chiave: si chiede una volta e resta in questa scheda (vedi dove si
       * legge, in cima). Chi ci tiene dentro — Home Assistant, l'app — la
       * consegna da se', e allora non si chiede proprio.
       *
       * Se una consegna e' arrivata da un'origine che questa pagina non
       * conosce, la si offre qui: un tasto con scritto da dove viene, e la si
       * usa solo se chi guarda lo preme (vedi l'ascolto dei messaggi, in fondo). */
      function chiedimiLaChiave(perché = "") {
        doveNav.innerHTML = "";
        dove.innerHTML = `
          <section class="riquadro tinto" style="max-width: 32rem; margin-inline: auto">
            <div class="capoRiquadro"><h3>La tua chiave</h3></div>
            <p class="nota" style="margin-bottom: 16px">
              ${
                perché
                  ? testo(perché)
                  : "Te l'ha consegnata chi gestisce il cruscotto. Resta in questa scheda finché non la chiudi, e non esce da qui."
              }
            </p>
            <div class="azioni">
              <input type="password" id="la-chiave" placeholder="Chiave" aria-label="La chiave" />
              <button type="button" class="tasto forte" id="entra">Accedi</button>
            </div>
            ${
              offerta
                ? `<p class="nota" style="margin-top: 16px">
                     La pagina che contiene questo cruscotto (<b class="mono">${testo(offerta.origine)}</b>) ti consegna una chiave. Usala solo se quella pagina è la tua: Home Assistant di casa, o l'app.
                   </p>
                   <div class="azioni">
                     <button type="button" class="tasto" id="usa-la-consegnata">Entra con quella chiave</button>
                   </div>`
                : ""
            }
          </section>`;
        dove.querySelector("#usa-la-consegnata")?.addEventListener("click", () => {
          if (!offerta) return;
          /* Si' detto una volta vale per quell'origine, in questo browser:
           * la prossima consegna da li' entra senza chiedere. */
          fidati(offerta.origine);
          const presa = offerta.chiave;
          offerta = null;
          consegnata = presa;
          chiave = presa;
          try {
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          } catch (_niente) {
            /* Vale per questa apertura e basta. */
          }
          void apri();
        });
        const casella = dove.querySelector("#la-chiave");
        const entra = () => {
          chiave = casella.value.trim();
          try {
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          } catch (_niente) {
            /* Vale per questa sessione e basta: meglio di non entrare. */
          }
          void apri();
        };
        dove.querySelector("#entra").onclick = entra;
        casella.onkeydown = (evento) => {
          if (evento.key === "Enter") entra();
        };
        casella.focus();
      }

      /* «La chiave non va bene» e' vero e non serve a niente.
       *
       * Nella scheda dell'add-on ci sono due caselle che vogliono una stringa a
       * caso, e da fuori si somigliano: il codice che abbina una casa, e questa
       * chiave. Scambiarle e' successo alla prima persona che ci ha provato, e
       * quello che si prendeva era una frase che non dice da che parte
       * guardare.
       *
       * I due pero' si distinguono da soli: un codice di abbinamento e' lungo
       * sedici, questa chiave trentadue. Quando il conto torna si dice quale
       * delle due si e' incollata, invece di lasciare cercare. */
      const CODICE_DI_ABBINAMENTO = 16;
      const LUNGA_COSI = 32;

      function perchéNonVaBene() {
        const nuda = String(chiave).replace(/-/g, "").length;
        if (nuda === CODICE_DI_ABBINAMENTO) {
          return "Questo ha la lunghezza di un codice di abbinamento, non della chiave: quello va inserito nell'add-on del cliente, non qui.";
        }
        if (nuda !== LUNGA_COSI) {
          return `Chiave non valida: è lunga ${nuda} caratteri, le chiavi ne hanno ${LUNGA_COSI}.`;
        }
        return "Chiave non valida.";
      }

      async function apri() {
        if (!chiave) {
          chiedimiLaChiave();
          return;
        }
        try {
          await carica();
        } catch (errore) {
          /* La chiave tenuta non apre piu', e la scheda dell'add-on ce ne ha
           * consegnata un'altra: si prova quella prima di chiedere a mano.
           *
           * E' il caso di chi cambia installatore: nel browser resta la chiave
           * di prima, che da quel momento e' morta. Chiedere a mano li'
           * vorrebbe dire chiedere a una persona una cosa che il programma ha
           * gia' in mano. Una volta sola: se non apre nemmeno quella, le
           * chiavi finite sono due e allora la domanda ci sta. */
          /* Congelata: la chiave e' giusta, e chiederne un'altra manderebbe a
           * cercare un guasto che non c'e'. Si mostra il cartello. */
          if (errore instanceof Congelata) {
            disegna();
            return;
          }
          if (errore instanceof ChiaveNoNo && consegnata && consegnata !== chiave) {
            chiave = consegnata;
            try {
              sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
            } catch (_niente) {
              /* Vale per questa apertura e basta. */
            }
            void apri();
            return;
          }
          chiedimiLaChiave(errore instanceof ChiaveNoNo ? perchéNonVaBene() : errore.message);
          return;
        }
        disegna();
      }

      /* Con un biglietto nell'indirizzo la chiave arriva da quello, e la
       * pagina non la chiede: vedi in fondo, `entraColBiglietto`. Il
       * biglietto si toglie dall'indirizzo subito, prima che finisca nella
       * cronologia: vale una volta sola, ma un indirizzo pulito e' un
       * indirizzo che si puo' condividere. */
      const BIGLIETTO = (() => {
        try {
          return new URLSearchParams(location.search).get("biglietto") || "";
        } catch (_niente) {
          return "";
        }
      })();
      if (BIGLIETTO) {
        try {
          history.replaceState(null, "", location.pathname + location.hash);
        } catch (_niente) {
          /* Resta nell'indirizzo: vale comunque una volta sola. */
        }
      } else {
        void apri();
      }

      /* Ogni dieci secondi.
       *
       * Era ogni minuto, e il conto scritto qui sopra diceva: i rapporti
       * arrivano ogni quindici minuti, ricaricare ogni minuto è già quindici
       * volte più spesso di quanto cambi qualcosa. Vero allora. Adesso i
       * rapporti arrivano ogni minuto, e quel conto si è rovesciato: fra una
       * casa che si fa viva e questa pagina che lo mostra potevano passare due
       * minuti.
       *
       * Il momento che decide il numero è l'abbinamento: si manda un codice, e
       * si sta davanti a questa pagina ad aspettare che la casa compaia. Dieci
       * secondi lì sono un'attesa; un minuto è il momento in cui si ricarica a
       * mano, e poi si va a cercare cosa non ha funzionato.
       *
       * Costa sei richieste al minuto **per pagina aperta**, e le pagine aperte
       * sono quante sono le persone che stanno guardando: una, quasi sempre. */
      /* Se si sta scrivendo in una casella — un nome, un indirizzo — il
       * ridisegno aspetta il giro dopo: ricostruire la pagina sotto le dita
       * vorrebbe dire perdere quello che si e' scritto. */
      const staScrivendo = () => {
        const chi = document.activeElement;
        return Boolean(chi && dove.contains(chi) && chi.matches("input, textarea"));
      };

      setInterval(() => {
        if (!chiave) return;
        if (staScrivendo()) return;
        carica()
          .then(() => disegna())
          .catch((errore) => {
            /* Un giro andato male non deve far sparire quello che si sta
             * guardando: si riprova al minuto dopo. Un'utenza congelata invece
             * si', ed e' il punto: chi viene bloccato mentre ha la pagina
             * aperta se ne accorge entro dieci secondi, non alla prossima
             * ricarica. */
            if (errore instanceof Congelata) disegna();
          });
      }, 10 * 1000);

      /* La chiave consegnata da chi ci tiene dentro.
       *
       * Questa pagina si apre in due modi: da sola in un browser, e dentro
       * Home Assistant, in una voce della barra laterale che l'add-on
       * fabbrica. Nel secondo caso il codice l'add-on ce l'ha gia' — e' quello
       * scritto nella sua scheda, ed e' quello che fa esistere la voce — e
       * richiederlo qui vorrebbe dire scriverlo due volte, con la seconda che
       * fa pensare che la prima non abbia funzionato.
       *
       * ─── Da chi si accetta ───────────────────────────────────────────────
       *
       * Solo da chi ci contiene (`parent`) o da chi ci ha aperto (`opener`):
       * un messaggio da un'altra finestra non e' una consegna, qualunque cosa
       * dica.
       *
       * E l'origine conta. Prima non si guardava, col ragionamento che una
       * chiave consegnata vale se e' buona e basta. Ma una pagina qualunque
       * che mettesse questo cruscotto in un riquadro poteva consegnargli **la
       * sua** chiave, buona, e far lavorare chi guarda dentro un cruscotto non
       * suo senza che se ne accorga. Quindi una consegna si prende da sola
       * solo da questa origine, da quelle che chi tiene il quadro ha scritto
       * (`QUADRO_OSPITI`, che il server mette nella pagina) e da quelle a cui
       * chi guarda ha gia' detto di si' in questo browser. Da un'origine
       * nuova — l'indirizzo di un Home Assistant e' diverso in ogni casa — si
       * offre con un tasto, con scritto da dove viene, e si usa solo se lo si
       * preme (`chiedimiLaChiave`).
       *
       * Se una chiave c'e' gia' non si tocca: chi l'ha battuta a mano in
       * questa scheda ha deciso lui, e una consegna che gliela cambia sotto
       * e' un modo di non far entrare piu' nessuno.
       *
       * **Ma si tiene da parte lo stesso.** Qui c'era un guasto, e si vedeva
       * cosi': tolto un installatore e messo un altro, chi apriva questa
       * pagina si sentiva dire «la chiave non va bene» e se la vedeva chiedere
       * a mano — con quella giusta gia' scritta nella scheda dell'add-on, a
       * due centimetri di distanza. Nel browser era rimasta la chiave di
       * prima, quella dell'installatore tolto: non essendo vuota, la consegna
       * veniva scartata; quella morta veniva provata, rifiutata, e la pagina
       * chiedeva aiuto a chi non poteva darne.
       *
       * Adesso la consegna si ricorda sempre, e serve quando quella tenuta
       * viene rifiutata: si prova quella, una volta, prima di disturbare
       * qualcuno. Chi l'ha battuta a mano resta padrone finche' la sua
       * funziona, che e' quello che questa riga voleva dire. */
      const OSPITI_FIDATI = "gdahome.quadro.ospiti";
      const OSPITI_SCRITTI = String(
        document.querySelector('meta[name="gdahome-ospiti"]')?.getAttribute("content") || "",
      )
        .split(/\s+/)
        .filter(Boolean);
      const gliConfermati = () => {
        try {
          const detti = JSON.parse(localStorage.getItem(OSPITI_FIDATI) || "[]");
          return Array.isArray(detti) ? detti.map(String) : [];
        } catch (_niente) {
          return [];
        }
      };
      function fidati(origine) {
        try {
          const detti = gliConfermati().filter((una) => una !== origine);
          localStorage.setItem(OSPITI_FIDATI, JSON.stringify([origine, ...detti].slice(0, 20)));
        } catch (_niente) {
          /* Non si ricorda: la prossima volta si richiede. */
        }
      }
      /* Un'origine scritta come `https://*.dominio` vale per tutti quelli sotto. */
      const combacia = (origine, scritta) =>
        scritta.includes("*.")
          ? origine.startsWith(scritta.slice(0, scritta.indexOf("*"))) &&
            origine.endsWith(scritta.slice(scritta.indexOf("*") + 1))
          : origine === scritta;
      const origineFidata = (origine) =>
        origine === location.origin ||
        OSPITI_SCRITTI.some((scritta) => combacia(origine, scritta)) ||
        gliConfermati().includes(origine);
      const daChiCiTiene = (sorgente) => {
        try {
          if (window.parent && window.parent !== window && sorgente === window.parent) return true;
        } catch (_niente) {}
        try {
          if (window.opener && sorgente === window.opener) return true;
        } catch (_niente) {}
        return false;
      };

      let consegnata = "";
      addEventListener("message", (evento) => {
        const detto = evento?.data;
        if (!detto || detto.gdahome !== "chiave") return;
        if (!daChiCiTiene(evento.source)) return;
        const arrivata = String(detto.chiave || "").trim();
        if (!arrivata) return;
        /* Chi ci tiene **dentro** un riquadro e' la voce dell'add-on in Home
         * Assistant, il cui indirizzo e' diverso in ogni casa: quella chiave
         * si prende. Si offre soltanto quella di una finestra che ci ha
         * aperti da un altro sito. */
        const daDentro = window.parent !== window && evento.source === window.parent;
        if (!daDentro && !origineFidata(String(evento.origin || ""))) {
          /* Da un'origine che non si conosce: si offre, non si prende. */
          if (chiave) return;
          offerta = { chiave: arrivata, origine: String(evento.origin || "") };
          lasciaChiMiHaAperto();
          chiedimiLaChiave();
          return;
        }
        /* Avuta la chiave, chi ci ha aperto non serve piu'. */
        lasciaChiMiHaAperto();
        consegnata = arrivata;
        if (chiave) return;
        chiave = arrivata;
        try {
          sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
        } catch (_niente) {
          /* Vale per questa apertura e basta: meglio di non entrare. */
        }
        void apri();
      });

      /* Il biglietto dall'app (`riquadro/sul_telefono.dart`). Dal telefono il
       * tasto «Apri nel browser» apre un browser che non e' il nostro, e a
       * quella scheda l'app non puo' consegnare niente. La chiave
       * nell'indirizzo non ci va; ci va un biglietto, che il quadro cambia
       * con la chiave una volta sola ed entro un minuto (`biglietti.js`). La
       * chiave che arriva si tratta come una consegnata: se qui ce n'e' gia'
       * una che apre, resta quella, per la stessa ragione di sopra. Un
       * biglietto scaduto — la pagina riaperta dalla cronologia — non e' un
       * errore da mostrare: si chiede la chiave, come sempre. */
      async function entraColBiglietto(biglietto) {
        let arrivata = "";
        try {
          const risposta = await fetch("entra", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ biglietto }),
          });
          const corpo = await risposta.json().catch(() => ({}));
          if (risposta.ok) arrivata = String(corpo.chiave || "").trim();
        } catch (_niente) {
          /* Il quadro non risponde: si chiede come sempre. */
        }
        if (arrivata) {
          consegnata = arrivata;
          if (!chiave) {
            chiave = arrivata;
            try {
              sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
            } catch (_niente) {
              /* Vale per questa apertura e basta: meglio di non entrare. */
            }
          }
        }
        void apri();
      }
      if (BIGLIETTO) void entraColBiglietto(BIGLIETTO);

      /* E se nessuno la consegna, la si chiede.
       *
       * Fin qui la chiave arrivava «a spinta»: chi ospita questa pagina — la
       * tessera in Home Assistant, l'app — cercava il riquadro e gli mandava
       * la chiave, al momento giusto, per qualche colpo. Nell'app web quella
       * spinta non arrivava, e la pagina restava a chiedere la chiave a chi
       * ce l'aveva gia' in mano. Non e' questa pagina che puo' sapere quando
       * chi la ospita e' pronto: allora e' lei a chiedere — a chi la
       * contiene, e a chi l'ha aperta — e chi ha la chiave risponde. La
       * domanda non porta niente, e va a chiunque: la chiave che torna vale
       * se apre, e chi potesse mandarne una buona ce l'avrebbe gia'. Si
       * chiede finche' non arriva, e si smette da soli. */
      /* La finestra che ci ha aperto (l'app, con `window.open`) serve per una
       * cosa sola: consegnare la chiave. Avuta — o smesso di aspettarla — la
       * si lascia andare, cosi' questa pagina non tiene in mano una finestra
       * dell'app per tutto il tempo che resta aperta. */
      function lasciaChiMiHaAperto() {
        try {
          if (window.opener) window.opener = null;
        } catch (_niente) {
          /* Non si lascia toccare: resta com'e'. */
        }
      }

      function chiediLaChiaveAChiMiOspita() {
        if (chiave) {
          lasciaChiMiHaAperto();
          return;
        }
        const ospiti = [];
        try {
          if (window.parent && window.parent !== window) ospiti.push(window.parent);
        } catch (_niente) {}
        try {
          if (window.opener) ospiti.push(window.opener);
        } catch (_niente) {}
        if (!ospiti.length) return;
        const domanda = () => {
          if (chiave) return;
          for (const ospite of ospiti) {
            try {
              ospite.postMessage({ gdahome: "chiave?" }, "*");
            } catch (_niente) {}
          }
        };
        domanda();
        for (const fra of [400, 1200, 3000, 7000]) setTimeout(domanda, fra);
        /* Dopo l'ultima domanda, un po' di margine per la risposta, e poi
         * chi ci ha aperto si lascia andare anche se non ha risposto. */
        setTimeout(lasciaChiMiHaAperto, 10000);
      }
      if (!BIGLIETTO) chiediLaChiaveAChiMiOspita();
    </script>
  </body>
</html>
