    <!-- Le origini da cui si prende una chiave consegnata senza chiedere: le
         scrive il quadro (QUADRO_OSPITI), e vuote vuol dire solo questa. -->
    <meta name="gdahome-ospiti" content="" />
    <title>Cruscotto installatore</title>
    <!--
      IL QUADRO — LA CONSOLE DI CHI INSTALLA.

      Questa pagina è una sola, e sta tutta qui: il server la legge dal disco e
      la serve su `/console/`. Da lì chiede le sue vie in **relativo** — `case`,
      non `/console/case` — così funziona anche dietro un proxy che la monta
      sotto un prefisso. Chi bussa a `/console` senza barra ci viene mandato dal
      server, perché da `/console` un indirizzo relativo porterebbe a `/case`.

      Niente font, niente librerie, nessuna richiesta a nessuno che non sia il
      proprio quadro: la regola delle altre console del progetto vale anche qui.

      QUI NON SI DECIDE NIENTE.

      Lo stato di una casa, i suoi dieci controlli e le pastiglie arrivano già
      decisi da `quadro/src/controlli.js`, dentro `GET case`. Questa pagina li
      disegna e basta. Era nata col contrario — le regole scritte qui, coi dati
      finti accanto — e il giorno che una soglia cambia, cambiarla in due posti
      vuol dire cambiarla in uno solo: due schermi che dicono due cose diverse
      della stessa casa. Anche le tre soglie che colorano i metri (caldo, disco
      pieno, disco finito) viaggiano dal server insieme alle case.

      DA DOVE VENGONO I COLORI E LE FORME.

      Si chiama Aurora, ed è nata qui: un cielo che sfuma dietro tutto, vetro
      smerigliato sopra, angoli larghi, un carattere solo — Manrope, che
      serve questo quadro da `/carattere/` e non Google — e nessuna scritta
      in maiuscolo. Le prime stesure erano parenti della console del
      centralino, poi del sito; questa è di un prodotto che si guarda dal
      telefono in mezzo a un cantiere, e deve leggersi da lontano.

      La schermata delle case ha tre pezzi. In cima **l'anello**: tutti gli
      impianti in un cerchio, colorato in proporzione a come stanno, con
      sotto le tre file che si premono e filtrano. Poi **da guardare
      adesso**: una carta per ogni casa che chiede qualcosa, che scorre di
      lato e si apre mostrando solo quello che non va. In fondo **tutti gli
      impianti**, una mattonella per casa con la linea degli ultimi
      quattordici giorni. Una casa si apre in un foglio che sale dal basso,
      e dentro c'è la stessa scheda di prima, a capitoli.

      UNA COSA MISURATA, CHE HA DECISO IL DISEGNO.

      I tre colori di stato — verde, ambra, rosso — passano la prova del
      daltonismo e del contrasto su questo fondo, chiaro e scuro. Ma un
      colore da solo non basta: ogni stato porta sempre anche la **parola**
      («offline», «da guardare», «a posto») e, dove serve leggere in fretta,
      una forma (● ▲ ■ ◇). Chi non vede i colori legge la pagina lo stesso,
      e chi li vede la legge più in fretta.

      L'azzurro è l'unica cosa che si preme, e sta fuori dai tre colori di
      stato apposta: un colore che vuol dire «guasto» e «premi qui» insieme
      non vuol dire più niente.

      TRE SCHERMATE.

      «Le case» è il cruscotto. «Aggiornamenti» è cosa manca a ognuna, casa
      per casa. «Abbina» è come una casa entra qui dentro, ed è l'altra metà
      del lavoro: senza quella il quadro è un cruscotto senza cruscotto.

    -->

      :root {
        color-scheme: light;

        --ground: #f4f5fa;

        /* I tre stati. Passano la prova del daltonismo e del contrasto su

        --verde: #16a37a;
        --ambra: #d98a0f;
        --rosso: #e4405f;
        --verde-soft: rgba(22, 163, 122, 0.13);
        --ambra-soft: rgba(217, 138, 15, 0.14);

        --ombra: 0 1px 2px rgba(23, 26, 43, 0.04), 0 10px 30px rgba(23, 26, 43, 0.07);
        --ombra-alta: 0 4px 10px rgba(23, 26, 43, 0.06), 0 30px 70px rgba(23, 26, 43, 0.16);

        --r-grande: 26px;

      * {

      body {

        -webkit-tap-highlight-color: transparent;
        font-variant-numeric: tabular-nums;
      }

      /* Mentre il foglio e' su, la pagina sotto non scorre: e' lui che scorre. */
      body.col-foglio {
        overflow: hidden;
      }

      /* Il cielo: tre macchie di luce che sfumano, ferme dietro tutto. */
      .cielo {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(60% 42% at 12% -6%, var(--cielo-a), transparent 70%),
          radial-gradient(52% 40% at 96% 8%, var(--cielo-b), transparent 70%),
          radial-gradient(48% 34% at 60% 108%, var(--cielo-c), transparent 70%);
      }

      .pagina {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin-inline: auto;
        padding: 8px 16px 48px;
      }

      a {
        color: var(--accento);
      }

      :focus-visible {
        outline: 3px solid var(--accento-soft);
        outline-offset: 2px;
        border-radius: 10px;
      }

      /* ─── Il saluto ──────────────────────────────────────────────────── */

      header {
        padding: 6px 0 12px;
      }

      :root[data-dentro] header {
        padding-top: 14px;
      }

      .testata {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 52px;
      }

      /* Dentro Home Assistant, in cima a sinistra galleggia il tasto del
         menu: otto di stacco e quaranta di tasto. Lo spazio glielo si
         lascia, e non solo qui — anche la barra, che quando la pagina scorre
         sta in cima al posto del saluto. `ponte/test/vestito` no, ma
         `il-tasto-del-menu-ha-il-suo-posto` questo numero lo tiene d'occhio. */
      :root[data-dentro] .testata {
        padding-inline-start: 56px;
      }

      .tondo {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        background: linear-gradient(140deg, var(--accento), #8b7cf6);
        color: #fff;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: -0.02em;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 18px rgba(47, 124, 246, 0.35);
        overflow: hidden;
      }

      /* Il marchio dell'installatore, se ne ha messo uno, prende il posto
         delle iniziali. Su bianco: un logo e' disegnato per il bianco. */
      .tondo .suoMarchio {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        padding: 3px;
      }

      .tondo .suoMarchio:not([hidden]) + span {
        display: none;
      }

      .nomi {
        min-width: 0;
        flex: 1;
      }

      .nomi h1,
      .nomi h2 {
        margin: 0;
        font-size: 1.18rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .nomi p {
        margin: 2px 0 0;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .vivo {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-2);
        cursor: pointer;
        white-space: nowrap;
      }

      .vivo i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 0 var(--verde-luce);
        animation: respiro 2.4s ease-out infinite;
      }

      .vivo[aria-busy="true"] i {
        background: var(--accento);
        animation: none;
      }

      @keyframes respiro {
        0% {
          box-shadow: 0 0 0 0 var(--verde-luce);
        }
        70% {
          box-shadow: 0 0 0 8px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      /* ─── La barra: sta in cima, e ci resta mentre scorri ─────────────── */

      .barra {
        position: sticky;
        /* Zero, e non `env(safe-area-inset-top)`: dentro l'app quel valore
           e' gia' speso dal riquadro che ci contiene, e contarlo due volte
           lasciava una fascia vuota sopra la barra. */
        top: 0;
        z-index: 40;
        display: flex;
        gap: 4px;
        padding: 5px;
        margin: 0 0 14px;
        border-radius: 999px;
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        backdrop-filter: blur(28px) saturate(1.6);
        -webkit-backdrop-filter: blur(28px) saturate(1.6);
      }

      .barra:empty {
        display: none;
      }

      /* Quello che scorre sotto la barra non deve leggersi attraverso: un
         velo del colore del fondo, prima del vetro. */
      .barra::before {
        content: "";
        position: absolute;
        inset: -8px -16px -16px;
        z-index: -1;
        background: linear-gradient(180deg, var(--ground) 0 calc(100% - 16px), transparent);
        pointer-events: none;
      }

      :root[data-dentro] .barra {
        margin-inline-start: 56px;
      }

      :root[data-dentro] .barra::before {
        left: -72px;
      }

      .barra button {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-weight: 700;
        font-size: 0.86rem;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        transition:
          color 0.2s,
          background 0.25s;
      }

      .barra button svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .barra button[aria-pressed="true"] {
        color: var(--accento);
        background: var(--accento-soft);
      }

      .barra .quanti {
        min-width: 18px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--ambra-soft);
        color: var(--ink);
        font-size: 0.7rem;
        font-weight: 800;
      }

      /* ─── Il vetro ───────────────────────────────────────────────────── */

      .vetro {
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        backdrop-filter: blur(22px) saturate(1.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
      }

      /* Il riquadro e' il vetro con dentro un capitolo della scheda. Senza
         sfocatura: ce ne sono venti in un foglio, e venti sfocature sul
         telefono si sentono. Il fondo quasi pieno rende uguale. */
      .riquadro {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        padding: 18px 18px 16px;
        margin: 0 0 12px;
      }

      .riquadro.tinto {
        background: var(--vetro-pieno);
        border-color: var(--accento-soft);
        box-shadow:
          0 0 0 1px var(--accento-soft),
          var(--ombra);
      }

      .capoRiquadro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 12px;
      }

      .capoRiquadro h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .capoRiquadro .conta {
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }

      .voce {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 26px 2px 12px;
      }

      .voce h2,
      .capitolo h2 {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .voce span,
      .capitolo span {
        font-size: 0.82rem;
        color: var(--ink-3);
        font-weight: 600;
      }

      /* I capitoli della scheda: cosa mi tocca, come sta, cos'e' di preciso. */
      .capitolo {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 2px 12px;
        margin: 24px 4px 10px;
      }

      .titolone {
        margin: 6px 2px 4px;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      .sottotitolo {
        margin: 0 2px 18px;
        color: var(--ink-2);
        max-width: 62ch;
        line-height: 1.55;
      }

      .nota {
        margin: 0;
        color: var(--ink-2);
        font-size: 0.88rem;
        line-height: 1.55;
      }

      .minuta {
        margin: 0 0 12px;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.86em;
        letter-spacing: 0.01em;
      }

      .comeUnLink {
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        font-weight: 700;
        color: var(--accento);
        cursor: pointer;
        text-align: left;
      }

      /* ─── Le pastiglie: una parola, un colore, una forma ─────────────── */

      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--linea);
        color: var(--ink-2);
        font-size: 0.76rem;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        vertical-align: middle;
      }

      .pastiglia.bene,
      .pastiglia.posto {
        background: var(--verde-soft);
        color: var(--verde);
      }

      .pastiglia.attenta,
      .pastiglia.guardare,
      .pastiglia.lavoro {
        background: var(--ambra-soft);
        color: var(--ambra);
      }

      .pastiglia.male,
      .pastiglia.offline {
        background: var(--rosso-soft);
        color: var(--rosso);
      }

      .pastiglia b {
        font-weight: 800;
      }

      /* ─── I tasti ────────────────────────────────────────────────────── */

      .tasto {
        font: inherit;
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--ink);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea-forte);
        border-radius: 999px;
        padding: 9px 16px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          transform 0.2s var(--molla),
          background 0.2s,
          box-shadow 0.2s;
      }

      .tasto:hover {
        box-shadow: var(--ombra);
      }

      .tasto:active {
        transform: scale(0.97);
      }

      .tasto.forte {
        background: linear-gradient(140deg, var(--accento), #6f8cff);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 20px rgba(47, 124, 246, 0.32);
      }

      .tasto.male {
        color: var(--rosso);
        border-color: transparent;
        background: var(--rosso-soft);
      }

      .tasto[data-sicuro="sì"] {
        background: var(--rosso);
        border-color: transparent;
        color: #fff;
      }

      .tasto.grande {
        padding: 12px 22px;
        font-size: 0.95rem;
      }

      .tasto.copia {
        flex: none;
      }

      .tasto:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
      }

      .azioni {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }

      .azioni .nota {
        flex-basis: 100%;
      }

      /* ─── L'editor della plancia ───────────────────────────────────────
         La pagina vera della plancia, servita dal quadro, in un riquadro
         sopra tutta la pagina: sta fuori da `#dove`, che si ridisegna a ogni
         rapporto. Sopra il foglio (51) e sotto l'avviso (60), che deve
         leggersi anche qui sopra. */
      .editor-plancia {
        position: fixed;
        inset: 0;
        z-index: 55;
        display: flex;
        flex-direction: column;
        background: #e8edf3;
      }
      .editor-plancia[hidden] {
        display: none;
      }
      .editor-testa {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
        border-bottom: 1px solid var(--linea);
        background: var(--vetro-pieno);
      }
      .editor-testa .nomi {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .editor-testa b {
        font-size: 1rem;
        overflow-wrap: anywhere;
      }
      .editor-testa span {
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 600;
      }
      .editor-stato,
      .editor-lavoro {
        margin: 0;
        padding: 8px 16px;
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--ink-2);
        background: var(--vetro-pieno);
        border-bottom: 1px solid var(--linea);
      }
      .editor-stato.guaio {
        color: var(--rosso);
      }
      .editor-plancia iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #e8edf3;
      }
      /* Con l'editor aperto la pagina sotto non scorre: e' lui a scorrere. */
      body.con-editor {
        overflow: hidden;
      }

      input[type="text"],
      input[type="url"],
      input[type="password"] {
        font: inherit;
        color: var(--ink);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea-forte);
        border-radius: 14px;
        padding: 10px 14px;
        min-width: 0;
        flex: 1 1 14rem;
      }

      input[type="text"]:focus,
      input[type="url"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--accento);
        box-shadow: 0 0 0 3px var(--accento-soft);
      }

      input[type="file"] {
        font: inherit;
        font-size: 0.86rem;
        color: var(--ink-2);
        max-width: 100%;
      }

      /* ─── L'anello: la flotta in un colpo d'occhio ───────────────────── */

      .anello-scheda {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 22px;
        align-items: center;
        padding: 20px 20px 18px;
        border-radius: var(--r-grande);
      }

      .anello {
        width: 138px;
        height: 138px;
        position: relative;
        display: grid;
        place-items: center;
      }

      .anello svg,
      .anellino svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .anello circle,
      .anellino circle {
        fill: none;
        stroke-linecap: butt;
      }

      .anello circle {
        stroke-width: 11;
      }

      .anellino circle {
        stroke-width: 7;
        stroke-linecap: round;
      }

      .traccia {
        stroke: var(--linea);
      }

      /* Il colore di un arco sta nel suo attributo `stroke`, scritto da chi
         lo disegna: una regola `stroke` qui lo batterebbe, e tutti gli archi
         verrebbero dello stesso colore. Qui c'e' solo come si apre. */
      .arco {
        transition: stroke-dasharray 0.9s var(--molla);
      }

      .anello .dentro {
        text-align: center;
        line-height: 1;
      }

      .anello .dentro b {
        display: block;
        font-size: 2.35rem;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .anello .dentro span {
        display: block;
        margin-top: 5px;
        font-size: 0.78rem;
        color: var(--ink-2);
        font-weight: 600;
      }

      .titolo-flotta {
        margin: 0;
        font-size: 1.28rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.2;
        text-wrap: balance;
      }

      .titolo-flotta em {
        font-style: normal;
        color: var(--accento);
      }

      .sotto-flotta {
        margin: 4px 0 0;
        color: var(--ink-2);
        font-size: 0.9rem;
      }

      /* Le tre file: pallino, numero, parola. Si premono, e filtrano. */
      .file {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .fila {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        padding: 11px 12px 10px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.25s var(--molla),
          box-shadow 0.25s,
          background 0.25s;
      }

      .fila:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra);
      }

      .fila[aria-pressed="true"] {
        background: var(--vetro-pieno);
        box-shadow:
          0 0 0 2px var(--tinta),
          var(--ombra);
      }

      .fila i {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 50%;
        background: var(--tinta);
        box-shadow: 0 0 0 3px var(--tinta-soft);
      }

      .fila b {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .fila span {
        display: block;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--ink-2);
        line-height: 1.15;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fila span i {
        display: inline-block;
        vertical-align: middle;
        margin: -2px 6px 0 0;
      }

      /* Il colore di uno stato, per chi lo porta: la fila, la carta, la
         mattonella, la spia. Tre nomi che sono quelli del server. */
      [data-stato="offline"] {
        --tinta: var(--rosso);
        --tinta-soft: var(--rosso-soft);
        --tinta-luce: var(--rosso-luce);
      }
      [data-stato="guardare"] {
        --tinta: var(--ambra);
        --tinta-soft: var(--ambra-soft);
        --tinta-luce: var(--ambra-luce);
      }
      [data-stato="posto"] {
        --tinta: var(--verde);
        --tinta-soft: var(--verde-soft);
        --tinta-luce: var(--verde-luce);
      }
      [data-stato="tutte"] {
        --tinta: var(--accento);
        --tinta-soft: var(--accento-soft);
        --tinta-luce: var(--accento-soft);
      }

      /* ─── Da guardare adesso: le carte che scorrono di lato ──────────── */

      .scorri {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 16px 18px;
        margin: 0 -16px;
        scrollbar-width: none;
      }

      .scorri::-webkit-scrollbar {
        display: none;
      }

      .carta {
        flex: 0 0 min(78vw, 300px);
        scroll-snap-align: start;
        position: relative;
        overflow: hidden;
        padding: 18px 18px 16px;
        border-radius: var(--r-grande);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 196px;
        transition:
          transform 0.3s var(--molla),
          box-shadow 0.3s;
      }

      .carta:hover {
        transform: translateY(-3px);
        box-shadow: var(--ombra-alta);
      }

      /* La luce: una macchia morbida del colore dello stato, in alto a destra. */
      .carta::before {
        content: "";
        position: absolute;
        top: -70px;
        right: -60px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--tinta-luce), transparent 65%);
        pointer-events: none;
      }

      .carta .stato,
      .mattonella .riga {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        align-self: flex-start;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--ink);
      }

      .carta .stato {
        padding: 5px 11px 5px 9px;
        border-radius: 999px;
        background: var(--tinta-soft);
      }

      .carta .stato i,
      .mattonella .riga i {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--tinta);
      }

      .carta h3 {
        position: relative;
        margin: 2px 0 0;
        font-size: 1.22rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .carta h3 small {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-3);
      }

      .carta .perche {
        position: relative;
        margin: 0;
        color: var(--ink-2);
        font-size: 0.92rem;
        line-height: 1.45;
        flex: 1;
      }

      .carta .piede {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
        font-size: 0.8rem;
        color: var(--ink-3);
      }

      .carta .piede b {
        color: var(--accento);
        font-weight: 700;
      }

      /* ─── Tutti gli impianti: le mattonelle ──────────────────────────── */

      .mattonelle {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .mattonella {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        padding: 14px 14px 12px;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          transform 0.3s var(--molla),
          box-shadow 0.3s;
      }

      .mattonella:hover {
        transform: translateY(-2px);
        box-shadow: var(--ombra-alta);
      }

      .mattonella[aria-current="true"] {
        box-shadow:
          0 0 0 2px var(--accento),
          var(--ombra);
      }

      .mattonella .nome {
        font-size: 0.98rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.22;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
        min-height: 2.44em;
      }

      .mattonella .nome small {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-3);
      }

      .mattonella .riga {
        color: var(--ink-2);
        font-weight: 600;
        white-space: nowrap;
      }

      .mattonella .riga i {
        box-shadow: 0 0 0 3px var(--tinta-soft);
        transition: box-shadow 0.4s;
      }

      /* Un rapporto appena arrivato: il pallino batte una volta. */
      .mattonella.arrivato .riga i {
        animation: battito 1.2s ease-out;
      }

      @keyframes battito {
        0% {
          box-shadow: 0 0 0 3px var(--tinta-soft);
        }
        40% {
          box-shadow: 0 0 0 9px transparent;
        }
        100% {
          box-shadow: 0 0 0 3px var(--tinta-soft);
        }
      }

      .mattonella .quando {
        display: block;
        margin-top: -4px;
        font-size: 0.75rem;
        color: var(--ink-3);
        font-weight: 500;
      }

      .linea {
        position: relative;
        display: block;
        width: 100%;
        height: 34px;
      }

      .linea-viva {
        width: 100%;
        height: 100%;
        display: block;
      }

      .linea .punto {
        position: absolute;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: var(--tinta);
        border: 2px solid var(--vetro-pieno);
        box-sizing: border-box;
      }

      .vuoto {
        padding: 34px 18px;
        text-align: center;
        color: var(--ink-2);
        border-radius: var(--r-grande);
        line-height: 1.5;
      }

      .vuoto b {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 4px;
      }

      /* ─── Il foglio che sale: la scheda di una casa ──────────────────── */

      .velo {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(14, 17, 32, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 0.3s;
      }

      .velo.su {
        opacity: 1;
      }

      .foglio {
        position: fixed;
        z-index: 51;
        left: 50%;
        bottom: 0;
        width: min(100%, 680px);
        max-height: 92vh;
        max-height: 92dvh;
        display: flex;
        flex-direction: column;
        background: var(--ground);
        border: 1px solid var(--vetro-bordo);
        border-bottom: 0;
        border-radius: 28px 28px 0 0;
        box-shadow: var(--ombra-alta);
        transform: translate(-50%, 104%);
        transition: transform 0.42s var(--molla);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .foglio.su {
        transform: translate(-50%, 0);
      }

      .presa {
        padding: 10px 0 2px;
        display: grid;
        place-items: center;
        flex: none;
      }

      .presa i {
        width: 40px;
        height: 5px;
        border-radius: 999px;
        background: var(--linea-forte);
      }

      .foglio-testa {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px 12px;
        flex: none;
      }

      .foglio-testa h2 {
        font-size: 1.3rem;
      }

      .foglio-corpo {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 16px 24px;
        -webkit-overflow-scrolling: touch;
      }

      .foglio-tasti {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--linea);
        flex: none;
      }

      .foglio-tasti:empty {
        display: none;
      }

      /* Quello che non va, e basta: e' la prima cosa che si vede aprendo
         una casa da «Da guardare adesso». */
      .guai {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .guai li {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--ambra-soft);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .guai li[data-grave="true"] {
        background: var(--rosso-soft);
      }

      .guai li i {
        width: 9px;
        height: 9px;
        flex: none;
        margin-top: 0.42em;
        border-radius: 50%;
        background: var(--ambra);
      }

      .guai li[data-grave="true"] i {
        background: var(--rosso);
      }

      .guai b {
        font-weight: 800;
      }

      .tre-anelli {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 0 0 6px;
      }

      .anellino {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        padding: 12px 8px 10px;
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .anellino .cerchio {
        width: 64px;
        height: 64px;
        position: relative;
        display: grid;
        place-items: center;
      }

      .anellino b {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .anellino .cerchio b.attenta {
        color: var(--ambra);
      }

      .anellino .cerchio b.male {
        color: var(--rosso);
      }

      .anellino span {
        font-size: 0.76rem;
        color: var(--ink-2);
        font-weight: 600;
        line-height: 1.2;
      }

      .anellino small {
        font-size: 0.72rem;
        color: var(--ink-3);
        line-height: 1.2;
      }

      .nonLoDice {
        color: var(--ink-3);
        font-weight: 600;
        font-size: 0.8rem;
      }

      /* ─── Dentro la scheda ───────────────────────────────────────────── */

      .perché {
        margin: 0 0 12px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--ink);
        font-weight: 600;
      }

      .targa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px 14px;
        margin: 0;
      }

      .targa div {
        min-width: 0;
      }

      .targa dt {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--ink-3);
        margin: 0 0 2px;
      }

      .targa dd {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .rinomina {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .rinomina[hidden] {
        display: none;
      }

      /* ─── Le plance: i due nomi di ognuna ────────────────────────────── */

      .veste {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 10px 12px;
        align-items: end;
        padding: 14px 0 4px;
      }

      .veste + .veste {
        margin-top: 8px;
        border-top: 1px solid var(--linea);
      }

      .veste-capo {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
      }

      .veste-capo b {
        font-size: 0.95rem;
        overflow-wrap: anywhere;
      }

      .veste-capo small {
        font-size: 0.78rem;
        color: var(--ink-3);
        font-weight: 600;
      }

      .veste label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .veste label span {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--ink-3);
      }

      .veste input {
        width: 100%;
        flex: none;
      }

      .veste-tasti {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* La riga da cui se ne aggiunge una: staccata da quelle che ci sono. */
      .veste.aggiunta {
        margin-top: 8px;
        border-top: 1px dashed var(--linea-forte);
      }

      /* Il logo, in cima al capitolo: la stessa prova della pagina
         Abbinamento, distesa su tutta la riga. */
      .veste.marchio {
        padding-top: 4px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--linea);
        margin-bottom: 4px;
      }

      .veste.marchio .provaMarchio,
      .veste.marchio .minuta {
        grid-column: 1 / -1;
      }

      .veste.marchio .minuta {
        margin: 0;
      }

      .veste input:disabled,
      .veste .tasto:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      @media (max-width: 40rem) {
        .veste {
          grid-template-columns: 1fr;
        }
      }

      /* La riga che dice cosa questo quadro puo' e non puo' fare. */
      .limite,
      .avvertenza,
      .cartello {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin: 14px 0 0;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--accento-soft);
        font-size: 0.86rem;
        line-height: 1.5;
        color: var(--ink-2);
      }

      .limite b,
      .avvertenza b,
      .cartello b {
        color: var(--ink);
      }

      .cartello {
        margin: 0 0 14px;
      }

      .cartello.bene {
        background: var(--verde-soft);
      }

      .cartello.male {
        background: var(--rosso-soft);
      }

      .gettone {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--vetro-pieno);
        color: var(--accento);
        font-weight: 800;
        font-size: 0.8rem;
      }

      .cartello.bene .gettone {
        color: var(--verde);
      }

      .cartello.male .gettone {
        color: var(--rosso);
      }

      /* I dieci controlli: la spunta, il nome, come va. */
      .controlli {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .controlli li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 2px;
        border-top: 1px solid var(--linea);
        font-size: 0.93rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .controlli li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .bollino {
        width: 26px;
        height: 26px;
        flex: none;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 0.75rem;
        font-weight: 800;
        background: var(--linea);
        color: var(--ink-3);
      }

      .controlli li.bene .bollino {
        background: var(--verde-soft);
        color: var(--verde);

      .controlli li.male .bollino {

        color: var(--rosso);
      }

      .controlli li.ignoto {
        color: var(--ink-2);
      }

      .controlli .cosa {
        flex: 1;
        min-width: 0;
      }

      .controlli .cosa b {
        font-weight: 800;
      }

      /* «— a posto» lo sente chi legge con le orecchie; per gli occhi c'e'
         gia' la spunta colorata. */
      .controlli .via {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .controlli .dettaglio {
        margin-left: auto;
        text-align: right;
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 500;
        max-width: 50%;
      }

      /* Le righe degli aggiornamenti: il segno, cosa e', cosa si fa. */
      .versi {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .versi li {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 11px 0;
        border-top: 1px solid var(--linea);
      }

      .versi li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .segno,
      .bollo {
        position: relative;
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.95rem;
        background: var(--accento-soft);
        color: var(--accento);
        overflow: hidden;
      }

      .segno img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 6px;
        background: #fff;
      }

      /* Il bollo di gdahome: tre barrette, disegnate qui e mai scaricate. */
      .bollo {
        background: linear-gradient(140deg, var(--accento), #8b7cf6);
        gap: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bollo i {
        display: block;
        width: 4px;
        height: 16px;
        border-radius: 2px;
        background: #fff;
      }

      .bollo i.mezzo {
        height: 10px;
      }

      .versi .che {
        flex: 1;
        min-width: 8rem;
      }

      .versi .che b {
        display: block;
        font-weight: 800;
        font-size: 0.95rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .versi .salto {
        font-size: 0.8rem;
        color: var(--ink-2);
      }

      .versi .fare {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .versi .cambia {
        flex-basis: 100%;
        margin: 0;
        color: var(--ink-2);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .versi .cambia .comeUnLink {
        font-size: 0.86rem;
      }

      /* ─── Le note di una versione, disegnate ─────────────────────────── */

      .leNote {
        flex-basis: 100%;
        margin: 4px 0 0;
        padding: 12px 14px 4px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        color: var(--ink-2);
        font-size: 0.92rem;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .leNote[hidden] {
        display: none;
      }

      .leNote > :first-child {
        margin-top: 0;
      }

      .leNote p {
        margin: 0 0 12px;
      }

      .leNote h3,
      .leNote h4,
      .leNote h5 {
        margin: 18px 0 8px;
        color: var(--ink);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .leNote h3 {
        font-size: 1.1rem;
      }

      .leNote h4 {
        font-size: 1rem;
      }

      .leNote h5 {
        font-size: 0.92rem;
      }

      .leNote strong {
        color: var(--ink);
        font-weight: 800;
      }

      .leNote ul {
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }

      .leNote li {
        position: relative;
        margin: 0 0 7px;
        padding-left: 18px;
      }

      .leNote li::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 0.65em;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accento);
      }

      .leNote li.r1 {
        margin-left: 18px;
      }

      .leNote li.r2 {
        margin-left: 36px;
      }

      .leNote li.r3 {
        margin-left: 54px;
      }

      .leNote hr {
        margin: 16px 0;
        border: 0;
        border-top: 1px solid var(--linea);
      }

      .leNote code {
        font-family: var(--mono);
        font-size: 0.86em;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accento-soft);
        color: var(--ink);
      }

      .leNote pre {
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea);
        overflow-x: auto;
      }

      .leNote pre code {
        padding: 0;
        background: none;
        white-space: pre;
      }

      .leNote a {
        color: var(--accento);
        font-weight: 700;
      }

      .verdetto {
        margin: 14px 0 0;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      .verdetto b {
        color: var(--ink);
      }

      /* La rete: le schede della macchina. */
      .schede {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .schede li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 9px 0;
        border-top: 1px solid var(--linea);
        font-size: 0.9rem;
      }

      .schede li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .lucina {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 3px var(--verde-soft);
        flex: none;
      }

      .schede li.giu .lucina {
        background: var(--ink-3);
        box-shadow: 0 0 0 3px var(--linea);
      }

      .schede .come {
        font-weight: 700;
      }

      .schede .tipo {
        font-weight: 700;
      }

      .schede li.giu .come {
        color: var(--ink-3);
      }

      .schede .dove {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-3);
      }

      /* Gli add-on: un pallino, il nome, e se dovrebbe girare. */
      .addon {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .addon .uno {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 11px 6px 9px;
        border-radius: 999px;
        background: var(--verde-soft);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .addon .uno.fermo {
        background: var(--rosso-soft);
      }

      .addon .uno.apposta {
        background: var(--linea);
        color: var(--ink-2);
      }

      .puntino {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--verde);
      }

      .uno.fermo .puntino {
        background: var(--rosso);
      }

      .uno.apposta .puntino {
        background: var(--ink-3);
      }

      /* Quattordici giorni, una cella al giorno. */
      .giorni {
        display: grid;
        grid-template-columns: repeat(14, 1fr);
        gap: 4px;
        margin: 4px 0 6px;
      }

      .giorni i {
        display: block;
        height: 22px;
        border-radius: 6px;
        background: var(--verde);
        opacity: 0.85;
      }

      .giorni.grande i {
        height: 30px;
      }

      .giorni i.mezza {
        background: var(--ambra);
      }

      .giorni i.vuota {
        background: var(--rosso);
      }

      .giorni i.prima {
        background: var(--linea);
        opacity: 1;
      }

      .giorniDice {
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .misure {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 0;
      }

      .misure div {
        padding: 10px 12px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        min-width: 0;
      }

      .misure dt {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--ink-3);
      }

      .misure dd {
        margin: 2px 0 0;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .misure dd.attenta {
        color: var(--ambra);
      }

      .misure dd.male {
        color: var(--rosso);
      }

      .misure dd small {
        display: block;
        margin-top: 3px;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0;
      }

      .nomiGiu,
      .giu {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 12px;
      }

      .nomiGiu span,
      .giu span {
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--rosso-soft);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .nomiGiu .eAltri {
        background: var(--linea);
        color: var(--ink-2);
      }

      .versioni {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .versioni td {
        padding: 8px 0;
        border-top: 1px solid var(--linea);
        vertical-align: middle;
      }

      .versioni tr:first-child td {
        border-top: 0;
        padding-top: 2px;
      }

      .versioni .numero {
        text-align: right;
        font-family: var(--mono);
        font-weight: 600;
        font-size: 0.86rem;
      }

      .rapporto summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .rapporto summary::-webkit-details-marker {
        display: none;
      }

      .rapporto summary::before {
        content: "›";
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 8px;
        background: var(--accento-soft);
        color: var(--accento);
        font-weight: 800;
        transition: transform 0.2s;
      }

      .rapporto[open] summary::before {
        transform: rotate(90deg);
      }

      .rapporto summary h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .rapporto pre {
        margin: 12px 0 0;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        font-family: var(--mono);
        font-size: 0.78rem;
        line-height: 1.5;
        overflow-x: auto;
        max-height: 24rem;
      }

      /* ─── Gli aggiornamenti, casa per casa ───────────────────────────── */

      .mucchio .capoRiquadro h3 .comeUnLink {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--ink);
      }

      .mucchio .capoRiquadro h3 .comeUnLink:hover {
        color: var(--accento);
      }

      /* ─── Abbina ─────────────────────────────────────────────────────── */

      .abbina {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }

      .colonna {
        min-width: 0;
      }

      .codice {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 4px;
        padding: 16px 18px;
        border-radius: var(--r);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea);
      }

      .cifre {
        flex: 1;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }

      .scadenza {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 600;
      }

      .battito {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 0 var(--verde-luce);
        animation: respiro 2.4s ease-out infinite;
      }

      .passi {
        margin: 0;
        padding: 0 0 0 1.6em;
        color: var(--ink-2);
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .passi li {
        margin-bottom: 8px;
        padding-left: 4px;
      }

      .passi li::marker {
        font-weight: 800;
        color: var(--accento);
      }

      .strada {
        font-weight: 700;
        color: var(--ink);
      }

      .righe {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .righe li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--linea);
      }

      .righe li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .righe .che {
        flex: 1;
        min-width: 10rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .righe .che b {
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .righe .che span {
        font-size: 0.82rem;
        color: var(--ink-2);
      }

      .provaMarchio {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
      }

      .provaMarchio .suoMarchio {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        object-fit: contain;
        background: #fff;
        border: 1px solid var(--linea);
        padding: 4px;
      }

      .provaMarchio .vuoto {
        width: 56px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 16px;
        border: 1px dashed var(--linea-forte);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .provaMarchio .azioni {
        margin-top: 0;
        flex: 1;
      }

      /* ─── L'avviso in basso ──────────────────────────────────────────── */

      .avviso {
        position: fixed;
        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 30px);
        z-index: 60;
        padding: 11px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--ground);
        font-weight: 700;
        font-size: 0.86rem;
        box-shadow: var(--ombra-alta);
        opacity: 0;
        transition:
          transform 0.35s var(--molla),
          opacity 0.25s;
        max-width: calc(100vw - 32px);
        text-align: center;
        pointer-events: none;
      }

      .avviso.su {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      footer {
        margin: 30px 2px 0;
        color: var(--ink-3);
        font-size: 0.8rem;
        line-height: 1.6;
        max-width: 60ch;
      }

      /* ─── Sullo schermo grande ───────────────────────────────────────── */

      @media (min-width: 46rem) {
        .mattonelle {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .anello {
          width: 160px;
          height: 160px;
        }
        .titolo-flotta {
          font-size: 1.5rem;
        }
        .abbina {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: start;
        }
        .targa {
          grid-template-columns: repeat(4, minmax(140px, 1fr));
        }
        .misure {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 64rem) {
        .mattonelle {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .scorri {
          margin: 0;
          padding: 4px 2px 18px;
        }
        .carta {
          flex-basis: 300px;
        }
      }

      @media (max-width: 30rem) {
        .barra button {
          padding: 10px 6px;
          font-size: 0.83rem;
          gap: 5px;
        }
        .barra button svg {
          display: none;
        }
        /* «da verificare» non ci sta su una riga: va a capo, non si tronca. */
        .fila span {
          white-space: normal;
        }
        .tre-anelli {
          gap: 6px;
        }
        .anellino {
          padding: 10px 4px 8px;
        }
        .controlli .dettaglio {
          max-width: 42%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

  <body>
    <div class="cielo" aria-hidden="true"></div>

    <div class="pagina">
      <header>
        <!-- Il saluto: chi sei, quanti impianti hai, e il pallino che dice
             che la pagina si tiene aggiornata da sola. Il tondo porta le
             iniziali, o il marchio dell'installatore se ne ha messo uno:
             lo riempie `disegna()`, perche' dipende da chi ha aperto la
             pagina e questo file e' lo stesso per tutti. -->
        <div class="testata">
          <div class="tondo" id="tondo" aria-hidden="true">
            <img class="suoMarchio" id="suo-marchio" alt="" hidden />
            <span id="sigla">gd</span>
          </div>
          <div class="nomi">
            <h1 id="come-si-chiama">Cruscotto installatore</h1>
            <p id="chi"></p>
          </div>
          <button
            type="button"
            class="vivo"
            id="vivo"
            title="Si aggiorna da sola. Premi per aggiornare adesso."
          >
            <i></i><span id="vivo-dice">Aggiorna</span>
          </button>
        </div>
      </header>

      <!-- La barra sta in cima e ci resta mentre scorri. Fuori dalla testata
           apposta: `position: sticky` vive dentro il suo genitore, e dentro
           la testata smetterebbe di attaccarsi appena la testata e' passata. -->
      <nav id="nav" class="barra" aria-label="Le schermate"></nav>

      <main id="dove"></main>

      <!-- L'editor della plancia: la pagina vera, in un riquadro sopra tutto.
           Sta fuori da «dove», che si ridisegna a ogni rapporto. -->
      <div id="editor-plancia" class="editor-plancia" hidden>
        <div class="editor-testa">
          <div class="nomi">
            <b id="editor-titolo"></b>
            <span id="editor-sotto"></span>
          </div>
          <button type="button" class="tasto" id="chiudi-editor">Chiudi</button>
        </div>
        <p class="editor-stato" id="editor-stato" hidden></p>
        <p class="editor-lavoro" id="editor-lavoro" hidden></p>
        <iframe
          id="editor-riquadro"
          title="La configurazione della plancia"
          src="about:blank"
        ></iframe>
      </div>

      <footer>
        Da qui non si entra in nessuna casa e non si vede niente di chi ci abita: si guardano i
        numeri che ogni impianto invia da sé. I nomi che viaggiano sono solo quelli dei dispositivi
        che non rispondono.
      </footer>
    </div>

    <div class="avviso" id="avviso" role="status" aria-live="polite"></div>

    <script>
      /* ───────────────────────────────────────────────────────────────────
       * DA DOVE ARRIVA QUELLO CHE SI VEDE.
       *
       * Da `/console/case` e `/console/inviti`, e **gia' deciso**: lo stato di
       * una casa, i suoi controlli e le sue pastiglie li calcola il server
       * (`src/controlli.js`). Qui dentro non c'e' nessuna regola, ed e' voluto:
       * se le regole stessero in tutt'e due i posti, il giorno che una cambia
       * ne cambierebbe una sola, e due schermi direbbero due cose diverse
       * della stessa casa.
       *
       * Questa pagina disegna. Non decide.
       *
       * ─── La chiave ─────────────────────────────────────────────────────
       *
       * Resta nel browser e non nella pagina: chi guarda questo quadro lo apre
       * tutti i giorni, e ribattere una chiave lunga tutti i giorni finisce con
       * una chiave corta. Un tasto la butta via.
       * ─────────────────────────────────────────────────────────────────── */
      /* Se questa pagina sta dentro un riquadro di Home Assistant.
       *
       * Si guarda e basta: `window.top` di un'altra origine non si puo'
       * leggere, e il confronto solleva — in quel caso la risposta e' comunque
       * «si'», perche' un'origine diversa vuol dire proprio che qualcun altro
       * ci ha messo dentro. Serve a una cosa sola: lasciare in cima lo spazio
       * per il tasto del menu, che sta in quell'altro documento. */
      try {
        if (window.self !== window.top) document.documentElement.dataset.dentro = "sì";
      } catch (_altroDominio) {
        document.documentElement.dataset.dentro = "sì";
      }

      /* Le immagini che non arrivano, tolte: un ascolto solo per tutta la
       * pagina, in cattura perche' l'errore di un'immagine non sale. */
      document.addEventListener(
        "error",
        (evento) => {
          const chi = evento.target;
          if (chi instanceof HTMLImageElement && chi.dataset.seNonArriva === "via") chi.remove();
        },
        true,
      );

      const DOVE_STA_LA_CHIAVE = "gdahome.quadro.chiave";

      /* La chiave si tiene nel deposito **di questa scheda**, non del
       * browser: chiusa la scheda, se ne va.
       *
       * Stava nel deposito del browser, per sempre, e da li' la leggeva
       * qualunque pagina servita da questa stessa origine — compresa quella
       * dell'editor della plancia, che e' codice di un altro progetto. Il
       * prezzo, detto: aprendo una scheda nuova la chiave si ribatte, o la
       * consegna chi ci tiene dentro (la tessera in Home Assistant, l'app).
       *
       * Quella che le versioni di prima avevano lasciato nel browser si porta
       * in questa scheda una volta sola, e dal browser si toglie. */
      let chiave = "";
      /* Una chiave consegnata da un'origine che la pagina non conosce, in
       * attesa che chi guarda dica di si' (vedi l'ascolto dei messaggi, in fondo). */
      let offerta = null;
      try {
        chiave = sessionStorage.getItem(DOVE_STA_LA_CHIAVE) || "";
      } catch (_niente) {
        /* Deposito bloccato: si chiede a ogni apertura. */
      }
      try {
        const diPrima = localStorage.getItem(DOVE_STA_LA_CHIAVE);
        if (diPrima !== null) {
          if (!chiave && diPrima) {
            chiave = diPrima;
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          }
          localStorage.removeItem(DOVE_STA_LA_CHIAVE);
        }
      } catch (_niente) {
        /* Niente da portare, o un deposito che non si lascia toccare. */
      }

      let CASE = [];
      let INVITI = [];
      /* Chi sono, quante ne ho e qual è il mio tetto. Il tetto si mostra
       * **prima** di sbatterci: un codice rifiutato al quarantunesimo impianto,
       * con il cliente che aspetta, è il momento peggiore per scoprire che
       * esiste un limite. */
      let IO = { chi: "", nome: "", marchio: "", soglia: 0, case: 0 };
      /* Le soglie con cui si colorano i metri arrivano dal server insieme alle
       * case: sono le stesse con cui lui decide, e scritte una volta sola. */
      let SOGLIE = { troppoCaldo: 75, discoPieno: 85, discoFinito: 80 };
      const BATTERIA_SCARICA = 20;
      const SEGNALE_DEBOLE = 45;
      const DISCO_STANCO = 50;

      const ADESSO = () => Date.now();

      async function chiedi(via, opzioni = {}) {
        /* In relativo, senza la barra davanti: da `/console/` porta dove deve,
         * e funziona anche se un domani la console sta sotto un prefisso. */
        const risposta = await fetch(via.replace(/^\//, ""), {
          ...opzioni,
          headers: {
            authorization: `Bearer ${chiave}`,
            "content-type": "application/json",
            ...(opzioni.headers || {}),
          },
        });
        if (risposta.status === 401) throw new ChiaveNoNo();
        const corpo = await risposta.json().catch(() => ({}));
        /* L'utenza congelata: la chiave apre, e non fa vedere niente.
         *
         * Si segna qui e non dove si chiama, perche' le vie sono una
         * ventina e una dimenticata sarebbe una pagina che mostra un errore
         * qualunque al posto del motivo vero. Da qui lo sa `disegna`, e lo
         * sanno tutti i tasti insieme. */
        if (risposta.status === 403 && corpo.congelato) {
          CONGELATA = String(corpo.scrivi || "");
          throw new Congelata();
        }
        if (!risposta.ok) throw new Error(corpo.errore || "non ha funzionato");
        /* E quando torna a rispondere, il cartello se ne va da solo: chi
         * scongela non deve dire a nessuno di ricaricare la pagina. */
        CONGELATA = null;
        return corpo;
      }

      class ChiaveNoNo extends Error {}

      class Congelata extends Error {}

      async function carica() {
        const [case_, inviti, io] = await Promise.all([
          chiedi("/case"),
          chiedi("/inviti"),
          chiedi("/io"),
        ]);
        CASE = case_.case || [];
        CON_LE_NOTE = new Set(case_.note || []);
        INVITI = inviti.inviti || [];
        IO = io || IO;
        if (case_.soglie) SOGLIE = case_.soglie;
      }

      /* Quante ne restano prima del tetto, o `null` se tetto non ce n'è.
       *
       * **Gli inviti aperti contano**, come li conta il server: se qui si
       * contassero solo le case, la testata direbbe «due ancora» con un codice
       * già in attesa, e il secondo verrebbe rifiutato. Un numero che promette
       * più di quello che il server concede è peggio di nessun numero. */
      const quanteRestano = () =>
        IO.soglia > 0 ? Math.max(0, IO.soglia - ((IO.case || CASE.length) + INVITI.length)) : null;

      /* Le case appena arrivate sono quelle che non hanno ancora un nome: non
       * sono un elenco a parte, sono una domanda sullo stesso elenco. */
      const appenaArrivate = () => CASE.filter((una) => una.senzaNome);

      /* Il codice a gruppi di quattro: il server lo scrive gia' cosi', e questa
       * riga c'e' perche' una vecchia versione non lo faceva. */
      const laRiga = (codice) => String(codice);

      /* I codici fatti in questa pagina, per nome (`inv_…`). Il quadro li
       * tiene per impronta e nell'elenco ridice solo le ultime quattro
       * lettere: il codice intero si vede quando lo si fa, e se si ricarica
       * la pagina prima di averlo copiato se ne fa un altro. */
      const APPENA_FATTI = new Map();
      const ilCodiceDi = (uno) =>
        APPENA_FATTI.get(String(uno?.id || "")) || (uno?.codice ? laRiga(uno.codice) : "");
      const ilCodiceNascosto = (uno) => `••••-••••-••••-${String(uno?.finale || "????")}`;

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      /* C'e' davvero? Quello che una casa non manda non si scrive
       * «undefined» sullo schermo di chi la ripara: o si dice che non lo dice,
       * o quel pezzo di frase non si scrive proprio. */
      const cE = (valore) => valore !== null && valore !== undefined && valore !== "";

      /* L'indirizzo del proprio marchio.
       *
       * Assoluto e **senza chiave**: `/marchio/<chi>` non ne vuole, e una
       * chiave dentro un `src` finirebbe nella cronologia del browser e nel
       * registro di qualunque cosa stia in mezzo.
       *
       * In fondo c'e' la razza del file, che non serve a caricarlo: serve a
       * cambiare l'indirizzo quando il marchio cambia, se no il browser
       * continua a far vedere quello di prima per un'ora — che e' la cache che
       * gli abbiamo chiesto noi. */
      const ilSuoMarchio = () =>
        IO.marchio
          ? `/marchio/${encodeURIComponent(IO.chi)}?${encodeURIComponent(IO.marchio)}`
          : "";

      function daQuanto(quando) {
        const minuti = Math.round((ADESSO() - new Date(quando).getTime()) / 60000);
        if (!Number.isFinite(minuti)) return "chissà quando";
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const ilGiorno = (quando) =>
        /* In italiano, non nella lingua del browser: questa pagina e' in
         * italiano tutta, e una data in inglese in mezzo si nota. */
        new Date(quando).toLocaleDateString("it-IT", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

      const livello = (valore, attenta, male) =>
        valore >= male ? "male" : valore >= attenta ? "attenta" : "bene";

      /* Il lavoro in ballo e la manutenzione, adesso che il ponte li manda
       * davvero. Restano scritte a prova di assenza: una casa ferma a un ponte
       * di ieri queste due righe non le ha, e deve rispondere di no invece di
       * rompersi. */
      const staLavorando = (c) => Boolean(c && c.lavoro && c.lavoro.stato === "in corso");

      /* Se questa riga e' quella che sta succedendo — o quella che si e'
       * appena chiesta. Si confronta per **nome e salto di versione**, che e'
       * l'unico modo che c'e': l'entita' nel rapporto non viaggia, e non
       * viaggia apposta. */
      const eLaStessa = (uno, l) =>
        Boolean(l) && l.nome === uno.nome && l.da === uno.da && l.a === uno.a;

      /* Quante entita' non rispondono.
       *
       * Due nomi per lo stesso numero: `giu` e' quello di adesso, `sparite`
       * quello dei ponti fino alla 1.5.6. Le due righe stanno qui per il tempo
       * che ci mette l'ultima casa ad aggiornarsi: una casa ferma a ieri non
       * deve far sparire il riquadro, deve solo mostrare quello che sa. */
      const quantiGiu = (c) => c?.entita?.giu ?? c?.entita?.sparite ?? 0;

      /* Le pastiglie dei dispositivi che non rispondono.
       *
       * Col ponte di adesso sono nomi. Da una casa vecchia arrivano le quattro
       * cifre di allora, e si disegnano com'erano — col cancelletto davanti,
       * che e' il segno che quello non e' un nome.
       *
       * `dispositivi` e' quanti sono **davvero**, `nomi` quanti se ne mandano:
       * quando il secondo e' piu' corto del primo la differenza si scrive, se
       * no un elenco tagliato sembrerebbe tutti quelli che ci sono.
       *
       * Qui non si taglia niente: si disegna tutto quello che arriva, e chi
       * installa li scorre. A tagliare e' il ponte, e il suo tetto sta a
       * duecento — una guardia contro un rapporto che cresce senza fine, non
       * una scelta di impaginazione. Questa riga e' quindi il caso raro, e
       * resta perche' il giorno che capita non deve sparire un numero. */
      function iNomiGiu(c) {
        const nomi = c?.entita?.nomi;
        if (Array.isArray(nomi) && nomi.length) {
          const quanti = c?.entita?.dispositivi ?? nomi.length;
          const altri = Math.max(0, quanti - nomi.length);
          return (
            nomi.map((uno) => `<span>${testo(uno)}</span>`).join("") +
            (altri ? `<span class="eAltri">e altri ${Number(altri)}</span>` : "")
          );
        }
        return (c?.entita?.impronte || []).map((una) => `<span>#${testo(una)}</span>`).join("");
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      /* Il CHANGELOG, disegnato come lo disegna l'app.
       *
       * Le note di una versione arrivano in markdown, e fino a ieri qui
       * finivano dentro la pagina **come testo**: un `## 5.3.0` si leggeva
       * col cancelletto, un elenco di venti righe era un muro, e un
       * `**Attenzione**` si leggeva con gli asterischi. Le stesse note,
       * nell'app, si leggono disegnate — `app/lib/vestito/markdown.dart` —
       * e la stessa cosa mostrata in due modi diversi sono due cose da
       * spiegare invece di una.
       *
       * Percio' qui si fa quello che fa l'app, e **niente di piu'**: titoli,
       * elenchi, righe che separano, blocchi di codice, e dentro la riga
       * grassetto, corsivo, codice e link. La regola e' la sua: quello che
       * non sa disegnare non lo butta, lo lascia scritto com'e'. Una tabella
       * markdown viene fuori con le sue barre e si capisce; un pezzo mangiato
       * no, e chi legge non sa nemmeno che gli manca qualcosa.
       *
       * E una regola in piu', che l'app non ha bisogno di avere: **prima si
       * scappa, poi si disegna**. Queste parole non sono nostre — le ha
       * scritte chi ha fatto l'aggiornamento, cioe' uno di fuori, e da qui
       * fino alla pagina non c'e' nessun altro che le guardi. I tag li mette
       * questa funzione e nessun altro: tutto il resto passa da `testo()`
       * prima di toccare la pagina, e un `<script>` scritto dentro le note
       * si legge `<script>`. */

      const IL_TITOLO = /^(#{1,6})\s+(.*)$/;
      const IL_PUNTO = /^(\s*)[-*+]\s+(.*)$/;
      const LA_RIGA = /^\s*([-*_])\s*\1\s*\1\s*$/;
      const IL_RECINTO = /^\s*```/;

      /* I rientri scritti per intero, non composti.
       *
       * Attaccare il numero al nome — la erre, e poi quanto sta dentro —
       * funzionerebbe, e lascerebbe nella pagina una erre sola che nessuna
       * regola veste: la prova che guarda se ogni classe ha il suo stile
       * legge quello che sta prima del pezzo calcolato, e giustamente si
       * lamenta. Un elenco di quattro voci costa meno di un'eccezione in
       * quella prova. Il primo e' vuoto: un punto che non sta dentro niente
       * non ha bisogno di dirlo. */
      const I_RIENTRI = ["", ' class="r1"', ' class="r2"', ' class="r3"'];

      /* I segni dentro la riga: grassetto, codice, link, corsivo.
       *
       * Un segno aperto e mai chiuso resta il carattere che e': `**` da solo
       * si legge `**` e non si mangia il resto della riga.
       *
       * Nell'app la stessa regola guarda **indietro** — `(?<![A-Za-z0-9])` —
       * per non fare il corsivo in mezzo a `sensor_di_casa`. Qui no, e non e'
       * una svista: guardare indietro nelle espressioni regolari non lo sa
       * fare il browser di un tablet di qualche anno fa, e una regola che non
       * si sa leggere non e' una riga che si perde, e' tutta la pagina che
       * non parte. Qui il carattere di prima si prende e si rimette dov'era.
       * Le due letture danno lo stesso risultato: e' stato provato riga per
       * riga contro quella dell'app, `*a * b*` compreso. */
      const I_SEGNI =
        /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|(^|[^A-Za-z0-9])[*_](?![\s*_])(.*?\S)[*_](?![A-Za-z0-9])/g;

      /* Un link si apre solo se porta sul web.
       *
       * `javascript:` e `data:` non sono indirizzi, sono programmi, e nelle
       * note di un aggiornamento non ci hanno mai niente da fare: quello che
       * non comincia per http resta scritto com'era, parentesi comprese. */
      const SOLO_IL_WEB = /^https?:\/\//i;

      /* Il markdown, letto pezzo per pezzo. Non solleva mai e non butta mai
       * niente: al peggio un pezzo esce come paragrafo. */
      function iPezziDi(markdown) {
        const fuori = [];
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        let paragrafo = [];
        const chiudiIlParagrafo = () => {
          if (!paragrafo.length) return;
          fuori.push({ che: "paragrafo", testo: paragrafo.join(" ").trim() });
          paragrafo = [];
        };
        let dentroUnBlocco = false;
        let blocco = [];
        for (const riga of righe) {
          if (IL_RECINTO.test(riga)) {
            if (dentroUnBlocco) {
              fuori.push({ che: "blocco", testo: blocco.join("\n") });
              blocco = [];
              dentroUnBlocco = false;
            } else {
              chiudiIlParagrafo();
              dentroUnBlocco = true;
            }
            continue;
          }
          if (dentroUnBlocco) {
            blocco.push(riga);
            continue;
          }
          if (!riga.trim()) {
            chiudiIlParagrafo();
            continue;
          }
          if (LA_RIGA.test(riga)) {
            chiudiIlParagrafo();
            fuori.push({ che: "riga" });
            continue;
          }
          const titolo = IL_TITOLO.exec(riga);
          if (titolo) {
            chiudiIlParagrafo();
            fuori.push({ che: "titolo", livello: titolo[1].length, testo: titolo[2].trim() });
            continue;
          }
          const punto = IL_PUNTO.exec(riga);
          if (punto) {
            chiudiIlParagrafo();
            /* Due spazi per rientro, come si scrive: tre o quattro contano uno. */
            fuori.push({
              che: "punto",
              testo: punto[2].trim(),
              rientro: Math.floor(punto[1].length / 2),
            });
            continue;
          }
          paragrafo.push(riga.trim());
        }
        /* Un blocco lasciato aperto — un recinto senza l'altro — non si perde. */
        if (dentroUnBlocco && blocco.length)
          fuori.push({ che: "blocco", testo: blocco.join("\n") });
        chiudiIlParagrafo();
        return fuori;
      }

      /* I segni di una riga gia' scappata. Quello che entra e' testo
       * innocuo, quello che esce ha dentro solo i tag scritti qui. */
      const iSegniDi = (riga) =>
        riga.replace(I_SEGNI, (tutto, grassetto, codice, ilTesto, dove, prima, corsivo) => {
          if (grassetto !== undefined) return `<strong>${/* già HTML */ grassetto}</strong>`;
          if (codice !== undefined) return `<code>${/* già HTML */ codice}</code>`;
          if (ilTesto !== undefined) {
            /* Il link si preme, e si apre di fianco. `noreferrer` perche' a
             * chi ha scritto l'aggiornamento non deve arrivare l'indirizzo
             * del quadro di nessuno. */
            if (!SOLO_IL_WEB.test(dove)) return tutto;
            return `<a href="${/* già HTML */ dove}" target="_blank" rel="noopener noreferrer">${/* già HTML */ ilTesto}</a>`;
          }
          return `${/* già HTML */ prima}<em>${/* già HTML */ corsivo}</em>`;
        });

      /* Dal titolo di quella versione in giu'.
       *
       * Home Assistant, quando gli si chiedono le note di un aggiornamento,
       * risponde col changelog **intero**. Chi ha appena letto «1.5.9 →
       * 1.5.10» sulla riga non vuole ricominciare dal principio della storia:
       * vuole leggere la 1.5.10. Quello che c'era prima del suo titolo si
       * lascia fuori, le versioni di prima restano sotto — che e' dove si va
       * a cercarle. Se quel titolo non c'e' non si taglia niente.
       *
       * E' la stessa regola dell'app, parola per parola. */
      const perCercare = (cosa) => String(cosa).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      function daQuellaVersione(markdown, versione) {
        const quale = String(versione || "").trim();
        if (!quale) return markdown;
        const ilTitoloGiusto = new RegExp(`(^|[^0-9.])${perCercare(quale)}([^0-9.]|$)`);
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        for (let quante = 0; quante < righe.length; quante += 1) {
          if (/^#{1,6}\s/.test(righe[quante]) && ilTitoloGiusto.test(righe[quante])) {
            return righe
              .slice(quante + 1)
              .join("\n")
              .trim();
          }
        }
        return markdown;
      }

      /* Il markdown, disegnato. Dentro non ci finisce un solo carattere di
       * fuori che non sia passato da `testo()`. */
      function ilMarkdown(markdown) {
        let fuori = "";
        let elenco = false;
        const chiudiLElenco = () => {
          if (elenco) fuori += "</ul>";
          elenco = false;
        };
        for (const pezzo of iPezziDi(testo(markdown))) {
          if (pezzo.che !== "punto") chiudiLElenco();
          if (pezzo.che === "titolo") {
            /* `h3` e non `h1`: qui dentro si sta sotto il titolo di una casa,
             * e chi legge con lo schermo sente i livelli. */
            const quale = pezzo.livello === 1 ? "h3" : pezzo.livello === 2 ? "h4" : "h5";
            fuori += `<${quale}>${iSegniDi(pezzo.testo)}</${quale}>`;
          } else if (pezzo.che === "paragrafo") {
            fuori += `<p>${iSegniDi(pezzo.testo)}</p>`;
          } else if (pezzo.che === "punto") {
            if (!elenco) {
              fuori += "<ul>";
              elenco = true;
            }
            fuori += `<li${I_RIENTRI[Math.min(3, pezzo.rientro)]}>${iSegniDi(pezzo.testo)}</li>`;
          } else if (pezzo.che === "riga") {
            fuori += "<hr />";
          } else if (pezzo.che === "blocco") {
            fuori += `<pre><code>${/* già HTML */ pezzo.testo}</code></pre>`;
          }
        }
        chiudiLElenco();
        return fuori;
      }

      /* Come va un controllo: verde, rosso, e il terzo.
       *
       * Il terzo e' quello che si scordava. `va` puo' essere `true`, `false` o
       * `null`, e `null` vuol dire che quel pezzo di rapporto la casa non lo
