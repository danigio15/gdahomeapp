              : c.backup.giorniFa === null || c.backup.giorniFa === undefined
                ? "non ne ha mai fatto uno"
                : "giorni fa",
            c.backup && (c.backup.giorniFa === null || c.backup.giorniFa > 14) ? "attenta" : "",
          ],
          [
            "Errori nel registro",
            c.registro?.errori24h ?? "—",
            "nelle ultime 24 ore",
            (c.registro?.errori24h ?? 0) > 0 ? "male" : "",
          ],
        ];

        return `
          <button type="button" class="indietro" data-indietro>← tutte le case</button>

          <section class="riquadro">
            <div class="titolo">
              <h2>${testo(casa.nome)}</h2>
              ${spia(stato)}
            </div>
            ${stato.perché ? `<p class="perché">${testo(stato.perché)}</p>` : ""}
            <dl class="targa">
              <div>
                <dt>Matricola</dt>
                <dd class="mono">${testo(c.casa.slice(0, 18))}…</dd>
              </div>
              <div><dt>Vista la prima volta</dt><dd>${testo(ilGiorno(casa.da))}</dd></div>
              <div>
                <dt>Collaudata</dt>
                <dd>${casa.collaudataIl ? testo(ilGiorno(casa.collaudataIl)) : "mai"}</dd>
              </div>
              <div>
                <dt>Rapporto</dt>
                <dd>${testo(daQuanto(c.quando))}, ogni ${c.ogni} min</dd>
              </div>
              <div>
                <dt>Telefoni</dt>
                <dd>${c.telefoni ? `${c.telefoni.abbinati} — ${c.telefoni.visti7gg} visti in 7 gg` : "—"}</dd>
              </div>
            </dl>
            <div class="azioni">
              <button
                type="button"
                class="tasto forte"
                data-copia="${testo(JSON.stringify(c, null, 2))}"
              >
                Copia il rapporto
              </button>
              <button type="button" class="tasto" data-apri-rinomina="${testo(casa.casa)}">
                Rinomina
              </button>
              <button type="button" class="tasto male" data-molla="${testo(casa.casa)}">
                Non seguirla più
              </button>
            </div>
            <!-- La casella del nome, chiusa finché non si preme «Rinomina».
                 Prima era un window.prompt: funzionava, e sul telefono si apre
                 come un avviso di sistema che dice «la pagina all'indirizzo …
                 indica», cioè con l'aria di una cosa andata storta. Qui invece
                 è una casella come le altre, e il nome si corregge guardando
                 quello di adesso invece che a memoria. -->
            <div class="rinomina" data-rinomina-per="${testo(casa.casa)}" hidden>
              <input
                type="text"
                data-rinomina-nome="${testo(casa.casa)}"
                value="${casa.senzaNome ? "" : testo(casa.nome)}"
                placeholder="Come la chiami?"
                aria-label="Il nome di questa casa"
              />
              <button type="button" class="tasto forte" data-rinomina="${testo(casa.casa)}">
                Salva
              </button>
            </div>
            <p class="limite">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                ${
                  c.manutenzione
                    ? `Questo quadro <b>non guarda dentro</b>: non apre la plancia
                       e non vede stanze né persone. Tocca <b>una cosa sola</b>, e
                       solo perché questa casa gliel'ha aperta: far partire un
                       aggiornamento che è <b>già in attesa qui</b>. Non c'è altro,
                       e non c'è una riga di comando.`
                    : `Questo quadro <b>guarda e basta</b>: non apre la plancia,
                       non tocca niente, e non vede entità, stanze né persone.
                       Questa casa non ha aperto la manutenzione.`
                }
              </span>
            </p>
          </section>

          <div class="capitolo">
            <h2>Cosa c'è da fare</h2>
            <span>quello che questa casa chiede a te</span>
          </div>

          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Il collaudo</h3>
              <span class="conta">${collaudo.fatte}/${collaudo.quante}</span>
            </div>
            <div
              class="misura"
              role="img"
              aria-label="${collaudo.fatte} spunte su ${collaudo.quante}"
            >
              ${collaudo.spunte.map((una) => `<i class="${una.fatta ? "fatta" : ""}"></i>`).join("")}
            </div>
            <ul class="spunte">
              ${collaudo.spunte
                .map(
                  (una) => `
                <li class="${una.fatta ? "fatta" : "manca"}">
                  <span class="bollino" aria-hidden="true">${una.fatta ? "✓" : "▲"}</span>
                  <span class="cosa"
                    >${testo(una.cosa)}<span class="via">${una.fatta ? " — fatta" : " — manca"}</span></span
                  >
                  <span class="dettaglio">${testo(una.dettaglio)}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">${testo(verdetto)}</p>
          </section>

          ${gliAggiornamenti(c, casa)}

          <div class="capitolo">
            <h2>Come sta</h2>
            <span>la macchina, la rete, e cosa risponde</span>
          </div>

          ${laMacchina(c)} ${laRete(c)} ${gliAddon(c)}

          <section class="riquadro">
            <div class="capoRiquadro"><h3>La salute, quattordici giorni</h3></div>
            ${laStriscia(casa.giorni, true)}
            <dl class="misure">
              ${misure
                .map(
                  ([che, quanto, sotto, come]) => `
                <div>
                  <dt>${testo(che)}</dt>
                  <dd class="${come}">${testo(quanto)}<small>${testo(sotto)}</small></dd>
                </div>`,
                )
                .join("")}
            </dl>
          </section>

          ${
            quantiGiu(c) > 0
              ? `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>I dispositivi non collegati</h3></div>
            <div class="nomiGiu">
              ${iNomiGiu(c)}
            </div>
            <p class="nota">
              Questi non rispondono <em>adesso</em>: Home Assistant ci ha
              parlato e non ci parla più. Può essere la presa staccata, il nodo
              Zigbee che se n'è andato, l'integrazione caduta — e può essere
              anche solo la rete che balla, per cui prima di mettersi in
              macchina conviene guardare se domani ci sono ancora gli stessi
              nomi.
              <br /><br />
              Questa casa manda <b>solo il nome di quelli che non rispondono</b>,
              e nient'altro di quello che ha dentro: i dispositivi che
              funzionano il quadro non li vede nemmeno contati uno per uno. Chi
              ci abita lo sa prima di incollare il codice — c'è scritto nella
              casella dell'add-on — e lo rilegge parola per parola nella scheda
              «Il quadro», dove c'è anche il tasto per smettere.
            </p>
          </section>`
              : ""
          }

          <div class="capitolo">
            <h2>Cos'è, di preciso</h2>
            <span>i numeri di versione, e il rapporto com'è arrivato</span>
          </div>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Le versioni</h3></div>
            <table class="versioni">
              ${versioni
                .map(
                  ([che, quale, nuova]) => `
                <tr>
                  <td>${testo(che)}</td>
                  <td class="numero">
                    ${testo(quale)}${nuova ? '<span class="pastiglia attenta" style="margin-left:8px">c&#39;è la nuova</span>' : ""}
                  </td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <details class="rapporto">
              <summary><h3>Il rapporto, come è arrivata</h3></summary>
              <pre>${testo(JSON.stringify(c, null, 2))}</pre>
              <p class="nota" style="margin-top: 14px">
                Questo è <strong>tutto</strong> quello che questa casa manda.
                Gli unici nomi che ci trovi sono quelli dei dispositivi che in
                questo momento non rispondono; di tutti gli altri non c'è
                nemmeno l'elenco. Nessuna persona, nessuno stato di nessun
                sensore, nessun indirizzo pubblico. Lo stesso testo, parola per
                parola, lo legge chi ci abita: sta nella scheda «Il quadro»
                della console dell'add-on, insieme al tasto per smettere di
                mandarlo.
              </p>
            </details>
          </section>
        `;
      }

      /* Un metro: l'etichetta, il valore, il binario. `tacca` è dove il
       * binario porta un segno — i 75° della temperatura — e va in centesimi
       * della scala, non nell'unità del valore. */
      function unMetro({ che, valore, unita = "%", sotto = "", come, quanto, tacca = null }) {
        /* Quello che questa casa non dice non si disegna a zero: una CPU che
         * non c'e' non e' una CPU allo zero per cento. */
        if (valore === null || valore === undefined)
          return `
            <div>
              <div class="capoMetro"><span>${testo(che)}</span><b class="attenta">—</b></div>
              <div class="binario"><span class="nonLoDice">non lo dice</span></div>
            </div>`;
        return `
          <div>
            <div class="capoMetro">
              <span>${testo(che)}</span>
              ${sotto ? `<small>${testo(sotto)}</small>` : ""}
              <b class="${come === "bene" ? "" : come}">${testo(valore)}${testo(unita)}</b>
            </div>
            <div class="binario ${come}">
              <i style="width: ${Math.max(2, Math.min(100, quanto))}%"></i>
              ${tacca === null ? "" : `<span class="tacca" style="left: ${tacca}%"></span>`}
            </div>
          </div>`;
      }

      /* Un riquadro che dice che non si sa, invece di uno che disegna zeri. */
      function riquadroMuto(titolo, perché) {
        return `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>${testo(titolo)}</h3></div>
            <p class="nota">${testo(perché)}</p>
          </section>`;
      }

      /* La macchina: quello che il Supervisor sa del ferro sotto Home
       * Assistant, più la temperatura che la plancia disegna già.
       *
       * `discoVita` è la riga che su queste schede conta davvero e che nessuno
       * guarda: una eMMC o una microSD hanno un numero di scritture e poi
       * finiscono. Quando c'è, ha la sua barra; su una macchina che non la
       * dichiara — un NUC con un SSD — non si inventa. */
      function laMacchina(c) {
        const m = c.macchina;
        /* Un rapporto senza macchina non e' una casa senza macchina: e' una
         * casa il cui Supervisor non ha risposto. Si dice, e non si disegnano
         * cinque metri a zero. */
        if (!m) return riquadroMuto("La macchina", "Il Supervisor di questa casa non ha risposto.");
        const metri = [
          unMetro({
            che: "CPU",
            valore: m.cpu,
            quanto: m.cpu,
            come: livello(m.cpu, 70, 90),
          }),
          unMetro({
            che: "Memoria",
            valore: m.ram,
            quanto: m.ram,
            come: livello(m.ram, 75, 90),
          }),
          unMetro({
            che: "Disco",
            valore: m.disco,
            quanto: m.disco,
            sotto: `${m.discoLiberi} GB liberi`,
            come: livello(m.disco, 75, SOGLIE.discoPieno),
          }),
          unMetro({
            che: "Temperatura",
            valore: m.temperatura,
            unita: "°",
            quanto: m.temperatura,
            sotto: `tacca a ${SOGLIE.troppoCaldo}°`,
            tacca: SOGLIE.troppoCaldo,
            come: livello(m.temperatura, SOGLIE.troppoCaldo - 10, SOGLIE.troppoCaldo),
          }),
        ];
        if (m.discoVita !== null)
          metri.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, SOGLIE.discoFinito),
            }),
          );

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La macchina</h3>
              <span class="conta">${testo(m.scheda)}</span>
            </div>
            <div class="metri">${metri.join("")}</div>
            <p class="verdetto">
              ${testo(c.sistema)} · accesa da ${plurale(m.accesaDa, "giorno", "giorni")}.
              ${
                m.discoVita !== null && m.discoVita >= DISCO_STANCO
                  ? `Il supporto è consumato al ${m.discoVita}%: su queste schede è la cosa che si rompe per prima, e si cambia prima che decida lui.`
                  : m.temperatura >= SOGLIE.troppoCaldo
                    ? `Sopra i ${SOGLIE.troppoCaldo}° la scheda si rallenta da sola: la casa non si rompe, diventa lenta — e nessuno capisce perché.`
                    : "Niente che chieda di andare a vedere."
              }
            </p>
          </section>`;
      }

      /* Gli aggiornamenti: cosa c'è da fare, e il tasto per farlo.
       *
       * Le voci hanno la forma che `aggiornamentiDaFare` produce già nel
       * ponte, e due dei suoi campi decidono cosa si vede:
       *
       *  - `installabile` — un firmware che si porta col cacciavite non ha
       *    nessun tasto. Mostrarglielo sarebbe una promessa che non si
       *    mantiene, ed è la regola che il ponte si è già data;
       *  - `stacca` — gdahome e Home Assistant, installandosi, fanno cadere il
       *    filo. Detto prima è un'attesa; non detto è un guasto — e da un
       *    quadro che aggiorna da lontano, non detto è una casa che sembra
       *    morta mentre sta solo riavviandosi.
       *
       * E il tasto c'è solo se quella casa **ha aperto la manutenzione**.
       * Vedere cosa c'è da fare e poterlo fare sono due permessi diversi, e
       * il secondo non si dà da sé insieme al primo. */
      function gliAggiornamenti(c, casa) {
        if (!c.aggiornamenti)
          return riquadroMuto(
            "Gli aggiornamenti",
            "Questa casa non ha detto cosa c'è da aggiornare.",
          );
        const elenco = c.aggiornamenti.elenco || [];
        const cartello = ilCartello(c, casa?.chiesto);

        if (!elenco.length)
          return `
            <section class="riquadro">
              <div class="capoRiquadro"><h3>Gli aggiornamenti</h3></div>
              ${cartello}
              <p class="nota">Niente da fare: questa casa è aggiornata.</p>
            </section>`;

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli aggiornamenti</h3>
              <span class="conta">${plurale(elenco.length, "in attesa", "in attesa")}</span>
            </div>
            ${cartello}
            <ul class="versi">
              ${elenco
                .map((uno) =>
                  unaRiga(uno, {
                    fare: `${uno.stacca ? '<span class="pastiglia attenta">fa cadere il filo</span>' : ""}${ilTasto(uno, c, casa)}`,
                  }),
                )
                .join("")}
            </ul>
            ${
              c.manutenzione
                ? `<p class="verdetto">
                    Il backup si fa <b>prima, sempre</b>: è la condizione, non
                    una casella da spuntare. E se ne fa <b>uno per volta</b>:
                    due insieme su una casa sola vogliono dire non sapere quale
                    dei due non è tornato — per questo qui non c'è nessun
                    «installa tutti».
                  </p>`
                : `<div class="limite" style="margin-top: 16px">
                    <span class="gettone" aria-hidden="true">◴</span>
                    <span>
                      <b>Questa casa non ha aperto la manutenzione.</b> Si vede
                      cosa c'è da fare e non si può farlo, ed è giusto così:
                      guardare e toccare sono due permessi diversi.
                      <br /><br />
                      Lo accende <b>chi ci abita</b>, sul suo Home Assistant:
                      <b>Impostazioni › Add-on › gdahome › Configurazione</b>, la
                      casella <i>«Lascia che chi ti ha fatto l'impianto aggiorni
                      da lontano»</i>, poi <b>Salva</b> e l'add-on riparte da sé.
                      Da qui non si accende, e non è una dimenticanza: sarebbe il
                      permesso che se lo dà da solo.
                    </span>
                  </div>`
            }
          </section>`;
      }

      /* Cosa si può fare su questa riga: il tasto, o il motivo per cui non c'è.
       *
       * Sei casi, e si leggono in quest'ordine perché così si escludono a
       * vicenda. Il tasto è l'ultimo: tutto quello che viene prima è una
       * ragione per non mostrarlo, e mostrarlo lo stesso sarebbe una promessa
       * che non si mantiene.
       *
       * Il nome e il salto di versione finiscono in tre `data-`, e non
       * l'entità: nel rapporto l'entità non c'è, e non c'è apposta. È lo stesso
       * modo con cui la casa ritrova di cosa si sta parlando. */
      function ilTasto(uno, c, casa) {
        if (!uno.installabile) return '<span class="pastiglia">si porta col cacciavite</span>';
        if (eLaStessa(uno, casa?.chiesto))
          return `<button type="button" class="tasto" data-lascia-stare="${testo(casa.casa)}">
            Annulla
          </button>`;
        if (eLaStessa(uno, c.lavoro) && c.lavoro.stato === "in corso")
          return '<span class="pastiglia lavoro">in corso</span>';
        if (casa?.chiesto || staLavorando(c)) return '<span class="pastiglia">uno per volta</span>';
        if (!c.manutenzione) return '<span class="pastiglia">manutenzione chiusa</span>';
        return `<button
          type="button"
          class="tasto"
          data-installa="${testo(casa?.casa || "")}"
          data-quale-nome="${testo(uno.nome)}"
          data-quale-da="${testo(uno.da)}"
          data-quale-a="${testo(uno.a)}"
        >Installa</button>`;
      }

      /* Il cartello in cima agli aggiornamenti: cosa sta succedendo in questa
       * casa, o com'è finita l'ultima volta.
       *
       * I nomi degli stati sono quelli che manda il ponte — `in corso`,
       * `fatto`, `non riuscito` — e non una traduzione fatta qui: due
       * vocabolari per la stessa cosa vogliono dire un cartello che smette di
       * comparire il giorno che uno dei due cambia, in silenzio. */
      function ilCartello(c, chiesto = null) {
        /* Prima di tutto quello che si è appena chiesto e che la casa non è
         * ancora passata a prendersi: sono i secondi in cui chi ha premuto il
         * tasto si chiede se ha funzionato. */
        if (chiesto)
          return `
            <div class="cartello">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                <b>${testo(chiesto.nome)} ${testo(chiesto.da)} → ${testo(chiesto.a)}</b>
                è stato chiesto ${testo(daQuanto(chiesto.chiesto))}. Parte quando questa
                casa manda il prossimo rapporto — non si bussa alla porta di
                nessuno, è lei che passa a prenderselo.
              </span>
            </div>`;
        const l = c.lavoro;
        /* Non `=== null`: una casa ferma a un ponte di ieri questa riga non la
         * manda affatto, e `undefined` non è `null`. */
        if (!l) return "";
        if (l.stato === "fatto")
          return `
            <div class="cartello bene">
              <span class="gettone" aria-hidden="true">✓</span>
              <span><b>${testo(l.cosa)}</b> installato ${testo(daQuanto(l.quando))}, dal quadro.</span>
            </div>`;
        if (l.stato === "non riuscito")
          return `
            <div class="cartello male">
              <span class="gettone" aria-hidden="true">✕</span>
              <span
                ><b>${testo(l.cosa)}</b> non è andato ${testo(daQuanto(l.quando))}:
                ${testo(l.perche || "questa casa ha detto di no")}.</span
              >
            </div>`;
        const fermi = Math.round((ADESSO() - new Date(c.quando).getTime()) / 60000);
        const tardi = l.stacca && fermi > 45;
        return `
          <div class="cartello ${tardi ? "male" : ""}">
            <span class="gettone" aria-hidden="true">${tardi ? "!" : "◴"}</span>
            <span>
              <b>${testo(l.cosa)}</b> è partito ${testo(daQuanto(l.quando))}${
                tardi
                  ? ` e questa casa non è più tornata. Un aggiornamento che stacca il filo se lo riprende in pochi minuti: qui si va di persona.`
                  : l.stacca
                    ? `. Fa cadere il filo, quindi per qualche minuto questa casa non si fa sentire — è normale.`
                    : `. Come è andata lo dirà il prossimo rapporto.`
              }
            </span>
          </div>`;
      }

      /* La rete: le schede che il Supervisor dichiara, più gli apparati di
       * casa che la plancia già sorveglia.
       *
       * I due pezzi non sono la stessa cosa e non vanno confusi. Le schede
       * sono quelle **della macchina** e le sa il Supervisor senza che
       * nessuno configuri niente. Gli apparati — il router, i ripetitori —
       * sono i `binary_sensor` con `device_class: connectivity` che la
       * sezione «Macchine e rete» della plancia adotta per integrazione: ci
       * sono se chi ci abita li ha spuntati, e dove non sono spuntati qui
       * si dice zero invece di fingere. */
      function laRete(c) {
        const r = c.rete;
        if (!r) return riquadroMuto("La rete", "Questa casa non ha detto niente della sua rete.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La rete</h3>
              <span class="pastiglia ${r.internet ? "bene" : "male"}">
                ${r.internet ? "internet c&#39;è" : "senza internet"}
              </span>
            </div>
            <ul class="schede">
              ${r.schede
                .map(
                  (una) => `
                <li class="${una.su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(una.nome)}</span>
                  <span class="tipo pastiglia">${testo(una.tipo === "wifi" ? "Wi-Fi" : "cavo")}</span>
                  ${una.principale ? '<span class="pastiglia bene">principale</span>' : ""}
                  ${
                    una.tipo === "wifi" && una.su && una.segnale !== null
                      ? `<span class="pastiglia ${una.segnale < SEGNALE_DEBOLE ? "attenta" : ""}">segnale ${una.segnale}%</span>`
                      : ""
                  }
                  <span class="dove">${una.su ? testo(una.ip) : "non attiva"}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                r.sorvegliate.quante === 0
                  ? "Nessun apparato di rete sorvegliato in questa casa: nella plancia, sezione «Macchine e rete», si spunta l'integrazione del router e i suoi ripetitori compaiono da soli."
                  : r.sorvegliate.giu === 0
                    ? `${plurale(r.sorvegliate.quante, "apparato sorvegliato", "apparati sorvegliati")}, tutti su.`
                    : `${r.sorvegliate.giu} ${r.sorvegliate.giu === 1 ? "apparato" : "apparati"} su ${r.sorvegliate.quante} non rispondono.`
              }
            </p>
          </section>`;
      }

      /* Gli add-on, e la sola domanda che conta: ce n'è qualcuno che dovrebbe
       * girare e non gira? */
      function gliAddon(c) {
        const a = c.addon;
        if (!a) return riquadroMuto("Gli add-on", "Questa casa non ha detto quali add-on ha.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli add-on</h3>
              <span class="conta">${a.accesi}/${a.quanti} accesi</span>
            </div>
            <div class="addon">
              ${a.elenco
                .map((uno) => {
                  const come = uno.su ? "" : uno.allAvvio ? "fermo" : "apposta";
                  return `<span class="uno ${come}"
                    ><span class="puntino" aria-hidden="true"></span>${testo(uno.nome)}${
                      uno.su ? "" : uno.allAvvio ? " — fermo" : " — spento a mano"
                    }</span>`;
                })
                .join("")}
            </div>
            <p class="verdetto">
              ${
                a.spentiCheDovrebbero === 0
                  ? "Nessun add-on con l'avvio automatico è fermo. Quelli spenti a mano restano spenti, ed è giusto: li ha spenti qualcuno."
                  : `${plurale(a.spentiCheDovrebbero, "add-on parte", "add-on partono")} all'avvio e in questo momento ${a.spentiCheDovrebbero === 1 ? "è fermo" : "sono fermi"}. Nessuno spegne un add-on lasciandogli l'avvio automatico: questo si è fermato da solo.`
              }
            </p>
          </section>`;
      }
      /* ─── Schermata: gli aggiornamenti ───────────────────────────────
       *
       * **Una casa, un riquadro, e dentro cosa le manca.**
       *
       * Prima si raggruppava al contrario: un riquadro per ogni cosa da
       * installare, e sotto le case che ce l'hanno indietro. Il ragionamento
       * scritto qui era che con quaranta impianti la domanda non e' «cosa
       * manca a questa casa» ma «quali sono indietro su Home Assistant Core»,
       * e che cosi' si sbriga in un gesto invece che in quaranta.
       *
       * Reggeva su una cosa che non c'era: quel gesto. Il tasto «Installa su N
       * case» e' stato li' per un anno senza essere agganciato a niente —
       * nessun `data-`, nessun `onclick` — quindi non installava un bel
       * niente, e il raggruppamento serviva un'azione che non esisteva.
       *
       * Adesso il gesto c'e', ed e' **una casa per volta**: si installa da qui,
       * riga per riga. Un tasto solo che parte su quaranta impianti insieme
       * resta quello che non si fa — se due non tornano non si sa quale dei
       * quaranta guardare, e il backup lo si e' fatto su tutte o su nessuna.
       *
       * Quello che restava era il costo: con **una** casa sola diventano
       * sedici riquadri che dicono tutti «1 casa», e per sapere cosa fare in
       * quella casa bisogna leggerli tutti e sedici. E il lavoro vero si fa
       * comunque nella scheda della casa, una alla volta, perche' e' li' che
       * stanno il backup, la manutenzione e il tasto che installa.
       *
       * Quindi si raggruppa per dove si va a mettere le mani.
       * ─────────────────────────────────────────────────────────────────── */
      function laFlotta() {
        /* Una riga per casa, con quello che le manca. Dentro, le cose nostre
         * per prime — gdahome e Home Assistant sono quelle che staccano il
         * filo — e poi in ordine di nome, perche' un elenco che cambia ordine
         * a ogni ricarica non si impara mai. */
        const indietro = CASE.filter((una) => (una.carta?.aggiornamenti?.elenco || []).length).map(
          (casa) => ({
            casa,
            cose: [...casa.carta.aggiornamenti.elenco].sort((una, altra) => {
              if (una.nostra !== altra.nostra) return una.nostra ? -1 : 1;
              return String(una.nome).localeCompare(String(altra.nome));
            }),
          }),
        );

        /* Le case con piu' arretrati in cima: e' quella la casa da aprire per
         * prima, e cercarla scorrendo sarebbe il lavoro che questa schermata
         * dovrebbe togliere. */
        indietro.sort((una, altra) => {
          if (una.cose.length !== altra.cose.length) return altra.cose.length - una.cose.length;
          return String(una.casa.nome).localeCompare(String(altra.casa.nome));
        });

        if (!indietro.length)
          return `
            <h1 class="titolone">Gli aggiornamenti</h1>
            <p class="sottotitolo">Tutte le case sono aggiornate. Non capita spesso.</p>`;

        const voci = indietro.reduce((somma, una) => somma + una.cose.length, 0);

        return `
          <h1 class="titolone">Gli aggiornamenti</h1>
          <p class="sottotitolo">
            ${plurale(voci, "cosa da installare", "cose da installare")} su
            ${plurale(indietro.length, "casa", "case")}. Una casa per riquadro, con
            dentro quello che le manca: si installa da qui, una cosa per volta, e
            premendo il nome si apre la scheda con tutto il resto.
          </p>

          ${indietro
            .map(({ casa, cose }) => {
              const aperta = Boolean(casa.carta.manutenzione);
              const cacciavite = cose.filter((uno) => !uno.installabile).length;
              const daQui = cose.filter((uno) => uno.installabile).length;

              return `
              <section class="riquadro mucchio">
                <div class="capoRiquadro">
                  <h3>
                    <button type="button" class="comeUnLink" data-casa="${CASE.indexOf(casa)}">
                      ${testo(casa.nome)}
                    </button>
                  </h3>
                  <span class="conta">${plurale(cose.length, "cosa", "cose")}</span>
                </div>
                <ul class="versi">
                  ${cose
                    .map((uno) => unaRiga(uno, { fare: ilTasto(uno, casa.carta, casa) }))
                    .join("")}
                </ul>
                <p class="verdetto">
                  ${
                    !aperta && daQui
                      ? "Questa casa non ha aperto la manutenzione al quadro: da qui non si installa niente, e non è un guasto — è una scelta di chi ci abita. La accende lui, dal suo Home Assistant: Impostazioni › Add-on › gdahome › Configurazione, la casella «Lascia che chi ti ha fatto l'impianto aggiorni da lontano». "
                      : ""
                  }${
                    cacciavite
                      ? `${plurale(cacciavite, "si porta", "si portano")} col cacciavite: da qui non ${cacciavite === 1 ? "si installa" : "si installano"}. `
                      : ""
                  }${
                    aperta && daQui
                      ? "Il backup viene prima, sempre; e se ne fa uno per volta, che è il motivo per cui non c'è nessun «installa tutti»."
                      : ""
                  }
                </p>
              </section>`;
            })
            .join("")}

          <section class="riquadro" style="margin-top: 14px">
            <div class="capoRiquadro"><h3>Prima di premere</h3></div>
            <ul class="spunte">
              <li class="fatta">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Il backup viene prima, sempre.</b> Non è una casella da
                  spuntare: è la condizione perché il tasto esista. Un
                  aggiornamento che va storto senza backup dietro è una casa da
                  rifare.
                </span>
              </li>
              <li class="fatta">
                <span class="bollino" aria-hidden="true">✓</span>
                <span class="cosa">
                  <b>Quelli che staccano il filo, uno per volta.</b> gdahome e
                  Home Assistant si riavviano installandosi: due insieme sulla
                  stessa casa vogliono dire non sapere quale dei due non è
                  tornato.
                </span>
              </li>
            </ul>
          </section>
        `;
      }

      /* ─── Schermata: l'abbinamento ───────────────────────────────────
       *
       * Come una casa entra in questo quadro. È l'altra metà del lavoro, e
       * ricalca quello che gdahome fa già per abbinare un telefono: un codice
       * che vive pochi minuti, si usa una volta sola, e lascia dietro di sé una
       * chiave che vale per quella casa e per nessun'altra.
       *
       * Il verso è quello che è per un motivo. Non è il quadro che va a cercare
       * le case: è la casa che si presenta. Un quadro che andasse a bussare
       * dovrebbe sapere dove sono, e le case di gdahome un indirizzo pubblico
       * non ce l'hanno — è tutto il punto del ponte.
       * ─────────────────────────────────────────────────────────────────── */
      function lAbbinamento() {
        const primo = INVITI[0] || null;

        return `
          <h1 class="titolone">Abbina un impianto</h1>
          <p class="sottotitolo">
            Un codice che vale <b>un giorno</b> e <b>una casa sola</b>. Si fa qui,
            si manda a chi ci abita, e da quel momento quella casa manda il suo
            rapporto — e nient'altro. È lungo sedici caratteri, a gruppi di
            quattro: la chiave con cui apri questa pagina è un'altra cosa, ed è
            il doppio.
          </p>

          <div class="abbina">
            <div class="colonna">
              <section class="riquadro tinto">
                <div class="capoRiquadro"><h3>Il codice di adesso</h3></div>
                ${
                  primo
                    ? `<div class="codice">
                        <span class="cifre">${testo(laRiga(primo.codice))}</span>
                        <button type="button" class="tasto copia" data-copia="${testo(laRiga(primo.codice))}">Copia</button>
                      </div>
                      <div class="scadenza">
                        <span class="battito" aria-hidden="true"></span>
                        Scade fra <b data-orologio="${primo.scadeFra}">—</b> · fatto ${testo(daQuanto(primo.fattoIl))}
                      </div>`
                    : `<p class="nota" style="margin: 16px 0 12px">
                        Non c'è nessun codice aperto. Fanne uno e mandalo a chi
                        abita la casa: vale un giorno, e va incollato nella scheda
                        dell'add-on gdahome di casa sua. Si abbina da sé appena
                        quella casa si fa viva.
                      </p>`
                }

                <ol class="passi" style="margin-top: 20px">
                  <li>
                    <span>
                      In casa del cliente, apri Home Assistant e vai in
                      <span class="strada">Impostazioni → Add-on → gdahome → Configurazione</span>.
                    </span>
                  </li>
                  <li>
                    <span>
                      Incolla il codice nella casella <b>Il codice di chi ti ha
                      fatto l'impianto</b> e premi <b>Salva</b>. L'add-on si
                      riavvia da solo.
                    </span>
                  </li>
                  <li>
                    <span>
                      Entro un minuto la casa compare qui sotto, in
                      <b>appena arrivate</b>. Le dai un nome e hai finito.
                    </span>
                  </li>
                </ol>

                ${
                  quanteRestano() === 0
                    ? `<p class="minuta" style="margin-top: 16px">
                         <b>Sei arrivato al tuo limite di ${IO.soglia} impianti.</b> Per aggiungerne
                         serve alzarlo: scrivi a chi tiene il quadro. I codici già fatti restano
                         buoni, e gli impianti che segui continuano a funzionare.
                       </p>`
                    : quanteRestano() !== null && quanteRestano() <= 3
                      ? `<p class="minuta" style="margin-top: 16px">
                           Ne restano <b>${quanteRestano()}</b> prima del tuo limite di
                           ${IO.soglia}. Gli inviti aperti contano.
                         </p>`
                      : ""
                }

                <div class="azioni">
                  <input
                    type="text"
                    id="per-chi"
                    maxlength="60"
                    placeholder="Per chi è, se ti serve ricordartelo"
                    aria-label="Per chi è questo codice"
                  />
                  <button
                    type="button"
                    class="tasto forte grande"
                    data-fai
                    ${quanteRestano() === 0 ? "disabled" : ""}
                  >
                    ${primo ? "Fai un altro codice" : "Fai un codice"}
                  </button>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Appena arrivate</h3>
                  <span class="conta">${appenaArrivate().length}</span>
                </div>
                ${
                  appenaArrivate().length
                    ? `<ul class="righe">
                        ${appenaArrivate()
                          .map(
                            (una) => `
                          <li>
                            <span class="che">
                              <b class="mono">${testo(una.casa.slice(0, 22))}…</b>
                              <span
                                >arrivata ${testo(daQuanto(una.da))}${una.carta?.ha ? ` · Home Assistant ${testo(una.carta.ha)}` : ""}</span
                              >
                            </span>
                            <input
                              type="text"
                              id="nome-${testo(una.casa.slice(5, 13))}"
                              data-nome="${testo(una.casa)}"
                              placeholder="Come la chiami?"
                              aria-label="Il nome di questa casa"
                            />
                            <button type="button" class="tasto forte" data-tieni="${testo(una.casa)}">
                              Tienila
                            </button>
                          </li>`,
                          )
                          .join("")}
                      </ul>
                      <p class="nota" style="margin-top: 14px">
                        Il nome lo scrivi tu e resta qui: la casa non lo manda e
                        non lo saprà mai. È l'unica cosa in questo quadro che
                        parla di una persona, e sta sulla tua macchina perché con
                        quella persona il contratto ce l'hai tu.
                      </p>`
                    : `<div class="vuoto">
                        <span class="battito" aria-hidden="true"></span>
                        Nessuna casa in arrivo. Quando una userà il codice, la
                        vedi comparire qui.
                      </div>`
                }
              </section>
            </div>

            <div class="colonna">
              <section class="riquadro">
                <div class="capoRiquadro">
                  <h3>Codici in attesa</h3>
                  <span class="conta">${INVITI.length}</span>
                </div>
                <ul class="righe">
                  ${INVITI.map(
                    (uno) => `
                    <li>
                      <span class="che">
                        <b class="mono">${testo(laRiga(uno.codice))}</b>
                        <span>${uno.per ? `${testo(uno.per)} · ` : ""}fatto ${testo(daQuanto(uno.fattoIl))}</span>
                      </span>
                      <span class="pastiglia attenta">
                        scade fra <b data-orologio="${uno.scadeFra}">—</b>
                      </span>
                      <button type="button" class="tasto male" data-annulla="${testo(uno.codice)}">
                        Annulla
                      </button>
                    </li>`,
                  ).join("")}
                </ul>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    Un codice che scade non fa danni: semplicemente non apre più
                    niente. Se ne fai uno e poi cambi idea, annullalo — finché è
                    vivo, chiunque ce l'abbia può far entrare <em>una</em> casa
                    in questo quadro.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Il tuo marchio</h3></div>
                <p class="minuta">
                  Il logo che hai stampato sul furgone. Compare qui in cima al
                  posto del nostro, e <b>in casa dei tuoi clienti</b>: chi ci
                  abita, quando ha un problema, chiama te — e allora è il tuo
                  nome quello che deve leggere.
                </p>
                <div class="provaMarchio">
                  ${
                    IO.marchio
                      ? `<img class="suoMarchio" src="${ilSuoMarchio()}" alt="Il tuo marchio" />`
                      : `<span class="vuoto" aria-hidden="true">qui</span>`
                  }
                  <div class="azioni">
                    <input
                      type="file"
                      id="scegli-marchio"
                      accept="image/png,image/jpeg,image/webp,image/svg+xml"
                      aria-label="Scegli il file del tuo marchio"
                    />
                    ${IO.marchio ? `<button type="button" class="tasto" data-togli-marchio>Togli</button>` : ""}
                  </div>
                </div>
                <p class="minuta" id="esito-marchio" hidden></p>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    PNG, JPEG, WEBP o SVG, <b>fino a 128 kB</b>. Quadrato viene
                    meglio: sta in un quadratino da trenta punti. Questo file lo
                    scarica il browser di chi abita le case che segui, senza
                    nessuna chiave — mettici il logo, non altro.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Quando una casa tace</h3></div>
                <p class="minuta">
                  Il quadro ti scrive quando un impianto smette di parlare da più
                  di due ore, e di nuovo quando riprende. Mette un
                  <span class="mono">POST</span> a un indirizzo tuo: va bene un
                  bot di Telegram, Slack, ntfy, o quello che usi già.
                </p>
                <div class="azioni">
                  <input
                    type="url"
                    id="dove-avvisi"
                    maxlength="300"
                    placeholder="https://…"
                    aria-label="Dove mandare gli avvisi"
                    value="${testo(IO.avvisi || "")}"
                  />
                  <button type="button" class="tasto forte" data-avvisi>Salva</button>
                  ${IO.avvisi ? `<button type="button" class="tasto" data-prova-avvisi>Mandane uno di prova</button>` : ""}
                </div>
                <p class="minuta" id="esito-avvisi" hidden></p>
                <div class="avvertenza">
                  <span class="gettone" aria-hidden="true">!</span>
                  <span>
                    Nell'avviso c'è il nome che hai dato tu alla casa, che è
                    l'unica cosa in tutto questo quadro che nomini una persona:
                    per questo l'indirizzo dev'essere <b>https</b>, e per questo
                    va in un posto che leggi solo tu. Lascialo vuoto e non parte
                    niente.
                  </span>
                </div>
              </section>

              <section class="riquadro">
                <div class="capoRiquadro"><h3>Come funziona, in breve</h3></div>
                <ul class="spunte">
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il codice si brucia.</b> Appena una casa lo usa, non vale
                      più per nessun'altra: quella casa riceve una chiave sua, e
                      da lì in poi è con quella che si presenta.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Si stacca da due parti.</b> Tu con «non seguirla più», e
                      chi ci abita dalla console dell'add-on, dove legge in chiaro
                      l'ultimo rapporto spedito e ha lì il tasto per smettere.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Il quadro non guarda dentro.</b> Non apre la plancia e
                      non vede entità, stanze né persone: riceve un rapporto
                      di numeri. Per entrare in una casa serve un abbinamento, e
                      quello lo dà chi ci abita, col suo segno, che toglie con un
                      bottone quando vuole.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>La manutenzione è un secondo interruttore.</b> Mandare
                      il rapporto e lasciarsi aggiornare sono due permessi, e il
                      secondo è spento di serie: chi lo accende lo accende
                      apposta. Acceso, da qui si può far partire un
                      aggiornamento che quella casa <em>ha già in attesa</em> —
                      un verbo solo, scritto nel programma — e nient'altro:
                      niente riga di comando, niente configurazione, niente
                      lettura di stati. Quello che si chiede finisce nel
                      rapporto di quella casa, dove chi ci abita lo rilegge
                      parola per parola.
                    </span>
                  </li>
                  <li class="fatta">
                    <span class="bollino" aria-hidden="true">✓</span>
                    <span class="cosa">
                      <b>Non passa dal centralino.</b> Il rapporto va dalla casa
                      a questo quadro e basta: su
                      <span class="strada">tramite.gdahome.org</span> — quello
                      che fa entrare i telefoni da fuori casa — non ci finisce
                      niente.
                    </span>
                  </li>
                </ul>
              </section>
            </div>
          </div>
        `;
      }

      /* Gli orologi delle scadenze. Un codice che scade è la cosa che fa
       * sbagliare una installazione — si fa il codice, si sale in macchina, si
       * arriva e non vale più — quindi quanto gli resta si vede, e si muove. */
      let ticchettio = null;

      function avviaGliOrologi() {
        if (ticchettio) clearInterval(ticchettio);
        const quadranti = [...dove.querySelectorAll("[data-orologio]")];
        if (!quadranti.length) return;
        const partiti = quadranti.map((q) => ({
          q,
          fino: Date.now() + Number(q.dataset.orologio) * 1000,
        }));
        const gira = () => {
          for (const { q, fino } of partiti) {
            const restano = Math.max(0, Math.round((fino - Date.now()) / 1000));
            const minuti = String(Math.floor(restano / 60)).padStart(2, "0");
            const secondi = String(restano % 60).padStart(2, "0");
            q.textContent = restano ? `${minuti}:${secondi}` : "scaduto";
          }
        };
        gira();
        ticchettio = setInterval(gira, 1000);
      }

      /* La chiave: si chiede una volta e resta nel browser. Chi guarda questo
       * quadro lo apre tutti i giorni, e ribattere una chiave lunga tutti i
       * giorni finisce con una chiave corta. */
      function chiedimiLaChiave(perché = "") {
        doveNav.innerHTML = "";
        dove.innerHTML = `
          <section class="riquadro tinto" style="max-width: 32rem; margin-inline: auto">
            <div class="capoRiquadro"><h3>La tua chiave</h3></div>
            <p class="nota" style="margin-bottom: 16px">
              ${
                perché
                  ? testo(perché)
                  : "Te l'ha data chi tiene il quadro, il giorno che ti ha aperto il cruscotto. Resta in questo browser, e non esce da qui."
              }
            </p>
            <div class="azioni">
              <input type="password" id="la-chiave" placeholder="la chiave" aria-label="La chiave" />
              <button type="button" class="tasto forte" id="entra">Entra</button>
            </div>
          </section>`;
        const casella = dove.querySelector("#la-chiave");
        const entra = () => {
          chiave = casella.value.trim();
          try {
            localStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          } catch (_niente) {
            /* Vale per questa sessione e basta: meglio di non entrare. */
          }
          void apri();
        };
        dove.querySelector("#entra").onclick = entra;
        casella.onkeydown = (evento) => {
          if (evento.key === "Enter") entra();
        };
        casella.focus();
      }

      /* «La chiave non va bene» e' vero e non serve a niente.
       *
       * Nella scheda dell'add-on ci sono due caselle che vogliono una stringa a
       * caso, e da fuori si somigliano: il codice che abbina una casa, e questa
       * chiave. Scambiarle e' successo alla prima persona che ci ha provato, e
       * quello che si prendeva era una frase che non dice da che parte
       * guardare.
       *
       * I due pero' si distinguono da soli: un codice di abbinamento e' lungo
       * sedici, questa chiave trentadue. Quando il conto torna si dice quale
       * delle due si e' incollata, invece di lasciare cercare. */
      const CODICE_DI_ABBINAMENTO = 16;
      const LUNGA_COSI = 32;

      function perchéNonVaBene() {
        const nuda = String(chiave).replace(/-/g, "").length;
        if (nuda === CODICE_DI_ABBINAMENTO) {
          return "Questo è lungo come un codice di abbinamento, non come la tua chiave: quello va incollato nella casa del cliente, non qui.";
        }
        if (nuda !== LUNGA_COSI) {
          return `La chiave non va bene: è lunga ${nuda}, e le chiavi sono lunghe ${LUNGA_COSI}.`;
        }
        return "La chiave non va bene.";
      }

      async function apri() {
        if (!chiave) {
          chiedimiLaChiave();
          return;
        }
        try {
          await carica();
        } catch (errore) {
          chiedimiLaChiave(errore instanceof ChiaveNoNo ? perchéNonVaBene() : errore.message);
          return;
        }
        disegna();
      }

      void apri();

      /* Ogni dieci secondi.
       *
       * Era ogni minuto, e il conto scritto qui sopra diceva: i rapporti
       * arrivano ogni quindici minuti, ricaricare ogni minuto è già quindici
       * volte più spesso di quanto cambi qualcosa. Vero allora. Adesso i
       * rapporti arrivano ogni minuto, e quel conto si è rovesciato: fra una
       * casa che si fa viva e questa pagina che lo mostra potevano passare due
       * minuti.
       *
       * Il momento che decide il numero è l'abbinamento: si manda un codice, e
       * si sta davanti a questa pagina ad aspettare che la casa compaia. Dieci
       * secondi lì sono un'attesa; un minuto è il momento in cui si ricarica a
       * mano, e poi si va a cercare cosa non ha funzionato.
       *
       * Costa sei richieste al minuto **per pagina aperta**, e le pagine aperte
       * sono quante sono le persone che stanno guardando: una, quasi sempre. */
      setInterval(() => {
        if (!chiave) return;
        carica()
          .then(() => disegna())
          .catch(() => {
            /* Un giro andato male non deve far sparire quello che si sta
             * guardando: si riprova al minuto dopo. */
          });
      }, 10 * 1000);

      /* La chiave consegnata da chi ci tiene dentro.
       *
       * Questa pagina si apre in due modi: da sola in un browser, e dentro
       * Home Assistant, in una voce della barra laterale che l'add-on
       * fabbrica. Nel secondo caso il codice l'add-on ce l'ha gia' — e' quello
       * scritto nella sua scheda, ed e' quello che fa esistere la voce — e
       * richiederlo qui vorrebbe dire scriverlo due volte, con la seconda che
       * fa pensare che la prima non abbia funzionato.
       *
       * Non si controlla da quale origine arriva, e non e' una svista: chi ci
       * tiene dentro e' Home Assistant, e l'indirizzo di un Home Assistant e'
       * diverso in ogni casa — non c'e' nessun elenco da scrivere qui. Quello
       * che regge e' che il messaggio non **da'** accesso: porta una chiave,
       * che vale se e' buona e non vale se non lo e'. Chi potesse mandarne una
       * buona ce l'avrebbe gia'.
       *
       * Se una chiave c'e' gia' non si tocca: chi l'ha battuta a mano in
       * questo browser ha deciso lui, e una consegna che gliela cambia sotto
       * e' un modo di non far entrare piu' nessuno. */
      addEventListener("message", (evento) => {
        const detto = evento?.data;
        if (!detto || detto.gdahome !== "chiave") return;
        const arrivata = String(detto.chiave || "").trim();
        if (!arrivata || chiave) return;
        chiave = arrivata;
        try {
          localStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
        } catch (_niente) {
          /* Vale per questa apertura e basta: meglio di non entrare. */
        }
        void apri();
      });
    </script>
  </body>
</html>
