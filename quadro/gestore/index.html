      async function regala(tasto) {
        /* La casa scelta dall'elenco, o la matricola scritta: una sola delle
         * due, perche' toccarne una svuota l'altra (vedi `aggancia`). */
        const scelta = document.getElementById("regalo-scelta")?.value || "";
        const scritta = document.getElementById("regalo-casa")?.value.trim().toLowerCase() || "";
        const casa = scelta || scritta;
        if (!casa) {
          document.getElementById("regalo-scelta")?.focus();
          avvisa("Scegli una casa dall'elenco, o incolla la sua matricola");
          return;
        }
        if (!/^casa_[0-9a-f]{32}$/.test(casa)) {
          document.getElementById("regalo-casa")?.focus();
          avvisa("La matricola è casa_ seguito da 32 cifre esadecimali");
          return;
        }
        const app = document.getElementById("regalo-app")?.value || "gdahome";
        const durata = document.getElementById("regalo-durata")?.value || "";
        const nota = document.getElementById("regalo-nota")?.value || "";
        await faiEpoi(tasto, async () => {
          await chiedi("/licenze", {
            method: "POST",
            body: JSON.stringify({ app, casa, mesi: durata ? Number(durata) : null, nota }),
          });
          IL_REGALO = {};
          avvisa(
            `${IL_NOME_DELLA_APP[app]} regalato a ${CONTI?.nomi.get(casa) || ilNomeDellaCasa(casa) || `${casa.slice(0, 13)}…`}`,
          );
        });
      }

      async function generaICodici(tasto) {
        const app = document.getElementById("codici-app")?.value || "gdahome";
        const durata = document.getElementById("codici-durata")?.value || "";
        const nota = document.getElementById("codici-nota")?.value || "";
        const quanti = Math.floor(Number(document.getElementById("codici-quanti")?.value) || 1);
        if (quanti < 1 || quanti > 200) {
          avvisa("Da 1 a 200 codici per volta");
          return;
        }
        await faiEpoi(tasto, async () => {
          const detto = await chiedi("/codici", {
            method: "POST",
            body: JSON.stringify({ app, quanti, mesi: durata ? Number(durata) : null, nota }),
          });
          CODICI_APPENA = { app, mesi: durata ? Number(durata) : null, codici: detto.nuovi || [] };
          avvisa(quanti === 1 ? "Codice generato" : `${quanti} codici generati`);
        });
      }

      async function cambiaIlPacchetto(chi, tasto) {
        const riga = dove.querySelector(`[data-pacchetto-di="${chi}"]`);
        const pacchetto = ilPacchettoDellaBozza(chi);
        const quante = (app) => Object.values(pacchetto[app]).reduce((tot, n) => tot + n, 0);
        await faiEpoi(tasto, async () => {
          await chiedi(`/installatori/${encodeURIComponent(chi)}`, {
            method: "PATCH",
            body: JSON.stringify({ pacchetto }),
          });
          PACCHETTI_APERTI.delete(chi);
          BOZZE.delete(chi);
          if (riga) riga.hidden = true;
          avvisa(`${ilNomeDi(chi)}: ${quante("gdahome")} gdahome e ${quante("gdanav")} gdanav`);
        });
      }

      /* ─── Le schede che si aprono di lato ───────────────────────────────
       *
       * Tre: quella di una casa, quella di un installatore, e quella per
       * aggiungerne uno. Sul telefono salgono dal basso, sopra un velo; su
       * uno schermo largo stanno accanto all'elenco da cui si sono aperte
       * («non mi piace il popup»), e l'elenco resta li' dov'era. */

      function ilFoglio() {
        if (!foglioAperto) return "";
        const dentro =
          foglioAperto.tipo === "installatore"
            ? ilFoglioDellInstallatore()
            : foglioAperto.tipo === "nuovo"
              ? ilFoglioDelNuovo()
              : ilFoglioDellaCasa();
        if (!dentro) {
          foglioAperto = null;
          return "";
        }
        const su = foglioAperto.appena || foglioAperto.chiudendo ? "" : " su";
        return `
          <div class="velo${/* già HTML */ su}" data-chiudi></div>
          <div
            class="foglio${/* già HTML */ su}"
            role="dialog"
            aria-modal="true"
            aria-labelledby="foglio-titolo"
            data-stato="${testo(dentro.stato)}"
          >
            <div class="presa"><i></i></div>
            ${/* già HTML */ dentro.testa}
            <div class="foglio-corpo" id="foglio-corpo">${/* già HTML */ dentro.corpo}</div>
          </div>`;
      }

      function chiudiIlFoglio() {
        if (!foglioAperto || foglioAperto.chiudendo) return;
        foglioAperto.chiudendo = true;
        const questo = foglioAperto;
        dove.querySelectorAll(".velo, .foglio").forEach((uno) => uno.classList.remove("su"));
        setTimeout(() => {
          if (foglioAperto === questo) foglioAperto = null;
          disegna();
        }, 420);
      }

      const ilTastoChiudi = () =>
        `<button type="button" class="tasto-chiudi" data-chiudi aria-label="Chiudi" title="Chiudi">${LE_ICONE["x"]}</button>`;

      function ilFoglioDellaCasa() {
        const una =
          CONTI.tutte.find(
            (altra) =>
              altra.matricola === foglioAperto.casa &&
              (!foglioAperto.chi || altra.chi === foglioAperto.chi),
          ) || CONTI.tutte.find((altra) => altra.matricola === foglioAperto.casa);
        if (!una) return null;
        const stato = una.casa?.stato;
        const tinta = !stato
          ? "grigio"
          : stato.chiave === "offline"
            ? "rosso"
            : stato.chiave === "guardare"
              ? "ambra"
              : "verde";
        const quando = una.casa?.carta?.quando;
        return {
          stato: stato?.chiave || "",
          testa: `
            <div class="foglio-testa">
              <span class="tondino ${testo(tinta)}">${LE_ICONE["casa"]}</span>
              <div class="nomi">
                <h2 id="foglio-titolo">${testo(una.nome)}</h2>
                <p>${
                  una.casa
                    ? `Di ${testo(una.di)} · ${spia(stato)}${quando ? ` · ultimo rapporto ${testo(daQuanto(quando))}` : ""}`
                    : "Nessun installatore: il quadro la conosce per la licenza"
                }</p>
              </div>
              ${/* già HTML */ ilTastoChiudi()}
            </div>`,
          corpo: una.casa ? laScheda(una.casa) : laSchedaSoloLicenza(una),
        };
      }

      /* Il capitolo «Licenza» della scheda di una casa: com'e' Premium
       * adesso, e da dove viene. E' l'unico capitolo da cui si fa qualcosa —
       * regalare, revocare — perche' la licenza non e' dell'installatore, e'
       * del quadro. */
      function laLicenzaDellaCasa(matricola, licenza) {
        const sue = licenza?.licenze || [];
        const buone = sue.filter((una) => una.vale);
        const nomeDi = (chi) =>
          INSTALLATORI.find((uno) => uno.chi === chi)?.nome || "un installatore";
        const rigaDellaLicenza = (una) => {
          const suo =
            una.origine === "negozio"
              ? (licenza?.abbonamenti || []).find((uno) => uno.lic === una.lic) || null
              : null;
          const come =
            una.origine === "negozio"
              ? suo?.stato === "disdetto"
                ? "abbonamento disdetto"
                : suo?.stato === "prova"
                  ? "in prova gratuita"
                  : "abbonamento"
              : una.origine === "regalo"
                ? "regalo"
                : una.origine === "installatore"
                  ? "dall'installatore"
                  : String(una.origine || "");
          const sotto = (
            suo
              ? [
                  suo.piattaforma === "ios" ? "App Store" : "Google Play",
                  `${suo.piano || "piano non detto"}${suo.prezzo ? ` ${iSoldi(suo.prezzo, suo.valuta)}` : ""}`,
                  !suo.pagato
                    ? ""
                    : suo.stato === "disdetto" && !suo.prova
                      ? `finisce ${conLArticolo("il", suo.pagato)}`
                      : laFraseDellAbbonamento(suo).toLowerCase(),
                  suo.sandbox ? "acquisto di prova, non entra nei conti" : "",
                ]
              : [
                  una.origine === "installatore"
                    ? `da ${nomeDi(una.installatore)}`
                    : una.origine === "regalo"
                      ? "regalo tuo"
                      : DA_DOVE[una.origine] || "",
                  laScadenza(una),
                  una.nota ? `«${una.nota}»` : "",
                ]
          )
            .filter(Boolean)
            .join(" · ");
          return `
            <li data-spiega>
              <span class="tondino ${suo?.stato === "disdetto" ? "ambra" : ""}">${LE_ICONE["stella"]}</span>
              <span class="riga-testo"><b>Premium · ${testo(come)}</b><span>${testo(sotto)}</span></span>
              <span class="riga-fine">
                <button type="button" class="tasto piccolo male" data-revoca="${testo(una.lic)}"${una.origine === "negozio" ? " data-dal-negozio" : ""}>Revoca</button>
              </span>
              <p class="spiega" hidden></p>
            </li>`;
        };
        const lUltima = sue
          .filter((una) => !una.vale)
          .sort((a, b) => (b.revocata || b.scade || 0) - (a.revocata || a.scade || 0))[0];
        const base = lUltima
          ? `Nessuna licenza Premium attiva. L'ultima: ${laScadenza(lUltima)}.`
          : "Nessuna licenza Premium: è una casa Base.";
        return `
          <div class="capitolo">
            <h2>Licenza</h2>
            <span>${buone.length ? "Premium" : "Base"}</span>
          </div>
          <section class="riquadro">
            <ul class="elenco regole">${
              /* già HTML */ buone.length
                ? buone.map(rigaDellaLicenza).join("")
                : `<li>
                     <span class="tondino grigio">${LE_ICONE["stella"]}</span>
                     <span class="riga-testo"><b>Base</b><span>${testo(base)}</span></span>
                   </li>`
            }</ul>
            <div class="azioni">
              <button type="button" class="tasto" data-regala-a="${testo(matricola)}">${LE_ICONE["regalo"]}Regala Premium</button>
            </div>
          </section>`;
      }

      /* La scheda di una casa: la stessa dell'installatore, senza i tasti.
       * In cima la licenza; poi quello che c'e' da fare — solo i controlli
       * che non vanno, gli altri chiusi in una riga —, come sta, le plance, e
       * in fondo i dettagli tecnici. */
      function laScheda(casa) {
        const stato = casa.stato;
        const c = casa.carta || {};
        const controlli = casa.controlli || { controlli: [] };
        const una = CONTI?.tutte.find((altra) => altra.matricola === casa.casa);

        const versioni = [
          ["gdahome (il ponte)", c.ponte, c.aggiornamenti?.gdahome],
          ["la plancia", c.plancia, false],
          ["Home Assistant Core", c.ha, c.aggiornamenti?.ha],
          ["Supervisor", c.supervisor, false],
          ["Sistema operativo", c.sistema, false],
        ];

        const numeri = [
          /* Quando qualcosa e' giu', il numero grande sono i DISPOSITIVI.
           *
           * Qui c'era il totale delle entita' col numero di quelle mute
           * sotto — «Entità 2496 · 49 non rispondono» — e sopra, nella riga
           * del riepilogo, «7 dispositivi non collegati». Due numeri diversi
           * a tre centimetri di distanza per la stessa cosa: non sono in
           * disaccordo, sono 49 entita' mute dentro 7 apparecchi, ma chi
           * legge non ha modo di saperlo. E i 49 non li puo' nemmeno andare a
           * vedere: da una casa viaggiano solo i nomi dei DISPOSITIVI, mai
           * quelli delle entita'. Un numero che non si puo' aprire non serve.
           *
           * Il cruscotto questa mattonella ce l'ha gia' cosi' (`console/
           * index.html`, «Dispositivi non collegati»): era rimasta indietro
           * soltanto la gestione. Quando non c'e' niente giu' resta il totale
           * delle entita', che li' e' un'informazione e non un allarme. */
          quantiGiu(c) > 0
            ? [
                "Dispositivi non collegati",
                numero(c.entita?.dispositivi ?? quantiGiu(c)),
                cE(c.entita?.totali) ? `su ${numero(c.entita.totali)} entità in casa` : "",
                "male",
              ]
            : [
                "Entità",
                cE(c.entita?.totali) ? numero(c.entita.totali) : "—",
                "rispondono tutte",
                "",
              ],
          [
            "Batteria più bassa dei dispositivi",
            cE(c.batterie?.piuBassa) ? `${c.batterie.piuBassa}%` : "—",
            !c.batterie
              ? "non comunicato"
              : c.batterie.scariche > 0
                ? `${c.batterie.scariche} sotto il ${BATTERIA_SCARICA}%`
                : "nessuna da sostituire",
            (c.batterie?.scariche ?? 0) > 0 ? "attenta" : "",
          ],
          [
            "Ultimo backup",
            !c.backup || !cE(c.backup.giorniFa) ? "mai" : c.backup.giorniFa,
            !c.backup ? "non comunicato" : !cE(c.backup.giorniFa) ? "mai eseguito" : "giorni fa",
            c.backup && (!cE(c.backup.giorniFa) || c.backup.giorniFa > 14) ? "attenta" : "",
          ],
          [
            "Errori nel registro",
            c.registro?.errori24h ?? "—",
            "nelle ultime 24 ore",
            (c.registro?.errori24h ?? 0) > 0 ? "male" : "",
          ],
        ];

        /* Da fare: i controlli che non vanno, in vista; gli altri chiusi in
         * una riga che si apre. Una casa che non manda notizie e' una cosa
         * da fare anche quando i controlli dell'ultimo rapporto erano verdi:
         * quel rapporto e' vecchio. */
        const nonVa = controlli.controlli.filter((uno) => comeVa(uno) === "male");
        const resto = controlli.controlli.filter((uno) => comeVa(uno) !== "male");
        const tuttiBene = resto.every((uno) => comeVa(uno) === "bene");
        const daFare = nonVa.length + (stato.chiave === "offline" ? 1 : 0);
        const ilResto = !resto.length
          ? ""
          : `${
              nonVa.length
                ? resto.length === 1
                  ? "L'altro controllo"
                  : `Gli altri ${resto.length} controlli`
                : resto.length === 1
                  ? "L'unico controllo"
                  : `Tutti i ${resto.length} controlli`
            }${tuttiBene ? (resto.length === 1 ? " è a posto" : " sono a posto") : ""}`;
        const rigaDelControllo = (uno) => `
                <li class="${comeVa(uno)}">
                  <span class="bollino" aria-hidden="true">${IL_BOLLINO[comeVa(uno)]}</span>
                  <span class="cosa"
                    >${testo(uno.cosa)}<span class="via"> — ${A_PAROLE[comeVa(uno)]}</span></span
                  >
                  <span class="dettaglio">${testo(uno.dettaglio)}</span>
                </li>`;

        return `
          ${/* già HTML */ laLicenzaDellaCasa(casa.casa, una?.licenza)}

          <div class="capitolo">
            <h2>Da fare</h2>
            <span>${daFare ? plurale(daFare, "cosa", "cose") : "niente, è tutto a posto"}</span>
          </div>

          <section class="riquadro">
            ${stato.perché ? `<p class="perché">${testo(stato.perché)}</p>` : ""}
            ${nonVa.length ? `<ul class="controlli">${nonVa.map(rigaDelControllo).join("")}</ul>` : ""}
            ${
              resto.length
                ? `<details class="apri-riga${nonVa.length || stato.perché ? "" : " primo"}">
                     <summary>${testo(ilResto)}<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
                     <ul class="controlli">${resto.map(rigaDelControllo).join("")}</ul>
                   </details>`
                : ""
            }
            ${
              controlli.controlli.length
                ? ""
                : `<p class="nota">Nessun controllo: questa casa non ha ancora mandato un rapporto.</p>`
            }
          </section>

          ${gliAggiornamenti(c, casa)}

          <div class="capitolo">
            <h2>Stato dell'impianto</h2>
            <span>macchina, rete e dispositivi</span>
          </div>

          <section class="riquadro">
            <dl class="misure">
              ${numeri
                .map(
                  ([che, quanto, sotto, come]) => `
                <div>
                  <dt>${testo(che)}</dt>
                  <dd class="${testo(come)}">${testo(quanto)}<small>${testo(sotto)}</small></dd>
                </div>`,
                )
                .join("")}
            </dl>
          </section>

          ${laMacchina(c)} ${laRete(c)} ${gliAddon(c)}

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Ultimi quattordici giorni</h3></div>
            ${laStriscia(casa.giorni, true)}
          </section>

          ${
            quantiGiu(c) > 0
              ? `<section class="riquadro">
                   <div class="capoRiquadro">
                     <h3>I dispositivi non collegati</h3>
                     <span class="conta">${plurale(c.entita?.dispositivi ?? quantiGiu(c), "dispositivo", "dispositivi")}</span>
                   </div>
                   <div class="nomiGiu">${iNomiGiu(c)}</div>
                   <p class="nota">
                     Questa casa invia <b>solo i nomi dei dispositivi che non rispondono</b>, nient'altro. Lo stesso elenco lo leggono il suo installatore e chi ci abita.
                   </p>
                 </section>`
              : ""
          }

          ${
            /* I nomi che l'installatore ha scelto per le plance, e le plance
             * che ha aggiunto e la casa deve ancora creare: da qui si leggono
             * e basta, come tutto il resto della scheda. */
            Array.isArray(c.plance?.elenco) && c.plance.elenco.length
              ? `<div class="capitolo">
                   <h2>Le plance</h2>
                   <span>i nomi che l'installatore ha scelto</span>
                 </div>

                 <section class="riquadro">
                   <dl class="targa vesti-lette">
                     ${[
                       ...c.plance.elenco.map((una) => ({
                         profilo: una.profilo,
                         titolo: una.titolo || una.profilo,
                         nuova: false,
                       })),
                       ...Object.entries(casa.vesti || {})
                         .filter(
                           ([profilo, sue]) =>
                             sue?.nuova === true &&
                             !c.plance.elenco.some((una) => una.profilo === profilo),
                         )
                         .map(([profilo, sue]) => ({
                           profilo,
                           titolo: sue.titolo || profilo,
                           nuova: true,
                         })),
                     ]
                       .map((una) => {
                         const sue = (casa.vesti || {})[una.profilo] || {};
                         return `
                     <div>
                       <dt>${testo(una.titolo)}${una.nuova ? " · in arrivo: la casa la crea da sola" : ""}</dt>
                       <dd>
                         nel menu: ${sue.titolo ? `<b>${testo(sue.titolo)}</b>` : "com'è in casa"}<br />
                         all'avvio: ${sue.velo ? `<b>${testo(sue.velo)}</b>` : "il nome dell'installatore"}
                       </dd>
                     </div>`;
                       })
                       .join("")}
                   </dl>
                   <p class="nota" style="margin-top: 12px">
                     Li sceglie l'installatore dal suo cruscotto, plancia per plancia, e da lì ne aggiunge di nuove: da qui si leggono e basta.
                   </p>
                 </section>`
              : ""
          }

          <div class="capitolo">
            <h2>Dettagli tecnici</h2>
            <span>matricola, versioni e rapporto completo</span>
          </div>

          <section class="riquadro">
            <div class="matricola-intera">
              <span class="matricola-etichetta">Matricola</span>
              <span class="mono matricola-valore">${testo(String(c.casa || casa.casa))}</span>
              <button type="button" class="tasto copia" data-copia="${testo(String(c.casa || casa.casa))}">Copia</button>
            </div>
            <dl class="targa">
              <div><dt>Abbinata il</dt><dd>${testo(ilGiorno(casa.da))}</dd></div>
              <div>
                <dt>Ultimo rapporto</dt>
                <dd>${c.quando ? `${testo(daQuanto(c.quando))}, ogni ${testo(c.ogni)} min` : "mai ricevuto"}</dd>
              </div>
              <div>
                <dt>Manutenzione</dt>
                <dd>${c.manutenzione ? "attiva" : "non attiva"}</dd>
              </div>
            </dl>
          </section>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Le versioni</h3></div>
            <table class="versioni">
              ${versioni
                .map(
                  ([che, quale, nuova]) => `
                <tr>
                  <td>${testo(che)}</td>
                  <td class="numero">
                    ${cE(quale) ? testo(quale) : '<span class="nonLoDice">non comunicato</span>'}${nuova ? '<span class="pastiglia attenta" style="margin-left:8px">aggiornamento disponibile</span>' : ""}
                  </td>
                </tr>`,
                )
                .join("")}
            </table>
          </section>

          <section class="riquadro">
            <details class="rapporto">
              <summary><h3>Rapporto completo</h3></summary>
              <pre>${testo(JSON.stringify(c, null, 2))}</pre>
              <p class="nota" style="margin-top: 14px">
                Questo è <strong>tutto</strong> ciò che la casa invia, e lo legge uguale il suo installatore. Gli unici nomi presenti sono quelli dei dispositivi che in questo momento non rispondono, i titoli delle plance e quelli degli aggiornamenti. Nessuna persona, nessuno stato di sensori, nessun indirizzo pubblico.
              </p>
            </details>
            <div class="azioni">
              <button type="button" class="tasto" data-copia="${testo(JSON.stringify(c, null, 2))}">Copia rapporto</button>
            </div>
          </section>

          <p class="sola-lettura-riga">
            <span class="sola-lettura">Solo lettura · quello che vede l'installatore</span>
          </p>
          <p class="nota">
            Della casa vedi quello che vede il suo installatore, e niente di più: i numeri che manda da sé, i titoli delle plance, e i nomi solo dei dispositivi che non rispondono. Nessuna persona, nessuna stanza, nessuno stato dei sensori. Da qui si guarda e basta: la aggiorna e la ripara il suo installatore.
          </p>
        `;
      }

      /* Una casa che il quadro conosce solo per la licenza: niente rapporti,
       * niente installatore. Si vede la licenza, e la matricola da copiare. */
      function laSchedaSoloLicenza(una) {
        return `
          ${/* già HTML */ laLicenzaDellaCasa(una.matricola, una.licenza)}

          <div class="capitolo">
            <h2>Dettagli tecnici</h2>
            <span>quello che il quadro ne sa</span>
          </div>

          <section class="riquadro">
            <div class="matricola-intera">
              <span class="matricola-etichetta">Matricola</span>
              <span class="mono matricola-valore">${testo(una.matricola)}</span>
              <button type="button" class="tasto copia" data-copia="${testo(una.matricola)}">Copia</button>
            </div>
            <p class="nota" style="margin-top: 12px">
              Nessun installatore segue questa casa, e il quadro non riceve i suoi rapporti: la conosce solo per la licenza. Il nome lo sa chi ci abita, che trova la stessa matricola nella console dell'add-on, alla voce Licenza.
            </p>
          </section>`;
      }

      /* La scheda di un installatore: le sue case, le sue regole (nome,
       * limite, licenze da regalare), l'accesso, e in fondo, a parte,
       * l'eliminazione. */
      function ilFoglioDellInstallatore() {
        const uno = INSTALLATORI.find((altro) => altro.chi === foglioAperto.chi);
        if (!uno) return null;
        const stato = loStato(uno);
        const quante = Number(uno.case) || 0;
        const quota =
          uno.soglia > 0
            ? Math.min(100, Math.round((quante / uno.soglia) * 100))
            : quante
              ? 100
              : 0;
        const postiDetti =
          uno.soglia > 0 ? `${quante} su ${uno.soglia}` : `${quante} · senza limite`;
        return {
          stato: stato.come,
          testa: `
            <div class="foglio-testa">
              ${/* già HTML */ leIniziali(uno)}
              <div class="nomi">
                <h2 id="foglio-titolo">${uno.nome ? testo(uno.nome) : "senza nome"}</h2>
                <p>${/* già HTML */ laPastigliaDi(uno)}${testo(lUltimoAccesso(uno))}</p>
              </div>
              ${/* già HTML */ ilTastoChiudi()}
            </div>`,
          corpo: `
            ${APPENA_FATTO?.chi === uno.chi ? laChiaveNuova() : ""}

            <div class="capitolo">
              <h2>Le sue case</h2>
              <span>${testo(postiDetti)}</span>
            </div>
            <section class="riquadro">
              <div class="metro"><i style="width: ${Number(quota)}%"></i></div>
              <ul class="case-sue">${leSueCase(uno)}</ul>
            </section>

            <div class="capitolo">
              <h2>Le sue regole</h2>
              <span>le vede anche lui</span>
            </div>
            <section class="riquadro">
              <ul class="elenco regole">
                <li data-spiega>
                  <span class="tondino">${LE_ICONE["matita"]}</span>
                  <span class="riga-testo"><b>Nome</b><span>${uno.nome ? testo(uno.nome) : "senza nome"}</span></span>
                  <span class="riga-fine">
                    <button type="button" class="tasto piccolo" data-nome="${testo(uno.chi)}">Rinomina</button>
                  </span>
                  <div class="rigaNome" data-nome-di="${testo(uno.chi)}" hidden>
                    <input
                      type="text"
                      maxlength="80"
                      value="${testo(uno.nome || "")}"
                      aria-label="Come si chiama"
                      autocomplete="off"
                    />
                    <button type="button" class="tasto forte" data-salva-nome="${testo(uno.chi)}">Salva</button>
                    <span class="nota">Compare nel suo cruscotto e, sulle sue case, in cima alla plancia.</span>
                  </div>
                </li>
                <li data-spiega>
                  <span class="tondino">${LE_ICONE["casa"]}</span>
                  <span class="riga-testo"><b>Limite di case</b><span>${uno.soglia > 0 ? plurale(Number(uno.soglia), "casa", "case") : "senza limite"}</span></span>
                  <span class="riga-fine">
                    <button type="button" class="tasto piccolo" data-limite="${testo(uno.chi)}">Cambia</button>
                  </span>
                  <div class="rigaLimite" data-limite-di="${testo(uno.chi)}" hidden>
                    <input
                      type="number"
                      min="0"
                      max="9999"
                      value="${Number(uno.soglia) || 0}"
                      aria-label="Quante case può seguire"
                    />
                    <button type="button" class="tasto forte" data-salva-limite="${testo(uno.chi)}">Salva</button>
                    <span class="nota">Zero vuol dire senza limite.</span>
                  </div>
                </li>
                <li data-spiega>
                  <span class="tondino">${LE_ICONE["regalo"]}</span>
                  <span class="riga-testo"><b>Licenze da regalare</b><span>${testo(ilPacchettoDetto(uno))}</span></span>
                  <span class="riga-fine">
                    <button type="button" class="tasto piccolo" data-pacchetto="${testo(uno.chi)}">Cambia</button>
                  </span>
                  <div class="rigaPacchetto" data-pacchetto-di="${testo(uno.chi)}"${PACCHETTI_APERTI.has(uno.chi) ? "" : " hidden"}>
                    ${/* già HTML */ leRigheDelPacchetto(uno.chi)}
                    <button type="button" class="tasto forte" data-salva-pacchetto="${testo(uno.chi)}">Salva</button>
                    <span class="nota">Quante licenze può regalare ai suoi clienti, e di che durata: la durata comincia quando la assegna, o quando il cliente usa il codice. Quelle già date restano anche se abbassi il numero.</span>
                  </div>
                </li>
              </ul>
            </section>

            <div class="capitolo">
              <h2>Accesso</h2>
              <span>la chiave del suo cruscotto</span>
            </div>
            <section class="riquadro">
              <ul class="elenco regole">
                <li data-spiega>
                  <span class="tondino">${LE_ICONE["chiave"]}</span>
                  <span class="riga-testo"><b>Chiave di accesso</b><span>Se l'ha persa, gliene fai una nuova: quella di prima smette subito di funzionare.</span></span>
                  <span class="riga-fine">
                    <button type="button" class="tasto piccolo" data-rifai="${testo(uno.chi)}">Nuova chiave</button>
                  </span>
                  <p class="spiega" hidden></p>
                </li>
                <li data-spiega>
                  <span class="tondino ambra">${LE_ICONE["pausa"]}</span>
                  <span class="riga-testo">
                    <b>${uno.congelato ? "Sospeso" : "Sospendi"}</b>
                    <span>${uno.congelato ? "Non vede le sue case finché non lo riattivi. Le case continuano a mandare i rapporti." : "Non vede più le sue case finché non lo riattivi. Non si perde niente."}</span>
                  </span>
                  <span class="riga-fine">${
                    uno.congelato
                      ? `<button type="button" class="tasto piccolo" data-scongela="${testo(uno.chi)}">Riattiva</button>`
                      : `<button type="button" class="tasto piccolo" data-congela="${testo(uno.chi)}">Sospendi</button>`
                  }</span>
                  <p class="spiega" hidden></p>
                </li>
              </ul>
            </section>

            <section class="riquadro rischio">
              <ul class="elenco regole">
                <li data-spiega>
                  <span class="tondino rosso">${LE_ICONE["cestino"]}</span>
                  <span class="riga-testo"><b>Elimina l'installatore</b><span>Per sempre: perde tutte le sue case, e per riaverle ognuna va riabbinata con un codice nuovo.</span></span>
                  <span class="riga-fine">
                    <button type="button" class="tasto piccolo male" data-elimina="${testo(uno.chi)}">Elimina</button>
                  </span>
                  <p class="spiega" hidden></p>
                </li>
              </ul>
            </section>`,
        };
      }

      /* La scheda per aggiungere un installatore: nome, limite, e se vuoi le
       * licenze che potra' regalare. Appena aggiunto, si apre la sua scheda
       * con la chiave in cima. */
      function ilFoglioDelNuovo() {
        return {
          stato: "",
          testa: `
            <div class="foglio-testa">
              <span class="tondino">${LE_ICONE["aggiungi"]}</span>
              <div class="nomi">
                <h2 id="foglio-titolo">Nuovo installatore</h2>
                <p>Gli consegni una chiave e apre subito il suo cruscotto.</p>
              </div>
              ${/* già HTML */ ilTastoChiudi()}
            </div>`,
          corpo: `
            <section class="riquadro" style="margin-top: 8px">
              <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" maxlength="80" placeholder="Per esempio «Elettrotecnica Verdi»" autocomplete="off" />
              </div>
              <div class="due-campi pari">
                <div class="campo">
                  <label for="tetto">Limite di case</label>
                  <input type="number" id="tetto" min="0" max="9999" value="40" />
                </div>
                <label class="senza-limite"><input type="checkbox" id="senza-limite" /> Senza limite</label>
              </div>
              <p class="minuta">
                Non deve installare niente e non deve comprare nessun dominio: con la chiave apre il suo cruscotto e abbina le case dei suoi clienti, fino al limite.
              </p>
            </section>

            <section class="riquadro">
              <div class="capoRiquadro"><h3>Licenze da regalare ai suoi clienti</h3></div>
              <p class="minuta">
                Facoltative. Le regala dalla sua pagina: la durata parte quando lui la assegna, o quando il cliente usa il codice. Se ne toglie una, torna nel pacchetto.
              </p>
              ${/* già HTML */ leRigheDelPacchetto(NUOVO)}
            </section>

            <div class="azioni">
              <button type="button" class="tasto forte grande" data-iscrivi>${LE_ICONE["aggiungi"]}Aggiungi e crea la chiave</button>
            </div>`,
        };
      }

      /* Gli aggiornamenti di una casa, da guardare: chi li installa e' il suo
       * installatore, e qui al posto del tasto c'e' scritto come stanno. */
      function gliAggiornamenti(c, casa) {
        if (!c.aggiornamenti)
          return riquadroMuto(
            "Gli aggiornamenti",
            "Questa casa non ha comunicato gli aggiornamenti.",
          );
        const elenco = c.aggiornamenti.elenco || [];
        const cartello = ilCartello(c, casa?.chiesto);
        const quanti = Number(c.aggiornamenti.quanti) || 0;
        if (!elenco.length)
          return `
            <section class="riquadro">
              <div class="capoRiquadro"><h3>Gli aggiornamenti</h3></div>
              ${/* già HTML */ cartello}
              <p class="nota">
                ${
                  quanti > 0
                    ? `${plurale(quanti, "aggiornamento in attesa", "aggiornamenti in attesa")}, ma questa casa non manda l'elenco: è una versione di gdahome precedente alla 1.5.9.`
                    : "Nessun aggiornamento in attesa: la casa è aggiornata."
                }
              </p>
            </section>`;
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli aggiornamenti</h3>
              <span class="conta">${plurale(elenco.length, "in attesa", "in attesa")}</span>
            </div>
            ${/* già HTML */ cartello}
            <ul class="versi">
              ${elenco
                .map((uno) =>
                  unaRiga(uno, {
                    fare: `${uno.stacca ? '<span class="pastiglia attenta">riavvio necessario</span>' : ""}${ilFare(uno, c, casa)}`,
                  }),
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                c.manutenzione
                  ? "Questa casa ha la manutenzione attiva: installa il suo installatore, da qui si guarda soltanto."
                  : "Questa casa non ha la manutenzione attiva: gli aggiornamenti si vedono, ma nessuno li installa da remoto."
              }
            </p>
          </section>`;
      }

      /* Al posto del tasto: come sta questa riga, a parole. */
      function ilFare(uno, c, casa) {
        if (!uno.installabile)
          return '<span class="pastiglia">si aggiorna dal suo apparecchio</span>';
        if (eLaStessa(uno, casa?.chiesto))
          return '<span class="pastiglia lavoro">richiesto dall\'installatore</span>';
        if (eLaStessa(uno, c.lavoro) && c.lavoro.stato === "in corso")
          return '<span class="pastiglia lavoro">in corso</span>';
        if (!c.manutenzione) return '<span class="pastiglia">manutenzione non attiva</span>';
        return '<span class="pastiglia">lo installa l\'installatore</span>';
      }

      /* ─── I tasti ────────────────────────────────────────────────────── */

      /* In due tempi, sullo stesso tasto, e con scritto sotto cosa succede:
       * il primo tocco arma e spiega, il secondo fa. Al posto di `confirm`,
       * che sul telefono si apre come un guasto di sistema. La spiegazione
       * va nella riga del tasto: quella che porta `data-spiega`. */
      function inDueTempi(tasto, parola, spiegazione, poi) {
        const spiega = tasto.closest("[data-spiega]")?.querySelector(".spiega");
        if (tasto.dataset.sicuro !== "sì") {
          tasto.dataset.sicuro = "sì";
          tasto.textContent = "Premi ancora per confermare";
          if (spiega && spiegazione) {
            spiega.textContent = spiegazione;
            spiega.hidden = false;
          }
          setTimeout(() => {
            if (!tasto.isConnected) return;
            tasto.dataset.sicuro = "";
            tasto.textContent = parola;
            if (spiega) spiega.hidden = true;
          }, 6000);
          return;
        }
        poi();
      }

      /* Fa una cosa, poi ricarica e ridisegna. Il tasto resta spento mentre
       * succede. */
      async function faiEpoi(tasto, cosa) {
        if (tasto) tasto.disabled = true;
        try {
          await cosa();
          await carica();
          disegna();
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) {
            chiedimiLaChiave();
            return;
          }
          avvisa(errore.message || "non ha funzionato");
        } finally {
          if (tasto) tasto.disabled = false;
        }
      }

      const ilNomeDi = (chi) =>
        INSTALLATORI.find((altro) => altro.chi === chi)?.nome || "questo installatore";

      /* Un pezzo che si preme: col dito, col mouse, e da tastiera con Invio o
       * con lo spazio, come un tasto vero. */
      function premibile(chi, cosa) {
        chi.onclick = cosa;
        chi.onkeydown = (evento) => {
          if (evento.target !== chi) return;
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            cosa();
          }
        };
      }

      /* Andare in una sezione. Una scheda aperta resta della sezione da cui
       * si e' aperta: cambiando sezione si chiude. L'indirizzo dice dove si
       * e' (`#case`), cosi' ricaricando la pagina si resta li'. */
      function vaiA(quale, filtro = "") {
        schermata = LE_SCHERMATE.includes(quale) ? quale : "panoramica";
        foglioAperto = null;
        if (schermata === "abbonamenti") FILTRO_ABBONAMENTI = filtro || "tutti";
        try {
          history.replaceState(null, "", `#${schermata}`);
        } catch (_niente) {
          /* Un indirizzo che non si lascia cambiare: si resta senza. */
        }
        disegna();
        window.scrollTo({ top: 0 });
      }

      /* Una casa si apre sempre in «Case», accanto all'elenco: da qualunque
       * parte la si prema — la Panoramica, la scheda del suo installatore,
       * un abbonamento — la sua scheda e' una sola, e sta li'. */
      function apriLaCasa(matricola, chi) {
        const daUnAltraParte = schermata !== "case";
        schermata = "case";
        foglioAperto = { tipo: "casa", chi, casa: matricola, appena: true };
        try {
          history.replaceState(null, "", "#case");
        } catch (_niente) {
          /* Come sopra. */
        }
        disegna();
        if (daUnAltraParte) window.scrollTo({ top: 0 });
      }

      function apriLInstallatore(chi) {
        const daUnAltraParte = schermata !== "installatori";
        schermata = "installatori";
        foglioAperto = { tipo: "installatore", chi, appena: true };
        try {
          history.replaceState(null, "", "#installatori");
        } catch (_niente) {
          /* Come sopra. */
        }
        disegna();
        if (daUnAltraParte) window.scrollTo({ top: 0 });
      }

      /* «Regala Premium» dalla scheda di una casa: porta al modulo del
       * regalo con quella casa gia' scelta, e resta solo la durata. */
      function regalaA(matricola) {
        const nellElenco = leCaseConosciute().some((una) => una.casa === matricola);
        IL_REGALO = nellElenco
          ? { "regalo-scelta": matricola, "regalo-casa": "" }
          : { "regalo-scelta": "", "regalo-casa": matricola };
        vaiA("licenze");
        /* Solo quanto basta: sul computer il modulo si vede già, e la pagina
           resta ferma col suo titolo; sul telefono sale fino al modulo. */
        document.getElementById("regala-qui")?.scrollIntoView({ block: "nearest" });
        document.getElementById("regalo-durata")?.focus({ preventScroll: true });
      }

      function aggancia() {
        dove.querySelectorAll("[data-vai]").forEach((chi) => {
          premibile(chi, () => vaiA(chi.dataset.vai, chi.dataset.filtro || ""));
        });
        dove.querySelectorAll("[data-apri-casa]").forEach((riga) => {
          premibile(riga, () => apriLaCasa(riga.dataset.apriCasa, riga.dataset.di || ""));
        });
        dove.querySelectorAll("[data-apri-installatore]").forEach((carta) => {
          premibile(carta, () => apriLInstallatore(carta.dataset.apriInstallatore));
        });
        const nuovoT = dove.querySelector("[data-nuovo]");
        if (nuovoT)
          nuovoT.onclick = () => {
            foglioAperto = { tipo: "nuovo", appena: true };
            disegna();
            document.getElementById("nome")?.focus({ preventScroll: true });
          };
        dove.querySelectorAll("[data-filtro-case]").forEach((pastiglia) => {
          pastiglia.onclick = () => {
            FILTRO_CASE = pastiglia.dataset.filtroCase;
            disegna();
          };
        });
        const cerca = document.getElementById("cerca-case");
        if (cerca)
          cerca.oninput = () => {
            CERCA_CASE = cerca.value;
            ridisegnaLeCase();
          };
        dove.querySelectorAll("[data-filtro-abbonamenti]").forEach((pastiglia) => {
          pastiglia.onclick = () => {
            FILTRO_ABBONAMENTI = pastiglia.dataset.filtroAbbonamenti;
            disegna();
          };
        });
        dove.querySelectorAll("[data-regala-a]").forEach((tasto) => {
          tasto.onclick = () => regalaA(tasto.dataset.regalaA);
        });
        const senzaLimite = document.getElementById("senza-limite");
        if (senzaLimite)
          senzaLimite.onchange = () => {
            const tetto = document.getElementById("tetto");
            if (tetto) tetto.disabled = senzaLimite.checked;
          };
        dove.querySelectorAll("[data-chiudi]").forEach((tasto) => {
          tasto.onclick = chiudiIlFoglio;
        });
        dove.querySelectorAll("[data-copia]").forEach((tasto) => {
          tasto.onclick = async () => {
            const prima = tasto.textContent;
            try {
              await navigator.clipboard.writeText(tasto.dataset.copia);
              tasto.textContent = prima.trim() === "Copia" ? "Copiata" : "Copiato";
            } catch (_niente) {
              tasto.textContent = "Selezionala a mano";
            }
            setTimeout(() => {
              if (tasto.isConnected) tasto.textContent = prima;
            }, 2000);
          };
        });
        /* «Cosa cambia, per intero»: le note si chiedono quando servono, a
         * `/gestore/installatore/<chi>/note/<segno>` — sono nella cartella di
         * chi segue la casa — e si disegnano come nel cruscotto. */
        dove.querySelectorAll("[data-note]").forEach((tasto) => {
          tasto.onclick = async () => {
            const suo = tasto.dataset.note;
            const riquadro = dove.querySelector(`[data-note-di="${suo}"]`);
            if (!riquadro) return;
            if (!riquadro.hidden) {
              riquadro.hidden = true;
              tasto.textContent = "cosa cambia, per intero";
              return;
            }
            riquadro.hidden = false;
            tasto.textContent = "chiudi";
            if (riquadro.dataset.gia === "sì") return;
            riquadro.textContent = "…";
            try {
              const detto = await chiedi(
                `/installatore/${encodeURIComponent(foglioAperto?.chi || "")}/note/${suo}`,
              );
              const disegnate = ilMarkdown(
                daQuellaVersione(String(detto.note || "").trim(), riquadro.dataset.noteA || ""),
              );
              if (disegnate) riquadro.innerHTML = disegnate;
              else riquadro.textContent = "le note sono arrivate vuote";
              riquadro.dataset.gia = "sì";
            } catch (errore) {
              riquadro.textContent = errore.message || "non ha funzionato";
            }
          };
        });
        const regalaT = dove.querySelector("[data-regala]");
        if (regalaT) regalaT.onclick = () => regala(regalaT);
        for (const id of [
          "regalo-app",
          "regalo-durata",
          "regalo-scelta",
          "regalo-casa",
          "regalo-nota",
        ]) {
          const campo = document.getElementById(id);
          if (!campo) continue;
          if (id in IL_REGALO) campo.value = IL_REGALO[id];
          campo.oninput = campo.onchange = () => {
            IL_REGALO[id] = campo.value;
            /* La casa e' una: scelta dall'elenco o scritta. Toccarne una
             * svuota l'altra, cosi' non si regala a quella sbagliata. */
            const altra =
              id === "regalo-scelta" ? "regalo-casa" : id === "regalo-casa" ? "regalo-scelta" : "";
            if (altra && campo.value) {
              const quella = document.getElementById(altra);
              if (quella) quella.value = "";
              IL_REGALO[altra] = "";
            }
          };
        }
        const codiciT = dove.querySelector("[data-genera-codici]");
        if (codiciT) codiciT.onclick = () => generaICodici(codiciT);
        const chiudiCodici = dove.querySelector("[data-chiudi-codici]");
        if (chiudiCodici)
          chiudiCodici.onclick = () => {
            CODICI_APPENA = null;
            disegna();
          };
        dove.querySelectorAll("[data-revoca]").forEach((tasto) => {
          tasto.onclick = () =>
            inDueTempi(
              tasto,
              "Revoca",
              tasto.hasAttribute("data-dal-negozio")
                ? "La licenza smette di valere entro otto giorni. È del negozio: se l'abbonamento è pagato, al rinnovo torna da sola."
                : "La licenza smette di valere entro otto giorni: la casa torna Base quando ricontrolla.",
              async () => {
                await faiEpoi(tasto, async () => {
                  await chiedi(`/licenze/${encodeURIComponent(tasto.dataset.revoca)}`, {
                    method: "DELETE",
                  });
                  avvisa("Licenza revocata: smette di valere entro otto giorni");
                });
              },
            );
        });
        dove.querySelectorAll("[data-annulla-codice]").forEach((tasto) => {
          tasto.onclick = () =>
            inDueTempi(
              tasto,
              "Annulla",
              "Il codice non vale più: chi lo ha in mano non può usarlo.",
              async () => {
                await faiEpoi(tasto, async () => {
                  await chiedi(`/codici/${encodeURIComponent(tasto.dataset.annullaCodice)}`, {
                    method: "DELETE",
                  });
                  avvisa("Codice annullato");
                });
              },
            );
        });
        dove.querySelectorAll("[data-pacchetto]").forEach((tasto) => {
          tasto.onclick = () => {
            const chi = tasto.dataset.pacchetto;
            const riga = dove.querySelector(`[data-pacchetto-di="${chi}"]`);
            if (!riga) return;
            /* Si apre sempre da quello che c'e' adesso, non da una bozza vecchia. */
            if (riga.hidden) {
              BOZZE.delete(chi);
              PACCHETTI_APERTI.add(chi);
              ridisegnaLeRighe(chi);
            } else PACCHETTI_APERTI.delete(chi);
            riga.hidden = !riga.hidden;
            if (!riga.hidden) riga.querySelector("input, select")?.focus();
          };
        });
        dove.querySelectorAll("[data-salva-pacchetto]").forEach((tasto) => {
          tasto.onclick = () => cambiaIlPacchetto(tasto.dataset.salvaPacchetto, tasto);
        });
        const iscriviT = dove.querySelector("[data-iscrivi]");
        if (iscriviT) iscriviT.onclick = () => iscrivi(iscriviT);
        const chiudiChiave = dove.querySelector("[data-chiudi-chiave]");
        if (chiudiChiave)
          chiudiChiave.onclick = () => {
            APPENA_FATTO = null;
            disegna();
          };
        dove.querySelectorAll("[data-nome]").forEach((tasto) => {
          tasto.onclick = () => {
            const riga = dove.querySelector(`[data-nome-di="${tasto.dataset.nome}"]`);
            if (!riga) return;
            riga.hidden = !riga.hidden;
            if (!riga.hidden) riga.querySelector("input")?.select();
          };
        });
        dove.querySelectorAll("[data-salva-nome]").forEach((tasto) => {
          const chi = tasto.dataset.salvaNome;
          const casella = dove.querySelector(`[data-nome-di="${chi}"] input`);
          const salva = () => cambiaIlNome(chi, casella?.value ?? "", tasto);
          tasto.onclick = salva;
          if (casella)
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") salva();
            };
        });
        dove.querySelectorAll("[data-limite]").forEach((tasto) => {
          tasto.onclick = () => {
            const riga = dove.querySelector(`[data-limite-di="${tasto.dataset.limite}"]`);
            if (!riga) return;
            riga.hidden = !riga.hidden;
            if (!riga.hidden) riga.querySelector("input")?.focus();
          };
        });
        dove.querySelectorAll("[data-salva-limite]").forEach((tasto) => {
          const chi = tasto.dataset.salvaLimite;
          const casella = dove.querySelector(`[data-limite-di="${chi}"] input`);
          const salva = () => cambiaIlTetto(chi, Number(casella?.value), tasto);
          tasto.onclick = salva;
          if (casella)
            casella.onkeydown = (evento) => {
              if (evento.key === "Enter") salva();
            };
        });
        dove.querySelectorAll("[data-rifai]").forEach((tasto) => {
          tasto.onclick = () =>
            inDueTempi(
              tasto,
              "Nuova chiave",
              `Una nuova chiave per ${ilNomeDi(tasto.dataset.rifai)}: quella attuale smette subito di funzionare.`,
              () => rifaiLaChiave(tasto.dataset.rifai, tasto),
            );
        });
        dove.querySelectorAll("[data-congela]").forEach((tasto) => {
          tasto.onclick = () =>
            inDueTempi(
              tasto,
              "Sospendi",
              `Da questo momento ${ilNomeDi(tasto.dataset.congela)}, aprendo il cruscotto, non vede più le sue case: trova un avviso che gli dice di contattarti. Le case restano attive e continuano a mandare i rapporti: non si perde niente, e riattivandolo torna tutto com'era.`,
              () => congela(tasto.dataset.congela, true, tasto),
            );
        });
        dove.querySelectorAll("[data-scongela]").forEach((tasto) => {
          /* Sbloccare non chiede conferma: si ridà una cosa, non si toglie. */
          tasto.onclick = () => congela(tasto.dataset.scongela, false, tasto);
        });
        dove.querySelectorAll("[data-elimina]").forEach((tasto) => {
          tasto.onclick = () => {
            const uno = INSTALLATORI.find((altro) => altro.chi === tasto.dataset.elimina);
            inDueTempi(
              tasto,
              "Elimina",
              `Viene eliminato ${ilNomeDi(tasto.dataset.elimina)} insieme ${plurale(uno?.case || 0, "alla sua casa", "alle sue case")}: il quadro smette di riceverne i rapporti, e la loro storia qui non c'è più. Non si può annullare: se lo aggiungi di nuovo riceve una matricola nuova, e ogni casa va riabbinata con un nuovo codice, dall'add-on di casa. Se ti serve solo che non veda più le sue case, usa Sospendi.`,
              () => eliminaLInstallatore(tasto.dataset.elimina, tasto),
            );
          };
        });
      }

      async function iscrivi(tasto) {
        const nome = document.getElementById("nome")?.value.trim() || "";
        const senzaLimite = Boolean(document.getElementById("senza-limite")?.checked);
        const soglia = senzaLimite ? 0 : Number(document.getElementById("tetto")?.value) || 0;
        const pacchetto = ilPacchettoDellaBozza(NUOVO);
        if (!nome) {
          document.getElementById("nome")?.focus();
          avvisa("Inserisci il nome");
          return;
        }
        await faiEpoi(tasto, async () => {
          const detto = await chiedi("/installatori", {
            method: "POST",
            body: JSON.stringify({ nome, soglia, pacchetto }),
          });
          /* Appena aggiunto si apre la sua scheda, con la chiave in cima. */
          APPENA_FATTO = { nome, chiave: detto.chiave, chi: detto.chi };
          foglioAperto = detto.chi ? { tipo: "installatore", chi: detto.chi } : null;
          BOZZE.delete(NUOVO);
          avvisa(`${nome} aggiunto`);
        });
      }

      async function cambiaIlTetto(chi, soglia, tasto) {
        const tetto = Number.isFinite(soglia) && soglia >= 0 ? Math.floor(soglia) : 0;
        await faiEpoi(tasto, async () => {
          await chiedi(`/installatore/${encodeURIComponent(chi)}`, {
            method: "PUT",
            body: JSON.stringify({ soglia: tetto }),
          });
          avvisa(tetto ? `${ilNomeDi(chi)}: limite a ${tetto}` : `${ilNomeDi(chi)}: senza limite`);
        });
      }

      /* Rinominare un installatore. Il nome nuovo lo vede lui in cima al suo
       * cruscotto, e lo vedono le sue case: il quadro lo dice a ogni
       * rapporto, e la plancia di casa lo mette in cima (`Plance.intestala`,
       * nel ponte). Vuoto non si accetta: un installatore senza nome e' una
       * riga che non dice di chi sono le case. */
      async function cambiaIlNome(chi, nome, tasto) {
        const pulito = String(nome ?? "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 80);
        if (!pulito) {
          avvisa("Serve un nome");
          return;
        }
        const prima = ilNomeDi(chi);
        await faiEpoi(tasto, async () => {
          await chiedi(`/installatore/${encodeURIComponent(chi)}`, {
            method: "PUT",
            body: JSON.stringify({ nome: pulito }),
          });
          avvisa(
            pulito === prima
              ? `${pulito}: il nome è lo stesso`
              : `${prima} adesso si chiama ${pulito}`,
          );
        });
      }

      async function rifaiLaChiave(chi, tasto) {
        const nome = ilNomeDi(chi);
        await faiEpoi(tasto, async () => {
          const detto = await chiedi(`/installatore/${encodeURIComponent(chi)}/chiave`, {
            method: "POST",
          });
          APPENA_FATTO = { nome, chiave: detto.chiave, chi };
          avvisa("La chiave precedente non è più valida");
        });
      }

      /* Congelare: un interruttore, reversibile col tasto accanto. */
      async function congela(chi, gelo, tasto) {
        const nome = ilNomeDi(chi);
        await faiEpoi(tasto, async () => {
          await chiedi(`/installatore/${encodeURIComponent(chi)}/congela`, {
            method: gelo ? "POST" : "DELETE",
          });
          avvisa(gelo ? `${nome}: sospeso` : `${nome}: riattivato`);
        });
      }

      /* Eliminare non si annulla: non e' «non lo vedo piu'», e' «non c'e' piu'». */
      async function eliminaLInstallatore(chi, tasto) {
        const nome = ilNomeDi(chi);
        await faiEpoi(tasto, async () => {
          await chiedi(`/installatore/${encodeURIComponent(chi)}`, { method: "DELETE" });
          if (foglioAperto?.chi === chi) foglioAperto = null;
          avvisa(`${nome}: eliminato con le sue case`);
        });
      }

      /* ─── La chiave, e l'apertura ────────────────────────────────────── */

      function chiedimiLaChiave(perche) {
        doveNav.innerHTML = "";
        document.getElementById("sottotitolo").textContent = "";
        dove.innerHTML = `
          <section class="riquadro tinto" style="max-width: 32rem; margin-inline: auto">
            <div class="capoRiquadro"><h3>La chiave di gestione</h3></div>
            <p class="nota" style="margin-bottom: 16px">
              ${testo(perche || "È quella con cui hai avviato il cruscotto: da qui si aggiungono gli installatori.")}
            </p>
            <div class="azioni">
              <input type="password" id="la-chiave" placeholder="Chiave" aria-label="La chiave di gestione" />
              <button type="button" class="tasto forte" id="entra">Accedi</button>
            </div>
          </section>`;
        const casella = document.getElementById("la-chiave");
        const entra = () => {
          chiave = casella.value.trim();
          try {
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          } catch (_niente) {
            /* Si resta con quella in memoria, e si richiede alla prossima. */
          }
          void apri();
        };
        document.getElementById("entra").onclick = entra;
        casella.onkeydown = (evento) => {
          if (evento.key === "Enter") entra();
        };
        casella.focus();
      }

      async function apri() {
        if (!chiave) {
          chiedimiLaChiave();
          return;
        }
        try {
          await carica();
        } catch (male) {
          if (male instanceof ChiaveNoNo) {
            /* Rifiutata quella tenuta, si prova quella consegnata dalla scheda
             * dell'add-on — una volta sola — prima di chiedere a mano. */
            if (consegnata && consegnata !== chiave) {
              chiave = consegnata;
              try {
                sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
              } catch (_niente) {
                /* Vale per questa apertura e basta. */
              }
              void apri();
              return;
            }
            chiedimiLaChiave("Chiave non valida. Riprova.");
            return;
          }
          doveNav.innerHTML = "";
          dove.innerHTML = `<section class="riquadro"><p class="minuta">${testo(male.message)}</p></section>`;
          return;
        }
        disegna();
      }

      void apri();

      /* Se si sta scrivendo in una casella, il ridisegno aspetta il giro dopo. */
      const staScrivendo = () => {
        const chi = document.activeElement;
        return Boolean(chi && dove.contains(chi) && chi.matches("input, textarea, select"));
      };

      agganciaLeRighe();

      /* Un rinfresco lento: questa pagina si guarda ogni tanto, non si fissa.
       * Con una chiave nuova a schermo non si tocca niente: sparirebbe. E
       * nemmeno mentre si sta aggiungendo un installatore: il nome scritto e
       * non ancora salvato non deve sparire. */
      setInterval(() => {
        if (
          !chiave ||
          APPENA_FATTO ||
          CODICI_APPENA ||
          staScrivendo() ||
          foglioAperto?.tipo === "nuovo"
        )
          return;
        carica()
          .then(() => disegna())
          .catch(() => {
            /* Un giro andato male non deve far sparire quello che si sta
             * guardando: si riprova al giro dopo. */
          });
      }, 60000);

      doveNav.onclick = (evento) => {
        const tasto = evento.target.closest("[data-schermata]");
        if (!tasto) return;
        vaiA(tasto.dataset.schermata);
      };

      /* La barra e' attaccata in cima quando la testata e' uscita dallo
       * schermo: solo allora porta il suo velo (vedi lo stile della barra). */
      if ("IntersectionObserver" in window)
        new IntersectionObserver(([voce]) => {
          doveNav.toggleAttribute("data-attaccata", !voce.isIntersecting);
        }).observe(document.querySelector("header"));
      else doveNav.setAttribute("data-attaccata", "");

      /* L'indirizzo cambiato a mano (o dal tasto «indietro» del browser)
       * porta alla sua sezione. */
      addEventListener("hashchange", () => {
        const quale = location.hash.slice(1);
        if (chiave && LE_SCHERMATE.includes(quale) && quale !== schermata) vaiA(quale);
      });

      /* Il pallino in testata: premerlo ricarica adesso. */
      const tastoVivo = document.getElementById("vivo");
      tastoVivo.onclick = async () => {
        if (!chiave || tastoVivo.getAttribute("aria-busy") === "true") return;
        tastoVivo.setAttribute("aria-busy", "true");
        document.getElementById("vivo-dice").textContent = "Aggiornamento…";
        try {
          await carica();
          disegna();
          avvisa("Aggiornato");
        } catch (errore) {
          if (errore instanceof ChiaveNoNo) chiedimiLaChiave();
          else avvisa(errore.message || "non ha funzionato");
        } finally {
          tastoVivo.removeAttribute("aria-busy");
          document.getElementById("vivo-dice").textContent = "Aggiorna";
        }
      };

      /* Esc chiude il foglio, come su qualunque finestra. */
      document.addEventListener("keydown", (evento) => {
        if (evento.key === "Escape") chiudiIlFoglio();
      });

      /* La chiave consegnata da chi ci tiene dentro.
       *
       * Questa pagina si apre in due modi: da sola in un browser, e dentro
       * Home Assistant, in una voce della barra laterale che l'add-on
       * fabbrica. Nel secondo caso il codice l'add-on ce l'ha gia' — e' quello
       * scritto nella sua scheda, ed e' quello che fa esistere la voce — e
       * richiederlo qui vorrebbe dire scriverlo due volte, con la seconda che
       * fa pensare che la prima non abbia funzionato.
       *
       * Si accetta solo da chi ci contiene o ci ha aperto, da qualunque
       * origine: l'indirizzo di un Home Assistant e' diverso in ogni casa, e
       * la voce della barra laterale la chiave la consegna da li'. Non apre
       * niente di piu' di quello che apre battendola: la chiave della gestione
       * e' una sola, e una chiave sbagliata qui dentro non entra.
       *
       * Se una chiave c'e' gia' non si tocca: chi l'ha battuta a mano in
       * questa scheda ha deciso lui, e una consegna che gliela cambia sotto
       * e' un modo di non far entrare piu' nessuno. La consegna si ricorda
       * anche quando non si usa: serve se quella tenuta viene rifiutata. Il
       * perche' per esteso sta nel cruscotto, dove il guasto si e' visto per
       * primo. */
      let consegnata = "";
      addEventListener("message", (evento) => {
        const detto = evento?.data;
        if (!detto || detto.gdahome !== "chiave") return;
        const daChi = evento.source;
        /* Dalla WebView dell'app gdahome la chiave si scrive dentro la pagina
         * stessa: il messaggio parte da questa finestra. */
        if (
          !daChi ||
          (daChi !== window &&
            daChi !== window.opener &&
            (window.parent === window || daChi !== window.parent))
        )
          return;
        const arrivata = String(detto.chiave || "").trim();
        if (!arrivata) return;
        consegnata = arrivata;
        if (chiave) return;
        chiave = arrivata;
        try {
          sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
        } catch (_niente) {
          /* Vale per questa apertura e basta: meglio di non entrare. */
        }
        void apri();
      });
    </script>
  </body>
</html>
