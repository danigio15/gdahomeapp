<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cruscotto gdahome</title>
    <!--
      LA GESTIONE DEGLI INSTALLATORI: la pagina di chi tiene il quadro.
      (Nel programma si chiama «gestione installatori», e cosi' la cerca una
      prova: e' il nome della pagina, e non cambia.)

      Non è la console degli installatori — quella sta in `../console/`. Qui
      si aggiungono gli installatori, si mettono i limiti, si danno le chiavi,
      e si vedono gli impianti di ognuno **come li vede lui**.

      QUELLO CHE VEDE LUI, E NIENTE DI PIÙ.

      Per un pezzo questa pagina contava e basta: quanti impianti ha ognuno,
      non quali. Poi chi tiene il quadro ha chiesto di vedere i nomi degli
      impianti, come stanno e quante entità ha ciascuno, e la regola è
      diventata questa: le case di un installatore si chiedono a
      `/gestore/installatore/<chi>/case`, che le costruisce con lo stesso
      pezzo di programma che le costruisce per lui. Quindi qui non arriva una
      riga che non arrivi anche a lui — i numeri che ogni casa manda da sé, e
      i nomi solo dei dispositivi che non rispondono, i titoli delle plance. E
      da qui si guarda e basta: non si installa, non si riavvia, non si rinomina. La casa è sua.

      LA GRAFICA È QUELLA DEL CRUSCOTTO, E ANCHE IL PROGRAMMA DELLA SCHEDA.

      Le funzioni che disegnano la scheda di una casa — i controlli, la
      macchina, la rete, gli add-on, le note di un aggiornamento — sono
      copiate parola per parola dal cruscotto, e una prova tiene che restino
      uguali: due disegni per una cosa sola vogliono dire che uno dei due
      resta indietro, ed era sempre lo stesso.

      GLI STATI PORTANO UNA FORMA, UNA PAROLA E UN COLORE.

      Un colore da solo non basta mai: ogni stato porta anche la parola, e
      dove si legge in fretta una forma. Vale per le case e vale per gli
      installatori: a posto, al limite, congelato, mai entrato.

      LA CHIAVE SI VEDE UNA VOLTA SOLA.

      Quando aggiungi un installatore, la chiave esce in chiaro adesso e mai
      più: qui resta solo la sua impronta. Per questo il momento in cui
      compare è la cosa più grossa della pagina, e ci sta scritto sopra che
      non tornerà.
    -->
    <style>
      /* ═══════════════════════════════════════════════════════════════════
         AURORA.

         Luminoso, morbido, leggibile. Vetro smerigliato su un cielo che
         sfuma, angoli larghi, un carattere solo — Manrope, servito da questo
         quadro — in cinque pesi, e nessuna scritta in maiuscolo. Un colore
         non sta mai da solo: accanto a un pallino verde c'e' sempre la
         parola, perche' un pallino da solo non dice niente a nessuno.
         ═══════════════════════════════════════════════════════════════════ */

      /* Il carattere lo serve il quadro, da `/carattere/…`: questo browser
         non va a farsi vedere da Google per una pagina nostra. `../` conta
         dalla pagina, che sta in `/console/`, e vale anche dietro un proxy. */
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("../carattere/manrope-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("../carattere/manrope-latin-ext.woff2") format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      :root {
        color-scheme: light;

        --ground: #f4f5fa;
        --cielo-a: #cfdcff;
        --cielo-b: #e8dcff;
        --cielo-c: #d4f3e8;

        --vetro: rgba(255, 255, 255, 0.64);
        --vetro-pieno: rgba(255, 255, 255, 0.9);
        --vetro-bordo: rgba(255, 255, 255, 0.9);
        --linea: rgba(23, 26, 43, 0.08);
        --linea-forte: rgba(23, 26, 43, 0.14);

        --ink: #171a2b;
        --ink-2: #565c74;
        --ink-3: #8a8fa5;

        --accento: #2f7cf6;
        --accento-soft: rgba(47, 124, 246, 0.12);

        /* I tre stati. Passano la prova del daltonismo e del contrasto su
           questo fondo, e in ogni caso non stanno mai senza la parola. */
        --verde: #16a37a;
        --ambra: #d98a0f;
        --rosso: #e4405f;
        --verde-soft: rgba(22, 163, 122, 0.13);
        --ambra-soft: rgba(217, 138, 15, 0.14);
        --rosso-soft: rgba(228, 64, 95, 0.12);
        --verde-luce: rgba(22, 163, 122, 0.28);
        --ambra-luce: rgba(217, 138, 15, 0.3);
        --rosso-luce: rgba(228, 64, 95, 0.28);

        --ombra: 0 1px 2px rgba(23, 26, 43, 0.04), 0 10px 30px rgba(23, 26, 43, 0.07);
        --ombra-alta: 0 4px 10px rgba(23, 26, 43, 0.06), 0 30px 70px rgba(23, 26, 43, 0.16);

        --r-grande: 26px;
        --r: 20px;
        --r-piccolo: 14px;
        --molla: cubic-bezier(0.22, 1, 0.36, 1);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --ground: #0e1120;
          --cielo-a: #1b2a5c;
          --cielo-b: #2a1f5a;
          --cielo-c: #0f3a3d;

          --vetro: rgba(255, 255, 255, 0.055);
          --vetro-pieno: rgba(24, 28, 46, 0.92);
          --vetro-bordo: rgba(255, 255, 255, 0.1);
          --linea: rgba(255, 255, 255, 0.08);
          --linea-forte: rgba(255, 255, 255, 0.16);

          --ink: #eef0f7;
          --ink-2: #a8adc3;
          --ink-3: #737a95;

          --accento: #5aa0ff;
          --accento-soft: rgba(90, 160, 255, 0.16);

          --verde: #1fa877;
          --ambra: #bd851a;
          --rosso: #e0466a;
          --verde-soft: rgba(31, 168, 119, 0.16);
          --ambra-soft: rgba(189, 133, 26, 0.18);
          --rosso-soft: rgba(224, 70, 106, 0.16);
          --verde-luce: rgba(31, 168, 119, 0.4);
          --ambra-luce: rgba(189, 133, 26, 0.42);
          --rosso-luce: rgba(224, 70, 106, 0.4);

          --ombra: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 34px rgba(0, 0, 0, 0.35);
          --ombra-alta: 0 4px 10px rgba(0, 0, 0, 0.4), 0 34px 80px rgba(0, 0, 0, 0.55);
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --ground: #0e1120;
        --cielo-a: #1b2a5c;
        --cielo-b: #2a1f5a;
        --cielo-c: #0f3a3d;

        --vetro: rgba(255, 255, 255, 0.055);
        --vetro-pieno: rgba(24, 28, 46, 0.92);
        --vetro-bordo: rgba(255, 255, 255, 0.1);
        --linea: rgba(255, 255, 255, 0.08);
        --linea-forte: rgba(255, 255, 255, 0.16);

        --ink: #eef0f7;
        --ink-2: #a8adc3;
        --ink-3: #737a95;

        --accento: #5aa0ff;
        --accento-soft: rgba(90, 160, 255, 0.16);

        --verde: #1fa877;
        --ambra: #bd851a;
        --rosso: #e0466a;
        --verde-soft: rgba(31, 168, 119, 0.16);
        --ambra-soft: rgba(189, 133, 26, 0.18);
        --rosso-soft: rgba(224, 70, 106, 0.16);
        --verde-luce: rgba(31, 168, 119, 0.4);
        --ambra-luce: rgba(189, 133, 26, 0.42);
        --rosso-luce: rgba(224, 70, 106, 0.4);

        --ombra: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 34px rgba(0, 0, 0, 0.35);
        --ombra-alta: 0 4px 10px rgba(0, 0, 0, 0.4), 0 34px 80px rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ground);
        color: var(--ink);
        font:
          500 15px/1.5 "Manrope",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        font-variant-numeric: tabular-nums;
      }

      /* Mentre il foglio e' su, la pagina sotto non scorre: e' lui che scorre. */
      body.col-foglio {
        overflow: hidden;
      }

      /* Il cielo: tre macchie di luce che sfumano, ferme dietro tutto. */
      .cielo {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(60% 42% at 12% -6%, var(--cielo-a), transparent 70%),
          radial-gradient(52% 40% at 96% 8%, var(--cielo-b), transparent 70%),
          radial-gradient(48% 34% at 60% 108%, var(--cielo-c), transparent 70%);
      }

      .pagina {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin-inline: auto;
        padding: 8px 16px 48px;
      }

      a {
        color: var(--accento);
      }

      :focus-visible {
        outline: 3px solid var(--accento-soft);
        outline-offset: 2px;
        border-radius: 10px;
      }

      /* ─── Il saluto ──────────────────────────────────────────────────── */

      header {
        padding: 6px 0 12px;
      }

      .testata {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 52px;
      }

      /* Dentro Home Assistant, in cima a sinistra galleggia il tasto del
         menu: otto di stacco e quaranta di tasto. Lo spazio glielo si
         lascia, e non solo qui — anche la barra, che quando la pagina scorre
         sta in cima al posto del saluto. `ponte/test/vestito` no, ma
         `il-tasto-del-menu-ha-il-suo-posto` questo numero lo tiene d'occhio. */
      :root[data-dentro] .testata {
        padding-inline-start: 56px;
      }

      .tondo {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        background: linear-gradient(140deg, var(--accento), #8b7cf6);
        color: #fff;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: -0.02em;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 18px rgba(47, 124, 246, 0.35);
        overflow: hidden;
      }

      /* Il marchio dell'installatore, se ne ha messo uno, prende il posto
         delle iniziali. Su bianco: un logo e' disegnato per il bianco. */
      .tondo .suoMarchio {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        padding: 3px;
      }

      .tondo .suoMarchio:not([hidden]) + span {
        display: none;
      }

      .nomi {
        min-width: 0;
        flex: 1;
      }

      .nomi h1,
      .nomi h2 {
        margin: 0;
        font-size: 1.18rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .nomi p {
        margin: 2px 0 0;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .vivo {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-2);
        cursor: pointer;
        white-space: nowrap;
      }

      .vivo i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 0 var(--verde-luce);
        animation: respiro 2.4s ease-out infinite;
      }

      .vivo[aria-busy="true"] i {
        background: var(--accento);
        animation: none;
      }

      @keyframes respiro {
        0% {
          box-shadow: 0 0 0 0 var(--verde-luce);
        }
        70% {
          box-shadow: 0 0 0 8px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      /* ─── La barra: sta in cima, e ci resta mentre scorri ─────────────── */

      .barra {
        position: sticky;
        /* Zero, e non `env(safe-area-inset-top)`: dentro l'app quel valore
           e' gia' speso dal riquadro che ci contiene, e contarlo due volte
           lasciava una fascia vuota sopra la barra. */
        top: 0;
        z-index: 40;
        display: flex;
        gap: 4px;
        padding: 5px;
        margin: 0 0 14px;
        border-radius: 999px;
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        backdrop-filter: blur(28px) saturate(1.6);
        -webkit-backdrop-filter: blur(28px) saturate(1.6);
      }

      .barra:empty {
        display: none;
      }

      /* Quello che scorre sotto la barra non deve leggersi attraverso: un
         velo del colore del fondo, prima del vetro. */
      .barra::before {
        content: "";
        position: absolute;
        inset: -8px -16px -16px;
        z-index: -1;
        background: linear-gradient(180deg, var(--ground) 0 calc(100% - 16px), transparent);
        pointer-events: none;
      }

      :root[data-dentro] .barra {
        margin-inline-start: 56px;
      }

      :root[data-dentro] .barra::before {
        left: -72px;
      }

      .barra button {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-weight: 700;
        font-size: 0.86rem;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        transition:
          color 0.2s,
          background 0.25s;
      }

      .barra button svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .barra button[aria-pressed="true"] {
        color: var(--accento);
        background: var(--accento-soft);
      }

      .barra .quanti {
        min-width: 18px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--ambra-soft);
        color: var(--ink);
        font-size: 0.7rem;
        font-weight: 800;
      }

      /* ─── Il vetro ───────────────────────────────────────────────────── */

      .vetro {
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        backdrop-filter: blur(22px) saturate(1.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
      }

      /* Il riquadro e' il vetro con dentro un capitolo della scheda. Senza
         sfocatura: ce ne sono venti in un foglio, e venti sfocature sul
         telefono si sentono. Il fondo quasi pieno rende uguale. */
      .riquadro {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        padding: 18px 18px 16px;
        margin: 0 0 12px;
      }

      .riquadro.tinto {
        background: var(--vetro-pieno);
        border-color: var(--accento-soft);
        box-shadow:
          0 0 0 1px var(--accento-soft),
          var(--ombra);
      }

      .capoRiquadro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 12px;
      }

      .capoRiquadro h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .capoRiquadro .conta {
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }

      .voce {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 26px 2px 12px;
      }

      .voce h2,
      .capitolo h2 {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .voce span,
      .capitolo span {
        font-size: 0.82rem;
        color: var(--ink-3);
        font-weight: 600;
      }

      /* I capitoli della scheda: cosa mi tocca, come sta, cos'e' di preciso. */
      .capitolo {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 2px 12px;
        /* Di lato niente: il titolo di un capitolo sta in riga con le carte
           che intitola, e i quattro pixel di rientro lo portavano fuori. */
        margin: 24px 0 10px;
      }

      .titolone {
        margin: 6px 2px 4px;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      .sottotitolo {
        margin: 0 2px 18px;
        color: var(--ink-2);
        max-width: 62ch;
        line-height: 1.55;
      }

      .nota {
        margin: 0;
        color: var(--ink-2);
        font-size: 0.88rem;
        line-height: 1.55;
      }

      .minuta {
        margin: 0 0 12px;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.86em;
        letter-spacing: 0.01em;
      }

      .comeUnLink {
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        font-weight: 700;
        color: var(--accento);
        cursor: pointer;
        text-align: left;
      }

      /* ─── Le pastiglie: una parola, un colore, una forma ─────────────── */

      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--linea);
        color: var(--ink-2);
        font-size: 0.76rem;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        vertical-align: middle;
      }

      .pastiglia.bene,
      .pastiglia.posto {
        background: var(--verde-soft);
        color: var(--verde);
      }

      .pastiglia.attenta,
      .pastiglia.guardare,
      .pastiglia.lavoro {
        background: var(--ambra-soft);
        color: var(--ambra);
      }

      .pastiglia.male,
      .pastiglia.offline {
        background: var(--rosso-soft);
        color: var(--rosso);
      }

      .pastiglia b {
        font-weight: 800;
      }

      /* ─── I tasti ────────────────────────────────────────────────────── */

      .tasto {
        font: inherit;
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--ink);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea-forte);
        border-radius: 999px;
        padding: 9px 16px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          transform 0.2s var(--molla),
          background 0.2s,
          box-shadow 0.2s;
      }

      .tasto:hover {
        box-shadow: var(--ombra);
      }

      .tasto:active {
        transform: scale(0.97);
      }

      .tasto.forte {
        background: linear-gradient(140deg, var(--accento), #6f8cff);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 20px rgba(47, 124, 246, 0.32);
      }

      .tasto.male {
        color: var(--rosso);
        border-color: transparent;
        background: var(--rosso-soft);
      }

      .tasto[data-sicuro="sì"] {
        background: var(--rosso);
        border-color: transparent;
        color: #fff;
      }

      .tasto.grande {
        padding: 12px 22px;
        font-size: 0.95rem;
      }

      .tasto.copia {
        flex: none;
      }

      .tasto:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
      }

      .azioni {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }

      .azioni .nota {
        flex-basis: 100%;
      }

      input[type="text"],
      input[type="url"],
      input[type="password"] {
        font: inherit;
        color: var(--ink);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea-forte);
        border-radius: 14px;
        padding: 10px 14px;
        min-width: 0;
        flex: 1 1 14rem;
      }

      input[type="text"]:focus,
      input[type="url"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--accento);
        box-shadow: 0 0 0 3px var(--accento-soft);
      }

      input[type="file"] {
        font: inherit;
        font-size: 0.86rem;
        color: var(--ink-2);
        max-width: 100%;
      }

      /* ─── L'anello: la flotta in un colpo d'occhio ───────────────────── */

      .anello-scheda {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 22px;
        align-items: center;
        padding: 20px 20px 18px;
        border-radius: var(--r-grande);
      }

      .anello {
        width: 138px;
        height: 138px;
        position: relative;
        display: grid;
        place-items: center;
      }

      .anello svg,
      .anellino svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .anello circle,
      .anellino circle {
        fill: none;
        stroke-linecap: butt;
      }

      .anello circle {
        stroke-width: 11;
      }

      .anellino circle {
        stroke-width: 7;
        stroke-linecap: round;
      }

      .traccia {
        stroke: var(--linea);
      }

      /* Il colore di un arco sta nel suo attributo `stroke`, scritto da chi
         lo disegna: una regola `stroke` qui lo batterebbe, e tutti gli archi
         verrebbero dello stesso colore. Qui c'e' solo come si apre. */
      .arco {
        transition: stroke-dasharray 0.9s var(--molla);
      }

      .anello .dentro {
        text-align: center;
        line-height: 1;
      }

      .anello .dentro b {
        display: block;
        font-size: 2.35rem;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .anello .dentro span {
        display: block;
        margin-top: 5px;
        font-size: 0.78rem;
        color: var(--ink-2);
        font-weight: 600;
      }

      .titolo-flotta {
        margin: 0;
        font-size: 1.28rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.2;
        text-wrap: balance;
      }

      .titolo-flotta em {
        font-style: normal;
        color: var(--accento);
      }

      .sotto-flotta {
        margin: 4px 0 0;
        color: var(--ink-2);
        font-size: 0.9rem;
      }

      /* Le tre file: pallino, numero, parola. Si premono, e filtrano. */
      .file {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .fila {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        padding: 11px 12px 10px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.25s var(--molla),
          box-shadow 0.25s,
          background 0.25s;
      }

      .fila:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra);
      }

      .fila[aria-pressed="true"] {
        background: var(--vetro-pieno);
        box-shadow:
          0 0 0 2px var(--tinta),
          var(--ombra);
      }

      .fila i {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 50%;
        background: var(--tinta);
        box-shadow: 0 0 0 3px var(--tinta-soft);
      }

      .fila b {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .fila span {
        display: block;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--ink-2);
        line-height: 1.15;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fila span i {
        display: inline-block;
        vertical-align: middle;
        margin: -2px 6px 0 0;
      }

      /* Il colore di uno stato, per chi lo porta: la fila, la carta, la
         mattonella, la spia. Tre nomi che sono quelli del server. */
      [data-stato="offline"] {
        --tinta: var(--rosso);
        --tinta-soft: var(--rosso-soft);
        --tinta-luce: var(--rosso-luce);
      }
      [data-stato="guardare"] {
        --tinta: var(--ambra);
        --tinta-soft: var(--ambra-soft);
        --tinta-luce: var(--ambra-luce);
      }
      [data-stato="posto"] {
        --tinta: var(--verde);
        --tinta-soft: var(--verde-soft);
        --tinta-luce: var(--verde-luce);
      }

      /* ─── Da guardare adesso: le carte che scorrono di lato ──────────── */

      .scorri {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 16px 18px;
        margin: 0 -16px;
        scrollbar-width: none;
      }

      .scorri::-webkit-scrollbar {
        display: none;
      }

      .carta {
        flex: 0 0 min(78vw, 300px);
        scroll-snap-align: start;
        position: relative;
        overflow: hidden;
        padding: 18px 18px 16px;
        border-radius: var(--r-grande);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 196px;
        transition:
          transform 0.3s var(--molla),
          box-shadow 0.3s;
      }

      .carta:hover {
        transform: translateY(-3px);
        box-shadow: var(--ombra-alta);
      }

      /* La luce: una macchia morbida del colore dello stato, in alto a destra. */
      .carta::before {
        content: "";
        position: absolute;
        top: -70px;
        right: -60px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--tinta-luce), transparent 65%);
        pointer-events: none;
      }

      .carta .stato,
      .mattonella .riga {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        align-self: flex-start;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--ink);
      }

      .carta .stato {
        padding: 5px 11px 5px 9px;
        border-radius: 999px;
        background: var(--tinta-soft);
      }

      .carta .stato i,
      .mattonella .riga i {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--tinta);
      }

      .carta h3 {
        position: relative;
        margin: 2px 0 0;
        font-size: 1.22rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .carta h3 small {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-3);
      }

      .carta .perche {
        position: relative;
        margin: 0;
        color: var(--ink-2);
        font-size: 0.92rem;
        line-height: 1.45;
        flex: 1;
      }

      .carta .piede {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
        font-size: 0.8rem;
        color: var(--ink-3);
      }

      .carta .piede b {
        color: var(--accento);
        font-weight: 700;
      }

      /* ─── Tutti gli impianti: le mattonelle ──────────────────────────── */

      .mattonelle {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .mattonella {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        box-shadow: var(--ombra);
        padding: 14px 14px 12px;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          transform 0.3s var(--molla),
          box-shadow 0.3s;
      }

      .mattonella:hover {
        transform: translateY(-2px);
        box-shadow: var(--ombra-alta);
      }

      /* La riga della casa aperta: col foglio che sale non serviva — era
         sopra, e si vedeva — ma con la scheda accanto l'elenco resta li' e
         bisogna riconoscere quale si sta leggendo. */
      .case-sue li[aria-current="true"] {
        box-shadow:
          0 0 0 2px var(--accento),
          var(--ombra);
      }

      .mattonella[aria-current="true"] {
        box-shadow:
          0 0 0 2px var(--accento),
          var(--ombra);
      }

      .mattonella .nome {
        font-size: 0.98rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.22;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
        min-height: 2.44em;
      }

      .mattonella .nome small {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-3);
      }

      .mattonella .riga {
        color: var(--ink-2);
        font-weight: 600;
        white-space: nowrap;
      }

      .mattonella .riga i {
        box-shadow: 0 0 0 3px var(--tinta-soft);
        transition: box-shadow 0.4s;
      }

      /* Un rapporto appena arrivato: il pallino batte una volta. */
      .mattonella.arrivato .riga i {
        animation: battito 1.2s ease-out;
      }

      @keyframes battito {
        0% {
          box-shadow: 0 0 0 3px var(--tinta-soft);
        }
        40% {
          box-shadow: 0 0 0 9px transparent;
        }
        100% {
          box-shadow: 0 0 0 3px var(--tinta-soft);
        }
      }

      .mattonella .quando {
        display: block;
        margin-top: -4px;
        font-size: 0.75rem;
        color: var(--ink-3);
        font-weight: 500;
      }

      .linea {
        position: relative;
        display: block;
        width: 100%;
        height: 34px;
      }

      .linea-viva {
        width: 100%;
        height: 100%;
        display: block;
      }

      .linea .punto {
        position: absolute;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: var(--tinta);
        border: 2px solid var(--vetro-pieno);
        box-sizing: border-box;
      }

      .vuoto {
        padding: 34px 18px;
        text-align: center;
        color: var(--ink-2);
        border-radius: var(--r-grande);
        line-height: 1.5;
      }

      .vuoto b {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 4px;
      }

      /* ─── Il foglio che sale: la scheda di una casa ──────────────────── */

      .velo {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(14, 17, 32, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 0.3s;
      }

      .velo.su {
        opacity: 1;
      }

      .foglio {
        position: fixed;
        z-index: 51;
        left: 50%;
        bottom: 0;
        width: min(100%, 680px);
        max-height: 92vh;
        max-height: 92dvh;
        display: flex;
        flex-direction: column;
        background: var(--ground);
        border: 1px solid var(--vetro-bordo);
        border-bottom: 0;
        border-radius: 28px 28px 0 0;
        box-shadow: var(--ombra-alta);
        transform: translate(-50%, 104%);
        transition: transform 0.42s var(--molla);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .foglio.su {
        transform: translate(-50%, 0);
      }

      .presa {
        padding: 10px 0 2px;
        display: grid;
        place-items: center;
        flex: none;
      }

      .presa i {
        width: 40px;
        height: 5px;
        border-radius: 999px;
        background: var(--linea-forte);
      }

      .foglio-testa {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px 12px;
        flex: none;
      }

      .foglio-testa h2 {
        font-size: 1.3rem;
      }

      /* Venti, come la testata e i tasti.
       *
       * Erano sedici, e dentro la scheda i bordi sinistri erano due: il nome
       * della casa e i titoli dei capitoli a venti, le carte che quei titoli
       * intitolano a sedici. Quattro pixel. Con il foglio che saliva dal
       * basso, largo quanto un telefono, non li notava nessuno; da quando la
       * scheda sta accanto a un elenco allineato, si vedono. */
      .foglio-corpo {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 20px 24px;
        -webkit-overflow-scrolling: touch;
      }

      .foglio-tasti {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--linea);
        flex: none;
      }

      .foglio-tasti:empty {
        display: none;
      }

      /* Quello che non va, e basta: e' la prima cosa che si vede aprendo
         una casa da «Da guardare adesso». */
      .guai {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .guai li {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--ambra-soft);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .guai li[data-grave="true"] {
        background: var(--rosso-soft);
      }

      .guai li i {
        width: 9px;
        height: 9px;
        flex: none;
        margin-top: 0.42em;
        border-radius: 50%;
        background: var(--ambra);
      }

      .guai li[data-grave="true"] i {
        background: var(--rosso);
      }

      .guai b {
        font-weight: 800;
      }

      .tre-anelli {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 0 0 6px;
      }

      .anellino {
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        border-radius: var(--r);
        padding: 12px 8px 10px;
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .anellino .cerchio {
        width: 64px;
        height: 64px;
        position: relative;
        display: grid;
        place-items: center;
      }

      .anellino b {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .anellino .cerchio b.attenta {
        color: var(--ambra);
      }

      .anellino .cerchio b.male {
        color: var(--rosso);
      }

      .anellino span {
        font-size: 0.76rem;
        color: var(--ink-2);
        font-weight: 600;
        line-height: 1.2;
      }

      .anellino small {
        font-size: 0.72rem;
        color: var(--ink-3);
        line-height: 1.2;
      }

      .nonLoDice {
        color: var(--ink-3);
        font-weight: 600;
        font-size: 0.8rem;
      }

      /* ─── Dentro la scheda ───────────────────────────────────────────── */

      .perché {
        margin: 0 0 12px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--ink);
        font-weight: 600;
      }

      .targa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px 14px;
        margin: 0;
      }

      .targa div {
        min-width: 0;
      }

      .targa dt {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--ink-3);
        margin: 0 0 2px;
      }

      .targa dd {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      /* I nomi scelti per le plance: si leggono, e basta. Una colonna larga
         per plancia: due nomi su due righe, senza andare a capo a meta'. */
      .targa.vesti-lette {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .vesti-lette dd {
        font-weight: 500;
        line-height: 1.5;
      }

      .vesti-lette dd b {
        font-weight: 700;
      }

      .rinomina {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .rinomina[hidden] {
        display: none;
      }

      /* La riga che dice cosa questo quadro puo' e non puo' fare. */
      .limite,
      .avvertenza,
      .cartello {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin: 14px 0 0;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--accento-soft);
        font-size: 0.86rem;
        line-height: 1.5;
        color: var(--ink-2);
      }

      .limite b,
      .avvertenza b,
      .cartello b {
        color: var(--ink);
      }

      .cartello {
        margin: 0 0 14px;
      }

      .cartello.bene {
        background: var(--verde-soft);
      }

      .cartello.male {
        background: var(--rosso-soft);
      }

      .gettone {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--vetro-pieno);
        color: var(--accento);
        font-weight: 800;
        font-size: 0.8rem;
      }

      .cartello.bene .gettone {
        color: var(--verde);
      }

      .cartello.male .gettone {
        color: var(--rosso);
      }

      /* I dieci controlli: la spunta, il nome, come va. */
      .controlli {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .controlli li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 2px;
        border-top: 1px solid var(--linea);
        font-size: 0.93rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .controlli li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .bollino {
        width: 26px;
        height: 26px;
        flex: none;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 0.75rem;
        font-weight: 800;
        background: var(--linea);
        color: var(--ink-3);
      }

      .controlli li.bene .bollino {
        background: var(--verde-soft);
        color: var(--verde);
      }

      .controlli li.male .bollino {
        background: var(--rosso-soft);
        color: var(--rosso);
      }

      .controlli li.ignoto {
        color: var(--ink-2);
      }

      .controlli .cosa {
        flex: 1;
        min-width: 0;
      }

      .controlli .cosa b {
        font-weight: 800;
      }

      /* «— a posto» lo sente chi legge con le orecchie; per gli occhi c'e'
         gia' la spunta colorata. */
      .controlli .via {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .controlli .dettaglio {
        margin-left: auto;
        text-align: right;
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 500;
        max-width: 50%;
      }

      /* Le righe degli aggiornamenti: il segno, cosa e', cosa si fa. */
      .versi {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .versi li {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 11px 0;
        border-top: 1px solid var(--linea);
      }

      .versi li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .segno,
      .bollo {
        position: relative;
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.95rem;
        background: var(--accento-soft);
        color: var(--accento);
        overflow: hidden;
      }

      .segno img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 6px;
        background: #fff;
      }

      /* Il bollo di gdahome: tre barrette, disegnate qui e mai scaricate. */
      .bollo {
        background: linear-gradient(140deg, var(--accento), #8b7cf6);
        gap: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bollo i {
        display: block;
        width: 4px;
        height: 16px;
        border-radius: 2px;
        background: #fff;
      }

      .bollo i.mezzo {
        height: 10px;
      }

      .versi .che {
        flex: 1;
        min-width: 8rem;
      }

      .versi .che b {
        display: block;
        font-weight: 800;
        font-size: 0.95rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .versi .salto {
        font-size: 0.8rem;
        color: var(--ink-2);
      }

      .versi .fare {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .versi .cambia {
        flex-basis: 100%;
        margin: 0;
        color: var(--ink-2);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .versi .cambia .comeUnLink {
        font-size: 0.86rem;
      }

      /* ─── Le note di una versione, disegnate ─────────────────────────── */

      .leNote {
        flex-basis: 100%;
        margin: 4px 0 0;
        padding: 12px 14px 4px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        color: var(--ink-2);
        font-size: 0.92rem;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .leNote[hidden] {
        display: none;
      }

      .leNote > :first-child {
        margin-top: 0;
      }

      .leNote p {
        margin: 0 0 12px;
      }

      .leNote h3,
      .leNote h4,
      .leNote h5 {
        margin: 18px 0 8px;
        color: var(--ink);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .leNote h3 {
        font-size: 1.1rem;
      }

      .leNote h4 {
        font-size: 1rem;
      }

      .leNote h5 {
        font-size: 0.92rem;
      }

      .leNote strong {
        color: var(--ink);
        font-weight: 800;
      }

      .leNote ul {
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }

      .leNote li {
        position: relative;
        margin: 0 0 7px;
        padding-left: 18px;
      }

      .leNote li::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 0.65em;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accento);
      }

      .leNote li.r1 {
        margin-left: 18px;
      }

      .leNote li.r2 {
        margin-left: 36px;
      }

      .leNote li.r3 {
        margin-left: 54px;
      }

      .leNote hr {
        margin: 16px 0;
        border: 0;
        border-top: 1px solid var(--linea);
      }

      .leNote code {
        font-family: var(--mono);
        font-size: 0.86em;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accento-soft);
        color: var(--ink);
      }

      .leNote pre {
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea);
        overflow-x: auto;
      }

      .leNote pre code {
        padding: 0;
        background: none;
        white-space: pre;
      }

      .leNote a {
        color: var(--accento);
        font-weight: 700;
      }

      .verdetto {
        margin: 14px 0 0;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      .verdetto b {
        color: var(--ink);
      }

      /* La rete: le schede della macchina. */
      .schede {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .schede li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 9px 0;
        border-top: 1px solid var(--linea);
        font-size: 0.9rem;
      }

      .schede li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .lucina {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 3px var(--verde-soft);
        flex: none;
      }

      .schede li.giu .lucina {
        background: var(--ink-3);
        box-shadow: 0 0 0 3px var(--linea);
      }

      .schede .come {
        font-weight: 700;
      }

      .schede .tipo {
        font-weight: 700;
      }

      .schede li.giu .come {
        color: var(--ink-3);
      }

      .schede .dove {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-3);
      }

      /* Gli add-on: un pallino, il nome, e se dovrebbe girare. */
      .addon {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .addon .uno {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 11px 6px 9px;
        border-radius: 999px;
        background: var(--verde-soft);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .addon .uno.fermo {
        background: var(--rosso-soft);
      }

      .addon .uno.apposta {
        background: var(--linea);
        color: var(--ink-2);
      }

      .puntino {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--verde);
      }

      .uno.fermo .puntino {
        background: var(--rosso);
      }

      .uno.apposta .puntino {
        background: var(--ink-3);
      }

      /* Quattordici giorni, una cella al giorno. */
      .giorni {
        display: grid;
        grid-template-columns: repeat(14, 1fr);
        gap: 4px;
        margin: 4px 0 6px;
      }

      .giorni i {
        display: block;
        height: 22px;
        border-radius: 6px;
        background: var(--verde);
        opacity: 0.85;
      }

      .giorni.grande i {
        height: 30px;
      }

      .giorni i.mezza {
        background: var(--ambra);
      }

      .giorni i.vuota {
        background: var(--rosso);
      }

      .giorni i.prima {
        background: var(--linea);
        opacity: 1;
      }

      .giorniDice {
        font-size: 0.8rem;
        color: var(--ink-3);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .misure {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 0;
      }

      .misure div {
        padding: 10px 12px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        min-width: 0;
      }

      .misure dt {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--ink-3);
      }

      .misure dd {
        margin: 2px 0 0;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .misure dd.attenta {
        color: var(--ambra);
      }

      .misure dd.male {
        color: var(--rosso);
      }

      .misure dd small {
        display: block;
        margin-top: 3px;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0;
      }

      .nomiGiu,
      .giu {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 12px;
      }

      .nomiGiu span,
      .giu span {
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--rosso-soft);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .nomiGiu .eAltri {
        background: var(--linea);
        color: var(--ink-2);
      }

      .versioni {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .versioni td {
        padding: 8px 0;
        border-top: 1px solid var(--linea);
        vertical-align: middle;
      }

      .versioni tr:first-child td {
        border-top: 0;
        padding-top: 2px;
      }

      .versioni .numero {
        text-align: right;
        font-family: var(--mono);
        font-weight: 600;
        font-size: 0.86rem;
      }

      .rapporto summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .rapporto summary::-webkit-details-marker {
        display: none;
      }

      .rapporto summary::before {
        content: "›";
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 8px;
        background: var(--accento-soft);
        color: var(--accento);
        font-weight: 800;
        transition: transform 0.2s;
      }

      .rapporto[open] summary::before {
        transform: rotate(90deg);
      }

      .rapporto summary h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .rapporto pre {
        margin: 12px 0 0;
        padding: 12px 14px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--linea);
        font-family: var(--mono);
        font-size: 0.78rem;
        line-height: 1.5;
        overflow-x: auto;
        max-height: 24rem;
      }

      /* ─── Gli aggiornamenti, casa per casa ───────────────────────────── */

      .mucchio .capoRiquadro h3 .comeUnLink {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--ink);
      }

      .mucchio .capoRiquadro h3 .comeUnLink:hover {
        color: var(--accento);
      }

      /* ─── Abbina ─────────────────────────────────────────────────────── */

      .abbina {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }

      .colonna {
        min-width: 0;
      }

      .codice {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 4px;
        padding: 16px 18px;
        border-radius: var(--r);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea);
      }

      .cifre {
        flex: 1;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }

      .scadenza {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 600;
      }

      .battito {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--verde);
        box-shadow: 0 0 0 0 var(--verde-luce);
        animation: respiro 2.4s ease-out infinite;
      }

      .passi {
        margin: 0;
        padding: 0 0 0 1.6em;
        color: var(--ink-2);
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .passi li {
        margin-bottom: 8px;
        padding-left: 4px;
      }

      .passi li::marker {
        font-weight: 800;
        color: var(--accento);
      }

      .strada {
        font-weight: 700;
        color: var(--ink);
      }

      .righe {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .righe li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--linea);
      }

      .righe li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .righe .che {
        flex: 1;
        min-width: 10rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .righe .che b {
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .righe .che span {
        font-size: 0.82rem;
        color: var(--ink-2);
      }

      .provaMarchio {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
      }

      .provaMarchio .suoMarchio {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        object-fit: contain;
        background: #fff;
        border: 1px solid var(--linea);
        padding: 4px;
      }

      .provaMarchio .vuoto {
        width: 56px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 16px;
        border: 1px dashed var(--linea-forte);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .provaMarchio .azioni {
        margin-top: 0;
        flex: 1;
      }

      /* ─── L'avviso in basso ──────────────────────────────────────────── */

      .avviso {
        position: fixed;
        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 30px);
        z-index: 60;
        padding: 11px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--ground);
        font-weight: 700;
        font-size: 0.86rem;
        box-shadow: var(--ombra-alta);
        opacity: 0;
        transition:
          transform 0.35s var(--molla),
          opacity 0.25s;
        max-width: calc(100vw - 32px);
        text-align: center;
        pointer-events: none;
      }

      .avviso.su {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      footer {
        margin: 30px 2px 0;
        color: var(--ink-3);
        font-size: 0.8rem;
        line-height: 1.6;
        max-width: 60ch;
      }

      /* ─── Sullo schermo grande ───────────────────────────────────────── */

      @media (min-width: 46rem) {
        .mattonelle {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .anello {
          width: 160px;
          height: 160px;
        }
        .titolo-flotta {
          font-size: 1.5rem;
        }
        .abbina {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: start;
        }
        .targa {
          grid-template-columns: repeat(4, minmax(140px, 1fr));
        }
        .misure {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 64rem) {
        .mattonelle {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .scorri {
          margin: 0;
          padding: 4px 2px 18px;
        }
        .carta {
          flex-basis: 300px;
        }
      }

      @media (max-width: 30rem) {
        .barra button {
          padding: 10px 6px;
          font-size: 0.83rem;
          gap: 5px;
        }
        .barra button svg {
          display: none;
        }
        /* «da verificare» non ci sta su una riga: va a capo, non si tronca. */
        .fila span {
          white-space: normal;
        }
        .tre-anelli {
          gap: 6px;
        }
        .anellino {
          padding: 10px 4px 8px;
        }
        .controlli .dettaglio {
          max-width: 42%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ─── Solo per la gestione ───────────────────────────────────────── */

      /* ─── «Il servizio»: due macchine, una sotto l'altra ──────────────
       *
       * Prima erano due paragrafi in grassetto e cinque caselle stirate per
       * tutta la larghezza: il numero in alto a sinistra e mezzo riquadro
       * vuoto accanto. E quello che conta davvero — se il tramite risponde,
       * se il quadro si sta aggiornando — finiva in coda, in una riga di
       * testo grigio con i punti in mezzo.
       *
       * Adesso ogni macchina ha la sua testa: disegno, nome, e a destra la
       * pastiglia che dice come sta. I conti sono mattonelle che si contano
       * con l'occhio, larghe quanto serve e non di piu'. Gli interruttori
       * del tramite sono pastiglie con la spia, una per uno. */
      .servizio-blocco + .servizio-blocco {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--linea);
      }

      .servizio-capo {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 0 11px;
      }

      .servizio-ic {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--accento-soft);
        color: var(--accento);
      }

      .servizio-ic svg {
        width: 19px;
        height: 19px;
      }

      .servizio-chi {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .servizio-chi b {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .servizio-chi span {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-3);
        line-height: 1.3;
      }

      .servizio-capo .pastiglia {
        margin-left: auto;
        flex: none;
      }

      /* Larghe quanto un numero e la sua parola, e non piu' di cosi'.
       *
       * `auto-fill` e non `auto-fit`: le colonne che avanzano restano vuote
       * invece di sparire, e due mattonelle su un riquadro largo restano due
       * mattonelle — con `auto-fit` diventavano due lastre mezze vuote, che
       * e' com'erano prima.
       *
       * Il tetto della `minmax` resta `1fr` apposta: messo in cifra, il
       * browser conta le colonne sul tetto e non sul minimo, e sul telefono
       * ne veniva fuori una sola per riga. Largo e stretto li divide una
       * soglia, non il secondo numero. */
      .servizio-conti {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }

      @media (min-width: 36rem) {
        .servizio-conti {
          grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        }
      }

      .servizio-conto {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px 13px 11px;
        border-radius: var(--r-piccolo);
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
      }

      .servizio-conto-ic {
        width: 27px;
        height: 27px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--tinta-soft);
        color: var(--tinta);
      }

      .servizio-conto-ic svg {
        width: 15px;
        height: 15px;
      }

      .servizio-conto b {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .servizio-conto span {
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--ink-2);
        line-height: 1.25;
      }

      .servizio-conto.blu {
        --tinta: var(--accento);
        --tinta-soft: var(--accento-soft);
      }

      .servizio-conto.verde {
        --tinta: var(--verde);
        --tinta-soft: var(--verde-soft);
      }

      .servizio-conto.ambra {
        --tinta: var(--ambra);
        --tinta-soft: var(--ambra-soft);
      }

      /* Acceso o spento, uno per uno: la spia e la parola, mai la spia da
         sola. */
      .interruttori {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .interruttore {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
        background: var(--vetro);
        border: 1px solid var(--vetro-bordo);
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-2);
      }

      .interruttore i {
        width: 7px;
        height: 7px;
        flex: none;
        border-radius: 50%;
        background: var(--ink-3);
        box-shadow: 0 0 0 3px var(--linea);
      }

      .interruttore b {
        font-weight: 800;
        color: var(--ink-3);
      }

      .interruttore[data-acceso="sì"] {
        color: var(--ink);
      }

      .interruttore[data-acceso="sì"] i {
        background: var(--verde);
        box-shadow: 0 0 0 3px var(--verde-soft);
      }

      .interruttore[data-acceso="sì"] b {
        color: var(--verde);
      }

      /* ─── Affiancate: l'elenco a sinistra, la scheda accanto ─────────
       *
       * «Case a sinistra e se clicco mi apre il dettaglio affianco, non il
       * popup: non mi piace il popup.»
       *
       * Il foglio che sale dal basso e' giusto sul telefono, dove non c'e'
       * spazio per due cose insieme. Su uno schermo largo e' una scelta
       * pagata due volte: copre l'elenco da cui sei appena partito — con un
       * velo sfocato addosso — e per passare alla casa dopo tocca chiuderlo,
       * ritrovare il punto, e riaprire. Da quattordici pollici in su la
       * scheda sta accanto: l'elenco resta li' dove'era, si passa da una
       * casa all'altra con un colpo solo, e quella aperta si riconosce dal
       * bordo.
       *
       * Non cambia niente del programma che disegna la scheda: e' lo stesso
       * `ilFoglio()`, lo stesso `ilDettaglio()`, gli stessi tasti. Cambia
       * dove sta, e lo dice il foglio di stile. Sotto la soglia — telefono,
       * tablet in verticale — resta il foglio che sale, identico a prima.
       */
      .scheda-vuota {
        display: none;
      }

      @media (min-width: 62rem) {
        /* Col foglio accanto non c'e' piu' niente sopra la pagina, e la
           pagina deve tornare a scorrere: sotto la soglia il foglio la
           blocca apposta, perche' li' e' lui che scorre. */
        body.col-foglio {
          overflow: visible;
        }

        #dove {
          display: grid;
          grid-template-columns: minmax(300px, 32%) minmax(0, 1fr);
          column-gap: 16px;
          align-items: start;
          /* Lo stacco fra il riquadro in cima e la riga delle due colonne.
             E' quello che la pagina usa gia' fra una carta e il titolo che
             viene dopo — `.voce`, ventisei — e non un numero nuovo: prima
             quel vuoto lo faceva proprio lo stacco del titolo, e togliendolo
             per allineare le due colonne l'ho tolto anche alla pagina. La
             scritta «Tutti gli impianti» finiva attaccata alla carta sopra:
             fondo della carta a 424, titolo a 424. Zero.
             Un `row-gap` qui non si puo' usare: la riga e' la nona, e il
             vuoto si conterebbe otto volte. */
          --stacco-affianco: 26px;
        }

        #dove > * {
          grid-column: 1 / -1;
        }

        /* Il riquadro dell'anello parla di tutti gli impianti, non di uno:
           sta in cima, largo quanto la pagina. Come tutto quello che puo'
           venire dopo di lui e prima dell'elenco. */
        #dove > .anello-scheda {
          grid-column: 1 / -1;
          grid-row: 1;
        }

        /* Una riga numerata, e non quella che tocca.
           Fra l'anello e l'elenco ci possono stare una chiave appena
           generata, un riquadro, o niente: contando le righe, l'elenco e la
           sua scheda finirebbero su due righe diverse il giorno che una di
           quelle compare. Le righe vuote in mezzo non occupano niente,
           perche' fra una riga e l'altra non c'e' spazio. */

        /* L'elenco resta fermo mentre la scheda scorre.
         *
         * Il primo tentativo faceva il contrario — scheda attaccata in alto,
         * elenco che scorre — e non si attaccava niente: `sticky` si muove
         * dentro la sua riga di griglia, e la scheda era **alta quanto la
         * riga**. Gioco zero, e se ne andava su con la pagina, col titolo che
         * finiva sotto la barra. Girata: la riga e' alta quanto la scheda, che
         * e' quasi sempre la piu' lunga, e il gioco ce l'ha l'elenco. Il
         * giorno che e' l'elenco a essere piu' lungo, si attacca la scheda: e'
         * la stessa regola, e va bene in tutt'e due i versi.
         *
         * Il tetto e lo scorrimento suo servono a chi ha quaranta impianti:
         * senza, l'elenco sarebbe piu' alto dello schermo e non si
         * attaccherebbe piu' niente. */
        #dove > .colonna-elenco {
          grid-column: 1;
          grid-row: 9;
          min-width: 0;
          position: sticky;
          top: 66px;
          max-height: calc(100vh - 80px);
          max-height: calc(100dvh - 80px);
          overflow-y: auto;
          overscroll-behavior: contain;
          scrollbar-width: thin;
          /* Il respiro per il sollevamento e l'ombra sta **solo** sopra e
             sotto, ed e' ripreso dal margine: di lato spostava la colonna
             cinque pixel fuori da tutto il resto — il riquadro in cima
             cominciava a 126, l'elenco a 121, e si vedeva. */
          /* Il respiro di quattro sopra e sotto si toglie dal margine, cosi'
             il contenuto della colonna comincia esattamente dove comincia la
             scheda accanto. */
          padding: 4px 0;
          margin: calc(var(--stacco-affianco) - 4px) 0 -4px;
        }

        /* Le due colonne cominciano alla stessa altezza.
           Il titolo di una raccolta si stacca da quello che ha sopra, e in
           mezzo alla pagina e' giusto; in cima a una colonna no — lasciava
           la prima riga dell'elenco sessanta pixel piu' in basso del bordo
           della scheda accanto. E il rientro di due pixel lo portava fuori
           squadro con le righe sotto. */
        #dove > .colonna-elenco > :first-child,
        /* Il titolo, e non «il primo figlio»: nel cruscotto il primo figlio
           e' il blocco «Da verificare ora», che qui e' nascosto — nascosto ma
           primo, e il margine glielo toglieva a lui mentre il titolo vero
           restava sessanta pixel piu' in basso. Di titoli in cima alla
           colonna ce n'e' uno solo, in tutt'e due le pagine. */
        #dove > .colonna-elenco > .voce {
          margin-top: 0;
        }

        #dove > .colonna-elenco .voce {
          margin-inline: 0;
        }

        #dove > .riquadro.larga {
          grid-column: 1 / -1;
          grid-row: 10;
        }

        #dove > .scheda-vuota,
        #dove > .foglio {
          grid-column: 2;
          grid-row: 9;
          margin-top: var(--stacco-affianco);
        }

        /* Il velo copriva quello che adesso si vuole continuare a vedere. */
        #dove > .velo {
          display: none;
        }

        /* Il foglio smette di essere un foglio: niente piu' `fixed`, niente
           salita dal basso, e si attacca in alto mentre l'elenco scorre. */
        /* La scheda cresce quanto le serve e scorre con la pagina: dentro non
           ha piu' una barra di scorrimento sua, che in un riquadro dentro un
           riquadro e' una barra di troppo. Si attacca sotto quella delle
           schermate solo quando e' lei la piu' corta. */
        #dove > .foglio {
          position: sticky;
          top: 66px;
          left: auto;
          bottom: auto;
          width: auto;
          max-height: none;
          border: 1px solid var(--vetro-bordo);
          border-radius: var(--r);
          box-shadow: var(--ombra);
          transform: none;
          transition: none;
          padding-bottom: 0;
        }

        #dove > .foglio .foglio-corpo {
          overflow: visible;
        }

        #dove > .foglio.su {
          transform: none;
        }

        /* La presa si tira col pollice, e accanto non c'e' niente da tirare. */
        #dove > .foglio .presa {
          display: none;
        }

        /* Il nome della casa resta in vista mentre si legge la sua scheda:
           scorrendo in fondo ai controlli, senza, non si sa piu' di chi si
           sta leggendo. */
        #dove > .foglio .foglio-testa {
          position: sticky;
          top: 0;
          z-index: 1;
          padding-top: 18px;
          background: var(--ground);
          border-radius: var(--r) var(--r) 0 0;
        }

        /* Il posto della scheda quando non se n'e' aperta nessuna: se restasse
           vuoto, la pagina sembrerebbe finita a meta'. */
        #dove > .scheda-vuota {
          display: grid;
          align-content: center;
          justify-items: center;
          gap: 6px;
          min-height: 320px;
          padding: 40px 24px;
          border: 1px dashed var(--linea-forte);
          border-radius: var(--r);
          text-align: center;
          color: var(--ink-3);
        }

        #dove > .scheda-vuota b {
          font-size: 1rem;
          font-weight: 800;
          color: var(--ink-2);
        }

        body.col-foglio #dove > .scheda-vuota {
          display: none;
        }
      }

      /* Le tre file qui contano e basta: non filtrano niente. */
      .fila.ferma {
        cursor: default;
      }

      .fila.ferma:hover {
        transform: none;
        box-shadow: none;
      }

      /* Gli stati di un installatore, oltre ai tre delle case. */
      [data-stato="quieta"],
      [data-stato="congelato"] {
        --tinta: var(--ink-3);
        --tinta-soft: var(--linea);
        --tinta-luce: var(--linea);
      }

      [data-stato="limite"] {
        --tinta: var(--ambra);
        --tinta-soft: var(--ambra-soft);
        --tinta-luce: var(--ambra-luce);
      }

      .installatori {
        display: grid;
        gap: 10px;
      }

      .installatore {
        padding: 16px 16px 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        align-items: center;
      }

      .installatore .tondo {
        width: 46px;
        height: 46px;
        grid-row: 1 / 3;
        border-radius: 15px;
        background: var(--accento-soft);
        color: var(--accento);
        box-shadow: none;
      }

      .installatore[data-stato="congelato"] .tondo {
        background: var(--linea);
        color: var(--ink-3);
      }

      .installatore h3 {
        margin: 0;
        min-width: 0;
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.2;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        overflow-wrap: anywhere;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 8px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
        background: var(--tinta-soft);
        color: var(--ink);
        white-space: nowrap;
      }

      .pill i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--tinta);
      }

      .installatore .visto {
        margin: 0;
        color: var(--ink-2);
        font-size: 0.84rem;
      }

      .posti {
        grid-column: 1 / -1;
        margin-top: 6px;
      }

      .posti .conto {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 0.84rem;
        color: var(--ink-2);
        margin-bottom: 6px;
      }

      .posti .conto b {
        font-size: 1rem;
        color: var(--ink);
        font-weight: 800;
      }

      .metro {
        height: 9px;
        border-radius: 999px;
        background: var(--linea);
        overflow: hidden;
      }

      .metro i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accento), #8b7cf6);
        transition: width 0.8s var(--molla);
      }

      .installatore[data-stato="limite"] .metro i {
        background: var(--ambra);
      }

      /* Le case dell'installatore: nome, come sta, e quante entita' ha. */
      .case-sue {
        grid-column: 1 / -1;
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }

      .case-sue li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 2px 11px;
        align-items: center;
        padding: 10px 12px;
        border-radius: var(--r-piccolo);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        cursor: pointer;
        transition:
          transform 0.25s var(--molla),
          box-shadow 0.25s;
      }

      .case-sue li:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra);
      }

      .case-sue .punto {
        grid-column: 1;
        grid-row: 1 / 3;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--tinta);
        box-shadow: 0 0 0 3px var(--tinta-soft);
      }

      .case-sue .nome {
        grid-column: 2;
        grid-row: 1;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: -0.015em;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .case-sue .nome small {
        font-weight: 600;
        color: var(--ink-3);
        font-size: 0.8rem;
        margin-left: 6px;
      }

      .case-sue .come {
        grid-column: 2;
        grid-row: 2;
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink-2);
        font-weight: 600;
      }

      .case-sue .entita {
        grid-column: 3;
        grid-row: 1 / 3;
        text-align: right;
        line-height: 1.1;
      }

      .case-sue .entita b {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .case-sue .entita span {
        font-size: 0.72rem;
        color: var(--ink-3);
        font-weight: 600;
      }

      .case-sue .nessuna {
        display: block;
        padding: 10px 12px;
        color: var(--ink-3);
        font-size: 0.86rem;
        cursor: default;
        background: none;
        border: 0;
      }

      .case-sue .nessuna:hover {
        transform: none;
        box-shadow: none;
      }

      .installatore .tasti {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
      }

      .installatore .tasti .tasto {
        padding: 8px 13px;
        font-size: 0.83rem;
      }

      /* Quello che succede premendo: compare al primo tocco, sotto i tasti. */
      .installatore .spiega {
        grid-column: 1 / -1;
        margin-top: 8px;
      }

      /* Le due righe che si aprono sotto i tasti: il nome e il limite. */
      .rigaNome,
      .rigaLimite {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .rigaNome[hidden],
      .rigaLimite[hidden] {
        display: none;
      }

      .rigaNome input {
        flex: 1 1 12rem;
        min-width: 0;
        font-weight: 700;
      }

      .rigaLimite input {
        flex: 0 0 6rem;
        font-weight: 700;
      }

      .rigaNome .nota,
      .rigaLimite .nota {
        flex-basis: auto;
      }

      input[type="number"] {
        font: inherit;
        color: var(--ink);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea-forte);
        border-radius: 14px;
        padding: 10px 14px;
        min-width: 0;
      }

      input[type="number"]:focus {
        outline: none;
        border-color: var(--accento);
        box-shadow: 0 0 0 3px var(--accento-soft);
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
        min-width: 0;
      }

      .campo label {
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--ink-2);
      }

      /* `flex: none`: dentro una colonna, il `flex-basis` delle caselle del
         cruscotto diventerebbe un'altezza, e la casella si allungherebbe. */
      .campo input {
        width: 100%;
        flex: none;
      }

      .due-campi {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 7rem;
        gap: 10px;
      }

      /* La chiave appena fatta: la cosa piu' grossa della pagina, per il
         tempo che ci sta. */
      .chiave-nuova {
        margin: 0 0 12px;
        padding: 16px 18px;
        border-radius: var(--r);
        background: var(--verde-soft);
        border: 1px solid var(--vetro-bordo);
      }

      .chiave-nuova b {
        font-weight: 800;
      }

      .chiave-nuova > b {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }

      .chiave-nuova p {
        margin: 0 0 10px;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .chiave-nuova .valore {
        font-family: var(--mono);
        font-size: 0.92rem;
        font-weight: 600;
        word-break: break-all;
        padding: 11px 13px;
        border-radius: var(--r-piccolo);
        background: var(--vetro-pieno);
        border: 1px solid var(--linea);
      }

      .sola-lettura-riga {
        margin: 4px 0 12px;
      }

      .sola-lettura {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--accento-soft);
        color: var(--accento);
        font-size: 0.78rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="cielo" aria-hidden="true"></div>

    <div class="pagina">
      <header>
        <!-- Niente bollo, come nel cruscotto e per la stessa ragione: questa
             pagina si apre dentro Home Assistant, e il tasto del menu
             galleggia proprio li' sopra. Il tondo porta «gd», che e' il
             quadro. -->
        <div class="testata">
          <div class="tondo" aria-hidden="true"><span>gd</span></div>
          <div class="nomi">
            <h1>Cruscotto gdahome</h1>
            <p id="sottotitolo"></p>
          </div>
          <button
            type="button"
            class="vivo"
            id="vivo"
            title="Si aggiorna da sola. Premi per aggiornare adesso."
          >
            <i></i><span id="vivo-dice">Aggiorna</span>
          </button>
