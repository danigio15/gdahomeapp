        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      /* I codici appena fatti: uno sotto l'altro, da copiare tutti insieme. */
      .codici-fatti {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 6px;
      }

      /* Il pacchetto di un installatore, sotto il metro dei posti. */
      .pacchetto-conto {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      /* La riga del pacchetto, sorella di quelle del nome e del limite. */
      .rigaPacchetto {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .rigaPacchetto[hidden] {
        display: none;
      }

      .rigaPacchetto .nota {
        flex-basis: 100%;
      }

      .rigaPacchetto label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--ink-2);
      }

      .rigaPacchetto input {
        width: 5.5rem;
        font-weight: 700;
      }

      /* Il pacchetto a righe: app, durata, quante, e il tasto per toglierla.
         Lo stesso pezzo nella carta dell'installatore e in «Aggiungi». */
      .righe-pacchetto {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-basis: 100%;
        min-width: 0;
        container-type: inline-size;
      }

      /* Stretta nella carta, larga in «Aggiungi»: le due tendine non
         crescono oltre quello che serve a leggerle. */
      .riga-pacchetto {
        display: grid;
        grid-template-columns: minmax(0, 12rem) minmax(0, 12rem) 3.9rem auto;
        justify-content: start;
        gap: 8px;
        align-items: center;
      }

      .riga-pacchetto select,
      .riga-pacchetto input {
        width: 100%;
        padding: 8px 6px 8px 9px;
        font-size: 0.88rem;
      }

      .riga-pacchetto input {
        font-weight: 700;
      }

      .riga-pacchetto .togli-riga {
        padding: 7px 10px;
      }

      .righe-pacchetto .aggiungi-riga {
        align-self: flex-start;
      }

      .righe-pacchetto .vuoto-pacchetto {
        margin: 0;
        font-size: 0.84rem;
        color: var(--ink-3);
      }

      /* Piu' stretta ancora (la carta sul telefono): app e durata sopra,
         quante e il tasto sotto. */
      @container (max-width: 18rem) {
        .riga-pacchetto {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          padding-bottom: 8px;
          border-bottom: 1px solid var(--linea);
        }

        .riga-pacchetto .togli-riga {
          justify-self: start;
        }
      }

      .sola-lettura {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: var(--r-piccolo);
        background: var(--accento-soft);
        color: var(--accento);
        font-size: 0.78rem;
        font-weight: 700;
      }

      /* ─── Le sezioni della gestione ────────────────────────────────────
       *
       * «Rivedere completamente il cruscotto gdahome: non si capisce nulla,
       * cerca di riorganizzare le cose con sezioni.»
       *
       * Cinque sezioni, una per domanda: come va (Panoramica), le case, gli
       * installatori, quello che si regala, quello che si compra. Ogni
       * sezione comincia con un titolo e una riga che dice cosa c'e' dentro,
       * e quello che si apre — una casa, un installatore, uno nuovo — si apre
       * in una scheda di lato. I pezzi sono pochi e sempre gli stessi: la
       * scheda bianca, la riga d'elenco con la sua icona tonda, il numero
       * grande, la pastiglia. */

      .capo-sezione {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin: 18px 2px 14px;
      }

      .capo-sezione h2 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }

      .capo-sezione p {
        margin: 4px 0 0;
        max-width: 66ch;
        color: var(--ink-2);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .capo-sezione p b {
        color: var(--ink);
      }

      .griglia {
        display: grid;
        gap: 14px;
      }

      .griglia + .griglia,
      .griglia + .scheda,
      .scheda + .griglia {
        margin-top: 14px;
      }

      /* Dentro una griglia lo spazio lo fa la griglia: un margine in più
         abbasserebbe una colonna sola, e le due non partirebbero alla stessa
         altezza (nella Panoramica, «Il servizio» sotto «Da guardare»). */
      .griglia > .griglia,
      .griglia > .scheda {
        margin-top: 0;
      }

      .griglia > .griglia {
        align-content: start;
      }

      .scheda {
        min-width: 0;
        padding: 18px 20px;
        border-radius: var(--r-grande);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
      }

      .scheda > h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 4px;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .scheda > h3 .conta {
        margin-left: auto;
        color: var(--ink-3);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .scheda > .sotto {
        margin: 0 0 12px;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .scheda.vuoto {
        padding: 34px 18px;
      }

      /* L'icona tonda: un quadrato morbido col disegno, tinto come lo stato.
         Accanto c'e' sempre la parola: la tinta non parla da sola. */
      .tondino {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--accento-soft);
        color: var(--accento);
      }

      .tondino svg {
        width: 18px;
        height: 18px;
      }

      .tondino.verde {
        background: var(--verde-soft);
        color: var(--verde);
      }

      .tondino.ambra {
        background: var(--ambra-soft);
        color: var(--ambra);
      }

      .tondino.rosso {
        background: var(--rosso-soft);
        color: var(--rosso);
      }

      .tondino.grigio {
        background: var(--linea);
        color: var(--ink-3);
      }

      /* Le iniziali di un installatore, o il suo marchio. */
      .iniziali {
        width: 38px;
        height: 38px;
        flex: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--accento-soft);
        color: var(--accento);
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .iniziali img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        padding: 3px;
      }

      .iniziali.grigio {
        background: var(--linea);
        color: var(--ink-3);
      }

      /* ─── Il numero grande ───────────────────────────────────────────── */

      .numerone {
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 16px 18px;
        border-radius: var(--r);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        color: inherit;
        font: inherit;
        text-align: left;
      }

      button.numerone {
        cursor: pointer;
        transition:
          transform 0.2s var(--molla),
          box-shadow 0.2s;
      }

      button.numerone:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra-alta);
      }

      .numerone .etichetta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .numerone .etichetta svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .numerone .valore {
        margin-top: 6px;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .numerone .valore small {
        color: var(--ink-2);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .numerone .dettaglio {
        color: var(--ink-2);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      /* ─── La riga d'elenco ───────────────────────────────────────────── */

      .elenco {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .elenco > li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 12px 4px;
      }

      /* La linea fra una riga e l'altra e' un tratto suo, e non il bordo
         della riga: una riga che si tocca ha gli angoli tondi, e il bordo li
         seguiva piegandosi alle due punte. */
      .elenco > li + li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 4px;
        right: 4px;
        height: 1px;
        background: var(--linea);
      }

      /* Le righe che si toccano escono di otto per parte, cosi' il fondo
         grigio sotto il dito non sta attaccato alle parole; la linea resta
         dov'e' nelle altre righe. */
      .elenco.si-tocca > li {
        margin: 0 -8px;
        padding: 12px;
        border-radius: 14px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .elenco.si-tocca > li + li::before {
        left: 12px;
        right: 12px;
      }

      .elenco.si-tocca > li:hover {
        background: var(--linea);
      }

      .elenco.si-tocca > li[aria-current="true"] {
        background: var(--accento-soft);
      }

      .elenco.si-tocca > li.ferma {
        cursor: default;
      }

      .elenco.si-tocca > li.ferma:hover {
        background: none;
      }

      .elenco > li.vuota {
        padding-block: 18px;
      }

      .riga-testo {
        flex: 1;
        min-width: 0;
      }

      .riga-testo > b {
        display: block;
        font-size: 0.95rem;
        font-weight: 750;
        letter-spacing: -0.01em;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .riga-testo > span {
        display: block;
        margin-top: 1px;
        color: var(--ink-2);
        font-size: 0.84rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      /* La licenza di una casa sta sotto il suo nome: sul telefono e
         nell'elenco stretto accanto alla scheda non c'e' posto a destra. */
      .riga-testo > .pastiglia {
        display: inline-flex;
        margin-top: 6px;
      }

      .riga-testo > .dice-male {
        color: var(--ambra);
        font-weight: 700;
      }

      .riga-fine {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .freccina {
        width: 18px;
        height: 18px;
        flex: none;
        display: grid;
        place-items: center;
        color: var(--ink-3);
      }

      .freccina svg {
        width: 100%;
        height: 100%;
      }

      /* Il pallino di come sta una macchina: verde, ambra, rosso, grigio. */
      .pallino {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--ink-3);
        box-shadow: 0 0 0 4px var(--linea);
      }

      .pallino.verde {
        background: var(--verde);
        box-shadow: 0 0 0 4px var(--verde-soft);
      }

      .pallino.ambra {
        background: var(--ambra);
        box-shadow: 0 0 0 4px var(--ambra-soft);
      }

      .pallino.rosso {
        background: var(--rosso);
        box-shadow: 0 0 0 4px var(--rosso-soft);
      }

      /* Premium e' blu; Base e quello che non vale piu' restano grigi. */
      .pastiglia.blu {
        background: var(--accento-soft);
        color: var(--accento);
      }

      /* «Gli altri otto controlli sono a posto»: la riga che apre il resto. */
      .apri-riga {
        margin-top: 6px;
        border-top: 1px solid var(--linea);
      }

      .apri-riga.primo {
        margin-top: 0;
        border-top: 0;
      }

      .apri-riga > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 4px 4px;
        color: var(--accento);
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        list-style: none;
      }

      .apri-riga.primo > summary {
        padding-top: 0;
      }

      .apri-riga > summary::-webkit-details-marker {
        display: none;
      }

      .apri-riga > summary .freccina {
        margin-left: auto;
        color: currentColor;
        transition: transform 0.2s;
      }

      .apri-riga[open] > summary .freccina {
        transform: rotate(90deg);
      }

      .apri-riga > :not(summary) {
        margin-top: 10px;
      }

      .servizio-titolo {
        margin: 0 0 8px;
        font-size: 0.86rem;
        font-weight: 800;
        color: var(--ink-2);
      }

      /* «Tutto in ordine», quando non c'e' niente da guardare. */
      .tutto-bene {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 4px 4px;
      }

      /* ─── Filtri e ricerca ───────────────────────────────────────────── */

      .filtri {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
      }

      .cerca {
        flex: 1 1 260px;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-3);
      }

      .cerca:focus-within {
        border-color: var(--accento);
        box-shadow: 0 0 0 3px var(--accento-soft);
      }

      .cerca svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .cerca input[type="search"] {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: none;
        color: var(--ink);
        font: inherit;
        padding: 10px 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 6px 13px;
        border-radius: var(--r-piccolo);
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-2);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .chip b {
        font-weight: 800;
      }

      .chip[aria-pressed="true"] {
        background: var(--accento);
        border-color: var(--accento);
        color: #fff;
      }

      /* ─── Abbonamenti e licenze ──────────────────────────────────────────
       *
       * Un vocabolario solo, in tutta la pagina: ogni stato ha la sua parola
       * e il suo colore, gli stessi nella pastiglia di una riga, nel pallino
       * di un filtro, nel titolo di un gruppo, sulla linea dei trenta giorni
       * e nei numeri in cima. Verde attiva, blu in prova, ambra non rinnova
       * (o termina presto), grigio finita, rosso revocata o rimborsata,
       * tratteggiato i test. Il colore non sta mai da solo: c'e' sempre la
       * parola. I numeri prima, le parole dopo: le spiegazioni lunghe stanno
       * nella «i» accanto a ogni numero, in «Come funziona», e nella riga
       * aperta. */

      .s-ok {
        --t: var(--verde);
        --t-soft: var(--verde-soft);
      }

      .s-prova {
        --t: var(--accento);
        --t-soft: var(--accento-soft);
      }

      .s-avviso {
        --t: var(--ambra);
        --t-soft: var(--ambra-soft);
      }

      .s-spenta {
        --t: var(--ink-3);
        --t-soft: var(--linea);
      }

      .s-male {
        --t: var(--rosso);
        --t-soft: var(--rosso-soft);
      }

      .s-test {
        --t: var(--ink-3);
        --t-soft: transparent;
      }

      .stato {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 3px 10px 3px 8px;
        border-radius: 99px;
        background: var(--t-soft, var(--linea));
        color: var(--t, var(--ink-2));
        font-size: 0.76rem;
        font-weight: 750;
        line-height: 1.4;
        white-space: nowrap;
      }

      .stato::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: currentColor;
      }

      .stato.s-test {
        border: 1px dashed var(--linea-forte);
        padding-block: 2px;
      }

      .s-ok .pallino,
      .s-prova .pallino,
      .s-avviso .pallino,
      .s-spenta .pallino,
      .s-male .pallino,
      .s-test .pallino {
        background: var(--t);
        box-shadow: 0 0 0 3px var(--t-soft);
      }

      .s-test .pallino {
        background: transparent;
        border: 1.5px dashed var(--ink-3);
        box-shadow: none;
      }

      /* Un titoletto fra due gruppi di carte, con a destra dove si va. */
      .titoletto {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 32px 2px 12px;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.015em;
      }

      .capo-sezione + .titoletto {
        margin-top: 8px;
      }

      .titoletto .comeUnLink {
        font-size: 0.86rem;
      }

      /* ─── I numeri in cima ───────────────────────────────────────────── */

      .kpi-griglia {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (min-width: 48rem) {
        .kpi-griglia {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
        }
      }

      .kpi {
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 16px 20px 18px;
        border-radius: var(--r-grande);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
      }

      .kpi-capo {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-2);
        font-size: 0.84rem;
        font-weight: 700;
      }

      .kpi-capo .pallino {
        width: 8px;
        height: 8px;
        background: var(--k, var(--ink-3));
        box-shadow: 0 0 0 3px var(--k-soft, var(--linea));
      }

      .kpi-nome {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kpi-numero {
        margin-top: 12px;
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.05;
        white-space: nowrap;
      }

      .kpi-numero small {
        margin-left: 3px;
        color: var(--ink-3);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .kpi-nota {
        margin-top: 8px;
        color: var(--ink-3);
        font-size: 0.82rem;
        font-weight: 600;
        line-height: 1.35;
      }

      .k-case {
        --k: var(--accento);
        --k-soft: var(--accento-soft);
      }

      .k-paga {
        --k: var(--verde);
        --k-soft: var(--verde-soft);
      }

      .k-prova {
        --k: var(--accento);
        --k-soft: var(--accento-soft);
      }

      .k-avviso {
        --k: var(--ambra);
        --k-soft: var(--ambra-soft);
      }

      .k-soldi {
        --k: var(--viola);
        --k-soft: var(--viola-soft);
      }

      .k-vuoto {
        grid-column: span 2;
        justify-content: center;
      }

      @media (max-width: 35.99rem) {
        .kpi {
          padding: 14px 16px 16px;
        }

        .kpi-numero {
          margin-top: 10px;
          font-size: 1.55rem;
        }

        .kpi-numero small {
          margin-left: 1px;
          font-size: 0.75rem;
        }

        .k-vuoto {
          grid-column: 1 / -1;
        }
      }

      /* La «i»: toccata o sorvolata, dice cosa vuol dire il numero. */
      .info {
        position: relative;
        flex: none;
      }

      .info-tasto {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--linea-forte);
        border-radius: 50%;
        background: none;
        color: var(--ink-3);
        font: inherit;
        font-size: 0.7rem;
        font-weight: 800;
        line-height: 1;
        cursor: help;
      }

      .info-tasto:hover,
      .info-tasto:focus-visible {
        border-color: var(--accento);
        color: var(--accento);
      }

      .info-bolla {
        position: absolute;
        z-index: 30;
        top: calc(100% + 8px);
        right: -6px;
        width: min(270px, 72vw);
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--ink);
        color: var(--ground);
        font-size: 0.8rem;
        font-weight: 500;
        line-height: 1.45;
        white-space: normal;
        box-shadow: var(--ombra-alta);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition:
          opacity 0.15s,
          transform 0.15s,
          visibility 0.15s;
        pointer-events: none;
      }

      .info:hover .info-bolla,
      .info-tasto:focus + .info-bolla {
        opacity: 1;
        visibility: visible;
        transform: none;
      }

      /* ─── I grafici ──────────────────────────────────────────────────── */

      .grafici {
        margin-top: 16px;
      }

      .grafico-case,
      .le-entrate {
        align-self: stretch;
      }

      .lic-righe.nella-casa {
        margin: 4px 0 8px;
      }

      .lic-righe.nella-casa .lic-c-casa small {
        margin-top: 2px;
        color: var(--ink-2);
        font-size: 0.82rem;
        line-height: 1.4;
        white-space: normal;
      }

      .ciambella-e-legenda {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px 32px;
        margin-top: 16px;
      }

      .ciambella {
        position: relative;
        width: 152px;
        height: 152px;
        flex: none;
      }

      .ciambella svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ciambella circle {
        fill: none;
        stroke-width: 16;
      }

      .ciambella-fondo {
        stroke: var(--linea);
      }

      .ciambella-centro {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        line-height: 1.1;
      }

      .ciambella-centro b {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .ciambella-centro small {
        color: var(--ink-3);
        font-size: 0.74rem;
        font-weight: 650;
      }

      .legenda-case {
        flex: 1 1 210px;
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .legenda-case li {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto 2.8rem;
        align-items: center;
        gap: 10px;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .legenda-case i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .legenda-case b {
        font-weight: 800;
      }

      .legenda-case small {
        color: var(--ink-3);
        font-size: 0.78rem;
        text-align: right;
      }

      .b-paga {
        background: var(--verde);
      }

      .b-prova {
        background: var(--accento);
      }

      .b-regalo {
        background: var(--viola);
      }

      .b-installatore {
        background: var(--teal);
      }

      .b-test {
        background: var(--ink-3);
      }

      .b-base {
        background: var(--linea-forte);
      }

      circle.b-paga {
        stroke: var(--verde);
      }

      circle.b-prova {
        stroke: var(--accento);
      }

      circle.b-regalo {
        stroke: var(--viola);
      }

      circle.b-installatore {
        stroke: var(--teal);
      }

      circle.b-test {
        stroke: var(--ink-3);
      }

      circle.b-base {
        stroke: var(--linea-forte);
      }

      .entrate-barre {
        list-style: none;
        margin: 16px 0 24px;
        padding: 0;
        display: grid;
        gap: 16px;
      }

      .entrate-barre li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 12px;
        align-items: baseline;
      }

      .eb-nome {
        grid-row: 1;
        grid-column: 1;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .entrate-barre b {
        grid-row: 1;
        grid-column: 2;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .eb-binario {
        grid-row: 2;
        grid-column: 1 / -1;
        height: 10px;
        border-radius: 99px;
        background: var(--linea);
        overflow: hidden;
      }

      .eb-binario i {
        display: block;
        height: 100%;
        min-width: 3px;
        border-radius: 99px;
        background: var(--e);
      }

      .entrate-barre small {
        grid-row: 3;
        grid-column: 1 / -1;
        color: var(--ink-3);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .e-incassato {
        --e: var(--verde);
      }

      .e-ricorrente {
        --e: var(--viola);
      }

      .e-attesi {
        --e: var(--accento);
      }

      .entrate-colonne {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }

      .entrate-colonne li {
        display: grid;
        justify-items: center;
        gap: 6px;
        text-align: center;
      }

      .ec-valore {
        font-size: 0.8rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .ec-colonna {
        width: 100%;
        max-width: 44px;
        height: 64px;
        display: flex;
        align-items: flex-end;
        border-radius: 8px;
        background: var(--linea);
        overflow: hidden;
      }

      .ec-colonna i {
        display: block;
        width: 100%;
        border-radius: 8px 8px 0 0;
        background: var(--accento);
      }

      .entrate-colonne small {
        color: var(--ink-3);
        font-size: 0.72rem;
        font-weight: 650;
        line-height: 1.25;
      }

      .entrate-nota {
        margin: 16px 0 0;
        color: var(--ink-3);
        font-size: 0.78rem;
      }

      /* ─── In arrivo: la linea dei trenta giorni ──────────────────────── */

      .in-arrivo {
        margin-top: 16px;
      }

      .griglia > .in-arrivo {
        margin-top: 0;
      }

      .linea-tempo {
        margin: 16px 8px 0;
      }

      .lt-binario {
        position: relative;
        height: 58px;
        border-bottom: 2px solid var(--linea-forte);
      }

      .lt-punto {
        position: absolute;
        display: grid;
        place-items: center;
        transform: translateX(-50%);
      }

      .lt-punto .pallino {
        width: 12px;
        height: 12px;
        box-shadow:
          0 0 0 3px var(--vetro-pieno),
          0 0 0 5px var(--t-soft);
      }

      .lt-tacche {
        position: relative;
        height: 26px;
      }

      .lt-tacca {
        position: absolute;
        top: 8px;
        transform: translateX(-50%);
        color: var(--ink-3);
        font-size: 0.72rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .lt-tacca:first-child {
        transform: none;
      }

      .lt-tacca:last-child {
        transform: translateX(-100%);
      }

      .lt-legenda {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 4px 8px 16px;
        color: var(--ink-2);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .lt-legenda span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .lt-legenda .pallino {
        width: 8px;
        height: 8px;
      }

      .arrivo {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px 24px;
      }

      .in-arrivo {
        container-type: inline-size;
      }

      @container (min-width: 760px) {
        .arrivo {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .arrivo > li {
        display: grid;
        grid-template-columns: 4.2rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 8px 10px;
        border-radius: var(--r-piccolo);
        cursor: pointer;
        transition: background 0.15s;
      }

      .arrivo > li:hover {
        background: var(--linea);
      }

      .arrivo > li.ferma {
        cursor: default;
      }

      .arrivo-giorno {
        font-size: 0.84rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .arrivo-casa {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .arrivo-cosa {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--t-soft);
        color: var(--t);
        font-size: 0.76rem;
        font-weight: 750;
        white-space: nowrap;
      }

      .arrivo-cosa .pallino {
        width: 6px;
        height: 6px;
        background: currentColor;
        box-shadow: none;
      }

      .arrivo-altre {
        margin: 8px 10px 0;
      }

      @media (max-width: 35.99rem) {
        .arrivo > li {
          grid-template-columns: 3.8rem minmax(0, 1fr);
          row-gap: 4px;
        }

        .arrivo-cosa {
          grid-column: 2;
          justify-self: start;
          white-space: normal;
        }
      }

      /* ─── Come funziona: cinque carte piccole, chiuse finche' non servono */

      .come-funziona {
        margin-top: 16px;
        padding: 14px 20px;
        border-radius: var(--r-grande);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
      }

      .come-funziona > summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        cursor: pointer;
        list-style: none;
      }

      .come-funziona > summary::-webkit-details-marker {
        display: none;
      }

      .come-funziona > summary b {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.015em;
      }

      .come-sotto {
        flex: 1;
        min-width: 0;
        color: var(--ink-3);
        font-size: 0.84rem;
      }

      .come-funziona > summary .freccina {
        margin-left: auto;
        transition: transform 0.2s;
      }

      .come-funziona[open] > summary .freccina {
        transform: rotate(90deg);
      }

      .glossario {
        list-style: none;
        margin: 16px 0 6px;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }

      .glossario > li {
        display: grid;
        align-content: start;
        gap: 6px;
        padding: 16px;
        border-radius: var(--r);
        background: var(--ground);
      }

      .glossario .tondino {
        width: 32px;
        height: 32px;
        margin-bottom: 4px;
        border-radius: 10px;
      }

      .glossario b {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .glossario > li > span:last-child {
        color: var(--ink-2);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      @media (max-width: 47.99rem) {
        .come-sotto {
          order: 5;
          flex: 1 1 100%;
          padding-left: 46px;
        }
      }

      /* ─── La tabella delle licenze ───────────────────────────────────── */

      .lic-elenco {
        margin-top: 16px;
        padding: 20px 24px 12px;
      }

      .lic-filtri {
        display: grid;
        gap: 12px;
        margin: 16px 0 8px;
      }

      .chips-riga {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip .pallino {
        width: 8px;
        height: 8px;
        margin-right: 2px;
      }

      .chip[aria-pressed="true"] .pallino {
        box-shadow: 0 0 0 2px #fff;
      }

      .chip.leggera {
        min-height: 32px;
        padding: 4px 12px;
        border-style: dashed;
        font-size: 0.82rem;
      }

      .chip.leggera[aria-pressed="true"] {
        border-style: solid;
        background: var(--ink);
        border-color: var(--ink);
        color: var(--ground);
      }

      #elenco-licenze,
      .lic-righe {
        container-type: inline-size;
      }

      .lic-righe {
        margin: 0 0 8px;
      }

      .lic-testata,
      .elenco > li.lic-riga {
        display: grid;
        grid-template-columns:
          minmax(0, 1.7fr) minmax(0, 1.3fr) 8.6rem 8rem minmax(6.5rem, 0.7fr)
          36px;
        column-gap: 16px;
        align-items: center;
      }

      .lic-testata {
        padding: 10px 12px;
        margin: 0 -12px;
        border-bottom: 1px solid var(--linea-forte);
        color: var(--ink-3);
        font-size: 0.74rem;
        font-weight: 750;
      }

      .lic-testata > span:nth-child(5),
      .lic-c-importo {
        text-align: right;
      }

      .elenco > li.lic-riga {
        row-gap: 0;
        margin: 0 -12px;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .elenco > li.lic-riga:hover,
      .elenco > li.lic-riga.aperta {
        background: var(--linea);
      }

      .elenco > li.lic-riga + li::before {
        left: 12px;
        right: 12px;
      }

      .elenco > li.lic-riga.aperta + li::before,
      .elenco > li.lic-riga:hover + li::before {
        opacity: 0;
      }

      .lic-c-casa {
        min-width: 0;
        display: grid;
        line-height: 1.3;
      }

      .lic-c-casa b,
      .lic-c-casa small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lic-c-casa b {
        font-size: 0.92rem;
        font-weight: 750;
      }

      .lic-c-casa small {
        color: var(--ink-3);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .lic-c-origine,
      .lic-c-stato {
        min-width: 0;
      }

      .origine {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        color: var(--ink-2);
        font-size: 0.84rem;
        font-weight: 650;
      }

      .origine > span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lic-segno {
        width: 22px;
        height: 22px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: var(--linea);
        color: var(--ink);
        font-size: 0.68rem;
        font-weight: 800;
      }

      .lic-segno svg {
        width: 13px;
        height: 13px;
      }

      .lic-segno.negozio-a,
      .lic-segno.negozio-g {
        background: var(--ink);
        color: var(--vetro-pieno);
      }

      .lic-segno.fonte-regalo {
        background: var(--viola-soft);
        color: var(--viola);
      }

      .lic-segno.fonte-installatore {
        background: var(--teal-soft);
        color: var(--teal);
      }

      .servizio-capo > .lic-segno {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 0.86rem;
      }

      .lic-c-data {
        display: grid;
        line-height: 1.3;
      }

      .lic-c-data small {
        color: var(--ink-3);
        font-size: 0.72rem;
        font-weight: 650;
      }

      .lic-c-data b {
        font-size: 0.88rem;
        font-weight: 750;
        white-space: nowrap;
      }

      .lic-c-importo {
        font-size: 0.9rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .lic-riga[data-stato="finita"] .lic-c-casa b,
      .lic-riga[data-stato="test"] .lic-c-casa b,
      .lic-riga[data-stato="finita"] .lic-c-importo,
      .lic-riga[data-stato="test"] .lic-c-importo {
        color: var(--ink-3);
      }

      .lic-c-menu {
        justify-self: end;
      }

      .menu-azioni {
        position: relative;
      }

      .menu-azioni > summary {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--ink-3);
        cursor: pointer;
        list-style: none;
      }

      .menu-azioni > summary::-webkit-details-marker {
        display: none;
      }

      .menu-azioni > summary:hover,
      .menu-azioni[open] > summary {
        background: var(--linea-forte);
        color: var(--ink);
      }

      .menu-azioni > summary svg {
        width: 18px;
        height: 18px;
      }

      .menu-tendina {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        right: 0;
        min-width: 232px;
        display: grid;
        gap: 2px;
        padding: 6px;
        border-radius: 12px;
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow:
          0 12px 32px rgba(16, 24, 40, 0.16),
          0 2px 6px rgba(16, 24, 40, 0.08);
      }

      .voce-menu {
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-size: 0.88rem;
        font-weight: 650;
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }

      .voce-menu:hover {
        background: var(--linea);
      }

      .voce-menu.male {
        color: var(--rosso);
      }

      .voce-menu.male:hover {
        background: var(--rosso-soft);
      }

      .voce-menu[data-sicuro="sì"],
      .voce-menu.male[data-sicuro="sì"]:hover {
        background: var(--rosso);
        color: #fff;
      }

      /* Revoca armata: la spiegazione sta nel menu, sotto il tasto, e il
         menu si allarga per leggerla. */
      .menu-tendina.in-conferma {
        width: min(320px, calc(100vw - 48px));
      }

      .menu-tendina > .spiega {
        padding: 4px 12px 8px;
        color: var(--rosso);
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.45;
        white-space: normal;
      }

      /* La riga aperta: perche' e' in quello stato, e da dove viene. */
      .lic-dettaglio {
        grid-column: 1 / -1;
        display: grid;
        gap: 4px;
        padding: 10px 0 2px;
      }

      .lic-frase {
        color: var(--ink);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .lic-fatti {
        color: var(--ink-3);
        font-size: 0.8rem;
      }

      /* Stretta — sul telefono, nella scheda di una casa, accanto a un'altra
         carta — la riga diventa una carta piccola: casa e stato sopra,
         origine, data e importo sotto, il menu a destra. */
      @container (max-width: 700px) {
        .lic-testata {
          display: none;
        }

        .elenco > li.lic-riga {
          grid-template-columns: minmax(0, 1fr) auto auto 32px;
          grid-template-areas:
            "casa casa stato menu"
            "origine data importo menu";
          row-gap: 8px;
          column-gap: 12px;
        }

        .lic-c-casa {
          grid-area: casa;
        }

        .lic-c-stato {
          grid-area: stato;
          justify-self: end;
        }

        .lic-c-origine {
          grid-area: origine;
        }

        .lic-c-data {
          grid-area: data;
          display: flex;
          align-items: baseline;
          gap: 4px;
        }

        .lic-c-importo {
          grid-area: importo;
        }

        .lic-c-menu {
          grid-area: menu;
          align-self: start;
        }

        .lic-dettaglio {
          grid-column: 1 / -1;
        }
      }

      /* Strettissima — il telefono — l'origine e' il suo segno soltanto: il
         nome intero sta nel suggerimento e nella riga aperta. */
      @container (max-width: 420px) {
        .elenco > li.lic-riga {
          grid-template-columns: auto minmax(0, 1fr) auto 32px;
          grid-template-areas:
            "casa casa stato menu"
            "origine data importo menu";
          column-gap: 8px;
        }

        .origine > span:last-child {
          display: none;
        }
      }

      .lic-gruppo {
        border-top: 1px solid var(--linea);
      }

      .lic-gruppo:first-of-type {
        border-top: 0;
      }

      .lic-capo {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 16px 0 8px;
        border: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .lic-capo b {
        font-size: 0.95rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .lic-n {
        min-width: 26px;
        padding: 1px 8px;
        border-radius: 99px;
        background: var(--t-soft);
        color: var(--t);
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
      }

      .s-test .lic-n {
        background: var(--linea);
      }

      .lic-spiega {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        color: var(--ink-3);
        font-size: 0.82rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lic-capo .freccina {
        width: 16px;
        height: 16px;
        transition: transform 0.2s;
      }

      .lic-capo[aria-expanded="true"] .freccina {
        transform: rotate(90deg);
      }

      .lic-altre {
        display: block;
        margin: 0 0 12px;
        padding: 6px 0;
        border: 0;
        background: none;
        color: var(--accento);
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
      }

      .lic-altre .minuta {
        font-weight: 500;
      }

      @media (max-width: 47.99rem) {
        .lic-elenco {
          padding: 16px 16px 8px;
        }

        .chips-riga {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin-inline: -16px;
          padding: 2px 16px;
          scrollbar-width: none;
        }

        .chips-riga::-webkit-scrollbar {
          display: none;
        }

        .chips-riga > .chip {
          flex: none;
        }

        .lic-capo {
          flex-wrap: wrap;
          row-gap: 2px;
        }

        .lic-spiega {
          order: 5;
          flex: 1 1 100%;
          padding-left: 42px;
          white-space: normal;
        }
      }

      /* Nella scheda di una casa: Premium o Base, in una riga grande. */
      .lic-esito {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 2px 0 12px;
      }

      .lic-esito .riga-testo > b {
        font-size: 1.05rem;
        font-weight: 800;
      }

      .lic-esito.premium .tondino {
        background: var(--accento);
        color: #fff;
      }

      .lic-esito + .lic-righe {
        border-top: 1px solid var(--linea);
        padding-top: 4px;
      }

      /* «Regali e codici»: i tre modi di dare Premium senza farlo pagare. */
      .tre-modi {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .tre-modi > li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        border-radius: var(--r-grande);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
      }

      @media (min-width: 48rem) {
        .tre-modi {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
        }
      }

      /* Le versioni dell'app: la parte di telefoni di ogni versione. */
      .elenco > li.riga-versione {
        padding-block: 10px;
      }

      .quota-versione {
        display: block;
        height: 6px;
        margin-top: 8px;
        border-radius: 99px;
        background: var(--linea);
        overflow: hidden;
      }

      .quota-versione i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--ambra);
      }

      .quota-versione i.nuova {
        background: var(--verde);
      }

      .riga-versione > .riga-fine {
        width: 10rem;
        justify-content: flex-end;
      }

      /* Due carte una sotto l'altra, fuori da una griglia, non si toccano. */
      #dove > .scheda + .scheda {
        margin-top: 16px;
      }

      .per-cento {
        min-width: 2.6rem;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 800;
        text-align: right;
      }

      .piede-sezione {
        margin: 16px 2px 0;
        max-width: 90ch;
        color: var(--ink-3);
        font-size: 0.8rem;
      }

      .scheda[data-senza-versioni] > h3 {
        margin-bottom: 8px;
      }

      /* Le parole della barra: lunghe sullo schermo largo, corte sul
         telefono; «Altro» solo sul telefono. */
      .barra .corta,
      .barra .altro {
        display: none;
      }

      /* ─── Gli installatori ───────────────────────────────────────────── */

      .carta-installatore {
        cursor: pointer;
        transition:
          transform 0.2s var(--molla),
          box-shadow 0.2s;
      }

      .carta-installatore:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra-alta);
      }

      .carta-installatore[aria-current="true"] {
        border-color: var(--accento);
        box-shadow:
          0 0 0 2px var(--accento-soft),
          var(--ombra);
      }

      .carta-installatore > h3 {
        gap: 12px;
        overflow-wrap: anywhere;
      }

      .carta-installatore > .sotto {
        margin: 10px 0 14px;
      }

      .posti-detti {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
        font-size: 0.88rem;
      }

      .posti-detti b {
        font-weight: 800;
      }

      .posti-detti span {
        color: var(--ink-2);
        font-weight: 700;
      }

      .carta-installatore[data-stato="limite"] .metro i,
      .foglio[data-stato="limite"] .metro i {
        background: var(--ambra);
      }

      .pacchetto-detto {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 12px 0 0;
        color: var(--ink-2);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .pacchetto-detto svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      /* ─── Dentro le schede che si aprono di lato ─────────────────────── */

      .foglio-corpo > .capitolo:first-child,
      .foglio-corpo > .chiave-nuova:first-child {
        margin-top: 8px;
      }

      .foglio-testa .tondino,
      .foglio-testa .iniziali {
        width: 42px;
        height: 42px;
        border-radius: 13px;
      }

      .tasto-chiudi {
        width: 38px;
        height: 38px;
        flex: none;
        margin-left: auto;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: var(--linea);
        color: var(--ink-2);
        cursor: pointer;
      }

      .tasto-chiudi svg {
        width: 18px;
        height: 18px;
      }

      /* Le regole di un installatore e la licenza di una casa: una riga per
         cosa, col suo tasto, e sotto la riga che si apre per cambiarla. */
      .regole > li {
        flex-wrap: wrap;
      }

      .regole .rigaNome,
      .regole .rigaLimite,
      .regole .rigaPacchetto {
        flex-basis: 100%;
        margin: 2px 0 2px 46px;
      }

      /* La spiegazione di un tasto in due tempi (`inDueTempi`) va a capo,
         sotto la riga, in ogni elenco che la porta: nelle regole come nei
         regali e nei codici della schermata Licenze. Stava accanto al testo,
         come una colonna in piu', e il testo della riga — che cede tutto il
         posto — si stringeva a una lettera per riga. Sotto l'icona, se c'e',
         non ci va: comincia dove comincia il testo. */
      .elenco > li[data-spiega] {
        flex-wrap: wrap;
      }

      /* E il tasto, quando diventa «Premi ancora per confermare» (la riga
         e' `.in-conferma`), in una colonna stretta non ruba il posto al
         testo: il testo tiene almeno dodici rem, e se non ci stanno tutti e
         due il tasto va a capo, a destra come gli altri. A riposo la riga
         resta com'era. */
      .elenco > li.in-conferma > .riga-testo {
        flex: 1 1 12rem;
      }

      .elenco > li[data-spiega] > .riga-fine {
        margin-left: auto;
      }

      .elenco > li[data-spiega] > .spiega {
        flex-basis: 100%;
        margin: 0;
        color: var(--rosso);
        font-size: 0.84rem;
        font-weight: 600;
        line-height: 1.5;
      }

      .elenco > li[data-spiega] > .tondino ~ .spiega {
        margin-left: 46px;
      }

      .riquadro.rischio {
        border-color: var(--rosso-soft);
        box-shadow:
          0 0 0 1px var(--rosso-soft),
          var(--ombra);
      }

      .senza-limite {
        display: flex;
        align-items: center;
        align-self: end;
        gap: 9px;
        min-height: 44px;
        margin-bottom: 12px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-2);
        font-weight: 700;
        cursor: pointer;
      }

      input[type="number"]:disabled {
        opacity: 0.5;
      }

      .tasto.piccolo {
        padding: 7px 13px;
        font-size: 0.82rem;
      }

      /* La pastiglia della Panoramica sulla barra: piena, perche' e' l'unica
         e dice «c'e' qualcosa da guardare». */
      .barra .quanti.giallo {
        background: var(--ambra);
        color: #fff;
      }

      /* Il velo dietro la barra serve quando la pagina le scorre sotto. In
         cima alla pagina, sopra il cielo, si vedeva come un rettangolo
         chiaro intorno alla barra: adesso c'e' solo quando la barra e'
         attaccata in cima (lo dice il programma, `data-attaccata`). */
      .barra::before {
        opacity: 0;
        transition: opacity 0.2s;
      }

      .barra[data-attaccata]::before {
        opacity: 1;
      }

      /* Un riquadro a cui si salta (il regalo, dalla scheda di una casa) non
         deve finire sotto la barra. */
      .scheda[id] {
        scroll-margin-top: 92px;
      }

      .tasto svg {
        width: 16px;
        height: 16px;
        margin-right: 7px;
        vertical-align: -3px;
      }

      /* ─── Le colonne ─────────────────────────────────────────────────── */

      @media (min-width: 48rem) {
        .griglia-2,
        .griglia-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .griglia-4 {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        /* Cinque caselle: tre sopra e due sotto, larghe uguali per riga. */
        .griglia-5 {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .griglia-5 > * {
          grid-column: span 2;
        }

        .griglia-5 > :nth-child(n + 4) {
          grid-column: span 3;
        }
      }

      @media (min-width: 80rem) {
        .griglia-5 {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .griglia-5 > *,
        .griglia-5 > :nth-child(n + 4) {
          grid-column: auto;
        }
      }

      @media (min-width: 64rem) {
        .griglia-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* Sotto i sessantadue la barra non ha posto per cinque disegni e cinque
         parole: restano le parole. Sotto i quarantotto le linguette vanno su
         due righe, tre e due, come nel render. */
      @media (max-width: 61.99rem) {
        .barra button svg {
          display: none;
        }
      }

      @media (max-width: 47.99rem) {
        /* Sette linguette, in due righe da quattro: le parole corte. */
        .barra {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 2px;
          border-radius: 16px;
        }

        .barra button {
          padding: 9px 2px;
          border-radius: 12px;
          font-size: 0.8rem;
          white-space: normal;
          line-height: 1.2;
          gap: 4px;
        }

        .barra .lunga {
          display: none;
        }

        .barra .corta {
          display: inline;
        }

        .griglia-4,
        .griglia-5 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        /* Sul telefono la quinta resta sola: prende la riga intera. */
        .griglia-5 > :last-child {
          grid-column: 1 / -1;
        }

        .capo-sezione h2 {
          font-size: 1.4rem;
        }

        .scheda {
          padding: 16px;
        }

        .numerone .valore {
          font-size: 1.6rem;
        }

        /* La ricerca su tutta la riga, e le pastiglie dei filtri sotto: accanto
           a «Tutte» la scritta della casella non ci stava e si tagliava. */
        .cerca {
          flex-basis: 100%;
        }
      }

      /* Sul telefono stretto due tendine affiancate tagliano le parole
         («gdahome Prem…»): una sotto l'altra. */
      @media (max-width: 30rem) {
        .due-campi.pari {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════
         IL SISTEMA: misure, caratteri e navigazione.

         «Riesci a fare di meglio»: la pagina si leggeva come un documento,
         tutto con lo stesso peso. Adesso i numeri sono grandi e le parole
         piccole, le distanze vanno a passi di otto, e la navigazione sta di
         lato sullo schermo largo e in fondo sul telefono, dove arriva il
         pollice. Le regole qui sotto vengono per ultime apposta: vestono i
         pezzi di sempre senza riscriverli.
         ═══════════════════════════════════════════════════════════════════ */

      .capo-sezione {
        margin: 24px 2px 24px;
      }

      .capo-sezione h2 {
        font-size: 1.75rem;
        letter-spacing: -0.04em;
      }

      .capo-sezione p {
        margin-top: 8px;
        font-size: 0.95rem;
      }

      .scheda {
        padding: 20px 24px;
        border-radius: var(--r-grande);
      }

      .scheda > h3 {
        margin-bottom: 8px;
        font-size: 1rem;
      }

      .scheda > h3 .tondino {
        width: 32px;
        height: 32px;
        border-radius: 10px;
      }

      .griglia {
        gap: 16px;
      }

      .numerone {
        padding: 16px 20px 18px;
        border-radius: var(--r-grande);
      }

      .numerone .valore {
        margin-top: 10px;
        font-size: 2rem;
        letter-spacing: -0.045em;
      }

      .numerone .dettaglio {
        margin-top: 6px;
        color: var(--ink-3);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .griglia-3.piccoli .numerone .valore {
        font-size: 1.6rem;
      }

      .elenco > li {
        padding: 12px 4px;
      }

      .chip {
        min-height: 34px;
        border-radius: 99px;
        padding: 6px 14px;
      }

      .cerca {
        min-height: 44px;
        border-radius: 12px;
      }

      .tasto {
        border-radius: 10px;
      }

      .riquadro {
        border-radius: var(--r-grande);
      }

      .pastiglia {
        border-radius: 99px;
      }

      .barra button[aria-pressed="true"] {
        font-weight: 800;
      }

      .barra .quanti {
        border-radius: 99px;
      }

      /* ── Sullo schermo largo: la navigazione sta di lato ──────────────── */

      @media (min-width: 75rem) {
        .pagina {
          max-width: 1440px;
          display: grid;
          grid-template-columns: 232px minmax(0, 1fr);
          column-gap: 40px;
          align-items: start;
          padding: 8px 32px 64px;
        }

        .pagina > header {
          grid-column: 1 / -1;
        }

        .barra {
          grid-column: 1;
          position: sticky;
          top: 24px;
          flex-direction: column;
          gap: 2px;
          margin: 0;
          padding: 8px;
          border-radius: var(--r-grande);
        }

        :root[data-dentro] .barra {
          margin-inline-start: 0;
        }

        .barra::before {
          display: none;
        }

        .barra button {
          flex: none;
          justify-content: flex-start;
          gap: 12px;
          padding: 10px 12px;
          font-size: 0.9rem;
          font-weight: 650;
        }

        .barra button svg {
          display: block;
        }

        .barra button .quanti {
          margin-left: auto;
        }

        #dove {
          grid-column: 2;
          min-width: 0;
        }

        /* Senza la barra in cima, l'elenco e la scheda accanto si
           attaccano piu' in alto. */
        #dove .colonna-elenco,
        #dove > .foglio {
          top: 24px;
        }

        #dove .colonna-elenco {
          max-height: calc(100dvh - 48px);
        }

        .capo-sezione {
          margin-top: 4px;
        }
      }

      /* ── Sul telefono: la barra in fondo, sotto il pollice ────────────── */

      @media (max-width: 47.99rem) {
        body {
          padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
        }

        .barra {
          position: fixed;
          top: auto;
          left: 8px;
          right: 8px;
          bottom: calc(8px + env(safe-area-inset-bottom, 0px));
          z-index: 45;
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 2px;
          margin: 0;
          padding: 6px;
          border-radius: 20px;
          box-shadow:
            0 10px 30px rgba(16, 24, 40, 0.18),
            0 2px 6px rgba(16, 24, 40, 0.08);
        }

        :root[data-dentro] .barra {
          margin-inline-start: 0;
        }

        .barra::before {
          display: none;
        }

        .barra button {
          position: relative;
          flex-direction: column;
          gap: 3px;
          padding: 7px 2px 6px;
          border-radius: 14px;
          font-size: 0.68rem;
          font-weight: 700;
          line-height: 1.1;
          white-space: nowrap;
        }

        .barra button svg {
          display: block;
          width: 21px;
          height: 21px;
        }

        .barra .quanti {
          position: absolute;
          top: 2px;
          left: calc(50% + 6px);
          min-width: 16px;
          padding: 0 4px;
          font-size: 0.62rem;
        }

        .barra .secondaria {
          display: none;
        }

        .barra .altro {
          display: flex;
        }

        /* «Altro» aperto: le tre voci in piu' salgono sopra la barra, una
           per riga, come un piccolo menu. */
        .barra[data-aperta] .secondaria {
          order: -1;
          grid-column: 1 / -1;
          display: flex;
          flex-direction: row;
          justify-content: flex-start;
          gap: 12px;
          padding: 12px 14px;
          font-size: 0.9rem;
        }

        .barra[data-aperta] .secondaria .lunga {
          display: inline;
        }

        .barra[data-aperta] .secondaria .corta {
          display: none;
        }

        .avviso {
          bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        }

        .capo-sezione {
          margin: 16px 2px 16px;
        }

        .capo-sezione h2 {
          font-size: 1.5rem;
        }

        .scheda {
          padding: 16px;
        }

        .numerone .valore,
        .griglia-3.piccoli .numerone .valore {
          font-size: 1.5rem;
        }
      }

      @media (max-width: 47.99rem) {
        .griglia-3.piccoli {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
        }

        .griglia-3.piccoli .numerone {
          padding: 12px;
        }

        .griglia-3.piccoli .numerone .etichetta {
          font-size: 0.78rem;
        }

        .griglia-3.piccoli .numerone .dettaglio {
          font-size: 0.72rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="cielo" aria-hidden="true"></div>

    <div class="pagina">
      <header>
        <!-- Niente bollo, come nel cruscotto e per la stessa ragione: questa
             pagina si apre dentro Home Assistant, e il tasto del menu
             galleggia proprio li' sopra. Il tondo porta «gd», che e' il
             quadro. -->
        <div class="testata">
          <div class="tondo" aria-hidden="true"><span>gd</span></div>
          <div class="nomi">
            <h1>Gestione GdAHome</h1>
            <p id="sottotitolo"></p>
          </div>
          <button
            type="button"
            class="vivo"
            id="vivo"
            title="Si aggiorna da sola. Premi per aggiornare adesso."
          >
            <i></i><span id="vivo-dice">Aggiorna</span>
          </button>
        </div>
      </header>

      <nav id="nav" class="barra" aria-label="Le schermate"></nav>

      <main id="dove"></main>
    </div>

    <div class="avviso" id="avviso" role="status" aria-live="polite"></div>

    <script>
      /* ───────────────────────────────────────────────────────────────────
       * Questa pagina parla con `/gestore/…` e con nient'altro.
       *
       * Non chiede mai `/console/…`: quelle vie vogliono la chiave di un
       * installatore, e chi tiene il quadro non ce l'ha — ne' deve averla. Le
       * case di ognuno si vedono da `/gestore/installatore/<chi>/case`, che le
       * costruisce con lo stesso pezzo di programma che le costruisce per lui:
       * quello che si vede qui e' quello che vede lui, ne' una riga di piu'.
       * E si guarda e basta: da qui non si installa, non si riavvia, non si
       * rinomina — la casa e' sua.
       * ─────────────────────────────────────────────────────────────────── */

      /* Se questa pagina sta dentro un riquadro di Home Assistant.
       *
       * Si guarda e basta: `window.top` di un'altra origine non si puo'
       * leggere, e il confronto solleva — in quel caso la risposta e' comunque
       * «si'», perche' un'origine diversa vuol dire proprio che qualcun altro
       * ci ha messo dentro. Serve a una cosa sola: lasciare in cima lo spazio
       * per il tasto del menu, che sta in quell'altro documento. */
      try {
        if (window.self !== window.top) document.documentElement.dataset.dentro = "sì";
      } catch (_altroDominio) {
        document.documentElement.dataset.dentro = "sì";
      }

      /* Le immagini che non arrivano, tolte: un ascolto solo per tutta la
       * pagina, in cattura perche' l'errore di un'immagine non sale. */
      document.addEventListener(
        "error",
        (evento) => {
          const chi = evento.target;
          if (chi instanceof HTMLImageElement && chi.dataset.seNonArriva === "via") chi.remove();
        },
        true,
      );

      const DOVE_STA_LA_CHIAVE = "gdahome.quadro.gestore";
      /* La chiave si tiene nel deposito **di questa scheda**, non del
       * browser: chiusa la scheda, se ne va.
       *
       * Stava nel deposito del browser, per sempre, e da li' la leggeva
       * qualunque pagina servita da questa stessa origine — compresa quella
       * dell'editor della plancia, che e' codice di un altro progetto. Il
       * prezzo, detto: aprendo una scheda nuova la chiave si ribatte, o la
       * consegna chi ci tiene dentro (la tessera in Home Assistant, l'app).
       *
       * Quella che le versioni di prima avevano lasciato nel browser si porta
       * in questa scheda una volta sola, e dal browser si toglie. */
      let chiave = "";
      try {
        chiave = sessionStorage.getItem(DOVE_STA_LA_CHIAVE) || "";
      } catch (_niente) {
        /* Deposito bloccato: si chiede a ogni apertura. */
      }
      try {
        const diPrima = localStorage.getItem(DOVE_STA_LA_CHIAVE);
        if (diPrima !== null) {
          if (!chiave && diPrima) {
            chiave = diPrima;
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          }
          localStorage.removeItem(DOVE_STA_LA_CHIAVE);
        }
      } catch (_niente) {
        /* Niente da portare, o un deposito che non si lascia toccare. */
      }

      let INSTALLATORI = [];
      let CASE = 0;
      let ORFANE = 0;
      /* I numeri del servizio: quelli del quadro e, se sta sulla stessa
       * macchina, quelli del tramite (`/gestore/salute`). */
      let SALUTE = null;
      /* Le case di ogni installatore, come le vede lui: la matricola → quello
       * che risponde `/installatore/<chi>/case`, cioe' le case, di quali
       * aggiornamenti ci sono le note intere, e le soglie dei metri. */
      let LE_CASE_DI = new Map();
      /* Di quali aggiornamenti il quadro ha le note intere: l'unione di
       * quelle di tutti. Un segno e' un segno, di chiunque sia la casa. */
      let CON_LE_NOTE = new Set();
      /* Le soglie con cui si colorano i metri arrivano insieme alle case: sono
       * le stesse con cui il server decide, scritte una volta sola. */
      let SOGLIE = { troppoCaldo: 75, discoPieno: 85, discoFinito: 80 };
      const BATTERIA_SCARICA = 20;
      const SEGNALE_DEBOLE = 45;
      const DISCO_STANCO = 50;
      /* La chiave appena fatta, che si vede una volta sola e poi sparisce
       * ricaricando. Non finisce in nessun archivio, nemmeno del browser. */
      let APPENA_FATTO = null;
      /* Le licenze e i codici regalo (`/gestore/licenze`), e i codici appena
       * generati, che si mostrano in cima finche' non si chiudono. */
      let LICENZE = { accese: true, licenze: [], codici: [] };
      let CODICI_APPENA = null;
      /* Quello che si sta scrivendo nel modulo del regalo. La pagina si
       * ridisegna da sola ogni minuto, e una casa scelta dall'elenco non deve
       * sparire perche' nel frattempo si e' guardato altrove. */
      let IL_REGALO = {};
      /* Gli abbonamenti dei negozi (`/gestore/abbonamenti`), coi conti fatti
       * dal quadro. `null` finche' non arrivano. */
      let ABBONAMENTI = null;

      /* Le sezioni, nell'ordine della barra. L'indirizzo dice in quale si
       * e' (`#case`), e ricaricando la pagina si resta li'. */
      const LE_SCHERMATE = [
        "panoramica",
        "abbonamenti",
        "case",
        "installatori",
        "licenze",
        "versioni",
        "collegamenti",
      ];
      let schermata = LE_SCHERMATE.includes(location.hash.slice(1))
        ? location.hash.slice(1)
        : "panoramica";
      /* Come si guardano l'elenco delle case e quello delle licenze: si
       * tiene fra un ridisegno e l'altro. */
      let FILTRO_CASE = "tutte";
      let CERCA_CASE = "";
      /* L'elenco delle licenze: lo stato e la provenienza scelti, cosa si
       * cerca, i gruppi chiusi aperti a mano (le finite, i test) e quelli
       * che si vedono per intero. */
      const LO_STATO_DELLE_LICENZE = {
        filtro: "tutte",
        fonte: "tutte",
        cerca: "",
        aperti: new Set(),
        interi: new Set(),
        /* «Come funziona» aperto o chiuso a mano; `null` finche' non lo si tocca. */
        glossario: null,
        /* Le righe aperte, che mostrano la loro frase: per licenza. */
        espanse: new Set(),
      };
      /* I conti di tutta la pagina, rifatti a ogni disegno (`iConti`). */
      let CONTI = null;
      /* La scheda aperta di lato, o `null`: di che tipo (`casa`,
       * `installatore`, `nuovo`), quale, e se deve ancora salire (`appena`)
       * o sta scendendo (`chiudendo`). */
      let foglioAperto = null;
      /* Quale schermata e' stata disegnata l'ultima volta: l'anello e i metri
       * si aprono con la loro animazione la prima volta, non a ogni giro. */
      let disegnata = "";
      let animaIMetri = false;

      const ADESSO = () => Date.now();
      const dove = document.getElementById("dove");
      const doveNav = document.getElementById("nav");

      /* L'avviso in basso: una riga che compare e se ne va. Al posto di
       * `window.alert` e di `confirm`, che sul telefono si aprono come un
       * guasto di sistema. */
      const avviso = document.getElementById("avviso");
      let tempoDellAvviso = null;
      function avvisa(cosa) {
        avviso.textContent = cosa;
        avviso.classList.add("su");
        clearTimeout(tempoDellAvviso);
        tempoDellAvviso = setTimeout(() => avviso.classList.remove("su"), 2600);
      }

      /* ─── Quello che e' del cruscotto, parola per parola ────────────────
       *
       * Da qui fino a «Quello che e' solo della gestione» il programma e'
       * copiato dal cruscotto (`../console/index.html`), e una prova tiene che
       * resti uguale: la scheda di una casa si disegna in un modo solo.
       * ─────────────────────────────────────────────────────────────────── */

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      /* C'e' davvero? Quello che una casa non manda non si scrive
       * «undefined» sullo schermo di chi la ripara: o si dice che non lo dice,
       * o quel pezzo di frase non si scrive proprio. */
      const cE = (valore) => valore !== null && valore !== undefined && valore !== "";

      function daQuanto(quando) {
        const minuti = Math.round((ADESSO() - new Date(quando).getTime()) / 60000);
        if (!Number.isFinite(minuti)) return "chissà quando";
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const ilGiorno = (quando) =>
        /* In italiano, non nella lingua del browser: questa pagina e' in
         * italiano tutta, e una data in inglese in mezzo si nota. */
        new Date(quando).toLocaleDateString("it-IT", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

      const livello = (valore, attenta, male) =>
        valore >= male ? "male" : valore >= attenta ? "attenta" : "bene";

      /* Il lavoro in ballo e la manutenzione, adesso che il ponte li manda
       * davvero. Restano scritte a prova di assenza: una casa ferma a un ponte
       * di ieri queste due righe non le ha, e deve rispondere di no invece di
       * rompersi. */
      const staLavorando = (c) => Boolean(c && c.lavoro && c.lavoro.stato === "in corso");

      /* Se questa riga e' quella che sta succedendo — o quella che si e'
       * appena chiesta. Si confronta per **nome e salto di versione**, che e'
       * l'unico modo che c'e': l'entita' nel rapporto non viaggia, e non
       * viaggia apposta. */
      const eLaStessa = (uno, l) =>
        Boolean(l) && l.nome === uno.nome && l.da === uno.da && l.a === uno.a;

      /* Quante entita' non rispondono.
       *
       * Due nomi per lo stesso numero: `giu` e' quello di adesso, `sparite`
       * quello dei ponti fino alla 1.5.6. Le due righe stanno qui per il tempo
       * che ci mette l'ultima casa ad aggiornarsi: una casa ferma a ieri non
       * deve far sparire il riquadro, deve solo mostrare quello che sa. */
      const quantiGiu = (c) => c?.entita?.giu ?? c?.entita?.sparite ?? 0;

      /* Le pastiglie dei dispositivi che non rispondono.
       *
       * Col ponte di adesso sono nomi. Da una casa vecchia arrivano le quattro
       * cifre di allora, e si disegnano com'erano — col cancelletto davanti,
       * che e' il segno che quello non e' un nome.
       *
       * `dispositivi` e' quanti sono **davvero**, `nomi` quanti se ne mandano:
       * quando il secondo e' piu' corto del primo la differenza si scrive, se
       * no un elenco tagliato sembrerebbe tutti quelli che ci sono.
       *
       * Qui non si taglia niente: si disegna tutto quello che arriva, e chi
       * installa li scorre. A tagliare e' il ponte, e il suo tetto sta a
       * duecento — una guardia contro un rapporto che cresce senza fine, non
       * una scelta di impaginazione. Questa riga e' quindi il caso raro, e
       * resta perche' il giorno che capita non deve sparire un numero. */
      function iNomiGiu(c) {
        const nomi = c?.entita?.nomi;
        if (Array.isArray(nomi) && nomi.length) {
          const quanti = c?.entita?.dispositivi ?? nomi.length;
          const altri = Math.max(0, quanti - nomi.length);
          return (
            nomi.map((uno) => `<span>${testo(uno)}</span>`).join("") +
            (altri ? `<span class="eAltri">e altri ${Number(altri)}</span>` : "")
          );
        }
        return (c?.entita?.impronte || []).map((una) => `<span>#${testo(una)}</span>`).join("");
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      /* Il CHANGELOG, disegnato come lo disegna l'app.
       *
       * Le note di una versione arrivano in markdown, e fino a ieri qui
       * finivano dentro la pagina **come testo**: un `## 5.3.0` si leggeva
       * col cancelletto, un elenco di venti righe era un muro, e un
       * `**Attenzione**` si leggeva con gli asterischi. Le stesse note,
       * nell'app, si leggono disegnate — `app/lib/vestito/markdown.dart` —
       * e la stessa cosa mostrata in due modi diversi sono due cose da
       * spiegare invece di una.
       *
       * Percio' qui si fa quello che fa l'app, e **niente di piu'**: titoli,
       * elenchi, righe che separano, blocchi di codice, e dentro la riga
       * grassetto, corsivo, codice e link. La regola e' la sua: quello che
       * non sa disegnare non lo butta, lo lascia scritto com'e'. Una tabella
       * markdown viene fuori con le sue barre e si capisce; un pezzo mangiato
       * no, e chi legge non sa nemmeno che gli manca qualcosa.
       *
       * E una regola in piu', che l'app non ha bisogno di avere: **prima si
       * scappa, poi si disegna**. Queste parole non sono nostre — le ha
       * scritte chi ha fatto l'aggiornamento, cioe' uno di fuori, e da qui
       * fino alla pagina non c'e' nessun altro che le guardi. I tag li mette
       * questa funzione e nessun altro: tutto il resto passa da `testo()`
       * prima di toccare la pagina, e un `<script>` scritto dentro le note
       * si legge `<script>`. */

      const IL_TITOLO = /^(#{1,6})\s+(.*)$/;
      const IL_PUNTO = /^(\s*)[-*+]\s+(.*)$/;
      const LA_RIGA = /^\s*([-*_])\s*\1\s*\1\s*$/;
      const IL_RECINTO = /^\s*```/;

      /* I rientri scritti per intero, non composti.
       *
       * Attaccare il numero al nome — la erre, e poi quanto sta dentro —
       * funzionerebbe, e lascerebbe nella pagina una erre sola che nessuna
       * regola veste: la prova che guarda se ogni classe ha il suo stile
       * legge quello che sta prima del pezzo calcolato, e giustamente si
       * lamenta. Un elenco di quattro voci costa meno di un'eccezione in
       * quella prova. Il primo e' vuoto: un punto che non sta dentro niente
       * non ha bisogno di dirlo. */
      const I_RIENTRI = ["", ' class="r1"', ' class="r2"', ' class="r3"'];

      /* I segni dentro la riga: grassetto, codice, link, corsivo.
       *
       * Un segno aperto e mai chiuso resta il carattere che e': `**` da solo
       * si legge `**` e non si mangia il resto della riga.
       *
       * Nell'app la stessa regola guarda **indietro** — `(?<![A-Za-z0-9])` —
       * per non fare il corsivo in mezzo a `sensor_di_casa`. Qui no, e non e'
       * una svista: guardare indietro nelle espressioni regolari non lo sa
       * fare il browser di un tablet di qualche anno fa, e una regola che non
       * si sa leggere non e' una riga che si perde, e' tutta la pagina che
       * non parte. Qui il carattere di prima si prende e si rimette dov'era.
       * Le due letture danno lo stesso risultato: e' stato provato riga per
       * riga contro quella dell'app, `*a * b*` compreso. */
      const I_SEGNI =
        /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|(^|[^A-Za-z0-9])[*_](?![\s*_])(.*?\S)[*_](?![A-Za-z0-9])/g;

      /* Un link si apre solo se porta sul web.
       *
       * `javascript:` e `data:` non sono indirizzi, sono programmi, e nelle
       * note di un aggiornamento non ci hanno mai niente da fare: quello che
       * non comincia per http resta scritto com'era, parentesi comprese. */
      const SOLO_IL_WEB = /^https?:\/\//i;

      /* Il markdown, letto pezzo per pezzo. Non solleva mai e non butta mai
       * niente: al peggio un pezzo esce come paragrafo. */
      function iPezziDi(markdown) {
        const fuori = [];
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        let paragrafo = [];
        const chiudiIlParagrafo = () => {
          if (!paragrafo.length) return;
          fuori.push({ che: "paragrafo", testo: paragrafo.join(" ").trim() });
          paragrafo = [];
        };
        let dentroUnBlocco = false;
        let blocco = [];
        for (const riga of righe) {
          if (IL_RECINTO.test(riga)) {
            if (dentroUnBlocco) {
              fuori.push({ che: "blocco", testo: blocco.join("\n") });
              blocco = [];
              dentroUnBlocco = false;
            } else {
              chiudiIlParagrafo();
              dentroUnBlocco = true;
            }
            continue;
          }
          if (dentroUnBlocco) {
            blocco.push(riga);
            continue;
          }
          if (!riga.trim()) {
            chiudiIlParagrafo();
            continue;
          }
          if (LA_RIGA.test(riga)) {
            chiudiIlParagrafo();
            fuori.push({ che: "riga" });
            continue;
          }
          const titolo = IL_TITOLO.exec(riga);
          if (titolo) {
            chiudiIlParagrafo();
            fuori.push({ che: "titolo", livello: titolo[1].length, testo: titolo[2].trim() });
            continue;
          }
          const punto = IL_PUNTO.exec(riga);
          if (punto) {
