            chiudiIlParagrafo();
            /* Due spazi per rientro, come si scrive: tre o quattro contano uno. */
            fuori.push({
              che: "punto",
              testo: punto[2].trim(),
              rientro: Math.floor(punto[1].length / 2),
            });
            continue;
          }
          paragrafo.push(riga.trim());
        }
        /* Un blocco lasciato aperto — un recinto senza l'altro — non si perde. */
        if (dentroUnBlocco && blocco.length)
          fuori.push({ che: "blocco", testo: blocco.join("\n") });
        chiudiIlParagrafo();
        return fuori;
      }

      /* I segni di una riga gia' scappata. Quello che entra e' testo
       * innocuo, quello che esce ha dentro solo i tag scritti qui. */
      const iSegniDi = (riga) =>
        riga.replace(I_SEGNI, (tutto, grassetto, codice, ilTesto, dove, prima, corsivo) => {
          if (grassetto !== undefined) return `<strong>${/* già HTML */ grassetto}</strong>`;
          if (codice !== undefined) return `<code>${/* già HTML */ codice}</code>`;
          if (ilTesto !== undefined) {
            /* Il link si preme, e si apre di fianco. `noreferrer` perche' a
             * chi ha scritto l'aggiornamento non deve arrivare l'indirizzo
             * del quadro di nessuno. */
            if (!SOLO_IL_WEB.test(dove)) return tutto;
            return `<a href="${/* già HTML */ dove}" target="_blank" rel="noopener noreferrer">${/* già HTML */ ilTesto}</a>`;
          }
          return `${/* già HTML */ prima}<em>${/* già HTML */ corsivo}</em>`;
        });

      /* Dal titolo di quella versione in giu'.
       *
       * Home Assistant, quando gli si chiedono le note di un aggiornamento,
       * risponde col changelog **intero**. Chi ha appena letto «1.5.9 →
       * 1.5.10» sulla riga non vuole ricominciare dal principio della storia:
       * vuole leggere la 1.5.10. Quello che c'era prima del suo titolo si
       * lascia fuori, le versioni di prima restano sotto — che e' dove si va
       * a cercarle. Se quel titolo non c'e' non si taglia niente.
       *
       * E' la stessa regola dell'app, parola per parola. */
      const perCercare = (cosa) => String(cosa).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      function daQuellaVersione(markdown, versione) {
        const quale = String(versione || "").trim();
        if (!quale) return markdown;
        const ilTitoloGiusto = new RegExp(`(^|[^0-9.])${perCercare(quale)}([^0-9.]|$)`);
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        for (let quante = 0; quante < righe.length; quante += 1) {
          if (/^#{1,6}\s/.test(righe[quante]) && ilTitoloGiusto.test(righe[quante])) {
            return righe
              .slice(quante + 1)
              .join("\n")
              .trim();
          }
        }
        return markdown;
      }

      /* Il markdown, disegnato. Dentro non ci finisce un solo carattere di
       * fuori che non sia passato da `testo()`. */
      function ilMarkdown(markdown) {
        let fuori = "";
        let elenco = false;
        const chiudiLElenco = () => {
          if (elenco) fuori += "</ul>";
          elenco = false;
        };
        for (const pezzo of iPezziDi(testo(markdown))) {
          if (pezzo.che !== "punto") chiudiLElenco();
          if (pezzo.che === "titolo") {
            /* `h3` e non `h1`: qui dentro si sta sotto il titolo di una casa,
             * e chi legge con lo schermo sente i livelli. */
            const quale = pezzo.livello === 1 ? "h3" : pezzo.livello === 2 ? "h4" : "h5";
            fuori += `<${quale}>${iSegniDi(pezzo.testo)}</${quale}>`;
          } else if (pezzo.che === "paragrafo") {
            fuori += `<p>${iSegniDi(pezzo.testo)}</p>`;
          } else if (pezzo.che === "punto") {
            if (!elenco) {
              fuori += "<ul>";
              elenco = true;
            }
            fuori += `<li${I_RIENTRI[Math.min(3, pezzo.rientro)]}>${iSegniDi(pezzo.testo)}</li>`;
          } else if (pezzo.che === "riga") {
            fuori += "<hr />";
          } else if (pezzo.che === "blocco") {
            fuori += `<pre><code>${/* già HTML */ pezzo.testo}</code></pre>`;
          }
        }
        chiudiLElenco();
        return fuori;
      }

      /* Come va un controllo: verde, rosso, e il terzo.
       *
       * Il terzo e' quello che si scordava. `va` puo' essere `true`, `false` o
       * `null`, e `null` vuol dire che quel pezzo di rapporto la casa non lo
       * manda — una senza System Monitor non manda la macchina. Per un pezzo
       * la pagina lo disegnava come le righe rotte, cioe' faceva vedere un
       * guaio dove c'era solo silenzio. Adesso il silenzio ha un colore suo,
       * spento, e si legge per quello che e'. */
      const comeVa = (uno) => (uno.va === true ? "bene" : uno.va === false ? "male" : "ignoto");

      const IL_BOLLINO = { bene: "✓", male: "✗", ignoto: "◇" };

      /* Quello che sente chi legge lo schermo con le orecchie: il bollino e'
       * un disegno, e da solo non dice niente. */
      const A_PAROLE = { bene: "in ordine", male: "anomalia", ignoto: "non rilevato" };

      /* Di chi sono le icone degli aggiornamenti che si disegnano: di chi
       * segue la casa aperta nel foglio. */
      const diChiSonoLeIcone = () => foglioAperto?.chi;

      /* Il segno di un aggiornamento: il logo di chi lo porta, o l'iniziale.
       *
       * Tre casi, in ordine. La roba nostra porta il bollo del quadro, che e'
       * disegnato qui e non si scarica da nessuna parte. Chi ha un marchio lo
       * fa vedere — e sotto c'e' comunque l'iniziale, cosi' una casa senza
       * internet o un marchio che non esiste finiscono sulla lettera invece
       * che su un quadratino rotto. Chi non ce l'ha resta sull'iniziale, che
       * e' quello che fa gia' l'app.
       *
       * Se l'immagine non arriva si toglie, e scopre la lettera che sta sotto. */
      function ilSegnoDi(uno) {
        if (uno.nostra)
          return '<span class="bollo" aria-hidden="true"><i></i><i class="mezzo"></i><i></i></span>';
        const primo = testo(
          String(uno.nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase() || "?",
        );
        /* **L'icona vera, e arriva dalla casa.**
         *
         * Prima si mandava questo browser su `brands.home-assistant.io` con una
         * parola presa dal rapporto, e c'erano due guai in uno: questo browser
         * andava a farsi vedere da una macchina che non e' la sua, e quello che
         * trovava era sbagliato — il logo di HACS al posto di quello
         * dell'applicazione (per un'integrazione installata da HACS quella
         * parola **e'** `hacs`), e niente del tutto per un firmware, che una
         * parola non ce l'ha.
         *
         * L'icona giusta ce l'ha la casa: gliela da' il suo Supervisor per gli
         * add-on e i marchi per le integrazioni, che e' esattamente quello che
         * il ponte fa gia' per l'app sul telefono. La manda una volta sola, e
         * il quadro la serve dal suo indirizzo.
         *
         * Il segno e' sedici cifre esadecimali, ricontrollate qui: finisce
         * dentro un indirizzo, e chi lo compone e' questa riga. Un controllo
         * solo, dall'altra parte di una rete, non e' un controllo. */
        if (!/^[0-9a-f]{16}$/.test(String(uno.segno || "")))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* La lettera resta sotto: finche' l'icona non e' arrivata — il primo
         * giro dopo che un aggiornamento compare — la riga si legge lo stesso,
         * e se non arrivera' mai si legge per sempre. */
        /* `../segno/`, con il punto punto.
         *
         * Questa pagina sta in `/console/`, e un indirizzo scritto `segno/…`
         * si legge da li': `/console/segno/…`, dove non c'e' niente. L'icona
         * si serve da `/segno/…`, che sta una cartella piu' su — senza chiave,
         * perche' un'icona di Mosquitto non e' roba di nessuno.
         *
         * Scritto `/segno/…` con la barra davanti funzionerebbe qui e si
         * romperebbe dietro un proxy che monta il quadro sotto un prefisso.
         * Con il punto punto si conta dalla pagina, e vale in tutt'e due i
         * casi. */
        /* Con davanti l'installatore: le icone stanno nella sua cartella
         * (`src/segni.js`), e l'indirizzo lo dice. */
        const diChi = String(diChiSonoLeIcone() || "");
        if (!/^inst_[0-9a-f]{16}$/.test(diChi))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* Un'icona che non arriva si toglie, e sotto resta la lettera: lo fa
         * l'ascolto in cima allo script, e non un `onerror` scritto
         * dentro il tag — la politica della pagina lascia girare solo gli
         * script che sono nel file. */
        return `<span class="segno">${/* già HTML */ primo}<img
          src="../segno/${testo(diChi)}/${testo(uno.segno)}"
          alt=""
          loading="lazy"
          data-se-non-arriva="via"
        /></span>`;
      }

      /* Cosa cambia, con le parole di chi l'ha scritto.
       *
       * E' il `release_summary` dell'entita', che Home Assistant taglia gia'
       * corto. Va disegnato **come testo**: arriva da fuori, e qui dentro non
       * ci si fida di niente che arrivi da fuori. Le note lunghe stanno a un
       * indirizzo, e per leggerle serve il filo con la casa — che il quadro
       * non ha — quindi li' si manda il browser.
       *
       * Niente di tutto questo e' obbligatorio: chi non dice niente non
       * occupa una riga vuota. */
      function cosaCambia(uno) {
        const detto = testo(String(uno.cosaCambia || "").trim());
        /* Le note intere si aprono **qui**, non fuori.
         *
         * Prima era un collegamento che portava sul sito di chi ha scritto
         * l'aggiornamento: leggere cosa cambia prima di premere «Installa»
         * voleva dire uscire dal cruscotto, e chi esce non sempre torna. Adesso
         * le note le manda la casa insieme all'icona, e si aprono sotto la
         * riga.
         *
         * Il tasto c'e' solo se ci sono davvero: il quadro le ha ricevute e le
         * tiene. Se non ci sono, resta il riassunto — e se non c'e' nemmeno
         * quello, la riga non si allunga per niente. */
        const suo = String(uno.segno || "");
        const note = /^[0-9a-f]{16}$/.test(suo) && CON_LE_NOTE.has(suo);
        const dentro = note
          ? ` <button type="button" class="comeUnLink" data-note="${testo(suo)}">cosa cambia, per intero</button>`
          : "";
        if (!detto && !dentro) return "";
        return `<p class="cambia">${/* già HTML */ detto}${/* già HTML */ dentro}</p><div class="leNote" data-note-di="${testo(suo)}" data-note-a="${testo(String(uno.a || ""))}" hidden></div>`;
      }

      /* Una riga di aggiornamento: il segno, cosa e', cosa si fa, cosa cambia.
       *
       * Una sola, e la usano tutt'e due le schermate — la scheda di una casa e
       * la flotta. Prima erano due disegni diversi per la stessa cosa: righe
       * di qua, pastigline di la', e nella flotta non si vedeva ne' il logo ne'
       * cosa cambiava. Due disegni per una cosa sola vuol dire che uno dei due
       * resta indietro, ed era sempre lo stesso.
       *
       * `fare` e' quello che si puo' fare su questa riga: lo passa chi disegna,
       * perche' dipende dalla casa — la manutenzione aperta, un lavoro in
       * ballo — e non dall'aggiornamento. */
      function unaRiga(uno, { fare = "" } = {}) {
        return `
          <li>
            ${ilSegnoDi(uno)}
            <span class="che">
              <b>${testo(uno.nome)}</b>
              <span class="salto">${testo(uno.da)} → ${testo(uno.a)}</span>
            </span>
            <span class="fare">${/* già HTML */ fare}</span>
            ${cosaCambia(uno)}
          </li>`;
      }

      const spia = (stato) =>
        `<span class="pastiglia ${testo(stato.chiave)}"><span aria-hidden="true">${testo(stato.segno)}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` offline, spazio «non c'era
       * ancora». */
      function laStriscia(giorni, grande = false) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="offline tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="offline per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non ancora abbinato"></i>';
            return '<i title="tutti i rapporti ricevuti"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} dall'abbinamento`
            : vuoti === 0
              ? "14 giorni, sempre online"
              : `14 giorni · offline ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="giorni${grande ? " grande" : ""}" role="img" aria-label="${testo(dice)}">${/* già HTML */ celle}</div><div class="giorniDice">${testo(dice)}</div>`;
      }

      const TINTA_DI = {
        offline: "rosso",
        guardare: "ambra",
        posto: "verde",
        male: "rosso",
        attenta: "ambra",
        bene: "verde",
      };

      /* Un anellino: un valore in centesimi, colorato come va. */
      function anellino(valore, come, animato = false) {
        const r = 27;
        const C = 2 * Math.PI * r;
        const quanto = (Math.max(0, Math.min(100, Number(valore) || 0)) / 100) * C;
        const fine = `${quanto.toFixed(2)} ${(C - quanto).toFixed(2)}`;
        return `<svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="${Number(r)}" class="traccia" />
          <circle cx="32" cy="32" r="${Number(r)}" class="arco" stroke="var(--${TINTA_DI[come] || "verde"})"
            stroke-dasharray="${animato ? `0 ${C.toFixed(2)}` : /* già HTML */ fine}"${animato ? ` data-fine="${/* già HTML */ fine}"` : ""} /></svg>`;
      }

      /* Gli archi disegnati a zero si aprono al frame dopo: cosi' la
       * transizione li vede cambiare, e li accompagna. */
      function apriGliArchi(radice) {
        if (!radice) return;
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            radice.querySelectorAll("circle.arco[data-fine]").forEach((cerchio) => {
              cerchio.setAttribute("stroke-dasharray", cerchio.dataset.fine);
            });
          }),
        );
      }

      /* Un metro e' un anellino: il valore dentro, il nome sotto. `quanto` e'
       * la parte di cerchio da riempire, in centesimi della scala, e `come` lo
       * colora. Si apre con la sua animazione solo quando il foglio sale:
       * ai giri dopo si disegna gia' pieno. */
      function unMetro({ che, valore, unita = "%", sotto = "", come, quanto }) {
        const animato = Boolean(foglioAperto?.appena);
        /* Quello che questa casa non dice non si disegna a zero: una CPU che
         * non c'e' non e' una CPU allo zero per cento. */
        if (valore === null || valore === undefined)
          return `
            <div class="anellino">
              <div class="cerchio">${anellino(0, "bene", false)}<b class="attenta">—</b></div>
              <span>${testo(che)}</span>
              <small class="nonLoDice">non comunicato</small>
            </div>`;
        return `
          <div class="anellino">
            <div class="cerchio">
              ${anellino(quanto, come, animato)}<b class="${come === "bene" ? "" : testo(come)}">${testo(valore)}${testo(unita)}</b>
            </div>
            <span>${testo(che)}</span>
            ${sotto ? `<small>${testo(sotto)}</small>` : ""}
          </div>`;
      }

      /* Un riquadro che dice che non si sa, invece di uno che disegna zeri. */
      function riquadroMuto(titolo, perché) {
        return `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>${testo(titolo)}</h3></div>
            <p class="nota">${testo(perché)}</p>
          </section>`;
      }

      /* La macchina: quello che il Supervisor sa del ferro sotto Home
       * Assistant, più la temperatura che la plancia disegna già.
       *
       * `discoVita` è la riga che su queste schede conta davvero e che nessuno
       * guarda: una eMMC o una microSD hanno un numero di scritture e poi
       * finiscono. Quando c'è, ha la sua barra; su una macchina che non la
       * dichiara — un NUC con un SSD — non si inventa. */
      function laMacchina(c) {
        const m = c.macchina;
        /* Un rapporto senza macchina non e' una casa senza macchina: e' una
         * casa il cui Supervisor non ha risposto. Si dice, e non si disegnano
         * cinque metri a zero. */
        if (!m)
          return riquadroMuto("La macchina", "Il Supervisor di questo impianto non ha risposto.");
        const metri = [
          unMetro({
            che: "CPU",
            valore: m.cpu,
            quanto: m.cpu,
            come: livello(m.cpu, 70, 90),
          }),
          unMetro({
            che: "Memoria",
            valore: m.ram,
            quanto: m.ram,
            come: livello(m.ram, 75, 90),
          }),
          unMetro({
            che: "Disco",
            valore: m.disco,
            quanto: m.disco,
            sotto: cE(m.discoLiberi) ? `${m.discoLiberi} GB liberi` : "",
            come: livello(m.disco, 75, SOGLIE.discoPieno),
          }),
          unMetro({
            che: "Temperatura",
            valore: m.temperatura,
            unita: "°",
            quanto: m.temperatura,
            sotto: `soglia a ${SOGLIE.troppoCaldo}°`,
            come: livello(m.temperatura, SOGLIE.troppoCaldo - 10, SOGLIE.troppoCaldo),
          }),
        ];
        if (m.discoVita !== null)
          metri.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, SOGLIE.discoFinito),
            }),
          );

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La macchina</h3>
              <span class="conta">${testo(m.scheda)}</span>
            </div>
            <div class="tre-anelli">${metri.join("")}</div>
            <p class="verdetto">
              ${[
                cE(c.sistema) ? testo(c.sistema) : "",
                cE(m.accesaDa) ? `accesa da ${plurale(m.accesaDa, "giorno", "giorni")}` : "",
              ]
                .filter(Boolean)
                .join(" · ")}${cE(c.sistema) || cE(m.accesaDa) ? "." : ""}
              ${
                m.discoVita !== null && m.discoVita >= DISCO_STANCO
                  ? `Il disco è consumato al ${testo(m.discoVita)}%: su queste schede è il primo componente a guastarsi, meglio sostituirlo per tempo.`
                  : m.temperatura >= SOGLIE.troppoCaldo
                    ? `Sopra i ${Number(SOGLIE.troppoCaldo)}° la scheda riduce la velocità da sola: l'impianto non si guasta, ma rallenta.`
                    : "Nessun valore fuori soglia."
              }
            </p>
          </section>`;
      }

      /* Il cartello in cima agli aggiornamenti: cosa sta succedendo in questa
       * casa, o com'è finita l'ultima volta.
       *
       * I nomi degli stati sono quelli che manda il ponte — `in corso`,
       * `fatto`, `non riuscito` — e non una traduzione fatta qui: due
       * vocabolari per la stessa cosa vogliono dire un cartello che smette di
       * comparire il giorno che uno dei due cambia, in silenzio. */
      function ilCartello(c, chiesto = null) {
        /* Prima di tutto quello che si è appena chiesto e che la casa non è
         * ancora passata a prendersi: sono i secondi in cui chi ha premuto il
         * tasto si chiede se ha funzionato. */
        if (chiesto)
          return `
            <div class="cartello">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                <b>${
                  chiesto.cosa === "riavvia"
                    ? "Il riavvio di Home Assistant"
                    : chiesto.cosa === "configura"
                      ? `La configurazione della plancia «${testo(chiesto.nome)}»`
                      : `${testo(chiesto.nome)} ${testo(chiesto.da)} → ${testo(chiesto.a)}`
                }</b>
                è stato richiesto ${testo(daQuanto(chiesto.chiesto))}. Parte al prossimo rapporto di questo impianto: è l'impianto a ritirare il comando, il cruscotto non lo contatta.
              </span>
            </div>`;
        const l = c.lavoro;
        /* Non `=== null`: una casa ferma a un ponte di ieri questa riga non la
         * manda affatto, e `undefined` non è `null`. */
        if (!l) return "";
        if (l.stato === "fatto")
          return `
            <div class="cartello bene">
              <span class="gettone" aria-hidden="true">✓</span>
              <span><b>${testo(l.cosa)}</b> ${l.riavvio ? "fatto" : l.configurazione ? "applicata" : "installato"} ${testo(daQuanto(l.quando))}, dal cruscotto.${
                l.configurazione && l.perche ? ` ${testo(l.perche)}.` : ""
              }</span>
            </div>`;
        if (l.stato === "non riuscito")
          return `
            <div class="cartello male">
              <span class="gettone" aria-hidden="true">✕</span>
              <span
                ><b>${testo(l.cosa)}</b> non è riuscito ${testo(daQuanto(l.quando))}:
                ${testo(l.perche || "l'impianto ha rifiutato")}.</span
              >
            </div>`;
        const fermi = Math.round((ADESSO() - new Date(c.quando).getTime()) / 60000);
        const tardi = l.stacca && fermi > 45;
        return `
          <div class="cartello ${tardi ? "male" : ""}">
            <span class="gettone" aria-hidden="true">${tardi ? "!" : "◴"}</span>
            <span>
              <b>${testo(l.cosa)}</b> è partito ${testo(daQuanto(l.quando))}${
                tardi
                  ? ` e questo impianto non ha più risposto. Un riavvio dura pochi minuti: serve un intervento sul posto.`
                  : l.stacca
                    ? `. L'impianto si riavvia: per qualche minuto non risponde, ed è normale.`
                    : `. L'esito arriva col prossimo rapporto.`
              }
            </span>
          </div>`;
      }

      /* La rete: le schede che il Supervisor dichiara, più gli apparati di
       * casa che la plancia già sorveglia.
       *
       * I due pezzi non sono la stessa cosa e non vanno confusi. Le schede
       * sono quelle **della macchina** e le sa il Supervisor senza che
       * nessuno configuri niente. Gli apparati — il router, i ripetitori —
       * sono i `binary_sensor` con `device_class: connectivity` che la
       * sezione «Macchine e rete» della plancia adotta per integrazione: ci
       * sono se chi ci abita li ha spuntati, e dove non sono spuntati qui
       * si dice zero invece di fingere. */
      function laRete(c) {
        const r = c.rete;
        if (!r)
          return riquadroMuto("La rete", "Questo impianto non ha comunicato lo stato della rete.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La rete</h3>
              <span class="pastiglia ${r.internet ? "bene" : "male"}">
                ${r.internet ? "internet raggiungibile" : "senza internet"}
              </span>
            </div>
            <ul class="schede">
              ${r.schede
                .map(
                  (una) => `
                <li class="${una.su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(una.nome)}</span>
                  <span class="tipo pastiglia">${testo(una.tipo === "wifi" ? "Wi-Fi" : "cavo")}</span>
                  ${una.principale ? '<span class="pastiglia bene">principale</span>' : ""}
                  ${
                    una.tipo === "wifi" && una.su && una.segnale !== null
                      ? `<span class="pastiglia ${una.segnale < SEGNALE_DEBOLE ? "attenta" : ""}">segnale ${testo(una.segnale)}%</span>`
                      : ""
                  }
                  <span class="dove">${una.su ? testo(una.ip || "senza indirizzo") : "non attiva"}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                r.sorvegliate.quante === 0
                  ? "Nessun apparato di rete monitorato in questo impianto: nella plancia, sezione «Macchine e rete», si seleziona l'integrazione del router e i ripetitori compaiono da soli."
                  : r.sorvegliate.giu === 0
                    ? `${plurale(r.sorvegliate.quante, "apparato monitorato", "apparati monitorati")}, tutti raggiungibili.`
                    : `${testo(r.sorvegliate.giu)} ${r.sorvegliate.giu === 1 ? "apparato" : "apparati"} su ${testo(r.sorvegliate.quante)} non rispondono.`
              }
            </p>
          </section>`;
      }

      /* Gli add-on, e la sola domanda che conta: ce n'è qualcuno che dovrebbe
       * girare e non gira? */
      function gliAddon(c) {
        const a = c.addon;
        if (!a)
          return riquadroMuto("Gli add-on", "Questo impianto non ha comunicato i suoi add-on.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli add-on</h3>
              <span class="conta">${testo(a.accesi)}/${testo(a.quanti)} accesi</span>
            </div>
            <div class="addon">
              ${a.elenco
                .map((uno) => {
                  const come = uno.su ? "" : uno.allAvvio ? "fermo" : "apposta";
                  return `<span class="uno ${testo(come)}"
                    ><span class="puntino" aria-hidden="true"></span>${testo(uno.nome)}${
                      uno.su ? "" : uno.allAvvio ? " · fermo" : " · spento manualmente"
                    }</span>`;
                })
                .join("")}
            </div>
            <p class="verdetto">
              ${
                a.spentiCheDovrebbero === 0
                  ? "Nessun add-on con avvio automatico è fermo. Quelli spenti manualmente restano spenti: li ha spenti qualcuno."
                  : `${plurale(a.spentiCheDovrebbero, "add-on parte", "add-on partono")} all'avvio e in questo momento ${a.spentiCheDovrebbero === 1 ? "è fermo" : "sono fermi"}. Un add-on con avvio automatico non si spegne da solo: si è arrestato.`
              }
            </p>
          </section>`;
      }
      /* ─── Quello che e' solo della gestione ─────────────────────────── */

      class ChiaveNoNo extends Error {}

      async function chiedi(via, opzioni = {}) {
        /* In relativo: da `/gestore/` porta dove deve, e funziona anche dietro
         * un proxy che monta il quadro sotto un prefisso. */
        const risposta = await fetch(via.replace(/^\//, ""), {
          ...opzioni,
          headers: {
            authorization: `Bearer ${chiave}`,
            "content-type": "application/json",
            ...(opzioni.headers || {}),
          },
        });
        if (risposta.status === 401) throw new ChiaveNoNo();
        const corpo = await risposta.json().catch(() => ({}));
        if (!risposta.ok) throw new Error(corpo.errore || "non ha funzionato");
        return corpo;
      }

      function prendi(detto) {
        INSTALLATORI = detto.installatori || [];
        CASE = detto.case || 0;
        ORFANE = detto.orfane || 0;
      }

      /* Le case di ognuno, tutte insieme. Una che non arriva non fa cadere
       * le altre: si tiene quello che si aveva, e si riprova al giro dopo. */
      async function caricaLeCase() {
        const coppie = await Promise.all(
          INSTALLATORI.map(async (uno) => {
            try {
              return [uno.chi, await chiedi(`/installatore/${encodeURIComponent(uno.chi)}/case`)];
            } catch (_male) {
              return [uno.chi, LE_CASE_DI.get(uno.chi) || null];
            }
          }),
        );
        LE_CASE_DI = new Map(coppie);
        CON_LE_NOTE = new Set(coppie.flatMap(([, dette]) => dette?.note || []));
        for (const [, dette] of coppie) if (dette?.soglie) SOGLIE = dette.soglie;
      }

      async function carica() {
        prendi(await chiedi("/installatori"));
        await caricaLeCase();
        /* Le licenze: se non arrivano si tiene quello che c'era. */
        try {
          LICENZE = await chiedi("/licenze");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
        }
        /* Gli abbonamenti: lo stesso, si tiene quello che c'era. */
        try {
          ABBONAMENTI = await chiedi("/abbonamenti");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
        }
        /* I numeri non sono essenziali: se non arrivano, la pagina va avanti
         * e lo dice nel suo riquadro. Una chiave rifiutata invece si dice. */
        try {
          SALUTE = await chiedi("/salute");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
          SALUTE = null;
        }
      }

      /* Da quanto e' acceso, in parole: i secondi del tramite. */
      function daQuantoAcceso(secondi) {
        const s = Number(secondi);
        if (!Number.isFinite(s) || s < 0) return "";
        if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min`;
        if (s < 86400) return `${Math.round(s / 3600)} ore`;
        const giorni = Math.round(s / 86400);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
      }

      /* Il riquadro «Il servizio», nella Panoramica: le macchine di gdahome,
       * una riga per una.
       *
       * Tre righe — il quadro, il tramite (l'accesso da fuori casa) e
       * l'assistenza — e a destra di ognuna la pastiglia che dice come sta. Una
       * macchina che non risponde lo dice nella sua pastiglia, non in fondo a
       * una riga di testo: e' la cosa per cui il riquadro esiste. «Non mi
       * aggiorno» arrivava da /salute e non lo leggeva nessuno: adesso e' la
       * pastiglia del quadro, e sotto c'e' scritto da quanto e perche'.
       *
       * Sotto, chiusi, i numeri di ognuna.
       *
       * ── Le mattonelle del tramite, e cosa contano ──────────────────────
       *
       * «Le 140 case collegate cosa significa, che sono sul tramite o in
       * generale stanno usando gdahome?»
       *
       * Significava la prima, e la parola faceva credere la seconda. Le altre
       * due erano peggio: «collegamenti aperti» era la somma dei fili —
       * abbinamenti in corso compresi — e non voleva dire niente per nessuno,
       * e «app aperte» contava chiunque fosse abbinato, l'app sul telefono e
       * una scheda di browser nello stesso numero.
       *
       * Adesso ogni mattonella risponde a una domanda sola:
       *
       *   impianti con gdahome    quanti hanno installato l'add-on (un totale:
       *                           resta anche quando la casa e' spenta)
       *   collegati adesso        quanti di quelli hanno il filo aperto in
       *                           questo istante — installato e funzionante
       *   la guardano dall'app    quante app aperte adesso
       *   la guardano dal browser quante pagine aperte adesso
       *
       * I primi due sono impianti, gli altri due schermi, e un impianto solo
       * puo' avere tre schermi aperti o nessuno.
       *
       * Le prime due non le sa dire un tramite non ancora aggiornato: arrivano
       * `null`, e allora la mattonella non si disegna. Uno zero direbbe che
       * nessuno ha installato gdahome.
       *
       * Questo riquadro si prova da solo, fuori dalla pagina: per questo usa
       * soltanto `SALUTE`, `testo`, `LE_ICONE`, `daQuantoAcceso` e
       * `oreInParole`, e il plurale se lo fa da se'. */
      function ilServizio() {
        if (!SALUTE) return "";

        const mattonella = (tinta, disegno, valore, nome) =>
          `<div class="servizio-conto ${testo(tinta)}">
             <span class="servizio-conto-ic" aria-hidden="true">${LE_ICONE[disegno]}</span>
             <b>${testo(valore)}</b><span>${testo(nome)}</span>
           </div>`;

        /* La parola la porta chi chiama: «segnalazioni attive» e «posta
         * attiva» non si ricavano l'una dall'altra, e una spia con la parola
         * sbagliata e' peggio di una spia sola. */
        const interruttore = (nome, acceso, si, no) =>
          `<span class="interruttore" data-acceso="${acceso ? "sì" : "no"}"><i></i>${testo(nome)} <b>${testo(acceso ? si : no)}</b></span>`;

        const riga = (pallino, chi, sotto, stato, parola, guaio = "") =>
          `<li>
             <span class="pallino ${testo(pallino)}" aria-hidden="true"></span>
             <span class="riga-testo">
               <b>${testo(chi)}</b><span>${testo(sotto)}</span>${guaio ? `<span class="dice-male">${testo(guaio)}</span>` : ""}
             </span>
             <span class="pastiglia ${testo(stato)}">${testo(parola)}</span>
           </li>`;

        const fermo = SALUTE.nonMiAggiorno;
        const delQuadro = riga(
          fermo ? "ambra" : "verde",
          "Quadro",
          `Installatori, licenze e abbonamenti${SALUTE.versione ? ` · versione ${SALUTE.versione}` : ""}`,
          fermo ? "guardare" : "posto",
          fermo ? "non si aggiorna" : "in ordine",
          fermo
            ? `Fermo da ${oreInParole(fermo.ore)} — ${fermo.perche || "non si sa perché"}.`
            : "",
        );

        const t = SALUTE.tramite;
        const acceso =
          t && t.vivo && t.accesoDa !== null && t.accesoDa !== undefined
            ? daQuantoAcceso(t.accesoDa)
            : "";
        const delTramite = t
          ? riga(
              t.vivo ? "verde" : "rosso",
              "Tramite",
              `L'accesso da fuori casa${acceso ? ` · acceso da ${acceso}` : ""}`,
              t.vivo ? "posto" : "offline",
              t.vivo ? "acceso" : "non risponde",
            )
          : riga("", "Tramite", "L'accesso da fuori casa", "quieta", "non risponde di qui");

        /* L'assistenza sono tre interruttori del tramite: tutti e tre accesi
         * e' «attiva», nessuno e' «spenta», e in mezzo si dice. */
        const accese = t ? [t.segnalazioni, t.console, t.posta].filter(Boolean).length : 0;
        const chat = t ? Number(t.chat) || 0 : 0;
        const dellAssistenza = t
          ? riga(
              accese === 3 ? "verde" : accese ? "ambra" : "",
              "Assistenza",
              `Segnalazioni, chat e posta · ${chat === 1 ? "una conversazione" : `${chat} conversazioni`}`,
              accese === 3 ? "posto" : accese ? "guardare" : "quieta",
              accese === 3 ? "attiva" : accese ? "in parte" : "spenta",
            )
          : "";

        const iNumeriDelQuadro = `
          <div class="servizio-blocco">
            <p class="servizio-titolo">Il quadro</p>
            <div class="servizio-conti">
              ${/* già HTML */ mattonella("blu", "casa", Number(SALUTE.case) || 0, "case seguite")}
              ${/* già HTML */ mattonella("verde", "installatori", Number(SALUTE.installatori) || 0, "installatori")}
            </div>
          </div>`;

        const iNumeriDelTramite = !t
          ? `<div class="servizio-blocco">
               <p class="minuta" style="margin: 0">Il tramite non risponde da questa macchina: se sta su un'altra, i suoi numeri si leggono lì con <code>curl -s http://127.0.0.1:8099/salute</code>.</p>
             </div>`
          : `<div class="servizio-blocco">
               <p class="servizio-titolo">Il tramite</p>
               <div class="servizio-conti">
                 ${
                   /* già HTML */ t.installate === null
                     ? ""
                     : mattonella("blu", "casa", t.installate, "impianti con GdAHome")
                 }
                 ${/* già HTML */ mattonella("verde", "filo", Number(t.case) || 0, "collegati adesso")}
                 ${/* già HTML */ mattonella("verde", "telefono", Number(t.app) || 0, "la guardano dall'app")}
                 ${
                   /* già HTML */ t.web === null
                     ? ""
                     : mattonella("verde", "browser", t.web, "la guardano dal browser")
                 }
                 ${/* già HTML */ mattonella("ambra", "chat", Number(t.chat) || 0, "conversazioni di assistenza")}
               </div>
               <div class="interruttori">
                 ${/* già HTML */ interruttore("segnalazioni", t.segnalazioni, "attive", "non attive")}
                 ${/* già HTML */ interruttore("console dell'assistenza", t.console, "attiva", "non attiva")}
                 ${/* già HTML */ interruttore("posta", t.posta, "attiva", "non attiva")}
               </div>
             </div>`;

        return `
          <section class="scheda">
            <h3><span class="tondino verde">${LE_ICONE["quadro"]}</span>Il servizio</h3>
            <p class="sotto">I server di GdAHome: se uno si ferma, si vede qui per primo.</p>
            <ul class="elenco">
              ${/* già HTML */ delQuadro}
              ${/* già HTML */ delTramite}
              ${/* già HTML */ dellAssistenza}
            </ul>
            <details class="apri-riga">
              <summary>I numeri del servizio<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
              ${/* già HTML */ iNumeriDelQuadro}
              ${/* già HTML */ iNumeriDelTramite}
            </details>
          </section>`;
      }

      /* Le ore ferme dell'aggiornamento, in parole: oltre le quarantotto si
       * contano in giorni, che e' come le conta chi legge. */
      function oreInParole(ore) {
        const n = Number(ore);
        if (!Number.isFinite(n) || n < 1) return "poco";
        if (n < 48) return `${Math.round(n)} ${Math.round(n) === 1 ? "ora" : "ore"}`;
        const giorni = Math.round(n / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
      }

      /* Da quanto un installatore non apre il suo cruscotto, in parole. */
      function daQuantoEntra(vistoIl) {
        if (!vistoIl) return "mai";
        const ore = (ADESSO() - vistoIl) / 3600000;
        if (ore < 24) return "oggi";
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      /* Lo stato di un installatore: una parola e un colore, mai il colore
       * da solo. Sospeso batte tutto: di uno che non entra piu' non conta se
       * sia al limite o da quanto non si fa vedere. «Vicino al limite» e' da
       * nove case su dieci in su: abbastanza presto per alzargli il limite
       * prima che un cliente resti fuori. */
      function loStato(uno) {
        if (uno.congelato) return { come: "congelato", parola: "sospeso" };
        if (uno.pieno) return { come: "limite", parola: "al limite" };
        if (uno.soglia > 0 && (Number(uno.case) || 0) >= uno.soglia * 0.9)
          return { come: "limite", parola: "vicino al limite" };
        if (!uno.vistoIl) return { come: "quieta", parola: "nessun accesso" };
        if ((ADESSO() - uno.vistoIl) / 86400000 > 30) return { come: "quieta", parola: "inattivo" };
        return { come: "posto", parola: "in ordine" };
      }

        stella:

        pausa:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="5" y="4.4" width="3.2" height="11.2" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="11.8" y="4.4" width="3.2" height="11.2" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>',
        cestino:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.6 5.8h12.8M7.8 5.8v-2h4.4v2M5.2 5.8l.8 10.4h8l.8-10.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        matita:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.6 16.4h3.2l8.8-8.8-3.2-3.2-8.8 8.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11 6.2 2.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        ok: '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.8"/><path d="m6.9 10.2 2.2 2.2 4.1-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        /* I tre puntini del menu di una riga. */
        altro:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="4.6" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="15.4" cy="10" r="1.6" fill="currentColor"/></svg>',
        /* «In arrivo»: un calendario. «Come funziona»: un libro aperto. */
        calendario:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4.4" width="14" height="12.6" rx="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M3 8.4h14M7 2.8v3M13 2.8v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="7.2" cy="11.9" r="1" fill="currentColor"/><circle cx="10" cy="11.9" r="1" fill="currentColor"/></svg>',
        libro:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5.6C8.4 4.3 6 3.8 3 4v11.2c3-.2 5.4.3 7 1.6 1.6-1.3 4-1.8 7-1.6V4c-3-.2-5.4.3-7 1.6zM10 5.6v11.2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
      };

      /* Le iniziali per il tondo: le prime lettere delle prime due parole. */
      function laSigla(nome) {
        const parole = String(nome || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        if (!parole.length) return "?";
        return parole
          .slice(0, 2)
          .map((una) => una[0].toUpperCase())
          .join("");
      }

      const numero = (n) => new Intl.NumberFormat("it-IT").format(Number(n) || 0);

      /* I metri degli installatori si riempiono al frame dopo, come gli archi. */
      function apriIMetri(radice) {
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            radice.querySelectorAll(".metro i[data-fine]").forEach((uno) => {
              uno.style.width = uno.dataset.fine;
            });
          }),
        );
      }

      /* ─── I conti di tutta la pagina ─────────────────────────────────
       *
       * Le case arrivano da due vie: quelle degli installatori, ognuna col suo
       * rapporto (`/installatore/<chi>/case`), e quelle che il quadro conosce
       * solo per la licenza — una casa che ha comprato Premium o l'ha avuto in
       * regalo, e che nessun installatore segue. Qui si mettono insieme una
       * volta per disegno, con la licenza di ognuna accanto, e tutte le
       * sezioni leggono da qui: la Panoramica conta, «Case» elenca, la scheda
       * racconta. Un numero solo per ogni cosa, in tutta la pagina. */
      function iConti() {
        const perCasa = new Map();
        const diQuesta = (sog) => {
          if (!perCasa.has(sog)) perCasa.set(sog, { licenze: [], abbonamenti: [] });
          return perCasa.get(sog);
        };
        for (const una of LICENZE.licenze || [])
          if (una.app === "gdahome" && String(una.sog || "").startsWith("casa_"))
            diQuesta(una.sog).licenze.push(una);
        for (const uno of ABBONAMENTI?.elenco || [])
          if (uno.app === "gdahome" && String(uno.sog || "").startsWith("casa_"))
            diQuesta(uno.sog).abbonamenti.push(uno);

        /* Senza nome si mostra un pezzo della matricola: due «Casa senza
         * nome» in fila non si distinguerebbero. */
        const senzaNome = (matricola) => `Casa senza nome · ${String(matricola).slice(5, 13)}`;
        const tutte = [];
        for (const uno of INSTALLATORI)
          for (const casa of LE_CASE_DI.get(uno.chi)?.case || [])
            tutte.push({
              matricola: casa.casa,
              nome: casa.senzaNome ? senzaNome(casa.casa) : casa.nome,
              chi: uno.chi,
              di: uno.nome || "un installatore senza nome",
              casa,
              licenza: laLicenza(perCasa.get(casa.casa)),
            });
        const seguite = new Set(tutte.map((una) => una.matricola));
        for (const [matricola, sue] of perCasa)
          if (!seguite.has(matricola))
            tutte.push({
              matricola,
              nome: senzaNome(matricola),
              chi: "",
              di: "",
              casa: null,
              licenza: laLicenza(sue),
            });

        const nomi = new Map(tutte.map((una) => [una.matricola, una.nome]));
        return {
          tutte,
          nomi,
          seguite: tutte.filter((una) => una.casa),
          /* Tutte le case Premium, da qualunque strada: le altre sono Base,
           * e le due insieme fanno tutte. Da dove viene lo dice
           * `leCasePerLicenza`. */
          premium: tutte.filter((una) => una.licenza.premium).length,
          daGuardare: leCoseDaGuardare(tutte, nomi),
        };
      }

      /* La licenza gdahome di una casa, in una parola: Premium, e perche', o
       * Base. Le licenze e gli abbonamenti arrivano da due vie diverse
       * (`/licenze` e `/abbonamenti`) e qui si mettono insieme per
       * matricola. Fra due licenze buone vince quella del negozio, che e'
       * quella che si rinnova o finisce da sola; poi il regalo, poi quella
       * data dall'installatore. Le parole sono quelle di «Abbonamenti e
       * licenze»: «non rinnova», «in prova», «regalo tuo». */
      const PRIMA_LA_LICENZA = { negozio: 0, regalo: 1, installatore: 2 };
      function laLicenza(sue) {
        const licenze = sue?.licenze || [];
        const abbonamenti = sue?.abbonamenti || [];
        const buona =
          licenze
            .filter((una) => una.vale)
            .sort(
              (a, b) => (PRIMA_LA_LICENZA[a.origine] ?? 9) - (PRIMA_LA_LICENZA[b.origine] ?? 9),
            )[0] || null;
        if (!buona)
          return { premium: false, parola: "Base", tinta: "", buona: null, licenze, abbonamenti };
        const abbonamento =
          buona.origine === "negozio"
            ? abbonamenti.find((uno) => uno.lic === buona.lic) || null
            : null;
        const nonRinnova =
          typeof abbonamento?.nonRinnova === "boolean"
            ? abbonamento.nonRinnova
            : abbonamento?.stato === "disdetto";
        const come =
          buona.origine === "negozio"
            ? abbonamento?.sandbox
              ? "acquisto di test"
              : nonRinnova
                ? "non rinnova"
                : abbonamento?.prova
                  ? "in prova"
                  : abbonamento?.piattaforma === "android"
                    ? "Google Play"
                    : "App Store"
            : buona.origine === "regalo"
              ? "regalo tuo"
              : buona.origine === "installatore"
                ? "dall'installatore"
                : String(buona.origine || "");
        return {
          premium: true,
          parola: `Premium · ${come}`,
          tinta: nonRinnova ? "guardare" : "blu",
          buona,
          abbonamento,
          licenze,
          abbonamenti,
        };
      }

      /* «Da guardare»: le cose che chiedono un'occhiata, le rosse prima.
       * Ognuna dice cosa e di chi, e porta dove si guarda: la scheda della
       * casa, quella dell'installatore, o la sezione giusta. Quando non c'e'
       * niente, la Panoramica dice «Tutto in ordine» e la pastiglia sulla
       * barra non c'e'. */
      function leCoseDaGuardare(tutte, nomi) {
        const cose = [];
        if (SALUTE?.nonMiAggiorno)
          cose.push({
            tinta: "rosso",
            icona: "quadro",
            titolo: `Il quadro non si aggiorna da ${oreInParole(SALUTE.nonMiAggiorno.ore)}`,
            sotto: SALUTE.nonMiAggiorno.perche || "Non si sa perché",
          });
        if (SALUTE?.tramite && !SALUTE.tramite.vivo)
          cose.push({
            tinta: "rosso",
            icona: "tramite",
            titolo: "Il tramite non risponde",
            sotto: "Da fuori casa le case non si raggiungono",
          });
        if (LICENZE.accese === false)
          cose.push({
            tinta: "rosso",
            icona: "licenze",
            titolo: "Le licenze sono spente",
            sotto: "Manca la chiave delle licenze: le case non ricevono Premium",
            vai: "licenze",
          });
        for (const una of tutte) {
          const stato = una.casa?.stato;
          if (!stato || stato.chiave === "posto") continue;
          const quando = una.casa.carta?.quando;
          cose.push(
            stato.chiave === "offline"
              ? {
                  tinta: "rosso",
                  icona: "attenzione",
                  titolo: `${una.nome} non manda notizie`,
                  sotto: `${una.di} · ${quando ? `ultimo rapporto ${daQuanto(quando)}` : "nessun rapporto ancora"}`,
                  casa: una,
                }
              : {
                  tinta: "ambra",
                  icona: "casa",
                  titolo: `${una.nome} è da verificare`,
                  sotto: `${una.di} · ${String(stato.perché || "").replace(/\.$/, "")}`,
                  casa: una,
                },
          );
        }
        for (const uno of ABBONAMENTI?.elenco || [])
          if (uno.stato === "disdetto" && !uno.sandbox)
            cose.push({
              tinta: "ambra",
              icona: "abbonamenti",
              titolo: `${nomi.get(uno.sog) || (String(uno.sog).startsWith("tel_") ? "Un telefono" : "Una casa")} non rinnova l'abbonamento`,
              sotto: `Ha disdetto${uno.prova ? " durante la prova" : ""}: ${uno.app === "gdanav" ? "GdANav" : "GdAHome"} Premium termina${uno.pagato ? ` ${conLArticolo("il", uno.pagato)}` : " alla scadenza"}${uno.prova ? ", senza pagare" : ""}`,
              vai: "abbonamenti",
              filtro: "disdetto",
            });
        for (const uno of INSTALLATORI) {
          const stato = loStato(uno);
          if (stato.come !== "limite") continue;
          const quante = Number(uno.case) || 0;
          cose.push({
            tinta: "ambra",
            icona: "installatori",
            titolo: `${uno.nome || "Un installatore"} è ${stato.parola}`,
            sotto: `${plurale(quante, "casa", "case")} su ${Number(uno.soglia)}${uno.pieno ? ": non ne può abbinare altre" : ""}`,
            installatore: uno.chi,
          });
        }
        if (ORFANE)
          cose.push({
            tinta: "ambra",
            icona: "casa",
            titolo:
              ORFANE === 1
                ? "Un impianto è rimasto senza installatore"
                : `${ORFANE} impianti sono rimasti senza installatore`,
            sotto: "Mandano i rapporti, ma da qui non li guarda nessuno",
            vai: "installatori",
          });
        return [
          ...cose.filter((una) => una.tinta === "rosso"),
          ...cose.filter((una) => una.tinta !== "rosso"),
        ];
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      /* Il disegno di ogni linguetta, e la parola corta che sul telefono
       * prende il posto di quella lunga: sette linguette in due righe. */
      const IL_DISEGNO_DELLA_LINGUETTA = {
        case: "casa",
        licenze: "regalo",
        collegamenti: "filo",
        versioni: "telefono",
      };
      const LE_SECONDARIE = ["licenze", "versioni", "collegamenti"];
      const LA_PAROLA_CORTA = {
        abbonamenti: "Licenze",
        licenze: "Regali",
        versioni: "App",
      };

      function disegna() {
        CONTI = iConti();
        /* Il numero resta attaccato alla sua parola: sul telefono la riga va
           a capo fra un pezzo e l'altro, non fra «7» e «Premium». */
        document.getElementById("sottotitolo").textContent = [
          plurale(INSTALLATORI.length, "installatore", "installatori"),
          plurale(CONTI.tutte.length, "casa", "case"),
          `${CONTI.premium} Premium`,
        ]
          .map((pezzo) => pezzo.replace(" ", " "))
          .join(" · ");

        doveNav.innerHTML = [
          /* Una sola linguetta porta il numero: la Panoramica, e conta le
             cose da guardare. Sulle altre una pastiglia si leggerebbe come
             «quanti ce ne sono», e una volta diceva «Installatori 1» a un
             gestore che ne aveva due. Prima i soldi e le licenze, poi le
             case e chi le installa, poi il resto. */
          ["panoramica", "Panoramica", CONTI.daGuardare.length],
          ["abbonamenti", "Abbonamenti e licenze", 0],
          ["case", "Case", 0],
          ["installatori", "Installatori", 0],
          ["licenze", "Regali e codici", 0],
          ["versioni", "App sui telefoni", 0],
          ["collegamenti", "Collegamenti", 0],
        ]
          .map(
            ([quale, parola, quanti]) => `
            <button type="button" data-schermata="${testo(quale)}" aria-pressed="${schermata === quale}"${LE_SECONDARIE.includes(quale) ? ' class="secondaria"' : ""}>
              ${/* già HTML */ LE_ICONE[IL_DISEGNO_DELLA_LINGUETTA[quale] || quale]}${
                LA_PAROLA_CORTA[quale]
                  ? `<span class="lunga">${testo(parola)}</span><span class="corta" aria-hidden="true">${testo(LA_PAROLA_CORTA[quale])}</span>`
                  : `<span>${testo(parola)}</span>`
              }${quanti ? `<span class="quanti giallo">${Number(quanti)}</span>` : ""}
            </button>`,
          )
          .join("")
          .concat(
            /* Sul telefono la barra sta in fondo, con le quattro voci che si
               usano di piu'; le altre tre stanno dietro «Altro». */
            `<button type="button" class="altro" data-altro aria-expanded="${doveNav.hasAttribute("data-aperta") ? "true" : "false"}" aria-pressed="${LE_SECONDARIE.includes(schermata) ? "true" : "false"}">${LE_ICONE["altro"]}<span>Altro</span></button>`,
          );

        /* Il foglio si ridisegna insieme al resto, e il punto a cui era
         * scorso si tiene. Si disegna per primo: se la casa o l'installatore
         * che mostrava non c'e' piu', si chiude, e la sezione sotto lo sa. */
        const corpoDiPrima = dove.querySelector("#foglio-corpo");
        const scorsoA = corpoDiPrima ? corpoDiPrima.scrollTop : 0;
        const primaVolta = disegnata !== schermata;
        disegnata = schermata;
        animaIMetri = primaVolta;

        const ilFoglioDisegnato = ilFoglio();
        dove.innerHTML =
          (schermata === "collegamenti"
            ? iCollegamenti()
            : schermata === "case"
              ? leCase()
              : schermata === "installatori"
                ? gliInstallatori()
                : schermata === "licenze"
                  ? leLicenze()
                  : schermata === "abbonamenti"
                    ? gliAbbonamenti()
                    : schermata === "versioni"
                      ? leVersioniDellApp()
                      : laPanoramica()) + ilFoglioDisegnato;

        if (primaVolta) {
          apriGliArchi(dove);
          apriIMetri(dove);
        }
        const corpo = dove.querySelector("#foglio-corpo");
        if (corpo && !foglioAperto?.appena) corpo.scrollTop = scorsoA;
        document.body.classList.toggle("col-foglio", Boolean(foglioAperto));
        if (foglioAperto?.appena) {
          foglioAperto.appena = false;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              dove.querySelectorAll(".velo, .foglio").forEach((uno) => uno.classList.add("su"));
              apriGliArchi(dove.querySelector(".foglio"));
            }),
          );
        }

        aggancia();
      }

      /* ─── Collegamenti ───────────────────────────────────────────────
       *
       * «Dal cruscotto non vedo più quante case hanno installato gdahome,
       * quante sono collegate da fuori e quante usano l'app gdahome. Fai una
       * sezione in alto chiamata Collegamenti.» I numeri c'erano, ma chiusi in
       * fondo al riquadro «Il servizio», dietro «I numeri del servizio»: una
       * cosa che si guarda tutti i giorni non deve stare dietro una tendina.
       * Sono gli stessi numeri, dal tramite (`/gestore/salute`), messi in fila
       * come si leggono: quante l'hanno installato, quante sono collegate
       * adesso, e da dove le guardano. */
      function iCollegamenti() {
        const t = SALUTE?.tramite;
        const capo = `
          <div class="capo-sezione">
            <div>
              <h2>Collegamenti</h2>
              <p>Quante case hanno GdAHome, quante sono accese, quante si raggiungono da fuori, e chi le guarda.</p>
            </div>
          </div>`;
        if (!t)
          return `${/* già HTML */ capo}
            <section class="scheda">
              <p class="sotto" style="margin: 0">Il tramite non risponde da questa macchina: i collegamenti li sa solo lui. Se sta su un'altra macchina, i suoi numeri si leggono lì con <code>curl -s http://127.0.0.1:8099/salute</code>.</p>
            </section>`;
        const n = (valore) => (Number.isFinite(Number(valore)) ? Number(valore) : null);
        const installate = n(t.installate);
        const collegate = n(t.case) ?? 0;
        const app = n(t.app) ?? 0;
        const web = n(t.web);
        /* Chi si raggiunge da fuori dipende dal modo delle licenze.
         *
         * Solo con «impone» da fuori si entra soltanto con Premium (anche
         * regalato): sono le accese meno quelle senza Premium e quelle con
         * l'add-on di prima. Con «spento» e con «registra» il tramite lascia
         * entrare TUTTE le accese — con «registra» conta chi resterebbe fuori,
         * ma non lo chiude. Prima qui c'era «—, il tramite non lo dice ancora»
         * proprio quando lo diceva: a licenze spente si entra da fuori in
         * tutte, e il numero e' quello delle accese. */
        const lic = t.licenze;
        const modo = lic?.modo;
        const senza = n(lic?.senza_premium);
        const conPremium =
          lic && senza !== null
            ? Math.max(0, collegate - senza - (n(lic.da_aggiornare) ?? 0))
            : null;
        let daFuori = null;
        let dettaglioDaFuori = "il tramite non lo dice ancora: va aggiornato";
        if (lic && modo === "impone") {
          daFuori = conPremium;
          dettaglioDaFuori =
            conPremium === null
              ? "il tramite non lo dice ancora"
              : "accese adesso, con Premium (anche regalato)";
        } else if (lic) {
          daFuori = collegate;
          dettaglioDaFuori =
            modo === "registra"
              ? `tutte le accese: le licenze si contano ma non si fanno rispettare${
                  conPremium === null ? "" : ` (${numero(conPremium)} con Premium)`
                }`
              : "tutte le accese: le licenze non sono attive";
        }
        const guardano = app + (web ?? 0);
        const daQuando =
          t.vivo && t.accesoDa !== null && t.accesoDa !== undefined
            ? "Il tramite è acceso da " + daQuantoAcceso(t.accesoDa) + "."
            : "Il tramite adesso non risponde.";
        const sulTotale = (quante) =>
          installate ? `${Math.round((quante / installate) * 100)}% delle case con GdAHome` : "";
        const grande = (icona, etichetta, valore, dettaglio) => `
          <div class="numerone">
            <span class="etichetta">${LE_ICONE[icona]}${testo(etichetta)}</span>
            <span class="valore">${testo(valore === null ? "—" : numero(valore))}</span>
            <span class="dettaglio">${testo(dettaglio)}</span>
          </div>`;
        return `${/* già HTML */ capo}
          <div class="griglia griglia-4">
            ${/* già HTML */ grande("casa", "Hanno installato GdAHome", installate, installate === null ? "il tramite non lo dice ancora: va aggiornato" : "case registrate, anche se adesso sono spente")}
            ${/* già HTML */ grande("filo", "Accese adesso", collegate, (sulTotale(collegate) ? sulTotale(collegate) + ", " : "") + "collegate al tramite, Premium o no")}
            ${/* già HTML */ grande("stella", "Raggiungibili da fuori", daFuori, dettaglioDaFuori)}
            ${/* già HTML */ grande("telefono", "Guardano adesso", guardano, web === null ? `${numero(app)} dall'app` : `${numero(app)} dall'app, ${numero(web)} dal browser`)}
          </div>
          <section class="scheda">
            <h3><span class="tondino">${LE_ICONE["filo"]}</span>Come si leggono</h3>
            <ul class="elenco">
              <li><span class="riga-testo"><b>Hanno installato GdAHome</b><span>Le case che si sono presentate almeno una volta al tramite: restano contate anche quando la casa è spenta.</span></span></li>
              <li><span class="riga-testo"><b>Accese adesso</b><span>Le case accese in questo momento: ogni add-on resta collegato al tramite, anche senza Premium. Non vuol dire che da fuori ci si entri.</span></span></li>
              <li><span class="riga-testo"><b>Raggiungibili da fuori</b><span>Le accese in cui si entra da fuori casa. Con le licenze attive («impone») sono solo quelle con Premium (comprato o regalato), e le altre si aprono solo dal loro Wi-Fi; con le licenze spente o solo contate («registra») si entra in tutte.</span></span></li>
              <li><span class="riga-testo"><b>Guardano adesso</b><span>Chi le sta guardando adesso da fuori: dall'app GdAHome sul telefono o sul tablet, o da una pagina del browser.</span></span></li>
            </ul>
            <p class="minuta">${testo(daQuando)} I numeri si aggiornano da soli ogni minuto, o col pallino in alto.</p>
          </section>`;
      }

      /* ─── Panoramica ─────────────────────────────────────────────────── */

      function ilSaluto() {
        const ora = new Date().getHours();
        if (ora >= 5 && ora < 13) return "Buongiorno";
        if (ora >= 13 && ora < 18) return "Buon pomeriggio";
        return "Buonasera";
      }

      function laPanoramica() {
        const { tutte, seguite, daGuardare } = CONTI;
        const offline = seguite.filter((una) => una.casa.stato.chiave === "offline").length;
        const sospesi = INSTALLATORI.filter((uno) => uno.congelato).length;
        const alLimite = INSTALLATORI.filter((uno) => !uno.congelato && uno.pieno).length;
        const A = ABBONAMENTI;

        /* «Case» conta quelle che segue un installatore: le altre il quadro le
         * conosce solo per la licenza, e lo si dice. */
        const soloLicenza = tutte.length - seguite.length;
        const dettaglioCase = !seguite.length
          ? "nessuna seguita da un installatore"
          : [
              `${seguite.length - offline} ${seguite.length - offline === 1 ? "risponde" : "rispondono"}`,
              offline ? `${offline} offline` : "",
              soloLicenza
                ? "più " + plurale(soloLicenza, "casa", "case") + " senza installatore"
                : "",
            ]
              .filter(Boolean)
              .join(" · ");

        /* I regali: le licenze date da te o dagli installatori che valgono
         * ancora, e i codici fatti che nessuno ha usato. Come in «Regali e
         * codici», da dove si arriva premendo. */
        const regalate = (LICENZE.licenze || []).filter(
          (una) => (una.origine === "regalo" || una.origine === "installatore") && una.vale,
        );
        const aCase = regalate.filter((una) => String(una.sog || "").startsWith("casa_")).length;
        const aTelefoni = regalate.length - aCase;
        const codiciLiberi = (LICENZE.codici || []).filter(
          (uno) => !uno.usatoDa && !uno.annullato,
        ).length;
        const dettaglioRegali =
          !regalate.length && !codiciLiberi
            ? "nessun regalo, per adesso"
            : [
                aCase ? plurale(aCase, "casa", "case") : "",
                aTelefoni ? plurale(aTelefoni, "telefono", "telefoni") : "",
                codiciLiberi ? `${plurale(codiciLiberi, "codice", "codici")} da usare` : "",
              ]
                .filter(Boolean)
                .join(" · ");
        const dettaglioInstallatori = !INSTALLATORI.length
          ? "ancora nessuno"
          : [
              `${INSTALLATORI.length - sospesi} ${INSTALLATORI.length - sospesi === 1 ? "attivo" : "attivi"}`,
              alLimite ? `${alLimite} al limite` : "",
              sospesi ? `${sospesi} ${sospesi === 1 ? "sospeso" : "sospesi"}` : "",
            ]
              .filter(Boolean)
              .join(" · ");

        const numerone = (vai, icona, etichetta, valore, dettaglio, piccolo = "") => `
          <button type="button" class="numerone" data-vai="${testo(vai)}">
            <span class="etichetta">${LE_ICONE[icona]}${testo(etichetta)}</span>
            <span class="valore">${testo(valore)}${piccolo ? `<small> ${testo(piccolo)}</small>` : ""}</span>
            <span class="dettaglio">${testo(dettaglio)}</span>
          </button>`;

        /* Una cosa da guardare porta dove si guarda: la casa, l'installatore,
         * la sezione. Quelle che si guardano qui e basta non si premono. */
        const unaCosa = (cosa) => {
          const porta = cosa.casa
            ? `data-apri-casa="${testo(cosa.casa.matricola)}" data-di="${testo(cosa.casa.chi)}"`
            : cosa.installatore
              ? `data-apri-installatore="${testo(cosa.installatore)}"`
              : cosa.vai
                ? `data-vai="${testo(cosa.vai)}" data-filtro="${testo(cosa.filtro || "")}"`
                : "";
          return `
            <li ${/* già HTML */ porta}${porta ? ' role="button" tabindex="0"' : ' class="ferma"'}>
              <span class="tondino ${testo(cosa.tinta)}">${LE_ICONE[cosa.icona]}</span>
              <span class="riga-testo"><b>${testo(cosa.titolo)}</b><span>${testo(cosa.sotto)}</span></span>
              ${porta ? `<span class="freccina">${LE_ICONE["freccia"]}</span>` : ""}
            </li>`;
        };

        const daGuardareQui = daGuardare.length
          ? `<ul class="elenco si-tocca">${daGuardare.map(unaCosa).join("")}</ul>`
          : `<div class="tutto-bene">
               <span class="tondino verde">${LE_ICONE["ok"]}</span>
               <span class="riga-testo"><b>Tutto in ordine</b><span>Nessuna casa da guardare, nessun installatore al limite, nessuno che ha disdetto.</span></span>
             </div>`;

        /* La frase in cima: le stesse cose dei numeri sotto, in una riga da
         * leggere. */
        const casa = leCasePerLicenza();
        const k = iContiDeiNegozi();
        const alMese = A ? alMeseDetto(A.conti?.alMese) : "—";
        const inUnaRiga = [
          `${plurale(casa.tutte, "casa", "case")}: ${numero(casa.premium)} Premium e ${numero(casa.base)} Base.`,
          A
            ? `${k.paganti === 1 ? "1 cliente paga" : `${numero(k.paganti)} clienti pagano`} un abbonamento${k.inProva ? `, ${numero(k.inProva)} in prova` : ""}${alMese === "—" ? "." : `: entrano ${alMese} al mese.`}`
            : "",
        ]
          .filter(Boolean)
          .join(" ");

        return `
          <div class="capo-sezione">
            <div>
              <h2>${testo(ilSaluto())}</h2>
              <p>${testo(inUnaRiga)}</p>
            </div>
          </div>

          <div class="titoletto"><span>Licenze e soldi</span><button type="button" class="comeUnLink" data-vai="abbonamenti">Tutte le licenze</button></div>
          ${/* già HTML */ iNumeriDelleLicenze()}

          <div class="titoletto"><span>Case e installatori</span></div>
          <div class="griglia griglia-3 piccoli">
            ${/* già HTML */ numerone("case", "casa", "Case", numero(seguite.length), dettaglioCase)}
            ${/* già HTML */ numerone("installatori", "installatori", "Installatori", numero(INSTALLATORI.length), dettaglioInstallatori)}
            ${/* già HTML */ numerone("licenze", "regalo", "Regali", numero(regalate.length), dettaglioRegali)}
          </div>

          <div class="griglia griglia-2">
            <section class="scheda">
              <h3>
                <span class="tondino ambra">${LE_ICONE["attenzione"]}</span>Da guardare<span class="conta">${daGuardare.length ? Number(daGuardare.length) : ""}</span>
              </h3>
              <p class="sotto">Le cose che chiedono un'occhiata, le più urgenti prima. Quando va tutto bene, qui c'è scritto «Tutto in ordine».</p>
              ${/* già HTML */ daGuardareQui}
            </section>
            <div class="griglia">
              ${/* già HTML */ inArrivo()}
              ${/* già HTML */ ilServizio()}
            </div>
          </div>`;
      }

      /* ─── Case ───────────────────────────────────────────────────────
       *
       * Tutte le case in un elenco solo: prima quelle che non mandano
       * notizie, poi quelle da verificare, poi quelle a posto, e in fondo
       * quelle che il quadro conosce solo per la licenza. Dentro ogni gruppo
       * per nome. Si cerca per nome, installatore o matricola, e si filtra
       * con le quattro pastiglie in alto. */
      const PESO_DELLO_STATO = { offline: 0, guardare: 1, posto: 2 };

      function leCaseInFila() {
        const cerca = CERCA_CASE.trim().toLowerCase();
        const peso = (una) => (una.casa ? (PESO_DELLO_STATO[una.casa.stato.chiave] ?? 2) : 3);
        return CONTI.tutte
          .filter((una) => {
            if (FILTRO_CASE === "guardare" && !(una.casa && una.casa.stato.chiave !== "posto"))
              return false;
            if (FILTRO_CASE === "premium" && !una.licenza.premium) return false;
            if (FILTRO_CASE === "base" && una.licenza.premium) return false;
            return (
              !cerca ||
              [una.nome, una.di, una.matricola].some((cosa) =>
                String(cosa).toLowerCase().includes(cerca),
              )
            );
          })
          .sort((a, b) => peso(a) - peso(b) || a.nome.localeCompare(b.nome, "it"));
      }

      function laRigaDellaCasa(una) {
        const stato = una.casa?.stato;
        const tinta = !stato
          ? "grigio"
          : stato.chiave === "offline"
            ? "rosso"
            : stato.chiave === "guardare"
              ? "ambra"
              : "verde";
        const quando = una.casa?.carta?.quando;
        const sotto = !una.casa
          ? "Nessun installatore · il quadro la conosce per la licenza"
          : stato.chiave === "offline"
            ? `${una.di} · offline${quando ? `, ultimo rapporto ${daQuanto(quando)}` : ""}`
            : `${una.di} · ${stato.parola}`;
        return `
          <li data-apri-casa="${testo(una.matricola)}" data-di="${testo(una.chi)}" role="button" tabindex="0" aria-current="${foglioAperto?.tipo === "casa" && foglioAperto.casa === una.matricola}">
            <span class="tondino ${testo(tinta)}">${LE_ICONE["casa"]}</span>
            <span class="riga-testo">
              <b>${testo(una.nome)}</b>
              <span>${testo(sotto)}</span>
              <span class="pastiglia ${testo(una.licenza.tinta)}">${testo(una.licenza.parola)}</span>
            </span>
            <span class="freccina">${LE_ICONE["freccia"]}</span>
          </li>`;
      }

      function leRigheDelleCase() {
        const fila = leCaseInFila();
        if (fila.length) return fila.map(laRigaDellaCasa).join("");
        return `
          <li class="ferma vuota">
            <span class="riga-testo">
              <b>${CONTI.tutte.length ? "Nessuna casa con questo filtro" : "Ancora nessuna casa"}</b>
              <span>${
                CONTI.tutte.length
                  ? "Prova un altro filtro, o cerca con un'altra parola."
                  : "Le case compaiono qui quando un installatore le abbina, o quando una casa ha Premium."
              }</span>
            </span>
          </li>`;
      }

      /* Mentre si scrive nella ricerca si ridisegna l'elenco e basta: la
       * casella resta dov'e', col cursore dentro. */
      function ridisegnaLeCase() {
        const elenco = document.getElementById("elenco-case");
        if (!elenco) return;
        elenco.innerHTML = leRigheDelleCase();
        elenco.querySelectorAll("[data-apri-casa]").forEach((riga) => {
          premibile(riga, () => apriLaCasa(riga.dataset.apriCasa, riga.dataset.di || ""));
        });
      }

      function leCase() {
        const { tutte } = CONTI;
        const quante = (filtro) => tutte.filter(filtro).length;
        const pastiglia = (quale, parola, quanti) =>
          `<button type="button" class="chip" data-filtro-case="${testo(quale)}" aria-pressed="${FILTRO_CASE === quale}">${testo(parola)} <b>${Number(quanti)}</b></button>`;
        return `
          <div class="capo-sezione">
            <div>
              <h2>Case</h2>
              <p>Tutte le case che conosci: quelle seguite dagli installatori e quelle che hanno Premium da sole. Tocca una casa per aprire la sua scheda.</p>
            </div>
          </div>

          <div class="filtri">
            <label class="cerca">
              ${LE_ICONE["cerca"]}
              <input type="search" id="cerca-case" value="${testo(CERCA_CASE)}" placeholder="Cerca per nome, installatore o matricola" autocomplete="off" spellcheck="false" aria-label="Cerca una casa" />
            </label>
            ${/* già HTML */ pastiglia("tutte", "Tutte", tutte.length)}
            ${
              /* già HTML */ pastiglia(
                "guardare",
                "Da guardare",
                quante((una) => una.casa && una.casa.stato.chiave !== "posto"),
              )
            }
            ${
              /* già HTML */ pastiglia(
                "premium",
                "Premium",
                quante((una) => una.licenza.premium),
              )
            }
            ${
              /* già HTML */ pastiglia(
                "base",
                "Base",
                quante((una) => !una.licenza.premium),
              )
            }
          </div>

          <div class="posto-dell-elenco">
            <div class="colonna-elenco">
              <section class="scheda">
                <ul class="elenco si-tocca" id="elenco-case">${/* già HTML */ leRigheDelleCase()}</ul>
              </section>
            </div>
          </div>

          <div class="scheda-vuota">
            <b>Scegli una casa</b>
            <span>La sua scheda si apre qui, accanto all'elenco.</span>
          </div>`;
      }

      /* ─── Installatori ───────────────────────────────────────────────── */

      function gliInstallatori() {
        const vivi = INSTALLATORI.filter((uno) => !uno.congelato);
        const conSoglia = vivi.filter((uno) => uno.soglia > 0);
        const posti = conSoglia.reduce((somma, uno) => somma + uno.soglia, 0);
        const usati = conSoglia.reduce((somma, uno) => somma + (Number(uno.case) || 0), 0);
        const liberi = Math.max(0, posti - usati);
        const alLimite = INSTALLATORI.filter((uno) => uno.pieno).length;
        /* I posti: quante case possono ancora abbinare, tutti insieme. Uno
         * sospeso non si conta. Si dicono solo se tutti gli altri hanno un
         * limite: con uno senza, i posti non finiscono, e «nessun posto
         * disponibile» sarebbe falso. */
        const tuttiColLimite = vivi.length > 0 && conSoglia.length === vivi.length;
        const iPosti = !tuttiColLimite
          ? ""
          : liberi
            ? plurale(liberi, "posto disponibile", "posti disponibili")
            : "nessun posto disponibile";
        const riassunto = !INSTALLATORI.length
          ? ""
          : alLimite
            ? `${plurale(alLimite, "installatore al limite", "installatori al limite")}${iPosti ? `, ${iPosti}` : ""}.`
            : iPosti
              ? `Nessuno al limite: ${iPosti}.`
              : "";
        /* Senza una scheda aperta le carte stanno su tutta la larghezza; con
         * la scheda aperta stanno in colonna, e la scheda accanto. */
        const aperto = foglioAperto?.tipo === "installatore" || foglioAperto?.tipo === "nuovo";
        const chiaveQui =
          Boolean(APPENA_FATTO) &&
          !(foglioAperto?.tipo === "installatore" && foglioAperto.chi === APPENA_FATTO.chi);

        return `
          <div class="capo-sezione">
            <div>
              <h2>Installatori</h2>
              <p>Chi monta GdAHome per i suoi clienti. Tocca un installatore per vederne le case e cambiare le sue regole.${riassunto ? ` <b>${testo(riassunto)}</b>` : ""}</p>
            </div>
            <button type="button" class="tasto forte" data-nuovo>${LE_ICONE["aggiungi"]}Nuovo installatore</button>
          </div>

          ${chiaveQui ? laChiaveNuova() : ""}

          <div class="posto-dell-elenco${aperto ? "" : " largo"}">
            <div class="colonna-elenco">
              ${
                INSTALLATORI.length
                  ? `<div class="griglia griglia-3">${INSTALLATORI.map(laCartaDellInstallatore).join("")}</div>`
                  : `<div class="scheda vuoto">
                       <b>Ancora nessun installatore</b> Il primo si aggiunge con «Nuovo installatore»: nome, limite, e viene creata la sua chiave.
                     </div>`
              }
            </div>
          </div>

          ${
            ORFANE
              ? `<section class="riquadro larga" style="margin-top: 14px">
                   <div class="avvertenza">
                     <span class="gettone" aria-hidden="true">!</span>
                     <span>
                       <b
                         >${plurale(ORFANE, "impianto", "impianti")} senza più nessuno che
                         ${ORFANE === 1 ? "lo guardi" : "li guardi"}.</b
                       >
                       ${
                         ORFANE === 1
                           ? `È rimasto indietro da quando «Togli» lasciava le case dov'erano.
                              Continua a mandare il suo rapporto, ed è giusto così: funziona in
                              casa di qualcuno. Ma da qui non lo guarda più nessuno.`
                           : `Sono rimasti indietro da quando «Togli» lasciava le case dov'erano.
                              Continuano a mandare i loro rapporti, ed è giusto così: funzionano in
                              casa di qualcuno. Ma da qui non li guarda più nessuno.`
                       }
                       <br /><br />
                       <b>Adesso non ne nascono più:</b> Elimina porta via anche gli impianti, e Sospendi non tocca niente. ${ORFANE === 1 ? "Questo" : "Questi"} si
                       ${ORFANE === 1 ? "recupera" : "recuperano"} dall'altra parte — il codice di
                       un installatore vivo, incollato nella configurazione dell'add-on di quella
                       casa — e questo conto cala da solo. Da questa pagina no: serve che qualcuno
                       ci metta mano in casa, ed è voluto — chi ci abita deve poter scegliere chi
                       guarda il suo impianto.
                     </span>
                   </div>
                 </section>`
              : ""
          }`;
      }

      /* Il tondo di un installatore: il suo marchio se ne ha messo uno, se
       * no le iniziali. */
      const leIniziali = (uno) =>
