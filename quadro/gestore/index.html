        `<span class="iniziali${uno.congelato ? " grigio" : ""}" aria-hidden="true">${
          uno.marchio
            ? `<img src="../marchio/${encodeURIComponent(uno.chi)}?${encodeURIComponent(uno.marchio)}" alt="" />`
            : testo(laSigla(uno.nome))
        }</span>`;

      /* La pastiglia di come sta: una parola e un colore. */
      function laPastigliaDi(uno) {
        if (uno.congelato) return `<span class="pastiglia">sospeso</span>`;
        if (uno.pieno) return `<span class="pastiglia guardare">al limite</span>`;
        const stato = loStato(uno);
        const tinta = stato.come === "posto" ? "posto" : stato.come === "limite" ? "guardare" : "";
        return `<span class="pastiglia ${testo(tinta)}">${testo(stato.parola)}</span>`;
      }

      /* Dopo la pastiglia: da quando non entra. Chi non e' mai entrato lo
       * dice gia' la pastiglia, e qui non si ripete. */
      const lUltimoAccesso = (uno) =>
        uno.vistoIl ? ` · ultimo accesso ${daQuantoEntra(uno.vistoIl)}` : "";

      /* Il pacchetto a parole: «GdAHome da 1 anno: 1 data su 5, 4 libere».
       * Una licenza data a un cliente, o un codice fatto e non ancora usato,
       * prende un posto; tolta, o annullato, lo ridà (`licenze.js`). */
      function ilPacchettoDetto(uno) {
        const p = uno.pacchetto;
        const IL_NOME = { gdahome: "GdAHome", gdanav: "GdANav" };
        const pezzi = LE_APP.flatMap((app) =>
          (Array.isArray(p?.[app]) ? p[app] : [])
            .filter((mucchio) => mucchio.totali > 0)
            .map(({ durata, totali = 0, usate = 0 }) => {
              const quanto = laDurata(durata);
              const libere = Math.max(0, totali - usate);
              return `${IL_NOME[app] || app} ${quanto === "per sempre" ? quanto : `da ${quanto}`}: ${usate} ${usate === 1 ? "data" : "date"} su ${totali}, ${libere} ${libere === 1 ? "libera" : "libere"}`;
            }),
        );
        return pezzi.length ? pezzi.join(" · ") : "nessuna licenza da regalare";
      }

      function laCartaDellInstallatore(uno) {
        const stato = loStato(uno);
        const quante = Number(uno.case) || 0;
        const quota =
          uno.soglia > 0
            ? Math.min(100, Math.round((quante / uno.soglia) * 100))
            : quante
              ? 100
              : 0;
        return `
          <section class="scheda carta-installatore" data-stato="${testo(stato.come)}" data-apri-installatore="${testo(uno.chi)}" role="button" tabindex="0" aria-current="${foglioAperto?.tipo === "installatore" && foglioAperto.chi === uno.chi}">
            <h3>${/* già HTML */ leIniziali(uno)}<span>${uno.nome ? testo(uno.nome) : "senza nome"}</span></h3>
            <p class="sotto">${/* già HTML */ laPastigliaDi(uno)}${testo(lUltimoAccesso(uno))}</p>
            <div class="posti-detti">
              <b>${plurale(quante, "casa", "case")}</b>
              <span>${uno.soglia > 0 ? `limite ${Number(uno.soglia)}` : "senza limite"}</span>
            </div>
            <div class="metro">
              <i style="width: ${Number(animaIMetri ? 0 : quota)}%"${animaIMetri ? ` data-fine="${Number(quota)}%"` : ""}></i>
            </div>
            <p class="pacchetto-detto">${LE_ICONE["regalo"]}<span>${testo(ilPacchettoDetto(uno))}</span></p>
          </section>`;
      }

      /* Le case di un installatore, nella sua scheda: il nome che gli ha
       * dato, come sta, quante entita' ha, e la licenza. Si premono e si
       * apre la scheda della casa, nella sezione «Case». */
      function leSueCase(uno) {
        const dette = LE_CASE_DI.get(uno.chi);
        if (!dette)
          return `<li class="nessuna">${
            uno.case ? "Elenco delle case non arrivato: riprova fra poco." : "Nessuna casa ancora."
          }</li>`;
        if (!dette.case.length) return `<li class="nessuna">Nessuna casa ancora.</li>`;
        return dette.case
          .map((casa) => {
            const c = casa.carta || {};
            const licenza = CONTI?.tutte.find((una) => una.matricola === casa.casa)?.licenza;
            return `
              <li
                data-stato="${testo(casa.stato.chiave)}"
                data-apri-casa="${testo(casa.casa)}"
                data-di="${testo(uno.chi)}"
                role="button"
                tabindex="0"
              >
                <i class="punto"></i>
                <span class="nome">${
                  casa.senzaNome
                    ? `Casa senza nome<small class="mono">${testo(casa.casa.slice(5, 13))}</small>`
                    : testo(casa.nome)
                }</span>
                <span class="entita"><b>${cE(c.entita?.totali) ? numero(c.entita.totali) : "—"}</b><span>entità</span></span>
                <span class="come">${testo(casa.stato.parola)} · ${c.quando ? testo(daQuanto(c.quando)) : "nessun rapporto"}${licenza ? ` · ${testo(licenza.parola)}` : ""}</span>
              </li>`;
          })
          .join("");
      }

      /* La chiave appena fatta: chi l'ha chiesta la vede subito, e la vede
       * una volta sola. Sta in cima alla scheda dell'installatore; se la
       * scheda si chiude prima di averla copiata, resta in cima alla
       * sezione finche' non si preme «Chiudi». */
      function laChiaveNuova() {
        if (!APPENA_FATTO) return "";
        return `
          <section class="chiave-nuova">
            <b>La chiave di ${testo(APPENA_FATTO.nome)}</b>
            <p>
              Consegnagliela adesso: si vede <b>una volta sola</b>, qui resta solo la sua impronta. Se la perde, gliene generi una nuova.
            </p>
            <div class="valore">${testo(APPENA_FATTO.chiave)}</div>
            <div class="azioni" style="margin-top: 10px">
              <button type="button" class="tasto forte" data-copia="${testo(APPENA_FATTO.chiave)}">Copia</button>
              <button type="button" class="tasto" data-chiudi-chiave>Chiudi</button>
            </div>
          </section>`;
      }

      /* ─── Le licenze ─────────────────────────────────────────────────
       *
       * Il contratto sta in `docs/LICENZE.md`. Da qui si regala una licenza
       * a una casa (per la sua matricola, `casa_…`), si generano codici
       * regalo, e si toglie quello che si e' dato. Le licenze dei negozi si
       * vedono nella scheda della casa e si possono togliere, ma tornano da
       * sole al rinnovo successivo se l'abbonamento e' pagato: il negozio e'
       * lui a dirlo.
       * ─────────────────────────────────────────────────────────────────── */

      const IL_NOME_DELLA_APP = { gdahome: "GdAHome Premium", gdanav: "GdANav Premium" };
      const LE_DURATE = [
        ["1", "1 mese"],
        ["3", "3 mesi"],
        ["6", "6 mesi"],
        ["12", "12 mesi"],
        ["24", "24 mesi"],
        ["", "Per sempre"],
      ];

      const leDurate = (scelta = "12") =>
        LE_DURATE.map(
          ([valore, parola]) =>
            `<option value="${testo(valore)}"${valore === scelta ? " selected" : ""}>${testo(parola)}</option>`,
        ).join("");

      const quantiMesi = (mesi) =>
        mesi === null || mesi === undefined ? "per sempre" : plurale(Number(mesi), "mese", "mesi");

      /* ─── Il pacchetto a righe ─────────────────────────────────────────
       *
       * Il gestore decide quante licenze e **di che durata**: una riga per
       * ogni app e durata. Le righe si tengono qui (`BOZZE`), non nelle
       * caselle: il ridisegno di ogni minuto rifa' le caselle, e una riga
       * aggiunta e non ancora salvata non deve sparire. `NUOVO` e' la bozza
       * del nuovo installatore; le altre sono per matricola. */
      const LE_APP = ["gdahome", "gdanav"];
      const NUOVO = "";
      const LE_DURATE_DEL_PACCHETTO = [
        ["1", "1 mese"],
        ["3", "3 mesi"],
        ["6", "6 mesi"],
        ["12", "1 anno"],
        ["24", "2 anni"],
        ["sempre", "per sempre"],
      ];
      const BOZZE = new Map();
      const PACCHETTI_APERTI = new Set();

      /* Una durata a parole: «1 mese», «1 anno», «per sempre». */
      function laDurata(durata) {
        const nota = LE_DURATE_DEL_PACCHETTO.find(([valore]) => valore === String(durata));
        if (nota) return nota[1];
        const mesi = Number(durata);
        if (mesi % 12 === 0) return plurale(mesi / 12, "anno", "anni");
        return plurale(mesi, "mese", "mesi");
      }

      const unaRigaNuova = () => ({ app: "gdahome", durata: "12", quante: 0 });

      /* Le righe di un installatore come le ha adesso: quelle con dei totali. */
      const leRigheDi = (uno) =>
        LE_APP.flatMap((app) =>
          (Array.isArray(uno?.pacchetto?.[app]) ? uno.pacchetto[app] : [])
            .filter((mucchio) => mucchio.totali > 0)
            .map((mucchio) => ({
              app,
              durata: String(mucchio.durata),
              quante: Number(mucchio.totali),
            })),
        );

      function laBozza(di) {
        if (!BOZZE.has(di))
          BOZZE.set(
            di,
            di === NUOVO ? [unaRigaNuova()] : leRigheDi(INSTALLATORI.find((uno) => uno.chi === di)),
          );
        return BOZZE.get(di);
      }

      /* Le righe, in quello che il quadro si aspetta: tutte e due le app,
       * sempre, cosi' una app senza righe si svuota davvero. */
      function ilPacchettoDellaBozza(di) {
        const fuori = { gdahome: {}, gdanav: {} };
        for (const { app, durata, quante } of laBozza(di)) {
          const n = Math.max(0, Math.min(99999, Math.floor(Number(quante) || 0)));
          if (!n || !fuori[app]) continue;
          fuori[app][durata] = (fuori[app][durata] || 0) + n;
        }
        return fuori;
      }

      function leRigheDelPacchetto(di) {
        const righe = laBozza(di);
        const opzioni = (tutte, scelta) =>
          tutte
            .map(
              ([valore, parola]) =>
                `<option value="${testo(valore)}"${valore === scelta ? " selected" : ""}>${testo(parola)}</option>`,
            )
            .join("");
        return `
          <div class="righe-pacchetto" data-bozza="${testo(di)}">
            ${
              righe.length
                ? righe
                    .map((riga, i) => {
                      /* Una durata detta dall'API e non fra quelle solite si vede lo stesso. */
                      const durate = LE_DURATE_DEL_PACCHETTO.some(
                        ([valore]) => valore === riga.durata,
                      )
                        ? LE_DURATE_DEL_PACCHETTO
                        : [...LE_DURATE_DEL_PACCHETTO, [riga.durata, laDurata(riga.durata)]];
                      return `
                <div class="riga-pacchetto" data-riga="${Number(i)}">
                  <select data-campo="app" aria-label="App">${
                    /* già HTML */ opzioni(
                      LE_APP.map((app) => [app, app]),
                      riga.app,
                    )
                  }</select>
                  <select data-campo="durata" aria-label="Durata">${/* già HTML */ opzioni(durate, riga.durata)}</select>
                  <input type="number" data-campo="quante" min="0" max="99999" value="${Number(riga.quante) || 0}" aria-label="Quante" />
                  <button type="button" class="tasto togli-riga" data-togli-riga="${Number(i)}" aria-label="Togli la riga" title="Togli la riga">✕</button>
                </div>`;
                    })
                    .join("")
                : `<p class="vuoto-pacchetto">Nessuna licenza nel pacchetto.</p>`
            }
            <button type="button" class="tasto aggiungi-riga" data-aggiungi-riga>Un'altra riga</button>
          </div>`;
      }

      /* Le righe si cambiano senza ridisegnare la pagina: solo il loro pezzo. */
      function ridisegnaLeRighe(di) {
        const dentro = [...dove.querySelectorAll("[data-bozza]")].find(
          (uno) => uno.dataset.bozza === di,
        );
        if (dentro) dentro.outerHTML = leRigheDelPacchetto(di);
      }

      function agganciaLeRighe() {
        const laRiga = (evento) => {
          const riquadro = evento.target.closest("[data-bozza]");
          if (!riquadro) return null;
          const di = riquadro.dataset.bozza;
          const riga = evento.target.closest("[data-riga]");
          return { di, righe: laBozza(di), i: riga ? Number(riga.dataset.riga) : -1 };
        };
        const cambia = (evento) => {
          const chi = laRiga(evento);
          const campo = evento.target.dataset?.campo;
          if (!chi || chi.i < 0 || !campo || !chi.righe[chi.i]) return;
          chi.righe[chi.i][campo] =
            campo === "quante" ? evento.target.value : String(evento.target.value);
        };
        dove.addEventListener("input", cambia);
        dove.addEventListener("change", cambia);
        dove.addEventListener("click", (evento) => {
          const chi = laRiga(evento);
          if (!chi) return;
          if (evento.target.closest("[data-aggiungi-riga]")) {
            const ultima = chi.righe.at(-1);
            chi.righe.push(ultima ? { ...ultima, quante: 0 } : unaRigaNuova());
            ridisegnaLeRighe(chi.di);
            const tutte = [...dove.querySelectorAll("[data-bozza]")].find(
              (uno) => uno.dataset.bozza === chi.di,
            );
            tutte?.querySelector(".riga-pacchetto:last-of-type [data-campo='quante']")?.focus();
            return;
          }
          const togli = evento.target.closest("[data-togli-riga]");
          if (togli) {
            chi.righe.splice(Number(togli.dataset.togliRiga), 1);
            ridisegnaLeRighe(chi.di);
          }
        });
      }

      /* ─── Abbonamenti e licenze ──────────────────────────────────────
       *
       * «Non capisco nulla sugli abbonamenti, sulle licenze. Cerca di fare
       * una cosa più bella e che si capisca tutto.»
       *
       * Prima erano due sezioni con due vocabolari: «Abbonamenti» (paganti,
       * prove, finiti, a gruppi, con un conto a righe) e «Regali e codici»
       * (Premium regalato). Adesso ogni licenza — comprata nell'app, regalata
       * da te, data da un installatore — e' una riga sola dello stesso
       * elenco, e dice le stesse quattro cose: di che casa e', da dove viene,
       * come sta (una parola e un colore, e una frase che lo spiega) e quanto
       * porta. In cima i numeri che contano, ognuno con la sua frase; accanto
       * «In arrivo» e «Come funziona», con le regole vere del quadro
       * (`licenze.js`). I conti restano quelli del quadro
       * (`contaGliAbbonamenti`): qui si scrivono e basta. «Regali e codici»
       * resta il posto da cui si regala. */

      /* «4 ott», o «2 set 2027» se non e' quest'anno. */
      const ilGiornoCorto = (quando) => {
        const data = new Date(quando);
        return data.toLocaleDateString("it-IT", {
          day: "numeric",
          month: "short",
          ...(data.getFullYear() === new Date().getFullYear() ? {} : { year: "numeric" }),
        });
      };

      /* «il 4 ott», ma «l'8 ott»: davanti a 1, 8 e 11 l'articolo si elide, e
       * con lui la preposizione (al/all', dal/dall'). */
      function conLArticolo(preposizione, quando) {
        const giorno = new Date(quando).getDate();
        const elisa = giorno === 1 || giorno === 8 || giorno === 11;
        const [piena, apostrofo] = {
          il: ["il ", "l'"],
          al: ["al ", "all'"],
          dal: ["dal ", "dall'"],
        }[preposizione];
        return `${elisa ? apostrofo : piena}${ilGiornoCorto(quando)}`;
      }

      /* «4,99 €»: i soldi come si scrivono in Italia, nella valuta del negozio. */
      function iSoldi(valore, valuta, cifre = 2) {
        try {
          return new Intl.NumberFormat("it-IT", {
            style: "currency",
            currency: valuta || "EUR",
            minimumFractionDigits: cifre,
            maximumFractionDigits: cifre,
          }).format(valore);
        } catch (_valutaStrana) {
          return `${numero(valore)} ${valuta}`;
        }
      }

      /* Quanto pagano al mese, valuta per valuta: «≈ 81 €», o «—». */
      function alMeseDetto(alMese) {
        const voci = Object.entries(alMese || {}).filter(([, valore]) => valore > 0);
        if (!voci.length) return "—";
        return `≈ ${voci
          .map(([valuta, valore]) => iSoldi(valore, valuta, valore >= 100 ? 0 : 2))
          .join(" + ")}`;
      }

      /* Quanto e' gia' entrato, valuta per valuta: «4,99 €», o «0 €». */
      function lIncassatoDetto(incassato) {
        const voci = Object.entries(incassato || {}).filter(([, valore]) => valore > 0);
        if (!voci.length) return "0 €";
        return voci.map(([valuta, valore]) => iSoldi(valore, valuta)).join(" + ");
      }

      /* «novembre»: il mese degli incassi, quello di Roma come lo conta il quadro. */
      function ilMeseDetto(quando) {
        try {
          return new Date(quando || Date.now()).toLocaleDateString("it-IT", {
            month: "long",
            timeZone: "Europe/Rome",
          });
        } catch (_fusoStrano) {
          return new Date(quando || Date.now()).toLocaleDateString("it-IT", { month: "long" });
        }
      }

      /* Gli stati di una licenza. Ognuna sta in uno solo, e ha la sua parola,
       * il suo colore e una frase che dice cosa vuol dire. «Termina il…» non
       * e' uno stato: e' una licenza attiva a tempo (un regalo, quella di un
       * installatore) che finisce entro trenta giorni, e lo dice la sua
       * pastiglia, ambra. */
      const GLI_STATI_DELLE_LICENZE = {
        attiva: {
          nome: "Attive",
          tinta: "s-ok",
          spiega: "Premium adesso. Chi paga si rinnova da solo; un regalo vale fino alla sua data.",
        },
        prova: {
          nome: "In prova",
          tinta: "s-prova",
          spiega: "14 giorni gratis: non hanno ancora pagato. Alla fine pagano, se non disdicono.",
        },
        nonrinnova: {
          nome: "Non rinnovano",
          tinta: "s-avviso",
          spiega: "Hanno disdetto: restano Premium fino alla data scritta, poi la casa torna Base.",
        },
        finita: {
          nome: "Finite",
          tinta: "s-spenta",
          spiega: "Non valgono più: scadute, rimborsate o revocate.",
        },
        test: {
          nome: "Acquisti di test",
          tinta: "s-test",
          spiega:
            "Fatti da noi con TestFlight o coi tester di Google: non sono clienti e non entrano in nessun numero.",
        },
      };

      /* Da dove viene una licenza: le tre strade del quadro (`ORIGINI`). */
      const LE_FONTI_DELLE_LICENZE = {
        negozio: "App Store e Google Play",
        regalo: "Regali tuoi",
        installatore: "Dagli installatori",
      };

      /* I nomi di prima, per chi ci manda ancora con quelli: la Panoramica,
       * «Da guardare», un indirizzo salvato. */
      const I_FILTRI_DI_PRIMA = {
        tutti: "tutte",
        paganti: "attiva",
        attivo: "attiva",
        attive: "attiva",
        nonrinnovano: "nonrinnova",
        disdetto: "nonrinnova",
        disdetti: "nonrinnova",
        finiti: "finita",
        scaduto: "finita",
        sandbox: "test",
      };

      const TRENTA_GIORNI = 30 * 24 * 60 * 60 * 1000;

      /* La data che conta di una licenza, con la sua parola: «rinnova 9 nov»,
       * «fine prova 15 nov», «termina 2 dic», «scade 6 nov 2027», «per
       * sempre», «scaduta 25 ott», «revocata 6 nov». */
      function laScadenzaDellaRiga(riga) {
        const q = typeof riga.quando === "number" ? riga.quando : null;
        if (riga.pastiglia === "Revocata") return { verbo: "revocata", quando: q };
        if (riga.pastiglia === "Rimborsata") return { verbo: "rimborsata", quando: null };
        if (riga.stato === "finita") return { verbo: "scaduta", quando: q };
        if (riga.stato === "test")
          return { verbo: riga.vale ? "test, fino al" : "test, finito", quando: q };
        if (riga.stato === "prova") return { verbo: "fine prova", quando: q };
        if (riga.stato === "nonrinnova") return { verbo: "termina", quando: q };
        if (riga.negozio)
          return { verbo: q !== null && q < Date.now() ? "rinnovo atteso" : "rinnova", quando: q };
        return q === null ? { verbo: "per sempre", quando: null } : { verbo: "scade", quando: q };
      }

      /* Una licenza, come si legge in una riga. `una` e' la licenza
       * (`/gestore/licenze`), `uno` il suo abbonamento (`/gestore/abbonamenti`)
       * se viene dal negozio: l'abbonamento sa il piano, il prezzo, la prova
       * e il rinnovo; la licenza sa se l'hai revocata. */
      function laLicenzaInRiga({ una = null, uno = null }) {
        const ora = Date.now();
        const lei = uno || una;
        const sog = String(lei.sog || "");
        const diUnaCasa = sog.startsWith("casa_");
        const riga = {
          lic: lei.lic,
          app: lei.app,
          sog,
          diUnaCasa,
          nome: diUnaCasa
            ? CONTI.nomi.get(sog) || `Casa senza nome · ${sog.slice(5, 13)}`
            : `Telefono · ${sog.slice(4, 12)}`,
          chi: CONTI.tutte.find((altra) => altra.matricola === sog)?.chi || "",
          vale: Boolean(lei.vale),
          quando: null,
          negozio: Boolean(uno),
        };
        const metti = (stato, pastiglia, tinta, frase, soldi, soldiSotto = "") =>
          Object.assign(riga, { stato, pastiglia, tinta, frase, soldi, soldiSotto });

        /* La data che conta, per la colonna «Scade o rinnova», e la fonte in
         * una parola, per la colonna «Origine». */
        const finisci = () => {
          riga.data = laScadenzaDellaRiga(riga);
          return riga;
        };
        riga.sotto =
          lei.app === "gdanav"
            ? "GdANav"
            : diUnaCasa
              ? CONTI.tutte.find((altra) => altra.matricola === sog)?.di || "senza installatore"
              : "telefono";

        if (uno) {
          const ios = uno.piattaforma === "ios";
          riga.origine = ios ? "App Store" : "Google Play";
          riga.prezzo = uno.prezzo > 0 ? Number(uno.prezzo) : null;
          riga.valuta = uno.valuta || "EUR";
          const chiRinnova = ios ? "Apple" : "Google";
          const piano = uno.piano === "annuale" || uno.piano === "mensile" ? uno.piano : "";
          const prezzo =
            uno.prezzo > 0
              ? `${iSoldi(uno.prezzo, uno.valuta)}/${piano === "annuale" ? "anno" : "mese"}`
              : "";
          const il = uno.pagato ? conLArticolo("il", uno.pagato) : "";
          const al = uno.pagato ? conLArticolo("al", uno.pagato) : "";
          const nonRinnova =
            typeof uno.nonRinnova === "boolean" ? uno.nonRinnova : uno.stato === "disdetto";
          riga.fonte = "negozio";
          riga.lettera = ios ? "A" : "G";
          riga.fonteDetta = `${ios ? "App Store" : "Google Play"} · abbonamento${piano ? ` ${piano}` : ""}`;
          riga.quando = typeof uno.pagato === "number" ? uno.pagato : null;
          riga.sandbox = Boolean(uno.sandbox);
          if (uno.sandbox)
            metti(
              "test",
              "Test",
              "s-test",
              "Acquisto di prova fatto da noi (TestFlight o tester di Google): non è un cliente e non entra nei conti.",
              "—",
              "non conta",
            );
          else if (una?.revocata) {
            riga.quando = una.revocata;
            metti(
              "finita",
              "Revocata",
              "s-male",
              `Revocata da te ${conLArticolo("il", una.revocata)}: la casa è tornata Base.`,
              prezzo || "—",
              "non incassa più",
            );
          } else if (!uno.vale)
            uno.finito === "acquisto-rimborsato"
              ? metti(
                  "finita",
                  "Rimborsata",
                  "s-male",
                  `${chiRinnova} ha rimborsato il cliente: Premium è finito subito e i soldi sono tornati indietro.`,
                  "0 €",
                  "rimborsato",
                )
              : uno.prova
                ? metti(
                    "finita",
                    "Scaduta",
                    "s-spenta",
                    `La prova gratuita è finita${il ? ` ${il}` : ""} senza pagare: la casa è tornata Base.`,
                    "0 €",
                    "non ha mai pagato",
                  )
                : metti(
                    "finita",
                    "Scaduta",
                    "s-spenta",
                    `Finita${il ? ` ${il}` : ""}: il cliente non ha rinnovato e la casa è tornata Base.`,
                    prezzo || "—",
                    "non paga più",
                  );
          else if (uno.prova)
            nonRinnova
              ? metti(
                  "nonrinnova",
                  "Non rinnova",
                  "s-avviso",
                  `Ha disdetto durante la prova gratuita: termina ${il} senza pagare, poi la casa torna Base.`,
                  "0 €",
                  "non pagherà",
                )
              : metti(
                  "prova",
                  `In prova fino ${al}`,
                  "s-prova",
                  `Prova gratuita: ${il} comincia a pagare${prezzo ? ` ${prezzo}` : piano ? ` l'abbonamento ${piano}` : ""}, se non disdice prima.`,
                  "0 €",
                  prezzo ? `poi ${prezzo}` : "non ha ancora pagato",
                );
          else if (nonRinnova)
            metti(
              "nonrinnova",
              "Non rinnova",
              "s-avviso",
              `Ha disdetto: il periodo è già pagato, resta Premium fino ${al} e poi la casa torna Base.`,
              prezzo || "pagato",
              "già incassato, non rinnova",
            );
          else
            metti(
              "attiva",
              "Attiva",
              "s-ok",
              uno.pagato >= ora
                ? `Paga e si rinnova da solo ${il}: il rinnovo lo fa ${chiRinnova}.`
                : `Il rinnovo è atteso ${conLArticolo("dal", uno.pagato)}: ${chiRinnova} rinnova a fine periodo, e il quadro lo ricontrolla ogni ora.`,
              prezzo || "prezzo non detto",
              piano === "annuale" && uno.prezzo > 0
                ? `≈ ${iSoldi(uno.prezzo / 12, uno.valuta)} al mese`
                : "si rinnova",
            );
          return finisci();
        }

        /* Un regalo tuo, o la licenza di un installatore. */
        const diInstallatore = una.origine === "installatore";
        const chiLaDa = diInstallatore
          ? INSTALLATORI.find((altro) => altro.chi === una.installatore)?.nome || "un installatore"
          : "";
        const il = typeof una.scade === "number" ? conLArticolo("il", una.scade) : "";
        const al = typeof una.scade === "number" ? conLArticolo("al", una.scade) : "";
        riga.fonte = diInstallatore ? "installatore" : "regalo";
        riga.origine = diInstallatore ? "Installatore" : "Regalo";
        riga.chiLaDa = chiLaDa;
        riga.icona = diInstallatore ? "installatori" : "regalo";
        riga.fonteDetta = [
          diInstallatore ? `Licenza di ${chiLaDa}, dal suo pacchetto` : "Regalo tuo",
          una.codice ? "con un codice" : "",
          una.nota ? `«${una.nota}»` : "",
        ]
          .filter(Boolean)
          .join(" · ");
        riga.quando = una.revocata || una.scade;
        const torna = diUnaCasa ? "la casa torna Base" : "il telefono torna Base";
        const tornata = diUnaCasa ? "la casa è tornata Base" : "il telefono è tornato Base";
        const soldi = ["Gratis", diInstallatore ? "il cliente non paga" : "non incassi niente"];
        if (una.revocata)
          metti(
            "finita",
            "Revocata",
            "s-male",
            `Revocata ${conLArticolo("il", una.revocata)}: ${tornata}.`,
            ...soldi,
          );
        else if (!una.vale)
          metti(
            "finita",
            "Scaduta",
            "s-spenta",
            `Finita${il ? ` ${il}` : ""}: ${diInstallatore ? "una licenza dell'installatore" : "un regalo"} non si rinnova, e ${tornata}.`,
            ...soldi,
          );
        else if (una.scade === null)
          metti(
            "attiva",
            "Attiva",
            "s-ok",
            diInstallatore
              ? `Data da ${chiLaDa} per sempre: non scade.`
              : "Regalata per sempre: non scade.",
            ...soldi,
          );
        else if (una.scade - ora <= TRENTA_GIORNI)
          metti(
            "attiva",
            `Termina ${il}`,
            "s-avviso",
            `Termina ${il}: ${diInstallatore ? "una licenza dell'installatore" : "un regalo"} non si rinnova da solo, poi ${torna}.`,
            ...soldi,
          );
        else
          metti(
            "attiva",
            "Attiva",
            "s-ok",
            `Vale fino ${al}, poi ${torna}: ${diInstallatore ? "una licenza dell'installatore" : "un regalo"} non si rinnova da solo.`,
            ...soldi,
          );
        return finisci();
      }

      /* Tutte le licenze, una per riga: gli abbonamenti dei negozi coi loro
       * dettagli, e i regali e le licenze degli installatori. Le righe
       * «spostata su un'altra casa» non sono licenze, e non ci sono. */
      function tutteLeLicenze() {
        const perLic = new Map((LICENZE.licenze || []).map((una) => [una.lic, una]));
        const righe = [];
        const viste = new Set();
        for (const uno of ABBONAMENTI?.elenco || []) {
          viste.add(uno.lic);
          righe.push(laLicenzaInRiga({ uno, una: perLic.get(uno.lic) || null }));
        }
        for (const una of LICENZE.licenze || []) {
          if (viste.has(una.lic)) continue;
          if (una.origine === "regalo" || una.origine === "installatore")
            righe.push(laLicenzaInRiga({ una }));
          else if (una.origine === "negozio")
            /* Un abbonamento oltre il taglio dell'elenco, o di un quadro che
             * non lo dice: si legge da quello che sa la licenza. */
            righe.push(
              laLicenzaInRiga({
                una,
                uno: {
                  lic: una.lic,
                  app: una.app,
                  sog: una.sog,
                  piattaforma: String(una.nota || "").startsWith("android") ? "android" : "ios",
                  vale: una.vale,
                  prova: una.prova,
                  pagato: una.scade,
                },
              }),
            );
        }
        return righe;
      }

      /* Le righe che si vedono adesso, coi filtri e la ricerca. */
      function leLicenzeFiltrate(righe) {
        const S = LO_STATO_DELLE_LICENZE;
        const cerca = String(S.cerca || "")
          .trim()
          .toLowerCase();
        return righe.filter(
          (riga) =>
            (S.filtro === "tutte" || riga.stato === S.filtro) &&
            (S.fonte === "tutte" || riga.fonte === S.fonte) &&
            (!cerca ||
              [riga.nome, riga.sog, riga.fonteDetta, riga.frase, riga.pastiglia, riga.app]
                .join(" ")
                .toLowerCase()
                .includes(cerca)),
        );
      }

      /* Prima chi finisce prima; fra le finite, prima le piu' recenti. */
      const inOrdineDiData = (a, b) =>
        a.stato === "finita" || a.stato === "test"
          ? (b.quando ?? 0) - (a.quando ?? 0)
          : (a.quando ?? Infinity) - (b.quando ?? Infinity) || a.nome.localeCompare(b.nome, "it");

      /* Il segno della fonte: la lettera del negozio, o il disegno del regalo
       * e dell'installatore. */
      const ilSegnoDellaFonte = (riga) =>
        riga.lettera
          ? `<span class="lic-segno ${riga.lettera === "A" ? "negozio-a" : "negozio-g"}" aria-hidden="true">${testo(riga.lettera)}</span>`
          : `<span class="lic-segno ${riga.fonte === "regalo" ? "fonte-regalo" : "fonte-installatore"}" aria-hidden="true">${LE_ICONE[riga.icona]}</span>`;

      /* L'origine in una pastiglia col suo segno: «App Store», «Google
       * Play», «Regalo», «Installatore». Il nome lungo sta nel suggerimento,
       * e nella riga aperta. */
      const laFonteInChip = (riga) =>
        `<span class="origine" title="${testo(riga.fonteDetta)}">${/* già HTML */ ilSegnoDellaFonte(riga)}<span>${testo(riga.origine)}</span></span>`;

      /* Il punto interrogativo gentile: una «i» che, toccata o sorvolata,
       * dice cosa vuol dire un numero. La spiegazione lunga sta qui, non
       * sulla carta. */
      const laBolla = (spiega) =>
        `<span class="info"><button type="button" class="info-tasto" aria-label="Cosa vuol dire">i</button><span class="info-bolla" role="tooltip">${testo(spiega)}</span></span>`;

      /* Una riga: di che casa, da dove, come sta e perche', quanto porta, e
       * «Revoca» se vale ancora. Nella scheda di una casa il nome non serve. */
      function laRigaDellaLicenza(una, { nellaCasa = false } = {}) {
        const aperta = LO_STATO_DELLE_LICENZE.espanse.has(una.lic);
        const revoca =
          una.vale && una.stato !== "test"
            ? `<button type="button" class="voce-menu male" data-revoca="${testo(una.lic)}" data-app="${testo(una.app)}"${una.sog.startsWith("tel_") ? " data-del-telefono" : ""}${una.negozio ? " data-dal-negozio" : ""}>Revoca</button>`
            : "";
        const apri =
          !nellaCasa && una.diUnaCasa
            ? `<button type="button" class="voce-menu" data-apri-casa="${testo(una.sog)}" data-di="${testo(una.chi)}">Apri la scheda della casa</button>`
            : "";
        const menu =
          revoca || apri
            ? `<details class="menu-azioni"><summary aria-label="Azioni su questa licenza" title="Azioni">${LE_ICONE["altro"]}</summary><span class="menu-tendina" data-spiega>${/* già HTML */ apri}${/* già HTML */ revoca}<span class="spiega" hidden></span></span></details>`
            : "";
        const pillola =
          una.stato === "prova"
            ? "In prova"
            : una.pastiglia.startsWith("Termina")
              ? "In scadenza"
              : una.pastiglia;
        const quando = una.data.quando ? ilGiornoCorto(una.data.quando) : "";
        const nome = nellaCasa
          ? una.app === "gdanav"
            ? "GdANav Premium"
            : "GdAHome Premium"
          : una.nome;
        /* Nella scheda della casa il nome e' quello della app, e sotto c'e'
         * il perche': la casa la si sta gia' guardando. */
        const sotto = nellaCasa ? una.frase : una.sotto;
        return `
          <li class="lic-riga${aperta ? " aperta" : ""}" data-stato="${testo(una.stato)}" data-lic="${testo(una.lic)}" tabindex="0" aria-expanded="${aperta ? "true" : "false"}">
            <span class="lic-c-casa"><b>${testo(nome)}</b><small>${testo(sotto)}</small></span>
            <span class="lic-c-origine">${/* già HTML */ laFonteInChip(una)}</span>
            <span class="lic-c-stato"><span class="stato ${testo(una.tinta)}">${testo(pillola)}</span></span>
            <span class="lic-c-data"><small>${testo(una.data.verbo)}</small>${quando ? `<b>${testo(quando)}</b>` : ""}</span>
            <span class="lic-c-importo">${testo(una.soldi)}</span>
            <span class="lic-c-menu">${/* già HTML */ menu}</span>
            ${
              aperta
                ? `<span class="lic-dettaglio"><span class="lic-frase">${testo(una.frase)}</span><span class="lic-fatti">${testo(una.fonteDetta)}${una.soldiSotto ? ` · ${testo(una.soldiSotto)}` : ""}</span></span>`
                : ""
            }
          </li>`;
      }

      /* L'elenco, a gruppi di stato: attive, in prova, non rinnovano,
       * finite, acquisti di test. Le finite e i test stanno chiusi finche' non
       * li si apre; con un filtro si vede solo il suo gruppo, aperto. Un
       * gruppo lungo mostra le prime dieci, e «mostra tutte». */
      function leRigheDelleLicenze() {
        const S = LO_STATO_DELLE_LICENZE;
        const PRIME = 10;
        const tutte = tutteLeLicenze();
        const viste = leLicenzeFiltrate(tutte);
        if (!tutte.length)
          return `<div class="vuoto"><b>Ancora nessuna licenza</b> Compaiono qui quando qualcuno compra GdAHome Premium nell'app, quando regali Premium a una casa, o quando un installatore lo dà a un suo cliente.</div>`;
        if (!viste.length)
          return `<div class="vuoto"><b>Nessuna licenza qui</b> ${testo(
            String(S.cerca || "").trim()
              ? "Nessuna corrisponde a «" + String(S.cerca).trim() + "»."
              : S.filtro === "tutte"
                ? "Nessuna licenza con questa provenienza."
                : "Nessuna licenza in questo stato: " +
                  GLI_STATI_DELLE_LICENZE[S.filtro].spiega.charAt(0).toLowerCase() +
                  GLI_STATI_DELLE_LICENZE[S.filtro].spiega.slice(1),
          )}</div>`;
        const cercando = Boolean(String(S.cerca || "").trim());
        const gruppi = Object.entries(GLI_STATI_DELLE_LICENZE)
          .map(([quale, stato]) => {
            const sue = viste.filter((riga) => riga.stato === quale).sort(inOrdineDiData);
            if (!sue.length) return "";
            const chiuso =
              !cercando &&
              (quale === "finita" || quale === "test"
                ? S.filtro === "tutte" && !S.aperti.has(quale)
                : S.aperti.has(`chiuso:${quale}`));
            const intere = cercando || S.interi.has(quale);
            const qui = intere ? sue : sue.slice(0, PRIME);
            return `
            <section class="lic-gruppo ${testo(stato.tinta)}" data-gruppo="${testo(quale)}">
              <button type="button" class="lic-capo" data-apri-gruppo="${testo(quale)}" aria-expanded="${chiuso ? "false" : "true"}">
                <span class="freccina">${LE_ICONE["freccia"]}</span>
                <i class="pallino" aria-hidden="true"></i>
                <b>${testo(stato.nome)}</b>
                <span class="lic-n">${numero(sue.length)}</span>
                <span class="lic-spiega">${testo(stato.spiega)}</span>
              </button>
              ${
                chiuso
                  ? ""
                  : `<ul class="elenco lic-righe">${qui.map((riga) => laRigaDellaLicenza(riga)).join("")}</ul>${
                      sue.length > qui.length
                        ? `<button type="button" class="lic-altre" data-tutte-gruppo="${testo(quale)}">Mostra tutte e ${numero(sue.length)}<span class="minuta"> · altre ${numero(sue.length - qui.length)}</span></button>`
                        : ""
                    }`
              }
            </section>`;
          })
          .join("");
        return `
          <div class="lic-testata" aria-hidden="true">
            <span>Casa</span><span>Origine</span><span>Stato</span><span>Scade o rinnova</span><span>Importo</span><span></span>
          </div>
          ${/* già HTML */ gruppi}`;
      }

      /* Un filtro di stato: si guarda quello, e il suo gruppo si apre. */
      function scegliIlFiltroDelleLicenze(quale) {
        const detto = I_FILTRI_DI_PRIMA[quale] || quale || "tutte";
        LO_STATO_DELLE_LICENZE.filtro = GLI_STATI_DELLE_LICENZE[detto] ? detto : "tutte";
      }

      /* Mentre si scrive nella ricerca si ridisegna l'elenco e basta: la
       * casella resta dov'e', col cursore dentro. */
      function ridisegnaLeLicenze() {
        const dentro = document.getElementById("elenco-licenze");
        if (!dentro) return;
        dentro.innerHTML = leRigheDelleLicenze();
        aggancia();
      }

      /* I numeri dei negozi, dal quadro. Un quadro di prima non dice i conti
       * nuovi: si ricavano dai nomi di prima («disdetti»). */
      function iContiDeiNegozi() {
        const c = ABBONAMENTI?.conti || {};
        const n = (...nomi) => {
          for (const quale of nomi) {
            const valore = Number(c[quale]);
            if (c[quale] !== undefined && c[quale] !== null && Number.isFinite(valore))
              return valore;
          }
          return 0;
        };
        const nuovi = c.pagantiRinnovano !== undefined;
        const pagantiNonRinnovano = n("pagantiNonRinnovano", "pagatiDisdetti");
        const pagantiRinnovano = nuovi ? n("pagantiRinnovano") : n("paganti");
        const proveNonRinnovano = n("proveNonRinnovano", "disdettiInProva");
        return {
          c,
          n,
          paganti: nuovi ? n("paganti") : pagantiRinnovano + pagantiNonRinnovano,
          pagantiRinnovano,
          pagantiNonRinnovano,
          inProva: nuovi ? n("inProva") : n("inProva") + proveNonRinnovano,
          proveNonRinnovano,
          nonRinnovano: pagantiNonRinnovano + proveNonRinnovano,
          finiti: n("finiti"),
          test: n("test"),
          tutti: n("tutti"),
        };
      }

      /* Le case, Premium o Base, e Premium perche': paga, prova, regalo tuo,
       * dall'installatore. Una casa conta una volta sola, con la licenza che
       * vince (`laLicenza`). */
      function leCasePerLicenza() {
        const quante = { paga: 0, prova: 0, regalo: 0, installatore: 0, test: 0, base: 0 };
        for (const una of CONTI.tutte) {
          const l = una.licenza;
          if (!l.premium) quante.base += 1;
          else if (l.buona.origine === "regalo") quante.regalo += 1;
          else if (l.buona.origine === "installatore") quante.installatore += 1;
          else if (l.abbonamento?.sandbox) quante.test += 1;
          else if (l.abbonamento?.prova) quante.prova += 1;
          else quante.paga += 1;
        }
        return { ...quante, tutte: CONTI.tutte.length, premium: CONTI.tutte.length - quante.base };
      }

      /* I sei numeri in cima: le case Premium e Base, chi paga, chi prova,
       * chi non rinnova, e i soldi — il ricorrente e l'incassato, che sono due
       * cose diverse e lo dicono. Ognuno porta al suo filtro: nella
       * Panoramica cambiando sezione, qui accanto cambiando il filtro. */
      function iNumeriDelleLicenze() {
        const A = ABBONAMENTI;
        const k = iContiDeiNegozi();
        const casa = leCasePerLicenza();
        const righe = tutteLeLicenze();
        const prima = (stato) =>
          righe
            .filter((riga) => riga.stato === stato && typeof riga.quando === "number")
            .sort((a, b) => a.quando - b.quando)[0] || null;
        const carta = (tinta, nome, valore, piccolo, nota, spiega) => `
          <div class="kpi ${testo(tinta)}">
            <span class="kpi-capo"><i class="pallino" aria-hidden="true"></i><span class="kpi-nome">${testo(nome)}</span>${/* già HTML */ laBolla(spiega)}</span>
            <span class="kpi-numero">${testo(valore)}${piccolo ? `<small>${testo(piccolo)}</small>` : ""}</span>
            <span class="kpi-nota">${testo(nota)}</span>
          </div>`;

        const laPrimaProva = prima("prova");
        const laPrimaCheTermina = prima("nonrinnova");
        const alMese = A ? alMeseDetto(A.conti?.alMese) : "—";
        const pagamenti = k.n("pagamenti");
        const incassato = lIncassatoDetto(A?.conti?.incassato);
        const mese = ilMeseDetto(A?.conti?.inizioDelMese);

        const leCase = carta(
          "k-case",
          "Case Premium",
          numero(casa.premium),
          `/${numero(casa.tutte)}`,
          casa.base
            ? `${plurale(casa.base, "casa è Base", "case sono Base")}`
            : "nessuna casa Base",
          "Le case con una licenza valida, da qualunque strada: comprata, regalata o data da un installatore. Le altre sono Base: GdAHome gratis, senza le funzioni Premium.",
        );
        if (!A)
          return `
          <div class="kpi-griglia">
            ${/* già HTML */ leCase}
            <div class="kpi k-vuoto"><span class="vuoto"><b>Gli abbonamenti non sono arrivati</b> Riprova fra poco, o premi «Aggiorna».</span></div>
          </div>`;
        const notaPaganti = !k.paganti
          ? k.n("hannoPagato")
            ? "nessuno adesso"
            : "nessuno, per ora"
          : k.pagantiNonRinnovano
            ? `di cui ${numero(k.pagantiNonRinnovano)} non ${k.pagantiNonRinnovano === 1 ? "rinnova" : "rinnovano"}`
            : `${numero(k.n("pagantiMensili"))} mensili · ${numero(k.n("pagantiAnnuali"))} annuali`;
        const notaProva = laPrimaProva
          ? `la prima paga ${conLArticolo("il", laPrimaProva.quando)}`
          : k.inProva
            ? "hanno disdetto"
            : "nessuna in corso";
        const notaNonRinnovano = laPrimaCheTermina
          ? `la prima termina ${conLArticolo("il", laPrimaCheTermina.quando)}`
          : "nessuno ha disdetto";
        const notaRicorrente = k.pagantiRinnovano
          ? `da ${plurale(k.pagantiRinnovano, "pagante che rinnova", "paganti che rinnovano")}`
          : "nessuno si rinnova";
        const notaIncassato = pagamenti
          ? `a ${mese} · ${plurale(pagamenti, "pagamento", "pagamenti")}`
          : `nessun pagamento a ${mese}`;
        const nomeIncassato = "Incassato";
        return `
          <div class="kpi-griglia">
            ${/* già HTML */ carta("k-paga", "Paganti", numero(k.paganti), "", notaPaganti, "Clienti che hanno pagato il periodo in corso su App Store o Google Play, che si rinnovino o no. Chi ha disdetto resta pagante fino alla fine del periodo pagato.")}
            ${/* già HTML */ carta("k-prova", "In prova", numero(k.inProva), "", notaProva, "Abbonamenti nei 14 giorni gratis: non hanno ancora pagato. Alla fine della prova pagano, se non disdicono prima.")}
            ${/* già HTML */ carta("k-avviso", "Non rinnovano", numero(k.nonRinnovano), "", notaNonRinnovano, "Hanno spento il rinnovo dal negozio: restano Premium fino alla fine del periodo pagato (o della prova), poi la casa torna Base.")}
            ${/* già HTML */ carta("k-soldi", "Ricorrente", alMese === "—" ? "0 €" : alMese, "/mese", notaRicorrente, "Quanto entra ogni mese se nessuno disdice: la somma di quello che pagano i paganti che si rinnovano, un annuale conta un dodicesimo. IVA inclusa, prima della commissione di Apple e Google.")}
            ${/* già HTML */ carta("k-soldi", nomeIncassato, pagamenti && incassato === "0 €" ? "—" : incassato, "", notaIncassato, "I soldi che i clienti hanno già pagato questo mese, anche chi poi ha disdetto. IVA inclusa, prima della commissione di Apple e Google (dal 15% al 30%): il netto sta in App Store Connect e nella Play Console.")}
            ${/* già HTML */ leCase}
          </div>`;
      }

      /* «In arrivo»: quello che succede nei prossimi trenta giorni, in ordine
       * di data. Chi si rinnova (un incasso), chi finisce la prova (il primo
       * incasso, o la fine senza pagare), chi ha disdetto e termina, e i
       * regali che finiscono. Il perche' e' la frase della riga. */
      function inArrivo() {
        const ora = Date.now();
        const COSA = {
          attiva: (riga) =>
            riga.negozio
              ? ["s-ok", "rinnovo", `si rinnova · ${riga.soldi}`]
              : [
                  "s-avviso",
                  "termina",
                  riga.fonte === "regalo"
                    ? "finisce il regalo"
                    : "finisce la licenza dell'installatore",
                ],
          prova: (riga) => [
            "s-prova",
            "fine prova",
            `fine prova: comincia a pagare${riga.soldiSotto.startsWith("poi ") ? ` ${riga.soldiSotto.slice(4)}` : ""}`,
          ],
          nonrinnova: (riga) => [
            "s-avviso",
            "termina",
            riga.soldi === "0 €" ? "fine prova, senza pagare" : "termina: ha disdetto",
          ],
        };
        const prossime = tutteLeLicenze()
          .filter(
            (riga) =>
              COSA[riga.stato] &&
              typeof riga.quando === "number" &&
              riga.quando >= ora &&
              riga.quando - ora <= TRENTA_GIORNI,
          )
          .sort((a, b) => a.quando - b.quando);
        const MOSTRATE = 6;
        const incassi = prossime.filter(
          (riga) => riga.stato !== "nonrinnova" && riga.negozio,
        ).length;

        /* La linea dei trenta giorni: un pallino per scadenza, del colore di
         * quello che succede; due nello stesso giorno stanno uno sopra
         * l'altro. Sotto, le tacche delle settimane. */
        const nelGiorno = new Map();
        const punti = prossime
          .map((riga) => {
            const [tinta, , cosa] = COSA[riga.stato](riga);
            const giorno = Math.floor((riga.quando - ora) / (24 * 60 * 60 * 1000));
            const sopra = nelGiorno.get(giorno) || 0;
            nelGiorno.set(giorno, sopra + 1);
            const dove = Math.min(100, Math.max(0, ((riga.quando - ora) / TRENTA_GIORNI) * 100));
            const detto = `${ilGiornoCorto(riga.quando)} · ${riga.nome} · ${cosa}`;
            return `<span class="lt-punto ${testo(tinta)}" style="left: ${dove.toFixed(2)}%; bottom: ${Number(10 + sopra * 14)}px" title="${testo(detto)}"><i class="pallino" aria-hidden="true"></i></span>`;
          })
          .join("");
        const tacche = [0, 7, 14, 21, 30]
          .map((giorni) => {
            const quando = ora + giorni * 24 * 60 * 60 * 1000;
            const dove = (giorni / 30) * 100;
            return `<span class="lt-tacca" style="left: ${dove.toFixed(2)}%">${testo(giorni ? ilGiornoCorto(quando) : "oggi")}</span>`;
          })
          .join("");
        const legenda = [
          ["s-ok", "rinnovo"],
          ["s-prova", "fine prova"],
          ["s-avviso", "termina"],
        ]
          .map(
            ([tinta, parola]) =>
              `<span class="${testo(tinta)}"><i class="pallino" aria-hidden="true"></i>${testo(parola)}</span>`,
          )
          .join("");
        return `
          <section class="scheda in-arrivo">
            <h3><span class="tondino">${LE_ICONE["calendario"]}</span>In arrivo<span class="conta">${
              prossime.length
                ? testo(
                    `${plurale(prossime.length, "scadenza", "scadenze")} · ${incassi === 1 ? "1 incasso possibile" : `${numero(incassi)} incassi possibili`}`,
                  )
                : "prossimi 30 giorni"
            }</span></h3>
            ${
              prossime.length
                ? `<div class="linea-tempo" role="img" aria-label="${testo(`${plurale(prossime.length, "scadenza", "scadenze")} nei prossimi 30 giorni`)}">
                     <div class="lt-binario">${/* già HTML */ punti}</div>
                     <div class="lt-tacche">${/* già HTML */ tacche}</div>
                   </div>
                   <p class="lt-legenda">${/* già HTML */ legenda}</p>
                   <ol class="arrivo">${prossime
                     .slice(0, MOSTRATE)
                     .map((riga) => {
                       const [tinta, , cosa] = COSA[riga.stato](riga);
                       return `
                     <li class="${testo(tinta)}${riga.diUnaCasa ? "" : " ferma"}"${riga.diUnaCasa ? ` data-apri-casa="${testo(riga.sog)}" data-di="${testo(riga.chi)}" role="button" tabindex="0"` : ""}>
                       <span class="arrivo-giorno">${testo(ilGiornoCorto(riga.quando))}</span>
                       <b class="arrivo-casa">${testo(riga.nome)}</b>
                       <span class="arrivo-cosa"><i class="pallino" aria-hidden="true"></i>${testo(cosa)}</span>
                     </li>`;
                     })
                     .join("")}</ol>${
                     prossime.length > MOSTRATE
                       ? `<p class="minuta arrivo-altre">e ${testo(plurale(prossime.length - MOSTRATE, "altra", "altre"))} nell'elenco delle licenze</p>`
                       : ""
                   }`
                : `<p class="sotto">Niente nei prossimi 30 giorni: nessun rinnovo, nessuna prova che finisce, nessun regalo che scade.</p>`
            }
          </section>`;
      }

      /* «Come funziona»: le parole di questa sezione, con le regole vere del
       * quadro. Quattordici giorni di prova (i negozi), tre giorni di
       * margine al rinnovo (`MARGINE_DEL_RINNOVO`), otto giorni di gettone
       * (`OTTO_GIORNI`) e la revoca subito (il centralino chiede le tolte
       * ogni minuto). */
      function ilComeFunziona() {
        /* Chiuso finche' non lo si apre, poi resta come lo si e' lasciato. */
        const aperto = Boolean(LO_STATO_DELLE_LICENZE.glossario);
        const CARTE = [
          [
            "casa",
            "Casa: Base o Premium",
            "Un impianto con l'add-on GdAHome. Base è gratis e non scade; con una licenza è Premium, per tutti i telefoni della casa.",
          ],
          [
            "licenze",
            "Da dove arriva una licenza",
            "Un abbonamento nell'app (4,99 € al mese o 49,99 € all'anno), un tuo regalo o codice GDA-…, o il pacchetto di un installatore.",
          ],
          [
            "abbonamenti",
            "Prova e rinnovo",
            "14 giorni gratis, poi paga se non disdice. Apple e Google rinnovano da soli: il quadro li ricontrolla ogni ora, con 3 giorni di margine.",
          ],
          [
            "attenzione",
            "Non rinnova, scaduta, revocata",
            "Chi disdice resta Premium fino a fine periodo. Una revoca vale subito; una casa senza internet resta Premium al massimo otto giorni.",
          ],
          [
            "euro",
            "Incassato e ricorrente",
            "Incassato: già pagato questo mese. Ricorrente: quanto entra ogni mese se nessuno disdice. IVA inclusa, prima della commissione.",
          ],
        ];
        return `
          <details class="come-funziona" data-glossario${aperto ? " open" : ""}>
            <summary><span class="tondino">${LE_ICONE["libro"]}</span><b>Come funziona</b><span class="come-sotto">casa, licenza, prova, rinnovo, incassi</span><span class="freccina">${LE_ICONE["freccia"]}</span></summary>
            <ul class="glossario">${CARTE.map(
              ([icona, titolo, detto]) => `
              <li>
                <span class="tondino">${LE_ICONE[icona]}</span>
                <b>${testo(titolo)}</b>
                <span>${testo(detto)}</span>
              </li>`,
            ).join("")}</ul>
          </details>`;
      }

      /* Le case per piano: una ciambella e la sua legenda. Ogni casa una
       * volta sola, con la licenza che vince: paga, in prova, regalo tuo,
       * dall'installatore, Base. */
      function ilGraficoDelleCase() {
        const casa = leCasePerLicenza();
        const PEZZI = [
          ["paga", "Pagano un abbonamento", "b-paga"],
          ["prova", "In prova gratuita", "b-prova"],
          ["regalo", "Regalo tuo", "b-regalo"],
          ["installatore", "Dagli installatori", "b-installatore"],
          ["test", "Acquisto di test", "b-test"],
          ["base", "Base, gratis", "b-base"],
        ].filter(([quale]) => casa[quale]);
        const R = 52;
        const GIRO = 2 * Math.PI * R;
        const STACCO = PEZZI.length > 1 ? 3 : 0;
        let fatto = 0;
        const archi = PEZZI.map(([quale, , tinta]) => {
          const lungo = (casa[quale] / Math.max(1, casa.tutte)) * GIRO;
          const arco = `<circle class="${testo(tinta)}" cx="64" cy="64" r="${Number(R)}" stroke-dasharray="${Math.max(0, lungo - STACCO).toFixed(2)} ${(GIRO - Math.max(0, lungo - STACCO)).toFixed(2)}" stroke-dashoffset="${(-fatto).toFixed(2)}" />`;
          fatto += lungo;
          return arco;
        }).join("");
        const legenda = PEZZI.map(
          ([quale, parola, tinta]) => `
            <li>
              <i class="${testo(tinta)}" aria-hidden="true"></i>
              <span>${testo(parola)}</span>
              <b>${numero(casa[quale])}</b>
              <small>${testo(Math.round((casa[quale] / Math.max(1, casa.tutte)) * 100))}%</small>
            </li>`,
        ).join("");
        const detto = `${casa.premium} case Premium su ${casa.tutte}`;
        return `
          <section class="scheda grafico-case">
            <h3><span class="tondino">${LE_ICONE["casa"]}</span>Case per piano<span class="conta">${testo(plurale(casa.tutte, "casa", "case"))}</span></h3>
            <div class="ciambella-e-legenda">
              <div class="ciambella" role="img" aria-label="${testo(detto)}">
                <svg viewBox="0 0 128 128" aria-hidden="true"><circle class="ciambella-fondo" cx="64" cy="64" r="${Number(R)}" />${/* già HTML */ archi}</svg>
                <span class="ciambella-centro"><b>${numero(casa.premium)}</b><small>Premium su ${numero(casa.tutte)}</small></span>
              </div>
              <ul class="legenda-case">${/* già HTML */ legenda}</ul>
            </div>
          </section>`;
      }

      /* Le entrate: quanto e' entrato questo mese, quanto entra al mese se
       * nessuno disdice, e quanto si aspetta nelle prossime settimane dai
       * rinnovi. Lo storico mese per mese il quadro non ce l'ha: di ogni
       * abbonamento tiene l'ultimo pagamento (`licenze.js`, «Gli
       * abbonamenti»), e lo si dice invece di disegnare un grafico finto. */
      function leEntrate() {
        const A = ABBONAMENTI;
        if (!A) return "";
        const ora = Date.now();
        const SETTIMANA = 7 * 24 * 60 * 60 * 1000;
        const voci = (soldi) =>
          Object.entries(soldi || {}).filter(([, valore]) => Number(valore) > 0);
        const laValuta = voci(A.conti?.incassato)[0]?.[0] || voci(A.conti?.alMese)[0]?.[0] || "EUR";
        const incassato = Number(A.conti?.incassato?.[laValuta]) || 0;
        const ricorrente = Number(A.conti?.alMese?.[laValuta]) || 0;
        const mese = ilMeseDetto(A.conti?.inizioDelMese);
        const rinnovi = tutteLeLicenze().filter(
          (riga) =>
            riga.stato === "attiva" &&
            riga.negozio &&
            riga.prezzo > 0 &&
            riga.valuta === laValuta &&
            typeof riga.quando === "number" &&
            riga.quando >= ora &&
            riga.quando - ora <= TRENTA_GIORNI,
        );
        const proveCheFiniscono = tutteLeLicenze().filter(
          (riga) =>
            riga.stato === "prova" &&
            typeof riga.quando === "number" &&
            riga.quando >= ora &&
            riga.quando - ora <= TRENTA_GIORNI,
        ).length;
        const attesi = rinnovi.reduce((somma, riga) => somma + riga.prezzo, 0);
        const settimane = [0, 1, 2, 3].map((n) =>
          rinnovi
            .filter(
              (riga) =>
                riga.quando - ora >= n * SETTIMANA &&
                (n === 3 || riga.quando - ora < (n + 1) * SETTIMANA),
            )
            .reduce((somma, riga) => somma + riga.prezzo, 0),
        );
        const tetto = Math.max(incassato, ricorrente, attesi, 1);
        const barra = (tinta, nome, valore, nota) => `
          <li class="${testo(tinta)}">
            <span class="eb-nome">${testo(nome)}</span>
            <span class="eb-binario"><i style="width: ${((valore / tetto) * 100).toFixed(1)}%"></i></span>
            <b>${testo(iSoldi(valore, laValuta))}</b>
            <small>${testo(nota)}</small>
          </li>`;
        const tettoSett = Math.max(...settimane, 1);
        const IL_QUANDO = [
          "questa settimana",
          "fra 1 settimana",
          "fra 2 settimane",
          "fra 3+ settimane",
        ];
        const colonne = settimane
          .map(
            (valore, n) => `
            <li>
              <span class="ec-valore">${testo(valore ? iSoldi(valore, laValuta) : "—")}</span>
              <span class="ec-colonna"><i style="height: ${((valore / tettoSett) * 100).toFixed(1)}%"></i></span>
              <small>${testo(IL_QUANDO[n])}</small>
            </li>`,
          )
          .join("");
        const nomeIncassato = `Incassato a ${mese}`;
        const notaAttesi = `${plurale(rinnovi.length, "rinnovo", "rinnovi")}${proveCheFiniscono ? ` · più ${plurale(proveCheFiniscono, "prova che può pagare", "prove che possono pagare")}` : ""}`;
        return `
          <section class="scheda le-entrate">
            <h3><span class="tondino">${LE_ICONE["euro"]}</span>Entrate<span class="conta">IVA inclusa</span></h3>
            <ul class="entrate-barre">
              ${/* già HTML */ barra("e-incassato", nomeIncassato, incassato, "già pagato dai clienti")}
              ${/* già HTML */ barra("e-ricorrente", "Ricorrente al mese", ricorrente, "se nessuno disdice")}
              ${/* già HTML */ barra("e-attesi", "Rinnovi nei prossimi 30 giorni", attesi, notaAttesi)}
            </ul>
            <p class="servizio-titolo">Rinnovi attesi, settimana per settimana</p>
            <ol class="entrate-colonne">${/* già HTML */ colonne}</ol>
            <p class="minuta entrate-nota">Lo storico mese per mese non c'è: di ogni abbonamento il quadro tiene l'ultimo pagamento. Il conto completo sta in App Store Connect e nella Play Console.</p>
          </section>`;
      }

      /* I filtri dell'elenco: lo stato, e da dove viene. Ogni pastiglia porta
       * il suo numero, contato su tutte (con l'altro filtro). */
      function iFiltriDelleLicenze(righe) {
        const S = LO_STATO_DELLE_LICENZE;
        const conLaFonte = righe.filter((riga) => S.fonte === "tutte" || riga.fonte === S.fonte);
        const conLoStato = righe.filter((riga) => S.filtro === "tutte" || riga.stato === S.filtro);
        const stati = [
          ["tutte", "Tutte", conLaFonte.length, ""],
          ...Object.entries(GLI_STATI_DELLE_LICENZE).map(([quale, stato]) => [
            quale,
            stato.nome,
            conLaFonte.filter((riga) => riga.stato === quale).length,
            stato.tinta,
          ]),
        ]
          .filter(([quale, , n]) => quale === "tutte" || n || S.filtro === quale)
          .map(
            ([quale, parola, n, tinta]) =>
              `<button type="button" class="chip ${testo(tinta)}" data-filtro-licenze="${testo(quale)}" aria-pressed="${S.filtro === quale}">${tinta ? '<i class="pallino" aria-hidden="true"></i>' : ""}${testo(parola)} <b>${Number(n)}</b></button>`,
          )
          .join("");
        const fonti = [["tutte", "Da ogni parte"], ...Object.entries(LE_FONTI_DELLE_LICENZE)]
          .map(([quale, parola]) => {
            const n =
              quale === "tutte"
                ? conLoStato.length
                : conLoStato.filter((riga) => riga.fonte === quale).length;
            return `<button type="button" class="chip leggera" data-fonte-licenze="${testo(quale)}" aria-pressed="${S.fonte === quale}">${testo(parola)} <b>${Number(n)}</b></button>`;
          })
          .join("");
        return `
          <div class="filtri lic-filtri">
            <label class="cerca">
              ${LE_ICONE["cerca"]}
              <input type="search" id="cerca-licenze" value="${testo(S.cerca)}" placeholder="Cerca una casa, un negozio, un installatore" autocomplete="off" spellcheck="false" aria-label="Cerca una licenza" />
            </label>
            <div class="chips-riga" role="group" aria-label="Stato">${/* già HTML */ stati}</div>
            <div class="chips-riga" role="group" aria-label="Da dove viene">${/* già HTML */ fonti}</div>
          </div>`;
      }

      /* Scrive (o toglie) l'ultima versione pubblicata in un negozio. Prima
       * di avvisare tutti si chiede conferma: una volta partita, la notifica
       * arriva ai telefoni indietro e non si richiama. */
      async function scriviLUltima(negozio, tasto, { togli = false } = {}) {
        const blocco = tasto.closest("[data-ultima]");
        const versione = togli
          ? ""
          : blocco?.querySelector("[data-ultima-versione]")?.value.trim() || "";
        const costruzione = togli
          ? ""
          : blocco?.querySelector("[data-ultima-costruzione]")?.value.trim() || "";
        const nome = negozio === "apple" ? "App Store" : "Google Play";
        if (!togli) {
          if (!/^\d{1,10}$/.test(costruzione)) {
            alert("Scrivi il numero della build, solo cifre (per esempio 1180801).");
            return;
          }
          const ok = confirm(
            `${versione || "La build"} ${costruzione} è davvero su ${nome}?\n\nI telefoni ${nome === "App Store" ? "iPhone e iPad" : "Android"} con una build più vecchia ricevono una volta la notifica «aggiorna l'app».`,
          );
          if (!ok) return;
        }
        tasto.disabled = true;
        try {
          const detto = await chiedi(`/ultime-dell-app/${negozio}`, {
            method: "PUT",
            body: JSON.stringify({ versione, costruzione }),
          });
          if (ABBONAMENTI) ABBONAMENTI.ultimeDellApp = detto.ultimeDellApp;
          try {
            ABBONAMENTI = await chiedi("/abbonamenti");
          } catch (_niente) {
            /* Si tiene quello di prima, con l'ultima nuova. */
          }
          disegna();
        } catch (errore) {
          alert(
            errore?.message === "versione-non-valida"
              ? "La versione si scrive come nel negozio, per esempio 1.18.8."
              : "Non si è salvata. Riprova fra poco.",
          );
          tasto.disabled = false;
        }
      }

      function gliAbbonamenti() {
        const A = ABBONAMENTI;
        const righe = tutteLeLicenze();
        const k = iContiDeiNegozi();
        const testa = `
          <div class="capo-sezione">
            <div>
              <h2>Abbonamenti e licenze</h2>
              <p>Ogni licenza Premium in un posto solo: comprata nell'app, regalata da te o data da un installatore. Tocca una riga per sapere perché è in quello stato.</p>
            </div>
          </div>`;

        /* Tutti i conti dei negozi, per chi li vuole per intero: chiusi in
         * fondo, perche' i numeri che contano stanno in cima. */
        const conto = (tinta, valore, nome) =>
          `<div class="servizio-conto ${testo(tinta)}">
             <b>${testo(valore)}</b><span>${testo(nome)}</span>
           </div>`;
        const ilMese = ilMeseDetto(A?.conti?.inizioDelMese);
        const unNegozioInCifre = ([chiave, nome]) => {
          const suoi = A?.negozi?.[chiave] || {};
          const suoiNuovi = suoi.pagantiRinnovano !== undefined;
          const suoiNonRinnovano = Number(suoi.pagantiNonRinnovano ?? suoi.pagatiDisdetti) || 0;
          const suoiPaganti = suoiNuovi
            ? Number(suoi.paganti) || 0
            : (Number(suoi.paganti) || 0) + suoiNonRinnovano;
          const suoiInProva = suoiNuovi
            ? Number(suoi.inProva) || 0
            : (Number(suoi.inProva) || 0) + (Number(suoi.disdettiInProva) || 0);
          const alMese = alMeseDetto(suoi.alMese);
          return `
          <div class="servizio-blocco">
            <div class="servizio-capo">
              <span class="lic-segno ${chiave === "ios" ? "negozio-a" : "negozio-g"}" aria-hidden="true">${chiave === "ios" ? "A" : "G"}</span>
              <div class="servizio-chi">
                <b>${testo(nome)}</b>
                <span>${testo(plurale(suoiPaganti, "pagante", "paganti"))}${alMese === "—" ? "" : ` · ${testo(alMese)} al mese`}${Number(suoi.pagamenti) ? ` · ${testo(lIncassatoDetto(suoi.incassato))} incassati a ${testo(ilMese)}` : ""}</span>
              </div>
              <span class="pastiglia ${suoi.rinnovi7 ? "posto" : ""}">${
                suoi.rinnovi7
                  ? `${testo(plurale(suoi.rinnovi7, "rinnovo", "rinnovi"))} in 7 giorni`
                  : "nessun rinnovo in 7 giorni"
              }</span>
            </div>
            <div class="servizio-conti">
              ${/* già HTML */ conto("verde", suoiPaganti, "paganti")}
              ${/* già HTML */ conto("ambra", suoiNonRinnovano, "paganti che non rinnovano: finiscono a scadenza")}
              ${/* già HTML */ conto("blu", suoiInProva, "in prova gratuita")}
              ${/* già HTML */ conto("ambra", Number(suoi.proveNonRinnovano ?? suoi.disdettiInProva) || 0, "prove che non rinnovano: finiscono senza pagare")}
              ${/* già HTML */ conto("blu", Number(suoi.test) || 0, "acquisti di test, non contano")}
            </div>
          </div>`;
        };
        const prove = A?.conti?.prove || { finite: 0, pagate: 0 };
        const tuttiIConti = A
          ? `
            <details class="apri-riga">
              <summary>Tutti i conti, negozio per negozio<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
              <div class="servizio-blocco">
                <p class="servizio-titolo">In tutto</p>
                <div class="servizio-conti">
                  ${/* già HTML */ conto("verde", k.paganti, "paganti")}
                  ${/* già HTML */ conto("verde", k.pagantiRinnovano, "paganti che si rinnovano")}
                  ${/* già HTML */ conto("ambra", k.pagantiNonRinnovano, "paganti che non rinnovano: finiscono a scadenza")}
                  ${/* già HTML */ conto("blu", k.n("pagantiMensili"), "paganti mensili")}
                  ${/* già HTML */ conto("blu", k.n("pagantiAnnuali"), "paganti annuali")}
                  ${/* già HTML */ conto("blu", k.inProva, "in prova gratuita")}
                  ${/* già HTML */ conto("ambra", k.proveNonRinnovano, "prove che non rinnovano: finiscono senza pagare")}
                  ${/* già HTML */ conto("blu", k.n("finiti30"), "finiti negli ultimi 30 giorni")}
                  ${/* già HTML */ conto("verde", prove.finite ? `${Number(prove.pagate)} su ${Number(prove.finite)}` : "—", "prove finite che sono passate a pagamento")}
                  ${/* già HTML */ conto("verde", k.n("hannoPagato"), "hanno pagato almeno una volta")}
                  ${/* già HTML */ conto("verde", lIncassatoDetto(A.conti?.incassato), "incassati a " + ilMese + ", IVA compresa")}
                  ${/* già HTML */ conto("verde", alMeseDetto(A.conti?.alMese) === "—" ? "0 €" : alMeseDetto(A.conti?.alMese), "ricorrente al mese, quello che pagano i clienti che si rinnovano")}
                  ${/* già HTML */ conto("blu", k.test, "acquisti di test, fuori da ogni numero")}
                </div>
              </div>
              ${[
                ["ios", "App Store"],
                ["android", "Google Play"],
              ]
                .map(unNegozioInCifre)
                .join("")}
            </details>`
          : "";

        /* Dove Apple e Google mandano i loro avvisi, e se ne arrivano: e' il
         * modo di sapere che App Store Connect e la Play Console sono scritti
         * giusti. L'indirizzo di Google ha dentro un segreto: questa pagina la
         * vede solo chi tiene il quadro. */
        const av = A?.avvisi || {};
        const unAvviso = (nome, via, ultimo, dove) => {
          const stato = ultimo
            ? "ultimo avviso " + daQuanto(ultimo)
            : "nessun avviso ancora: l'indirizzo va scritto in " + dove;
          return `
          <div class="servizio-blocco">
            <div class="servizio-capo">
              <span class="servizio-ic" aria-hidden="true">${LE_ICONE["telefono"]}</span>
              <div class="servizio-chi">
                <b>${testo(nome)}</b>
                <span>${testo(stato)}</span>
              </div>
              <span class="pastiglia ${ultimo ? "posto" : ""}">${ultimo ? "arrivano" : "da scrivere"}</span>
            </div>
            <p class="minuta" style="margin: 8px 0 0; word-break: break-all"><code>${testo(via ? location.origin + via : "—")}</code></p>
          </div>`;
        };
        const gliAvvisi = A
          ? `
          <details class="apri-riga">
            <summary>Avvisi in tempo reale da Apple e Google<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
            ${/* già HTML */ unAvviso("App Store", av.apple, av.ultimi?.ios, "App Store Connect → App → Informazioni sull'app → Notifiche del server App Store (versione 2), produzione e sandbox")}
            ${/* già HTML */ unAvviso("Google Play", av.google, av.ultimi?.android, "Google Cloud Pub/Sub (iscrizione push) e nella Play Console → Monetizza → Configurazione della monetizzazione → Notifiche in tempo reale")}
            <p class="minuta" style="margin: 10px 2px 0">Con gli avvisi, chi compra, disdice, viene rimborsato o si riabbona si vede qui in pochi secondi. Senza, il quadro li richiede comunque ogni ora. Dell'avviso si usa solo quale abbonamento riguarda: lo stato vero si chiede sempre al negozio.</p>
          </details>`
          : "";

        const tagliato =
          A && k.tutti > (A.elenco || []).length
            ? `<p class="minuta" style="margin: 10px 2px 0">Degli abbonamenti dei negozi l'elenco mostra i primi ${numero((A.elenco || []).length)}: i numeri in cima li contano tutti e ${numero(k.tutti)}.</p>`
            : "";

        return `${/* già HTML */ testa}
          ${
            LICENZE.accese === false || (A && !A.accese)
              ? `<div class="avvertenza" style="margin: 0 0 14px">
                   <span class="gettone" aria-hidden="true">!</span>
                   <span><b>Le licenze sono spente.</b> Senza la chiave delle licenze nessuna casa riceve Premium, né comprato né regalato: vedi «Regali e codici».</span>
                 </div>`
              : ""
          }

          ${/* già HTML */ iNumeriDelleLicenze()}

          <div class="griglia griglia-2 grafici">
            ${/* già HTML */ ilGraficoDelleCase()}
            ${/* già HTML */ leEntrate()}
          </div>

          ${/* già HTML */ inArrivo()}

          ${/* già HTML */ ilComeFunziona()}

          <section class="scheda lic-elenco">
            <h3>Tutte le licenze<span class="conta">${testo(plurale(righe.filter((riga) => riga.vale && riga.stato !== "test").length, "valida", "valide"))} · ${testo(plurale(righe.length, "in tutto", "in tutto"))}</span></h3>
            ${/* già HTML */ iFiltriDelleLicenze(righe)}
            <div id="elenco-licenze">${/* già HTML */ leRigheDelleLicenze()}</div>
            ${/* già HTML */ tagliato}
            ${/* già HTML */ tuttiIConti}
            ${/* già HTML */ gliAvvisi}
          </section>

          <p class="minuta piede-sezione">
            Gli importi sono quelli che pagano i clienti, IVA compresa: Apple e Google trattengono la loro commissione (15% o 30%, secondo il programma e l'anzianità dell'abbonamento) e versano il resto. Il quadro non sa quale si applica, e il netto non lo stima: il conto preciso, con le tasse di ogni paese, sta in App Store Connect e nella Play Console. Dell'incassato il quadro tiene l'ultima ricevuta di ogni abbonamento: l'importo dell'ultima transazione su App Store e il prezzo del piano su Google Play.
          </p>`;
      }

      /* ─── Versioni dell'app sui telefoni ────────────────────────────────
       *
       * Stava in fondo agli abbonamenti, ed e' un'altra domanda: quale app
       * hanno sui telefoni, negozio per negozio. Adesso ha la sua sezione,
       * coi dati che arrivano insieme agli abbonamenti
       * (`versioniDelleApp`, `versioni-delle-app.js`). */
      function leVersioniDellApp() {
        const A = ABBONAMENTI;
        if (!A)
          return `
          <div class="capo-sezione le-versioni">
            <div><h2>Versioni dell'app sui telefoni</h2></div>
          </div>
          <section class="scheda">
            <div class="vuoto"><b>Le versioni non sono arrivate</b> Arrivano con gli abbonamenti: riprova fra poco, o premi «Aggiorna».</div>
          </section>`;
        /* Le versioni dell'app sui telefoni, negozio per negozio: quante per
         * versione, dai rapporti delle case (solo quanti, mai quali
         * telefoni). In ogni negozio la piu' nuova vista e' «la più nuova»,
         * le altre «indietro»: una build puo' essere gia' su Google Play e
         * ancora in revisione da Apple. */
        const VUOTO_NEGOZIO = { versioni: [], telefoni: 0, piuNuova: 0 };
        const V = A.versioniDelleApp || { negozi: {}, case: [], telefoni: 0 };
        const IL_NEGOZIO = {
          apple: { nome: "App Store", chi: "iPhone e iPad" },
          google: { nome: "Google Play", chi: "Android" },
          altro: { nome: "Nel browser o non detto", corto: "Altro:", chi: "" },
        };
        const laVersione = (v) =>
          v.versione
            ? `${v.versione}${v.costruzione ? ` (${v.costruzione})` : " · numero non detto"}`
            : "Versione non detta";
        const rigaVersione = (N) => (v) => {
          const parte = N.telefoni ? Math.round((v.telefoni / N.telefoni) * 100) : 0;
          const nuova = N.piuNuova > 0 && v.costruzione === N.piuNuova;
          return `
          <li class="ferma riga-versione">
            <span class="riga-testo">
              <b>${testo(laVersione(v))}</b>
              <span>${testo(plurale(v.telefoni, "telefono", "telefoni"))} · ${testo(v.case === 1 ? "in 1 casa" : `in ${numero(v.case)} case`)}</span>
              <span class="quota-versione" aria-hidden="true"><i class="${nuova ? "nuova" : ""}" style="width: ${Number(parte)}%"></i></span>
            </span>
            <span class="riga-fine"><span class="per-cento">${testo(parte)}%</span><span class="pastiglia ${nuova ? "posto" : N.piuNuova ? "guardare" : ""}">${nuova ? "la più nuova" : N.piuNuova ? "indietro" : "senza numero"}</span></span>
          </li>`;
        };
        const unNegozio = (chiave) => {
          const N = V.negozi?.[chiave] || VUOTO_NEGOZIO;
          const cosa = IL_NEGOZIO[chiave];
          const nuove = N.versioni.filter((v) => N.piuNuova > 0 && v.costruzione === N.piuNuova);
          const aggiornati = nuove.reduce((somma, v) => somma + v.telefoni, 0);
          const sotto = !N.telefoni
            ? "nessun telefono visto negli ultimi 7 giorni"
            : N.piuNuova
              ? `${plurale(N.telefoni, "telefono", "telefoni")} · ${aggiornati} con la più nuova, ${N.telefoni - aggiornati} da aggiornare`
              : plurale(N.telefoni, "telefono", "telefoni");
          return `
          <div class="scheda servizio-blocco">
            <div class="servizio-capo">
              <span class="lic-segno ${chiave === "apple" ? "negozio-a" : "negozio-g"}" aria-hidden="true">${chiave === "apple" ? "A" : "G"}</span>
              <div class="servizio-chi">
                <b>${testo(cosa.nome)}</b>
                <span>${cosa.chi ? `${testo(cosa.chi)} · ` : ""}${testo(sotto)}</span>
              </div>
              ${
                N.piuNuova ? `<span class="pastiglia posto">ultima ${testo(N.piuNuova)}</span>` : ""
              }
            </div>
            ${
              N.versioni.length
                ? `<ul class="elenco">${N.versioni.map(rigaVersione(N)).join("")}</ul>`
                : `<div class="vuoto"><b>Ancora nessuna versione</b> Arriva dalle case accese, ogni ora.</div>`
            }
            ${/* già HTML */ lUltima(chiave)}
          </div>`;
        };
        /* L'ultima pubblicata in questo negozio: la scrive chi tiene il
         * quadro quando la versione e' davvero nel negozio, ed e' quello
         * che fa partire l'avviso «aggiorna l'app» ai telefoni indietro. */
        const ULTIME = A.ultimeDellApp || {};
        const lUltima = (chiave) => {
          const una = ULTIME[chiave];
          const cosa = IL_NEGOZIO[chiave];
          return `
            <div class="ultima-del-negozio" data-ultima="${testo(chiave)}">
              <p class="servizio-titolo">Ultima pubblicata su ${testo(cosa.nome)}</p>
              ${
                una
                  ? `<p class="minuta ultima-ora">${testo(laVersione(una))}${una.il ? ` · scritta ${testo(conLArticolo("il", una.il))}` : ""}. Chi ha una build più vecchia riceve una volta la notifica «aggiorna l'app».</p>`
                  : `<p class="minuta ultima-ora">Non scritta: nessun telefono viene avvisato.</p>`
              }
              <div class="due-campi pari">
                <div class="campo">
