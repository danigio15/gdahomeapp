      /* Il pacchetto di un installatore, sotto il metro dei posti. */
      .pacchetto-conto {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      /* La riga del pacchetto, sorella di quelle del nome e del limite. */
      .rigaPacchetto {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .rigaPacchetto[hidden] {
        display: none;
      }

      .rigaPacchetto .nota {
        flex-basis: 100%;
      }

      .rigaPacchetto label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--ink-2);
      }

      .rigaPacchetto input {
        width: 5.5rem;
        font-weight: 700;
      }

      /* Il pacchetto a righe: app, durata, quante, e il tasto per toglierla.
         Lo stesso pezzo nella carta dell'installatore e in «Aggiungi». */
      .righe-pacchetto {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-basis: 100%;
        min-width: 0;
        container-type: inline-size;
      }

      /* Stretta nella carta, larga in «Aggiungi»: le due tendine non
         crescono oltre quello che serve a leggerle. */
      .riga-pacchetto {
        display: grid;
        grid-template-columns: minmax(0, 12rem) minmax(0, 12rem) 3.9rem auto;
        justify-content: start;
        gap: 8px;
        align-items: center;
      }

      .riga-pacchetto select,
      .riga-pacchetto input {
        width: 100%;
        padding: 8px 6px 8px 9px;
        font-size: 0.88rem;
      }

      .riga-pacchetto input {
        font-weight: 700;
      }

      .riga-pacchetto .togli-riga {
        padding: 7px 10px;
      }

      .righe-pacchetto .aggiungi-riga {
        align-self: flex-start;
      }

      .righe-pacchetto .vuoto-pacchetto {
        margin: 0;
        font-size: 0.84rem;
        color: var(--ink-3);
      }

      /* Piu' stretta ancora (la carta sul telefono): app e durata sopra,
         quante e il tasto sotto. */
      @container (max-width: 18rem) {
        .riga-pacchetto {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          padding-bottom: 8px;
          border-bottom: 1px solid var(--linea);
        }

        .riga-pacchetto .togli-riga {
          justify-self: start;
        }
      }

      .sola-lettura {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--accento-soft);
        color: var(--accento);
        font-size: 0.78rem;
        font-weight: 700;
      }

      /* ─── Le sezioni della gestione ────────────────────────────────────
       *
       * «Rivedere completamente il cruscotto gdahome: non si capisce nulla,
       * cerca di riorganizzare le cose con sezioni.»
       *
       * Cinque sezioni, una per domanda: come va (Panoramica), le case, gli
       * installatori, quello che si regala, quello che si compra. Ogni
       * sezione comincia con un titolo e una riga che dice cosa c'e' dentro,
       * e quello che si apre — una casa, un installatore, uno nuovo — si apre
       * in una scheda di lato. I pezzi sono pochi e sempre gli stessi: la
       * scheda bianca, la riga d'elenco con la sua icona tonda, il numero
       * grande, la pastiglia. */

      .capo-sezione {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin: 18px 2px 14px;
      }

      .capo-sezione h2 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }

      .capo-sezione p {
        margin: 4px 0 0;
        max-width: 66ch;
        color: var(--ink-2);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .capo-sezione p b {
        color: var(--ink);
      }

      .griglia {
        display: grid;
        gap: 14px;
      }

      .griglia + .griglia,
      .griglia + .scheda,
      .scheda + .griglia {
        margin-top: 14px;
      }

      /* Dentro una griglia lo spazio lo fa la griglia: un margine in più
         abbasserebbe una colonna sola, e le due non partirebbero alla stessa
         altezza (nella Panoramica, «Il servizio» sotto «Da guardare»). */
      .griglia > .griglia,
      .griglia > .scheda {
        margin-top: 0;
      }

      .griglia > .griglia {
        align-content: start;
      }

      .scheda {
        min-width: 0;
        padding: 18px 20px;
        border-radius: var(--r-grande);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
      }

      .scheda > h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 4px;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .scheda > h3 .conta {
        margin-left: auto;
        color: var(--ink-3);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .scheda > .sotto {
        margin: 0 0 12px;
        color: var(--ink-2);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .scheda.vuoto {
        padding: 34px 18px;
      }

      /* L'icona tonda: un quadrato morbido col disegno, tinto come lo stato.
         Accanto c'e' sempre la parola: la tinta non parla da sola. */
      .tondino {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--accento-soft);
        color: var(--accento);
      }

      .tondino svg {
        width: 18px;
        height: 18px;
      }

      .tondino.verde {
        background: var(--verde-soft);
        color: var(--verde);
      }

      .tondino.ambra {
        background: var(--ambra-soft);
        color: var(--ambra);
      }

      .tondino.rosso {
        background: var(--rosso-soft);
        color: var(--rosso);
      }

      .tondino.grigio {
        background: var(--linea);
        color: var(--ink-3);
      }

      /* Le iniziali di un installatore, o il suo marchio. */
      .iniziali {
        width: 38px;
        height: 38px;
        flex: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--accento-soft);
        color: var(--accento);
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .iniziali img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        padding: 3px;
      }

      .iniziali.grigio {
        background: var(--linea);
        color: var(--ink-3);
      }

      /* ─── Il numero grande ───────────────────────────────────────────── */

      .numerone {
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 16px 18px;
        border-radius: var(--r);
        background: var(--vetro-pieno);
        border: 1px solid var(--vetro-bordo);
        box-shadow: var(--ombra);
        color: inherit;
        font: inherit;
        text-align: left;
      }

      button.numerone {
        cursor: pointer;
        transition:
          transform 0.2s var(--molla),
          box-shadow 0.2s;
      }

      button.numerone:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra-alta);
      }

      .numerone .etichetta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-2);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .numerone .etichetta svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .numerone .valore {
        margin-top: 6px;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .numerone .valore small {
        color: var(--ink-2);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .numerone .dettaglio {
        color: var(--ink-2);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      /* ─── La riga d'elenco ───────────────────────────────────────────── */

      .elenco {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .elenco > li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 12px 4px;
      }

      /* La linea fra una riga e l'altra e' un tratto suo, e non il bordo
         della riga: una riga che si tocca ha gli angoli tondi, e il bordo li
         seguiva piegandosi alle due punte. */
      .elenco > li + li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 4px;
        right: 4px;
        height: 1px;
        background: var(--linea);
      }

      /* Le righe che si toccano escono di otto per parte, cosi' il fondo
         grigio sotto il dito non sta attaccato alle parole; la linea resta
         dov'e' nelle altre righe. */
      .elenco.si-tocca > li {
        margin: 0 -8px;
        padding: 12px;
        border-radius: 14px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .elenco.si-tocca > li + li::before {
        left: 12px;
        right: 12px;
      }

      .elenco.si-tocca > li:hover {
        background: var(--linea);
      }

      .elenco.si-tocca > li[aria-current="true"] {
        background: var(--accento-soft);
      }

      .elenco.si-tocca > li.ferma {
        cursor: default;
      }

      .elenco.si-tocca > li.ferma:hover {
        background: none;
      }

      .elenco > li.vuota {
        padding-block: 18px;
      }

      .riga-testo {
        flex: 1;
        min-width: 0;
      }

      .riga-testo > b {
        display: block;
        font-size: 0.95rem;
        font-weight: 750;
        letter-spacing: -0.01em;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .riga-testo > span {
        display: block;
        margin-top: 1px;
        color: var(--ink-2);
        font-size: 0.84rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      /* La licenza di una casa sta sotto il suo nome: sul telefono e
         nell'elenco stretto accanto alla scheda non c'e' posto a destra. */
      .riga-testo > .pastiglia {
        display: inline-flex;
        margin-top: 6px;
      }

      .riga-testo > .dice-male {
        color: var(--ambra);
        font-weight: 700;
      }

      .riga-fine {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .freccina {
        width: 18px;
        height: 18px;
        flex: none;
        display: grid;
        place-items: center;
        color: var(--ink-3);
      }

      .freccina svg {
        width: 100%;
        height: 100%;
      }

      /* Il pallino di come sta una macchina: verde, ambra, rosso, grigio. */
      .pallino {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--ink-3);
        box-shadow: 0 0 0 4px var(--linea);
      }

      .pallino.verde {
        background: var(--verde);
        box-shadow: 0 0 0 4px var(--verde-soft);
      }

      .pallino.ambra {
        background: var(--ambra);
        box-shadow: 0 0 0 4px var(--ambra-soft);
      }

      .pallino.rosso {
        background: var(--rosso);
        box-shadow: 0 0 0 4px var(--rosso-soft);
      }

      /* Premium e' blu; Base e quello che non vale piu' restano grigi. */
      .pastiglia.blu {
        background: var(--accento-soft);
        color: var(--accento);
      }

      /* «Gli altri otto controlli sono a posto»: la riga che apre il resto. */
      .apri-riga {
        margin-top: 6px;
        border-top: 1px solid var(--linea);
      }

      .apri-riga.primo {
        margin-top: 0;
        border-top: 0;
      }

      .apri-riga > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 4px 4px;
        color: var(--accento);
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        list-style: none;
      }

      .apri-riga.primo > summary {
        padding-top: 0;
      }

      .apri-riga > summary::-webkit-details-marker {
        display: none;
      }

      .apri-riga > summary .freccina {
        margin-left: auto;
        color: currentColor;
        transition: transform 0.2s;
      }

      .apri-riga[open] > summary .freccina {
        transform: rotate(90deg);
      }

      .apri-riga > :not(summary) {
        margin-top: 10px;
      }

      .servizio-titolo {
        margin: 0 0 8px;
        font-size: 0.86rem;
        font-weight: 800;
        color: var(--ink-2);
      }

      /* «Tutto in ordine», quando non c'e' niente da guardare. */
      .tutto-bene {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 4px 4px;
      }

      /* ─── Filtri e ricerca ───────────────────────────────────────────── */

      .filtri {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
      }

      .cerca {
        flex: 1 1 260px;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-3);
      }

      .cerca:focus-within {
        border-color: var(--accento);
        box-shadow: 0 0 0 3px var(--accento-soft);
      }

      .cerca svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .cerca input[type="search"] {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: none;
        color: var(--ink);
        font: inherit;
        padding: 10px 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-2);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .chip b {
        font-weight: 800;
      }

      .chip[aria-pressed="true"] {
        background: var(--accento);
        border-color: var(--accento);
        color: #fff;
      }

      /* ─── Gli installatori ───────────────────────────────────────────── */

      .carta-installatore {
        cursor: pointer;
        transition:
          transform 0.2s var(--molla),
          box-shadow 0.2s;
      }

      .carta-installatore:hover {
        transform: translateY(-1px);
        box-shadow: var(--ombra-alta);
      }

      .carta-installatore[aria-current="true"] {
        border-color: var(--accento);
        box-shadow:
          0 0 0 2px var(--accento-soft),
          var(--ombra);
      }

      .carta-installatore > h3 {
        gap: 12px;
        overflow-wrap: anywhere;
      }

      .carta-installatore > .sotto {
        margin: 10px 0 14px;
      }

      .posti-detti {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
        font-size: 0.88rem;
      }

      .posti-detti b {
        font-weight: 800;
      }

      .posti-detti span {
        color: var(--ink-2);
        font-weight: 700;
      }

      .carta-installatore[data-stato="limite"] .metro i,
      .foglio[data-stato="limite"] .metro i {
        background: var(--ambra);
      }

      .pacchetto-detto {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 12px 0 0;
        color: var(--ink-2);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .pacchetto-detto svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      /* ─── Dentro le schede che si aprono di lato ─────────────────────── */

      .foglio-corpo > .capitolo:first-child,
      .foglio-corpo > .chiave-nuova:first-child {
        margin-top: 8px;
      }

      .foglio-testa .tondino,
      .foglio-testa .iniziali {
        width: 42px;
        height: 42px;
        border-radius: 13px;
      }

      .tasto-chiudi {
        width: 38px;
        height: 38px;
        flex: none;
        margin-left: auto;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: var(--linea);
        color: var(--ink-2);
        cursor: pointer;
      }

      .tasto-chiudi svg {
        width: 18px;
        height: 18px;
      }

      /* Le regole di un installatore e la licenza di una casa: una riga per
         cosa, col suo tasto, e sotto la riga che si apre per cambiarla. */
      .regole > li {
        flex-wrap: wrap;
      }

      .regole .rigaNome,
      .regole .rigaLimite,
      .regole .rigaPacchetto {
        flex-basis: 100%;
        margin: 2px 0 2px 46px;
      }

      .regole .spiega {
        flex-basis: 100%;
        margin: 0 0 0 46px;
        color: var(--rosso);
        font-size: 0.84rem;
        font-weight: 600;
        line-height: 1.5;
      }

      .riquadro.rischio {
        border-color: var(--rosso-soft);
        box-shadow:
          0 0 0 1px var(--rosso-soft),
          var(--ombra);
      }

      .senza-limite {
        display: flex;
        align-items: center;
        align-self: end;
        gap: 9px;
        min-height: 44px;
        margin-bottom: 12px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid var(--linea-forte);
        background: var(--vetro-pieno);
        color: var(--ink-2);
        font-weight: 700;
        cursor: pointer;
      }

      input[type="number"]:disabled {
        opacity: 0.5;
      }

      .tasto.piccolo {
        padding: 7px 13px;
        font-size: 0.82rem;
      }

      /* La pastiglia della Panoramica sulla barra: piena, perche' e' l'unica
         e dice «c'e' qualcosa da guardare». */
      .barra .quanti.giallo {
        background: var(--ambra);
        color: #fff;
      }

      /* Il velo dietro la barra serve quando la pagina le scorre sotto. In
         cima alla pagina, sopra il cielo, si vedeva come un rettangolo
         chiaro intorno alla barra: adesso c'e' solo quando la barra e'
         attaccata in cima (lo dice il programma, `data-attaccata`). */
      .barra::before {
        opacity: 0;
        transition: opacity 0.2s;
      }

      .barra[data-attaccata]::before {
        opacity: 1;
      }

      /* Un riquadro a cui si salta (il regalo, dalla scheda di una casa) non
         deve finire sotto la barra. */
      .scheda[id] {
        scroll-margin-top: 92px;
      }

      .tasto svg {
        width: 16px;
        height: 16px;
        margin-right: 7px;
        vertical-align: -3px;
      }

      /* ─── Le colonne ─────────────────────────────────────────────────── */

      @media (min-width: 48rem) {
        .griglia-2,
        .griglia-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .griglia-4 {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        /* Cinque caselle: tre sopra e due sotto, larghe uguali per riga. */
        .griglia-5 {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .griglia-5 > * {
          grid-column: span 2;
        }

        .griglia-5 > :nth-child(n + 4) {
          grid-column: span 3;
        }
      }

      @media (min-width: 80rem) {
        .griglia-5 {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .griglia-5 > *,
        .griglia-5 > :nth-child(n + 4) {
          grid-column: auto;
        }
      }

      @media (min-width: 64rem) {
        .griglia-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* Sotto i sessantadue la barra non ha posto per cinque disegni e cinque
         parole: restano le parole. Sotto i quarantotto le linguette vanno su
         due righe, tre e due, come nel render. */
      @media (max-width: 61.99rem) {
        .barra button svg {
          display: none;
        }
      }

      @media (max-width: 47.99rem) {
        .barra {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          border-radius: 22px;
        }

        .barra button {
          padding: 10px 4px;
          border-radius: 16px;
          white-space: normal;
          line-height: 1.2;
        }

        .griglia-4,
        .griglia-5 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        /* Sul telefono la quinta resta sola: prende la riga intera. */
        .griglia-5 > :last-child {
          grid-column: 1 / -1;
        }

        .capo-sezione h2 {
          font-size: 1.4rem;
        }

        .scheda {
          padding: 16px;
        }

        .numerone .valore {
          font-size: 1.6rem;
        }

        /* La ricerca su tutta la riga, e le pastiglie dei filtri sotto: accanto
           a «Tutte» la scritta della casella non ci stava e si tagliava. */
        .cerca {
          flex-basis: 100%;
        }
      }

      /* Sul telefono stretto due tendine affiancate tagliano le parole
         («gdahome Prem…»): una sotto l'altra. */
      @media (max-width: 30rem) {
        .due-campi.pari {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="cielo" aria-hidden="true"></div>

    <div class="pagina">
      <header>
        <!-- Niente bollo, come nel cruscotto e per la stessa ragione: questa
             pagina si apre dentro Home Assistant, e il tasto del menu
             galleggia proprio li' sopra. Il tondo porta «gd», che e' il
             quadro. -->
        <div class="testata">
          <div class="tondo" aria-hidden="true"><span>gd</span></div>
          <div class="nomi">
            <h1>Gestione gdahome</h1>
            <p id="sottotitolo"></p>
          </div>
          <button
            type="button"
            class="vivo"
            id="vivo"
            title="Si aggiorna da sola. Premi per aggiornare adesso."
          >
            <i></i><span id="vivo-dice">Aggiorna</span>
          </button>
        </div>
      </header>

      <nav id="nav" class="barra" aria-label="Le schermate"></nav>

      <main id="dove"></main>
    </div>

    <div class="avviso" id="avviso" role="status" aria-live="polite"></div>

    <script>
      /* ───────────────────────────────────────────────────────────────────
       * Questa pagina parla con `/gestore/…` e con nient'altro.
       *
       * Non chiede mai `/console/…`: quelle vie vogliono la chiave di un
       * installatore, e chi tiene il quadro non ce l'ha — ne' deve averla. Le
       * case di ognuno si vedono da `/gestore/installatore/<chi>/case`, che le
       * costruisce con lo stesso pezzo di programma che le costruisce per lui:
       * quello che si vede qui e' quello che vede lui, ne' una riga di piu'.
       * E si guarda e basta: da qui non si installa, non si riavvia, non si
       * rinomina — la casa e' sua.
       * ─────────────────────────────────────────────────────────────────── */

      /* Se questa pagina sta dentro un riquadro di Home Assistant.
       *
       * Si guarda e basta: `window.top` di un'altra origine non si puo'
       * leggere, e il confronto solleva — in quel caso la risposta e' comunque
       * «si'», perche' un'origine diversa vuol dire proprio che qualcun altro
       * ci ha messo dentro. Serve a una cosa sola: lasciare in cima lo spazio
       * per il tasto del menu, che sta in quell'altro documento. */
      try {
        if (window.self !== window.top) document.documentElement.dataset.dentro = "sì";
      } catch (_altroDominio) {
        document.documentElement.dataset.dentro = "sì";
      }

      /* Le immagini che non arrivano, tolte: un ascolto solo per tutta la
       * pagina, in cattura perche' l'errore di un'immagine non sale. */
      document.addEventListener(
        "error",
        (evento) => {
          const chi = evento.target;
          if (chi instanceof HTMLImageElement && chi.dataset.seNonArriva === "via") chi.remove();
        },
        true,
      );

      const DOVE_STA_LA_CHIAVE = "gdahome.quadro.gestore";
      /* La chiave si tiene nel deposito **di questa scheda**, non del
       * browser: chiusa la scheda, se ne va.
       *
       * Stava nel deposito del browser, per sempre, e da li' la leggeva
       * qualunque pagina servita da questa stessa origine — compresa quella
       * dell'editor della plancia, che e' codice di un altro progetto. Il
       * prezzo, detto: aprendo una scheda nuova la chiave si ribatte, o la
       * consegna chi ci tiene dentro (la tessera in Home Assistant, l'app).
       *
       * Quella che le versioni di prima avevano lasciato nel browser si porta
       * in questa scheda una volta sola, e dal browser si toglie. */
      let chiave = "";
      try {
        chiave = sessionStorage.getItem(DOVE_STA_LA_CHIAVE) || "";
      } catch (_niente) {
        /* Deposito bloccato: si chiede a ogni apertura. */
      }
      try {
        const diPrima = localStorage.getItem(DOVE_STA_LA_CHIAVE);
        if (diPrima !== null) {
          if (!chiave && diPrima) {
            chiave = diPrima;
            sessionStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          }
          localStorage.removeItem(DOVE_STA_LA_CHIAVE);
        }
      } catch (_niente) {
        /* Niente da portare, o un deposito che non si lascia toccare. */
      }

      let INSTALLATORI = [];
      let CASE = 0;
      let ORFANE = 0;
      /* I numeri del servizio: quelli del quadro e, se sta sulla stessa
       * macchina, quelli del tramite (`/gestore/salute`). */
      let SALUTE = null;
      /* Le case di ogni installatore, come le vede lui: la matricola → quello
       * che risponde `/installatore/<chi>/case`, cioe' le case, di quali
       * aggiornamenti ci sono le note intere, e le soglie dei metri. */
      let LE_CASE_DI = new Map();
      /* Di quali aggiornamenti il quadro ha le note intere: l'unione di
       * quelle di tutti. Un segno e' un segno, di chiunque sia la casa. */
      let CON_LE_NOTE = new Set();
      /* Le soglie con cui si colorano i metri arrivano insieme alle case: sono
       * le stesse con cui il server decide, scritte una volta sola. */
      let SOGLIE = { troppoCaldo: 75, discoPieno: 85, discoFinito: 80 };
      const BATTERIA_SCARICA = 20;
      const SEGNALE_DEBOLE = 45;
      const DISCO_STANCO = 50;
      /* La chiave appena fatta, che si vede una volta sola e poi sparisce
       * ricaricando. Non finisce in nessun archivio, nemmeno del browser. */
      let APPENA_FATTO = null;
      /* Le licenze e i codici regalo (`/gestore/licenze`), e i codici appena
       * generati, che si mostrano in cima finche' non si chiudono. */
      let LICENZE = { accese: true, licenze: [], codici: [] };
      let CODICI_APPENA = null;
      /* Quello che si sta scrivendo nel modulo del regalo. La pagina si
       * ridisegna da sola ogni minuto, e una casa scelta dall'elenco non deve
       * sparire perche' nel frattempo si e' guardato altrove. */
      let IL_REGALO = {};
      /* Gli abbonamenti dei negozi (`/gestore/abbonamenti`), coi conti fatti
       * dal quadro. `null` finche' non arrivano. */
      let ABBONAMENTI = null;

      /* Le sezioni, nell'ordine della barra. L'indirizzo dice in quale si
       * e' (`#case`), e ricaricando la pagina si resta li'. */
      const LE_SCHERMATE = ["panoramica", "case", "installatori", "licenze", "abbonamenti"];
      let schermata = LE_SCHERMATE.includes(location.hash.slice(1))
        ? location.hash.slice(1)
        : "panoramica";
      /* Come si guardano l'elenco delle case e quello degli abbonamenti: si
       * tiene fra un ridisegno e l'altro. */
      let FILTRO_CASE = "tutte";
      let CERCA_CASE = "";
      let FILTRO_ABBONAMENTI = "tutti";
      /* I conti di tutta la pagina, rifatti a ogni disegno (`iConti`). */
      let CONTI = null;
      /* La scheda aperta di lato, o `null`: di che tipo (`casa`,
       * `installatore`, `nuovo`), quale, e se deve ancora salire (`appena`)
       * o sta scendendo (`chiudendo`). */
      let foglioAperto = null;
      /* Quale schermata e' stata disegnata l'ultima volta: l'anello e i metri
       * si aprono con la loro animazione la prima volta, non a ogni giro. */
      let disegnata = "";
      let animaIMetri = false;

      const ADESSO = () => Date.now();
      const dove = document.getElementById("dove");
      const doveNav = document.getElementById("nav");

      /* L'avviso in basso: una riga che compare e se ne va. Al posto di
       * `window.alert` e di `confirm`, che sul telefono si aprono come un
       * guasto di sistema. */
      const avviso = document.getElementById("avviso");
      let tempoDellAvviso = null;
      function avvisa(cosa) {
        avviso.textContent = cosa;
        avviso.classList.add("su");
        clearTimeout(tempoDellAvviso);
        tempoDellAvviso = setTimeout(() => avviso.classList.remove("su"), 2600);
      }

      /* ─── Quello che e' del cruscotto, parola per parola ────────────────
       *
       * Da qui fino a «Quello che e' solo della gestione» il programma e'
       * copiato dal cruscotto (`../console/index.html`), e una prova tiene che
       * resti uguale: la scheda di una casa si disegna in un modo solo.
       * ─────────────────────────────────────────────────────────────────── */

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      /* C'e' davvero? Quello che una casa non manda non si scrive
       * «undefined» sullo schermo di chi la ripara: o si dice che non lo dice,
       * o quel pezzo di frase non si scrive proprio. */
      const cE = (valore) => valore !== null && valore !== undefined && valore !== "";

      function daQuanto(quando) {
        const minuti = Math.round((ADESSO() - new Date(quando).getTime()) / 60000);
        if (!Number.isFinite(minuti)) return "chissà quando";
        if (minuti < 1) return "adesso";
        if (minuti < 60) return `${minuti} min fa`;
        const ore = Math.round(minuti / 60);
        if (ore < 24) return `${ore} ${ore === 1 ? "ora" : "ore"} fa`;
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      const ilGiorno = (quando) =>
        /* In italiano, non nella lingua del browser: questa pagina e' in
         * italiano tutta, e una data in inglese in mezzo si nota. */
        new Date(quando).toLocaleDateString("it-IT", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

      const livello = (valore, attenta, male) =>
        valore >= male ? "male" : valore >= attenta ? "attenta" : "bene";

      /* Il lavoro in ballo e la manutenzione, adesso che il ponte li manda
       * davvero. Restano scritte a prova di assenza: una casa ferma a un ponte
       * di ieri queste due righe non le ha, e deve rispondere di no invece di
       * rompersi. */
      const staLavorando = (c) => Boolean(c && c.lavoro && c.lavoro.stato === "in corso");

      /* Se questa riga e' quella che sta succedendo — o quella che si e'
       * appena chiesta. Si confronta per **nome e salto di versione**, che e'
       * l'unico modo che c'e': l'entita' nel rapporto non viaggia, e non
       * viaggia apposta. */
      const eLaStessa = (uno, l) =>
        Boolean(l) && l.nome === uno.nome && l.da === uno.da && l.a === uno.a;

      /* Quante entita' non rispondono.
       *
       * Due nomi per lo stesso numero: `giu` e' quello di adesso, `sparite`
       * quello dei ponti fino alla 1.5.6. Le due righe stanno qui per il tempo
       * che ci mette l'ultima casa ad aggiornarsi: una casa ferma a ieri non
       * deve far sparire il riquadro, deve solo mostrare quello che sa. */
      const quantiGiu = (c) => c?.entita?.giu ?? c?.entita?.sparite ?? 0;

      /* Le pastiglie dei dispositivi che non rispondono.
       *
       * Col ponte di adesso sono nomi. Da una casa vecchia arrivano le quattro
       * cifre di allora, e si disegnano com'erano — col cancelletto davanti,
       * che e' il segno che quello non e' un nome.
       *
       * `dispositivi` e' quanti sono **davvero**, `nomi` quanti se ne mandano:
       * quando il secondo e' piu' corto del primo la differenza si scrive, se
       * no un elenco tagliato sembrerebbe tutti quelli che ci sono.
       *
       * Qui non si taglia niente: si disegna tutto quello che arriva, e chi
       * installa li scorre. A tagliare e' il ponte, e il suo tetto sta a
       * duecento — una guardia contro un rapporto che cresce senza fine, non
       * una scelta di impaginazione. Questa riga e' quindi il caso raro, e
       * resta perche' il giorno che capita non deve sparire un numero. */
      function iNomiGiu(c) {
        const nomi = c?.entita?.nomi;
        if (Array.isArray(nomi) && nomi.length) {
          const quanti = c?.entita?.dispositivi ?? nomi.length;
          const altri = Math.max(0, quanti - nomi.length);
          return (
            nomi.map((uno) => `<span>${testo(uno)}</span>`).join("") +
            (altri ? `<span class="eAltri">e altri ${Number(altri)}</span>` : "")
          );
        }
        return (c?.entita?.impronte || []).map((una) => `<span>#${testo(una)}</span>`).join("");
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      const testo = (cosa) =>
        String(cosa).replace(
          /[&<>"']/g,
          (uno) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[uno],
        );

      /* Il CHANGELOG, disegnato come lo disegna l'app.
       *
       * Le note di una versione arrivano in markdown, e fino a ieri qui
       * finivano dentro la pagina **come testo**: un `## 5.3.0` si leggeva
       * col cancelletto, un elenco di venti righe era un muro, e un
       * `**Attenzione**` si leggeva con gli asterischi. Le stesse note,
       * nell'app, si leggono disegnate — `app/lib/vestito/markdown.dart` —
       * e la stessa cosa mostrata in due modi diversi sono due cose da
       * spiegare invece di una.
       *
       * Percio' qui si fa quello che fa l'app, e **niente di piu'**: titoli,
       * elenchi, righe che separano, blocchi di codice, e dentro la riga
       * grassetto, corsivo, codice e link. La regola e' la sua: quello che
       * non sa disegnare non lo butta, lo lascia scritto com'e'. Una tabella
       * markdown viene fuori con le sue barre e si capisce; un pezzo mangiato
       * no, e chi legge non sa nemmeno che gli manca qualcosa.
       *
       * E una regola in piu', che l'app non ha bisogno di avere: **prima si
       * scappa, poi si disegna**. Queste parole non sono nostre — le ha
       * scritte chi ha fatto l'aggiornamento, cioe' uno di fuori, e da qui
       * fino alla pagina non c'e' nessun altro che le guardi. I tag li mette
       * questa funzione e nessun altro: tutto il resto passa da `testo()`
       * prima di toccare la pagina, e un `<script>` scritto dentro le note
       * si legge `<script>`. */

      const IL_TITOLO = /^(#{1,6})\s+(.*)$/;
      const IL_PUNTO = /^(\s*)[-*+]\s+(.*)$/;
      const LA_RIGA = /^\s*([-*_])\s*\1\s*\1\s*$/;
      const IL_RECINTO = /^\s*```/;

      /* I rientri scritti per intero, non composti.
       *
       * Attaccare il numero al nome — la erre, e poi quanto sta dentro —
       * funzionerebbe, e lascerebbe nella pagina una erre sola che nessuna
       * regola veste: la prova che guarda se ogni classe ha il suo stile
       * legge quello che sta prima del pezzo calcolato, e giustamente si
       * lamenta. Un elenco di quattro voci costa meno di un'eccezione in
       * quella prova. Il primo e' vuoto: un punto che non sta dentro niente
       * non ha bisogno di dirlo. */
      const I_RIENTRI = ["", ' class="r1"', ' class="r2"', ' class="r3"'];

      /* I segni dentro la riga: grassetto, codice, link, corsivo.
       *
       * Un segno aperto e mai chiuso resta il carattere che e': `**` da solo
       * si legge `**` e non si mangia il resto della riga.
       *
       * Nell'app la stessa regola guarda **indietro** — `(?<![A-Za-z0-9])` —
       * per non fare il corsivo in mezzo a `sensor_di_casa`. Qui no, e non e'
       * una svista: guardare indietro nelle espressioni regolari non lo sa
       * fare il browser di un tablet di qualche anno fa, e una regola che non
       * si sa leggere non e' una riga che si perde, e' tutta la pagina che
       * non parte. Qui il carattere di prima si prende e si rimette dov'era.
       * Le due letture danno lo stesso risultato: e' stato provato riga per
       * riga contro quella dell'app, `*a * b*` compreso. */
      const I_SEGNI =
        /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|(^|[^A-Za-z0-9])[*_](?![\s*_])(.*?\S)[*_](?![A-Za-z0-9])/g;

      /* Un link si apre solo se porta sul web.
       *
       * `javascript:` e `data:` non sono indirizzi, sono programmi, e nelle
       * note di un aggiornamento non ci hanno mai niente da fare: quello che
       * non comincia per http resta scritto com'era, parentesi comprese. */
      const SOLO_IL_WEB = /^https?:\/\//i;

      /* Il markdown, letto pezzo per pezzo. Non solleva mai e non butta mai
       * niente: al peggio un pezzo esce come paragrafo. */
      function iPezziDi(markdown) {
        const fuori = [];
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        let paragrafo = [];
        const chiudiIlParagrafo = () => {
          if (!paragrafo.length) return;
          fuori.push({ che: "paragrafo", testo: paragrafo.join(" ").trim() });
          paragrafo = [];
        };
        let dentroUnBlocco = false;
        let blocco = [];
        for (const riga of righe) {
          if (IL_RECINTO.test(riga)) {
            if (dentroUnBlocco) {
              fuori.push({ che: "blocco", testo: blocco.join("\n") });
              blocco = [];
              dentroUnBlocco = false;
            } else {
              chiudiIlParagrafo();
              dentroUnBlocco = true;
            }
            continue;
          }
          if (dentroUnBlocco) {
            blocco.push(riga);
            continue;
          }
          if (!riga.trim()) {
            chiudiIlParagrafo();
            continue;
          }
          if (LA_RIGA.test(riga)) {
            chiudiIlParagrafo();
            fuori.push({ che: "riga" });
            continue;
          }
          const titolo = IL_TITOLO.exec(riga);
          if (titolo) {
            chiudiIlParagrafo();
            fuori.push({ che: "titolo", livello: titolo[1].length, testo: titolo[2].trim() });
            continue;
          }
          const punto = IL_PUNTO.exec(riga);
          if (punto) {
            chiudiIlParagrafo();
            /* Due spazi per rientro, come si scrive: tre o quattro contano uno. */
            fuori.push({
              che: "punto",
              testo: punto[2].trim(),
              rientro: Math.floor(punto[1].length / 2),
            });
            continue;
          }
          paragrafo.push(riga.trim());
        }
        /* Un blocco lasciato aperto — un recinto senza l'altro — non si perde. */
        if (dentroUnBlocco && blocco.length)
          fuori.push({ che: "blocco", testo: blocco.join("\n") });
        chiudiIlParagrafo();
        return fuori;
      }

      /* I segni di una riga gia' scappata. Quello che entra e' testo
       * innocuo, quello che esce ha dentro solo i tag scritti qui. */
      const iSegniDi = (riga) =>
        riga.replace(I_SEGNI, (tutto, grassetto, codice, ilTesto, dove, prima, corsivo) => {
          if (grassetto !== undefined) return `<strong>${/* già HTML */ grassetto}</strong>`;
          if (codice !== undefined) return `<code>${/* già HTML */ codice}</code>`;
          if (ilTesto !== undefined) {
            /* Il link si preme, e si apre di fianco. `noreferrer` perche' a
             * chi ha scritto l'aggiornamento non deve arrivare l'indirizzo
             * del quadro di nessuno. */
            if (!SOLO_IL_WEB.test(dove)) return tutto;
            return `<a href="${/* già HTML */ dove}" target="_blank" rel="noopener noreferrer">${/* già HTML */ ilTesto}</a>`;
          }
          return `${/* già HTML */ prima}<em>${/* già HTML */ corsivo}</em>`;
        });

      /* Dal titolo di quella versione in giu'.
       *
       * Home Assistant, quando gli si chiedono le note di un aggiornamento,
       * risponde col changelog **intero**. Chi ha appena letto «1.5.9 →
       * 1.5.10» sulla riga non vuole ricominciare dal principio della storia:
       * vuole leggere la 1.5.10. Quello che c'era prima del suo titolo si
       * lascia fuori, le versioni di prima restano sotto — che e' dove si va
       * a cercarle. Se quel titolo non c'e' non si taglia niente.
       *
       * E' la stessa regola dell'app, parola per parola. */
      const perCercare = (cosa) => String(cosa).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      function daQuellaVersione(markdown, versione) {
        const quale = String(versione || "").trim();
        if (!quale) return markdown;
        const ilTitoloGiusto = new RegExp(`(^|[^0-9.])${perCercare(quale)}([^0-9.]|$)`);
        const righe = String(markdown).replace(/\r\n/g, "\n").split("\n");
        for (let quante = 0; quante < righe.length; quante += 1) {
          if (/^#{1,6}\s/.test(righe[quante]) && ilTitoloGiusto.test(righe[quante])) {
            return righe
              .slice(quante + 1)
              .join("\n")
              .trim();
          }
        }
        return markdown;
      }

      /* Il markdown, disegnato. Dentro non ci finisce un solo carattere di
       * fuori che non sia passato da `testo()`. */
      function ilMarkdown(markdown) {
        let fuori = "";
        let elenco = false;
        const chiudiLElenco = () => {
          if (elenco) fuori += "</ul>";
          elenco = false;
        };
        for (const pezzo of iPezziDi(testo(markdown))) {
          if (pezzo.che !== "punto") chiudiLElenco();
          if (pezzo.che === "titolo") {
            /* `h3` e non `h1`: qui dentro si sta sotto il titolo di una casa,
             * e chi legge con lo schermo sente i livelli. */
            const quale = pezzo.livello === 1 ? "h3" : pezzo.livello === 2 ? "h4" : "h5";
            fuori += `<${quale}>${iSegniDi(pezzo.testo)}</${quale}>`;
          } else if (pezzo.che === "paragrafo") {
            fuori += `<p>${iSegniDi(pezzo.testo)}</p>`;
          } else if (pezzo.che === "punto") {
            if (!elenco) {
              fuori += "<ul>";
              elenco = true;
            }
            fuori += `<li${I_RIENTRI[Math.min(3, pezzo.rientro)]}>${iSegniDi(pezzo.testo)}</li>`;
          } else if (pezzo.che === "riga") {
            fuori += "<hr />";
          } else if (pezzo.che === "blocco") {
            fuori += `<pre><code>${/* già HTML */ pezzo.testo}</code></pre>`;
          }
        }
        chiudiLElenco();
        return fuori;
      }

      /* Come va un controllo: verde, rosso, e il terzo.
       *
       * Il terzo e' quello che si scordava. `va` puo' essere `true`, `false` o
       * `null`, e `null` vuol dire che quel pezzo di rapporto la casa non lo
       * manda — una senza System Monitor non manda la macchina. Per un pezzo
       * la pagina lo disegnava come le righe rotte, cioe' faceva vedere un
       * guaio dove c'era solo silenzio. Adesso il silenzio ha un colore suo,
       * spento, e si legge per quello che e'. */
      const comeVa = (uno) => (uno.va === true ? "bene" : uno.va === false ? "male" : "ignoto");

      const IL_BOLLINO = { bene: "✓", male: "✗", ignoto: "◇" };

      /* Quello che sente chi legge lo schermo con le orecchie: il bollino e'
       * un disegno, e da solo non dice niente. */
      const A_PAROLE = { bene: "in ordine", male: "anomalia", ignoto: "non rilevato" };

      /* Di chi sono le icone degli aggiornamenti che si disegnano: di chi
       * segue la casa aperta nel foglio. */
      const diChiSonoLeIcone = () => foglioAperto?.chi;

      /* Il segno di un aggiornamento: il logo di chi lo porta, o l'iniziale.
       *
       * Tre casi, in ordine. La roba nostra porta il bollo del quadro, che e'
       * disegnato qui e non si scarica da nessuna parte. Chi ha un marchio lo
       * fa vedere — e sotto c'e' comunque l'iniziale, cosi' una casa senza
       * internet o un marchio che non esiste finiscono sulla lettera invece
       * che su un quadratino rotto. Chi non ce l'ha resta sull'iniziale, che
       * e' quello che fa gia' l'app.
       *
       * Se l'immagine non arriva si toglie, e scopre la lettera che sta sotto. */
      function ilSegnoDi(uno) {
        if (uno.nostra)
          return '<span class="bollo" aria-hidden="true"><i></i><i class="mezzo"></i><i></i></span>';
        const primo = testo(
          String(uno.nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase() || "?",
        );
        /* **L'icona vera, e arriva dalla casa.**
         *
         * Prima si mandava questo browser su `brands.home-assistant.io` con una
         * parola presa dal rapporto, e c'erano due guai in uno: questo browser
         * andava a farsi vedere da una macchina che non e' la sua, e quello che
         * trovava era sbagliato — il logo di HACS al posto di quello
         * dell'applicazione (per un'integrazione installata da HACS quella
         * parola **e'** `hacs`), e niente del tutto per un firmware, che una
         * parola non ce l'ha.
         *
         * L'icona giusta ce l'ha la casa: gliela da' il suo Supervisor per gli
         * add-on e i marchi per le integrazioni, che e' esattamente quello che
         * il ponte fa gia' per l'app sul telefono. La manda una volta sola, e
         * il quadro la serve dal suo indirizzo.
         *
         * Il segno e' sedici cifre esadecimali, ricontrollate qui: finisce
         * dentro un indirizzo, e chi lo compone e' questa riga. Un controllo
         * solo, dall'altra parte di una rete, non e' un controllo. */
        if (!/^[0-9a-f]{16}$/.test(String(uno.segno || "")))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* La lettera resta sotto: finche' l'icona non e' arrivata — il primo
         * giro dopo che un aggiornamento compare — la riga si legge lo stesso,
         * e se non arrivera' mai si legge per sempre. */
        /* `../segno/`, con il punto punto.
         *
         * Questa pagina sta in `/console/`, e un indirizzo scritto `segno/…`
         * si legge da li': `/console/segno/…`, dove non c'e' niente. L'icona
         * si serve da `/segno/…`, che sta una cartella piu' su — senza chiave,
         * perche' un'icona di Mosquitto non e' roba di nessuno.
         *
         * Scritto `/segno/…` con la barra davanti funzionerebbe qui e si
         * romperebbe dietro un proxy che monta il quadro sotto un prefisso.
         * Con il punto punto si conta dalla pagina, e vale in tutt'e due i
         * casi. */
        /* Con davanti l'installatore: le icone stanno nella sua cartella
         * (`src/segni.js`), e l'indirizzo lo dice. */
        const diChi = String(diChiSonoLeIcone() || "");
        if (!/^inst_[0-9a-f]{16}$/.test(diChi))
          return `<span class="segno">${/* già HTML */ primo}</span>`;
        /* Un'icona che non arriva si toglie, e sotto resta la lettera: lo fa
         * l'ascolto in cima allo script, e non un `onerror` scritto
         * dentro il tag — la politica della pagina lascia girare solo gli
         * script che sono nel file. */
        return `<span class="segno">${/* già HTML */ primo}<img
          src="../segno/${testo(diChi)}/${testo(uno.segno)}"
          alt=""
          loading="lazy"
          data-se-non-arriva="via"
        /></span>`;
      }

      /* Cosa cambia, con le parole di chi l'ha scritto.
       *
       * E' il `release_summary` dell'entita', che Home Assistant taglia gia'
       * corto. Va disegnato **come testo**: arriva da fuori, e qui dentro non
       * ci si fida di niente che arrivi da fuori. Le note lunghe stanno a un
       * indirizzo, e per leggerle serve il filo con la casa — che il quadro
       * non ha — quindi li' si manda il browser.
       *
       * Niente di tutto questo e' obbligatorio: chi non dice niente non
       * occupa una riga vuota. */
      function cosaCambia(uno) {
        const detto = testo(String(uno.cosaCambia || "").trim());
        /* Le note intere si aprono **qui**, non fuori.
         *
         * Prima era un collegamento che portava sul sito di chi ha scritto
         * l'aggiornamento: leggere cosa cambia prima di premere «Installa»
         * voleva dire uscire dal cruscotto, e chi esce non sempre torna. Adesso
         * le note le manda la casa insieme all'icona, e si aprono sotto la
         * riga.
         *
         * Il tasto c'e' solo se ci sono davvero: il quadro le ha ricevute e le
         * tiene. Se non ci sono, resta il riassunto — e se non c'e' nemmeno
         * quello, la riga non si allunga per niente. */
        const suo = String(uno.segno || "");
        const note = /^[0-9a-f]{16}$/.test(suo) && CON_LE_NOTE.has(suo);
        const dentro = note
          ? ` <button type="button" class="comeUnLink" data-note="${testo(suo)}">cosa cambia, per intero</button>`
          : "";
        if (!detto && !dentro) return "";
        return `<p class="cambia">${/* già HTML */ detto}${/* già HTML */ dentro}</p><div class="leNote" data-note-di="${testo(suo)}" data-note-a="${testo(String(uno.a || ""))}" hidden></div>`;
      }

      /* Una riga di aggiornamento: il segno, cosa e', cosa si fa, cosa cambia.
       *
       * Una sola, e la usano tutt'e due le schermate — la scheda di una casa e
       * la flotta. Prima erano due disegni diversi per la stessa cosa: righe
       * di qua, pastigline di la', e nella flotta non si vedeva ne' il logo ne'
       * cosa cambiava. Due disegni per una cosa sola vuol dire che uno dei due
       * resta indietro, ed era sempre lo stesso.
       *
       * `fare` e' quello che si puo' fare su questa riga: lo passa chi disegna,
       * perche' dipende dalla casa — la manutenzione aperta, un lavoro in
       * ballo — e non dall'aggiornamento. */
      function unaRiga(uno, { fare = "" } = {}) {
        return `
          <li>
            ${ilSegnoDi(uno)}
            <span class="che">
              <b>${testo(uno.nome)}</b>
              <span class="salto">${testo(uno.da)} → ${testo(uno.a)}</span>
            </span>
            <span class="fare">${/* già HTML */ fare}</span>
            ${cosaCambia(uno)}
          </li>`;
      }

      const spia = (stato) =>
        `<span class="pastiglia ${testo(stato.chiave)}"><span aria-hidden="true">${testo(stato.segno)}</span>${testo(stato.parola)}</span>`;

      /* La striscia: `P` giorno pieno, `M` a metà, `V` offline, spazio «non c'era
       * ancora». */
      function laStriscia(giorni, grande = false) {
        const celle = [...giorni]
          .map((uno) => {
            if (uno === "V") return '<i class="vuota" title="offline tutto il giorno"></i>';
            if (uno === "M") return '<i class="mezza" title="offline per qualche ora"></i>';
            if (uno === " ") return '<i class="prima" title="non ancora abbinato"></i>';
            return '<i title="tutti i rapporti ricevuti"></i>';
          })
          .join("");
        const vuoti = [...giorni].filter((uno) => uno === "V" || uno === "M").length;
        const accesi = [...giorni].filter((uno) => uno !== " ").length;
        const dice =
          accesi < giorni.length
            ? `${plurale(accesi, "giorno", "giorni")} dall'abbinamento`
            : vuoti === 0
              ? "14 giorni, sempre online"
              : `14 giorni · offline ${plurale(vuoti, "volta", "volte")}`;
        return `<div class="giorni${grande ? " grande" : ""}" role="img" aria-label="${testo(dice)}">${/* già HTML */ celle}</div><div class="giorniDice">${testo(dice)}</div>`;
      }

      const TINTA_DI = {
        offline: "rosso",
        guardare: "ambra",
        posto: "verde",
        male: "rosso",
        attenta: "ambra",
        bene: "verde",
      };

      /* Un anellino: un valore in centesimi, colorato come va. */
      function anellino(valore, come, animato = false) {
        const r = 27;
        const C = 2 * Math.PI * r;
        const quanto = (Math.max(0, Math.min(100, Number(valore) || 0)) / 100) * C;
        const fine = `${quanto.toFixed(2)} ${(C - quanto).toFixed(2)}`;
        return `<svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="${Number(r)}" class="traccia" />
          <circle cx="32" cy="32" r="${Number(r)}" class="arco" stroke="var(--${TINTA_DI[come] || "verde"})"
            stroke-dasharray="${animato ? `0 ${C.toFixed(2)}` : /* già HTML */ fine}"${animato ? ` data-fine="${/* già HTML */ fine}"` : ""} /></svg>`;
      }

      /* Gli archi disegnati a zero si aprono al frame dopo: cosi' la
       * transizione li vede cambiare, e li accompagna. */
      function apriGliArchi(radice) {
        if (!radice) return;
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            radice.querySelectorAll("circle.arco[data-fine]").forEach((cerchio) => {
              cerchio.setAttribute("stroke-dasharray", cerchio.dataset.fine);
            });
          }),
        );
      }

      /* Un metro e' un anellino: il valore dentro, il nome sotto. `quanto` e'
       * la parte di cerchio da riempire, in centesimi della scala, e `come` lo
       * colora. Si apre con la sua animazione solo quando il foglio sale:
       * ai giri dopo si disegna gia' pieno. */
      function unMetro({ che, valore, unita = "%", sotto = "", come, quanto }) {
        const animato = Boolean(foglioAperto?.appena);
        /* Quello che questa casa non dice non si disegna a zero: una CPU che
         * non c'e' non e' una CPU allo zero per cento. */
        if (valore === null || valore === undefined)
          return `
            <div class="anellino">
              <div class="cerchio">${anellino(0, "bene", false)}<b class="attenta">—</b></div>
              <span>${testo(che)}</span>
              <small class="nonLoDice">non comunicato</small>
            </div>`;
        return `
          <div class="anellino">
            <div class="cerchio">
              ${anellino(quanto, come, animato)}<b class="${come === "bene" ? "" : testo(come)}">${testo(valore)}${testo(unita)}</b>
            </div>
            <span>${testo(che)}</span>
            ${sotto ? `<small>${testo(sotto)}</small>` : ""}
          </div>`;
      }

      /* Un riquadro che dice che non si sa, invece di uno che disegna zeri. */
      function riquadroMuto(titolo, perché) {
        return `
          <section class="riquadro">
            <div class="capoRiquadro"><h3>${testo(titolo)}</h3></div>
            <p class="nota">${testo(perché)}</p>
          </section>`;
      }

      /* La macchina: quello che il Supervisor sa del ferro sotto Home
       * Assistant, più la temperatura che la plancia disegna già.
       *
       * `discoVita` è la riga che su queste schede conta davvero e che nessuno
       * guarda: una eMMC o una microSD hanno un numero di scritture e poi
       * finiscono. Quando c'è, ha la sua barra; su una macchina che non la
       * dichiara — un NUC con un SSD — non si inventa. */
      function laMacchina(c) {
        const m = c.macchina;
        /* Un rapporto senza macchina non e' una casa senza macchina: e' una
         * casa il cui Supervisor non ha risposto. Si dice, e non si disegnano
         * cinque metri a zero. */
        if (!m)
          return riquadroMuto("La macchina", "Il Supervisor di questo impianto non ha risposto.");
        const metri = [
          unMetro({
            che: "CPU",
            valore: m.cpu,
            quanto: m.cpu,
            come: livello(m.cpu, 70, 90),
          }),
          unMetro({
            che: "Memoria",
            valore: m.ram,
            quanto: m.ram,
            come: livello(m.ram, 75, 90),
          }),
          unMetro({
            che: "Disco",
            valore: m.disco,
            quanto: m.disco,
            sotto: cE(m.discoLiberi) ? `${m.discoLiberi} GB liberi` : "",
            come: livello(m.disco, 75, SOGLIE.discoPieno),
          }),
          unMetro({
            che: "Temperatura",
            valore: m.temperatura,
            unita: "°",
            quanto: m.temperatura,
            sotto: `soglia a ${SOGLIE.troppoCaldo}°`,
            come: livello(m.temperatura, SOGLIE.troppoCaldo - 10, SOGLIE.troppoCaldo),
          }),
        ];
        if (m.discoVita !== null)
          metri.push(
            unMetro({
              che: "Vita del disco",
              valore: m.discoVita,
              quanto: m.discoVita,
              sotto: "già consumata",
              come: livello(m.discoVita, DISCO_STANCO, SOGLIE.discoFinito),
            }),
          );

        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La macchina</h3>
              <span class="conta">${testo(m.scheda)}</span>
            </div>
            <div class="tre-anelli">${metri.join("")}</div>
            <p class="verdetto">
              ${[
                cE(c.sistema) ? testo(c.sistema) : "",
                cE(m.accesaDa) ? `accesa da ${plurale(m.accesaDa, "giorno", "giorni")}` : "",
              ]
                .filter(Boolean)
                .join(" · ")}${cE(c.sistema) || cE(m.accesaDa) ? "." : ""}
              ${
                m.discoVita !== null && m.discoVita >= DISCO_STANCO
                  ? `Il disco è consumato al ${testo(m.discoVita)}%: su queste schede è il primo componente a guastarsi, meglio sostituirlo per tempo.`
                  : m.temperatura >= SOGLIE.troppoCaldo
                    ? `Sopra i ${Number(SOGLIE.troppoCaldo)}° la scheda riduce la velocità da sola: l'impianto non si guasta, ma rallenta.`
                    : "Nessun valore fuori soglia."
              }
            </p>
          </section>`;
      }

      /* Il cartello in cima agli aggiornamenti: cosa sta succedendo in questa
       * casa, o com'è finita l'ultima volta.
       *
       * I nomi degli stati sono quelli che manda il ponte — `in corso`,
       * `fatto`, `non riuscito` — e non una traduzione fatta qui: due
       * vocabolari per la stessa cosa vogliono dire un cartello che smette di
       * comparire il giorno che uno dei due cambia, in silenzio. */
      function ilCartello(c, chiesto = null) {
        /* Prima di tutto quello che si è appena chiesto e che la casa non è
         * ancora passata a prendersi: sono i secondi in cui chi ha premuto il
         * tasto si chiede se ha funzionato. */
        if (chiesto)
          return `
            <div class="cartello">
              <span class="gettone" aria-hidden="true">◴</span>
              <span>
                <b>${
                  chiesto.cosa === "riavvia"
                    ? "Il riavvio di Home Assistant"
                    : chiesto.cosa === "configura"
                      ? `La configurazione della plancia «${testo(chiesto.nome)}»`
                      : `${testo(chiesto.nome)} ${testo(chiesto.da)} → ${testo(chiesto.a)}`
                }</b>
                è stato richiesto ${testo(daQuanto(chiesto.chiesto))}. Parte al prossimo rapporto di questo impianto: è l'impianto a ritirare il comando, il cruscotto non lo contatta.
              </span>
            </div>`;
        const l = c.lavoro;
        /* Non `=== null`: una casa ferma a un ponte di ieri questa riga non la
         * manda affatto, e `undefined` non è `null`. */
        if (!l) return "";
        if (l.stato === "fatto")
          return `
            <div class="cartello bene">
              <span class="gettone" aria-hidden="true">✓</span>
              <span><b>${testo(l.cosa)}</b> ${l.riavvio ? "fatto" : l.configurazione ? "applicata" : "installato"} ${testo(daQuanto(l.quando))}, dal cruscotto.${
                l.configurazione && l.perche ? ` ${testo(l.perche)}.` : ""
              }</span>
            </div>`;
        if (l.stato === "non riuscito")
          return `
            <div class="cartello male">
              <span class="gettone" aria-hidden="true">✕</span>
              <span
                ><b>${testo(l.cosa)}</b> non è riuscito ${testo(daQuanto(l.quando))}:
                ${testo(l.perche || "l'impianto ha rifiutato")}.</span
              >
            </div>`;
        const fermi = Math.round((ADESSO() - new Date(c.quando).getTime()) / 60000);
        const tardi = l.stacca && fermi > 45;
        return `
          <div class="cartello ${tardi ? "male" : ""}">
            <span class="gettone" aria-hidden="true">${tardi ? "!" : "◴"}</span>
            <span>
              <b>${testo(l.cosa)}</b> è partito ${testo(daQuanto(l.quando))}${
                tardi
                  ? ` e questo impianto non ha più risposto. Un riavvio dura pochi minuti: serve un intervento sul posto.`
                  : l.stacca
                    ? `. L'impianto si riavvia: per qualche minuto non risponde, ed è normale.`
                    : `. L'esito arriva col prossimo rapporto.`
              }
            </span>
          </div>`;
      }

      /* La rete: le schede che il Supervisor dichiara, più gli apparati di
       * casa che la plancia già sorveglia.
       *
       * I due pezzi non sono la stessa cosa e non vanno confusi. Le schede
       * sono quelle **della macchina** e le sa il Supervisor senza che
       * nessuno configuri niente. Gli apparati — il router, i ripetitori —
       * sono i `binary_sensor` con `device_class: connectivity` che la
       * sezione «Macchine e rete» della plancia adotta per integrazione: ci
       * sono se chi ci abita li ha spuntati, e dove non sono spuntati qui
       * si dice zero invece di fingere. */
      function laRete(c) {
        const r = c.rete;
        if (!r)
          return riquadroMuto("La rete", "Questo impianto non ha comunicato lo stato della rete.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>La rete</h3>
              <span class="pastiglia ${r.internet ? "bene" : "male"}">
                ${r.internet ? "internet raggiungibile" : "senza internet"}
              </span>
            </div>
            <ul class="schede">
              ${r.schede
                .map(
                  (una) => `
                <li class="${una.su ? "su" : "giu"}">
                  <span class="lucina" aria-hidden="true"></span>
                  <span class="come">${testo(una.nome)}</span>
                  <span class="tipo pastiglia">${testo(una.tipo === "wifi" ? "Wi-Fi" : "cavo")}</span>
                  ${una.principale ? '<span class="pastiglia bene">principale</span>' : ""}
                  ${
                    una.tipo === "wifi" && una.su && una.segnale !== null
                      ? `<span class="pastiglia ${una.segnale < SEGNALE_DEBOLE ? "attenta" : ""}">segnale ${testo(una.segnale)}%</span>`
                      : ""
                  }
                  <span class="dove">${una.su ? testo(una.ip || "senza indirizzo") : "non attiva"}</span>
                </li>`,
                )
                .join("")}
            </ul>
            <p class="verdetto">
              ${
                r.sorvegliate.quante === 0
                  ? "Nessun apparato di rete monitorato in questo impianto: nella plancia, sezione «Macchine e rete», si seleziona l'integrazione del router e i ripetitori compaiono da soli."
                  : r.sorvegliate.giu === 0
                    ? `${plurale(r.sorvegliate.quante, "apparato monitorato", "apparati monitorati")}, tutti raggiungibili.`
                    : `${testo(r.sorvegliate.giu)} ${r.sorvegliate.giu === 1 ? "apparato" : "apparati"} su ${testo(r.sorvegliate.quante)} non rispondono.`
              }
            </p>
          </section>`;
      }

      /* Gli add-on, e la sola domanda che conta: ce n'è qualcuno che dovrebbe
       * girare e non gira? */
      function gliAddon(c) {
        const a = c.addon;
        if (!a)
          return riquadroMuto("Gli add-on", "Questo impianto non ha comunicato i suoi add-on.");
        return `
          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli add-on</h3>
              <span class="conta">${testo(a.accesi)}/${testo(a.quanti)} accesi</span>
            </div>
            <div class="addon">
              ${a.elenco
                .map((uno) => {
                  const come = uno.su ? "" : uno.allAvvio ? "fermo" : "apposta";
                  return `<span class="uno ${testo(come)}"
                    ><span class="puntino" aria-hidden="true"></span>${testo(uno.nome)}${
                      uno.su ? "" : uno.allAvvio ? " · fermo" : " · spento manualmente"
                    }</span>`;
                })
                .join("")}
            </div>
            <p class="verdetto">
              ${
                a.spentiCheDovrebbero === 0
                  ? "Nessun add-on con avvio automatico è fermo. Quelli spenti manualmente restano spenti: li ha spenti qualcuno."
                  : `${plurale(a.spentiCheDovrebbero, "add-on parte", "add-on partono")} all'avvio e in questo momento ${a.spentiCheDovrebbero === 1 ? "è fermo" : "sono fermi"}. Un add-on con avvio automatico non si spegne da solo: si è arrestato.`
              }
            </p>
          </section>`;
      }
      /* ─── Quello che e' solo della gestione ─────────────────────────── */

      class ChiaveNoNo extends Error {}

      async function chiedi(via, opzioni = {}) {
        /* In relativo: da `/gestore/` porta dove deve, e funziona anche dietro
         * un proxy che monta il quadro sotto un prefisso. */
        const risposta = await fetch(via.replace(/^\//, ""), {
          ...opzioni,
          headers: {
            authorization: `Bearer ${chiave}`,
            "content-type": "application/json",
            ...(opzioni.headers || {}),
          },
        });
        if (risposta.status === 401) throw new ChiaveNoNo();
        const corpo = await risposta.json().catch(() => ({}));
        if (!risposta.ok) throw new Error(corpo.errore || "non ha funzionato");
        return corpo;
      }

      function prendi(detto) {
        INSTALLATORI = detto.installatori || [];
        CASE = detto.case || 0;
        ORFANE = detto.orfane || 0;
      }

      /* Le case di ognuno, tutte insieme. Una che non arriva non fa cadere
       * le altre: si tiene quello che si aveva, e si riprova al giro dopo. */
      async function caricaLeCase() {
        const coppie = await Promise.all(
          INSTALLATORI.map(async (uno) => {
            try {
              return [uno.chi, await chiedi(`/installatore/${encodeURIComponent(uno.chi)}/case`)];
            } catch (_male) {
              return [uno.chi, LE_CASE_DI.get(uno.chi) || null];
            }
          }),
        );
        LE_CASE_DI = new Map(coppie);
        CON_LE_NOTE = new Set(coppie.flatMap(([, dette]) => dette?.note || []));
        for (const [, dette] of coppie) if (dette?.soglie) SOGLIE = dette.soglie;
      }

      async function carica() {
        prendi(await chiedi("/installatori"));
        await caricaLeCase();
        /* Le licenze: se non arrivano si tiene quello che c'era. */
        try {
          LICENZE = await chiedi("/licenze");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
        }
        /* Gli abbonamenti: lo stesso, si tiene quello che c'era. */
        try {
          ABBONAMENTI = await chiedi("/abbonamenti");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
        }
        /* I numeri non sono essenziali: se non arrivano, la pagina va avanti
         * e lo dice nel suo riquadro. Una chiave rifiutata invece si dice. */
        try {
          SALUTE = await chiedi("/salute");
        } catch (male) {
          if (male instanceof ChiaveNoNo) throw male;
          SALUTE = null;
        }
      }

      /* Da quanto e' acceso, in parole: i secondi del tramite. */
      function daQuantoAcceso(secondi) {
        const s = Number(secondi);
        if (!Number.isFinite(s) || s < 0) return "";
        if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min`;
        if (s < 86400) return `${Math.round(s / 3600)} ore`;
        const giorni = Math.round(s / 86400);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
      }

      /* Il riquadro «Il servizio», nella Panoramica: le macchine di gdahome,
       * una riga per una.
       *
       * Tre righe — il quadro, il tramite (l'accesso da fuori casa) e
       * l'assistenza — e a destra di ognuna la pastiglia che dice come sta. Una
       * macchina che non risponde lo dice nella sua pastiglia, non in fondo a
       * una riga di testo: e' la cosa per cui il riquadro esiste. «Non mi
       * aggiorno» arrivava da /salute e non lo leggeva nessuno: adesso e' la
       * pastiglia del quadro, e sotto c'e' scritto da quanto e perche'.
       *
       * Sotto, chiusi, i numeri di ognuna.
       *
       * ── Le mattonelle del tramite, e cosa contano ──────────────────────
       *
       * «Le 140 case collegate cosa significa, che sono sul tramite o in
       * generale stanno usando gdahome?»
       *
       * Significava la prima, e la parola faceva credere la seconda. Le altre
       * due erano peggio: «collegamenti aperti» era la somma dei fili —
       * abbinamenti in corso compresi — e non voleva dire niente per nessuno,
       * e «app aperte» contava chiunque fosse abbinato, l'app sul telefono e
       * una scheda di browser nello stesso numero.
       *
       * Adesso ogni mattonella risponde a una domanda sola:
       *
       *   impianti con gdahome    quanti hanno installato l'add-on (un totale:
       *                           resta anche quando la casa e' spenta)
       *   collegati adesso        quanti di quelli hanno il filo aperto in
       *                           questo istante — installato e funzionante
       *   la guardano dall'app    quante app aperte adesso
       *   la guardano dal browser quante pagine aperte adesso
       *
       * I primi due sono impianti, gli altri due schermi, e un impianto solo
       * puo' avere tre schermi aperti o nessuno.
       *
       * Le prime due non le sa dire un tramite non ancora aggiornato: arrivano
       * `null`, e allora la mattonella non si disegna. Uno zero direbbe che
       * nessuno ha installato gdahome.
       *
       * Questo riquadro si prova da solo, fuori dalla pagina: per questo usa
       * soltanto `SALUTE`, `testo`, `LE_ICONE`, `daQuantoAcceso` e
       * `oreInParole`, e il plurale se lo fa da se'. */
      function ilServizio() {
        if (!SALUTE) return "";

        const mattonella = (tinta, disegno, valore, nome) =>
          `<div class="servizio-conto ${testo(tinta)}">
             <span class="servizio-conto-ic" aria-hidden="true">${LE_ICONE[disegno]}</span>
             <b>${testo(valore)}</b><span>${testo(nome)}</span>
           </div>`;

        /* La parola la porta chi chiama: «segnalazioni attive» e «posta
         * attiva» non si ricavano l'una dall'altra, e una spia con la parola
         * sbagliata e' peggio di una spia sola. */
        const interruttore = (nome, acceso, si, no) =>
          `<span class="interruttore" data-acceso="${acceso ? "sì" : "no"}"><i></i>${testo(nome)} <b>${testo(acceso ? si : no)}</b></span>`;

        const riga = (pallino, chi, sotto, stato, parola, guaio = "") =>
          `<li>
             <span class="pallino ${testo(pallino)}" aria-hidden="true"></span>
             <span class="riga-testo">
               <b>${testo(chi)}</b><span>${testo(sotto)}</span>${guaio ? `<span class="dice-male">${testo(guaio)}</span>` : ""}
             </span>
             <span class="pastiglia ${testo(stato)}">${testo(parola)}</span>
           </li>`;

        const fermo = SALUTE.nonMiAggiorno;
        const delQuadro = riga(
          fermo ? "ambra" : "verde",
          "Quadro",
          `Installatori, licenze e abbonamenti${SALUTE.versione ? ` · versione ${SALUTE.versione}` : ""}`,
          fermo ? "guardare" : "posto",
          fermo ? "non si aggiorna" : "in ordine",
          fermo
            ? `Fermo da ${oreInParole(fermo.ore)} — ${fermo.perche || "non si sa perché"}.`
            : "",
        );

        const t = SALUTE.tramite;
        const acceso =
          t && t.vivo && t.accesoDa !== null && t.accesoDa !== undefined
            ? daQuantoAcceso(t.accesoDa)
            : "";
        const delTramite = t
          ? riga(
              t.vivo ? "verde" : "rosso",
              "Tramite",
              `L'accesso da fuori casa${acceso ? ` · acceso da ${acceso}` : ""}`,
              t.vivo ? "posto" : "offline",
              t.vivo ? "acceso" : "non risponde",
            )
          : riga("", "Tramite", "L'accesso da fuori casa", "quieta", "non risponde di qui");

        /* L'assistenza sono tre interruttori del tramite: tutti e tre accesi
         * e' «attiva», nessuno e' «spenta», e in mezzo si dice. */
        const accese = t ? [t.segnalazioni, t.console, t.posta].filter(Boolean).length : 0;
        const chat = t ? Number(t.chat) || 0 : 0;
        const dellAssistenza = t
          ? riga(
              accese === 3 ? "verde" : accese ? "ambra" : "",
              "Assistenza",
              `Segnalazioni, chat e posta · ${chat === 1 ? "una conversazione" : `${chat} conversazioni`}`,
              accese === 3 ? "posto" : accese ? "guardare" : "quieta",
              accese === 3 ? "attiva" : accese ? "in parte" : "spenta",
            )
          : "";

        const iNumeriDelQuadro = `
          <div class="servizio-blocco">
            <p class="servizio-titolo">Il quadro</p>
            <div class="servizio-conti">
              ${/* già HTML */ mattonella("blu", "casa", Number(SALUTE.case) || 0, "case seguite")}
              ${/* già HTML */ mattonella("verde", "installatori", Number(SALUTE.installatori) || 0, "installatori")}
            </div>
          </div>`;

        const iNumeriDelTramite = !t
          ? `<div class="servizio-blocco">
               <p class="minuta" style="margin: 0">Il tramite non risponde da questa macchina: se sta su un'altra, i suoi numeri si leggono lì con <code>curl -s http://127.0.0.1:8099/salute</code>.</p>
             </div>`
          : `<div class="servizio-blocco">
               <p class="servizio-titolo">Il tramite</p>
               <div class="servizio-conti">
                 ${
                   /* già HTML */ t.installate === null
                     ? ""
                     : mattonella("blu", "casa", t.installate, "impianti con gdahome")
                 }
                 ${/* già HTML */ mattonella("verde", "filo", Number(t.case) || 0, "collegati adesso")}
                 ${/* già HTML */ mattonella("verde", "telefono", Number(t.app) || 0, "la guardano dall'app")}
                 ${
                   /* già HTML */ t.web === null
                     ? ""
                     : mattonella("verde", "browser", t.web, "la guardano dal browser")
                 }
                 ${/* già HTML */ mattonella("ambra", "chat", Number(t.chat) || 0, "conversazioni di assistenza")}
               </div>
               <div class="interruttori">
                 ${/* già HTML */ interruttore("segnalazioni", t.segnalazioni, "attive", "non attive")}
                 ${/* già HTML */ interruttore("console dell'assistenza", t.console, "attiva", "non attiva")}
                 ${/* già HTML */ interruttore("posta", t.posta, "attiva", "non attiva")}
               </div>
             </div>`;

        return `
          <section class="scheda">
            <h3><span class="tondino verde">${LE_ICONE["quadro"]}</span>Il servizio</h3>
            <p class="sotto">I server di gdahome: se uno si ferma, si vede qui per primo.</p>
            <ul class="elenco">
              ${/* già HTML */ delQuadro}
              ${/* già HTML */ delTramite}
              ${/* già HTML */ dellAssistenza}
            </ul>
            <details class="apri-riga">
              <summary>I numeri del servizio<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
              ${/* già HTML */ iNumeriDelQuadro}
              ${/* già HTML */ iNumeriDelTramite}
            </details>
          </section>`;
      }

      /* Le ore ferme dell'aggiornamento, in parole: oltre le quarantotto si
       * contano in giorni, che e' come le conta chi legge. */
      function oreInParole(ore) {
        const n = Number(ore);
        if (!Number.isFinite(n) || n < 1) return "poco";
        if (n < 48) return `${Math.round(n)} ${Math.round(n) === 1 ? "ora" : "ore"}`;
        const giorni = Math.round(n / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
      }

      /* Da quanto un installatore non apre il suo cruscotto, in parole. */
      function daQuantoEntra(vistoIl) {
        if (!vistoIl) return "mai";
        const ore = (ADESSO() - vistoIl) / 3600000;
        if (ore < 24) return "oggi";
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      /* Lo stato di un installatore: una parola e un colore, mai il colore
       * da solo. Sospeso batte tutto: di uno che non entra piu' non conta se
       * sia al limite o da quanto non si fa vedere. «Vicino al limite» e' da
       * nove case su dieci in su: abbastanza presto per alzargli il limite
       * prima che un cliente resti fuori. */
      function loStato(uno) {
        if (uno.congelato) return { come: "congelato", parola: "sospeso" };
        if (uno.pieno) return { come: "limite", parola: "al limite" };
        if (uno.soglia > 0 && (Number(uno.case) || 0) >= uno.soglia * 0.9)
          return { come: "limite", parola: "vicino al limite" };
        if (!uno.vistoIl) return { come: "quieta", parola: "nessun accesso" };
        if ((ADESSO() - uno.vistoIl) / 86400000 > 30) return { come: "quieta", parola: "inattivo" };
        return { come: "posto", parola: "in ordine" };
      }

      /* Le icone, disegnate qui: niente da scaricare. Tutte sullo stesso
       * quadretto di venti, col tratto di uno e otto. */
      const LE_ICONE = {

        regalo:

        quadro:

        stella:
