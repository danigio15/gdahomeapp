<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestione installatori</title>
    <!--
      LA GESTIONE DEGLI INSTALLATORI: la pagina di chi tiene il quadro.

      Non è la console degli installatori — quella sta in `../console/` e mostra
      le case. Qui non si vede nessuna casa: si aggiungono gli installatori, si mettono i
      tetti, e si contano gli impianti di ognuno.

      QUANTE, NON QUALI.

      È la regola di questa pagina, e non è una limitazione tecnica: sarebbe
      facilissimo mostrare l'elenco. Un elenco dei clienti di un'altra azienda è
      un'altra cosa, e più pesante, che contare licenze — e chi tiene il quadro
      non ne ha bisogno per fare il suo mestiere. C'è una prova che controlla
      che in questa risposta non finiscano nomi di case.

      GLI STATI PORTANO UNA FORMA, UNA PAROLA E UN COLORE.

      Misurato: l'ambra `#b45309` e il rosso `#be123c` di questo progetto stanno
      a ΔE 5.7 per chi non distingue il rosso, e a 11.5 anche a vista piena —
      sotto la soglia oltre cui due colori si dicono diversi. Quindi il colore
      non basta mai da solo, e ogni stato porta anche ● ▲ ■ e una parola.

      LA CHIAVE SI VEDE UNA VOLTA SOLA.

      Quando aggiungi un installatore, la chiave esce in chiaro adesso e mai più: qui
      resta solo la sua impronta. Per questo il momento in cui compare è la cosa
      più grossa della pagina, e ci sta scritto sopra che non tornerà.
    -->
    <style>
      /* I colori sono quelli di `sito/stile.css` e della console degli
       * installatori: questa pagina e quella sono lo stesso prodotto, viste da
       * due parti diverse. */
      :root {
        --notte: #0f172a;
        --lieve: #64748b;
        --fioco: #94a3b8;

        --fondo: #f0f4f8;
        --carta: #ffffff;
        --carta-alta: #f8fafc;
        --bordo: #e2e8f0;
        --bordo-tenue: #eef2f7;

        --azzurro: #0ea5e9;
        --azzurro-scuro: #0284c7;
        --bene: #15803d;
        --ambra: #b45309;
        --male: #be123c;

        --alone-azzurro: #e0f2fe;
        --alone-bene: #dcfce7;
        --alone-ambra: #fef3c7;
        --alone-male: #ffe4e6;

        --raggio: 20px;
        --raggio-piccolo: 14px;
        --ombra: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -12px rgba(15, 23, 42, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="chiaro"]) {
          --notte: #e8eef6;
          --lieve: #93a3b8;
          --fioco: #64748b;
          --fondo: #0b1220;
          --carta: #131c2b;
          --carta-alta: #182233;
          --bordo: #24314a;
          --bordo-tenue: #1c2537;
          --alone-azzurro: #0c2f44;
          --alone-bene: #0d2e1c;
          --alone-ambra: #322108;
          --alone-male: #3a1020;
          --bene: #4ade80;
          --ambra: #fbbf24;
          --male: #fb7185;
          --ombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--fondo);
        color: var(--notte);
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 26px 24px 0;
      }

      .testata {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      /* Lo spazio per il tasto del menu di Home Assistant.
         Questa pagina si apre anche **dentro** Home Assistant, in un riquadro
         che ci mette sopra un tasto per riaprire il menu. Quel tasto galleggia:
         sta in un altro documento, non sa cosa ha sotto di se' e non gli fa
         spazio. Finora si e' provato a scansarlo — prima il marchio che ci
         finiva sotto, poi il tasto spostato a destra dove si sedeva sulla nav —
         e scansare non funziona, perche' da una parte o dall'altra sotto c'e'
         sempre qualcosa.
         Quindi non lo si scansa: gli si fa **spazio**. Quaranta punti piu' otto
         di stacco, e solo quando questa pagina sta davvero dentro un riquadro
         — aperta nel browser quel tasto non c'e', e un buco in cima sarebbe
         solo un buco. */
      :root[data-dentro] .testata {
        padding-inline-start: 56px;
      }

      .marchio {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .nomi b {
        display: block;
        font-size: 1.08rem;
        letter-spacing: -0.01em;
      }

      .nomi span {
        display: block;
        font-size: 0.83rem;
        color: var(--lieve);
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 24px 60px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .riquadro {
        background: var(--carta);
        border-radius: var(--raggio);
        box-shadow: var(--ombra);
        padding: 22px 24px;
      }

      .capoRiquadro {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      h3 {
        margin: 0;
        font-size: 0.74rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--lieve);
        font-weight: 700;
      }

      .conta {
        font-size: 0.83rem;
        color: var(--fioco);
        font-variant-numeric: tabular-nums;
      }

      /* ─── Le tessere in cima ────────────────────────────────────────── */

      .tessere {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }

      .tessera {
        background: var(--carta);
        border-radius: var(--raggio-piccolo);
        box-shadow: var(--ombra);
        padding: 15px 18px;
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .tessera .segno {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 0.72rem;
        flex: none;
      }

      .tessera b {
        display: block;
        font-size: 1.5rem;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .tessera span {
        font-size: 0.8rem;
        color: var(--lieve);
      }

      /* ─── L'elenco degli installatori ───────────────────────────────── */

      ul.installatori {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      ul.installatori > li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 16px;
        padding: 15px 0 15px 15px;
        border-top: 1px solid var(--bordo-tenue);
        position: relative;
      }

      ul.installatori > li:first-child {
        border-top: 0;
      }

      /* La barretta colorata a sinistra: è così la plancia, è così l'elenco
       * delle case. Non porta informazione da sola — accanto c'è la pastiglia
       * con la forma e la parola — ma fa scorrere l'occhio. */
      ul.installatori > li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 15px;
        bottom: 15px;
        width: 4px;
        border-radius: 4px;
        background: var(--bordo);
      }

      li.bene::before {
        background: var(--bene);
      }
      li.ambra::before {
        background: var(--ambra);
      }
      li.male::before {
        background: var(--male);
      }

      .chi b {
        display: block;
        font-size: 1rem;
        letter-spacing: -0.01em;
      }

      .chi span {
        display: block;
        font-size: 0.81rem;
        color: var(--lieve);
        margin-top: 2px;
      }

      .senzaNome {
        color: var(--fioco);
        font-style: italic;
      }

      /* Il metro degli impianti sul limite. Sottile e discreto: è un'indicazione, e
       * il numero esatto sta scritto sopra. */
      .quante {
        min-width: 132px;
        text-align: right;
      }

      .quante b {
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
      }

      .quante .metro {
        height: 5px;
        border-radius: 5px;
        background: var(--bordo-tenue);
        margin-top: 7px;
        overflow: hidden;
      }

      .quante .metro i {
        display: block;
        height: 100%;
        border-radius: 5px;
        background: var(--azzurro);
      }

      .quante.pieno .metro i {
        background: var(--ambra);
      }

      /* I tre tasti di un installatore stanno insieme: sul computer in fila, sul
       * telefono in una griglia da tre che non va a capo. Senza, «Chiudi»
       * cadeva da solo su una riga sua per ogni installatore dell'elenco. */
      .tasti {
        display: flex;
        gap: 9px;
      }

      .pastiglia {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 0.79rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .pastiglia.bene {
        background: var(--alone-bene);
        color: var(--bene);
      }
      .pastiglia.ambra {
        background: var(--alone-ambra);
        color: var(--ambra);
      }
      .pastiglia.male {
        background: var(--alone-male);
        color: var(--male);
      }
      .pastiglia.quieta {
        background: var(--carta-alta);
        color: var(--lieve);
      }

      /* ─── Tasti e caselle ───────────────────────────────────────────── */

      .azioni {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type="text"],
      input[type="number"] {
        font: inherit;
        padding: 9px 13px;
        border-radius: var(--raggio-piccolo);
        border: 1px solid var(--bordo);
        background: var(--carta);
        color: var(--notte);
        min-width: 0;
      }

      input[type="text"] {
        flex: 1 1 210px;
      }

      input[type="number"] {
        width: 104px;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--azzurro);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 15px;
        border-radius: var(--raggio-piccolo);
        border: 1px solid var(--bordo);
        background: var(--carta);
        color: var(--notte);
        cursor: pointer;
      }

      button:hover {
        background: var(--carta-alta);
      }

      button.forte {
        background: var(--azzurro);
        border-color: var(--azzurro);
        color: #fff;
      }

      button.forte:hover {
        background: var(--azzurro-scuro);
      }

      button.male {
        color: var(--male);
        border-color: var(--alone-male);
      }

      button.piccolo {
        padding: 6px 11px;
        font-size: 0.84rem;
      }

      /* ─── La chiave, che si vede una volta sola ─────────────────────── */

      .chiaveNuova {
        margin-top: 16px;
        border-radius: var(--raggio-piccolo);
        background: var(--alone-azzurro);
        padding: 18px 20px;
      }

      .chiaveNuova p {
        margin: 0 0 10px;
        font-size: 0.88rem;
      }

      .chiaveNuova .valore {
        font:
          600 1.05rem/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        word-break: break-all;
        background: var(--carta);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
        user-select: all;
      }

      .minuta {
        font-size: 0.85rem;
        color: var(--lieve);
        margin: 0;
      }

      .avvertenza {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        background: var(--alone-ambra);
        border-radius: var(--raggio-piccolo);
        padding: 13px 15px;
        font-size: 0.86rem;
        margin-top: 15px;
      }

      .avvertenza .gettone {
        flex: none;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: var(--ambra);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .vuoto {
        text-align: center;
        padding: 26px 0 8px;
        color: var(--lieve);
      }

      @media (max-width: 720px) {
        main {
          padding: 18px 16px 44px;
        }

        /* Le tessere a due a due. Una per riga vuol dire quattro schede alte
         * prima di arrivare a quello per cui si è aperta la pagina, e su un
         * telefono quella è mezza schermata di numeri che non si stavano
         * cercando. */
        .tessere {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .tessera {
          padding: 12px 13px;
          gap: 10px;
        }

        .tessera b {
          font-size: 1.3rem;
        }

        .tessera span {
          font-size: 0.74rem;
        }

        ul.installatori > li {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        /* Quante case e il metro sulla stessa riga: sono la stessa domanda, e
         * incolonnarli allunga ogni riga per niente. */
        .quante {
          text-align: left;
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .quante .metro {
          margin-top: 0;
          flex: 1;
          max-width: 150px;
        }

        .quante .minuta {
          margin-top: 0 !important;
        }

        /* Lo stato sopra, i tre tasti sotto in una riga sola e larghi uguali.
         * Prima «Togli» cadeva da solo per ogni riga, e un elenco fatto di
         * righe sfrangiate non si scorre con l'occhio. */
        ul.installatori .azioni {
          flex-direction: column;
          align-items: flex-start;
          gap: 9px;
          width: 100%;
        }

        .tasti {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 7px;
          width: 100%;
        }

        .tasti button {
          padding: 8px 4px;
          font-size: 0.78rem;
        }

        ul.installatori .pastiglia {
          font-size: 0.75rem;
          padding: 4px 9px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="testata">
        <!-- Niente bollo, come nella console degli installatori e per la stessa
             ragione: questa pagina si apre dentro Home Assistant, e il tasto
             del menu galleggia proprio li' sopra. -->
        <div class="marchio">
          <span class="nomi">
            <b>Gestione installatori</b>
            <span id="sottotitolo"></span>
          </span>
        </div>
      </div>
    </header>

    <main id="dove"></main>

    <script>
      /* ───────────────────────────────────────────────────────────────────
       * Questa pagina parla con `/gestore/…` e con nient'altro.
       *
       * Non chiede mai `/console/…`: quelle vie vogliono la chiave di un
       * installatore, e chi tiene il quadro non ce l'ha — né deve averla. Le case non
       * si vedono da qui, e non è una cosa da aggiungere un giorno: è la riga
       * per cui un installatore può fidarsi a metterci dentro i suoi clienti.
       * ─────────────────────────────────────────────────────────────────── */

      /* Se questa pagina sta dentro un riquadro di Home Assistant.
       *
       * Si guarda e basta: `window.top` di un'altra origine non si può
       * leggere, e il confronto solleva — in quel caso la risposta è comunque
       * «sì», perché un'origine diversa vuol dire proprio che qualcun altro ci
       * ha messo dentro. Serve a una cosa sola: lasciare in cima lo spazio per
       * il tasto del menu, che sta in quell'altro documento. */
      try {
        if (window.self !== window.top) document.documentElement.dataset.dentro = "sì";
      } catch (_altroDominio) {
        document.documentElement.dataset.dentro = "sì";
      }

      const DOVE_STA_LA_CHIAVE = "gdahome.quadro.gestore";
      let chiave = "";
      try {
        chiave = localStorage.getItem(DOVE_STA_LA_CHIAVE) || "";
      } catch (_niente) {
        /* Finestra anonima: si richiede a ogni apertura. */
      }

      let INSTALLATORI = [];
      let CASE = 0;
      let ORFANE = 0;
      /* La chiave appena fatta, che si vede una volta sola e poi sparisce
       * ricaricando. Non finisce in nessun archivio, nemmeno del browser. */
      let APPENA_FATTO = null;

      const dove = document.getElementById("dove");
      const testo = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      const plurale = (quanti, uno, molti) => `${quanti} ${quanti === 1 ? uno : molti}`;

      class ChiaveNoNo extends Error {}

      async function chiedi(via, opzioni = {}) {
        /* In relativo: da `/gestore/` porta dove deve, e funziona anche dietro
         * un proxy che monta il quadro sotto un prefisso. */
        const risposta = await fetch(via.replace(/^\//, ""), {
          ...opzioni,
          headers: {
            authorization: `Bearer ${chiave}`,
            "content-type": "application/json",
            ...(opzioni.headers || {}),
          },
        });
        if (risposta.status === 401) throw new ChiaveNoNo();
        const corpo = await risposta.json().catch(() => ({}));
        if (!risposta.ok) throw new Error(corpo.errore || "non ha funzionato");
        return corpo;
      }

      function prendi(detto) {
        INSTALLATORI = detto.installatori || [];
        CASE = detto.case || 0;
        ORFANE = detto.orfane || 0;
      }

      /* Da quanto non si fa vedere, in parole. */
      function daQuanto(quando) {
        if (!quando) return "mai";
        const minuti = Math.round((Date.now() - quando) / 60000);
        if (minuti < 60) return "oggi";
        const ore = Math.round(minuti / 60);
        if (ore < 24) return "oggi";
        const giorni = Math.round(ore / 24);
        return `${giorni} ${giorni === 1 ? "giorno" : "giorni"} fa`;
      }

      /* Lo stato di un installatore: una forma, una parola e un colore. Mai il colore
       * da solo — l'ambra e il rosso di questo progetto stanno a ΔE 5.7 per chi
       * non distingue il rosso. */
      function loStato(uno) {
        if (uno.pieno) return { come: "ambra", forma: "▲", parola: "al limite" };
        if (!uno.vistoIl) return { come: "quieta", forma: "◇", parola: "mai entrato" };
        const giorni = (Date.now() - uno.vistoIl) / 86400000;
        if (giorni > 30) return { come: "quieta", forma: "■", parola: "non lo apre" };
        return { come: "bene", forma: "●", parola: "a posto" };
      }

      function disegna() {
        const alTetto = INSTALLATORI.filter((uno) => uno.pieno).length;
        document.getElementById("sottotitolo").textContent =
          `gestione installatori · ${plurale(INSTALLATORI.length, "iscritto", "iscritti")}`;

        dove.innerHTML = `
          <div class="tessere">
            <div class="tessera">
              <span class="segno" style="background: var(--alone-azzurro); color: var(--azzurro-scuro)">●</span>
              <span><b>${INSTALLATORI.length}</b><span>installatori</span></span>
            </div>
            <div class="tessera">
              <span class="segno" style="background: var(--alone-azzurro); color: var(--azzurro-scuro)">◆</span>
              <span><b>${CASE}</b><span>impianti in tutto</span></span>
            </div>
            <div class="tessera">
              <span class="segno" style="background: var(--alone-ambra); color: var(--ambra)">▲</span>
              <span><b>${alTetto}</b><span>al limite</span></span>
            </div>
            <div class="tessera">
              <span class="segno" style="background: ${ORFANE ? "var(--alone-ambra); color: var(--ambra)" : "var(--carta-alta); color: var(--fioco)"}">◇</span>
              <span><b>${ORFANE}</b><span>senza più nessuno</span></span>
            </div>
          </div>

          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Aggiungi un installatore</h3>
            </div>
            <p class="minuta" style="margin-bottom: 14px">
              Lo aggiungi e gli dai una chiave: da quel momento apre
              <span style="font-family: ui-monospace, monospace">/console/</span> e vede i suoi
              impianti. Non deve accendere niente e non deve comprare nessun dominio.
            </p>
            <div class="azioni">
              <input type="text" id="nome" maxlength="80" placeholder="Come si chiama l'installatore" aria-label="Il nome dell'installatore" />
              <input type="number" id="tetto" min="0" max="9999" placeholder="Limite" value="40" aria-label="Quanti impianti al massimo" />
              <button type="button" class="forte" data-iscrivi>Aggiungi</button>
            </div>
            <p class="minuta" style="margin-top: 10px">
              Il limite è quanti impianti può seguire. <b>Zero</b> vuol dire senza limite.
            </p>
            ${
              APPENA_FATTO
                ? `<div class="chiaveNuova">
                     <p><b>La chiave di ${testo(APPENA_FATTO.nome)}.</b> Consegnagliela adesso: qui
                     resta solo la sua impronta, e questa riga non si rivede più.</p>
                     <div class="valore">${testo(APPENA_FATTO.chiave)}</div>
                     <div class="azioni">
                       <button type="button" data-copia="${testo(APPENA_FATTO.chiave)}">Copia</button>
                       <button type="button" class="piccolo" data-chiudi-chiave>Ho finito</button>
                     </div>
                   </div>`
                : ""
            }
          </section>

          <section class="riquadro">
            <div class="capoRiquadro">
              <h3>Gli installatori</h3>
              <span class="conta">${plurale(CASE, "impianto", "impianti")} in tutto</span>
            </div>
            ${
              INSTALLATORI.length
                ? `<ul class="installatori">${INSTALLATORI.map(unInstallatore).join("")}</ul>`
                : `<p class="vuoto">Nessuno, per adesso. Il primo si aggiunge qui sopra.</p>`
            }
            ${
              ORFANE
                ? `<div class="avvertenza">
                     <span class="gettone" aria-hidden="true">!</span>
                     <span>
                       <b
                         >${plurale(ORFANE, "impianto", "impianti")} senza più nessuno che
                         ${ORFANE === 1 ? "lo guardi" : "li guardi"}.</b
                       >
                       ${
                         ORFANE === 1
                           ? `È l'impianto di un installatore che hai tolto. Continua a mandare il
                              suo rapporto, ed è giusto così: funziona in casa di qualcuno, e
                              spegnerlo punirebbe il cliente per una faccenda che non è sua. Ma da
                              qui non lo guarda più nessuno.`
                           : `Sono impianti di installatori che hai tolto. Continuano a mandare i
                              loro rapporti, ed è giusto così: funzionano in casa di qualcuno, e
                              spegnerli punirebbe i clienti per una faccenda che non è loro. Ma da
                              qui non li guarda più nessuno.`
                       }
                       <br /><br />
                       <b>Riaggiungere quell'installatore non ${ORFANE === 1 ? "lo" : "li"} riporta
                       indietro:</b> chi si riaggiunge prende una matricola nuova, e
                       ${ORFANE === 1 ? "questo impianto punta" : "questi impianti puntano"} ancora
                       a quella di prima. Per ora non c'è modo di
                       ${ORFANE === 1 ? "ridarlo" : "ridarli"} a qualcuno da questa pagina.
                     </span>
                   </div>`
                : ""
            }
          </section>

          <section class="riquadro">
            <div class="capoRiquadro"><h3>Cosa non si vede da qui</h3></div>
            <p class="minuta">
              <b>Quanti impianti ha ognuno, non quali.</b> Non è una cosa che manca: sarebbe
              facilissimo mostrare l'elenco. Un elenco dei clienti di un'altra azienda è un'altra
              cosa — e più pesante — che contare licenze, e per tenere il quadro non serve. È anche
              la riga per cui un installatore può fidarsi a metterci dentro i suoi impianti.
            </p>
          </section>
        `;

        dove.querySelector("[data-iscrivi]")?.addEventListener("click", iscrivi);
        dove.querySelector("[data-chiudi-chiave]")?.addEventListener("click", () => {
          APPENA_FATTO = null;
          disegna();
        });
        dove.querySelectorAll("[data-copia]").forEach((tasto) => {
          tasto.onclick = async () => {
            try {
              await navigator.clipboard.writeText(tasto.dataset.copia);
              tasto.textContent = "Copiata";
            } catch (_niente) {
              tasto.textContent = "Selezionala a mano";
            }
          };
        });
        dove.querySelectorAll("[data-tetto]").forEach((tasto) => {
          tasto.onclick = () => cambiaIlTetto(tasto.dataset.tetto);
        });
        dove.querySelectorAll("[data-rifai]").forEach((tasto) => {
          tasto.onclick = () => rifaiLaChiave(tasto.dataset.rifai);
        });
        dove.querySelectorAll("[data-chiudi]").forEach((tasto) => {
          tasto.onclick = () => togliLInstallatore(tasto.dataset.chiudi, tasto);
        });
      }

      function unInstallatore(uno) {
        const stato = loStato(uno);
        const quota = uno.soglia > 0 ? Math.min(100, Math.round((uno.case / uno.soglia) * 100)) : 0;
        return `
          <li class="${stato.come === "quieta" ? "" : stato.come}">
            <span class="chi">
              <b class="${uno.nome ? "" : "senzaNome"}">${testo(uno.nome || "senza nome")}</b>
              <span>ultima volta qui: ${testo(daQuanto(uno.vistoIl))}</span>
            </span>
            <span class="quante ${uno.pieno ? "pieno" : ""}">
              <b>${uno.case}${uno.soglia > 0 ? ` <span style="color: var(--fioco)">/ ${uno.soglia}</span>` : ""}</b>
              ${uno.soglia > 0 ? `<span class="metro"><i style="width: ${quota}%"></i></span>` : `<span class="minuta" style="display:block;margin-top:4px">senza limite</span>`}
            </span>
            <span class="azioni">
              <span class="pastiglia ${stato.come}">
                <span aria-hidden="true">${stato.forma}</span>${testo(stato.parola)}
              </span>
              <span class="tasti">
                <button type="button" class="piccolo" data-tetto="${testo(uno.chi)}">Limite</button>
                <button type="button" class="piccolo" data-rifai="${testo(uno.chi)}">Nuova chiave</button>
                <button type="button" class="piccolo male" data-chiudi="${testo(uno.chi)}">Togli</button>
              </span>
            </span>
          </li>`;
      }

      async function iscrivi() {
        const nome = document.getElementById("nome").value.trim();
        const soglia = Number(document.getElementById("tetto").value) || 0;
        if (!nome) {
          document.getElementById("nome").focus();
          return;
        }
        const detto = await chiedi("/installatori", {
          method: "POST",
          body: JSON.stringify({ nome, soglia }),
        });
        prendi(detto);
        APPENA_FATTO = { nome, chiave: detto.chiave };
        disegna();
      }

      async function cambiaIlTetto(chi) {
        const uno = INSTALLATORI.find((altro) => altro.chi === chi);
        const detto = prompt(
          `Quanti impianti può seguire ${uno?.nome || "questo installatore"}? Zero = nessun limite.`,
          String(uno?.soglia ?? 0),
        );
        if (detto === null) return;
        prendi(
          await chiedi(`/installatore/${chi}`, {
            method: "PUT",
            body: JSON.stringify({ soglia: Number(detto) || 0 }),
          }),
        );
        disegna();
      }

      async function rifaiLaChiave(chi) {
        const uno = INSTALLATORI.find((altro) => altro.chi === chi);
        if (
          !confirm(
            `Fare uno chiave nuova per ${uno?.nome || "questo installatore"}?\n\nQuella di prima smette di aprire subito.`,
          )
        )
          return;
        const detto = await chiedi(`/installatore/${chi}/chiave`, { method: "POST" });
        APPENA_FATTO = { nome: uno?.nome || "questo installatore", chiave: detto.chiave };
        disegna();
      }

      /* Togliere un installatore si conferma in due tempi, come «non seguirla più»
       * nella console degli installatori: è la cosa che toglie a qualcuno
       * l'accesso ai suoi impianti, e un clic solo è poco. */
      async function togliLInstallatore(chi, tasto) {
        const uno = INSTALLATORI.find((altro) => altro.chi === chi);
        if (tasto.dataset.sicuro !== "sì") {
          tasto.dataset.sicuro = "sì";
          tasto.textContent = "Sicuro?";
          setTimeout(() => {
            tasto.dataset.sicuro = "";
            tasto.textContent = "Togli";
          }, 4000);
          return;
        }
        prendi(await chiedi(`/installatore/${chi}`, { method: "DELETE" }));
        disegna();
      }

      function chiedimiLaChiave(perche) {
        dove.innerHTML = `
          <section class="riquadro" style="max-width: 460px; margin: 40px auto">
            <div class="capoRiquadro"><h3>La chiave di gestione</h3></div>
            <p class="minuta" style="margin-bottom: 14px">
              ${testo(perche || "È quella con cui hai acceso il quadro: da qui si aggiungono gli installatori.")}
            </p>
            <div class="azioni">
              <input type="text" id="la-chiave" placeholder="Incollala qui" aria-label="La chiave di gestione" />
              <button type="button" class="forte" id="entra">Entra</button>
            </div>
          </section>`;
        const entra = () => {
          chiave = document.getElementById("la-chiave").value.trim();
          try {
            localStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
          } catch (_niente) {
            /* Si resta con quella in memoria, e si richiede alla prossima. */
          }
          apri();
        };
        document.getElementById("entra").onclick = entra;
        document.getElementById("la-chiave").onkeydown = (e) => {
          if (e.key === "Enter") entra();
        };
        document.getElementById("la-chiave").focus();
      }

      async function apri() {
        if (!chiave) {
          chiedimiLaChiave();
          return;
        }
        try {
          prendi(await chiedi("/installatori"));
          disegna();
        } catch (male) {
          if (male instanceof ChiaveNoNo) {
            chiedimiLaChiave("Quella chiave non apre. Riprova.");
            return;
          }
          dove.innerHTML = `<section class="riquadro"><p class="minuta">${testo(male.message)}</p></section>`;
        }
      }

      apri();
      /* Un rinfresco lento: questa pagina si guarda ogni tanto, non si fissa. */
      setInterval(() => {
        if (chiave && !APPENA_FATTO) void apri();
      }, 60000);

      /* La chiave consegnata da chi ci tiene dentro.
       *
       * Questa pagina si apre in due modi: da sola in un browser, e dentro
       * Home Assistant, in una voce della barra laterale che l'add-on
       * fabbrica. Nel secondo caso il codice l'add-on ce l'ha gia' — e' quello
       * scritto nella sua scheda, ed e' quello che fa esistere la voce — e
       * richiederlo qui vorrebbe dire scriverlo due volte, con la seconda che
       * fa pensare che la prima non abbia funzionato.
       *
       * Non si controlla da quale origine arriva, e non e' una svista: chi ci
       * tiene dentro e' Home Assistant, e l'indirizzo di un Home Assistant e'
       * diverso in ogni casa — non c'e' nessun elenco da scrivere qui. Quello
       * che regge e' che il messaggio non **da'** accesso: porta una chiave,
       * che vale se e' buona e non vale se non lo e'. Chi potesse mandarne una
       * buona ce l'avrebbe gia'.
       *
       * Se una chiave c'e' gia' non si tocca: chi l'ha battuta a mano in
       * questo browser ha deciso lui, e una consegna che gliela cambia sotto
       * e' un modo di non far entrare piu' nessuno. */
      addEventListener("message", (evento) => {
        const detto = evento?.data;
        if (!detto || detto.gdahome !== "chiave") return;
        const arrivata = String(detto.chiave || "").trim();
        if (!arrivata || chiave) return;
        chiave = arrivata;
        try {
          localStorage.setItem(DOVE_STA_LA_CHIAVE, chiave);
        } catch (_niente) {
          /* Vale per questa apertura e basta: meglio di non entrare. */
        }
        void apri();
      });
    </script>
  </body>
</html>
