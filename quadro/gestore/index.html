        attenzione:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.2 2.6 16.4h14.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8.4V12M10 14.1v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        cerca:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.4" stroke="currentColor" stroke-width="1.8"/><path d="m13.2 13.2 3.6 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        freccia:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.6 4.8 5.2 5.2-5.2 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',

        pausa:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="5" y="4.4" width="3.2" height="11.2" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="11.8" y="4.4" width="3.2" height="11.2" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>',
        cestino:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.6 5.8h12.8M7.8 5.8v-2h4.4v2M5.2 5.8l.8 10.4h8l.8-10.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        matita:
          '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.6 16.4h3.2l8.8-8.8-3.2-3.2-8.8 8.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11 6.2 2.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
        ok: '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.8"/><path d="m6.9 10.2 2.2 2.2 4.1-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      };

      /* Le iniziali per il tondo: le prime lettere delle prime due parole. */
      function laSigla(nome) {
        const parole = String(nome || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        if (!parole.length) return "?";
        return parole
          .slice(0, 2)
          .map((una) => una[0].toUpperCase())
          .join("");
      }

      const numero = (n) => new Intl.NumberFormat("it-IT").format(Number(n) || 0);

      /* I metri degli installatori si riempiono al frame dopo, come gli archi. */
      function apriIMetri(radice) {
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            radice.querySelectorAll(".metro i[data-fine]").forEach((uno) => {
              uno.style.width = uno.dataset.fine;
            });
          }),
        );
      }

      /* ─── I conti di tutta la pagina ─────────────────────────────────
       *
       * Le case arrivano da due vie: quelle degli installatori, ognuna col suo
       * rapporto (`/installatore/<chi>/case`), e quelle che il quadro conosce
       * solo per la licenza — una casa che ha comprato Premium o l'ha avuto in
       * regalo, e che nessun installatore segue. Qui si mettono insieme una
       * volta per disegno, con la licenza di ognuna accanto, e tutte le
       * sezioni leggono da qui: la Panoramica conta, «Case» elenca, la scheda
       * racconta. Un numero solo per ogni cosa, in tutta la pagina. */
      function iConti() {
        const perCasa = new Map();
        const diQuesta = (sog) => {
          if (!perCasa.has(sog)) perCasa.set(sog, { licenze: [], abbonamenti: [] });
          return perCasa.get(sog);
        };
        for (const una of LICENZE.licenze || [])
          if (una.app === "gdahome" && String(una.sog || "").startsWith("casa_"))
            diQuesta(una.sog).licenze.push(una);
        for (const uno of ABBONAMENTI?.elenco || [])
          if (uno.app === "gdahome" && String(uno.sog || "").startsWith("casa_"))
            diQuesta(uno.sog).abbonamenti.push(uno);

        /* Senza nome si mostra un pezzo della matricola: due «Casa senza
         * nome» in fila non si distinguerebbero. */
        const senzaNome = (matricola) => `Casa senza nome · ${String(matricola).slice(5, 13)}`;
        const tutte = [];
        for (const uno of INSTALLATORI)
          for (const casa of LE_CASE_DI.get(uno.chi)?.case || [])
            tutte.push({
              matricola: casa.casa,
              nome: casa.senzaNome ? senzaNome(casa.casa) : casa.nome,
              chi: uno.chi,
              di: uno.nome || "un installatore senza nome",
              casa,
              licenza: laLicenza(perCasa.get(casa.casa)),
            });
        const seguite = new Set(tutte.map((una) => una.matricola));
        for (const [matricola, sue] of perCasa)
          if (!seguite.has(matricola))
            tutte.push({
              matricola,
              nome: senzaNome(matricola),
              chi: "",
              di: "",
              casa: null,
              licenza: laLicenza(sue),
            });

        const nomi = new Map(tutte.map((una) => [una.matricola, una.nome]));
        return {
          tutte,
          nomi,
          seguite: tutte.filter((una) => una.casa),
          /* Premium pagato o dato dall'installatore: i regali si contano a parte. */
          premium: tutte.filter(
            (una) => una.licenza.premium && una.licenza.buona.origine !== "regalo",
          ).length,
          daGuardare: leCoseDaGuardare(tutte, nomi),
        };
      }

      /* La licenza gdahome di una casa, in una parola: Premium, e da dove
       * viene, o Base. Le licenze e gli abbonamenti arrivano da due vie
       * diverse (`/licenze` e `/abbonamenti`) e qui si mettono insieme per
       * matricola. Fra due licenze buone vince quella del negozio, che e'
       * quella che si rinnova o finisce da sola; poi il regalo, poi quella
       * data dall'installatore. */
      const PRIMA_LA_LICENZA = { negozio: 0, regalo: 1, installatore: 2 };
      function laLicenza(sue) {
        const licenze = sue?.licenze || [];
        const abbonamenti = sue?.abbonamenti || [];
        const buona =
          licenze
            .filter((una) => una.vale)
            .sort(
              (a, b) => (PRIMA_LA_LICENZA[a.origine] ?? 9) - (PRIMA_LA_LICENZA[b.origine] ?? 9),
            )[0] || null;
        if (!buona)
          return { premium: false, parola: "Base", tinta: "", buona: null, licenze, abbonamenti };
        const abbonamento =
          buona.origine === "negozio"
            ? abbonamenti.find((uno) => uno.lic === buona.lic) || null
            : null;
        const come =
          buona.origine === "negozio"
            ? abbonamento?.sandbox
              ? "acquisto di prova"
              : abbonamento?.stato === "disdetto"
                ? "disdetto"
                : abbonamento?.stato === "prova"
                  ? "in prova"
                  : "abbonamento"
            : buona.origine === "regalo"
              ? "regalo"
              : buona.origine === "installatore"
                ? "dall'installatore"
                : String(buona.origine || "");
        return {
          premium: true,
          parola: `Premium · ${come}`,
          tinta: come === "disdetto" ? "guardare" : "blu",
          buona,
          licenze,
          abbonamenti,
        };
      }

      /* «Da guardare»: le cose che chiedono un'occhiata, le rosse prima.
       * Ognuna dice cosa e di chi, e porta dove si guarda: la scheda della
       * casa, quella dell'installatore, o la sezione giusta. Quando non c'e'
       * niente, la Panoramica dice «Tutto in ordine» e la pastiglia sulla
       * barra non c'e'. */
      function leCoseDaGuardare(tutte, nomi) {
        const cose = [];
        if (SALUTE?.nonMiAggiorno)
          cose.push({
            tinta: "rosso",
            icona: "quadro",
            titolo: `Il quadro non si aggiorna da ${oreInParole(SALUTE.nonMiAggiorno.ore)}`,
            sotto: SALUTE.nonMiAggiorno.perche || "Non si sa perché",
          });
        if (SALUTE?.tramite && !SALUTE.tramite.vivo)
          cose.push({
            tinta: "rosso",
            icona: "tramite",
            titolo: "Il tramite non risponde",
            sotto: "Da fuori casa le case non si raggiungono",
          });
        if (LICENZE.accese === false)
          cose.push({
            tinta: "rosso",
            icona: "licenze",
            titolo: "Le licenze sono spente",
            sotto: "Manca la chiave delle licenze: le case non ricevono Premium",
            vai: "licenze",
          });
        for (const una of tutte) {
          const stato = una.casa?.stato;
          if (!stato || stato.chiave === "posto") continue;
          const quando = una.casa.carta?.quando;
          cose.push(
            stato.chiave === "offline"
              ? {
                  tinta: "rosso",
                  icona: "attenzione",
                  titolo: `${una.nome} non manda notizie`,
                  sotto: `${una.di} · ${quando ? `ultimo rapporto ${daQuanto(quando)}` : "nessun rapporto ancora"}`,
                  casa: una,
                }
              : {
                  tinta: "ambra",
                  icona: "casa",
                  titolo: `${una.nome} è da verificare`,
                  sotto: `${una.di} · ${String(stato.perché || "").replace(/\.$/, "")}`,
                  casa: una,
                },
          );
        }
        for (const uno of ABBONAMENTI?.elenco || [])
          if (uno.stato === "disdetto" && !uno.sandbox)
            cose.push({
              tinta: "ambra",
              icona: "abbonamenti",
              titolo: `${nomi.get(uno.sog) || (String(uno.sog).startsWith("tel_") ? "Un telefono" : "Una casa")} ha disdetto l'abbonamento`,
              sotto: `${uno.app === "gdanav" ? "gdanav" : "gdahome"} Premium finisce${uno.pagato ? ` ${conLArticolo("il", uno.pagato)}` : " alla scadenza"}`,
              vai: "abbonamenti",
              filtro: "disdetto",
            });
        for (const uno of INSTALLATORI) {
          const stato = loStato(uno);
          if (stato.come !== "limite") continue;
          const quante = Number(uno.case) || 0;
          cose.push({
            tinta: "ambra",
            icona: "installatori",
            titolo: `${uno.nome || "Un installatore"} è ${stato.parola}`,
            sotto: `${plurale(quante, "casa", "case")} su ${Number(uno.soglia)}${uno.pieno ? ": non ne può abbinare altre" : ""}`,
            installatore: uno.chi,
          });
        }
        if (ORFANE)
          cose.push({
            tinta: "ambra",
            icona: "casa",
            titolo:
              ORFANE === 1
                ? "Un impianto è rimasto senza installatore"
                : `${ORFANE} impianti sono rimasti senza installatore`,
            sotto: "Mandano i rapporti, ma da qui non li guarda nessuno",
            vai: "installatori",
          });
        return [
          ...cose.filter((una) => una.tinta === "rosso"),
          ...cose.filter((una) => una.tinta !== "rosso"),
        ];
      }

      /* ─── Disegnare ──────────────────────────────────────────────────── */

      function disegna() {
        CONTI = iConti();
        /* Il numero resta attaccato alla sua parola: sul telefono la riga va
           a capo fra un pezzo e l'altro, non fra «7» e «Premium». */
        document.getElementById("sottotitolo").textContent = [
          plurale(INSTALLATORI.length, "installatore", "installatori"),
          plurale(CONTI.seguite.length, "casa", "case"),
          `${CONTI.premium} Premium`,
        ]
          .map((pezzo) => pezzo.replace(" ", " "))
          .join(" · ");

        doveNav.innerHTML = [
          /* Una sola linguetta porta il numero: la Panoramica, e conta le
             cose da guardare. Sulle altre una pastiglia si leggerebbe come
             «quanti ce ne sono», e una volta diceva «Installatori 1» a un
             gestore che ne aveva due. */
          ["panoramica", "Panoramica", CONTI.daGuardare.length],
          ["case", "Case", 0],
          ["installatori", "Installatori", 0],
          ["licenze", "Regali e codici", 0],
          ["abbonamenti", "Abbonamenti", 0],
        ]
          .map(
            ([quale, parola, quanti]) => `
            <button type="button" data-schermata="${testo(quale)}" aria-pressed="${schermata === quale}">
              ${LE_ICONE[quale === "case" ? "casa" : quale === "licenze" ? "regalo" : quale]}<span>${testo(parola)}</span>${quanti ? `<span class="quanti giallo">${Number(quanti)}</span>` : ""}
            </button>`,
          )
          .join("");

        /* Il foglio si ridisegna insieme al resto, e il punto a cui era
         * scorso si tiene. Si disegna per primo: se la casa o l'installatore
         * che mostrava non c'e' piu', si chiude, e la sezione sotto lo sa. */
        const corpoDiPrima = dove.querySelector("#foglio-corpo");
        const scorsoA = corpoDiPrima ? corpoDiPrima.scrollTop : 0;
        const primaVolta = disegnata !== schermata;
        disegnata = schermata;
        animaIMetri = primaVolta;

        const ilFoglioDisegnato = ilFoglio();
        dove.innerHTML =
          (schermata === "case"
            ? leCase()
            : schermata === "installatori"
              ? gliInstallatori()
              : schermata === "licenze"
                ? leLicenze()
                : schermata === "abbonamenti"
                  ? gliAbbonamenti()
                  : laPanoramica()) + ilFoglioDisegnato;

        if (primaVolta) {
          apriGliArchi(dove);
          apriIMetri(dove);
        }
        const corpo = dove.querySelector("#foglio-corpo");
        if (corpo && !foglioAperto?.appena) corpo.scrollTop = scorsoA;
        document.body.classList.toggle("col-foglio", Boolean(foglioAperto));
        if (foglioAperto?.appena) {
          foglioAperto.appena = false;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              dove.querySelectorAll(".velo, .foglio").forEach((uno) => uno.classList.add("su"));
              apriGliArchi(dove.querySelector(".foglio"));
            }),
          );
        }

        aggancia();
      }

      /* ─── Panoramica ─────────────────────────────────────────────────── */

      function ilSaluto() {
        const ora = new Date().getHours();
        if (ora >= 5 && ora < 13) return "Buongiorno";
        if (ora >= 13 && ora < 18) return "Buon pomeriggio";
        return "Buonasera";
      }

      function laPanoramica() {
        const { tutte, seguite, daGuardare } = CONTI;
        const offline = seguite.filter((una) => una.casa.stato.chiave === "offline").length;
        const sospesi = INSTALLATORI.filter((uno) => uno.congelato).length;
        const alLimite = INSTALLATORI.filter((uno) => !uno.congelato && uno.pieno).length;
        const premium = tutte.filter(
          (una) => una.licenza.premium && una.licenza.buona.origine !== "regalo",
        );
        const daDove = (origine) =>
          premium.filter((una) => una.licenza.buona.origine === origine).length;
        const A = ABBONAMENTI;
        const alMese = A ? alMeseDetto(A.conti?.alMese) : "—";

        /* «Case» conta quelle che segue un installatore: le altre il quadro le
         * conosce solo per la licenza, e i regali hanno la loro casella. */
        const dettaglioCase = !seguite.length
          ? "nessuna seguita da un installatore"
          : [
              `${seguite.length - offline} ${seguite.length - offline === 1 ? "risponde" : "rispondono"}`,
              offline ? `${offline} offline` : "",
            ]
              .filter(Boolean)
              .join(" · ");

        /* I regali: le licenze date da te o dagli installatori che valgono
         * ancora, e i codici fatti che nessuno ha usato. Come in «Regali e
         * codici», da dove si arriva premendo. */
        const regalate = (LICENZE.licenze || []).filter(
          (una) => una.origine !== "negozio" && una.vale,
        );
        const aCase = regalate.filter((una) => String(una.sog || "").startsWith("casa_")).length;
        const aTelefoni = regalate.length - aCase;
        const codiciLiberi = (LICENZE.codici || []).filter(
          (uno) => !uno.usatoDa && !uno.annullato,
        ).length;
        const dettaglioRegali =
          !regalate.length && !codiciLiberi
            ? "nessun regalo, per adesso"
            : [
                aCase ? plurale(aCase, "casa", "case") : "",
                aTelefoni ? plurale(aTelefoni, "telefono", "telefoni") : "",
                codiciLiberi ? `${plurale(codiciLiberi, "codice", "codici")} da usare` : "",
              ]
                .filter(Boolean)
                .join(" · ");
        const dettaglioInstallatori = !INSTALLATORI.length
          ? "ancora nessuno"
          : [
              `${INSTALLATORI.length - sospesi} ${INSTALLATORI.length - sospesi === 1 ? "attivo" : "attivi"}`,
              alLimite ? `${alLimite} al limite` : "",
              sospesi ? `${sospesi} ${sospesi === 1 ? "sospeso" : "sospesi"}` : "",
            ]
              .filter(Boolean)
              .join(" · ");
        const dettaglioPremium = !premium.length
          ? "nessuna casa, per adesso"
          : [
              daDove("negozio") ? plurale(daDove("negozio"), "abbonamento", "abbonamenti") : "",
              daDove("installatore") ? `${daDove("installatore")} dagli installatori` : "",
            ]
              .filter(Boolean)
              .join(" · ");

        const numerone = (vai, icona, etichetta, valore, dettaglio, piccolo = "") => `
          <button type="button" class="numerone" data-vai="${testo(vai)}">
            <span class="etichetta">${LE_ICONE[icona]}${testo(etichetta)}</span>
            <span class="valore">${testo(valore)}${piccolo ? `<small> ${testo(piccolo)}</small>` : ""}</span>
            <span class="dettaglio">${testo(dettaglio)}</span>
          </button>`;

        /* Una cosa da guardare porta dove si guarda: la casa, l'installatore,
         * la sezione. Quelle che si guardano qui e basta non si premono. */
        const unaCosa = (cosa) => {
          const porta = cosa.casa
            ? `data-apri-casa="${testo(cosa.casa.matricola)}" data-di="${testo(cosa.casa.chi)}"`
            : cosa.installatore
              ? `data-apri-installatore="${testo(cosa.installatore)}"`
              : cosa.vai
                ? `data-vai="${testo(cosa.vai)}" data-filtro="${testo(cosa.filtro || "")}"`
                : "";
          return `
            <li ${/* già HTML */ porta}${porta ? ' role="button" tabindex="0"' : ' class="ferma"'}>
              <span class="tondino ${testo(cosa.tinta)}">${LE_ICONE[cosa.icona]}</span>
              <span class="riga-testo"><b>${testo(cosa.titolo)}</b><span>${testo(cosa.sotto)}</span></span>
              ${porta ? `<span class="freccina">${LE_ICONE["freccia"]}</span>` : ""}
            </li>`;
        };

        const daGuardareQui = daGuardare.length
          ? `<ul class="elenco si-tocca">${daGuardare.map(unaCosa).join("")}</ul>`
          : `<div class="tutto-bene">
               <span class="tondino verde">${LE_ICONE["ok"]}</span>
               <span class="riga-testo"><b>Tutto in ordine</b><span>Nessuna casa da guardare, nessun installatore al limite, nessuna disdetta.</span></span>
             </div>`;

        let inBreve = `<p class="sotto">Gli abbonamenti non sono arrivati: riprova fra poco, o premi «Aggiorna».</p>`;
        if (A) {
          const c = A.conti || {};
          const disdetto = (A.elenco || []).find((uno) => uno.stato === "disdetto" && !uno.sandbox);
          const righe = [
            {
              titolo: `${plurale(Number(c.attivi) || 0, "attivo", "attivi")}${c.prova ? ` · ${c.prova} in prova gratuita` : ""}`,
              sotto: `${plurale(Number(c.mensili) || 0, "mensile", "mensili")} · ${plurale(Number(c.annuali) || 0, "annuale", "annuali")}`,
              filtro: "",
            },
            c.disdetti || c.finiti30
              ? {
                  titolo: `${plurale(Number(c.disdetti) || 0, "disdetto", "disdetti")}, ${plurale(Number(c.finiti30) || 0, "finito", "finiti")} negli ultimi 30 giorni`,
                  sotto: disdetto
                    ? `${CONTI.nomi.get(disdetto.sog) || "Una casa"}: Premium finisce${disdetto.pagato ? ` ${conLArticolo("il", disdetto.pagato)}` : " alla scadenza"}`
                    : "Chi ha disdetto resta Premium fino alla scadenza",
                  filtro: c.disdetti ? "disdetto" : "scaduto",
                }
              : {
                  titolo: "Nessuna disdetta",
                  sotto: "E nessun abbonamento finito negli ultimi 30 giorni",
                  filtro: "",
                },
          ];
          inBreve = `<ul class="elenco si-tocca">${righe
            .map(
              (una) => `
              <li data-vai="abbonamenti" data-filtro="${testo(una.filtro)}" role="button" tabindex="0">
                <span class="riga-testo"><b>${testo(una.titolo)}</b><span>${testo(una.sotto)}</span></span>
                <span class="freccina">${LE_ICONE["freccia"]}</span>
              </li>`,
            )
            .join("")}</ul>`;
        }

        return `
          <div class="capo-sezione">
            <div>
              <h2>${testo(ilSaluto())}</h2>
              <p>Come vanno le case, gli installatori e gli abbonamenti, in un colpo d'occhio.</p>
            </div>
          </div>

          <div class="griglia griglia-5">
            ${/* già HTML */ numerone("case", "casa", "Case", numero(seguite.length), dettaglioCase)}
            ${/* già HTML */ numerone("installatori", "installatori", "Installatori", numero(INSTALLATORI.length), dettaglioInstallatori)}
            ${/* già HTML */ numerone("case", "stella", "Case Premium", numero(premium.length), dettaglioPremium)}
            ${/* già HTML */ numerone("licenze", "regalo", "Regali", numero(regalate.length), dettaglioRegali)}
            ${/* già HTML */ numerone("abbonamenti", "euro", "Incassi stimati", alMese, "quello che pagano i clienti, IVA compresa", alMese === "—" ? "" : "/mese")}
          </div>

          <div class="griglia griglia-2">
            <section class="scheda">
              <h3>
                <span class="tondino ambra">${LE_ICONE["attenzione"]}</span>Da guardare<span class="conta">${daGuardare.length ? Number(daGuardare.length) : ""}</span>
              </h3>
              <p class="sotto">Le cose che chiedono un'occhiata. Quando va tutto bene, qui c'è scritto «Tutto in ordine».</p>
              ${/* già HTML */ daGuardareQui}
            </section>
            <div class="griglia">
              ${/* già HTML */ ilServizio()}
              <section class="scheda">
                <h3><span class="tondino">${LE_ICONE["abbonamenti"]}</span>Abbonamenti in breve</h3>
                ${/* già HTML */ inBreve}
              </section>
            </div>
          </div>`;
      }

      /* ─── Case ───────────────────────────────────────────────────────
       *
       * Tutte le case in un elenco solo: prima quelle che non mandano
       * notizie, poi quelle da verificare, poi quelle a posto, e in fondo
       * quelle che il quadro conosce solo per la licenza. Dentro ogni gruppo
       * per nome. Si cerca per nome, installatore o matricola, e si filtra
       * con le quattro pastiglie in alto. */
      const PESO_DELLO_STATO = { offline: 0, guardare: 1, posto: 2 };

      function leCaseInFila() {
        const cerca = CERCA_CASE.trim().toLowerCase();
        const peso = (una) => (una.casa ? (PESO_DELLO_STATO[una.casa.stato.chiave] ?? 2) : 3);
        return CONTI.tutte
          .filter((una) => {
            if (FILTRO_CASE === "guardare" && !(una.casa && una.casa.stato.chiave !== "posto"))
              return false;
            if (FILTRO_CASE === "premium" && !una.licenza.premium) return false;
            if (FILTRO_CASE === "base" && una.licenza.premium) return false;
            return (
              !cerca ||
              [una.nome, una.di, una.matricola].some((cosa) =>
                String(cosa).toLowerCase().includes(cerca),
              )
            );
          })
          .sort((a, b) => peso(a) - peso(b) || a.nome.localeCompare(b.nome, "it"));
      }

      function laRigaDellaCasa(una) {
        const stato = una.casa?.stato;
        const tinta = !stato
          ? "grigio"
          : stato.chiave === "offline"
            ? "rosso"
            : stato.chiave === "guardare"
              ? "ambra"
              : "verde";
        const quando = una.casa?.carta?.quando;
        const sotto = !una.casa
          ? "Nessun installatore · il quadro la conosce per la licenza"
          : stato.chiave === "offline"
            ? `${una.di} · offline${quando ? `, ultimo rapporto ${daQuanto(quando)}` : ""}`
            : `${una.di} · ${stato.parola}`;
        return `
          <li data-apri-casa="${testo(una.matricola)}" data-di="${testo(una.chi)}" role="button" tabindex="0" aria-current="${foglioAperto?.tipo === "casa" && foglioAperto.casa === una.matricola}">
            <span class="tondino ${testo(tinta)}">${LE_ICONE["casa"]}</span>
            <span class="riga-testo">
              <b>${testo(una.nome)}</b>
              <span>${testo(sotto)}</span>
              <span class="pastiglia ${testo(una.licenza.tinta)}">${testo(una.licenza.parola)}</span>
            </span>
            <span class="freccina">${LE_ICONE["freccia"]}</span>
          </li>`;
      }

      function leRigheDelleCase() {
        const fila = leCaseInFila();
        if (fila.length) return fila.map(laRigaDellaCasa).join("");
        return `
          <li class="ferma vuota">
            <span class="riga-testo">
              <b>${CONTI.tutte.length ? "Nessuna casa con questo filtro" : "Ancora nessuna casa"}</b>
              <span>${
                CONTI.tutte.length
                  ? "Prova un altro filtro, o cerca con un'altra parola."
                  : "Le case compaiono qui quando un installatore le abbina, o quando una casa ha Premium."
              }</span>
            </span>
          </li>`;
      }

      /* Mentre si scrive nella ricerca si ridisegna l'elenco e basta: la
       * casella resta dov'e', col cursore dentro. */
      function ridisegnaLeCase() {
        const elenco = document.getElementById("elenco-case");
        if (!elenco) return;
        elenco.innerHTML = leRigheDelleCase();
        elenco.querySelectorAll("[data-apri-casa]").forEach((riga) => {
          premibile(riga, () => apriLaCasa(riga.dataset.apriCasa, riga.dataset.di || ""));
        });
      }

      function leCase() {
        const { tutte } = CONTI;
        const quante = (filtro) => tutte.filter(filtro).length;
        const pastiglia = (quale, parola, quanti) =>
          `<button type="button" class="chip" data-filtro-case="${testo(quale)}" aria-pressed="${FILTRO_CASE === quale}">${testo(parola)} <b>${Number(quanti)}</b></button>`;
        return `
          <div class="capo-sezione">
            <div>
              <h2>Case</h2>
              <p>Tutte le case che conosci: quelle seguite dagli installatori e quelle che hanno Premium da sole. Tocca una casa per aprire la sua scheda.</p>
            </div>
          </div>

          <div class="filtri">
            <label class="cerca">
              ${LE_ICONE["cerca"]}
              <input type="search" id="cerca-case" value="${testo(CERCA_CASE)}" placeholder="Cerca per nome, installatore o matricola" autocomplete="off" spellcheck="false" aria-label="Cerca una casa" />
            </label>
            ${/* già HTML */ pastiglia("tutte", "Tutte", tutte.length)}
            ${
              /* già HTML */ pastiglia(
                "guardare",
                "Da guardare",
                quante((una) => una.casa && una.casa.stato.chiave !== "posto"),
              )
            }
            ${
              /* già HTML */ pastiglia(
                "premium",
                "Premium",
                quante((una) => una.licenza.premium),
              )
            }
            ${
              /* già HTML */ pastiglia(
                "base",
                "Base",
                quante((una) => !una.licenza.premium),
              )
            }
          </div>

          <div class="posto-dell-elenco">
            <div class="colonna-elenco">
              <section class="scheda">
                <ul class="elenco si-tocca" id="elenco-case">${/* già HTML */ leRigheDelleCase()}</ul>
              </section>
            </div>
          </div>

          <div class="scheda-vuota">
            <b>Scegli una casa</b>
            <span>La sua scheda si apre qui, accanto all'elenco.</span>
          </div>`;
      }

      /* ─── Installatori ───────────────────────────────────────────────── */

      function gliInstallatori() {
        const vivi = INSTALLATORI.filter((uno) => !uno.congelato);
        const conSoglia = vivi.filter((uno) => uno.soglia > 0);
        const posti = conSoglia.reduce((somma, uno) => somma + uno.soglia, 0);
        const usati = conSoglia.reduce((somma, uno) => somma + (Number(uno.case) || 0), 0);
        const liberi = Math.max(0, posti - usati);
        const alLimite = INSTALLATORI.filter((uno) => uno.pieno).length;
        /* I posti: quante case possono ancora abbinare, tutti insieme. Uno
         * sospeso non si conta. Si dicono solo se tutti gli altri hanno un
         * limite: con uno senza, i posti non finiscono, e «nessun posto
         * disponibile» sarebbe falso. */
        const tuttiColLimite = vivi.length > 0 && conSoglia.length === vivi.length;
        const iPosti = !tuttiColLimite
          ? ""
          : liberi
            ? plurale(liberi, "posto disponibile", "posti disponibili")
            : "nessun posto disponibile";
        const riassunto = !INSTALLATORI.length
          ? ""
          : alLimite
            ? `${plurale(alLimite, "installatore al limite", "installatori al limite")}${iPosti ? `, ${iPosti}` : ""}.`
            : iPosti
              ? `Nessuno al limite: ${iPosti}.`
              : "";
        /* Senza una scheda aperta le carte stanno su tutta la larghezza; con
         * la scheda aperta stanno in colonna, e la scheda accanto. */
        const aperto = foglioAperto?.tipo === "installatore" || foglioAperto?.tipo === "nuovo";
        const chiaveQui =
          Boolean(APPENA_FATTO) &&
          !(foglioAperto?.tipo === "installatore" && foglioAperto.chi === APPENA_FATTO.chi);

        return `
          <div class="capo-sezione">
            <div>
              <h2>Installatori</h2>
              <p>Chi monta gdahome per i suoi clienti. Tocca un installatore per vederne le case e cambiare le sue regole.${riassunto ? ` <b>${testo(riassunto)}</b>` : ""}</p>
            </div>
            <button type="button" class="tasto forte" data-nuovo>${LE_ICONE["aggiungi"]}Nuovo installatore</button>
          </div>

          ${chiaveQui ? laChiaveNuova() : ""}

          <div class="posto-dell-elenco${aperto ? "" : " largo"}">
            <div class="colonna-elenco">
              ${
                INSTALLATORI.length
                  ? `<div class="griglia griglia-3">${INSTALLATORI.map(laCartaDellInstallatore).join("")}</div>`
                  : `<div class="scheda vuoto">
                       <b>Ancora nessun installatore</b> Il primo si aggiunge con «Nuovo installatore»: nome, limite, e viene creata la sua chiave.
                     </div>`
              }
            </div>
          </div>

          ${
            ORFANE
              ? `<section class="riquadro larga" style="margin-top: 14px">
                   <div class="avvertenza">
                     <span class="gettone" aria-hidden="true">!</span>
                     <span>
                       <b
                         >${plurale(ORFANE, "impianto", "impianti")} senza più nessuno che
                         ${ORFANE === 1 ? "lo guardi" : "li guardi"}.</b
                       >
                       ${
                         ORFANE === 1
                           ? `È rimasto indietro da quando «Togli» lasciava le case dov'erano.
                              Continua a mandare il suo rapporto, ed è giusto così: funziona in
                              casa di qualcuno. Ma da qui non lo guarda più nessuno.`
                           : `Sono rimasti indietro da quando «Togli» lasciava le case dov'erano.
                              Continuano a mandare i loro rapporti, ed è giusto così: funzionano in
                              casa di qualcuno. Ma da qui non li guarda più nessuno.`
                       }
                       <br /><br />
                       <b>Adesso non ne nascono più:</b> Elimina porta via anche gli impianti, e Sospendi non tocca niente. ${ORFANE === 1 ? "Questo" : "Questi"} si
                       ${ORFANE === 1 ? "recupera" : "recuperano"} dall'altra parte — il codice di
                       un installatore vivo, incollato nella configurazione dell'add-on di quella
                       casa — e questo conto cala da solo. Da questa pagina no: serve che qualcuno
                       ci metta mano in casa, ed è voluto — chi ci abita deve poter scegliere chi
                       guarda il suo impianto.
                     </span>
                   </div>
                 </section>`
              : ""
          }`;
      }

      /* Il tondo di un installatore: il suo marchio se ne ha messo uno, se
       * no le iniziali. */
      const leIniziali = (uno) =>
        `<span class="iniziali${uno.congelato ? " grigio" : ""}" aria-hidden="true">${
          uno.marchio
            ? `<img src="../marchio/${encodeURIComponent(uno.chi)}?${encodeURIComponent(uno.marchio)}" alt="" />`
            : testo(laSigla(uno.nome))
        }</span>`;

      /* La pastiglia di come sta: una parola e un colore. */
      function laPastigliaDi(uno) {
        if (uno.congelato) return `<span class="pastiglia">sospeso</span>`;
        if (uno.pieno) return `<span class="pastiglia guardare">al limite</span>`;
        const stato = loStato(uno);
        const tinta = stato.come === "posto" ? "posto" : stato.come === "limite" ? "guardare" : "";
        return `<span class="pastiglia ${testo(tinta)}">${testo(stato.parola)}</span>`;
      }

      /* Dopo la pastiglia: da quando non entra. Chi non e' mai entrato lo
       * dice gia' la pastiglia, e qui non si ripete. */
      const lUltimoAccesso = (uno) =>
        uno.vistoIl ? ` · ultimo accesso ${daQuantoEntra(uno.vistoIl)}` : "";

      /* Il pacchetto a parole: «2 licenze gdahome da 1 anno · 1 regalata». */
      function ilPacchettoDetto(uno) {
        const p = uno.pacchetto;
        const pezzi = LE_APP.flatMap((app) =>
          (Array.isArray(p?.[app]) ? p[app] : [])
            .filter((mucchio) => mucchio.totali > 0)
            .map(({ durata, totali = 0, usate = 0 }) => {
              const quanto = laDurata(durata);
              return `${plurale(totali, "licenza", "licenze")} ${app} ${quanto === "per sempre" ? quanto : `da ${quanto}`}${usate ? ` · ${usate} ${usate === 1 ? "regalata" : "regalate"}` : ""}`;
            }),
        );
        return pezzi.length ? pezzi.join(" · ") : "nessuna licenza da regalare";
      }

      function laCartaDellInstallatore(uno) {
        const stato = loStato(uno);
        const quante = Number(uno.case) || 0;
        const quota =
          uno.soglia > 0
            ? Math.min(100, Math.round((quante / uno.soglia) * 100))
            : quante
              ? 100
              : 0;
        return `
          <section class="scheda carta-installatore" data-stato="${testo(stato.come)}" data-apri-installatore="${testo(uno.chi)}" role="button" tabindex="0" aria-current="${foglioAperto?.tipo === "installatore" && foglioAperto.chi === uno.chi}">
            <h3>${/* già HTML */ leIniziali(uno)}<span>${uno.nome ? testo(uno.nome) : "senza nome"}</span></h3>
            <p class="sotto">${/* già HTML */ laPastigliaDi(uno)}${testo(lUltimoAccesso(uno))}</p>
            <div class="posti-detti">
              <b>${plurale(quante, "casa", "case")}</b>
              <span>${uno.soglia > 0 ? `limite ${Number(uno.soglia)}` : "senza limite"}</span>
            </div>
            <div class="metro">
              <i style="width: ${Number(animaIMetri ? 0 : quota)}%"${animaIMetri ? ` data-fine="${Number(quota)}%"` : ""}></i>
            </div>
            <p class="pacchetto-detto">${LE_ICONE["regalo"]}<span>${testo(ilPacchettoDetto(uno))}</span></p>
          </section>`;
      }

      /* Le case di un installatore, nella sua scheda: il nome che gli ha
       * dato, come sta, quante entita' ha, e la licenza. Si premono e si
       * apre la scheda della casa, nella sezione «Case». */
      function leSueCase(uno) {
        const dette = LE_CASE_DI.get(uno.chi);
        if (!dette)
          return `<li class="nessuna">${
            uno.case ? "Elenco delle case non arrivato: riprova fra poco." : "Nessuna casa ancora."
          }</li>`;
        if (!dette.case.length) return `<li class="nessuna">Nessuna casa ancora.</li>`;
        return dette.case
          .map((casa) => {
            const c = casa.carta || {};
            const licenza = CONTI?.tutte.find((una) => una.matricola === casa.casa)?.licenza;
            return `
              <li
                data-stato="${testo(casa.stato.chiave)}"
                data-apri-casa="${testo(casa.casa)}"
                data-di="${testo(uno.chi)}"
                role="button"
                tabindex="0"
              >
                <i class="punto"></i>
                <span class="nome">${
                  casa.senzaNome
                    ? `Casa senza nome<small class="mono">${testo(casa.casa.slice(5, 13))}</small>`
                    : testo(casa.nome)
                }</span>
                <span class="entita"><b>${cE(c.entita?.totali) ? numero(c.entita.totali) : "—"}</b><span>entità</span></span>
                <span class="come">${testo(casa.stato.parola)} · ${c.quando ? testo(daQuanto(c.quando)) : "nessun rapporto"}${licenza ? ` · ${testo(licenza.parola)}` : ""}</span>
              </li>`;
          })
          .join("");
      }

      /* La chiave appena fatta: chi l'ha chiesta la vede subito, e la vede
       * una volta sola. Sta in cima alla scheda dell'installatore; se la
       * scheda si chiude prima di averla copiata, resta in cima alla
       * sezione finche' non si preme «Chiudi». */
      function laChiaveNuova() {
        if (!APPENA_FATTO) return "";
        return `
          <section class="chiave-nuova">
            <b>La chiave di ${testo(APPENA_FATTO.nome)}</b>
            <p>
              Consegnagliela adesso: si vede <b>una volta sola</b>, qui resta solo la sua impronta. Se la perde, gliene generi una nuova.
            </p>
            <div class="valore">${testo(APPENA_FATTO.chiave)}</div>
            <div class="azioni" style="margin-top: 10px">
              <button type="button" class="tasto forte" data-copia="${testo(APPENA_FATTO.chiave)}">Copia</button>
              <button type="button" class="tasto" data-chiudi-chiave>Chiudi</button>
            </div>
          </section>`;
      }

      /* ─── Le licenze ─────────────────────────────────────────────────
       *
       * Il contratto sta in `docs/LICENZE.md`. Da qui si regala una licenza
       * a una casa (per la sua matricola, `casa_…`), si generano codici
       * regalo, e si toglie quello che si e' dato. Le licenze dei negozi si
       * vedono nella scheda della casa e si possono togliere, ma tornano da
       * sole al rinnovo successivo se l'abbonamento e' pagato: il negozio e'
       * lui a dirlo.
       * ─────────────────────────────────────────────────────────────────── */

      const IL_NOME_DELLA_APP = { gdahome: "gdahome Premium", gdanav: "gdanav Premium" };
      const DA_DOVE = {
        negozio: "dal negozio",
        regalo: "regalo del gestore",
        installatore: "dall'installatore",
      };
      const LE_DURATE = [
        ["1", "1 mese"],
        ["3", "3 mesi"],
        ["6", "6 mesi"],
        ["12", "12 mesi"],
        ["24", "24 mesi"],
        ["", "Per sempre"],
      ];

      const leDurate = (scelta = "12") =>
        LE_DURATE.map(
          ([valore, parola]) =>
            `<option value="${testo(valore)}"${valore === scelta ? " selected" : ""}>${testo(parola)}</option>`,
        ).join("");

      const quantiMesi = (mesi) =>
        mesi === null || mesi === undefined ? "per sempre" : plurale(Number(mesi), "mese", "mesi");

      /* Fino a quando, a parole. */
      function laScadenza(una) {
        if (una.revocata) return `tolta il ${ilGiorno(una.revocata)}`;
        if (una.scade === null) return "per sempre";
        /* Un abbonamento nei quattordici giorni gratis: finiti, il negozio lo
         * rinnova (e il quadro se ne accorge da se') o finisce li'. */
        if (una.prova && una.scade > ADESSO())
          return `in prova gratuita fino al ${ilGiorno(una.scade)}`;
        return una.scade > ADESSO()
          ? `fino al ${ilGiorno(una.scade)}`
          : `scaduta il ${ilGiorno(una.scade)}`;
      }

      /* ─── Il pacchetto a righe ─────────────────────────────────────────
       *
       * Il gestore decide quante licenze e **di che durata**: una riga per
       * ogni app e durata. Le righe si tengono qui (`BOZZE`), non nelle
       * caselle: il ridisegno di ogni minuto rifa' le caselle, e una riga
       * aggiunta e non ancora salvata non deve sparire. `NUOVO` e' la bozza
       * del nuovo installatore; le altre sono per matricola. */
      const LE_APP = ["gdahome", "gdanav"];
      const NUOVO = "";
      const LE_DURATE_DEL_PACCHETTO = [
        ["1", "1 mese"],
        ["3", "3 mesi"],
        ["6", "6 mesi"],
        ["12", "1 anno"],
        ["24", "2 anni"],
        ["sempre", "per sempre"],
      ];
      const BOZZE = new Map();
      const PACCHETTI_APERTI = new Set();

      /* Una durata a parole: «1 mese», «1 anno», «per sempre». */
      function laDurata(durata) {
        const nota = LE_DURATE_DEL_PACCHETTO.find(([valore]) => valore === String(durata));
        if (nota) return nota[1];
        const mesi = Number(durata);
        if (mesi % 12 === 0) return plurale(mesi / 12, "anno", "anni");
        return plurale(mesi, "mese", "mesi");
      }

      const unaRigaNuova = () => ({ app: "gdahome", durata: "12", quante: 0 });

      /* Le righe di un installatore come le ha adesso: quelle con dei totali. */
      const leRigheDi = (uno) =>
        LE_APP.flatMap((app) =>
          (Array.isArray(uno?.pacchetto?.[app]) ? uno.pacchetto[app] : [])
            .filter((mucchio) => mucchio.totali > 0)
            .map((mucchio) => ({
              app,
              durata: String(mucchio.durata),
              quante: Number(mucchio.totali),
            })),
        );

      function laBozza(di) {
        if (!BOZZE.has(di))
          BOZZE.set(
            di,
            di === NUOVO ? [unaRigaNuova()] : leRigheDi(INSTALLATORI.find((uno) => uno.chi === di)),
          );
        return BOZZE.get(di);
      }

      /* Le righe, in quello che il quadro si aspetta: tutte e due le app,
       * sempre, cosi' una app senza righe si svuota davvero. */
      function ilPacchettoDellaBozza(di) {
        const fuori = { gdahome: {}, gdanav: {} };
        for (const { app, durata, quante } of laBozza(di)) {
          const n = Math.max(0, Math.min(99999, Math.floor(Number(quante) || 0)));
          if (!n || !fuori[app]) continue;
          fuori[app][durata] = (fuori[app][durata] || 0) + n;
        }
        return fuori;
      }

      function leRigheDelPacchetto(di) {
        const righe = laBozza(di);
        const opzioni = (tutte, scelta) =>
          tutte
            .map(
              ([valore, parola]) =>
                `<option value="${testo(valore)}"${valore === scelta ? " selected" : ""}>${testo(parola)}</option>`,
            )
            .join("");
        return `
          <div class="righe-pacchetto" data-bozza="${testo(di)}">
            ${
              righe.length
                ? righe
                    .map((riga, i) => {
                      /* Una durata detta dall'API e non fra quelle solite si vede lo stesso. */
                      const durate = LE_DURATE_DEL_PACCHETTO.some(
                        ([valore]) => valore === riga.durata,
                      )
                        ? LE_DURATE_DEL_PACCHETTO
                        : [...LE_DURATE_DEL_PACCHETTO, [riga.durata, laDurata(riga.durata)]];
                      return `
                <div class="riga-pacchetto" data-riga="${Number(i)}">
                  <select data-campo="app" aria-label="App">${
                    /* già HTML */ opzioni(
                      LE_APP.map((app) => [app, app]),
                      riga.app,
                    )
                  }</select>
                  <select data-campo="durata" aria-label="Durata">${/* già HTML */ opzioni(durate, riga.durata)}</select>
                  <input type="number" data-campo="quante" min="0" max="99999" value="${Number(riga.quante) || 0}" aria-label="Quante" />
                  <button type="button" class="tasto togli-riga" data-togli-riga="${Number(i)}" aria-label="Togli la riga" title="Togli la riga">✕</button>
                </div>`;
                    })
                    .join("")
                : `<p class="vuoto-pacchetto">Nessuna licenza nel pacchetto.</p>`
            }
            <button type="button" class="tasto aggiungi-riga" data-aggiungi-riga>Un'altra riga</button>
          </div>`;
      }

      /* Le righe si cambiano senza ridisegnare la pagina: solo il loro pezzo. */
      function ridisegnaLeRighe(di) {
        const dentro = [...dove.querySelectorAll("[data-bozza]")].find(
          (uno) => uno.dataset.bozza === di,
        );
        if (dentro) dentro.outerHTML = leRigheDelPacchetto(di);
      }

      function agganciaLeRighe() {
        const laRiga = (evento) => {
          const riquadro = evento.target.closest("[data-bozza]");
          if (!riquadro) return null;
          const di = riquadro.dataset.bozza;
          const riga = evento.target.closest("[data-riga]");
          return { di, righe: laBozza(di), i: riga ? Number(riga.dataset.riga) : -1 };
        };
        const cambia = (evento) => {
          const chi = laRiga(evento);
          const campo = evento.target.dataset?.campo;
          if (!chi || chi.i < 0 || !campo || !chi.righe[chi.i]) return;
          chi.righe[chi.i][campo] =
            campo === "quante" ? evento.target.value : String(evento.target.value);
        };
        dove.addEventListener("input", cambia);
        dove.addEventListener("change", cambia);
        dove.addEventListener("click", (evento) => {
          const chi = laRiga(evento);
          if (!chi) return;
          if (evento.target.closest("[data-aggiungi-riga]")) {
            const ultima = chi.righe.at(-1);
            chi.righe.push(ultima ? { ...ultima, quante: 0 } : unaRigaNuova());
            ridisegnaLeRighe(chi.di);
            const tutte = [...dove.querySelectorAll("[data-bozza]")].find(
              (uno) => uno.dataset.bozza === chi.di,
            );
            tutte?.querySelector(".riga-pacchetto:last-of-type [data-campo='quante']")?.focus();
            return;
          }
          const togli = evento.target.closest("[data-togli-riga]");
          if (togli) {
            chi.righe.splice(Number(togli.dataset.togliRiga), 1);
            ridisegnaLeRighe(chi.di);
          }
        });
      }

      /* ─── Gli abbonamenti ───────────────────────────────────────────
       *
       * gdahome Premium comprato nell'app, su App Store e su Google Play: i
       * conti li fa il quadro (`licenze.js`, «Gli abbonamenti»), qui si
       * scrivono. Gli importi sono quelli che pagano i clienti, IVA compresa:
       * quello che arriva davvero, tolte le commissioni e le tasse, lo dicono
       * App Store Connect e la Play Console, e qui lo si dice. */

      /* «4 ott», o «2 set 2027» se non e' quest'anno. */
      const ilGiornoCorto = (quando) => {
        const data = new Date(quando);
        return data.toLocaleDateString("it-IT", {
          day: "numeric",
          month: "short",
          ...(data.getFullYear() === new Date().getFullYear() ? {} : { year: "numeric" }),
        });
      };

      /* «il 4 ott», ma «l'8 ott»: davanti a 1, 8 e 11 l'articolo si elide, e
       * con lui la preposizione (al/all', dal/dall'). */
      function conLArticolo(preposizione, quando) {
        const giorno = new Date(quando).getDate();
        const elisa = giorno === 1 || giorno === 8 || giorno === 11;
        const [piena, apostrofo] = {
          il: ["il ", "l'"],
          al: ["al ", "all'"],
          dal: ["dal ", "dall'"],
        }[preposizione];
        return `${elisa ? apostrofo : piena}${ilGiornoCorto(quando)}`;
      }

      /* «4,99 €»: i soldi come si scrivono in Italia, nella valuta del negozio. */
      function iSoldi(valore, valuta, cifre = 2) {
        try {
          return new Intl.NumberFormat("it-IT", {
            style: "currency",
            currency: valuta || "EUR",
            minimumFractionDigits: cifre,
            maximumFractionDigits: cifre,
          }).format(valore);
        } catch (_valutaStrana) {
          return `${numero(valore)} ${valuta}`;
        }
      }

      /* Quanto pagano al mese, valuta per valuta: «≈ 81 €», o «—». */
      function alMeseDetto(alMese) {
        const voci = Object.entries(alMese || {}).filter(([, valore]) => valore > 0);
        if (!voci.length) return "—";
        return `≈ ${voci
          .map(([valuta, valore]) => iSoldi(valore, valuta, valore >= 100 ? 0 : 2))
          .join(" + ")}`;
      }

      const PASTIGLIA_DELLO_STATO = {
        prova: ["lavoro", "in prova"],
        attivo: ["bene", "attivo"],
        disdetto: ["attenta", "disdetto"],
        scaduto: ["offline", "scaduto"],
      };

      /* Cosa succede dopo, in una frase: si rinnova, finisce, e' finito. */
      function laFraseDellAbbonamento(uno) {
        const fine = (preposizione) => conLArticolo(preposizione, uno.pagato);
        if (uno.stato === "prova") return `In prova fino ${fine("al")}, poi si rinnova`;
        if (uno.stato === "disdetto")
          return uno.prova
            ? `In prova fino ${fine("al")}, poi finisce`
            : `Disdetto: finisce ${fine("il")}`;
        if (uno.stato === "scaduto")
          return uno.finito === "acquisto-rimborsato" ? "Rimborsato" : `Scaduto ${fine("il")}`;
        return uno.pagato >= Date.now()
          ? `Si rinnova ${fine("il")}`
          : `Rinnovo atteso ${fine("dal")}`;
      }

      /* I filtri dell'elenco degli abbonamenti: lo stato del negozio, e a
       * parte gli acquisti di prova, che hanno lo stato vero ma non contano. */
      const I_FILTRI_DEGLI_ABBONAMENTI = [
        ["tutti", "Tutti", () => true],
        ["attivo", "Si rinnovano", (uno) => !uno.sandbox && uno.stato === "attivo"],
        ["prova", "In prova", (uno) => !uno.sandbox && uno.stato === "prova"],
        ["disdetto", "Disdetti", (uno) => !uno.sandbox && uno.stato === "disdetto"],
        ["scaduto", "Scaduti", (uno) => !uno.sandbox && uno.stato === "scaduto"],
        ["sandbox", "Di prova", (uno) => uno.sandbox],
      ];

      function gliAbbonamenti() {
        const A = ABBONAMENTI;
        const testa = `
          <div class="capo-sezione">
            <div>
              <h2>Abbonamenti</h2>
              <p>gdahome Premium comprato nell'app, su App Store e su Google Play. Il quadro li richiede al negozio una volta al giorno: chi disdice si vede il giorno dopo. I regali stanno in «Regali e codici».</p>
            </div>
          </div>`;
        if (!A)
          return `${/* già HTML */ testa}
            <section class="scheda">
              <div class="vuoto"><b>Gli abbonamenti non sono arrivati</b> Riprova fra poco, o premi «Aggiorna».</div>
            </section>`;

        const conto = (tinta, disegno, valore, nome) =>
          `<div class="servizio-conto ${testo(tinta)}">
             <span class="servizio-conto-ic" aria-hidden="true">${LE_ICONE[disegno]}</span>
             <b>${testo(valore)}</b><span>${testo(nome)}</span>
           </div>`;
        const tutti = A.conti || {};
        const prove = tutti.prove || { finite: 0, pagate: 0 };
        const iNegozi = [
          ["ios", "App Store"],
          ["android", "Google Play"],
        ];
        const negozio = ([chiave, nome]) => {
          const suoi = A.negozi?.[chiave] || {};
          const alMese = alMeseDetto(suoi.alMese);
          return `
          <div class="servizio-blocco">
            <div class="servizio-capo">
              <span class="servizio-ic" aria-hidden="true">${LE_ICONE["telefono"]}</span>
              <div class="servizio-chi">
                <b>${testo(nome)}</b>
                <span>${testo(plurale(suoi.attivi || 0, "abbonamento attivo", "abbonamenti attivi"))}${alMese === "—" ? "" : ` · ${testo(alMese)} al mese`}</span>
              </div>
              <span class="pastiglia ${suoi.rinnovi7 ? "posto" : ""}">${
                suoi.rinnovi7
                  ? `${testo(plurale(suoi.rinnovi7, "rinnovo", "rinnovi"))} in 7 giorni`
                  : "nessun rinnovo in 7 giorni"
              }</span>
            </div>
            <div class="servizio-conti">
              ${/* già HTML */ conto("blu", "abbonamenti", suoi.mensili || 0, "mensili")}
              ${/* già HTML */ conto("verde", "abbonamenti", suoi.annuali || 0, "annuali")}
              ${/* già HTML */ conto("ambra", "licenze", suoi.prova || 0, "di cui in prova gratuita")}
              ${/* già HTML */ conto("ambra", "abbonamenti", suoi.disdetti || 0, "di cui disdetti: finiscono a scadenza")}
            </div>
          </div>`;
        };

        const riga = (uno) => {
          const diUnaCasa = String(uno.sog || "").startsWith("casa_");
          const nome = diUnaCasa
            ? CONTI.nomi.get(uno.sog) || `Casa senza nome · ${String(uno.sog).slice(5, 13)}`
            : `Telefono · ${String(uno.sog || "").slice(4, 12)}`;
          const dove =
            uno.piattaforma === "ios"
              ? uno.sandbox
                ? "App Store (TestFlight)"
                : "App Store"
              : uno.sandbox
                ? "Google Play (tester)"
                : "Google Play";
          const piano = `${
            uno.piano === "mensile"
              ? "Mensile"
              : uno.piano === "annuale"
                ? "Annuale"
                : uno.piano || "Piano non detto"
          }${uno.prezzo ? ` ${iSoldi(uno.prezzo, uno.valuta)}` : ""}`;
          const [tinta, parola] = uno.sandbox
            ? ["", "di prova"]
            : PASTIGLIA_DELLO_STATO[uno.stato] || ["", uno.stato];
          const pezzi = [
            `${uno.app === "gdanav" ? "gdanav · " : ""}${dove}`,
            piano,
            ...(uno.inizio ? [conLArticolo("dal", uno.inizio)] : []),
            ...(uno.pagato ? [laFraseDellAbbonamento(uno)] : []),
            ...(uno.sandbox ? ["non entra nei conti"] : []),
          ];
          const di = CONTI.tutte.find((una) => una.matricola === uno.sog)?.chi || "";
          return `
          <li${diUnaCasa ? ` data-apri-casa="${testo(uno.sog)}" data-di="${testo(di)}" role="button" tabindex="0"` : ' class="ferma"'}>
            <span class="tondino">${LE_ICONE["telefono"]}</span>
            <span class="riga-testo">
              <b>${testo(nome)}</b>
              <span>${pezzi.map(testo).join(" · ")}</span>
            </span>
            <span class="pastiglia ${testo(tinta)}">${testo(parola)}</span>
            ${diUnaCasa ? `<span class="freccina">${LE_ICONE["freccia"]}</span>` : ""}
          </li>`;
        };

        const elenco = A.elenco || [];
        const ilFiltro = I_FILTRI_DEGLI_ABBONAMENTI.find(([quale]) => quale === FILTRO_ABBONAMENTI)
          ? FILTRO_ABBONAMENTI
          : "tutti";
        const filtrati = elenco.filter(
          I_FILTRI_DEGLI_ABBONAMENTI.find(([quale]) => quale === ilFiltro)[2],
        );
        const lePastiglie = I_FILTRI_DEGLI_ABBONAMENTI.map(([quale, parola, filtro]) => {
          const quanti = elenco.filter(filtro).length;
          if (!quanti && quale !== "tutti" && quale !== ilFiltro) return "";
          return `<button type="button" class="chip" data-filtro-abbonamenti="${testo(quale)}" aria-pressed="${quale === ilFiltro}">${testo(parola)} <b>${Number(quanti)}</b></button>`;
        }).join("");

        const dalNegozio = iNegozi
          .map(([chiave, nome]) => {
            const detto = alMeseDetto(A.negozi?.[chiave]?.alMese);
            return detto === "—" ? "" : `${nome} ${detto}`;
          })
          .filter(Boolean)
          .join(" · ");
        const alMese = alMeseDetto(tutti.alMese);
        const numerone = (etichetta, valore, dettaglio, piccolo = "") => `
          <div class="numerone">
            <span class="etichetta">${testo(etichetta)}</span>
            <span class="valore">${testo(valore)}${piccolo ? `<small> ${testo(piccolo)}</small>` : ""}</span>
            <span class="dettaglio">${testo(dettaglio)}</span>
          </div>`;

        return `${/* già HTML */ testa}
          ${
            A.accese
              ? ""
              : `<div class="avvertenza" style="margin: 0 0 14px">
                   <span class="gettone" aria-hidden="true">!</span>
                   <span><b>Le licenze sono spente.</b> Senza la chiave delle licenze nessuno può comprare Premium: vedi «Regali e codici».</span>

          }

          <div class="griglia griglia-4">
            ${/* già HTML */ numerone("Attivi", numero(tutti.attivi), `${plurale(Number(tutti.mensili) || 0, "mensile", "mensili")} · ${plurale(Number(tutti.annuali) || 0, "annuale", "annuali")}`)}
            ${/* già HTML */ numerone("In prova gratuita", numero(tutti.prova), prove.finite ? `${Number(prove.pagate)} ${Number(prove.pagate) === 1 ? "prova" : "prove"} su ${Number(prove.finite)} ${Number(prove.pagate) === 1 ? "è passata" : "sono passate"} a pagamento` : "nessuna prova ancora finita")}
            ${/* già HTML */ numerone("Disdetti", numero(tutti.disdetti), `finiscono alla scadenza · ${plurale(Number(tutti.finiti30) || 0, "finito", "finiti")} in 30 giorni`)}
            ${/* già HTML */ numerone("Incassi stimati", alMese, dalNegozio || "nessun abbonamento a pagamento", alMese === "—" ? "" : "/mese")}
          </div>

          <section class="scheda">
            <div class="filtri">${/* già HTML */ lePastiglie}</div>
            ${
              filtrati.length
                ? `<ul class="elenco si-tocca">${filtrati.map(riga).join("")}</ul>`
                : `<div class="vuoto"><b>${elenco.length ? "Nessun abbonamento con questo filtro" : "Ancora nessun abbonamento"}</b> ${elenco.length ? "Prova un altro filtro." : "Compaiono qui da soli quando qualcuno compra gdahome Premium nell'app."}</div>`
            }
            <details class="apri-riga">
              <summary>Tutti i conti, negozio per negozio<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
              <div class="servizio-blocco">
                <p class="servizio-titolo">In tutto</p>
                <div class="servizio-conti">
                  ${/* già HTML */ conto("verde", "abbonamenti", tutti.attivi, "abbonamenti attivi")}
                  ${/* già HTML */ conto("blu", "abbonamenti", tutti.mensili, "mensili")}
                  ${/* già HTML */ conto("blu", "abbonamenti", tutti.annuali, "annuali")}
                  ${/* già HTML */ conto("ambra", "licenze", tutti.prova, "di cui in prova gratuita")}
                  ${/* già HTML */ conto("ambra", "abbonamenti", tutti.disdetti, "di cui disdetti: finiscono a scadenza")}
                  ${/* già HTML */ conto("blu", "abbonamenti", tutti.finiti30, "finiti negli ultimi 30 giorni")}
                  ${/* già HTML */ conto("verde", "licenze", prove.finite ? `${Number(prove.pagate)} su ${Number(prove.finite)}` : "—", "prove finite che sono passate a pagamento")}
                  ${/* già HTML */ conto("verde", "abbonamenti", alMeseDetto(tutti.alMese), "al mese, quello che pagano i clienti")}
                </div>
              </div>
              ${iNegozi.map(negozio).join("")}
            </details>
          </section>

          <p class="minuta" style="margin: 14px 2px 0">
            Gli importi sono quelli che pagano i clienti, IVA compresa: Apple e Google trattengono la loro commissione e versano il resto. Il conto preciso, con le tasse di ogni paese, sta in App Store Connect e nella Play Console. Gli acquisti di prova (TestFlight e tester di Google) si vedono nell'elenco ma non entrano nei conti.
          </p>`;
      }

      /* Le case che il quadro conosce per nome: quelle degli installatori.
       * Una casa senza installatore non manda rapporti e qui non c'e': si
       * riconosce dalla matricola, che si incolla nella casella sotto. */
      function leCaseConosciute() {
        const tutte = [];
        for (const uno of INSTALLATORI) {
          for (const casa of LE_CASE_DI.get(uno.chi)?.case || []) {
            tutte.push({
              casa: String(casa.casa),
              nome: casa.senzaNome ? `Senza nome · ${String(casa.casa).slice(5, 13)}` : casa.nome,
              di: uno.nome || "un installatore",
            });
          }
        }
        return tutte;
      }

      /* Il nome di una casa dalla matricola, o "" se il quadro non la conosce. */
      function ilNomeDellaCasa(matricola) {
        return leCaseConosciute().find((una) => una.casa === matricola)?.nome || "";
      }

      function leCaseDaRegalare() {
        const righe = leCaseConosciute().map(
          (una) =>
            `<option value="${testo(una.casa)}">${testo(una.nome)} · ${testo(una.di)}</option>`,
        );
        return `<option value="">${righe.length ? "— scegli una casa —" : "— nessuna casa degli installatori —"}</option>${righe.join("")}`;
      }

      /* ─── Regali e codici ────────────────────────────────────────────── */

      function leLicenze() {
        const tutte = LICENZE.licenze || [];
        const regalate = tutte.filter((una) => una.origine !== "negozio");
        const valgono = regalate.filter((una) => una.vale);
        const finite = regalate.filter((una) => !una.vale && !una.revocata);
        const tolte = regalate.filter((una) => una.revocata).length;
        const codici = LICENZE.codici || [];
        const liberi = codici.filter((uno) => !uno.usatoDa && !uno.annullato);
        const usati = codici.filter((uno) => uno.usatoDa).slice(0, 20);
        const nomeDi = (chi) =>
          INSTALLATORI.find((uno) => uno.chi === chi)?.nome || "un installatore";
        const diChi = (sog) =>
          String(sog || "").startsWith("casa_")
            ? CONTI.nomi.get(sog) || `Casa senza nome · ${String(sog).slice(5, 13)}`

        const rigaDelRegalo = (una) => {

            una.origine === "installatore"

                : DA_DOVE[una.origine] || String(una.origine || "");
          const sotto = [
            IL_NOME_DELLA_APP[una.app] || una.app,
            una.codice ? `${da}, con un codice` : da,
            laScadenza(una),
            una.nota ? `«${una.nota}»` : "",
          ]
            .filter(Boolean)
            .join(" · ");
          return `
            <li data-spiega>
              <span class="tondino${una.vale ? "" : " grigio"}">${LE_ICONE["stella"]}</span>
              <span class="riga-testo"><b>${testo(diChi(una.sog))}</b><span>${testo(sotto)}</span></span>
              <span class="riga-fine">${
                una.vale
                  ? `<button type="button" class="tasto piccolo male" data-revoca="${testo(una.lic)}">Revoca</button>`
                  : '<span class="pastiglia">finita</span>'
              }</span>
              <p class="spiega" hidden></p>
            </li>`;
        };

        const rigaDelCodice = (uno) => `
          <li data-spiega>
            <span class="riga-testo">
              <b class="mono">${testo(uno.codice)}</b>
              <span>${testo(IL_NOME_DELLA_APP[uno.app] || uno.app)} · ${testo(quantiMesi(uno.mesi))}${uno.installatore ? ` · di ${testo(nomeDi(uno.installatore))}` : ""}${uno.nota ? ` · ${testo(uno.nota)}` : ""}</span>
            </span>
            <span class="riga-fine">
              <button type="button" class="tasto piccolo copia" data-copia="${testo(uno.codice)}">Copia</button>
              <button type="button" class="tasto piccolo male" data-annulla-codice="${testo(uno.codice)}">Annulla</button>
            </span>
            <p class="spiega" hidden></p>
          </li>`;

        const rigaUsata = (uno) => `
          <li>
            <span class="riga-testo">
              <b class="mono">${testo(uno.codice)}</b>
              <span>${testo(IL_NOME_DELLA_APP[uno.app] || uno.app)} · usato ${testo(daQuanto(uno.usatoIl))} da ${testo(diChi(uno.usatoDa))}</span>
            </span>
            <span class="pastiglia">usato</span>
          </li>`;

        return `
          <div class="capo-sezione">
            <div>
              <h2>Regali e codici</h2>
              <p>Premium regalato da te o dagli installatori. gdahome Premium è <b>della casa</b>: tutti i telefoni abbinati a quella casa sono Premium insieme. gdanav Premium da solo è <b>del telefono</b>, e si regala con un codice. Chi compra nell'app sta in «Abbonamenti».</p>
            </div>
          </div>

          ${
            LICENZE.accese
              ? ""
              : `<div class="avvertenza" style="margin: 0 0 14px">
                   <span class="gettone" aria-hidden="true">!</span>
                   <span>
                     <b>Le licenze sono spente.</b> Su questa macchina manca <span class="mono">QUADRO_LICENZE_CHIAVE</span>: puoi regalare licenze e generare codici, ma le case e i telefoni non ricevono niente finché la chiave non c'è. Si fa sulla macchina del quadro, da <span class="mono">/opt/quadro/quadro</span>, con <span class="mono">node le-licenze.mjs chiave</span>.
                   </span>
                 </div>`
          }

          ${
            CODICI_APPENA
              ? `<section class="chiave-nuova">
                   <b>${plurale(CODICI_APPENA.codici.length, "codice", "codici")} ${testo(IL_NOME_DELLA_APP[CODICI_APPENA.app] || "")} · ${testo(quantiMesi(CODICI_APPENA.mesi))}</b>
                   <p>Ognuno vale <b>una volta sola</b>: si riscatta dall'app gdahome (per la casa) o da gdanav (per il telefono), in «Ho un codice regalo». Restano anche nell'elenco qui sotto finché nessuno li usa.</p>
                   <div class="codici-fatti">
                     ${CODICI_APPENA.codici.map((uno) => `<div class="valore">${testo(uno)}</div>`).join("")}
                   </div>
                   <div class="azioni" style="margin-top: 10px">
                     <button type="button" class="tasto forte" data-copia="${testo(CODICI_APPENA.codici.join("\n"))}">Copia</button>
                     <button type="button" class="tasto" data-chiudi-codici>Chiudi</button>
                   </div>
                 </section>`
              : ""
          }

          <div class="griglia griglia-2">
            <section class="scheda" id="regala-qui">
              <h3><span class="tondino">${LE_ICONE["casa"]}</span>Regala Premium a una casa</h3>
              <p class="sotto">Arriva subito: la casa lo vede appena ricontrolla la licenza.</p>
              <div class="campo">
                <label for="regalo-scelta">Casa</label>
                <select id="regalo-scelta">${/* già HTML */ leCaseDaRegalare()}</select>
              </div>
              <div class="campo">
                <label for="regalo-casa">Oppure la matricola di un'altra casa</label>
                <input type="text" id="regalo-casa" maxlength="37" placeholder="casa_0123… (la trova nella console dell'add-on, alla voce Licenza)" autocomplete="off" spellcheck="false" />
              </div>
              <div class="due-campi pari">
                <div class="campo">
                  <label for="regalo-app">App</label>
                  <select id="regalo-app">
                    <option value="gdahome">gdahome Premium</option>
                    <option value="gdanav">gdanav Premium</option>
                  </select>
                </div>
                <div class="campo">
                  <label for="regalo-durata">Durata</label>
                  <select id="regalo-durata">${/* già HTML */ leDurate("12")}</select>
                </div>
              </div>
              <div class="campo">
                <label for="regalo-nota">Nota (facoltativa)</label>
                <input type="text" id="regalo-nota" maxlength="200" placeholder="Perché la regali" autocomplete="off" />
              </div>
              <div class="azioni">
                <button type="button" class="tasto forte" data-regala>${LE_ICONE["regalo"]}Regala</button>
              </div>
            </section>

            <section class="scheda">
              <h3><span class="tondino">${LE_ICONE["regalo"]}</span>Crea codici regalo</h3>
              <p class="sotto">Un codice <span class="mono">GDA-XXXX-XXXX-XXXX</span> per ogni persona: la durata parte da quando lo usa.</p>
              <div class="due-campi pari">
                <div class="campo">
                  <label for="codici-app">Per</label>
                  <select id="codici-app">
                    <option value="gdahome">gdahome Premium</option>
                    <option value="gdanav">gdanav Premium</option>
                  </select>
                </div>
                <div class="campo">
                  <label for="codici-durata">Durata</label>
                  <select id="codici-durata">${/* già HTML */ leDurate("12")}</select>
                </div>
              </div>
              <div class="due-campi pari">
                <div class="campo">
                  <label for="codici-quanti">Quanti</label>
                  <input type="number" id="codici-quanti" min="1" max="200" value="1" />
                </div>
                <div class="campo">
                  <label for="codici-nota">Nota (facoltativa)</label>
                  <input type="text" id="codici-nota" maxlength="200" placeholder="Per chi sono" autocomplete="off" />
                </div>
              </div>
              <div class="azioni">
                <button type="button" class="tasto forte" data-genera-codici>${LE_ICONE["aggiungi"]}Crea</button>
              </div>
            </section>

            <section class="scheda">
              <h3>Codici da usare<span class="conta">${Number(liberi.length)}</span></h3>
              ${
                liberi.length
                  ? `<ul class="elenco">${liberi.map(rigaDelCodice).join("")}</ul>`
                  : `<p class="sotto">Nessun codice da usare: creane uno qui accanto.</p>`
              }
              ${
                usati.length
                  ? `<details class="apri-riga">
                       <summary>Già usati · ${Number(usati.length)}<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
                       <ul class="elenco">${usati.map(rigaUsata).join("")}</ul>
                     </details>`
                  : ""
              }
            </section>

            <section class="scheda">
              <h3>Premium regalato<span class="conta">${Number(valgono.length)}${tolte ? ` · ${Number(tolte)} ${tolte === 1 ? "revocato" : "revocati"}` : ""}</span></h3>
              ${
                valgono.length
                  ? `<ul class="elenco">${valgono.map(rigaDelRegalo).join("")}</ul>`
                  : `<p class="sotto">Nessun regalo attivo. Quelli che fai tu, o che fanno i tuoi installatori, compaiono qui.</p>`
              }
              ${
                finite.length
                  ? `<details class="apri-riga">
                       <summary>Finiti · ${Number(finite.length)}<span class="freccina">${LE_ICONE["freccia"]}</span></summary>
                       <ul class="elenco">${finite.map(rigaDelRegalo).join("")}</ul>
                     </details>`
                  : ""
              }
            </section>
          </div>`;
