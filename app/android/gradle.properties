# Le macchine delle prove su GitHub hanno 7 GB in tutto. Con 8 GB al demone
# di Gradle, 4 di metaspace e un secondo demone di Kotlin grande uguale, la
# macchina finiva la memoria a meta' pacchetto e spariva senza lasciare
# registro (le prove «L'app per Android, costruita» rosse a caso). 4 GB a
# Gradle e Kotlin dentro lo stesso processo stanno larghi anche con R8.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
