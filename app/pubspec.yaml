name: gdahome
description: "L'app di casa: la plancia, e i comandi che in Home Assistant stanno nascosti."
publish_to: "none"
# La versione, la stessa della plancia e dell'add-on.
#
# Un numero solo per tutto il prodotto: chi manda una segnalazione scrive
# «1.4.24» e non tre numeri da mettere insieme, e chi risponde sa cosa sta
# guardando senza chiedere. La plancia dentro l'add-on la sua versione la porta
# da se' (`ORIGINE.json`), e resta visibile a parte: quella la decide la
# dashboard, questa la decidiamo noi.
#
# Il numero dopo il `+` e' quello che chiedono i negozi, e deve **crescere
# sempre**. Si ricava dalla versione invece di batterlo a mano:
# 1.4.24 → 1 × 10000 + 4 × 100 + 24 = 10424. Finche' il minore e la patch
# stanno sotto cento, cresce insieme alla versione e non si sbaglia.
version: 1.6.6+1060600

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Le parole che disegna Flutter e non noi: il menu «Incolla» che compare
  # tenendo premuto su una casella, i selettori dell'ora e della data, i nomi
  # che legge un lettore di schermo. Senza questo pacchetto quei pezzi escono
  # **in inglese** anche su un telefono italiano — e sono le prime cose che si
  # notano. Le nostre frasi invece stanno in `parole.dart`.
  flutter_localizations:
    sdk: flutter

  # Il filo con il ponte. `web_socket_channel` invece del WebSocket di
  # `dart:io` perche' si fa sostituire nelle prove senza toccare il codice che
  # lo usa.
  web_socket_channel: ^3.0.0

  # L'abbinamento, che e' una POST sola.
  http: ^1.2.0

  # Il segno del ponte va nel portachiavi del sistema — Keychain sull'iPhone,
  # Keystore su Android — non in un file di preferenze, che su Android si legge
  # da fuori con un telefono sbloccato.
  flutter_secure_storage: ^9.2.0

  # La plancia che gia' esiste, dentro l'app.
  webview_flutter: ^4.10.0

  # Foto e video da allegare a una segnalazione: la galleria, la fotocamera.
  # Sono del sistema — il selettore delle foto di Android e di iOS — e per
  # una foto chiede gia' ridotta, cosi' ne parte qualche centinaio di
  # chilobyte e non dieci megabyte.
  image_picker: ^1.1.2

  # Il selettore dei file, per le caselle `<input type="file">` che non
  # chiedono una foto: il ripristino di un backup vuole un `.json`, e la
  # galleria delle foto non ne ha. E' del gruppo di Flutter, come
  # `image_picker`, e su Android passa dallo Storage Access Framework: si
  # apre l'archivio del telefono, non le immagini.
  file_selector: ^1.0.0

  # I collegamenti che portano fuori: la plancia ne ha qualcuno — il tasto
  # delle donazioni, il meteo di Windy, la mappa — e dentro il riquadro non
  # c'e' nessun posto dove aprirli. Si aprono nel browser del telefono, che e'
  # dove li aprirebbe la plancia in Home Assistant.
  url_launcher: ^6.3.1

  # La cifratura fra l'app e il ponte: X25519, HKDF, AES-256-GCM.
  #
  # Non si scrive a mano. Dall'altra parte le stesse tre cose vengono da
  # `node:crypto`, e le due implementazioni devono coincidere byte per byte:
  # per questo ci sono vettori di prova generati dal Node e ricontrollati qui.
  cryptography: ^2.7.0

  # Il lettore del QR code.
  #
  # Il QR code **si disegna** senza dipendenze — quello lo fa il ponte, in
  # `ponte/src/qr.js` — ma leggerlo e' un altro mestiere: vuole la fotocamera,
  # la messa a fuoco, la luce che cambia, e sotto ci stanno MLKit e Vision, che
  # sono del sistema. Scriverne uno a mano vorrebbe dire un lettore peggiore di
  # quello che ogni telefono ha gia' dentro.
  mobile_scanner: ^7.4.2

  # Il volto e l'impronta davanti all'app (#54).
  #
  # Non e' una libreria che «legge» un'impronta: e' il ponte verso la guardia
  # che il telefono ha gia' — BiometricPrompt su Android, LocalAuthentication
  # su iOS — e da quella torna un si' o un no. Il volto e l'impronta restano
  # nel coprocessore del telefono: non passano di qui, non passano dall'app, e
  # non arrivano ne' a gdahome ne' alla casa.
  local_auth: ^2.3.0
  flutter_svg: ^2.3.0
  webview_flutter_web: ^0.2.3+4
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  path_provider: ^2.1.6

  # Il documento e il browser, per la versione web: il service worker che
  # serve la plancia, e i messaggi fra l'app e il riquadro. Sul telefono
  # questo pacchetto non entra in gioco.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Il marchio: la stessa immagine che fa da icona dell'app. Ce n'e' una
    # sola, e sta in un posto solo.
    - assets/marchio/gda.png
    # Gli oggetti delle sezioni: gli stessi disegni della plancia, uno per
    # sezione. Non sono simboli a contorno ne' emoji di sistema — sono i
    # disegni di DashboardModern, presi da li' e non rifatti a somiglianza,
    # perche' «a somiglianza» vuol dire un'altra app.
    - assets/oggetti/

  # I caratteri sono quelli della plancia, e non per pigrizia: chi passa dal
  # telefono alla dashboard non deve avere l'impressione di due prodotti.
  #  - **Inter** per tutto quello che si legge. Licenza SIL OFL,
  #    in `OFL-Inter.txt`.
  #  - **Oswald** per i numeri grandi e i titoli: stretto, in maiuscolo, e'
  #    quello che sulla plancia dice i gradi e i kilowatt. Licenza SIL OFL,
  #    in `OFL-Oswald.txt`.
  # Incorporati nel pacchetto invece che scaricati: uguali su ogni telefono,
  # e senza dipendere da nessuna rete al primo avvio.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/carattere/Inter-400.ttf
          weight: 400
        - asset: assets/carattere/Inter-500.ttf
          weight: 500
        - asset: assets/carattere/Inter-600.ttf
          weight: 600
        - asset: assets/carattere/Inter-700.ttf
          weight: 700
        - asset: assets/carattere/Inter-800.ttf
          weight: 800
        - asset: assets/carattere/Inter-900.ttf
          weight: 900
    - family: Oswald
      fonts:
        - asset: assets/carattere/Oswald-200.ttf
          weight: 200
        - asset: assets/carattere/Oswald-400.ttf
          weight: 400
        - asset: assets/carattere/Oswald-700.ttf
          weight: 700
