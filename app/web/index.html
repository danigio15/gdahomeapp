<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <!-- Da dove pende tutto il resto, deciso qui e non alla costruzione.

         Flutter ci scriverebbe un indirizzo fisso — «/» — e sarebbe giusto
         solo per chi apre l'app dalla radice di un sito. Questa app la serve
         anche il ponte, sotto l'ingress di Home Assistant, dove davanti c'e'
         un prefisso che cambia a ogni riavvio: `/api/hassio_ingress/<gettone>/app/`.
         Un indirizzo fisso li' vuol dire una pagina bianca e nessun file
         trovato.

         La cartella della pagina che si sta guardando, invece, e' giusta
         sempre — sotto l'ingress, sul centralino, e in prova su localhost. E
         va messa **prima di tutto il resto**: dopo il primo indirizzo
         relativo sarebbe tardi. -->
    <script>
      (function () {
        var base = document.createElement("base");
        base.href = location.pathname.replace(/[^/]*$/, "");
        document.head.appendChild(base);
      })();
    </script>

    <!-- Le regole della pagina, quelle che si possono scrivere qui.

         Poche, e scelte perche' non rompano niente: niente plugin
         (`object-src`), nessun `<base>` che porti altrove (`base-uri`: quello
         qui sopra punta alla nostra cartella), nessun modulo che spedisca
         altrove (`form-action`). Una regola piu' stretta sugli script
         chiederebbe di elencare cosa serve a Flutter e a CanvasKit — e dove
         l'app e' servita: sotto l'ingress, sul centralino, sul sito — e
         sbagliarla vuol dire una pagina bianca; si mette dove l'app si serve,
         come intestazione, insieme a quelle che qui non si possono scrivere
         (`frame-ancestors`, `Cross-Origin-Opener-Policy`).

         E l'indirizzo di questa pagina non esce: sotto l'ingress di Home
         Assistant dentro c'e' un gettone, e un collegamento aperto da qui
         non lo deve ricevere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="same-origin" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="L'app di casa: la plancia, e i comandi che in Home Assistant stanno nascosti." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="gdahome" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>gdahome</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      /* Il colore del guscio prima che Flutter dipinga: senza, per un istante
         si vede il bianco anche a chi ha il telefono in tema scuro. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #101418;
        }
      }
    </style>
  </head>
  <body>
    <!-- Come si accende sta in `web/flutter_bootstrap.js`. -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
