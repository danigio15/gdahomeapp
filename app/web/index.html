<!DOCTYPE html>
<html lang="it">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="L'app di casa: la plancia, e i comandi che in Home Assistant stanno nascosti." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Casa" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Casa</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      /* Il colore del guscio prima che Flutter dipinga: senza, per un istante

      body {
        margin: 0;
        padding: 0;
        background: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #101418;
        }
      }
    </style>
  </head>
  <body>
    <!-- Come si accende sta in `web/flutter_bootstrap.js`. -->
