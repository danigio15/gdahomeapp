<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Copertine Facebook di gdahome. Si rifanno con strumenti di Playwright:
     la pagina legge ?w=&h= e mette scritte e dispositivi nelle due misure. -->
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../sito/statico/font/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../sito/statico/font/inter-latin-700-normal.woff2)}
@font-face{font-family:Oswald;font-weight:500;src:url(../sito/statico/font/oswald-latin-500-normal.woff2)}
:root{--ambra:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:#0b1224}
body{font-family:Inter,sans-serif;color:#fff;position:relative}
.fondo{position:absolute;inset:0;background:
  radial-gradient(ellipse 50% 70% at 8% 40%,rgba(37,99,235,.55),transparent 70%),
  radial-gradient(ellipse 45% 70% at 94% 40%,rgba(245,158,11,.38),transparent 70%),
  radial-gradient(ellipse 45% 40% at 50% 100%,rgba(56,189,248,.22),transparent 70%),
  linear-gradient(180deg,#0f172a,#0b1224)}
.griglia{position:absolute;inset:0;opacity:.06;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse 60% 60% at 50% 40%,#000,transparent)}
.testo{position:absolute;left:0;right:0;text-align:center}
.marchi{display:flex;align-items:center;justify-content:center;gap:calc(var(--icona)*.28)}
.marchi img{width:var(--icona);height:var(--icona);border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.marchi img.nav{border-radius:18%}
.marchi span{font-family:Oswald;font-weight:500;font-size:calc(var(--icona)*.62)}
.marchi .piu{color:rgba(255,255,255,.4);font-size:calc(var(--icona)*.45)}
h1{font-family:Oswald;font-weight:500;font-size:var(--titolo);line-height:1.05;margin-top:calc(var(--titolo)*.22)}
h1 em{font-style:normal;color:var(--ambra)}
.sotto{margin-top:calc(var(--testo)*.5);font-size:var(--testo);color:rgba(226,232,240,.88)}
.sotto b{color:#fff}
.presto{display:inline-flex;align-items:center;gap:14px;margin-top:calc(var(--testo)*.8);padding:9px 24px 9px 10px;
  border-radius:999px;background:rgba(245,158,11,.14);border:2px solid rgba(245,158,11,.7);font-size:var(--testo)}
.presto b{background:var(--ambra);color:#1a1205;font-size:.78em;letter-spacing:.12em;padding:6px 13px;border-radius:999px;text-transform:uppercase}
.presto span{font-weight:700}
.presto i{font-style:normal;color:rgba(255,255,255,.65);font-weight:700;margin-left:6px}
.dev{position:absolute;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 30px 70px rgba(0,0,0,.6);overflow:hidden;background:#1e293b}
.dev img{display:block;width:100%}
.tablet{border-radius:26px;padding:14px}
.tablet img{border-radius:12px}
.tel{border-radius:30px;padding:8px}
.tel img{border-radius:23px}
.aw{border-radius:32%/26%;padding:12px;background:#111}
.aw img{border-radius:24%/19%}
.wo{border-radius:50%;padding:10px;background:#111}
.wo img{border-radius:50%}
.etichetta{position:absolute;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.75);background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.18);
  padding:6px 12px;border-radius:999px;white-space:nowrap;transform:translateX(-50%)}
</style></head>
<body>
<div class="fondo"></div><div class="griglia"></div>
<div class="dev aw" id="aw"><img src="apple-watch.png"></div>
<div class="dev tel" id="t1"><img src="../sito/statico/schermate/3-le-luci.png"></div>
<div class="dev tel" id="t2"><img src="../sito/statico/gdanav/guida-svincolo.jpg"></div>
<div class="dev wo" id="wo"><img src="wear-os.png"></div>
<div class="dev tablet" id="tab"><img src="muro.png"></div>
<div class="etichetta" id="e-tab">Plancia a muro</div>
<div class="etichetta" id="e-aw">Apple Watch</div>
<div class="etichetta" id="e-wo">Wear OS</div>
<div class="testo" id="testo">
  <div class="marchi"><img src="../sito/statico/marchio.png"><span>gdahome</span><span class="piu">+</span><img class="nav" src="gdanav-icona.png"><span>gdanav</span></div>
  <h1>La tua casa in una plancia. <em>Anche fuori casa.</em></h1>
  <p class="sotto">Home Assistant sul <b>telefono</b>, sul <b>tablet a muro</b>, sull'<b>orologio</b> e <b>in auto</b>.</p>
  <div class="presto"><b>Presto</b><span>Le app arrivano su Google Play e App Store</span><i>· gdahome.org</i></div>
</div>
</body></html>
